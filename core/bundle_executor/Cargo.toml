[package]
name = "bundle-executor"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.0"
license = "Apache-2.0"
publish = false
description = "Waddles credential-less WASM bundle sandbox host (M2). Holds a wasmtime engine, instantiates a bundle's WASI 0.2 component against the normative waddle:bundle/stage@1.0.0 world, services every WIT host import over the host-API wire protocol back to its stage, and natively denies wasi:sockets -- see docs/superpowers/specs/2026-09-14-rust-data-plane-design.md SS4.5/SS7."

[lib]
name = "bundle_executor"
path = "src/lib.rs"

[[bin]]
name = "bundle-executor"
path = "src/main.rs"

# Exact-version pins only (no ^ / * ranges) -- rules/critical-rules.md
# Dependency Pinning. Cargo.lock is committed alongside this file.
#
# THE penguin-libs DEPENDENCY PATTERN established in core/svc_process's
# Cargo.toml (M4) applies verbatim here: `rev = "<full 40-char sha>"`, never
# a branch name, plus `version =` alongside `git =`/`rev =` so cargo-deny's
# `[bans] wildcards = "deny"` doesn't flag it. See that file's header
# comment for the full rationale (why not a `path =`/`branch =` dependency).
#
# This dependency set is itself a security assertion (spec SS4.5/SS14.6
# test 16): NO redis, sea-orm, sqlx, deadpool-redis or reqwest anywhere in
# this binary's dependency graph -- `tests/dependency_policy.rs` asserts it
# by parsing the committed Cargo.lock and reports the number of packages
# examined (never a bare "clean").
[dependencies]
# wasmtime: component model + WASI 0.2 host, epoch interruption, pooling
# allocator, `-C collector=drc` (spec SS7.2 -- must match componentize-py's
# GC collector or a precompiled artifact fails to load).
wasmtime = { version = "=49.0.2", default-features = false, features = ["component-model", "async", "runtime", "cranelift", "gc", "gc-drc", "pooling-allocator"] }
# wasmtime-wasi: the permitted-for-Rust-components WASI surface (wasi:cli
# with empty args/env, wasi:filesystem single read-only /scratch preopen,
# wasi:random/random, wasi:clocks, wasi:io -- spec SS6.5's per-language
# allowlist table) AND the wasi:sockets denial mechanism (assumption A19):
# `WasiCtxBuilder::allow_tcp(false)`/`allow_udp(false)`/
# `allow_ip_name_lookup(false)` makes the REAL, upstream-tested
# `wasi:sockets` Host implementation refuse every socket op with
# `error-code::access-denied` before any OS syscall -- native to this
# binary, not a hand-authored stub component (round 2 of the compiler-
# sandbox spike found those impractical). See `src/host/mod.rs`.
wasmtime-wasi = { version = "=49.0.2", default-features = false, features = ["p2"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "signal"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["tls12"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "tls12"] }
# `rustls-pemfile` is RUSTSEC-2025-0134 (unmaintained, archived) -- PEM
# parsing goes straight through `rustls-pki-types`'s own `PemObject` trait
# instead (the crate the old wrapper delegated to anyway).
rustls-pki-types = "=1.15.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
thiserror = "=2.0.20"
clap = { version = "=4.6.6", features = ["derive", "env"] }
sha2 = "=0.10.9"
# `hmac`: AWS SigV4 request signing for `crate::bucket`'s bundle-bucket GET
# (spec SS7.6/SS12.7's `BUNDLE_BUCKET_*`). Deliberately NOT `object_store`
# (the crate `core/svc_streaming` uses for its own S3-compatible uploads):
# `object_store`'s `aws`/`http`/`azure`/`gcp` features all hard-require
# `reqwest` (verified against its published `Cargo.toml` feature table),
# which `tests/dependency_policy.rs`/`deny.toml` ban outright for this
# specific binary (SS4.5/SS14.6 test 16: "no free-form HTTP client").
# `hmac` (RustCrypto, MIT/Apache-2.0, same family as the already-pinned
# `sha2`) carries no networking or HTTP dependency at all -- pairs with
# `sha2 = "=0.10.9"` via `digest = "0.10.x"` (hmac 0.12.1 requires
# `digest = "0.10.3"`, satisfied by the same `digest` resolution sha2
# already pulls in). `crate::bucket` hand-rolls the minimal HTTP/1.1 GET
# over the `tokio`/`rustls`/`tokio-rustls` already pinned below, keeping
# this binary's only two egress paths (host-API port, bucket GET) on a
# purpose-built client rather than a general-purpose one.
hmac = "=0.12.1"
# `penguin-bundle-host::wire` -- the length-prefixed frame codec, Frame/
# Message shapes and correlation-id table shared verbatim with the stage
# side (spec SS6.6). Pinned to the HEAD of `release/rust-bundle-host/v0.1.x`
# at the time of this commit (PR penguintechinc/penguin-libs#93).
penguin-bundle-host = { git = "https://github.com/penguintechinc/penguin-libs.git", rev = "69f25b007e397bcf22c20bee368495f61f0a1b8a", package = "penguin-bundle-host", version = "=0.2.0" }
tracing = "=0.1.44"
# `penguin-logging` (spec SS4.5's dependency list) is deliberately NOT
# depended on here, unlike every other Rust data-plane service in this
# repo. Verified empirically (`cargo tree -i reqwest` against this
# crate's own Cargo.lock while `penguin-logging` was still a dependency):
# `penguin-logging` -> `opentelemetry-otlp` (features = ["grpc-tonic"],
# no `default-features = false`) -> Cargo feature unification keeps
# `opentelemetry-otlp`'s OWN default features (`http-proto`,
# `reqwest-blocking-client`) enabled ALONGSIDE `grpc-tonic` -> pulls in
# `opentelemetry-http` -> `reqwest`. That is precisely the crate spec
# SS4.5/SS14.6 test 16 bans from this specific binary's dependency graph
# (`tests/dependency_policy.rs` catches it; it failed before this
# exclusion). Every other Rust service may reasonably accept that
# transitive dependency; a credential-less, network-egress-restricted
# sandbox host whose entire security argument is dependency-set
# minimalism cannot. `tracing` + `tracing-subscriber` (below) carries
# this binary's own operational logs (startup, connection lifecycle,
# DEBUG-logged denied host calls, WARN-logged sandbox trips) to stdout
# JSON instead; bundle-authored `log.write()` calls never go through
# either path -- they are forwarded to the stage as a `log` capability
# host-call and sanitized/emitted there (spec SS7.4). No OTLP export
# from this binary: spec SS13.2 -- "The executor never creates spans
# itself: it returns durations, and the stage records them" -- the
# stage is already the aggregation point for this component's telemetry.
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json", "env-filter"] }
# `ed25519-dalek`/`base64`: `crate::signing`'s platform artifact-signature
# verification (spec SS5.6/Gemini condition 9) -- the executor checks the
# fetched sidecar's Ed25519 signature against `BUNDLE_SIGNING_PUBLIC_KEYS`
# before instantiating. Pure Rust (RustCrypto family, same lineage as the
# already-pinned `sha2`/`hmac`), no networking dependency, so this addition
# does not touch the dependency-set security assertion `tests/
# dependency_policy.rs` enforces (verification only -- no signing key ever
# lives in this binary, only public keys).
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
base64 = "=0.22.1"
# Parses the stage's server certificate's SAN/Subject (gh security review
# CRITICAL finding on PR #406, item 1: pin the host-API TLS peer to an
# explicit allowlisted identity -- SPIFFE URI SAN or CN -- not just "chains
# to the configured CA", per spec SS6.6's "otherwise pinned by
# configuration"). Pure Rust ASN.1/X.509 parsing, no networking/HTTP
# dependency of its own -- verified against `tests/dependency_policy.rs`'s
# banned-crate list (redis/sea-orm/sqlx/deadpool-redis/reqwest): none of
# its own dependency tree (nom/der-parser/asn1-rs/oid-registry/ring/
# data-encoding) pulls any of them in.
x509-parser = "=0.18.1"
# TCP keepalive on the host-API socket (`crate::tls::dial_stage`) -- catches
# a half-open connection to a since-terminated stage pod (regression:
# executor stuck on terminated svc pod after rollout, alpha 2026-10-02) at
# the OS level, independent of any wire-protocol cooperation from the
# stage. Already present transitively (via tokio) at this exact version per
# this crate's own committed Cargo.lock -- pinning it directly adds no new
# version to the dependency tree. No networking/HTTP dependency of its own.
socket2 = { version = "=0.6.5", features = ["all"] }

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["full", "test-util"] }
# Test-only: generates throwaway self-signed CA/client cert+key pairs at
# test run time (`src/tls.rs`'s tests) so `tests/dependency_policy.rs`'s
# and gitleaks' pre-commit scan never see a committed PEM private key --
# see that module's test doc comment. Rustls-org-maintained, pure Rust.
rcgen = "=0.14.10"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

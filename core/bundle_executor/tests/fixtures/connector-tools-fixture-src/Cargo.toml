[package]
name = "connector-tools-fixture"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
wit-bindgen-rt = { version = "=0.44.0", features = ["bitflags"] }
# The REAL Rust SDK registry/transport under test (host-testable core; its
# wasm32-only `bindings_glue` is dead-stripped -- this fixture adapts its own
# generated `connector-tools` bindings to `ToolTransport`).
waddle-sdk-rs = { path = "../../../../../sdk/waddle-sdk-rs", version = "=0.1.0" }
serde_json = "=1.0.151"

[lib]
crate-type = ["cdylib"]

[package.metadata.component]
package = "waddle:connector-tools-fixture"

[package.metadata.component.target]
world = "connector-tools"
path = "wit"

[package.metadata.component.dependencies]

[profile.release]
opt-level = "s"
lto = true
strip = true

[package.metadata.component.target.dependencies]
"waddle:bundle" = { path = "bundle-wit" }

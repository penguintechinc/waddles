[package]
name = "echo-connector"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[lib]
crate-type = ["cdylib"]

[package.metadata.component]
package = "waddle:echo-connector"

[package.metadata.component.target]
world = "connector"
path = "wit"

[package.metadata.component.dependencies]

[profile.release]
opt-level = "s"
lto = true
strip = true

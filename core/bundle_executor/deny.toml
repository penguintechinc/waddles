# cargo-deny configuration for bundle-executor.
# Run: cargo deny check  (advisories + licenses + bans + sources)
# See rules/critical-rules.md Dependency Pinning + rules/general.md Supply
# Chain Security. Mirrors core/svc_process/deny.toml (the M4 reference
# template) with one addition: the SS14.6/SS4.5 dependency-set security
# assertion (`deny = [...]` below) that this binary never links a
# networking/database crate that would give an escaped, credential-less
# executor somewhere useful to go.

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
version = 2
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
exceptions = []

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = false
deny = [
    { crate = "openssl", reason = "rustls only -- no C OpenSSL dependency, no OpenSSL CVE exposure" },
    { crate = "openssl-sys", reason = "rustls only -- no C OpenSSL dependency, no OpenSSL CVE exposure" },
    { crate = "native-tls", reason = "rustls only" },
    # spec SS4.5/SS14.6 test 16: the dependency set is itself a security
    # assertion. This credential-less, network-egress-restricted process
    # (host-API port + read-only bucket GETs only) must never link a crate
    # that could talk to Valkey, Postgres, or an arbitrary HTTP endpoint --
    # tests/dependency_policy.rs asserts the same thing against Cargo.lock
    # directly; this list is the enforced-at-resolve-time half of that gate.
    { crate = "redis", reason = "SS4.5/SS14.6 test 16: bundle-executor holds no Valkey access" },
    { crate = "deadpool-redis", reason = "SS4.5/SS14.6 test 16: bundle-executor holds no Valkey access" },
    { crate = "sea-orm", reason = "SS4.5/SS14.6 test 16: bundle-executor holds no Postgres access" },
    { crate = "sqlx", reason = "SS4.5/SS14.6 test 16: bundle-executor holds no Postgres access" },
    { crate = "reqwest", reason = "SS4.5/SS14.6 test 16: bundle-executor's only egress is the host-API port and the bucket -- no free-form HTTP client" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# `penguin-bundle-host`/`penguin-logging` (Cargo.toml) -- unpublished
# penguin-libs crates pinned by commit `rev`, not by mutable branch name.
allow-git = ["https://github.com/penguintechinc/penguin-libs.git"]

[sources.allow-org]
github = []
gitlab = []
bitbucket = []

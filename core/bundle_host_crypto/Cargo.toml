[package]
name = "bundle-host-crypto"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.0"
license = "AGPL-3.0-or-later"
publish = false
description = "Shared per-tenant at-rest encryption for bundle host capabilities (kv today; db/queues/economy later). Lifted from core/svc_ingest's identity_crypto: AES-256-GCM envelopes, length-prefixed AAD, HKDF data/blind-index subkeys, and the DekProvider family (TTL cache, hub-api broker client, alpha/local dev provider). The data plane holds the unwrapped tenant DEK in memory only (TTL cache, zeroize on drop, redacted Debug, never logged/serialized/telemetered). A path dependency within this repo, not a penguin-libs crate."

[lib]
name = "bundle_host_crypto"
path = "src/lib.rs"

# Exact-version pins only (rules/critical-rules.md Dependency Pinning); every
# version mirrors the pin core/svc_ingest, core/svc_process and
# core/bundle_host_kv already use for the same crate.
[dependencies]
aes-gcm = "=0.10.3"
hkdf = "=0.12.4"
hmac = "=0.12.1"
sha2 = "=0.10.9"
zeroize = { version = "=1.9.0", features = ["derive"] }
x25519-dalek = { version = "=2.0.1", features = ["getrandom"] }
thiserror = "=2.0.20"
tracing = "=0.1.44"
opentelemetry = "=0.32.0"
redis = { version = "=1.7.0", default-features = false, features = ["tokio-comp", "streams"] }
tokio = { version = "=1.53.3", features = ["sync", "time", "macros"] }

[dev-dependencies]
serde_json = "=1.0.151"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "test-util"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[package]
name = "bundle-host-surface"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.0"
license = "AGPL-3.0-or-later"
publish = false
description = "Bundle `overlay.publish-surface` host capability: the stage-side half of the generic bundle -> presentation path. Authorizes a publish against the bundle's declared surfaces, pre-checks size/JSON, and delivers it to svc-presentation over gRPC (waddles.presentation.internal.v1.SurfaceService) with a hub-api-minted JWT bound to exactly that community. Also owns the generated gRPC stubs (client + server) that svc-presentation serves. Schema validation, per-surface caps, rate limits, replay and fan-out are svc-presentation's (authoritative) job. A same-repo path dependency for the stages (core/svc_process, core/svc_action) and svc-presentation."

[lib]
name = "bundle_host_surface"
path = "src/lib.rs"

[build-dependencies]
# Compiles the repo-root `proto/waddles/presentation/internal/v1/*.proto` (needs `protoc`,
# supplied by every consumer's Dockerfile like core/hub_client's build.rs).
tonic-prost-build = "=0.14.6"

# Exact-version pins only -- rules/critical-rules.md Dependency Pinning.
# Versions mirror core/hub_client and core/service_auth so one graph resolves one version each.
[dependencies]
tokio = { version = "=1.53.3", features = ["time", "sync", "rt", "macros"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tracing = "=0.1.44"
async-trait = "=0.1.89"
tonic = { version = "=0.14.6", features = ["transport", "tls-ring"] }
tonic-prost = "=0.14.6"
prost = "=0.14.4"
service_auth = { path = "../service_auth", version = "=0.1.0" }

[dev-dependencies]
tokio = { version = "=1.53.3", features = ["full", "test-util"] }
tokio-stream = { version = "=0.1.19", features = ["net"] }

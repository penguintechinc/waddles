[package]
name = "bundle-host-surface"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.0"
license = "AGPL-3.0-or-later"
publish = false
description = "Bundle `overlay.publish-surface` host capability: the stage-side half of the generic bundle -> presentation path. Authorizes a publish against the bundle's declared surfaces, pre-checks size/JSON, and delivers it to svc-presentation's internal community-scoped publish route with a hub-api-minted PUSH JWT bound to exactly that community. Schema validation, per-surface caps, rate limits, replay and fan-out are svc-presentation's (authoritative) job. A same-repo path dependency for the stages (core/svc_process, core/svc_action)."

[lib]
name = "bundle_host_surface"
path = "src/lib.rs"

# Exact-version pins only -- rules/critical-rules.md Dependency Pinning.
# Versions mirror core/bundle_host_media and core/service_auth.
[dependencies]
tokio = { version = "=1.53.3", features = ["time", "sync", "rt", "macros"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tracing = "=0.1.44"
async-trait = "=0.1.89"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"] }
service_auth = { path = "../service_auth", version = "=0.1.0" }

[dev-dependencies]
tokio = { version = "=1.53.3", features = ["full", "test-util"] }
axum = "=0.8.9"

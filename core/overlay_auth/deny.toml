# cargo-deny configuration for overlay_auth.
# Run: cargo deny check  (advisories + licenses + bans + sources)
# See rules/critical-rules.md Dependency Pinning + rules/general.md Supply
# Chain Security for the policy this enforces. Mirrors
# core/service_auth/deny.toml -- this crate depends on service_auth (path
# dependency) for all JWT/crypto handling, so it inherits that crate's
# `rsa`/`rustls-pemfile`/OpenSSL bans rather than re-deriving them; listed
# again here because cargo-deny evaluates each crate's own resolved graph.

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
version = 2
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
exceptions = []

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = false
deny = [
    { crate = "rsa", reason = "service_auth's EdDSA-only jsonwebtoken build must never re-pull the RustSec-flagged rsa crate via a rust_crypto feature flip" },
    { crate = "rustls-pemfile", reason = "unmaintained (RUSTSEC-2025-0134) -- do not reintroduce via a reqwest/jsonwebtoken downgrade" },
    { crate = "openssl", reason = "rustls only -- no C OpenSSL dependency, no OpenSSL CVE exposure" },
    { crate = "openssl-sys", reason = "rustls only -- no C OpenSSL dependency, no OpenSSL CVE exposure" },
    { crate = "native-tls", reason = "rustls only" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []

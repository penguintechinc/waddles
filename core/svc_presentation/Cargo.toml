[package]
name = "svc-presentation"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.0"
license = "Apache-2.0"
publish = false
description = "Waddles overlay/presentation service (P1 scaffold) -- Axum/Tokio/SeaORM control plane for OBS browser-source overlays, replacing core/svc_presentation's Quart implementation (app.py/services/*) once P2-P9 land the render/push/hub routes on top of this skeleton. Depends on overlay_schema for every wire type and overlay_auth for the VIEW/PUSH axum guards -- no wire shape or auth logic is re-implemented in this crate."

[lib]
name = "svc_presentation"
path = "src/lib.rs"

[[bin]]
name = "svc-presentation"
path = "src/main.rs"

# Exact-version pins only (no ^ / * ranges) -- see rules/critical-rules.md
# Dependency Pinning. Cargo.lock is committed alongside this file. Versions
# below mirror core/svc_streaming/Cargo.toml and core/overlay_auth/
# Cargo.toml exactly where the same crate is already pinned in this repo,
# so cargo-deny/the workspace dependency graph never sees two resolved
# versions of the same crate.
[dependencies]
tokio = { version = "=1.53.1", features = ["full"] }
# "ws" (not a default axum feature) -- P4's live overlay viewer channel
# (`http::overlay::live_ws`) needs `axum::extract::ws`; "tokio" (default)
# already covers `axum::serve` itself.
axum = { version = "=0.8.9", features = ["ws"] }
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.7.1", features = ["trace", "cors"] }
hyper = { version = "=1.11.1", features = ["full"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
opentelemetry = "=0.32.0"
opentelemetry-otlp = { version = "=0.32.0", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "=0.32.1", features = ["rt-tokio"] }
tracing-opentelemetry = "=0.33.0"
prometheus = "=0.14.0"
utoipa = { version = "=5.5.0", features = ["axum_extras", "uuid"] }
uuid = { version = "=1.26.1", features = ["v4", "serde"] }
chrono = { version = "=0.4.45", features = ["serde"] }
thiserror = "=2.0.20"
anyhow = "=1.0.104"
clap = { version = "=4.6.6", features = ["derive", "env"] }
# rustls-tls (never openssl) -- rules/security.md TLS requirements. Used by
# the `--healthcheck` subcommand's loopback client and by
# `overlay::push_trust::AppPushTrustSource`'s `service_auth::JwksTrustBundle`
# (hub-api JWKS fetch) transitively via `service_auth` itself.
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"] }
sea-orm = { version = "=2.0.2", default-features = false, features = [
    "sqlx-postgres",
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "with-json",
    "with-chrono",
] }
# Pinned exactly alongside `sea-orm` above -- sea-orm 2.0.2's own manifest
# constrains this transitive dependency to `~2.0.2` (>=2.0.2, <2.1.0), so
# an otherwise-unconstrained resolve drifts to a newer published macros
# release (2.0.3/2.0.4) whose derive-macro-generated code calls
# `ColumnTrait::save_array_as`, a method added after 2.0.2 -- that
# mismatch is a hard compile error (E0407) against the exact `sea-orm`
# core pinned above. Declaring this direct dependency keeps the pair
# locked together regardless of what the registry has published since.
sea-orm-macros = "=2.0.2"

# Path dependencies within this repo (not penguin-libs crates) -- the
# single source of truth for overlay wire types and overlay auth; see
# core/overlay_schema/Cargo.toml and core/overlay_auth/Cargo.toml for why
# these are path deps, not a re-implementation.
# Dependency key is "overlay-schema" (hyphen) to match that crate's
# package name (`core/overlay_schema/Cargo.toml`'s `[package].name`); the
# importable path is still `overlay_schema::...` (underscore), taken from
# that crate's `[lib].name`, not this key. Declared now -- proves the pin
# resolves and builds -- but not yet imported by any P1 module: no route
# in this scaffold serializes an `overlay_schema::OverlayPush`/
# `OverlayEnvelope` yet (that's P2's render handler and P3's live
# SSE/websocket frame). Same "declared for a later chunk, not implemented
# yet" precedent core/svc_streaming/Cargo.toml's media-crate block
# documents for its own not-yet-wired dependencies.
overlay-schema = { path = "../overlay_schema", version = "=0.1.0" }
overlay_auth = { path = "../overlay_auth", version = "=0.1.0" }
# Only `JwksTrustBundle`/`TrustBundle` are consumed directly (by
# `overlay::push_trust::AppPushTrustSource`) -- `overlay_auth` already
# depends on `service_auth` for its own PUSH verification path, this is a
# second direct use of the same already-resolved crate, not new surface.
service_auth = { path = "../service_auth", version = "=0.1.0" }

# P3's live SSE stream (`overlay::hub`/`http::overlay::live_event_stream`)
# builds a `Stream` by hand with `futures::stream::unfold` rather than
# pulling in `async-stream`'s proc-macro -- same exact version/feature pin
# as core/svc_streaming/Cargo.toml so cargo-deny sees one resolved version.
futures = { version = "=0.3.34", default-features = false, features = ["std", "async-await"] }

[dev-dependencies]
http-body-util = "=0.1.3"
# Test-only: `MockDatabase` for `overlay::view_store`/`http::health`/
# `overlay::router` unit tests -- never linked into the release binary.
# Same exact `sea-orm`/`sea-orm-macros` version pins as the main
# dependencies above (cargo unifies feature sets per resolved version, not
# per dependency-table, so this only adds the `mock` feature on top).
sea-orm = { version = "=2.0.2", default-features = false, features = ["mock"] }
# Signs fixture JWTs to exercise `overlay::push_trust::AppPushTrustSource`
# against `overlay_auth::require_push_credential` end-to-end -- same
# version/feature pin as core/overlay_auth/Cargo.toml and
# core/service_auth/Cargo.toml so cargo-deny sees one resolved version.
jsonwebtoken = { version = "=10.4.0", default-features = false, features = ["aws_lc_rs"] }
# Test-only real websocket client -- `tests/overlay_live.rs` connects to a
# genuinely bound TCP listener running the real axum app (same `axum::serve`
# pattern as `tests/run.rs`) rather than mocking the upgrade; exact same
# version axum's own "ws" feature pins above, so cargo-deny sees one
# resolved version, not two.
tokio-tungstenite = "=0.29.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

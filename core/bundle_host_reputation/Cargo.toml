[package]
name = "bundle-host-reputation"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.0"
license = "Apache-2.0"
publish = false
description = "Bundle `reputation` host-capability store (issue #726): the hub-owned, community-scoped score store with an atomic adjust (row lock + audit-ledger insert in one transaction), a durable rolling-24h per-(community, user) absolute-delta cap, call-time membership re-verification against `community_members`, and the membership-snapshot loader that feeds `bundle_capability_gate::SnapshotMembership`. A path dependency within this repo -- NOT a penguin-libs crate -- consumed by core/svc_process. Backed by the shared `waddles` Postgres instance via SeaORM under the least-privilege `waddles_bundle_reputation` role (alembic 0046); every row is scoped server-side to the invocation's authenticated (tenant, community, app_id), never from guest input."

[lib]
name = "bundle_host_reputation"
path = "src/lib.rs"

# Exact-version pins only -- rules/critical-rules.md Dependency Pinning.
# Versions mirror core/bundle_host_db's for the same crates.
[dependencies]
sea-orm = { version = "=2.0.2", default-features = false, features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-uuid",
] }
thiserror = "=2.0.20"
tracing = "=0.1.44"
tokio = { version = "=1.53.1", features = ["time", "sync"] }
uuid = { version = "=1.26.1", features = ["v4"] }
# The gate crate's `MemberRow`/`SnapshotMembership` -- the membership loader
# here produces exactly what the gate's production MembershipCheck consumes.
bundle-capability-gate = { path = "../bundle_capability_gate", version = "=0.1.0" }
# OTel instruments (latency histogram + outcome counters), same pattern as
# `core/bundle_host_db`'s `metrics.rs`: reads the global `SdkMeterProvider`
# `penguin-logging` installs, never builds its own.
opentelemetry = "=0.32.0"

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
testcontainers = "=0.28.0"
sea-orm = { version = "=2.0.2", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid"] }
futures = "=0.3.31"

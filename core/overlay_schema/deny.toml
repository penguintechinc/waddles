# cargo-deny configuration for overlay_schema.
# Run: cargo deny check  (advisories + licenses + bans + sources)
# See rules/critical-rules.md Dependency Pinning + rules/general.md Supply
# Chain Security for the policy this enforces. Mirrors
# core/bundle_capability_gate/deny.toml (this crate's closest sibling: a
# shared, path-dependency, no-git-deps library crate with the same
# allowed-license set).

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
version = 2
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
# Permissive OSS licenses only -- no copyleft beyond MPL-2.0 (file-level,
# not viral), no unlicensed/unknown crates.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
exceptions = []

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = false
deny = [
    { crate = "openssl", reason = "rustls only -- no C OpenSSL dependency, no OpenSSL CVE exposure" },
    { crate = "openssl-sys", reason = "rustls only -- no C OpenSSL dependency, no OpenSSL CVE exposure" },
    { crate = "native-tls", reason = "rustls only" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No penguin-libs (or any other git) dependency in this crate -- every
# dependency is a plain crates.io registry pin (Cargo.toml).
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []

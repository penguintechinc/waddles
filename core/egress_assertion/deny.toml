# cargo-deny configuration for egress-assertion.
# Run: cargo deny check  (advisories + licenses + bans + sources)
# See rules/critical-rules.md Dependency Pinning + rules/general.md Supply
# Chain Security for the policy this enforces. Mirrors
# core/service_auth/deny.toml (the crate this signing/verification wire
# format was extracted alongside).

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
version = 2
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
exceptions = []

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = false
deny = [
    # jsonwebtoken's "aws_lc_rs" feature (not "rust_crypto") is deliberate --
    # security review finding carried over from core/service_auth:
    # "rust_crypto" bundles the RustSec-flagged `rsa` crate (Marvin-attack
    # timing sidechannel, no safe upgrade) unconditionally, even though this
    # crate only ever signs/verifies EdDSA.
    { crate = "rsa", reason = "Ed25519-only egress-assertion must never re-pull the RustSec-flagged rsa crate via jsonwebtoken's rust_crypto feature" },
    { crate = "openssl", reason = "rustls only -- no C OpenSSL dependency, no OpenSSL CVE exposure" },
    { crate = "openssl-sys", reason = "rustls only -- no C OpenSSL dependency, no OpenSSL CVE exposure" },
    { crate = "native-tls", reason = "rustls only" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []

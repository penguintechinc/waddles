[package]
name = "svc-ingest"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.0"
license = "Apache-2.0"
publish = false
description = "Waddles chat/event data-plane ingest service -- Rust rewrite skeleton (M5). Owns every inbound platform connection and HTTP intake surface; normalizes raw platform payloads and writes them once onto the Valkey stream spine. No database: ingest has no SeaORM dependency, unlike svc_process/svc_action (see docs/superpowers/specs/2026-09-14-rust-data-plane-design.md S4.1)."

[lib]
name = "svc_ingest"
path = "src/lib.rs"

[[bin]]
name = "svc-ingest"
path = "src/main.rs"

# Exact-version pins only (no ^ / * ranges) -- see rules/critical-rules.md
# Dependency Pinning. Cargo.lock is committed alongside this file.
#
# This M5 skeleton deliberately stops at the `svc_streaming`-template
# subset the spec calls for (health/healthz/metrics, OTel wiring, config,
# Dockerfile, CI) -- `penguin-spine`, `penguin-connectors`, and
# `penguin-licensing` land with the M1/M2 crates they depend on and are
# added when the intake/normalizer/relay work starts (see the
# `TODO(M5)` seams in `src/lib.rs`). No `sea-orm`: ingest has no database,
# matching today's Python service and the spec's S4.1 dependency list.
[dependencies]
tokio = { version = "=1.53.1", features = ["full"] }
axum = "=0.8.9"
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.7.1", features = ["trace"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
opentelemetry = "=0.32.0"
opentelemetry-otlp = { version = "=0.32.0", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "=0.32.1", features = ["rt-tokio"] }
tracing-opentelemetry = "=0.33.0"
prometheus = "=0.14.0"
thiserror = "=2.0.20"
anyhow = "=1.0.104"
clap = { version = "=4.6.6", features = ["derive", "env"] }
# Used only by the `--healthcheck` subcommand's loopback GET -- never for
# outbound platform/hub-api calls in this skeleton (those are connector
# work, out of scope here).
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
http-body-util = "=0.1.3"
# Already resolved transitively (tokio's unix signal support) at this exact
# version -- promoted to a direct dev-dependency only so
# `tests/main_binary.rs` can send a real SIGTERM to a spawned child process
# to exercise `shutdown_signal`'s graceful-shutdown path end-to-end.
libc = "=0.2.189"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

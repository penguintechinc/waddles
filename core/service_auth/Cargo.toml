[package]
name = "service_auth"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.0"
license = "AGPL-3.0-or-later"
publish = false
description = "Client + verifier for hub-api-issued per-service EdDSA machine JWTs (feature/eddsa-machine-jwt). Bootstraps over gRPC (hub-api ServiceAuthService, TLS 1.3) with the pod's projected Kubernetes ServiceAccount token, caches and refreshes the resulting machine JWT, and verifies inbound machine JWTs against a JWKS-shaped trust bundle. SPIFFE/Skauswatch-ready: TrustBundle is a trait so a future JWT-SVID bundle source drops in without touching callers -- see docs comment in src/lib.rs."

[lib]
name = "service_auth"
path = "src/lib.rs"

# Exact-version pins only (no ^ / * ranges) -- rules/critical-rules.md
# Dependency Pinning. Versions mirror core/svc_process/Cargo.toml where the
# same crate is already pinned there, to avoid a second pin of the same
# dependency once these crates share a workspace.
[dependencies]
tokio = { version = "=1.53.3", features = ["sync", "time", "rt", "fs", "net"] }
# gRPC to hub-api's internal `ServiceAuthService` (machine-JWT mint + JWKS) -- replaces the old
# reqwest/REST bootstrap, so reqwest (and its TLS stack) is no longer a dependency of this crate.
# `transport` = tonic's channel/server; `tls-ring` is what hub_client already resolves (one rustls).
tonic = { version = "=0.14.6", features = ["transport", "tls-ring"] }
tonic-prost = "=0.14.6"
prost = "=0.14.4"
# Custom TLS-1.3-only connector (tonic's own ClientTlsConfig cannot pin the protocol version).
# Pins mirror core/hub_client, core/svc_action and core/egress_proxy so one graph resolves one copy.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "=0.26.5", default-features = false }
rustls-pki-types = "=1.15.1"
hyper-util = { version = "=0.1.19", default-features = false, features = ["tokio"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# "aws_lc_rs" (not jsonwebtoken's "rust_crypto" feature) -- security review
# finding: `rust_crypto` bundles ed25519-dalek/hmac/p256/p384/rand/rsa/sha2
# as one all-or-nothing bucket, so verifying only EdDSA still pulled in the
# RustSec-flagged `rsa` crate (Marvin-attack timing sidechannel, no safe
# upgrade -- see deny.toml's `bans.deny` entry for `rsa`). `aws_lc_rs`
# implements EdDSA (and every other alg jsonwebtoken supports) against
# AWS-LC directly, with no `rsa` crate anywhere in the dependency graph.
jsonwebtoken = { version = "=10.4.0", default-features = false, features = ["aws_lc_rs"] }
# =2.0.20 (not =2.0.21) -- core/egress_proxy (feature/egress-proxy-service)
# depends on this crate AND on bundle-host-http in the same build, and
# bundle-host-http's `penguin-bundle-host` git dependency pins thiserror
# =2.0.20 exactly. Aligning here (a semver-patch-only downgrade) avoids an
# unresolvable two-exact-versions conflict; matches core/bundle_host_http
# and core/svc_action's own thiserror pin too.
thiserror = "=2.0.20"
tracing = "=0.1.44"
async-trait = "=0.1.89"
# JWT Phase-0 hardening (`src/jwt_hardening.rs`): the JOSE header is decoded
# by hand (base64url + JSON) BEFORE `jsonwebtoken` sees the token, so a
# hostile `alg`/`jku`/`jwk`/`x5u`/`x5c`/`crit`/`kid` is named precisely and
# never reaches signature work or a trust-bundle lookup. `base64` is already
# in the lockfile transitively via `jsonwebtoken` (same exact version) --
# promoting it to a direct dependency adds no new package.
base64 = "=0.22.1"
# OpenTelemetry *API* only, metrics feature only (no SDK, no exporter, no
# trace/logs): the verification counter + latency histogram are recorded
# against whatever global meter provider the host service installed at
# startup (`opentelemetry::global::set_meter_provider`); with none
# installed the instruments are no-ops and verification is unaffected.
opentelemetry = { version = "=0.32.0", default-features = false, features = ["metrics"] }
# Only for `test_support` (the in-memory metric capture) -- off by default and
# never part of a service binary.
opentelemetry_sdk = { version = "=0.32.1", default-features = false, features = ["metrics"], optional = true }

[build-dependencies]
tonic-prost-build = "=0.14.6"

[features]
default = []
# Exposes `service_auth::test_support::{Capture, MockHub}` to dependents' tests (`MockHub` is a
# real in-process tonic `ServiceAuthService` on loopback, replacing the old wiremock REST stubs).
test-support = ["dep:opentelemetry_sdk"]

[dev-dependencies]
tokio = { version = "=1.53.3", features = ["full", "test-util"] }
# Real-TLS tests: a throwaway ECDSA P-256 (rcgen's default) CA + server cert generated per run.
rcgen = "=0.14.10"
# Test-only: the capturing exporter proves the counter/histogram carry the
# exact `waddles_jwt_verifications_total{verifier,alg,outcome}` label set the
# Python verifiers emit. Never linked into a service binary.
opentelemetry_sdk = { version = "=0.32.1", default-features = false, features = ["metrics"] }
# Test-only: captures rendered log lines to assert no token material is logged.
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std"] }

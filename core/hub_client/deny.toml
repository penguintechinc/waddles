# cargo-deny configuration for hub_client.
# Run: cargo deny check  (advisories + licenses + bans + sources)
# See rules/critical-rules.md Dependency Pinning + rules/general.md Supply
# Chain Security. Mirrors core/service_auth/deny.toml (the pattern this
# crate's own path-dependency on service_auth already follows).

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
version = 2
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
exceptions = []

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = false
deny = [
    # rustls-only TLS stack, same rationale as core/service_auth/deny.toml.
    { crate = "rsa", reason = "same jsonwebtoken/rust_crypto RustSec concern as core/service_auth -- this crate depends on service_auth directly" },
    { crate = "rustls-pemfile", reason = "unmaintained (RUSTSEC-2025-0134) -- do not reintroduce" },
    { crate = "openssl", reason = "rustls only -- no C OpenSSL dependency" },
    { crate = "openssl-sys", reason = "rustls only -- no C OpenSSL dependency" },
    { crate = "native-tls", reason = "rustls only" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []

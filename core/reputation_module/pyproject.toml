[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names are self-documenting (pytest convention); S101 (assert) is
# standard pytest usage; SLF001 (private-member access) is a deliberate
# test-only override to exercise ReputationService's private
# _update_tenant_reputation() directly (isolates reputation_tenant's upsert
# from the separate, pre-existing community_members.hub_user_id bug that
# adjust()/get_reputation() also hit -- see test_reputation_tables.py's
# module docstring). S105/S106/S107 flag fixed test-only JWT signing
# secrets (mirroring flask_core's own `os.getenv("SECRET_KEY",
# "change-me-in-production")` default), not real credentials.
"tests/*" = [
    "D100", "D101", "D102", "D103", "D104", "S101", "SLF001",
    "S105", "S106", "S107",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
exclude = ["^\\.venv/", "^tests/"]

# libs/flask_core ships no py.typed marker -- same boundary override
# hub_api/pyproject.toml and core/svc_process/pyproject.toml use for the
# identical reason.
[[tool.mypy.overrides]]
module = ["flask_core.*"]
ignore_missing_imports = true
follow_imports = "skip"

# pydal ships no py.typed marker/stubs either.
[[tool.mypy.overrides]]
module = ["pydal.*"]
ignore_missing_imports = true

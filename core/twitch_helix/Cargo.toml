[package]
name = "twitch_helix"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.0"
license = "Apache-2.0"
publish = false
description = "Typed async Rust client for the Twitch Helix endpoints the provider framework needs for moderation + messaging (delete chat message, send chat message, send whisper). Mirrors core/svc_action/services/twitch_helix.py + platform_moderation.py error classification. Token refresh is the caller's concern."

[lib]
name = "twitch_helix"
path = "src/lib.rs"

# Exact-version pins only -- rules/critical-rules.md Dependency Pinning.
[dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "=1.53.1", features = ["time"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tracing = "=0.1.44"

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["macros", "rt", "rt-multi-thread", "time"] }
wiremock = "=0.6.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

components:
  schemas:
    ActivationDTO:
      description: 'Response DTO: one `app_activations` row, joined to its `app_catalog`
        metadata.'
      properties:
        activatedAt:
          anyOf:
          - type: string
          - type: 'null'
          title: Activatedat
        appId:
          title: Appid
          type: string
        communityId:
          title: Communityid
          type: integer
        config:
          additionalProperties: true
          title: Config
          type: object
        enabled:
          title: Enabled
          type: boolean
        feature:
          title: Feature
          type: string
        id:
          title: Id
          type: integer
        module:
          title: Module
          type: string
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        tenantId:
          title: Tenantid
          type: integer
      required:
      - id
      - appId
      - communityId
      - tenantId
      - enabled
      - config
      - module
      - feature
      - name
      - activatedAt
      title: ActivationDTO
      type: object
    ActivityPeriodStats:
      description: Watch-time + message-count for one time window (all-time/weekly/monthly).
      properties:
        message_count:
          title: Message Count
          type: integer
        watch_time_formatted:
          title: Watch Time Formatted
          type: string
        watch_time_seconds:
          title: Watch Time Seconds
          type: integer
      required:
      - watch_time_seconds
      - watch_time_formatted
      - message_count
      title: ActivityPeriodStats
      type: object
    ActivityRanks:
      description: The caller's own rank in each leaderboard, `None` if unranked.
      properties:
        messages:
          anyOf:
          - type: integer
          - type: 'null'
          title: Messages
        watch_time:
          anyOf:
          - type: integer
          - type: 'null'
          title: Watch Time
      required:
      - watch_time
      - messages
      title: ActivityRanks
      type: object
    AdminLoginUserDTO:
      description: Admin login user DTO.
      properties:
        avatarUrl:
          anyOf:
          - type: string
          - type: 'null'
          title: Avatarurl
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        id:
          title: Id
          type: integer
        isAdmin:
          title: Isadmin
          type: boolean
        isSuperAdmin:
          title: Issuperadmin

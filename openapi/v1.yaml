        username:
          anyOf:
          - type: string
          - type: 'null'
          title: Username
      required:
      - id
      - email
      - username
      - avatarUrl
      - isAdmin
      - isSuperAdmin
      title: AdminLoginUserDTO
      type: object
    Announcement:
      description: One `announcements` row, camelCase-in-Node fields kept snake_case
        here (ruff N815).
      properties:
        announcement_type:
          title: Announcement Type
          type: string
        archived_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Archived At
        community_id:
          title: Community Id
          type: integer
        content:
          title: Content
          type: string
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Created At
        created_by:
          anyOf:
          - type: integer
          - type: 'null'
          title: Created By
        created_by_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Created By Name
        id:
          title: Id
          type: integer
        is_pinned:
          title: Is Pinned
          type: boolean
        published_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Published At
        status:
          title: Status
          type: string
        title:
          title: Title
          type: string
        updated_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Updated At
        updated_by:
          anyOf:
          - type: integer
          - type: 'null'
          title: Updated By

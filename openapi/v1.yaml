      type: object
    AnnouncementPagination:
      description: Page metadata for `GET .../announcements`.
      properties:
        limit:
          title: Limit
          type: integer
        page:
          title: Page
          type: integer
        total:
          title: Total
          type: integer
        total_pages:
          title: Total Pages
          type: integer
      required:
      - page
      - limit
      - total
      - total_pages

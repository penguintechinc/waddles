# config/postgres/rbac-matrix.yaml
#
# Normative role x table x privilege matrix (spec D28 / Sec11.10.1).
# Grants are generated FROM this file by scripts/db/rbac_matrix.py --
# nobody writes a GRANT by hand. Every role and every table this
# milestone (M2b) touches has an explicit row, including "no privilege"
# rows, so the live-grants CI test (hub_api/tests/test_rbac_live_grants.py)
# can assert set equality rather than only checking presence.
#
# Appended to, never rewritten, by later milestones (M3/M4/M5/M6) as
# their own services/tables land -- each appends its own role/table
# rows to this same file and adds its own migration that re-renders
# grants scoped to its own new rows.
version: 1
roles:
  - hub_api
  - waddles_publisher
  - svc_ingest
  - svc_process
  - svc_action
  - svc_streaming
  - webui
  - migration_runner
tables:
  - app_versions
  - app_active_versions
  - app_version_uploads
  - app_install_approvals
  - app_stream_grants
  - custom_platforms
  - ingest_sources
  - platform_settings
  - app_versions_audit_log
  - workstreams
  - workstream_usage_hourly
  - app_source_bindings
  - app_global_installs
  - bundle_tenant_availability
  - app_permission_requests
  - app_tenant_permission_restrictions
  - community_permission_grants
  - app_permission_grant_versions
  - bundle_reputation_adjustments
  - tenant_platform_credentials
  - guild_tenant_pairings
  - calendar_event_discord_syncs
  - community_role_sync_bindings
  - tenant_platform_apps
  - platform_connections
  - community_connection_access
  - keystore.tenant_encryption_keys
  - tenant_kms_configs
grants:
  # app_versions: exactly two writers (spec Sec6.10). Every other role
  # gets zero privileges -- listed explicitly so the equality check
  # sees an intentional absence, not an unexamined gap.
  - role: waddles_publisher
    table: app_versions
    privileges: [INSERT, UPDATE, DELETE]
  - role: hub_api
    table: app_versions
    privileges: [SELECT, INSERT, UPDATE, DELETE]
  - role: svc_ingest
    table: app_versions
    privileges: []
  - role: svc_process
    table: app_versions
    privileges: []
  - role: svc_action
    table: app_versions
    privileges: []
  - role: svc_streaming
    table: app_versions
    privileges: []
  - role: webui
    table: app_versions
    privileges: []
  - role: migration_runner
    table: app_versions
    privileges: [SELECT, INSERT, UPDATE, DELETE]


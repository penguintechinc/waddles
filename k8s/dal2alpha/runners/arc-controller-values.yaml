# gha-runner-scale-set-controller values (chart 0.13.0).
replicaCount: 1
nodeSelector:
  kubernetes.io/arch: amd64
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 250m, memory: 256Mi}

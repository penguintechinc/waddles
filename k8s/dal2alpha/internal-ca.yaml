# waddlebot internal CA (svc mTLS trust domain only -- NOT org-wide). Requires cert-manager running.
# Namespaced Issuer/Certificate live in cert-manager ns so the CA secret is the ClusterIssuer's
# default cluster-resource-namespace.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: waddlebot-ca-bootstrap
  namespace: cert-manager
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: waddlebot-internal-ca
  namespace: cert-manager
spec:
  isCA: true
  # FINDING 1: X.509 nameConstraints (critical) -- this CA can ONLY sign identities inside the
  # waddlebot trust domain; a cert for any other DNS/URI name fails chain validation. Only
  # waddlebot internal svcs (ns `waddlebot`) + the chart's SPIFFE IDs (spiffe://penguintech.io/...)
  # are in scope. Any new service name outside these must be added here deliberately (re-issue CA).
  nameConstraints:
    critical: true
    permitted:
      dnsDomains:
        - waddlebot.svc.cluster.local     # `*.waddlebot.svc.cluster.local` wildcard + any <svc>.waddlebot.svc.cluster.local FQDN
        # Bare single-label SANs the chart's cert-manager Certificates request (release `waddlebot`
        # => fullname `waddlebot`). RFC5280 dNSName constraint "x" permits x and *.x only, so each
        # bare name must be listed exactly; NOT covered by the FQDN suffix above.
        # grpc-tls-certificate.yaml:
        - waddlebot-core-data
        - waddlebot-core-identity
        - waddlebot-interactive-productivity
        - waddlebot-action-serverless
        # host-api-tls-certificate.yaml (hostApiTlsDesiredDnsNames):
        - waddlebot-svc-process-rust
        - waddlebot-svc-action-rust
        - waddlebot-bundle-executor
        # NOT permitted (deliberately): `<svc>.waddlebot` / `<svc>.waddlebot.svc` short forms -- only the
        # self-generated hub-api/valkey certs (own CA, not this one) use them.
      uriDomains:
        - penguintech.io                  # SPIFFE: spiffe://penguintech.io/<env>/<service>
    # No IP SANs permitted (an empty permitted list is not expressible) -- deny all via excluded.
    excluded:
      ipRanges: ["0.0.0.0/0", "::/0"]
  commonName: waddlebot-internal-ca
  subject:
    organizations: [PenguinTech]
    organizationalUnits: [waddlebot-internal-services]
  secretName: waddlebot-internal-ca
  duration: 87600h     # 10y
  renewBefore: 8760h   # 1y
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: waddlebot-ca-bootstrap
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: waddlebot-internal-ca
spec:
  ca:
    secretName: waddlebot-internal-ca

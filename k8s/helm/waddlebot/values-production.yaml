## Waddlebot - Production Environment Overrides
#
# feature/bundle-artifact-signing + feature/bundle-egress-gateway -- production has no full
# values-production.yaml yet (DO prod cluster not built, see
# admin/.claude/rules/penguintech.md); this file exists ONLY to carry the bundle-signing and
# egress-proxy overrides those two PRs required per environment. Extend in place once
# production's full topology lands, mirroring values-beta.yaml's shape.
global:
  deploymentTier: "production"
  # PenguinTech images require a SHA256-digest pin in production (critical-rules.md
  # Dependency Pinning) -- imageTag here MUST be a digest reference once the production
  # image pipeline exists, never a mutable tag like alpha/beta use.
  # IfNotPresent is correct for digest-pinned prod images (immutable ref -> a cached layer is the
  # same image); also governs hub-api + the Rust data-plane Deployments (no hardcoded Always).
  imagePullPolicy: IfNotPresent
  # Rust data plane TLS prerequisites (pipeline.rustDataPlane below). Names only, never material:
  #  - host-API mTLS (svc-process/svc-action/svc-bundles-executor): cert-manager mints
  #    <release>-host-api-tls from the ClusterIssuer below (PREREQ: cert-manager + that issuer in
  #    this cluster); the chart derives the stage identity itself on this path.
  #  - Valkey server TLS + hub-api internal gRPC TLS: Secrets <release>-valkey-tls and
  #    <release>-hub-api-grpc-tls are owned by an out-of-band ExternalSecret/SealedSecret
  #    (externalSecret: true). They MUST exist before `helm upgrade`; a missing Secret leaves the
  #    pods in ContainerCreating (loud), never a silent plaintext fallback.
  # Dedicated transit trust root for Postgres / SeaweedFS S3 / Valkey: a namespaced SelfSigned Issuer -> root CA -> CA Issuer
  # rendered by the chart (PREREQ: cert-manager with the NameConstraints feature gate). Clients trust only that root; the
  # hostApiTls/grpcTls identities below keep waddlebot-internal-ca. Overrides global.valkeyTls.externalSecret (cert-manager owns
  # <release>-valkey-tls in this mode).
  transitTls:
    certManager:
      enabled: true
  hostApiTls:
    certManager:
      enabled: true
      issuerKind: "ClusterIssuer"
      issuerName: "waddlebot-internal-ca"
  valkeyTls:
    externalSecret: true
  hubApiGrpcTls:
    externalSecret: true

pipeline:
  hubApi:
    # Run `make generate-bundle-signing-key KEY_ID=<label> KUBE_CONTEXT=<DO prod context>
    # NAMESPACE=waddlebot` once before the first bundle approval on this env -- see
    # values.yaml's pipeline.hubApi.bundleSigning comment and the chart README's rollout
    # order. Production's signing key MUST be distinct from gamma/beta's -- never reuse a
    # lower-environment key here.
    bundleSigning:
      secretName: ""
    # Reconciler stays enabled at the base default (values.yaml) -- production is exactly
    # where a missed sidecar re-upload matters most.
  rustDataPlane:
    # Rust data plane (svc-ingest/svc-process/svc-action + svc-bundles-executor) -- the legacy
    # Python stages no longer exist in the chart, so this is the only ingest/process/action
    # path. Per-stage sub-toggles, replicas and resources inherit the base values.yaml defaults.
    enabled: true
    # Bundle `http` egress SSRF backstop (REQUIRED outside alpha/local -- the chart fails the
    # render when empty). Same pod/Service/node CIDRs as this file's egressPolicy.clusterCidrs;
    # confirm against the live cluster (`kubectl cluster-info dump | grep -E 'cluster-cidr|service-cluster-ip-range'`).
    egressClusterCidrDenylist:
      - "10.244.0.0/16"
      - "10.96.0.0/12"
      - "10.0.0.0/8"
    # ONE svc-bundles-executor Deployment serves BOTH stages (the `stages` default in values.yaml
    # lists svc-process-rust:8301 + svc-action-rust:8302). Resources are sized for the two
    # stages in one pod (the larger of the two former Deployments).
    bundleExecutor:
      # Compiling large Python/.NET components via Cranelift OOMs below this (alpha finding).
      resources:
        requests: { cpu: "500m", memory: "1Gi" }
        limits: { cpu: "2000m", memory: "16Gi" }
    bundleSigningPublicKeys: {}

# Resilience (templates/autoscaling.yaml). Production runs multi-replica: HPA on the stateless
# services (CPU 70%), PodDisruptionBudgets rendered automatically for every service whose
# effective replicas > 1. svc-streaming / svc-presentation stay single-replica singletons and
# are never autoscaled. HPA minReplicas is the production floor (3+ per the prod resource tier).
autoscaling:
  defaults:
    minReplicas: 3
    maxReplicas: 10
  services:
    hubApi: { enabled: true }
    hubWebui: { enabled: true }
    svcActionRust: { enabled: true }
    svcProcessRust: { enabled: true }
    # svc-bundles-executor: one Deployment for every stage; floor of 2 (PDB renders), CPU + memory.
    bundleExecutor:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
    reputation: { enabled: true }

# Egress lockdown — MANDATORY (fail guard blocks a render with this off).
# PenguinTech prod resource tier (500m/1000m cpu, 512Mi/1Gi mem, replicas 3+) for the proxy.
egressProxy:
  enabled: true
  environment: "production"
  replicas: 3
  resources:
    requests: { cpu: "500m", memory: "512Mi" }
    limits: { cpu: "1000m", memory: "1Gi" }

egressPolicy:
  enabled: true
  clusterCidrs:
    podCidr: "10.244.0.0/16"    # DigitalOcean DOKS default — confirm against cluster before deploy
    serviceCidr: "10.96.0.0/12"
    nodeCidr: "10.0.0.0/8"

spire:
  environment: "production"

# Production admits only signed, SBOM-attested Waddles images (Kyverno, Enforce).
# Requires the Kyverno CRDs installed in the production cluster. See docs/SUPPLY_CHAIN.md.
supplyChain:
  verifyImages:
    enabled: true
    enforce: true

infrastructure:
  # SeaweedFS at-rest SSE-S3 KEK Secret NAME (pre-create via `make generate-seaweedfs-sse-key`;
  # the template fails closed outside alpha without it). Name only, same as values-beta.yaml.
  seaweedfs:
    encryption:
      secretName: "seaweedfs-sse-kek"
  # Durable delivery-state Valkey (99.99% delivery SLA): primary + 1 warm replica, REQUIRED
  # anti-affinity (separate nodes), PDB. Set infrastructure.valkeyDurable.password explicitly.
  # Pick a replicated/durable storageClass for the target cluster before first deploy.
  valkeyDurable:
    enabled: true
    replicas: 2
    maxMemory: "1gb"
    antiAffinity: "hard"
    persistence:
      size: 10Gi
    resources:
      requests: { cpu: "500m", memory: "1536Mi" }
      limits: { cpu: "1000m", memory: "2Gi" }
  # Dedicated bundle-kv Valkey (noeviction quota store): single pod, no replication.
  valkeyKv:
    enabled: true
    maxMemory: "256mb"
    persistence:
      size: 2Gi
    resources:
      requests: { cpu: "100m", memory: "256Mi" }
      limits: { cpu: "500m", memory: "512Mi" }

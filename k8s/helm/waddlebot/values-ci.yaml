# CI overlay for .github/workflows/helm-chart-e2e.yml -- layered ON TOP of
# values-alpha.yaml (`helm install -f values-alpha.yaml -f values-ci.yaml`).
#
# Goal: exercise the parts of the chart that only fail on a REAL cluster
# (hook ordering, image entrypoints, live-object strategic-merge, secret
# lifecycle across upgrades) while keeping the kind cluster's image-build
# bill small. Everything disabled here is disabled because it is either
# (a) legacy Python that duplicates a Rust path already exercised, or
# (b) genuinely external (real Discord/Twitch network access, PostHog,
# SPIRE) and out of scope for an ephemeral, network-isolated kind run.
#
# MUST stay in sync with the workflow's image build/kind-load list: every
# component left `enabled: true` below that isn't already covered by
# values-alpha.yaml's local-registry image references needs a matching
# `kind load docker-image` in the workflow.

global:
  imageRegistry: ""          # images are `kind load`-ed by exact local tag, no registry prefix
  imageTag: "ci"
  imagePullPolicy: Never      # forces use of the kind-loaded image; a cache-miss must fail loudly, never fall back to a network pull


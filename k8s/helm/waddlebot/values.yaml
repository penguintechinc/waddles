# Shared Environment Variables (applied to all modules)
sharedEnv:
  # Database Configuration
  DB_HOST: "postgresql"
  DB_PORT: "5432"
  DB_NAME: "waddlebot"
  DB_USER: "waddlebot"
  # DB_PASSWORD should be set via secrets
  DB_POOL_SIZE: "20"
  DB_MAX_OVERFLOW: "10"

  # Redis Configuration
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  # REDIS_PASSWORD should be set via secrets

  # SeaweedFS S3 gateway configuration (was MinIO)
  MINIO_ENDPOINT: "seaweedfs:8333"
  MINIO_SECURE: "false"
  # MINIO_ACCESS_KEY and MINIO_SECRET_KEY should be set via secrets

  # Ollama Configuration
  OLLAMA_HOST: "http://ollama:11434"
  OLLAMA_MODEL: "llama3.1"

  # Qdrant Configuration
  QDRANT_HOST: "qdrant"
  QDRANT_PORT: "6333"
  QDRANT_GRPC_PORT: "6334"

  # Router Configuration
  ROUTER_URL: "http://router:8000"

  # Hub Configuration
  HUB_URL: "http://hub:8060"

  # Logging Configuration
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  LOG_FILE_ENABLED: "true"
  LOG_FILE_PATH: "/var/log/waddlebotlog"
  LOG_FILE_MAX_BYTES: "10485760"
  LOG_FILE_BACKUP_COUNT: "5"

  # License Server
  LICENSE_SERVER_URL: "https://license.penguintech.io"
  RELEASE_MODE: "false"

  # Feature Flags
  ENABLE_METRICS: "true"
  ENABLE_TRACING: "false"
  ENABLE_PROFILING: "false"

# Persistent Volume Claims
persistence:
  logs:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteMany

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: "waddlebot"

# Pod Security Context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Container Security Context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL

# fix/chart-fresh-install-hooks (alpha 2026-10-01) -- shared wait-for-hub-api
# initContainer config (waddlebot.waitForHubApiInitContainer, _helpers.tpl), applied to
# every non-hub-api, non-infrastructure Deployment/Job in this chart. Image pinned to the
# exact digest hub_api/Dockerfile's own FROM line already uses (Debian-only per
# devops-containers.md; no new image to track/scan).
waitForHubApi:
  image: "python:3.13-slim-bookworm@sha256:a1165e272e578941b84abc79e4ab38a0305cd12803a5c4247979ac7655f4d641"
  stableChecks: 3
  stableIntervalSeconds: 5
  maxBackoffSeconds: 30

# Monitoring & Observability
monitoring:
  prometheus:
    enabled: false
    serviceMonitor:
      enabled: false
      interval: 30s

  grafana:
    enabled: false
    dashboards:
      enabled: false

# HTTPRoute Configuration (Cilium Gateway API)
httproute:
  enabled: false
  gatewayName: shared
  gatewayNamespace: gateway
  hostnames: []
  rules: []

# Network Policies — namespace-level ingress isolation
# When enabled, denies all cross-namespace ingress and allows only
# same-namespace traffic + ingress controller traffic.
networkPolicy:
  enabled: false
  ingressNamespace: ingress-nginx

# OTel collector — not yet deployed by this chart (tracked separately);
# stub so egressPolicy can conditionally allow data-plane egress to it once
# it exists, without another chart-wide feature landing first.
otel:
  collector:
    enabled: false

# Egress lockdown (CiliumNetworkPolicy) — feature/bundle-egress-gateway.
# All bundle network access (app bundles' net.http via the in-process guard
# core/bundle_host_http, feature/svc-process-http-capability, PLUS connector
# bundles' platform traffic run by svc-ingest/svc-action) goes through the
# host's egress proxy below. Data-plane pods (svc-ingest/svc-process/
# svc-action, Rust AND legacy per-module Deployments performing the same
# role) are default-deny for egress to the internet; the only path out is
# the egress-proxy Service. Disabled == the CNPs below aren't rendered at
# all, which is a real security regression outside alpha/local — enforced
# by a `fail` guard in templates/infrastructure/egress-proxy.yaml.
egressPolicy:
  enabled: true
  # Components (app.kubernetes.io/component label values) subject to the
  # egress default-deny. Extend as more Rust dataplane Deployments land.
  dataPlaneComponents:
    - svc-ingest
    - svc-ingest-rust
    - svc-process
    - svc-process-rust
    - svc-action
    - svc-action-rust
    - discord-collector
    - twitch-collector
    - slack-collector
    - teams-collector
    - kick-collector
    - mattermost-collector
    - googlechat-collector
    - youtube-live-collector
    - trigger-webhooks
    - trigger-streaming
    - action-platforms
    - action-serverless
  # In-cluster destinations the data plane is still allowed to reach
  # directly (everything else in-cluster is same-namespace-only via
  # network-policies.yaml; these are the specific service ports needed).
  # postgresReplicaPort currently points at the same primary Postgres
  # (infrastructure.postgresql) — no read replica is provisioned yet (see
  # pipeline.rustDataPlane.svcProcess.dbReaderHost's own comment); this
  # becomes a distinct endpoint once one exists, no CNP change needed.
  # NOTE: values.yaml is raw YAML, not template-evaluated — these mirror
  # infrastructure.redis.service.port / infrastructure.postgresql.service.port
  # / pipeline.hubApi.grpcPort / infrastructure.seaweedfs.service.s3Port above;
  # keep in sync if those change.
  inCluster:
    dnsPort: 53
    valkeyPort: 6379
    postgresReplicaPort: 5432
    hubApiGrpcPort: 50204
    seaweedfsPort: 8333
    otelGrpcPort: 4317
  # CIDRs that must NEVER be reachable via the egress proxy's "world" allow,
  # even though the proxy needs broad internet + customer-private-range
  # reach for net.http.private-ip grants. Set podCidr/serviceCidr/nodeCidr
  # per-cluster in each env's values file — these vary per install.
  denyCidrs:
    - "127.0.0.0/8"      # loopback
    - "::1/128"          # loopback v6
    - "169.254.0.0/16"   # link-local incl. cloud metadata (169.254.169.254)
    - "fe80::/10"        # link-local v6
  clusterCidrs:
    podCidr: "10.244.0.0/16"
    serviceCidr: "10.96.0.0/12"
    nodeCidr: "10.0.0.0/8"

# Egress proxy — the ONLY data-plane component allowed to reach external
# addresses (net.http.fqdn / .public-ip / .private-ip grants). Design:
# dedicated rootless Rust CONNECT/forward proxy (crates/egress-proxy, new
# crate — in-line-of-traffic mandates Rust per critical-rules.md Data
# Plane); not Squid/etc — none of the org's already-pinned forward proxies
# support the per-request signed-allowlist re-check this needs, and a bare
# Cilium egress-gateway/FQDN policy can't express per-tenant/app identity
# either (see templates/network-policies-egress.yaml header for the full
# design write-up). SKELETON: no Dockerfile/CI image yet, pinned to the
# same debian:bookworm-slim digest already used as pipeline.goRuntimeImage
# as a placeholder — replace once the crate has its own CI-built image.
egressProxy:
  enabled: true
  environment: "alpha"
  # core/egress_proxy (feature/egress-proxy-service) -- bare repo name,
  # composed with global.imageRegistry/imageTag via the same
  # `waddlebot.legacyModuleImage` helper svc-action-rust/svc-process-rust
  # use (templates/infrastructure/egress-proxy.yaml). Build target:
  # `docker build -f egress_proxy/Dockerfile.rust -t
  # <registry>/waddlebot-egress-proxy:<tag> .` run from `core/` (the
  # PARENT of core/egress_proxy -- see that Dockerfile's own header
  # comment for why). CI fills imageTag with the built digest/tag; leave
  # empty here to fall back to global.imageTag.
  image: "waddlebot-egress-proxy"
  imageTag: ""
  port: 8443
  metricsPort: 9090
  replicas: 1
  # Ports the proxy itself is allowed to reach externally.
  allowedPorts:
    - 80    # plain HTTP (net.http.fqdn / .public-ip)
    - 443   # HTTPS + Discord gateway (wss over 443)
    - 6697  # Twitch IRC (TLS)
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
  # Signed allowlist header: hub-api signs a per-tenant/app grant set
  # (net.http.fqdn / .public-ip / .private-ip) that the in-process guard
  # (core/bundle_host_http, feature/svc-process-http-capability) attaches
  # to every proxied request; the proxy verifies the signature and
  # re-checks the destination against it — including which private-ip
  # ranges were actually granted — before opening the upstream connection.
  # So a compromised data-plane pod can reach the proxy but nothing beyond
  # what was actually granted to that tenant/app; a compromised proxy host
  # still can't reach loopback/link-local/metadata/cluster CIDRs (egressPolicy
  # .denyCidrs/.clusterCidrs, enforced at the network layer as a backstop).
  # Machine-JWT auth (core/service_auth) -- callers additionally need
  # `egress:connect` granted in serviceJwt.identities[*].allowedScopes
  # (see that block's own comment) on top of hub-api's existing
  # per-service scopes.
  machineJwtRequiredScope: "egress:connect"
  allowedCallerServices:
    - svc-ingest
    - svc-process
    - svc-action
  perTenantMaxConnections: 50
  # Quoted (not a bare int) -- Helm/Sprig's `quote` on a large value.yaml
  # int round-trips through Go's JSON-decoded float64 and can render in
  # scientific notation (e.g. "1.048576e+07"), which egress_proxy's
  # `u64` env parser then rejects. Quoting here keeps it a plain string
  # end to end.
  perTenantBandwidthBytesPerSec: "10485760"  # 10 MiB/s
  connectTimeoutSeconds: 10
  # Deliberately short (connector spec's egress assertion is minted
  # per-request, not cached like the machine JWT) -- bounds the replay
  # window if an assertion were ever intercepted. See
  # core/egress_proxy/src/assertion.rs module doc.
  assertionMaxTtlSeconds: 60

# SPIFFE/SPIRE workload identity (subchart: charts/spire). Off by default
# (opt-in per environment via values-alpha.yaml/values-beta.yaml/
# values-local.yaml). Only the values that differ from the subchart's own
# defaults (k8s/helm/waddlebot/charts/spire/values.yaml) are set here — see
# that chart's README for the full topology/registration-entry spec.
spire:
  enabled: false
  trustDomain: "penguintech.io"
  environment: "alpha"
  topology:
    role: child
    upstreamRoot:
      enabled: false

# Per-service EdDSA machine JWTs (feature/eddsa-machine-jwt) -- replaces
# the platform-wide HS256 shared SECRET_KEY / static API keys for
# service-to-service calls, starting with the new internal PII endpoints.
# SPIFFE-ready by design (see libs/flask_core/flask_core/service_jwt.py
# module docstring): retiring hub-api issuance for Skauswatch JWT-SVIDs
# later is a config change here, not a template rewrite.
serviceJwt:
  # hub-api-only: private key material comes from an externally-managed
  # Secret (`make generate-service-jwt-key`), never from values -- see
  # scripts/generate-service-jwt-key.sh. This block only names the Secret.
  signingSecretName: service-jwt-signing-key
  # Public half of every key still valid for verification, keyed by kid.
  # Safe to commit -- these are public keys. Populated by the "Public key"
  # line `make generate-service-jwt-key` prints after each rotation.
  publicKeys: {}
  audience: waddlebot-internal
  # Audience the bootstrap ServiceAccount token projection (below) must
  # request -- hub-api's TokenReview call rejects any other audience.
  # "hub-api" (not a generic "waddlebot-internal-bootstrap" string, security
  # review HIGH finding) -- binding the projected token's audience to the
  # specific resource server it authenticates to is what makes a stolen
  # bootstrap token useless against any other in-cluster TokenReview
  # consumer, standard "aud" scoping practice for workload-identity tokens.
  bootstrapAudience: hub-api
  # Per-service allow-list mapping a k8s ServiceAccount identity to a
  # SPIFFE-shaped service id + permitted scopes. hub-api is the only
  # consumer; it never trusts a caller-supplied service id.
  identities:
    svc-process:
      spiffeId: "spiffe://penguintech.io/{{ .Values.global.environment | default \"alpha\" }}/svc-process"
      serviceAccount: svc-process
      allowedScopes:
        - "identity:ephemeral:mint"
        # feature/egress-proxy-service -- required to call core/egress_proxy
        # for any bundle net.http/CONNECT egress.
        - "egress:connect"
    svc-action:
      spiffeId: "spiffe://penguintech.io/{{ .Values.global.environment | default \"alpha\" }}/svc-action"
      serviceAccount: svc-action
      allowedScopes:
        # feature/hub-grpc-env-wiring -- was "users:display-name:resolve", which does
        # not match hub_api/grpc_internal/servicers.py REQUIRED_SCOPES's
        # "identity:displayname:read" for ResolveDisplayNames (core/svc_action's
        # HUB_IDENTITY_RESOLVE_SCOPE). The mismatch would have minted a machine JWT
        # missing the scope the server's AuthInterceptor actually checks, so every
        # ResolveDisplayNames call would 403 even with a working connection.
        - "identity:displayname:read"
        - "egress:connect"
    # svc-ingest isn't in this Rust-data-plane identities map yet (still
    # legacy/Python) but is one of egressProxy.allowedCallerServices --
    # add its identity+`egress:connect` scope here once it mints machine
    # JWTs, matching svc-process/svc-action above.
  # Every calling pod projects its own ServiceAccount token bound to
  # `bootstrapAudience` -- this is the bootstrap credential, no shared
  # secret distributed to callers. Reusable via the
  # `waddlebot.serviceJwtBootstrapVolume` named template
  # (templates/_service_jwt.tpl) -- add its volume/volumeMount output to
  # any deployment that calls hub-api's /internal/service-token endpoint.
  bootstrapTokenProjection:
    expirationSeconds: 3600
    path: service-jwt-bootstrap-token

# feature/helm-auto-provision-keys -- deploys must never require a human to run a
# script before `helm install`/`helm upgrade` succeeds. Every Secret below is looked
# up first (an existing Secret is KEPT untouched, never regenerated/rotated by this
# chart) and only auto-GENERATED on a miss when global.deploymentTier is "alpha" or
# "local". Outside those two tiers a miss render-fails the release unless
# `externalSecret: true` is set (meaning an ExternalSecret/SealedSecret/other
# out-of-band controller owns this Secret name and will populate it before the
# consuming workload starts) or the Secret was pre-created by an operator. See
# templates/auto-provisioned-secrets.yaml (symmetric keys, pure Helm template) and
# templates/auto-provisioned-keys-job.yaml (Ed25519 keys, needs openssl -- Sprig/Helm
# has no Ed25519-pubkey-from-privkey primitive) + chart README "Self-provisioned
# platform keys" section.
autoProvisionedKeys:
  # feature/seaweedfs-object-storage -- SeaweedFS S3 gateway SSE-S3 KEK (replaces
  # the former MinIO static-KMS key from PR #439; renamed off "minio" since the
  # backing store changed, secretName kept distinct from the old "minio-kms" so
  # existing alpha installs get a fresh key rather than silently reusing one in
  # a format MinIO required (label:base64) that SeaweedFS does not accept).
  # infrastructure.seaweedfs.encryption.secretName should point at this same
  # name. Value format: 64 lowercase hex chars (256-bit key), per SeaweedFS's
  # WEED_S3_SSE_KEK requirement.
  seaweedfsSseKek:
    secretName: "seaweedfs-sse-kek"
    secretKey: "WEED_S3_SSE_KEK"
    externalSecret: false
  # feature/tenant-dek-broker (PR #442) -- platform-baseline root KEK wrapping every
  # tenant's DEK (hub_api/services/tenant_keystore.py::K8sSecretKekProvider,
  # kek_hex_env_var="TENANT_KEK_HEX"). Value MUST be lowercase hex (bytes.fromhex()),
  # never base64 -- see templates/auto-provisioned-secrets.yaml's derivation comment.
  tenantKek:
    secretName: "waddlebot-tenant-kek"
    secretKey: "TENANT_KEK_HEX"
    externalSecret: false
  # feature/bundle-artifact-signing (PR #431) -- platform Ed25519 keypair signing
  # every approved bundle. Private half: BUNDLE_SIGNING_PRIVATE_KEY/
  # BUNDLE_SIGNING_KEY_ID in secretName (hub-api only). Public half: published to
  # publicKeyConfigMapName for the bundle-executor(s) to mount -- the private key is
  # NEVER mounted anywhere but hub-api.
  bundleSigning:
    secretName: ""  # default: "<fullname>-bundle-signing" when empty
    publicKeyConfigMapName: ""  # default: "<fullname>-bundle-signing-public" when empty
    keyId: "waddlebot-1"
    externalSecret: false
  # feature/eddsa-machine-jwt (PR #438) -- per-service EdDSA machine-JWT signing key.
  # Private half: SERVICE_JWT_PRIVATE_KEY_<kid>/SERVICE_JWT_ACTIVE_KID in secretName
  # (hub-api only, the sole issuer). Public half: published to
  # publicKeyConfigMapName for hub-api's own verification path and any other service
  # that needs to verify a service JWT without holding the signing key.
  serviceJwt:
    secretName: "service-jwt-signing-key"
    publicKeyConfigMapName: ""  # default: "<fullname>-service-jwt-public" when empty
    keyId: "waddlebot-1"
    externalSecret: false

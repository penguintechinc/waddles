# Cloud Provider Configuration (AWS Lambda, GCP Functions, etc.) -- non-secret
# region/project config only; access keys/service-account keys live in
# platformCredentials above.
aws:
  region: "us-east-1"

gcp:
  projectId: ""
  region: "us-central1"

openwhisk:
  apiHost: "http://openwhisk-service:3233"
  authKey: "23bc46b1-71f6-4ed5-8c54-816aa4f8c502:123zO3xZCLrMN6v2BKK1dXYFpXlPkccOFqm12CdAsMgRU4VrNZ9lyGVCGuMDGIwP"
  namespace: "guest"
  insecure: "true"

waddleai:
  baseUrl: ""

# Connector Configuration (svc-ingest channels and overrides)
config:
  # Twitch IRC receiver — comma-separated list of channel names to monitor
  twitchChannels: ""
  # Kick Pusher receiver — comma-separated list of channel slugs to monitor
  kickChannels: ""
  # Kick Pusher PUBLIC client key (not a secret, Kick's public key for websocket)
  kickPusherKey: ""
  # Kick Pusher cluster (e.g. "mt1" — empty uses Kick's default)
  kickPusherCluster: ""
  # YouTube Live poll receiver — comma-separated list of channel IDs to monitor
  youtubeLiveChannels: ""
  # RSI Spectrum one-way ingest (gh #101) — comma-separated forum channel ids / lobby ids
  spectrumForumChannels: ""
  spectrumLobbies: ""
  # ENV baseline for flag waddles.spectrum-integration (default OFF; PostHog overrides when connected)
  spectrumIntegrationEnabled: false
  # Spectrum org sync (gh #101) — comma-separated Spectrum community ids; each gets a roster + an
  # events poller (snapshot-diffed in Valkey). Needs spectrumIntegrationEnabled AND spectrumOrgSyncEnabled.
  spectrumOrgCommunities: ""
  # ENV baseline for flag waddles.spectrum-org-sync (default OFF; PostHog overrides when connected)

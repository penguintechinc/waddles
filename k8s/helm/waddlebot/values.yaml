# Waddles Helm Chart - Default Values
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Webui Configuration
webui:
  publicUrl: ""
  # Public hostnames of THIS deployment; hub-webui forwards X-Forwarded-Host only for these.
  publicHostnames: []
  # #320 Connections: OAuth redirect_uri base. Empty by default -- hub-api falls back
  # to publicUrl above when blank. See values-alpha.yaml for why this needs its own
  # override in some environments.
  connectionsCallbackBaseUrl: ""
  # IDENTITY_CALLBACK_BASE_URL for hub-api (Discord bot-install + identity callbacks).
  # Empty = env not set, hub-api defaults to http://localhost:8204.
  identityCallbackBaseUrl: ""

# Global settings
global:
  # Container registry for Waddles images
  # For GitHub Container Registry: ghcr.io/owner/repo
  # For Docker Hub: docker.io/waddlebot
  # For local registry: localhost:32000/waddlebot
  imageRegistry: "docker.io/waddlebot"

  # Image tag to deploy (e.g., "latest", commit SHA, or version tag)
  imageTag: "latest"

  # Image pull policy -- applied to EVERY workload container (hub-api, svc-*-rust,
  # svc-bundles-executor included; no template hardcodes a policy). IfNotPresent is correct
  # given unique per-deploy global.imageTag values; and mandatory for locally-loaded images
  # (kind e2e, alpha local builds), where Always forces a registry pull the node cannot
  # satisfy. Override to Always per-env only for a mutable tag.
  imagePullPolicy: IfNotPresent

  # Secrets for pulling from private registries (if needed)
  imagePullSecrets: []

  # Default storage class for persistent volumes
  storageClass: "standard"

  # OVERRIDE REQUIRED: override via --set or values override file
  # Security secrets (set via kubectl create secret or values override)
  # Defaults match docker-compose.yml for local development consistency
  jwtSecret: "REPLACE_ME_jwt_secret"
  moduleSecretKey: "REPLACE_ME_module_secret"
  serviceApiKey: "REPLACE_ME_service_key"

  # hub-api-v3 Connections (#320): symmetric key used to encrypt stored per-community
  # OAuth tokens at rest. Empty by default (never a literal here) -- see secrets.yaml
  # for the generation command; OVERRIDE REQUIRED via --set or an out-of-git values
  # override / ExternalSecret before Connections can be used in any environment.
  credentialEncryptionKey: ""

  # feature/e2e-helm-rust-dataplane -- core/svc_action (Rust) envelope hop-verification HMAC
  # keyring (see templates/secrets.yaml ENVELOPE_BINDING_KEYS). Empty by default (fail
  # closed); OVERRIDE REQUIRED via --set or an out-of-git values override / ExternalSecret
  # before hop verification will accept any envelope.
  envelopeBindingKeys: ""

  # e2e-helm-rust-dataplane -- mTLS material for the svc-bundles-executor<->stage host-API wire
  # protocol (core/bundle_executor dialing svc-action's/svc-process's HOST_API_PORT, spec
  # docs/superpowers/specs/2026-09-14-rust-data-plane-design.md SS6.6). Mirrors global.grpcTls's
  # two-path shape (static Secret vs cert-manager) but is its OWN CA/cert -- a different wire
  # protocol on a different port, never conflated with the gRPC identity above.
  #
  # UNLIKE global.grpcTls, there is NO insecureDev/plaintext escape hatch here: the Rust
  # host-API server (core/svc_action/src/host_api.rs build_server_config) and client
  # (core/bundle_executor/src/tls.rs build_client_config) both fail closed without real
  # cert/key/CA material -- mTLS is mandatory, not optional, per spec SS6.6 "Both peers
  # present certificates". A missing/empty Secret here means the executor<->stage host-API
  # link simply never establishes (svc-action's host-api listener logs a warning and keeps
  # its HTTP/metrics servers up regardless -- see try_start_host_api's graceful-degradation
  # comment -- and svc-bundles-executor retries the dial forever with capped exponential backoff,
  # so neither pod crashloops); only the executor-invoked-bundle path stays inert.
  #
  # fix/alpha-host-api-tls -- templates/host-api-tls-secret.yaml now guarantees the
  # <fullname>-host-api-tls Secret exists (kept, explicitly supplied, generated alpha/local,
  # or the whole release fails to render) whenever pipeline.rustDataPlane.enabled is true,
  # exactly mirroring global.valkeyTls's self-provisioning policy -- alpha/local no longer
  # need real PEM material supplied out of band. beta/gamma/production still REQUIRE real
  # material (--set-file global.hostApiTls.ca.crt=... --set-file global.hostApiTls.tls.crt=...
  # --set-file global.hostApiTls.tls.key=...), cert-manager (certManager.enabled=true), or
  # externalSecret: true delegating to an out-of-band controller -- auto-generation is
  # alpha/local only, fails closed otherwise.
  hostApiTls:
    certManager:
      enabled: false
      issuerKind: "ClusterIssuer"
      issuerName: "waddlebot-internal-ca"
      duration: "2160h"    # 90d
      renewBefore: "360h"  # 15d
    # Static dev/interim CA + identity cert, used when certManager.enabled=false (the
    # default). NEVER a literal cert/key in git in any environment; populate via
    # --set-file or an out-of-git values override / ExternalSecret.
    ca:
      crt: ""
    tls:
      crt: ""
      key: ""
    # fix/alpha-host-api-tls -- true delegates provisioning of the <fullname>-host-api-tls
    # Secret to an out-of-band ExternalSecret/SealedSecret controller instead of failing the
    # render on beta/gamma/production. Alpha/local ignore this flag entirely (auto-generated
    # instead, see templates/host-api-tls-secret.yaml).
    externalSecret: false
    # fix/chart-host-api-stage-identity -- core/bundle_executor/src/config.rs requires
    # HOST_API_STAGE_IDENTITY (the stage cert's pinned CN/URI SAN, see
    # waddlebot.hostApiStageIdentity in _helpers.tpl). Left empty, the chart derives this
    # itself ONLY when it also mints the cert (alpha/local genSignedCert path, or
    # certManager.enabled=true). When ca.crt/tls.crt/tls.key are supplied directly, or
    # externalSecret is true, the chart has no visibility into that cert's actual identity --
    # set this explicitly to the matching CN/URI SAN, or the render fails closed.
    stageIdentity: ""

  # fix/hub-grpc-tls-and-ca-trust (PR #570 review blockers 1/2) -- TLS material for
  # hub-api's internal gRPC listener (hub_api/grpc_internal/server.py, mandatory TLS, no
  # insecureDev escape hatch). SEPARATE from global.grpcTls (the core-data/core-identity/
  # interactive-productivity/action-serverless identity) -- hub-api needs its own
  # alpha/local auto-generate fallback (templates/hub-api-grpc-tls-secret.yaml), which
  # global.grpcTls's static-only Secret doesn't have. Also the CA core/hub_client::
  # HubClient::connect trusts via HUB_API_GRPC_CA_FILE (svc-process-rust/svc-action-rust).
  # NEVER a literal cert/key in git in any environment; populate via --set-file or an
  # out-of-git values override / ExternalSecret.
  hubApiGrpcTls:
    ca:
      crt: ""
    tls:
      crt: ""
      key: ""
    # true delegates provisioning of the <fullname>-hub-api-grpc-tls Secret to an
    # out-of-band ExternalSecret/SealedSecret controller instead of failing the render on
    # beta/gamma/production. Alpha/local ignore this flag entirely (auto-generated instead).
    externalSecret: false

  # fix/valkey-tls-alpha -- TLS material for the Valkey (infra-redis) cache/streams
  # listener. `penguin_spine::SpineConfig::validate()` (core/svc_process, core/svc_action,
  # core/svc_ingest) fails closed when SECURITY_TRANSPORT_TLS=true (the default -- never
  # weakened to false here, see infrastructure.redis.tls's own comment) and VALKEY_URL is
  # not rediss://valkeys://. This is SERVER-AUTH-ONLY TLS (redis-rs `TlsCertificates {
  # client_tls: None, root_cert: Some(ca_pem) }`, per core/svc_action/src/usage.rs and
  # penguin-spine's own client.rs) -- client pods need only the CA to verify the server,
  # never their own cert/key, so only global.valkeyTls.ca.crt is mounted into the 3 Rust
  # data-plane pods (see templates/_helpers.tpl waddlebot.valkeyTlsCaVolume); tls.crt/
  # tls.key are the Valkey server's own identity, mounted only into templates/
  # infrastructure/redis.yaml. Static dev/interim CA + identity cert; NEVER a literal
  # cert/key in git in any environment -- populate via `helm upgrade --set-file
  # global.valkeyTls.ca.crt=... --set-file global.valkeyTls.tls.crt=...
  # --set-file global.valkeyTls.tls.key=...` (or an out-of-git values override /
  # ExternalSecrets/SealedSecrets) before infrastructure.redis.tls.enabled=true.
  # feature/transit-tls-core -- in-cluster transit TLS for Postgres (F1) and the SeaweedFS S3 gateway (F5).
  # One chart-owned ECDSA P-256 / SHA-256 CA signs a server leaf for each; clients mount ONLY the CA and
  # verify (Postgres sslmode=verify-full, S3 https with the CA pinned, system roots disabled). See
  # templates/_transit_data_tls.tpl for the design, templates/transit-tls-secret.yaml for the provisioning policy.
  # alpha/local self-generate (lookup-keep); beta/gamma/production REQUIRE material below (never a literal in git)
  # or externalSecret: true. There is NO plaintext toggle: Postgres and SeaweedFS are TLS-only whenever enabled.
  # Negotiation: TLS 1.3 preferred / 1.2 minimum, ECDSA P-256, P-256 key exchange, AES-128-GCM or ChaCha20-Poly1305,
  # session resumption on, pooled keep-alive clients. Customers wanting stronger protection can additionally enable
  # CNI encryption (e.g. Cilium WireGuard) -- see docs/transit-encryption.md.
  transitTls:
    # DEDICATED trust root: when certManager.enabled (dal2alpha/beta/gamma/production) the chart renders a SelfSigned Issuer ->
    # root CA Certificate -> namespaced CA Issuer, all in the release namespace, and the Postgres, SeaweedFS S3 and Valkey server
    # certs come from it (FQDN-only SANs, no wildcard). Data-store clients trust ONLY that root, so nothing signed by the
    # cluster-wide waddlebot-internal-ca (host-API/gRPC/hub-api trust domain) is accepted for a data store. Requires cert-manager
    # (with the NameConstraints feature gate). enabled=false (local / values-alpha) self-generates the chart-owned CA below.
    certManager:
      enabled: false
      issuerKind: "ClusterIssuer"
      issuerName: "waddlebot-internal-ca"
      duration: "2160h"    # 90d
      renewBefore: "360h"  # 15d
    # Static dev/interim CA + identity cert, used when certManager.enabled=false (the
    # default). OVERRIDE REQUIRED for beta/gamma/production -- NEVER a literal cert/key in
    # git; populate via --set-file or an out-of-git values override / ExternalSecret.
    ca:
      crt: ""
    tls:
      crt: ""
      key: ""

  # e2e-helm-rust-dataplane -- mTLS material for the bundle-executor<->stage host-API wire
  # protocol (core/bundle_executor dialing svc-action's/svc-process's HOST_API_PORT, spec
  # docs/superpowers/specs/2026-09-14-rust-data-plane-design.md SS6.6). Mirrors global.grpcTls's
  # two-path shape (static Secret vs cert-manager) but is its OWN CA/cert -- a different wire
  # protocol on a different port, never conflated with the gRPC identity above.
  #
  # UNLIKE global.grpcTls, there is NO insecureDev/plaintext escape hatch here: the Rust
  # host-API server (core/svc_action/src/host_api.rs build_server_config) and client
  # (core/bundle_executor/src/tls.rs build_client_config) both fail closed without real
  # cert/key/CA material -- mTLS is mandatory, not optional, per spec SS6.6 "Both peers
  # present certificates". A missing/empty Secret here means the executor<->stage host-API
  # link simply never establishes (svc-action's host-api listener logs a warning and keeps
  # its HTTP/metrics servers up regardless -- see try_start_host_api's graceful-degradation
  # comment -- and bundle-executor retries the dial forever with capped exponential backoff,
  # so neither pod crashloops); only the executor-invoked-bundle path stays inert.
  #
  # fix/alpha-host-api-tls -- templates/host-api-tls-secret.yaml now guarantees the
  # <fullname>-host-api-tls Secret exists (kept, explicitly supplied, generated alpha/local,
  # or the whole release fails to render) whenever pipeline.rustDataPlane.enabled is true,
  # exactly mirroring global.valkeyTls's self-provisioning policy -- alpha/local no longer
  # need real PEM material supplied out of band. beta/gamma/production still REQUIRE real
  # material (--set-file global.hostApiTls.ca.crt=... --set-file global.hostApiTls.tls.crt=...
  # --set-file global.hostApiTls.tls.key=...), cert-manager (certManager.enabled=true), or
  # externalSecret: true delegating to an out-of-band controller -- auto-generation is
  # alpha/local only, fails closed otherwise.
  hostApiTls:
    certManager:
      enabled: false
      issuerKind: "ClusterIssuer"
      issuerName: "waddlebot-internal-ca"
      duration: "2160h"    # 90d
      renewBefore: "360h"  # 15d
    # Static dev/interim CA + identity cert, used when certManager.enabled=false (the
    # default). NEVER a literal cert/key in git in any environment; populate via
    # --set-file or an out-of-git values override / ExternalSecret.
    ca:
      crt: ""
    tls:
      crt: ""
      key: ""
    # fix/alpha-host-api-tls -- true delegates provisioning of the <fullname>-host-api-tls
    # Secret to an out-of-band ExternalSecret/SealedSecret controller instead of failing the
    # render on beta/gamma/production. Alpha/local ignore this flag entirely (auto-generated
    # instead, see templates/host-api-tls-secret.yaml).
    externalSecret: false
    # fix/chart-host-api-stage-identity -- core/bundle_executor/src/config.rs requires
    # HOST_API_STAGE_IDENTITY (the stage cert's pinned CN/URI SAN, see
    # waddlebot.hostApiStageIdentity in _helpers.tpl). Left empty, the chart derives this
    # itself ONLY when it also mints the cert (alpha/local genSignedCert path, or
    # certManager.enabled=true). When ca.crt/tls.crt/tls.key are supplied directly, or
    # externalSecret is true, the chart has no visibility into that cert's actual identity --
    # set this explicitly to the matching CN/URI SAN, or the render fails closed.
    stageIdentity: ""

  # fix/hub-grpc-tls-and-ca-trust (PR #570 review blockers 1/2) -- TLS material for
  # hub-api's internal gRPC listener (hub_api/grpc_internal/server.py, mandatory TLS, no
  # insecureDev escape hatch). SEPARATE from global.grpcTls (the core-data/core-identity/
  # interactive-productivity/action-serverless identity) -- hub-api needs its own
  # alpha/local auto-generate fallback (templates/hub-api-grpc-tls-secret.yaml), which
  # global.grpcTls's static-only Secret doesn't have. Also the CA core/hub_client::
  # HubClient::connect trusts via HUB_API_GRPC_CA_FILE (svc-process-rust/svc-action-rust).
  # NEVER a literal cert/key in git in any environment; populate via --set-file or an
  # out-of-git values override / ExternalSecret.
  hubApiGrpcTls:
    ca:
      crt: ""
    tls:
      crt: ""
      key: ""
    # true delegates provisioning of the <fullname>-hub-api-grpc-tls Secret to an
    # out-of-band ExternalSecret/SealedSecret controller instead of failing the render on
    # beta/gamma/production. Alpha/local ignore this flag entirely (auto-generated instead).
    externalSecret: false

  # fix/valkey-tls-alpha -- TLS material for the Valkey (infra-redis) cache/streams
  # listener. `penguin_spine::SpineConfig::validate()` (core/svc_process, core/svc_action,
  # core/svc_ingest) fails closed when SECURITY_TRANSPORT_TLS=true (the default -- never
  # weakened to false here, see infrastructure.redis.tls's own comment) and VALKEY_URL is
  # not rediss://valkeys://. This is SERVER-AUTH-ONLY TLS (redis-rs `TlsCertificates {
  # client_tls: None, root_cert: Some(ca_pem) }`, per core/svc_action/src/usage.rs and
  # penguin-spine's own client.rs) -- client pods need only the CA to verify the server,
  # never their own cert/key, so only global.valkeyTls.ca.crt is mounted into the 3 Rust
  # data-plane pods (see templates/_helpers.tpl waddlebot.valkeyTlsCaVolume); tls.crt/
  # tls.key are the Valkey server's own identity, mounted only into templates/
  # infrastructure/redis.yaml. Static dev/interim CA + identity cert; NEVER a literal
  # cert/key in git in any environment -- populate via `helm upgrade --set-file
  # global.valkeyTls.ca.crt=... --set-file global.valkeyTls.tls.crt=...
  # --set-file global.valkeyTls.tls.key=...` (or an out-of-git values override /
  # ExternalSecrets/SealedSecrets) before infrastructure.redis.tls.enabled=true.
  # feature/transit-tls-core -- in-cluster transit TLS for Postgres (F1) and the SeaweedFS S3 gateway (F5).
  # One chart-owned ECDSA P-256 / SHA-256 CA signs a server leaf for each; clients mount ONLY the CA and
  # verify (Postgres sslmode=verify-full, S3 https with the CA pinned, system roots disabled). See
  # templates/_transit_data_tls.tpl for the design, templates/transit-tls-secret.yaml for the provisioning policy.
  # alpha/local self-generate (lookup-keep); beta/gamma/production REQUIRE material below (never a literal in git)
  # or externalSecret: true. There is NO plaintext toggle: Postgres and SeaweedFS are TLS-only whenever enabled.
  # Negotiation: TLS 1.3 preferred / 1.2 minimum, ECDSA P-256, P-256 key exchange, AES-128-GCM or ChaCha20-Poly1305,
  # session resumption on, pooled keep-alive clients. Customers wanting stronger protection can additionally enable
  # CNI encryption (e.g. Cilium WireGuard) -- see docs/transit-encryption.md.
  transitTls:
    # ONE trust root: when certManager.enabled (dal2alpha/beta/gamma/production) the Postgres, SeaweedFS S3 AND Valkey
    # server certs are all issued by this ClusterIssuer (the same `waddlebot-internal-ca` the host-API/gRPC mTLS and the
    # hub-api HTTPS certs use; k8s/dal2alpha/internal-ca.yaml) with FQDN-only SANs (its nameConstraints permit nothing else)
    # and every client mounts that one CA. enabled=false (local / values-alpha) self-generates the chart-owned CA below.
    # issuerName is shared with global.internalTransitTls.certManager.issuerName (hub-api HTTPS): if that block exists and
    # sets an issuerName it wins, so there is a single place to repoint the trust root.
    certManager:
      enabled: false
      duration: "2160h"    # 90d leaf
      renewBefore: "360h"  # 15d
      # Dedicated root CA (<release>-transit-ca, self-signed, release namespace only); the namespaced Issuer
      # <release>-transit signs the leaves, so no other namespace can mint data-store certs.
      caDuration: "8760h"      # 1y
      caRenewBefore: "1440h"   # 60d
    ca:
      crt: ""
    postgres:
      tls:
        crt: ""
        key: ""
    seaweedfs:
      tls:
        crt: ""
        key: ""
    externalSecret: false

  valkeyTls:
    ca:
      crt: ""
    tls:
      crt: ""
      key: ""
    # fix/helm-alpha-self-provisioning -- true delegates provisioning of the
    # <fullname>-valkey-tls Secret to an out-of-band ExternalSecret/SealedSecret
    # controller instead of failing the render on beta/gamma/production. Alpha/local
    # ignore this flag entirely (auto-generated instead, see templates/infrastructure/
    # valkey-tls-secret.yaml).
    externalSecret: false

  # First-run super-admin bootstrap (PR #256, CWE-798 -- admin/hub_module backend
  # adminBootstrap.js / config/postgres/migrations/081_seed_default_hub_admin.sql). Both
  # unset (the default) means no admin account is auto-created -- fail closed, safe
  # default for beta/gamma/production. OVERRIDE REQUIRED to bootstrap a real first
  # super-admin -- NEVER a literal in git beyond alpha's own documented non-default
  # (values-alpha.yaml); set via --set or an out-of-git values override / ExternalSecret.
  initialAdmin:
    email: ""
    password: ""

  # Logging
  logLevel: "INFO"
  nodeEnv: "production"

  # Deployment tier (alpha/beta/production) — used by services for environment-specific behavior
  deploymentTier: "production"

# Per-family image-tag override for the `hub-api` image family -- pins hub-api independently
# of global.imageTag (every other workload keeps reading global.imageTag). Empty (default)
# falls back to global.imageTag, so unset = unchanged behavior for every environment.
# Applies ONLY to workloads pulling the `hub-api` image repository: the hub-api Deployment
# + role-sync / event-sync-reconcile / odoo-sync / bundle-signing-reconciler CronJobs + the
# bundle-signing-backfill hook Job. The SEPARATE images (seeder, migrations,
# svc-*, svc-bundles-executor, hub-webui, ...) are NOT affected -- they stay on global.imageTag.
# (Distinct from `pipeline.hubApi`, which holds hub-api's port/replicas/resources.)
hubApi:
  imageTag: ""
  # Trust X-Forwarded-Host (license bypass-domain check) from the in-cluster hub-webui proxy.
  # Topology only, never a license switch. Rendering FAILS if true while any HTTPRoute/Ingress
  # targets hub-api directly (only hub-webui may front it).
  trustForwardedHost: false
  # Peer CIDRs allowed to assert X-Forwarded-Host (required when trustForwardedHost is true).
  trustedProxyCidrs: []

# Namespace configuration
namespace: waddlebot
namespaceCreate: true  # Create namespace if it doesn't exist
# Extra labels stamped on the chart-managed Namespace (only when namespaceCreate: true), alongside the
# PSA labels. Used e.g. for a shared Gateway's allowedRoutes namespace selector (`gateway-access`).
namespaceLabels: {}

# fix/no-empty-kept-secrets -- test-only probe (templates/debug-helper-probe.yaml)
# that renders waddlebot.secretKeyNonEmpty/waddlebot.tlsSecretComplete (_helpers.tpl)
# against synthetic dicts, independent of `lookup` (which always returns empty
# outside a real `helm install`/`upgrade` -- see auto-provisioned-secrets.yaml's
# header comment). NEVER true in any real values file (values-alpha/beta/gamma/
# production.yaml) -- set only via `--set debugHelperProbe.enabled=true` in
# k8s/helm/waddlebot/tests/test_no_empty_kept_secrets_render.py.
debugHelperProbe:
  enabled: false

# Service Account
serviceAccount:
  create: true
  name: "waddlebot"
  annotations: {}

# Resource presets
resourcePresets:
  small:
    cpu: "100m"
    memory: "128Mi"
    cpuLimit: "500m"
    memoryLimit: "512Mi"
  medium:
    cpu: "250m"
    memory: "256Mi"
    cpuLimit: "1000m"
    memoryLimit: "1Gi"
  large:
    cpu: "500m"
    memory: "512Mi"
    cpuLimit: "2000m"
    memoryLimit: "2Gi"

# Infrastructure Services
infrastructure:
  # PostgreSQL Database
  postgresql:
    enabled: true
    username: "waddlebot"
    database: "waddlebot"
    password: "REPLACE_ME"  # Only used for secrets, actual DB already running
    image: postgres:16-bookworm@sha256:a0fd72825431f4b7fd3f9d5def9f370b9c22012f1a9e37ece1a5749b95333fb7
    # R5 posture: rootless. uid/gid 999 is the official image's own `postgres` user; fsGroup chowns
    # the PVC so an existing volume (formerly initialised by root->gosu as the same uid) stays
    # writable. Rootfs is read-only; the socket dir and /tmp are emptyDirs (templates/infrastructure/postgres.yaml).
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 999
      runAsGroup: 999
      fsGroup: 999
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 999
      runAsGroup: 999
      capabilities:
        drop: ["ALL"]
    service:
      name: "infra-postgres"
      port: 5432
      type: ClusterIP
    port: 5432
    replicas: 1
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "2000m"
        memory: "2Gi"
    persistence:
      enabled: true
      name: "postgres-data"
      size: 20Gi
      accessMode: ReadWriteOnce
      storageClass: ""
    env:
      POSTGRES_DB: waddlebot
      POSTGRES_USER: waddlebot
      # POSTGRES_PASSWORD should be set via secrets
    # waddles_bundle_reader (alembic/versions/0032_bundle_reader_role.py) --
    # the Rust data-plane's real, now-provisioned RO role for the DB-driven
    # multi-app active-bundle loader (core/svc_process, core/svc_action,
    # core/bundle_active_set). Empty ("", never "REPLACE_ME"-prefixed) is
    # treated as "unset" by templates/secrets.yaml's autoSecretValue lookup
    # -- auto-generated in alpha/local, required (must be set here) in
    # beta/gamma/production, same posture as postgresql.password above. An
    # unset value is NOT graceful-degradation safe here the way bundle
    # Migrator/RuntimePassword below are: it leaves the multi-app data-plane
    # path disabled, so beta/prod must set a real value.
    readerPassword: ""
    # Bundle app-schema roles (Phase 0, docs/superpowers/specs/2026-09-28-
    # bundle-db-capability-and-schemas.md Sec2) -- waddles_bundle_migrator
    # (DDL owner of app_core/app_community, hub-api only) and
    # waddles_bundle_runtime (DML-only, those two schemas; svc_process/
    # svc_action). Both are real LOGIN roles, unlike the NOLOGIN RBAC-matrix
    # roles above. Empty by default: alembic/versions/0030_bundle_app_schemas.py
    # treats an unset password as "create/keep the role LOGIN with no usable
    # password yet", never a migration failure -- same graceful-degradation
    # posture as readerPassword below. Set before relying on either role for
    # real traffic.
    bundleMigratorPassword: ""
    bundleRuntimePassword: ""
    # Bundle platform-table capability (waddles_platform_table, alembic 0079; column-scoped to the
    # allowlisted community_members columns + audit INSERT). EXPLICIT OPT-IN, default false: the role
    # stays NOLOGIN, migrations set no password, svc-process-rust gets no BUNDLE_PLATFORM_TABLE_* env.
    # enabled=true -> password PW_WADDLES_PLATFORM_TABLE in <release>-db-credentials (never in the
    # envFrom'd waddlebot-secrets): generated + kept on alpha/local, REQUIRED elsewhere (set `password`
    # via an out-of-git override or pre-populate serviceRoles.existingSecret with that key).
    platformTable:
      enabled: false
      password: ""
    # ---- Per-service database accounts (security findings H-1 / H-3) -----------------
    # `username`/`password` above are the database OWNER (superuser) credential. It is
    # rendered into <release>-db-admin (consumed ONLY by the Postgres Deployment's
    # POSTGRES_PASSWORD) and the db-migrate hook Secret -- NOT into waddlebot-secrets,
    # which ~40 pods envFrom. Every other workload connects as ITS OWN least-privilege role
    # from config/postgres/service-roles.yaml (provisioned by alembic 0055 and re-asserted
    # on every db-migrate Job run); see docs/DATABASE_CREDENTIALS.md.
    admin:
      # Operator/ExternalSecret-managed Secret with a POSTGRES_PASSWORD key. Empty =>
      # the chart renders <release>-db-admin (alpha/local: generated; beta/gamma/prod:
      # `password` above must be set explicitly, or the Secret pre-populated).
      existingSecret: ""
    serviceRoles:
      # Operator/ExternalSecret-managed Secret with a PW_<ROLE_UPPERCASE> key for EVERY
      # role below (e.g. PW_WADDLES_HUB_API). Empty => the chart renders
      # <release>-db-credentials: passwords are generated in alpha/local (and KEPT across
      # upgrades), and REQUIRED -- via `passwords` below or a pre-populated Secret -- in
      # beta/gamma/production. Values must be >=16 chars of [A-Za-z0-9._~-]; placeholder /
      # `changeme`-style values are rejected at render time. Never commit real values.
      existingSecret: ""
      passwords: {}   # {waddles_hub_api: "<secret>", ...} -- out-of-git override file only
      # MUST equal the role names in config/postgres/service-roles.yaml (drift-tested by
      # alembic/tests/test_service_roles_catalog.py). Order is irrelevant to the chart.
      roles:
        - waddles_hub_api
        - waddles_svc_ingest
        - waddles_svc_process
        - waddles_svc_core
        - waddles_svc_action
        - waddles_svc_presentation
        - waddles_svc_streaming
        - waddles_reputation
        - waddles_legacy_discord_collector
        - waddles_legacy_googlechat_collector
        - waddles_legacy_kick_collector
        - waddles_legacy_mattermost_collector
        - waddles_legacy_slack_collector
        - waddles_legacy_teams_collector
        - waddles_legacy_twitch_collector
        - waddles_legacy_youtube_live_collector
        - waddles_legacy_ai_researcher
        - waddles_legacy_core_community
        - waddles_legacy_core_data
        - waddles_legacy_core_identity
        - waddles_legacy_hub
        - waddles_legacy_marketplace
        - waddles_legacy_router
        - waddles_legacy_interactive_ai
        - waddles_legacy_interactive_gaming
        - waddles_legacy_interactive_media
        - waddles_legacy_interactive_productivity
        - waddles_legacy_interactive_social
        - waddles_legacy_interactive_loyalty
        - waddles_legacy_action_platforms
        - waddles_legacy_action_serverless
        - waddles_legacy_trigger_streaming
        - waddles_legacy_trigger_webhooks
    readReplicas:
      enabled: false
      count: 2

  # Redis Cache & Sessions
  redis:
    enabled: true
    image: valkey/valkey:8-bookworm@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571  # Valkey (Redis-compatible fork); Debian bookworm, digest-pinned
    # R5 posture: rootless (uid 999 = the image's `valkey` user); only /data (PVC/emptyDir) is written.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 999
      runAsGroup: 999
      fsGroup: 999
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 999
      runAsGroup: 999
      capabilities:
        drop: ["ALL"]
    port: 6379
    password: "REPLACE_ME"  # Only used for secrets, actual Redis already running
    # Module-specific Redis passwords (matches docker-compose.yml ACL setup)
    modulePasswords:
      admin: "REPLACE_ME"
      router: "REPLACE_ME"
      hub: "REPLACE_ME"
      workflow: "REPLACE_ME"
      ai: "REPLACE_ME"
      analytics: "REPLACE_ME"
      security: "REPLACE_ME"
      loyalty: "REPLACE_ME"
      spotify: "REPLACE_ME"
      ytmusic: "REPLACE_ME"
      twitch: "REPLACE_ME"
      discord: "REPLACE_ME"
      slack: "REPLACE_ME"
    maxMemory: "256mb"
    # SECURITY REVIEW FINDING (PR #425, low severity): this default,
    # `allkeys-lru`, is an eviction policy that CAN evict the Rust
    # data-plane's `bundlekv:...:count` keys (the per-app `storage.kv`
    # live-key-count quota counter -- `core/bundle_host_kv::scope::
    # KvScope::count_key`). Those counter keys are deliberately set with
    # NO TTL (non-volatile), so only an `allkeys-*` policy can evict them --
    # a `volatile-*` policy never touches a non-volatile key, and
    # `noeviction` never evicts anything. An evicted counter silently
    # resets an app's kv quota to what a background `SCAN`-based
    # reconciliation (`core/bundle_host_kv::backend::KvBackend::
    # reconcile_count_if_missing`) recomputes on the next write -- a
    # self-heal, not a substitute for the right policy. Both
    # `svc-process-rust`/`svc-action-rust` runtime-check this setting at
    # startup (`CONFIG GET maxmemory-policy`) and log `ERROR` + emit
    # `waddles_bundle_kv_maxmemory_policy_violation_total` if it is still
    # `allkeys-*` when they connect. **Recommended for any deployment
    # actually using `storage.kv`:** `noeviction` (refuses new writes at
    # capacity rather than evicting) or a `volatile-*` policy (safe for
    # `storage.kv` specifically, since its own keys never carry a TTL) --
    # left as `allkeys-lru` here only because other consumers of this same
    # instance (spine streams, usage-metering, relay queues) may
    # legitimately want size-bounded eviction; changing the cluster-wide
    # default is a capacity-planning decision, not something this fix
    # makes unilaterally.
    maxMemoryPolicy: "allkeys-lru"
    # fix/valkey-tls-alpha -- adds a `tls-port` listener ALONGSIDE the existing plaintext
    # `port` above (dual-listener: `redis-server --port 6379 --tls-port <this>` runs both),
    # so hub-api/Python services already on plaintext VALKEY_URL/REDIS_URL are never
    # disturbed. Only the 3 Rust data-plane pods (svc-process-rust/svc-action-rust/
    # svc-ingest-rust) are pointed at rediss://<service>:<tlsPort> -- see those templates'
    # VALKEY_URL override. Disabled by default (no cert material in the base chart, see
    # global.valkeyTls); enabled explicitly once real material is supplied. NEVER
    # SECURITY_TRANSPORT_TLS=false as the alternative -- that weakens a fail-closed check
    # `penguin_spine::SpineConfig::validate()` deliberately enforces.
    tls:
      # Default ON: the durable delivery Valkey is TLS-only and the render FAILS if it is
      # enabled without TLS (waddlebot.assertDurableTls). Non-alpha tiers must supply
      # global.valkeyTls material (cert rotation) -- see docs/valkey-durability.md.
      enabled: true
      port: 6380
    service:
      name: "infra-redis"
      port: 6379
      type: ClusterIP
    replicas: 1
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    persistence:
      enabled: true
      name: "redis-data"
      size: 5Gi
      accessMode: ReadWriteOnce
      storageClass: ""

  # Durable Valkey for in-flight delivery state (spine streams, outbound drain queues
  # `waddles:transport:*`, op_id acks, future interaction-token store). Split from the
  # LRU cache instance above (`infrastructure.redis`, sessions/bundlekv/cache) so delivery
  # state can NEVER be evicted: maxmemory-policy is hard-wired to `noeviction` in the
  # template and is deliberately NOT a value. Required for the 99.99% delivery SLA.
  #
  # STATEFUL EXCEPTION (approved) -- StatefulSet + volumeClaimTemplates instead of the
  # chart's Deployment+Recreate+PVC convention; user approval 2026-10-23 for the delivery SLA.
  #
  # Topology: valkey-durable-0 = primary, valkey-durable-1..N-1 = warm replicas (`replicaof`
  # ordinal 0). The `service` below pins to ordinal 0 only. NO Sentinel: the Rust
  # `penguin_spine` client (ce638ec / 0.2.0) cannot do Sentinel/Cluster discovery, so
  # automatic failover would promote a replica the clients never find. Recovery today =
  # StatefulSet reschedules ordinal 0 on its own PVC (crash-durable via AOF); replicas are a
  # warm copy for manual promotion. See docs/valkey-durability.md.
  # When disabled, the VALKEY_DURABLE_* secret keys fall back to the cache instance (legacy behaviour).
  valkeyDurable:
    enabled: true
    image: valkey/valkey:8-bookworm@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
    # Dedicated password (own secret key VALKEY_DURABLE_PASSWORD). REPLACE_ME => auto-generated
    # alpha/local only; beta/gamma/prod must set it explicitly (or pre-populate the Secret).
    password: "REPLACE_ME"
    # Full-access ACL `admin` user (replication masteruser + break-glass); app clients use the
    # restricted `default` user (password above). alpha/local: auto-generated when REPLACE_ME.
    # beta/gamma/prod: REQUIRED -- set a FRESH value (the old admin password is COMPROMISED); the
    # render fails closed if unset/REPLACE_ME*.
    adminPassword: "REPLACE_ME"
    # Non-secret rotation trigger rendered as pod annotation valkey.waddles/admin-revision.
    # Rotating the admin password? Update the value/Secret AND bump this -> primary+replicas restart.
    adminPasswordRevision: "1"
    port: 6379
    # 1 primary + (replicas-1) warm replicas.
    replicas: 2
    # Headroom under resources.limits.memory (~60%): AOF-rewrite fork COW + replication
    # buffers + client buffers live OUTSIDE maxmemory. At maxmemory writes fail LOUDLY (OOM
    # error) rather than evicting -- alert on used_memory/maxmemory > 0.8.
    maxMemory: "600mb"
    # Liveness/readiness exec probe timeout (seconds); raise when the instance is CPU-starved by handshake bursts.
    probeTimeoutSeconds: 5
    aof:
      # `everysec` = <=1s loss on host crash. `always` fsyncs every write (zero-loss for
      # acks/tokens) at a large throughput cost -- instance-wide, Valkey has no per-key fsync.
      appendfsync: "everysec"
      rewritePercentage: 100
      rewriteMinSize: "64mb"
    persistence:
      # Rendering FAILS if false -- durable state never lands on emptyDir.
      enabled: true
      size: 5Gi
      accessMode: ReadWriteOnce
      # alpha: cluster default (local-path); beta: longhorn.
      storageClass: ""
    # soft = preferred anti-affinity (single-node alpha); hard = required (prod).
    antiAffinity: "soft"
    pdb:
      enabled: true
    service:
      name: "infra-valkey-durable"
      port: 6379
      headlessName: "valkey-durable-headless"
    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"

  # Dedicated bundle-kv Valkey (quota counters / bundle key-value state). SIMPLE by design:
  # a single pod, NO replication/Sentinel/admin user -- quota is not on the 99.99% delivery
  # path (a brief restart degrades quota checks, never delivery). Split from BOTH other
  # instances: bundle-kv quota counters are integrity-critical, so they must NOT be evicted
  # (eviction = quota bypass -> `maxmemory-policy noeviction` is hard-wired in the template,
  # deliberately NOT a value) and must NOT fill the durable delivery instance.
  #
  # STATEFUL EXCEPTION (approved) -- 2026-10-23: StatefulSet + volumeClaimTemplates (PVC
  # retained) so quota survives restarts. Rootless (uid 999) preserved.
  # Password lives in its OWN Secret <fullname>-valkey-kv (never the envFrom'd shared one).
  # When disabled (local), bundle-kv env falls back to the cache instance.
  valkeyKv:
    enabled: true
    image: valkey/valkey:8-bookworm@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
    # REPLACE_ME => auto-generated alpha/local only; beta/gamma/prod must set it explicitly
    # (or pre-populate the <fullname>-valkey-kv Secret).
    password: "REPLACE_ME"
    port: 6379
    # Headroom under resources.limits.memory (~50%): AOF-rewrite fork COW + client buffers.
    # At maxmemory writes fail LOUDLY (never evict) -- alert on used_memory/maxmemory > 0.8.
    maxMemory: "128mb"
    aof:
      appendfsync: "everysec"
      rewritePercentage: 100
      rewriteMinSize: "32mb"
    persistence:
      # Rendering FAILS if false -- quota state never lands on emptyDir.
      enabled: true
      size: 1Gi
      accessMode: ReadWriteOnce
      storageClass: ""
    service:
      name: "infra-valkey-kv"
      port: 6379
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "250m"
        memory: "256Mi"

  # SeaweedFS Object Storage (replaces MinIO -- quay.io/minio/{minio,mc} started
  # returning 401 on anonymous pulls and Docker Hub never carried them; see
  # feature/seaweedfs-object-storage PR description for the full rationale).
  # PVC/Secret key names below intentionally still say "minio"/"MINIO_ROOT_*" in
  # a few spots for backward compatibility with existing alpha installs -- see
  # inline notes.
  seaweedfs:
    enabled: true
    # chrislusf/seaweedfs (Apache-2.0), official multi-arch image (linux/amd64,
    # linux/arm64, linux/arm/v7, linux/386), digest verified against an
    # anonymous `docker manifest inspect` pull on 2026-09-29.
    image: docker.io/chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    # amazon/aws-cli (Apache-2.0) used for idempotent bucket + default-encryption
    # initialization -- SeaweedFS's S3 API is AWS-S3-compatible so the stock
    # aws-cli works unmodified (no SeaweedFS-specific client needed).
    bucketInitImage: docker.io/amazon/aws-cli:2.37.6@sha256:82905aa8fdab6e2403b40dceec12dc33aea2535a4c2a6f13d596d98501951105
    s3Port: 8333
    masterPort: 9333
    bucketName: "waddlebot-assets"
    # Least-privilege S3 identities (one per workload, each its own
    # accessKey/secretKey pair), rendered into SeaweedFS's `weed server
    # -s3.config` identities.json at container start (templates/infrastructure/
    # seaweedfs.yaml). The former unscoped "waddlebot" admin identity
    # (Read/Write/List/Tagging/Admin across every bucket, fed by rootUser/
    # rootPassword/MINIO_ROOT_* below) has been REMOVED -- every consumer,
    # including svc-streaming's recordings path, now has its own
    # bucket-scoped identity. Same lookup(KEEP)-then-generate(alpha/local)-
    # or-require(else) provisioning policy for every identity below (see
    # templates/secrets.yaml waddlebot.autoSecretValue and _helpers.tpl):
    # "REPLACE_ME" here means "unset" -- alpha/local auto-generate and persist
    # via `lookup`+`resource-policy: keep`, beta/gamma/production MUST set a
    # real value (or pre-populate the waddlebot-secrets Secret out-of-band) or
    # the render fails.
    identities:
      # hub_api/services/storage_service.py -- reads/writes bundle components,
      # avatars, community logos. Read/Write/List/Tagging, scoped to BOTH
      # bucketName ("waddlebot-assets", avatars/community logos) AND
      # pipeline.rustDataPlane.bundleExecutor.bucketName ("waddles-bundles",
      # bundle components/sidecars -- shared with core-bundle-seeder-job.yaml,
      # which reuses this same identity) -- see templates/infrastructure/
      # seaweedfs.yaml's s3-identities.json rendering. regression: bundle
      # publish/fetch bucket split after SeaweedFS migration (#508/#509) --
      # this identity used to be scoped to bucketName only, so a bundle
      # publish "succeeded" into the wrong bucket and 404'd for every
      # svc-bundles-executor fetch (that identity, below, is correctly Read/List-
      # only on this SAME "waddles-bundles" bucket).
      hubApi:
        accessKey: "REPLACE_ME"
        secretKey: "REPLACE_ME"
      # core/bundle_executor (templates/svc-bundles-executor.yaml) -- the Rust data-plane's one credentialed
      # egress path (bucket.rs), a single unsigned-body GET of a compiled
      # component + its JSON sidecar. Read/List ONLY, scoped to
      # pipeline.rustDataPlane.bundleExecutor.bucketName ("waddles-bundles") --
      # this identity must NOT be able to PUT.
      dataPlane:
        accessKey: "REPLACE_ME"
        secretKey: "REPLACE_ME"
      # templates/infrastructure/seaweedfs.yaml's seaweedfs-bucket-init Job
      # ONLY -- Admin (bucket create/head + PutBucketEncryption), unscoped
      # since it must be able to create buckets that don't exist yet. Never
      # mounted by a long-running Deployment.
      bucketInit:
        accessKey: "REPLACE_ME"
        secretKey: "REPLACE_ME"
      # core/svc_streaming (templates/svc-streaming.yaml) -- egress::record's
      # only S3 calls are `put_opts`/`put_multipart_opts` against the
      # "recordings" bucket (finished HLS/recording segments); Read is also
      # granted for parity with the standard object_store Put-then-verify
      # path. Read/Write ONLY, scoped to the literal "recordings" bucket --
      # this identity must NOT reach "waddlebot-assets" or
      # pipeline.rustDataPlane.bundleExecutor.bucketName ("waddles-bundles").
      # Replaces the former "waddlebot" full-admin back-compat identity this
      # was the last consumer of.
      streaming:
        accessKey: "REPLACE_ME"
        secretKey: "REPLACE_ME"
      # core host stages (svc-process/svc-action `storage` capability, spec
      # 2026-11-06-bundle-object-storage) -- Read/Write/List/Tagging scoped to
      # bundleStorage.bucketName ONLY. Never given to a bundle (host-mediated).
      # Only rendered when bundleStorage.mode=bundled.
      bundleStorage:
        accessKey: "REPLACE_ME"
        secretKey: "REPLACE_ME"
    service:
      name: "infra-seaweedfs"
      type: ClusterIP
      s3Port: 8333
      masterPort: 9333
    replicas: 1
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
    # PVC name kept as "minio-data" on purpose -- existing alpha installs already
    # have this PVC bound; reusing the name lets the chart reattach to it without
    # a manual migration. Fresh installs get a PVC literally named "minio-data"
    # too, which is cosmetic only (see README.md Migration Notes for the
    # documented rename-and-copy path if a clean name is ever wanted).
    persistence:
      enabled: true
      name: "minio-data"
      accessMode: ReadWriteOnce
      storageClass: ""
      size: 50Gi
    # At-rest encryption (security.md Encryption: Storage -- mandatory baseline,
    # no opt-out). SeaweedFS's S3 gateway implements SSE-S3 with envelope
    # encryption: a KEK (key-encryption-key) wraps a per-object DEK. Without an
    # explicit KEK, SeaweedFS auto-generates one and persists it on the filer --
    # fine for throwaway alpha, not acceptable for beta/gamma/production where
    # losing the filer volume must not silently rotate the encryption key.
    # secretName sources WEED_S3_SSE_KEK (hex-encoded 256-bit key) from a
    # pre-created Secret (never a literal key in git, never chart-managed) --
    # generate with `make generate-seaweedfs-sse-key` /
    # scripts/generate-seaweedfs-sse-key.sh. This replaces the former MinIO
    # KMS/minio-kms Secret -- see autoProvisionedKeys.seaweedfsSseKek below.
    # secretName is empty here (fail-closed baseline for beta/gamma/production,
    # see templates/infrastructure/seaweedfs.yaml's fail guard); alpha documents
    # its own default in values-alpha.yaml.
    encryption:
      enabled: true
      secretName: ""
      secretKey: "WEED_S3_SSE_KEK"
      # Default bucket encryption (SSE-S3) applied via the S3 PutBucketEncryption
      # API in the bucket-init Job, so objects written without explicit SSE
      # headers are still encrypted at rest.
      autoEncryptBucket: true

  # Ollama AI Backend
  ollama:
    enabled: true
    image: ollama/ollama:latest@sha256:bfc9c6d53cc6989aa5131a6fde6b162b2802d4d337657f3253b5f69579bddeee
    # R5 posture: rootless. The model store moves from /root/.ollama to $HOME/.ollama
    # (HOME=/home/ollama, same PVC, so already-pulled models are kept); /tmp is an emptyDir.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      capabilities:
        drop: ["ALL"]
    port: 11434
    defaultProvider: "ollama"
    defaultModel: "tinyllama"
    service:
      name: "ai-ollama"
      port: 11434
    replicas: 1
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "2000m"
        memory: "2Gi"
    persistence:
      enabled: true
      name: "ollama-data"   # templates/infrastructure/ollama.yaml PVC name (was unset: empty-name PVC, `helm lint` warning)
      accessMode: ReadWriteOnce
      size: 30Gi
    gpu:
      enabled: false
      count: 1

  # Qdrant Vector Database
  qdrant:
    enabled: true
    image: qdrant/qdrant:latest@sha256:75eab8c4ba42096724fdcfde8b4de0b5713d529dde32f285a1f86fdcb2c9e50c
    # R5 posture: rootless. The image defaults to root; qdrant only needs /qdrant/storage (PVC),
    # /qdrant/snapshots and /tmp (emptyDirs, templates/infrastructure/qdrant.yaml).
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      capabilities:
        drop: ["ALL"]
    port: 6333
    grpcPort: 6334
    service:
      name: "infra-qdrant"
      port: 6333
    replicas: 1
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
    persistence:
      enabled: true
      name: "qdrant-data"   # templates/infrastructure/qdrant.yaml PVC name (was unset: empty-name PVC, `helm lint` warning)
      accessMode: ReadWriteOnce
      size: 10Gi

  # Apache OpenWhisk (Serverless)
  openwhisk:
    enabled: false
    # OpenWhisk requires complex setup - typically deployed separately
    apiHost: ""
    apiKey: ""

# PostHog (Community Edition, trimmed) — self-hosted feature-flag execution
# plane. DISABLED by default; enable per-env by setting posthog.enabled: true
# (see values-alpha.yaml / values-beta.yaml for override examples). Deploys
# into this chart's own namespace (.Values.namespace) alongside the rest of
# waddlebot — see templates/infrastructure/posthog/.
#
# Trimmed stack (per docs/posthog-feature-flags.md in license-server, the
# canonical reference for this deployment): web + worker + postgres +
# redis(valkey) + clickhouse + kafka(redpanda). Object storage (MinIO) is
# omitted — no session-replay export needed for flag evaluation. Budget
# ~4GB RAM total for this stack; never enable in resource-constrained tiers
# without sizing it in explicitly (see values-alpha.yaml).
#
# App modules read POSTHOG_HOST (ConfigMap) + POSTHOG_API_KEY (Secret) —
# see templates/configmap.yaml / templates/secrets.yaml. POSTHOG_HOST
# resolves to the in-cluster posthog-web Service when posthog.enabled=true
# and posthog.host is left blank, otherwise to the external value below
# (the hosted license.penguintech.io PostHog) — see
# waddlebot.posthog.effectiveHost in templates/infrastructure/posthog/_helpers.tpl.
posthog:
  enabled: false

  # POSTHOG_HOST override. Leave blank ("") to auto-resolve: in-cluster
  # posthog-web Service when posthog.enabled=true, else the external
  # hosted default (https://license.penguintech.io).
  host: ""

  # POSTHOG_API_KEY (personal/project API key, feature_flag:read scope) moved
  # to the `waddlebot-platform-credentials` Secret -- see `platformCredentials`
  # above -- so an untouched/placeholder value here can never overwrite a
  # real key on `helm upgrade` (fix/helm-platform-credentials).

  # PostHog's OWN secrets (SECRET_KEY / POSTGRES_PASSWORD / CLICKHOUSE_PASSWORD)
  # — distinct from apiKey above. NEVER commit literals. Provide ONE of:
  #   1) existingSecret: name of a pre-created Secret with those three keys
  #   2) secrets.create=true + secrets.SECRET_KEY / secrets.POSTGRES_PASSWORD
  #      via --set (alpha/local only — never beta/prod)
  # Chart fails to render (via `fail`) if posthog.enabled=true and neither
  # is configured.
  existingSecret: ""
  secrets:
    create: false
    SECRET_KEY: ""
    POSTGRES_PASSWORD: ""
    CLICKHOUSE_PASSWORD: ""

  # feature/alpha-localized-posthog -- auto-provisioning for the in-cluster
  # PostHog above. A post-install/post-upgrade hook Job (templates/
  # infrastructure/posthog/bootstrap.yaml) signs up the first admin user,
  # resolves the org/project, mints a personal API key, and writes it to a
  # NEW, chart-owned Secret (bootstrap.secretName) -- NEVER into
  # `waddlebot-platform-credentials` (see platformCredentials above /
  # docs/PLATFORM_CREDENTIALS.md; that Secret stays exclusively
  # operator-managed). Idempotent: skips entirely once POSTHOG_API_KEY is
  # already present in that Secret, so a repeat `helm upgrade` never mints a
  # second orphaned key. Admin password is generated inside the Job itself
  # (never a values.yaml literal) and stored alongside the key.
  #
  # Disabled by default (posthog.enabled=false means this never renders
  # regardless). Enable alongside posthog.enabled=true for alpha only --
  # beta/gamma/production keep posthog.enabled=false and never run this Job.
  bootstrap:
    enabled: false
    secretName: "posthog-bootstrap-secret"
    adminEmail: "alpha-admin@waddlebot.localhost.local"
    orgName: "Waddlebot Alpha"
    # Deployment name SUFFIX (prefixed with the release fullname by the
    # template) to roll after the key is written, so the primary flag/
    # license consumer picks it up without a manual restart. Leave blank to
    # skip the restart (e.g. svc-process-rust/svc-action-rust pick the key
    # up on their own next natural redeploy).
    restartDeployment: "hub-api-v3"
    # Seeded ENABLED, 100% rollout, in the in-cluster PostHog as soon as it's
    # provisioned -- explicit alpha-only enablement (critical-rules.md's
    # "default OFF" rule governs the product-code default, not this one-time
    # alpha seed) so these are immediately testable. NOTE: as of this change
    # no command dispatcher actually gates on `waddles.command-*` keys yet --
    # see PR description "Command-flag eval path" for the trace and the gap.
    seedFlags:
      - "waddles.command-eightball"
      - "waddles.command-roll"
      - "waddles.command-lurk"
      - "waddles.command-count"

  # PostHog self-host has NO dated/semver releases — images are commit-tagged
  # off master. Pinned to the exact commit tag + digest named in
  # license-server's docs/posthog-feature-flags.md. Bump deliberately.
  image:
    repository: posthog/posthog
    tag: sha-e0e6484
    digest: sha256:c7518b190576e89ba7e8d08ae9f92cb6011e0a63c4736aea3281ed2f7ca98226
    pullPolicy: IfNotPresent

  web:
    replicas: 1
    port: 8000
    resources:
      requests: { cpu: "250m", memory: "512Mi" }
      limits: { cpu: "1000m", memory: "1Gi" }

  worker:
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "384Mi" }
      limits: { cpu: "500m", memory: "768Mi" }

  postgres:
    image: postgres:16-bookworm
    digest: sha256:da788743d2060767375896de4d646f7576f5911461444b372616f19ea61db2ec
    database: posthog
    username: posthog
    storage: 5Gi
    resources:
      requests: { cpu: "100m", memory: "256Mi" }
      limits: { cpu: "500m", memory: "512Mi" }

  redis:
    # Valkey (redis-protocol-compatible fork) — reuses the digest already
    # pinned for waddlebot's own cache (infrastructure.redis.image above),
    # matching this chart's redis(valkey) convention rather than the
    # upstream redis:7-bookworm pin used in license-server's reference chart.
    image: valkey/valkey:8-bookworm
    digest: sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
    storage: 1Gi
    resources:
      requests: { cpu: "50m", memory: "128Mi" }
      limits: { cpu: "250m", memory: "256Mi" }

  clickhouse:
    # ClickHouse ships only its own Ubuntu-based images (no bookworm
    # variant) — accepted exception to the Debian base-image rule.
    # Pinned to 26.6.1.1193 per license-server's docker-compose.posthog.yml
    # (not the older 24.8 pin in that repo's k8s/helm/posthog/values.yaml —
    # 24.8 lacks TTL on DateTime64, which PostHog's migrations require; the
    # compose overlay's comment documents this as the corrected version).
    image: clickhouse/clickhouse-server:26.6.1.1193
    digest: sha256:1d1f6508eba2dccce2cee9913907c5f7766327debc57a6b1991f2c9e3176c163
    database: posthog
    username: default
    storage: 10Gi
    resources:
      requests: { cpu: "250m", memory: "1Gi" }
      limits: { cpu: "1000m", memory: "2Gi" }

  kafka:
    # Redpanda (KRaft, single node) — Kafka-compatible, no ZooKeeper.
    image: redpandadata/redpanda:v24.2.7
    digest: sha256:82a69763bef8d8b55ea5a520fa1b38f993908ef68946819ca1aed43541824c48
    storage: 5Gi
    resources:
      requests: { cpu: "250m", memory: "1Gi" }
      limits: { cpu: "1000m", memory: "1536Mi" }

  # securityContext per component — rootless everywhere (runAsNonRoot, no
  # added capabilities, no privilege escalation). readOnlyRootFilesystem is
  # false only for components that must write to their own data/config dirs
  # at runtime (documented per-component in the templates) — same accepted
  # exceptions as license-server's k8s/helm/posthog chart.
  securityContext:
    app:            # web + worker
      runAsNonRoot: true
      runAsUser: 1000
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities: { drop: ["ALL"] }
    redis:
      runAsNonRoot: true
      runAsUser: 999
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: { drop: ["ALL"] }
    postgres:
      runAsNonRoot: true
      runAsUser: 999
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities: { drop: ["ALL"] }
    clickhouse:
      runAsNonRoot: true
      runAsUser: 101
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities: { drop: ["ALL"] }
    kafka:
      runAsNonRoot: true
      runAsUser: 101
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities: { drop: ["ALL"] }

# v3.0.x Task 0.5 — seven-container pipeline (SKELETON)
# Coexists with `modules.*` below (the 31 legacy per-module Deployments) until cutover — see
# k8s/helm/waddlebot/PIPELINE_MAPPING.md for the full 31→7 mapping and what remains.
#
# Base images pinned to digests already used elsewhere in this repo (grepped from existing
# Dockerfiles, never invented) as placeholders — none of these 7 containers have their own
# Dockerfile/CI-built image yet. Replace per-container once each does.
# P6a T6 outbound relay queue integrity stamp (pin_sig). DEDICATED HMAC key, mounted only into
# svc-action-rust (signer) + svc-ingest-rust (verifier); see templates/outbound-pin-secret.yaml.
# existingSecret: name of a pre-created Secret (ExternalSecret/SealedSecret) holding key
# OUTBOUND_PIN_KEYS=`kid:hexkey[,...]`; empty => alpha/local auto-generate, other tiers fail closed.
outboundPin:
  existingSecret: ""
  activeKid: "k1"

# Event-sync request integrity key (hub-api / event-sync CronJob sign, svc-action verifies); a
# DEDICATED ring, see templates/event-sync-request-secret.yaml. existingSecret key: EVENT_SYNC_REQUEST_KEYS.
eventSyncRequest:
  existingSecret: ""
  activeKid: "r1"

# Bundle-admin request integrity key (hub-api signs, svc-process verifies); a DEDICATED ring, see
# templates/bundle-admin-request-secret.yaml. existingSecret key: BUNDLE_ADMIN_REQUEST_KEYS.
bundleAdminRequest:
  existingSecret: ""
  activeKid: "b1"

pipeline:
  pythonBaseImage: "python:3.13-slim-bookworm@sha256:01f42367a0a94ad4bc17111776fd66e3500c1d87c15bbd6055b7371d39c124fb"
  nodeBaseImage: "node:20-bookworm-slim@sha256:2cf067cfed83d5ea958367df9f966191a942351a2df77d6f0193e162b5febfc0"

  # T10 (v3 demo) — shared runner identity across svc-ingest/svc-process/svc-action.
  # RUNNER_TENANT_SLUG scopes stage_runner.py to one tenant; deliberately NOT paired
  # with a RUNNER_COMMUNITY_ID here (left unset in every template below) so the
  # runner stays tenant-wide rather than community-scoped -- see roadmap DATA-MODEL
  # GAPS "guild->community" shortcut (community_id=None, activated tenant-wide).
  runnerTenantSlug: "default"

  # PR-H -- ONE source of truth for the pinned connector component digests
  # (sha256:<64 lowercase hex>; empty = unset). Rendered into svc-ingest
  # SENDER_EXEC_DIGEST_<P> AND svc-bundles-executor CONNECTOR_PIN_DIGEST_<P>.
  connectors:
    # Seeder Job publishes connectors/<p>/<digest>.{wasm,json} (signed with the platform key) from
    # the reproducibly-built wasm in its image and logs the digests to set below. Digests are
    # build outputs, NOT committed per-env: copy them from the seeder log or the output of
    # `make publish-connector-bundles ENV=<env>` (scripts/publish-connector-bundles.sh).
    publishAtSeed: false
    digests:
      twitch: ""
      discord: ""
      youtube: ""
      # Wix webhook connector (waddles.core.service.wix); required only when
      # svcIngest.connectorRuntime.connector.wix.enabled.
      wix: ""
      # Inbound-only RSI Spectrum connector (gh #486); required only when connector.spectrum is ON.
      spectrum: ""

  # T10 (v3 demo) — pre-install/pre-upgrade Helm hook Job (templates/migrations-job.yaml)
  # that applies config/postgres/migrations/*.sql to completion before any pipeline
  # Deployment's pods are scheduled. Complements (does not replace) the per-pod
  # waddlebot.dbMigrateInitContainer already used by svc-ingest/svc-process/svc-action/
  # hub-api/svc-core.
  migrationsJob:
    enabled: true
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
  # Idempotent super-admin seed (templates/hub-admin-seed-job.yaml): post-install/post-upgrade
  # hook re-applying config/postgres/migrations/081_seed_default_hub_admin.sql (no-op once any
  # super-admin exists) -- SQL migrations never replay on an existing DB, so without this a
  # deploy over an existing DB never seeds the admin.
  hubAdminSeedJob:
    enabled: true
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "250m"
        memory: "256Mi"
  # Activates first-party waddles.core.* App Bundles under the platform's SYSTEM identity at
  # deploy time (hub_api/cli/seed_core_bundles.py) -- no human global-admin approval, unlike a
  # third-party vendor bundle. `tenantSlugs` is a comma-separated CORE_BUNDLES_TENANT_SLUGS
  # override (empty = every catalog entry's own declared activation_targets, "default" tenant-
  # wide by default -- see bundles/core-bundles.yaml).
  coreBundleSeeder:
    enabled: true
    backoffLimit: 2
    # fix/seeder-deadline: real per-bundle work (component inspect/stage/publish,
    # catalog install, source-binding sync, tenant activation, Ed25519 signing) runs
    # ~20s/bundle; ~39 first-party core bundles need 13+ min end to end. 1800s (30min)
    # gives comfortable headroom over that real workload -- was hardcoded at 300s in
    # templates/core-bundle-seeder-job.yaml, which killed the Job via DeadlineExceeded
    # partway through every seed run (only 13-15/39 bundles seeded,
    # community_permission_grants never fully populated).
    #
    # fix/seeder-throughput: 1800s still wasn't enough -- values-alpha.yaml's
    # 100m/300m CPU override throttled the seeder to ~75s/bundle (not the ~20s
    # assumed above), hitting this deadline at 24/39 bundles with the
    # capability-grants phase (which runs after seeding) never reached. The CPU
    # fix below (1000m/2000m) removes the throttling; this bump to 3000s (50min)
    # is belt-and-suspenders headroom in case CPU alone isn't sufficient on a
    # loaded alpha node.
    activeDeadlineSeconds: 3000
    defaultTenantSlug: "default"
    tenantSlugs: ""
    # fix/preexisting-test-failures (2026-10-02): dedicated seeder-owned ingest-source
    # list, decoupled from rustDataPlane.svcProcess's legacy single-app PROCESS_INGEST_*
    # fields (removed from alpha in fix/alpha-deploy-executor-and-failfast, PR #538, now
    # that the DB-driven multi-tenant active-bundle loader is the sole bundle-selection
    # path -- see values-alpha.yaml's rustDataPlane.svcProcess comment). The seeder still
    # needs to register ingest sources independently of whether svc-process's legacy env
    # is set, so this list is the seeder's own source of truth, each entry rendered into
    # CORE_BUNDLES_PLATFORM_CONNECTIONS (templates/core-bundle-seeder-job.yaml):
    #   - platform: "<ingest platform, e.g. discord>"
    #     sourceId: "<ingest source id, e.g. dg-<guild id>>"
    #     tenantSlug: "<optional, defaults to defaultTenantSlug above>"
    #     communityId: <optional, defaults to null>
    #     label: "<optional, defaults to '<platform> platform connection'>"
    platformConnections: []
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
  # Odoo / external-WaddleDB connector (hub_api/services/odoo_sync_service.py) -- deploy-time
  # kill switch, defaulted OFF. Odoo creds come ONLY from an operator-created Secret holding
  # ODOO_URL/ODOO_DB/ODOO_LOGIN/ODOO_API_KEY/ODOO_SYNC_REF_KEY -- never rendered here.
  odooSync:
    enabled: false
    envBaseline: false
    secretName: "waddlebot-odoo-credentials"
    schedule: "*/30 * * * *"
    backoffLimit: 2
    activeDeadlineSeconds: 600
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
  # Role-sync reconcile worker (Unit F, hub_api/services/role_sync_service.py) --
  # deploy-time kill switch, defaulted OFF (critical-rules.md Feature Flags: every feature
  # flagged OFF until validated) -- see templates/role-sync-cronjob.yaml's own header comment.
  # The engine's own FEATURE_ROLE_SYNC PostHog flag is the separate per-tenant
  # RUNTIME gate; this value controls whether the CronJob is deployed at all.
  roleSync:
    enabled: false
    # 1-minute cadence (near-real-time, demo-ready; Helix limits make sub-minute pointless).
    # Covers both directions in one pass; concurrencyPolicy Forbid prevents overlap.
    schedule: "*/1 * * * *"
    # Opt-in demote-on-role-remove (Discord -> platform): comma-separated pairing ids.
    # Empty = grant-only (default). Baseline role = what a demoted member falls back to.
    demotePairingIds: ""
    demoteBaselineRole: "community-member"
    # Event-driven fast path (Discord gateway GUILD_MEMBER_UPDATE push); the pass above stays the backstop.
    inbound:
      enabled: false
      schedule: "*/1 * * * *"
    backoffLimit: 2
    activeDeadlineSeconds: 600
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
  goRuntimeImage: "debian:bookworm-slim@sha256:7c7b2c966bc9ee8cedfeef67e0e279108992c77681fa595db4a9d65c06ccc587"

  svcCore:
    enabled: true
    port: 8203
    grpcPort: 50203
    replicas: 2
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"

  hubApi:
    # Operator-secret tests require a separately deployed HTTPS credential manager.
    # Empty URL keeps those tests explicitly unavailable (503); never infer an HTTP origin.
    credentialManager:
      url: ""
      timeoutSeconds: 15
      caSecretName: ""  # optional operator-managed Secret containing ca.crt
    enabled: true
    port: 8204
    grpcPort: 50204
    # SPIFFE_PEER_TRUST / SPIFFE_PEER_ID_HEADER (hub_api/services/machine_auth.py). Default OFF.
    # Enable ONLY behind an mTLS terminator that strips the header from non-mTLS traffic AND
    # after a per-identity community allow-list exists -- see docs/PROVIDER_CONNECTIONS.md.
    spiffePeerTrust: false
    spiffePeerIdHeader: "X-Spiffe-Peer-Id"
    replicas: 2
    # Maps to WADDLES_AI_ENABLED (hub_api/config.py) -- deploy-time
    # kill-switch for the whole services/ai_routing/ subsystem, so
    # hub-api can run on a non-beefy machine with no Ollama/model backend
    # reachable at all (a ONE-WAY disable; never grants AI access on its
    # own -- the PostHog flag + Enterprise license-tier gates still
    # govern who can use it when this is true). Defaults true here
    # (current full-feature behavior); values-alpha.yaml/values-beta.yaml
    # override to false since their `infrastructure.ollama.enabled` is
    # already false -- no AI backend actually deployed in either env.
    aiEnabled: true
    # #320 Connections: TTL (seconds) for the OAuth state param cached in Redis/Valkey
    # during the per-community connect flow (CSRF protection between redirect and
    # callback). 600s = 10min, generous for a user to complete an OAuth consent screen.
    connectionsStateTtlS: 600
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
    # feature/bundle-artifact-signing -- BUNDLE_SIGNING_PRIVATE_KEY/BUNDLE_SIGNING_KEY_ID
    # (hub_api/services/bundle_signing_service.py) are wired via secretKeyRef against this
    # externally-managed Secret, NEVER templated from values (the private key must never
    # pass through `helm template`/`helm install --set`/a values file). Generate + apply
    # with `make generate-bundle-signing-key` (scripts/generate-bundle-signing-key.sh)
    # BEFORE deploying hub-api -- see the chart README's rollout-order section. `optional:
    # true` on the env's secretKeyRef so hub-api still starts (approvals just fail closed
    # per PlatformSigner.from_env()) before that script has been run once.
    bundleSigning:
      secretName: ""  # default: "{{ fullname }}-bundle-signing" -- computed in the template when empty
    # One-off backfill CLI (hub_api/cli/sign_approved_bundles.py) as a Helm Job --
    # templates/bundle-signing-backfill-job.yaml. Disabled by default: this is a deliberate
    # rollout step (create secret -> deploy hub-api -> run this Job once -> deploy
    # executor), not a hook that should fire on every `helm upgrade`. Flip to true for one
    # `helm upgrade --set pipeline.hubApi.bundleSigningBackfill.enabled=true`, then back to
    # false -- idempotent either way (module docstring), so a stray extra run is harmless.
    bundleSigningBackfill:
      enabled: false
      backoffLimit: 2
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
    # MEDIUM security-review finding -- CronJob that re-uploads any missing signed bucket
    # sidecar for a version that IS signed in Postgres (artifact_signature NOT NULL) but
    # whose sidecar object is missing/stale (e.g. a prior upload_signed_sidecar() failure
    # that was only ever recorded as a backfill-CLI row outcome, never retried). Runs
    # hub_api/cli/reconcile_signed_sidecars.py on a schedule; metrics via the same
    # bundle_telemetry meter the backfill CLI uses.
    bundleSigningReconciler:
      enabled: true
      schedule: "*/30 * * * *"
      backoffLimit: 3
      concurrencyPolicy: Forbid
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
    # CronJob (hub_api/cli/refresh_landing_stats.py) computing the public landing-page stats
    # into Valkey every 5 minutes; GET /api/v1/public/stats serves only that snapshot (503
    # {"status":"warming"} until the first run). Disabling leaves the landing stats cold.
    landingStatsRefresh:
      enabled: true
      schedule: "*/5 * * * *"
      backoffLimit: 1
      concurrencyPolicy: Forbid
      resources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"

  hubWebui:
    enabled: true
    # Express server (admin/hub_module/webui-server/server.js), not nginx --
    # PORT env below must match this, and the Dockerfile.webui default is
    # also 8080. Do not change one without the other.
    port: 8080
    replicas: 2
    service:
      type: ClusterIP
    # Direct host-IP NodePort exposure (no /etc/hosts or Host-header routing) -- alpha
    # only; base/beta/gamma/production stay ClusterIP+Ingress-only (see
    # templates/hub-webui.yaml's second Service block). 30879 matches
    # webui.publicUrl/connectionsCallbackBaseUrl in values-alpha.yaml, which already
    # reserved this port for "hub-webui NodePort" ahead of this Service existing.
    nodePort:
      enabled: false
      port: 30879
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

  svcRtc:
    enabled: true
    port: 8206
    replicas: 1
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"

  # v3.0.x — 8th container / 4th stage-runner. `presentation.enabled` toggle: renders core
  # overlays + Music Station + activated bundles' presentation components. See
  # templates/svc-presentation-rust.yaml header for the design trail and why this is
  # NOT gated on any modules.<name>.enabled (generic across all Modules, unlike svc-rtc).
  svcPresentation:
    enabled: true
    port: 8207
    # MUST stay 1. The overlay fan-out is IN-PROCESS: each pod only knows the websocket/SSE
    # clients connected to itself, so with >1 replica a pushed frame reaches only the clients on
    # the pod that received it -- frames split across pods. The chart REFUSES to render
    # replicas > 1 (waddlebot.presentationReplicaGuard) unless sharedFanout.enabled is true.
    # No HPA/PDB either (not in waddlebot.scaleTargets).
    replicas: 1
    sharedFanout:
      # Shared cross-pod fan-out backend (e.g. Valkey pub/sub) -- NOT BUILT YET (roadmap item).
      # Flip to true only once svc_presentation ships it; until then this only exists so the
      # replicas guard has an explicit, auditable override rather than a silent footgun.
      enabled: false
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"

  # Discord event-sync reconcile CronJob (hub_api/services/event_discord_sync_service.py::main) --
  # periodic backstop sweeping calendar_events rows left pending/sync_error (SoT push engine's
  # own `sync_event()` entry point handles the immediate, webhook-triggered path; this CronJob
  # is the "reconciliation-by-polling never fully replaced by push" backstop, same philosophy
  # as role-sync's own reconcile worker). Disabled by default -- the engine itself is also
  # gated behind the waddles.calendar.event_discord_sync PostHog flag (defaulted OFF), so this
  # is a belt-and-suspenders double-gate until the feature is validated.
  eventSync:
    enabled: false
    schedule: "*/5 * * * *"
    backoffLimit: 2
    activeDeadlineSeconds: 240
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

  # v3.0.x — Rust data-plane rewrite (Issue #287, core/svc_streaming crate). Supersedes the
  # earlier Python/ffmpeg control+data plane (own DB tables, migration 078). Adds the
  # media-plane ports (rtmp/srt/webrtc range) and MinIO/S3 recording env alongside the
  # existing control ports -- see templates/svc-streaming.yaml header for the full
  # rationale. Gated only on `enabled` here (same pattern as svcPresentation), NOT on
  # modules.streaming.enabled -- that module doesn't exist in modules.* yet. svc-rtc /
  # video_proxy_module are untouched (separate, existing containers).
  # NOTE: this key MUST stay nested directly under `pipeline:` (2-space indent, sibling of
  # svcPresentation above) -- a prior edit accidentally nested it under the top-level
  # `presentation:` block instead, which silently made every
  # `.Values.pipeline.svcStreaming.*` reference in templates/svc-streaming.yaml resolve to
  # null and rendered the whole file to nothing (caught via `helm template` + `yq
  # '.pipeline.svcStreaming'` returning null despite `enabled: true` being textually
  # present). Base/prod resources bumped above beta's tier -- this is a transcode-capable
  # pod, not a generic pipeline-stage skeleton.
  svcStreaming:
    enabled: true
    # Stateful singleton (RTMP/SRT listeners + local stream dir): Deployment strategy is
    # Recreate and replicas must stay 1. No HPA/PDB (not in waddlebot.scaleTargets).
    # Longer drain than the chart default so in-flight streams/recordings can finalize.
    terminationGracePeriodSeconds: 60
    port: 8208
    grpcPort: 50208
    metricsPort: 9090
    rtmpPort: 1935
    srtPort: 9000
    webrtcRangeStart: 40000
    webrtcRangeEnd: 40100
    streamDataDir: "/var/lib/waddlebot/stream"
    # Externally-reachable base URL svc-streaming embeds in playback URLs and uses as
    # the WebRTC ICE host. Empty = unset (service default http://localhost:8208).
    # Set an explicit URL for stable-DNS environments; it always wins over the node-IP
    # derivation below.
    publicBaseUrl: ""
    # Derive PUBLIC_BASE_URL at runtime as http://<node hostIP>:<nodePort.httpPort> via the
    # downward API (status.hostIP) instead of baking a LAN IP into a values file -- the
    # node IP changes when a host moves networks, and a stale literal silently points
    # playback URLs at a dead address. Only used when publicBaseUrl is empty; requires
    # nodePort.enabled (the chart fails to render otherwise).
    publicBaseUrlFromNodeIP: false
    replicas: 1
    # Direct NodePort media exposure (RTMP/SRT/HTTP) -- alpha-only; base/beta stay
    # ClusterIP-only (see templates/svc-streaming.yaml's second Service block).
    nodePort:
      enabled: false
      rtmpPort: 31935
      srtPort: 30900
      httpPort: 31208
    resources:
      requests:
        cpu: "1000m"
        memory: "1Gi"
      limits:
        cpu: "4000m"
        memory: "4Gi"

  # Rust data-plane Deployments (core/svc_ingest, core/svc_process, core/svc_action,
  # core/bundle_executor). The legacy Python svc-ingest/svc-process/svc-action Deployments
  # no longer exist in this chart. Gated behind this top-level `enabled` flag (default
  # false). Resource names keep their `-rust` suffix (templates/svc-ingest-rust.yaml et al).
  # Image repositories are distinct `<module>-rust` repos
  # (waddlebot.legacyModuleImage), built by CI / scripts/alpha-deploy.sh.
  #
  # ACTUAL STATE (verified against core/*/src, 2026-10-12):
  #   - svc_ingest is NOT a skeleton (~13k lines). Native Twitch IRC, Discord Gateway (OP_RESUME
  #     + fleet-wide IDENTIFY budget), Twitch EventSub with HMAC verification, and Twitch +
  #     Discord outbound drains are implemented. Valkey comes from
  #     penguin_spine::SpineConfig::from_env() (VALKEY_URL); receiver tokens come from its
  #     Config. No DB by design (spec S4.1: the stage owns no tables).
  #   - svc_process host-API EXISTS: HOST_API_PORT (default 8301, core/svc_process/src/config.rs,
  #     server in src/host_api.rs). bundleExecutor.stages below lists both svc-process-rust and svc-action-rust
  #     (one executor Deployment dials every stage; templates/svc-process-rust.yaml).
  #   - Executor<->stage mTLS (global.hostApiTls) self-provisions on alpha/local (generated under
  #     the same Secret name) and fails closed on beta/gamma/production. No insecureDev escape
  #     hatch is needed; beta/prod require real material (cert-manager or ExternalSecret).
  #
  # REMAINING REAL GAPS:
  #   - No Slack / YouTube / Kick / Spectrum Rust receivers yet (TODO(M5) in svc_ingest's
  #     lib.rs); the generic webhook/JWT intake and D31 usage metering are also TODO(M5).
  #   - Source configuration is static single-source config (env/CLI), not per-community.
  #   - Connector bundles (#840 B0): the executor library can now invoke connector exports
  #     (core/bundle_executor/src/connector.rs ConnectorHost) and svc_ingest has the host-side
  #     Transport/driver skeleton (core/svc_ingest/src/connector), proven end to end by
  #     core/connector_e2e over the real host-API wire (penguin-bundle-host 0.3.0
  #     ExportKind::Connector*; svc_ingest's production invoker is WireConnectorInvoker). The
  #     deployed pods still cannot run a connector: no real platform Transport exists yet, no
  #     ConnectorDriver is constructed by svc_ingest's main, and the executor pins no connector at
  #     startup. With no executor attached every connector call fails loudly (typed Unavailable).
  #   - svc_ingest has no host-API listener (WireConnectorInvoker's ExecutorLink::attach takes an
  #     accepted stream; the mTLS accept loop lands with the first real transport).
  #
  # HIDDEN SECOND GATE -- read before enabling (src/license.rs:32 flag key, :115 check):
  #   core/svc_ingest only starts its receivers and outbound drains when the PostHog flag
  #   `waddles.core.rust-data-plane` is ON. Default OFF, fail-closed: a never-seen flag, an
  #   unreachable license server, or a license client that cannot be built (invalid license
  #   config) all evaluate OFF. With the flag OFF the pod still runs its HTTP/metrics servers
  #   but logs a WARN and starts no receivers, so svc_action refuses Discord chat.delete and
  #   dm.send. Setting pipeline.rustDataPlane.enabled=true alone yields an INERT svc-ingest-rust
  #   pod -- the flag must also be ON in PostHog (or a domain bypass applies).
  rustDataPlane:
    enabled: false

    # Security review fix (PR #468, MEDIUM): bundle_host_http::egress::EgressGuard's
    # operator-configured cluster pod/Service/node CIDR denylist, shared by every Rust
    # data-plane stage (svcAction/svcProcess -- templates/svc-action-rust.yaml,
    # templates/svc-process-rust.yaml -- EGRESS_CLUSTER_CIDR_DENYLIST env). Never liftable
    # by any bundle egress grant or by instanceEgressAllowPrivateIp below -- this is the
    # hard SSRF backstop against a bundle reaching this cluster's own control plane/other
    # pods via the `http` capability. Empty (this default) is accepted only when
    # global.deploymentTier is alpha/local -- CliConfig::validate hard-fails startup
    # otherwise. OVERRIDE REQUIRED in beta/gamma/production: set to this cluster's actual
    # pod CIDR, Service CIDR, and node CIDR/subnet (e.g. dal2's `kubectl cluster-info
    # dump | grep -m3 -E 'cluster-cidr|service-cluster-ip-range'` output, plus the node
    # subnet) -- values-alpha.yaml is exempt via deploymentTier: "alpha".
    egressClusterCidrDenylist: []
    # Interim, config-sourced bundle_host_http::egress::InstanceEgressPolicy (Justin's
    # decision: "private-ip is also subject to the INSTANCE policy -- default deny,
    # global-admin opt-in"). PR #428/#432's capability-gate grant snapshot is the eventual
    # live source; `false` (deny, the default) until an operator opts in at the pod level.
    instanceEgressAllowPrivateIp: false

    # feature/bundle-artifact-signing -- BUNDLE_SIGNING_PUBLIC_KEYS (core/bundle_executor/
    # src/config.rs, core/bundle_executor/src/signing.rs::PlatformPublicKeys), shared by
    # bundleExecutor below (every replica verifies against the same platform key set
    # regardless of which stage it dials). Map of
    # `key_id -> base64(32-byte Ed25519 public key)` -- NOT secret (public keys), so this
    # is safe to carry directly in values (unlike hubApi.bundleSigning's private-key
    # secretKeyRef above). Rendered into the container env as a JSON object.
    #
    # fix/chart-autogen-bundle-signing-key -- empty by default is now the NORMAL,
    # zero-manual-step path: templates/svc-bundles-executor.yaml falls back to sourcing BUNDLE_SIGNING_PUBLIC_KEYS from
    # the `{{ fullname }}-bundle-signing-public` ConfigMap that templates/
    # auto-provisioned-keys-job.yaml's pre-install/pre-upgrade hook keeps in sync with
    # whatever private key lives in autoProvisionedKeys.bundleSigning.secretName, in
    # every environment (see that values key's own comment). Only set this map
    # explicitly for a multi-key rotation window or to pin a value printed by a manual
    # `make generate-bundle-signing-key` run -- an explicit value here always wins over
    # the ConfigMap. `crate::signing::PlatformPublicKeys::from_cli_required` still fails
    # closed at startup with zero keys configured either way.
    bundleSigningPublicKeys: {}

    # feature/hub-grpc-env-wiring -- closes #569's startup seam: svc-process-rust/
    # svc-action-rust's `core/hub_client::HubClient` (PII tokenization/detokenization,
    # #561) needs hub-api's internal gRPC endpoint + machine-JWT bootstrap endpoint to
    # connect at startup, or it fails loud (exits non-zero) per #569's "fail loud, not
    # silent dead-letter" design. Empty here (the default) means "compute from
    # pipeline.hubApi's own Service port in-template" (see svc-process-rust.yaml/
    # svc-action-rust.yaml) -- correct unmodified in every environment since hub-api is
    # always colocated in the same Helm release/namespace; override only if that ever
    # stops being true. TLS is mandatory on hub-api's gRPC listener (hub_api/
    # grpc_internal/server.py, no insecure option) -- scheme is always "https".
    #
    # KNOWN GAP (follow-up required, do not assume this "just works"): (1) hub-api's
    # own Deployment (templates/hub-api.yaml) does not yet wire
    # `waddlebot.grpcTlsServerEnv`/volume the way templates/core/core-identity.yaml
    # does, so its gRPC listener never starts (hub_api/app.py fails OPEN for the
    # surrounding HTTP app but CLOSED for gRPC) until that's added. (2)
    # `core/hub_client::HubClient::connect` calls `ClientTlsConfig::new().
    # with_enabled_roots()` -- the bundled webpki/Mozilla root store only, no
    # custom-CA support -- so even once hub-api's listener is up, a cert signed by
    # this chart's own `global.grpcTls` CA (cert-manager `waddlebot-internal-ca` or
    # the static dev CA) will fail TLS verification. Until hub_client supports CA
    # pinning, use the `waddles.core.disable-pii-tokenization`/
    # `disable-pii-detokenization` kill-switches in any environment where this isn't
    # resolved yet, rather than deploying straight into a crash-loop.
    hubApiGrpcEndpoint: ""
    # Machine-JWT bootstrap (ServiceAuthService.MintServiceToken) is gRPC: this is hub-api's
    # internal gRPC address, the same one as hubApiGrpcEndpoint (default: hub-api's in-cluster
    # Service on pipeline.hubApi.grpcPort; TLS 1.3, CA pinned via HUB_API_GRPC_CA_FILE).
    serviceJwtTokenEndpoint: ""

    svcIngest:
      enabled: true
      # fix/helm-alpha-self-provisioning -- image repository (formerly kept distinct from the
      # removed Python svc-ingest Deployment's so the two never raced on a shared tag). Matches
      # core/svc_ingest/Dockerfile.rust's build tag.
      imageRepository: "svc-ingest"
      port: 8200
      metricsPort: 9090
      replicas: 1
      # fix/svc-ingest-envelope-kid-wiring-alpha -- ENVELOPE_BINDING_ACTIVE_KID
      # (core/svc_ingest/src/config.rs) -- the `binding.mac` kid this pod mints new MACs
      # under when minting an envelope for a receiver event (e.g. Discord gateway).
      # Empty (default) leaves that receiver disabled ("ENVELOPE_BINDING_ACTIVE_KID not
      # set; receiver not started") -- must match a `kid` present in
      # global.envelopeBindingKeys once any receiver is used, same requirement as
      # svcAction's own field below.
      envelopeBindingActiveKid: ""
      # feature/svc-ingest-connections-scope (F4) -- dynamic provider-connections wiring.
      # `dynamicConnections.enabled` gates svc-ingest's `serviceJwt.identities.svc-ingest` grant
      # (scope connections:resolve on the cross-tenant `system` tenant), the SERVICE_JWT_* env
      # and the audience-scoped SA-token mount in templates/svc-ingest-rust.yaml. svc-ingest is
      # internet-facing (webhooks/IRC/Discord): while the feature is OFF a compromised pod must
      # not be able to mint a `system` token and resolve every tenant's decrypted OAuth tokens,
      # so NOTHING renders unless this is true. Default false; only values-alpha.yaml enables it.
      dynamicConnections:
        enabled: false
        # Per-community Twitch session reconcile cadence (TWITCH_RECONCILE_INTERVAL_SECS, bounds
        # 10..3600) and per-call hub-api timeout (TWITCH_RESOLVE_TIMEOUT_SECS). Rendered only while
        # enabled. A new/removed Twitch binding takes effect within <= one reconcile interval.
        twitchReconcileIntervalSecs: 60
        twitchResolveTimeoutSecs: 10
      # P6a -- `waddles.connector-tools` env baseline (CONNECTOR_TOOLS_ENABLED). OFF (default) =
      # the legacy outbound drains, nothing below renders. ON = the generic outbound executor:
      # requires dynamicConnections.enabled + hubApi.enabled, the three pinned connector digests,
      # the operator-managed platform-credentials Secret key TWITCH_CLIENT_ID, and the
      # OUTBOUND_PIN_KEYS secret (outboundPin). A half-configured ON fails `helm template`.
      # Rollout order: svc-action first (pin_sig v2), then svc-ingest; rollback = enabled:false.
      # A svc-bundles-executor must dial this pod's host-api port (see core/svc_ingest/README.md).
      connectorTools:
        enabled: false
        hostApiPort: 8301
        # svc-ingest's DEDICATED host-api mTLS material (never the shared executor/stage
        # host-api-tls). Secret `secretName` (ca.crt = CA the executor client cert must chain to,
        # tls.crt/tls.key = server-only cert with the svc-ingest SAN) is generated on alpha/local;
        # elsewhere supply it (externalSecret: true = an external controller owns it). The listener
        # pins `clientIdentity` (the ingest-dedicated executor cert); the matching client Secret
        # `<fullname>-ingest-executor-tls` is for the executor track and is mounted by nothing here.
        hostApiTls:
          secretName: ""
          clientIdentity: ""
          externalSecret: false
          # Separate connector trust domain: these Secrets are issued by a CONNECTOR CA, never the stage
          # CA. The executor trusts both via `<fullname>-executor-ca-bundle` mounted over HOST_API_CA_FILE
          # (follow-up executor PR: a dedicated connector CA env). With externalSecret=true, supply
          # executorCaBundleSecretName (Secret key ca.crt = stage CA + connector CA).
          executorCaBundleSecretName: ""
        # Connector component digests are NO LONGER set here: single source of truth is
        # `pipeline.connectors.digests` (also feeds the executor's CONNECTOR_PIN_DIGEST_<P>).
        # Setting a non-empty `digests.*` here fails the render.
      # PR-H (connector runtime, docs/superpowers/specs/2026-11-05-connector-runtime-inbound-manager.md
      # SS1.3/SS5/SS7) -- inbound connector runtime + per-platform connector baselines. ALL OFF by
      # default (beta/gamma/prod inherit OFF; nothing below renders while OFF). Each connector ON
      # flips BOTH svc-ingest deployments (Rust + Python) from this ONE value, so they cannot
      # disagree. Prerequisites (render-time `fail` otherwise): connectorTools.enabled,
      # pipeline.connectors.digests.<p>, the host-api TLS Secrets, and routeKeySecret when
      # webhookPlatforms is non-empty. Per-platform ON procedure (alpha, one at a time, SS7):
      #   1. youtube (poll, lowest blast radius)  2. discord (single guild)  3. twitch
      #   set connector.<p>.enabled: true (+ connectorTools.enabled + the digest), redeploy; smoke;
      #   rollback = connector.<p>.enabled: false + redeploy (legacy path restarts).
      # Beta only after a clean 48h alpha soak.
      connectorRuntime:
        enabled: false
        connector:
          twitch:
            enabled: false
          # REJECTED at render unless identifyBudgetReady is true (alpha/dal2alpha/local only).
          discord:
            enabled: false
          youtube:
            enabled: false
          # Wix app webhooks (inbound-only, verified RS256 JWT). Needs webhookPlatforms to list "wix"
          # (+ routeKeySecret) and pipeline.connectors.digests.wix; see docs/connector-wix.md.
          wix:
            enabled: false
          # RSI Spectrum (gh #486): inbound-only; flag waddles.connector-spectrum / env
          # CONNECTOR_SPECTRUM_ENABLED. ON suppresses the legacy spectrum_{poll,org} receivers.
          # No webhook surface (webhookPlatforms stays twitch/discord only).
          spectrum:
            enabled: false
        # The Valkey IDENTIFY budget is wired in the binary; the chart default stays false so beta/
        # gamma/production REJECT discord until it is deliberately enabled there (values-alpha,
        # values-dal2alpha and values-local set true).
        identifyBudgetReady: false
        reconcileIntervalSecs: 60
        maxConnections: 500
        startConcurrency: 8
        discordStartPaceMs: 5500
        # CONNECTOR_HEARTBEAT_ENABLED on the Rust svc-ingest (boot.rs ENV_HEARTBEAT, strict bool; the
        # Rust default when unset is false). Driver heartbeat baseline (`ingest.connector-heartbeat`).
        heartbeatEnabled: false
        # csv-rendered subset of [twitch, discord, wix] whose webhook routes are registered.
        webhookPlatforms: []
        # HMAC key deriving webhook route keys: an EXISTING Secret only (never a literal here).
        # Required when webhookPlatforms is non-empty.
        routeKeySecret:
          existingSecret: ""
          key: "CONNECTOR_ROUTE_KEY_SECRET"
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"

    svcProcess:
      enabled: true
      # feature/host-gameserver-net -- renders svc-process's least-privilege
      # `connections:resolve:gameserver` + `connections:list:gameserver` scopes (the `gameserver-net`
      # host capability resolves admin-registered game servers; hub-api refuses these scopes for any
      # other provider). Default OFF; also needs the waddles.bundle-gameserver-net flag ON.
      gameserverNet:
        enabled: false
      # fix/helm-alpha-self-provisioning -- see svcIngest.imageRepository's comment above.
      imageRepository: "svc-process"
      port: 8201
      metricsPort: 9090
      replicas: 1
      # PROCESS_APP_ID (core/svc_process/src/config.rs) -- the bundle app_id this instance
      # drains granted ingest-source streams for; empty (default) disables the spine drain
      # loop entirely. values-alpha.yaml sets this to the migration-083-seeded demo app_id.
      processAppId: ""
      # fix/process-bundle-wiring-alpha -- interim, env-driven substitute for the real
      # `GET /api/v1/distribution/bundles?stage=process` poll (core/svc_process/src/
      # config.rs PROCESS_INGEST_PLATFORM/_SOURCE_ID, spec SS4.2/SS6.7). Both empty
      # (default) means an empty grant list -- the drain loop connects and blocks,
      # reading nothing (see lib.rs try_start_process_loop). Together they resolve the
      # ONE ingest-source stream this pod's `Scope::new("default", None).source_stream(...)`
      # reads: `waddles:t:default:c:_tenant:src:{platform}:{sourceId}:events`.
      processIngestPlatform: ""
      processIngestSourceId: ""
      # PROCESS_BUNDLE_* (core/svc_process/src/config.rs) -- interim, env-driven
      # substitute for the digest/keys a real distribution-poll `load` would supply (spec
      # SS6.6). Empty digest (default) disables the executor load/invoke path entirely --
      # the drain loop still runs and can dead-letter on `executor_unavailable`.
      # componentKey/sidecarKey are the exact MinIO object keys under
      # pipeline.rustDataPlane.bundleExecutor.bucketName (the `.wasm`/`.json` sidecar).
      processBundleDigest: ""
      processBundleVersion: "1"
      processBundleComponentKey: ""
      processBundleSidecarKey: ""
      # fix/svc-process-host-api-wiring-alpha -- mTLS host-API listener svc-bundles-executor
      # dials (pipeline.rustDataPlane.bundleExecutor.stages lists it by default). Matches HOST_API_PORT's own CliConfig default
      # (core/svc_process/src/config.rs).
      hostApiPort: 8301
      # Multi-tenant, change-log-driven active-bundle loader (core/svc_process/
      # src/config.rs, core/bundle_active_set, core/svc_process/src/changelog_consumer.rs)
      # -- hub-api is the sole writer, this stage reads ACTIVE, APPROVED bundle config
      # for EVERY tenant/community from a READ-ONLY Postgres and hot-swaps in/out with
      # no pod restart. Enabled by default; opt out via waddles.core.disable-db-bundle-config
      # and/or waddles.core.disable-multi-tenant-watermark, in which case PROCESS_APP_ID/
      # PROCESS_BUNDLE_* above remain the sole selection mechanism -- these defaults are
      # safe to ship even before the RO Postgres role exists.
      # dbReaderHost/Port/Name default to the SAME primary Postgres alpha already runs
      # (no read replica provisioned yet, task's own documented interim posture) --
      # infrastructure.postgresql.service.name/port/database, not hardcoded here so a
      # future replica is a values-only change.
      dbReaderHost: ""
      dbReaderPort: ""
      dbReaderName: ""
      # A distinct, SELECT-only Postgres role -- never infrastructure.postgresql.username
      # (the primary read-write account). feature/bundle-reader-role: the role is now
      # actually provisioned (alembic/versions/0032_bundle_reader_role.py), under the
      # same name migrations 0025/0028 already grant SELECT to -- "svc_process_ro" was
      # never backed by any migration.
      dbReaderUser: "waddles_bundle_reader"
      # BUNDLE_SCOPE_TENANT_ID/BUNDLE_SCOPE_COMMUNITY_ID REMOVED (dataplane scale
      # design, multi-tenant change-log consumer): the loader now discovers and
      # serves every (tenant_id, community_id) scope in the database itself
      # (bundle_active_set::read_active_set_all) -- there is no per-pod tenant
      # scope left to configure.
      # Whole seconds; clamped to a 5s floor in code (CliConfig::
      # bundle_config_poll_interval) so a misconfigured 0/negative value here can never
      # hot-loop the incremental change-log poll against the reader database.
      bundleConfigPollSeconds: 300
      # Whole minutes; clamped to a 1m floor in code (CliConfig::
      # full_reconcile_interval). Periodic full active-set reconcile -- bounds the
      # blast radius of any change-log defect to one interval.
      bundleConfigFullReconcileMinutes: 15
      # feature/alpha-command-flag-envs -- arbitrary FLAG_<KEY>=true passthrough env
      # vars, consumed by waddle_sdk's feature_enabled() as a baseline PostHog
      # overrides when connected. Empty by default (unchanged behavior); see
      # templates/svc-process-rust.yaml's identical comment on this key.
      extraEnv: {}
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"

    svcAction:
      enabled: true
      # fix/helm-alpha-self-provisioning -- see rustDataPlane.svcIngest.imageRepository's
      # comment above.
      imageRepository: "svc-action"
      port: 8202
      metricsPort: 9090
      replicas: 1
      # mTLS host-API listener core/bundle_executor dials (spec SS6.6/SS7.1) -- matches
      # HOST_API_PORT's own CliConfig default (core/svc_action/src/config.rs).
      hostApiPort: 8302
      # feature/edge-reshape-chunk2-conn-store (Task 8) -- gates svc-action's
      # `connections:resolve` + `connections:resolve:static` grant in
      # `serviceJwt.identities.svc-action` (stripped from hub-api's SERVICE_JWT_IDENTITIES while
      # false) and the SERVICE_JWT_* env/mount both svc-action pods use to mint it. Default false;
      # only values-alpha.yaml enables it (same posture as svcIngest.dynamicConnections).
      dynamicConnections:
        enabled: false
      # ACTION_APP_ID (core/svc_action/src/config.rs) -- empty (default) disables the
      # dispatch drain loop entirely. values-alpha.yaml sets this to the migration-083
      # seeded demo app_id.
      actionAppId: ""
      # ENVELOPE_BINDING_ACTIVE_KID (core/svc_action/src/config.rs) -- the `binding.mac` kid
      # this pod mints new MACs under. Empty (default) omits the env var entirely; must
      # match a `kid` present in global.envelopeBindingKeys once hop verification is used.
      envelopeBindingActiveKid: ""
      # svc-action executor wiring -- ACTION_BUNDLE_* (core/svc_action/
      # src/config.rs, #366) -- interim, env-driven substitute for the digest/keys a real
      # distribution-poll `load` would supply (spec SS6.6), field-for-field mirror of
      # svcProcess.processBundle* above. Empty digest (default) disables the executor
      # load/invoke path entirely -- the dispatch drain loop still runs and can
      # dead-letter on `executor_unavailable`. componentKey/sidecarKey are the exact
      # MinIO object keys under pipeline.rustDataPlane.bundleExecutor.bucketName.
      actionBundleDigest: ""
      actionBundleVersion: "1"
      actionBundleComponentKey: ""
      actionBundleSidecarKey: ""
      # D32: false is the documented default posture, not a fallback (see config.rs).
      sandboxGvisor: false
      # DB-driven active-bundle loader (core/svc_action/src/config.rs,
      # core/bundle_active_set) -- field-for-field mirror of svcProcess's own block above;
      # see its comments for the full rationale (hub-api sole writer, READ-ONLY Postgres,
      # gated OFF by default, safe defaults before the RO role exists).
      dbReaderHost: ""
      dbReaderPort: ""
      dbReaderName: ""
      # feature/bundle-reader-role -- see svcProcess's identical field's own comment
      # above: "svc_action_ro" was never backed by any migration, the role migrations
      # 0025/0028 already grant SELECT to is "waddles_bundle_reader".
      dbReaderUser: "waddles_bundle_reader"
      # BUNDLE_SCOPE_TENANT_ID/BUNDLE_SCOPE_COMMUNITY_ID REMOVED -- see
      # svcProcess's identical field's own comment above for the full rationale.
      bundleConfigPollSeconds: 300
      bundleConfigFullReconcileMinutes: 15
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"

    # D9/D10 -- credential-less sandbox host (svc-bundles-executor): no DB, no app secrets,
    # no Valkey: this pod's ONLY network relationships are the mTLS dials to the stages'
    # host-API ports, svc-ingest's connector link, and the bundle bucket
    # (templates/svc-bundles-executor-networkpolicy.yaml).
    #
    # ONE Deployment serves EVERY stage and scales horizontally: each replica dials every
    # entry of `stages` plus the connector link, and each listener spreads work round-robin
    # across the replicas connected to it. `replicas` is the floor when no HPA owns the
    # Deployment; `autoscaling.services.bundleExecutor` (below) turns the HPA + PDB on.
    bundleExecutor:
      enabled: true
      # StatefulSet replicas per pool when autoscaling.mode=none. 2 = every slot keeps both
      # owners (rendezvous R=2) -> a lost executor fails over to a warm replica.
      replicas: 2
      # Executor pools (one StatefulSet each). Empty = one "default" pool serving every stage
      # (shared compiled cache across stages -- the Phase 1 default). Per-stage pools, e.g.:
      #   - { name: process, stages: [svc-process-rust] }
      #   - { name: action,  stages: [svc-action-rust], replicas: 3 }
      # Each stage must belong to exactly one pool; optional per-pool replicas/resources/
      # memoryBudgetMb/autoscaling override the values below. Render fails loudly otherwise.
      pools: []
      # EXECUTOR_MEMORY_BUDGET_MB: LRU ceiling for resident compiled modules; must be below
      # resources.limits.memory (render fails otherwise). ~2/3 of the limit leaves headroom for
      # live instances + JIT transients on an AOT miss. 8192 = the executor crate default
      # (config.rs) paired with a 12Gi limit below (budget ~2/3 of the limit).
      memoryBudgetMb: 8192
      # BUNDLE_MAX_PRECOMPILED_BYTES: optional cap on one signed .cwasm object fetched from the
      # bucket. Empty = unset (crate default 256 MiB); oversized objects fall back (loudly) to JIT.
      maxPrecompiledBytes: ""
      # Signed AOT artifact prefix in the bundle bucket (precompiled/<engine_fp>/<digest>.cwasm),
      # produced by the precompile Jobs (part D, executor-precompile*.yaml).
      precompiledPrefix: "precompiled"
      # Node-disk bound for the local .cwasm staging emptyDir (EXECUTOR_PRECOMPILE_DIR).
      precompileCacheSizeLimit: "4Gi"
      # svc-bundles-executor-autoscaling.yaml. mode: none | keda | hpa-external (see that
      # template's header for prerequisites; both scaled modes fail the render loudly when
      # the cluster lacks the API). Signals: stage queue-wait p95 + pool_exhausted rate.
      autoscaling:
        mode: none
        minReplicas: 2
        maxReplicas: 13          # PLAN.md s3: ~5k rps / (4 CPU x ~100 rps/core)
        pollingIntervalSeconds: 15
        cooldownSeconds: 600     # >= warm time; scale-down moves ~1/N slots
        prometheus:
          serverAddress: ""
          # `{{ .pool }}` = pool name. Metric names per CONTRACT.md (OTLP -> Prometheus).
          queueWaitP95Query: 'histogram_quantile(0.95, sum by (le) (rate(queue_wait_seconds_bucket{executor_pool="{{ .pool }}"}[2m])))'
          queueWaitP95Seconds: "0.5"
          poolExhaustedRateQuery: 'sum(rate(pool_exhausted_total{executor_pool="{{ .pool }}"}[2m]))'
          poolExhaustedPerSecond: "1"
        hpaExternal:
          queueWaitP95Metric: "executor_queue_wait_seconds_p95"
          queueWaitP95Target: "500m"
          poolExhaustedRateMetric: "executor_pool_exhausted_per_second"
          poolExhaustedRateTarget: "1"
      # Stage host-API listeners every replica dials -- `target` is the short Service-name
      # suffix (prefixed with the release fullname by the template), `port` its host-API
      # port (spec SS6.6/SS7.1). One independent dial loop, bundle registry and metrics
      # `stage` label per entry; all share the global.hostApiTls client identity.
      stages:
        - { target: "svc-process-rust", port: 8301 }
        - { target: "svc-action-rust", port: 8302 }
      stageConnections: 4
      callTimeoutMs: 2000
      maxCallTimeoutMs: 10000
      memoryLimitMb: 64
      maxMemoryLimitMb: 256
      instancesPerBundle: 4
      maxConcurrentCalls: 32
      # Concurrent WASM JIT compiles (app bundles AND connectors share it).
      # 0 = auto: min(4, CPUs). Each compile holds ~100s of MiB; an unbounded
      # boot burst OOM-killed the pod at 16Gi.
      maxConcurrentCompiles: 0
      poolWaitMs: 500
      precompileDir: "/var/cache/waddles/wasm"
      wasmCollector: "drc"
      sandboxGvisor: true
      # BUNDLE_BUCKET_* (core/bundle_executor/src/bucket.rs BucketConfig::from_cli) -- the
      # executor's one sanctioned credentialed egress path (spec SS7.6/SS12.7), now that
      # BucketComponentSource replaces UnimplementedBucketSource in production (crate::run).
      # bucketName/bucketRegion are static across environments; the endpoint is derived in
      # the template from infrastructure.seaweedfs.service.name/s3Port (alpha: in-cluster
      # SeaweedFS, plain http:// -- no BUNDLE_BUCKET_CA_FILE needed) and the access
      # key/secret come from the dedicated "svc-bundles-executor" (data-plane) S3 identity
      # (DATAPLANE_S3_ACCESS_KEY_ID/_SECRET_ACCESS_KEY, Read/List only -- see
      # infrastructure.seaweedfs.identities.dataPlane above and templates/secrets.yaml),
      # individually referenced (not envFrom) to keep this pod's credential surface to
      # exactly what bucket.rs needs.
      bucketName: "waddles-bundles"
      bucketRegion: "us-east-1"
      # fix/alpha-deploy-executor-and-failfast -- these are the chart DEFAULTS
      # (inherited by beta/gamma/production, none of which override this block
      # today). values-alpha.yaml overrides to 1Gi/2560Mi request/limit memory
      # after alpha OOMKilled at this tier compiling a 21MB CPython component
      # plus a .NET component via Cranelift. NEEDS A DECISION before beta:
      # whether beta/prod sizing should match alpha's bump, scale down (smaller
      # bundles only), or scale up further (larger worst-case bundles) -- not
      # decided here, left as the pre-existing chart default in the meantime.
      #
      # fix/bundle-defaults-signing-grants-percommunity -- the 512Mi default OOMKills on a clean
      # deploy: the executor EAGER-LOADS (Cranelift-compiles) the ENTIRE active set at startup.
      # Default raised to the alpha-proven 2560Mi ceiling (request stays modest).
      # TODO(core/bundle_executor): the real healthy fix is lazy/bounded loading -- compile a
      # bundle on first invoke and LRU-evict under a memory budget -- so peak RSS no longer
      # scales with the number of activated bundles. Then this limit can shrink again.
      # executor Phase 1 (PLAN.md s3): CPU limit 4 (JIT-miss compiles + ~100 rps/core);
      # memory: 12Gi limit = memoryBudgetMb (8192) LRU ceiling + ~4Gi headroom for instances/JIT.
      resources:
        requests:
          cpu: "1000m"
          memory: "2Gi"
        limits:
          cpu: "4000m"
          memory: "12Gi"

  # fix/pii-tokenization-env-override -- plain env/values off-switch for PII
  # tokenization/detokenization, independent of PostHog
  # (`waddles.core.disable-pii-tokenization`/`disable-pii-detokenization`).
  # The PostHog kill-switch alone can't be set in an environment with no
  # in-cluster PostHog (e.g. alpha), stranding that deployment behind
  # `core/svc_process`/`core/svc_action`'s fail-loud `build_hub_client` gate
  # whenever hub-api's internal gRPC isn't reachable yet -- see
  # `rules/critical-rules.md` Feature Flags & License Tiers' opt-out
  # kill-switch principle ("keeps unseen-flags-OFF without stranding
  # air-gapped deploys"). `true` (the default) renders no override env var
  # on either Rust stage, so `core/svc_process`/`core/svc_action`'s own
  # PostHog-gated, default-ENABLED, fail-loud-when-unreachable behavior is
  # unchanged. `false` renders `PII_TOKENIZATION_ENABLED=false` on
  # svc-process-rust and `PII_DETOKENIZATION_ENABLED=false` on
  # svc-action-rust and svc-presentation-rust -- both gates short-circuit to disabled (no hub_client
  # connect attempt, no fail-loud exit) and log a WARN naming the override.
  # SECURITY: ON by default in EVERY environment (alpha included) -- no
  # values-*.yaml may set this false. Opt-out is the PostHog kill-switch
  # `waddles.core.disable-pii-tokenization` only. This key is an explicit,
  # loudly-logged operator escape hatch, never a silent bypass.
  piiTokenization:
    enabled: true

# v3.0.x — svc-presentation (Rust; music overlay + per-community OBS browser-source
# surfaces). Image is presentation.rust.imageRepository -- see templates/svc-presentation-rust.yaml.
presentation:
  # Rust svc-presentation (core/svc_presentation, Dockerfile.rust). The legacy Python
  # Deployment was removed; this is the only presentation Deployment. Default true in every
  # environment (setting false renders NO presentation Deployment/Service). Image repo is a
  # bare name resolved via global.imageRegistry + global.imageTag (per-commit tag built by
  # scripts/alpha-deploy.sh), like svc-action-rust.
  rust:
    enabled: true
    imageRepository: "svc-presentation"
    # Alpha-only on-host access to the overlay view/SSE port: when true the Service becomes
    # NodePort (presentation.rust.nodePort.port). Base/beta/prod stay ClusterIP
    # (devops-kubernetes.md: no NodePort outside alpha).
    nodePort:
      enabled: false
      port: 31032
    # Overlay image bucket (IMAGE_BUCKET_*). Credentials are NEVER set here -- they are
    # sourced via secretKeyRef from the existing <release>-secrets Secret's
    # HUB_API_S3_ACCESS_KEY_ID/HUB_API_S3_SECRET_ACCESS_KEY (the hub-api SeaweedFS identity,
    # which already holds Read/Write/List/Tagging on infrastructure.seaweedfs.bucketName).
    # Empty bucketName falls back to infrastructure.seaweedfs.bucketName.
    imageBucket:
      bucketName: ""
      prefix: "overlay-images"
      region: "us-east-1"
    # Empty = OTLP export disabled (svc-presentation degrades to local logs/metrics; a dead
    # or absent exporter never breaks the app). Set per environment, never hardcoded.
    otlpEndpoint: ""
    otlpProtocol: "grpc"

# v3.0.x — Rust svc-streaming image (Issue #287). Own Dockerfile
# (core/svc_streaming/Dockerfile.rust), not the shared pipeline.pythonBaseImage
# placeholder.
streaming:
  # svc-streaming image variant for this deploy: cpu | amd | nvidia. The variant is appended to
  # the image tag (<tag>-<variant>); CI publishes all three. Pick per node pool: cpu where no GPU,
  # amd on Radeon/VA-API nodes, nvidia on NVIDIA nodes. Node-pool wiring and the degrade-to-CPU
  # behavior per variant: core/svc_streaming/README.md "Choosing a variant".
  gpuVariant: cpu
  # STREAM_ENCODER handed to the service: auto | cpu | nvenc | vaapi.
  encoder: auto
  image:
    repository: "svc-streaming"
    tag: ""
  # Node selection for the svc-streaming Deployment (every variant).
  nodeSelector: {}
  amd:
    # Device-plugin resource that exposes /dev/dri to the pod (AMD k8s-device-plugin). This is the
    # working path for non-privileged pods: the runtime's device cgroup only allows devices the
    # plugin declares. Requested as a limit; the pod is Pending on nodes without the resource.
    deviceResource: "amd.com/gpu"
    # hostPath mount of /dev/dri. Used ONLY when deviceResource is empty. Alone it is not enough
    # for a non-privileged pod -- open(/dev/dri/renderD128) fails with EPERM (device cgroup),
    # verified on penguin-frame. Also rejected by Pod Security Admission `restricted`.
    devDri: true
    # Pod supplementalGroups: the host GID(s) owning /dev/dri/renderD* (`getent group render`).
    # REQUIRED when gpuVariant=amd -- render fails loudly when empty, never a silent CPU fallback.
    supplementalGroups: []
  nvidia:
    # RuntimeClass selecting the NVIDIA container runtime (nvidia-container-toolkit). Empty = omit.
    runtimeClassName: nvidia
    # nvidia.com/gpu limit (NVIDIA device plugin). 0 = omit the limit: the pod is schedulable on
    # any node and runs CPU-only unless the node's default runtime exposes GPUs.
    gpuLimit: 1
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule

# feature/e2e-helm-rust-dataplane -- svc-bundles-executor (M2, core/bundle_executor). Brand-new
# module (not a rewrite of an existing Python image), so it needs its own image block same
# as streaming.image above -- bare repository name here (no global.imageRegistry
# concatenation, template renders this literally), values-alpha.yaml overrides to the full
# localhost:32000 path. fix/alpha-deploy-executor-and-failfast: core/bundle_executor/
# Dockerfile.rust now exists and scripts/alpha-deploy.sh builds+pushes it under the same
# per-commit SHA8 tag as every other alpha image (values-alpha.yaml's own tag is left
# unset so it falls through to global.imageTag) -- this is no longer a KNOWN GAP.
bundleExecutor:
  image:
    repository: "svc-bundles-executor"
    tag: ""

# Module verticals + migrations image
modules:
  # v3.0.x Task 0.5 — Module verticals (Bot/Social/Customer/Marketing) that load into the
  # pipeline containers above via modules.<name>.enabled. NOT per-module pods — see
  # docs/architecture/core-boundary.md and docs/plans/2026-08-26-v3-scbm-apps-design.md
  # "## Deployment" > "### Modules cut across stages".
  bot:
    enabled: true
  social:
    enabled: true
  customer:
    enabled: false
  marketing:
    enabled: false

  migrations:
    enabled: true
    name: migrations
    image: migrations
    imageTag: ""
    port: 8999
    replicas: 1
    resourcePreset: medium
    service:
      type: ClusterIP
      port: 8999
    env:
      MODULE_NAME: "migrations_module"
      MODULE_VERSION: "1.0.0"
      PORT: "8999"
      LOG_LEVEL: "INFO"
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

# Ingress Configuration
ingress:
  enabled: false
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: waddlebot.local
      paths:
        - path: /
          pathType: Prefix
          service: hub-webui-v3
          port: 8080
  tls:
    - secretName: waddlebot-tls
      hosts:
        - waddlebot.local

# fix/helm-platform-credentials -- externally-issued platform/third-party
# CREDENTIALS (client secrets, bot/OAuth/access/refresh tokens, webhook &
# signing secrets, service-account keys) are no longer set here. This chart
# never rendered a safe way to update them in place: an untouched values.yaml
# default (or a dev-only placeholder like `oauth.discord.botToken` used to be)
# was written into `waddlebot-secrets` on every `helm upgrade`, silently
# overwriting a real credential an operator had set out-of-band -- the alpha
# Discord-bot-token incident this branch fixes. They now live ONLY in the
# `waddlebot-platform-credentials` Secret (see `platformCredentials` below
# and docs/PLATFORM_CREDENTIALS.md), which this chart never writes.
#
# Non-secret companion config for the same platforms (URLs, tenant/project
# IDs, IRC nick/channels) stays below -- it isn't a credential.
platformCredentials:
  # Name of a pre-existing Secret holding externally-issued platform
  # credentials. Leave blank to use the default name
  # "<release-fullname>-platform-credentials". See docs/PLATFORM_CREDENTIALS.md

# Connector Configuration (svc-ingest channels and overrides)
config:
  # Twitch IRC receiver — comma-separated list of channel names to monitor
  twitchChannels: ""
  # Kick Pusher receiver — comma-separated list of channel slugs to monitor
  kickChannels: ""
  # Kick Pusher PUBLIC client key (not a secret, Kick's public key for websocket)
  kickPusherKey: ""
  # Kick Pusher cluster (e.g. "mt1" — empty uses Kick's default)
  kickPusherCluster: ""
  # YouTube Live poll receiver — comma-separated list of channel IDs to monitor
  youtubeLiveChannels: ""

# Dependencies Configuration
dependencies:
  ollama:
    enabled: true  # Use existing K8s daemonset/service
    host: "ollama-service"  # K8s service name
    port: 11434
  qdrant:
    enabled: true  # Use existing K8s service
    host: "infra-qdrant"
    port: 6333

# Shared Environment Variables (applied to all modules)
sharedEnv:
  # Database Configuration
  DB_HOST: "postgresql"
  DB_PORT: "5432"
  DB_NAME: "waddlebot"
  DB_USER: "waddlebot"
  # DB_PASSWORD should be set via secrets
  DB_POOL_SIZE: "20"
  DB_MAX_OVERFLOW: "10"

  # Redis Configuration
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  # REDIS_PASSWORD should be set via secrets

  # MinIO Configuration
  MINIO_ENDPOINT: "minio:9000"
  MINIO_SECURE: "false"
  # MINIO_ACCESS_KEY and MINIO_SECRET_KEY should be set via secrets

  # Ollama Configuration
  OLLAMA_HOST: "http://ollama:11434"
  OLLAMA_MODEL: "llama3.1"

  # Qdrant Configuration
  QDRANT_HOST: "qdrant"
  QDRANT_PORT: "6333"
  QDRANT_GRPC_PORT: "6334"

  # Router Configuration
  ROUTER_URL: "http://router:8000"

  # Hub Configuration
  HUB_URL: "http://hub:8060"

  # Logging Configuration
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  LOG_FILE_ENABLED: "true"
  LOG_FILE_PATH: "/var/log/waddlebotlog"
  LOG_FILE_MAX_BYTES: "10485760"
  LOG_FILE_BACKUP_COUNT: "5"

  # License Server
  LICENSE_SERVER_URL: "https://license.penguintech.io"
  RELEASE_MODE: "false"

  # Feature Flags
  ENABLE_METRICS: "true"
  ENABLE_TRACING: "false"
  ENABLE_PROFILING: "false"

# Persistent Volume Claims
persistence:
  logs:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteMany

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: "waddlebot"

# Pod Security Context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Container Security Context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL

# Monitoring & Observability
monitoring:
  prometheus:
    enabled: false
    serviceMonitor:
      enabled: false
      interval: 30s

  grafana:
    enabled: false
    dashboards:
      enabled: false

# HTTPRoute Configuration (Cilium Gateway API)
httproute:
  enabled: false
  gatewayName: shared
  gatewayNamespace: gateway
  hostnames: []
  rules: []

# Network Policies — namespace-level ingress isolation
# When enabled, denies all cross-namespace ingress and allows only
# same-namespace traffic + ingress controller traffic.
networkPolicy:
  enabled: false
  ingressNamespace: ingress-nginx

# SPIFFE/SPIRE workload identity (subchart: charts/spire). Off by default
# (opt-in per environment via values-alpha.yaml/values-beta.yaml/
# values-local.yaml). Only the values that differ from the subchart's own
# defaults (k8s/helm/waddlebot/charts/spire/values.yaml) are set here — see
# that chart's README for the full topology/registration-entry spec.
spire:
  enabled: false
  trustDomain: "penguintech.io"
  environment: "alpha"
  topology:
    role: child
    upstreamRoot:
      enabled: false

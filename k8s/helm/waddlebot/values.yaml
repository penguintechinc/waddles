# Connector Configuration (svc-ingest channels and overrides)
config:
  # Twitch IRC receiver — comma-separated list of channel names to monitor
  twitchChannels: ""
  # Kick Pusher receiver — comma-separated list of channel slugs to monitor
  kickChannels: ""
  # Kick Pusher PUBLIC client key (not a secret, Kick's public key for websocket)

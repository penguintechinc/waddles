# Ingress Configuration
ingress:
  enabled: false
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: waddlebot.local
      paths:
        - path: /
          pathType: Prefix
          service: hub
          port: 8060
        - path: /api/router
          pathType: Prefix
          service: router
          port: 8000
        # Core Data consolidated routes (analytics, engagement, reputation, labels)
        - path: /api/v1/analytics
          pathType: Prefix
          service: core-data
          port: 8040
        - path: /api/v1/engagement
          pathType: Prefix
          service: core-data
          port: 8040
        - path: /api/v1/reputation
          pathType: Prefix
          service: core-data
          port: 8040
        - path: /api/v1/labels
          pathType: Prefix
          service: core-data
          port: 8040
        # Core Identity consolidated routes (identity, security, credentials)
        - path: /api/v1/identity
          pathType: Prefix
          service: core-identity
          port: 8050
        - path: /api/v1/security
          pathType: Prefix
          service: core-identity
          port: 8050
        - path: /api/v1/credentials
          pathType: Prefix
          service: core-identity
          port: 8050
        # Core Community consolidated routes (community, workflow, browser-source, stream, module-rtc)
        - path: /api/v1/community-core
          pathType: Prefix
          service: core-community
          port: 8020
        - path: /api/v1/workflow
          pathType: Prefix
          service: core-community
          port: 8020
        - path: /api/v1/browser-source
          pathType: Prefix
          service: core-community
          port: 8020
        - path: /api/v1/stream
          pathType: Prefix
          service: core-community
          port: 8020
        # Interactive Social consolidated routes (alias, shoutout, presence, quote)
        - path: /api/v1/alias
          pathType: Prefix
          service: interactive-social
          port: 8010
        - path: /api/v1/shoutout
          pathType: Prefix
          service: interactive-social
          port: 8010
        - path: /api/v1/presence
          pathType: Prefix
          service: interactive-social
          port: 8010
        - path: /api/v1/quotes
          pathType: Prefix
          service: interactive-social
          port: 8010
        # Interactive Gaming consolidated routes (lfg, inventory, server-manager, server-status)
        - path: /api/v1/lfg
          pathType: Prefix
          service: interactive-gaming
          port: 8104
        - path: /api/v1/inventory
          pathType: Prefix
          service: interactive-gaming
          port: 8104
        - path: /api/v1/server-manager
          pathType: Prefix
          service: interactive-gaming
          port: 8104
        - path: /api/v1/server-status
          pathType: Prefix
          service: interactive-gaming
          port: 8104
        # Interactive Media consolidated routes (clip, spotify, youtube-music)
        - path: /api/v1/clips
          pathType: Prefix
          service: interactive-media
          port: 8105
        - path: /api/v1/spotify
          pathType: Prefix
          service: interactive-media
          port: 8105
        - path: /api/v1/youtube-music
          pathType: Prefix
          service: interactive-media
          port: 8105
        # Interactive Productivity consolidated routes (calendar, memories, translate)
        - path: /api/v1/calendar
          pathType: Prefix
          service: interactive-productivity
          port: 8030
        - path: /api/v1/memories
          pathType: Prefix
          service: interactive-productivity
          port: 8030
        - path: /api/v1/translate
          pathType: Prefix
          service: interactive-productivity
          port: 8030
        # Unchanged services
        - path: /api/v1/marketplace
          pathType: Prefix
          service: marketplace
          port: 8100
  tls:
    - secretName: waddlebot-tls
      hosts:
        - waddlebot.local


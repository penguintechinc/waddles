## Waddlebot - Alpha Environment Overrides
webui:
  publicUrl: "http://192.168.10.75:30879"  # node LAN IP + hub-webui NodePort — `!sq` links must open off-laptop
  # #320 Connections: Google/Spotify only accept http (non-TLS) redirect URIs on
  # `localhost` -- the LAN-IP publicUrl above is rejected by their OAuth consent screens.
  connectionsCallbackBaseUrl: "http://localhost:30879"

global:
  # fix/alpha-helm-deploy -- was "" (empty), which (a) rendered every
  # pipeline app container on its shared stock base image instead of its own
  # app image (templates/hub-api.yaml et al now use waddlebot.legacyModuleImage
  # instead), and (b) combined with migrations-job.yaml's then-unguarded
  # registry concatenation to render the malformed "/migrations:alpha". MUST
  # match scripts/deploy-alpha.sh's REGISTRY constant -- that script pushes
  # here, this chart pulls from here.
  imageRegistry: "localhost:32000/waddlebot"
  imageTag: "alpha"
  imagePullPolicy: IfNotPresent  # Never makes containerd skip localhost:32000 (ErrImageNeverPull) -- images are pushed, not side-loaded
  deploymentTier: "alpha"
  # gRPC transport TLS (PR #264) -- alpha is single-node local dev with no cert material
  # provisioned, so it uses flask_core's own documented dev-only escape hatch instead of
  # real certs (refused outright under production posture, so this can never leak into
  # beta/gamma/production even if this file were merged upward by mistake).
  grpcTls:
    insecureDev: true
  # First-run super-admin bootstrap (PR #256) -- email is non-sensitive and
  # documented so alpha's Playwright e2e suite (tests/k8s/alpha/) has a known
  # login. The password is NOT committed here (fix/alpha-helm-deploy) -- it
  # comes from the required WADDLEBOT_ALPHA_ADMIN_PASSWORD env var via
  # scripts/deploy-alpha.sh's generated secrets values file, same as
  # jwtSecret/moduleSecretKey/serviceApiKey/minio root creds below. NEVER
  # reused in beta/gamma/production (see values.yaml global.initialAdmin).
  initialAdmin:
    email: "admin@waddlebot.localhost.local"

# T10 (v3 Discord+Twitch demo) -- dev-only placeholder credentials, NEVER real tokens.
# Templated into the waddlebot-secrets K8s Secret (templates/secrets.yaml), not committed
# as literals anywhere else. Replace with real bot tokens via --set or an out-of-git values
# override before pointing this at a real Discord guild / Twitch channel.
oauth:
  discord:
    botToken: "REPLACE_ME_discord_bot_token_dev_only"
  twitch:
    oauthToken: "oauth:REPLACE_ME_twitch_irc_token_dev_only"
    nick: "waddlebot_demo"
    channels: "#waddlebot_demo_channel"

infrastructure:
  postgresql:
    enabled: true
    replicas: 1
    persistence: {size: 1Gi}
    resources:
      requests: { cpu: "250m", memory: "256Mi" }
      limits: { cpu: "1000m", memory: "1Gi" }
  redis:
    enabled: true
    replicas: 1
    persistence: {size: 512Mi}
    resources:
      requests: { cpu: "50m", memory: "64Mi" }
      limits: { cpu: "250m", memory: "256Mi" }
  # Issue #287 -- svc-streaming (Rust) recordings target. Min-spec'd for a single-node
  # laptop; service.name overridden to "waddlebot-minio" so the literal S3_ENDPOINT wired
  # into svc-streaming's env (templates/svc-streaming.yaml) resolves correctly.
  minio:
    enabled: true
    service:
      name: "waddlebot-minio"
      type: ClusterIP
    persistence:
      size: 2Gi
    resources:
      requests: { cpu: "50m", memory: "128Mi" }
      limits: { cpu: "300m", memory: "512Mi" }
  ollama:
    enabled: false
  qdrant:
    enabled: false

# WADDLES_AI_ENABLED=false -- no Ollama deployed above (infrastructure.
# ollama.enabled: false), so hub-api's AI-routing subsystem stays off too
# rather than crash-looping/degrading against an unreachable backend. Now global (T10):
# svc-ingest/svc-process/svc-action all render WADDLES_AI_ENABLED from this same value.
#
# Resources/replicas min-spec'd for a single-node laptop (see docs/plans -- alpha
# min-spec pass). Pipeline app services share one generic tier; hubApi/hubWebui are
# sized individually to match their lighter footprint.
#
# fix/alpha-helm-deploy -- this file must render a COMPLETE working stack on its
# own (no --set needed for anything but secrets), so hubWebui/svcPresentation/
# svcStreaming are re-enabled here, superseding the earlier T10 (v3 demo)
# "minimal 5-of-8" scoping that left them off. All three already had their
# resources/replicas min-spec'd below for exactly this re-enable (see the old
# comment this replaces), so no re-sizing was needed. svcCore/svcRtc stay
# disabled -- svcCore has no Dockerfile yet (still the shared base-image
# skeleton) and svcRtc is additionally gated on modules.social.enabled; neither
# is part of this fix's scope.
pipeline:
  svcIngest:
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
  svcProcess:
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
  svcAction:
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
  svcCore:
    enabled: false
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
  hubApi:
    aiEnabled: false
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "400m", memory: "384Mi" }
  hubWebui:
    enabled: true
    replicas: 1
    resources:
      requests: { cpu: "50m", memory: "64Mi" }
      limits: { cpu: "200m", memory: "256Mi" }
  svcRtc:
    enabled: false
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
  svcPresentation:
    enabled: true
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
  # Issue #287 -- transcode-capable min-spec (higher than the generic pipeline tier above)
  # plus fixed alpha NodePorts for direct RTMP/SRT/HTTP media ingest (OBS/ffmpeg target
  # localhost:31935 for RTMP push). PUBLIC_BASE_URL uses the node LAN IP + the http
  # NodePort below so playback URLs resolve off-laptop, matching webui.publicUrl's pattern.
  svcStreaming:
    enabled: true
    replicas: 1
    publicBaseUrl: "http://192.168.10.75:31208"
    nodePort:
      enabled: true
      rtmpPort: 31935
      srtPort: 30900
      httpPort: 31208
    resources:
      requests: { cpu: "200m", memory: "256Mi" }
      limits: { cpu: "2000m", memory: "1Gi" }

  # LICENSE_DEPLOYMENT_DOMAIN -- enables domain-based license bypass for internal deployments
  # (penguintech.cloud, penguincloud.io domains); set in alpha to allow feature flags
  # to resolve ON. Unset in prod (fail-closed, no bypass).
  licenseDeploymentDomain: "waddlebot.penguintech.cloud"

  # feature/e2e-helm-rust-dataplane -- Rust data-plane stack. `enabled: false` here too
  # (this file must still render a fully-working Python stack on its own by default,
  # matching every other alpha convention above) -- flip via
  # `--set pipeline.rustDataPlane.enabled=true` for the actual e2e cutover run, after:
  #   1. building+pushing all 4 images (see this branch's handoff notes for the exact list
  #      -- core/bundle_executor has no Dockerfile at all yet);
  #   2. populating global.hostApiTls with real mTLS material via --set-file (no
  #      insecureDev escape hatch exists, unlike global.grpcTls);
  #   3. optionally disabling the Python pipeline.svcIngest/svcProcess/svcAction
  #      Deployments above if the Rust image was pushed over their same alpha tag
  #      (see values.yaml's own comment on the shared-tag cutover convention).
  rustDataPlane:
    enabled: false
    svcIngest:
      replicas: 1
      resources:
        requests: { cpu: "100m", memory: "128Mi" }
        limits: { cpu: "500m", memory: "512Mi" }
    svcProcess:
      replicas: 1
      # migration 083's seeded 3-stage demo app_id (config/postgres/migrations/
      # 083_discord_twitch_demo_convergence.sql) -- same app_id the Python pipeline demo
      # (pipeline.hubApi et al) already activates for the 'global' tenant.
      processAppId: "waddles.bot.discord.default"
      resources:
        requests: { cpu: "100m", memory: "128Mi" }
        limits: { cpu: "500m", memory: "512Mi" }
    svcAction:
      replicas: 1
      actionAppId: "waddles.bot.discord.default"
      resources:
        requests: { cpu: "100m", memory: "128Mi" }
        limits: { cpu: "500m", memory: "512Mi" }
    bundleExecutor:
      replicas: 1
      resources:
        requests: { cpu: "100m", memory: "64Mi" }
        limits: { cpu: "500m", memory: "256Mi" }

presentation:
  image:
    repository: "localhost:32000/waddlebot/svc-presentation"
    tag: "alpha"
  service:
    type: NodePort
    nodePort: 31032
  # Matches pipeline.svcStreaming.publicBaseUrl above -- same media NodePort host, so
  # live_stream.py's browser-facing HLS URLs resolve off-laptop like svc-streaming's own.
  publicStreamingUrl: "http://192.168.10.75:31208"

# Issue #287 -- svc-streaming (Rust) image, built locally + pushed to the local registry
# (no CI image for it yet), same as every other alpha module.
streaming:
  image:
    repository: "localhost:32000/waddlebot/svc-streaming"
    tag: "alpha"

# feature/e2e-helm-rust-dataplane -- bundle-executor built locally + pushed to the local
# registry (no Dockerfile/CI image exists for this crate yet -- see
# pipeline.rustDataPlane.bundleExecutor's KNOWN GAPS comment in values.yaml), same pattern
# as every other alpha-only module image.
bundleExecutor:
  image:
    repository: "localhost:32000/waddlebot/bundle-executor"
    tag: "alpha"

# Reputation service (Issue #310) -- built locally, pushed to the local
# registry (no CI image for it yet), same as every other alpha module.
reputation:
  replicas: 1
  image:
    repository: "localhost:32000/waddlebot/reputation-module"
    tag: "alpha"
  env:
    deploymentTier: "alpha"
    workers: 1
  resources:
    requests: { cpu: "50m", memory: "96Mi" }
    limits: { cpu: "300m", memory: "256Mi" }

ingress:
  enabled: false
spire:
  enabled: true
  environment: "alpha"
  server:
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "250m", memory: "256Mi" }
  agent:
    resources:
      requests: { cpu: "50m", memory: "64Mi" }
      limits: { cpu: "150m", memory: "128Mi" }

# Alpha is where the local e2e Playwright suite runs (tests/k8s/alpha/07-page-load.sh).
# Unlike beta (which already raises this 3x for the same reason), alpha inherited no
# override at all and ran on the hardcoded 100 req/min production default -- too strict
# for rapid SERIAL Playwright runs against a cold, cache-less cluster. Alpha-only,
# env-var driven (admin/hub_module/backend/src/config/index.js); production/default
# stays untouched at 100.
#
# T10 (v3 demo) -- the ~26 legacy per-module Deployments (collectors/pushing/interactive/
# core) are superseded for this demo by the 4 new pipeline containers above (svc-ingest
# now owns Discord/Twitch ingest in-process; see PIPELINE_MAPPING.md for the full 31->7
# mapping). Disabled here (enabled: false) rather than left running duplicate/idle
# capacity alongside the new pipeline -- resources/replicas below stay min-spec'd (hub/
# hubWebui match their pipeline.hubApi/hubWebui tier above; every other rendered module
# shares one generic legacy tier of 50m/96Mi req, 300m/384Mi lim) so re-enabling any one
# of them for a non-demo alpha run needs no re-sizing. modules.bot/social stay enabled
# (true, from values.yaml) -- those are the MODULE_LOAD_* bundle-import toggles the
# pipeline containers themselves read, not legacy Deployment gates.
modules:
  hub:
    enabled: false
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "400m", memory: "384Mi" }
    env:
      RATE_LIMIT_MAX_REQUESTS: "1000"    # ~10x default; local e2e test/dev only
      RATE_LIMIT_WINDOW_MS: "60000"      # keep 60s window unchanged
  hubWebui:
    enabled: false
    replicas: 1
    resources:
      requests: { cpu: "50m", memory: "64Mi" }
      limits: { cpu: "200m", memory: "256Mi" }
  router:
    enabled: false
    replicas: 1
    resources:
      requests: { cpu: "50m", memory: "96Mi" }
      limits: { cpu: "300m", memory: "384Mi" }
  coreData:
    enabled: false
    replicas: 1
    resources:
      requests: { cpu: "50m", memory: "96Mi" }
      limits: { cpu: "300m", memory: "384Mi" }
  coreIdentity:
    enabled: false
    replicas: 1
    resources:
      requests: { cpu: "50m", memory: "96Mi" }
      limits: { cpu: "300m", memory: "384Mi" }
  coreCommunity:
    enabled: false
    replicas: 1
    resources:
      requests: { cpu: "50m", memory: "96Mi" }
      limits: { cpu: "300m", memory: "384Mi" }
  triggerWebhooks:
    enabled: false
    replicas: 1
    resources:
      requests: { cpu: "50m", memory: "96Mi" }
      limits: { cpu: "300m", memory: "384Mi" }
  triggerStreaming:
    enabled: false
    replicas: 1
    resources:
      requests: { cpu: "50m", memory: "96Mi" }
      limits: { cpu: "300m", memory: "384Mi" }
  actionPlatforms:
    enabled: false
    replicas: 1
    resources:
      requests: { cpu: "50m", memory: "96Mi" }
      limits: { cpu: "300m", memory: "384Mi" }
  actionServerless:
    enabled: false
    replicas: 1
    resources:
      requests: { cpu: "50m", memory: "96Mi" }
      limits: { cpu: "300m", memory: "384Mi" }
  interactiveSocial:
    enabled: false
    replicas: 1
    resources:
      requests: { cpu: "50m", memory: "96Mi" }
      limits: { cpu: "300m", memory: "384Mi" }
  interactiveGaming:
    enabled: false
    replicas: 1
    resources:
      requests: { cpu: "50m", memory: "96Mi" }
      limits: { cpu: "300m", memory: "384Mi" }
  interactiveMedia:
    enabled: false
    replicas: 1

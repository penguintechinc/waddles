# feature/e2e-helm-rust-dataplane -- Rust svc-process (core/svc_process) Deployment,
# ADDITIVE to templates/svc-process.yaml's Python Deployment -- never replaces it. Gated on
# the top-level pipeline.rustDataPlane.enabled flag (default false) plus this stage's own
# .enabled sub-flag. See templates/svc-ingest-rust.yaml's header for the full `-rust`
# resource-naming-vs-shared-image-tag rationale (identical here) -- not repeated per file.
#
# fix/svc-process-host-api-wiring-alpha -- core/svc_process/src/config.rs now HAS
# HOST_API_PORT/HOST_API_SERVER_CERT_FILE/HOST_API_SERVER_KEY_FILE/HOST_API_CLIENT_CA_FILE
# fields (the M4 host-API server landed; the prior "KNOWN GAP" comment here was stale) --
# wired the same way templates/svc-action-rust.yaml's own server-role host-API env/volume
# already is. bundleExecutor.stageTarget must point at svc-process-rust (not its
# svc-action-rust default) for the ping-bundle e2e proof, since PROCESS_BUNDLE_* above is
# what drives the `load`/`invoke` calls this connection carries. CACHE_HOST/CACHE_PORT are
# wired explicitly below (not envFrom'd) because the shared ConfigMap only exposes
# REDIS_HOST/REDIS_PORT, a different name than this crate's CliConfig reads.
{{- if and .Values.pipeline.rustDataPlane.enabled .Values.pipeline.rustDataPlane.svcProcess.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "waddlebot.fullname" . }}-svc-process-rust
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: svc-process-rust
spec:
  replicas: {{ .Values.pipeline.rustDataPlane.svcProcess.replicas }}
  selector:
    matchLabels:
      {{- include "waddlebot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: svc-process-rust
  template:
    metadata:
      annotations:
        # fix/cert-regen-on-identity-change -- rolls every pod when the desired
        # host-api-tls identity/SANs change, even though the Secret object itself is
        # reused by name when kept (see templates/host-api-tls-secret.yaml's policy
        # comment); derived from identity+SANs only, never key material.
        {{- if eq (include "waddlebot.hostApiTlsMaterialAvailable" .) "true" }}
        checksum/host-api-tls: {{ include "waddlebot.hostApiTlsPodChecksum" . | quote }}
        {{- end }}
        # fix/valkey-cert-rollout-and-migrate-wait -- see templates/infrastructure/
        # redis.yaml's identical annotation comment; rolls this client pod in lockstep
        # with the Valkey server on any identity/SAN change.
        # regression: valkey cert regenerated but server pod not rolled; clients BadSignature (alpha 2026-10-02)
        {{- if eq (include "waddlebot.valkeyTlsMaterialAvailable" .) "true" }}
        checksum/valkey-tls: {{ include "waddlebot.valkeyTlsPodChecksum" . | quote }}
        {{- end }}
      labels:
        {{- include "waddlebot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: svc-process-rust
    spec:
      # Dedicated identity (feature/eddsa-machine-jwt, security review HIGH
      # finding) -- distinguishes this deployment's pods from every other
      # workload in the namespace for `flask_core.service_jwt`'s TokenReview
      # bootstrap; see templates/service-jwt-rbac.yaml. Shared with the
      # Python svc-process Deployment above -- both are the same logical
      # caller identity, never both running against hub-api at once in a
      # given environment.
      serviceAccountName: svc-process
      {{- include "waddlebot.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # fix/chart-fresh-install-hooks (alpha 2026-10-01) -- waits on hub-api's own
      # /ready instead of re-running migrations per-pod (see _helpers.tpl).
      initContainers:
      {{- include "waddlebot.waitForHubApiInitContainer" . | nindent 6 }}
      containers:
      - name: svc-process-rust
        image: "{{ include "waddlebot.legacyModuleImage" (dict "root" . "module" (.Values.pipeline.rustDataPlane.svcProcess.imageRepository | default "svc-process-rust") "imageTag" .Values.global.imageTag) }}"
        # Values-driven (.Values.global.imagePullPolicy, default IfNotPresent). Deploys carry
        # a unique per-deploy global.imageTag, so a stale same-tag node cache can no longer
        # occur -- the old hardcoded Always was unnecessary and fatal for locally-loaded
        # images (kind e2e, alpha local builds: Always forces a registry pull the node cannot
        # satisfy, so the pod never becomes Ready). Set global.imagePullPolicy=Always per-env
        # only when deploying a mutable tag.
        imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
        # Pinned to the Rust image's own `appuser` (uid 10001, core/svc_process/
        # Dockerfile.rust), not the chart-wide .Values.securityContext (uid 1000) the
        # Python placeholder templates use -- same pattern as templates/svc-streaming.yaml.
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: {{ .Values.pipeline.rustDataPlane.svcProcess.port }}
          protocol: TCP
        - name: metrics
          containerPort: {{ .Values.pipeline.rustDataPlane.svcProcess.metricsPort }}
          protocol: TCP
        - name: host-api
          containerPort: {{ .Values.pipeline.rustDataPlane.svcProcess.hostApiPort }}
          protocol: TCP
        envFrom:
        - configMapRef:
            name: {{ include "waddlebot.fullname" . }}-config
        - secretRef:
            name: {{ include "waddlebot.fullname" . }}-secrets
        # feature/alpha-localized-posthog -- POSTHOG_KEY for
        # penguin_licensing::LicenseConfig::from_env's flag_enabled() calls
        # (core/svc_process/src/license.rs), auto-provisioned by
        # templates/infrastructure/posthog/bootstrap.yaml. optional: true --
        # safe before the bootstrap Job runs or when posthog.enabled=false.
        - secretRef:
            name: {{ .Values.posthog.bootstrap.secretName | default "posthog-bootstrap-secret" }}
            optional: true
        env:
        - name: MODULE_PORT
          value: {{ .Values.pipeline.rustDataPlane.svcProcess.port | quote }}
        - name: METRICS_PORT
          value: {{ .Values.pipeline.rustDataPlane.svcProcess.metricsPort | quote }}
        - name: HOST_API_PORT
          value: {{ .Values.pipeline.rustDataPlane.svcProcess.hostApiPort | quote }}
        # fix/executor-link-heartbeat (alpha 2026-10-02 incident): how often
        # this stage pings each connected executor session -- see
        # `core/svc_process/src/host_api.rs`.
        - name: HEARTBEAT_INTERVAL_MS
          value: {{ .Values.pipeline.rustDataPlane.svcProcess.heartbeatIntervalMs | default 5000 | quote }}
        # regression: readiness gated on executor connection deadlocked
        # rollouts (alpha 2026-10-02) -- NO LONGER wired into `/healthz`/
        # `/health` (a bundle-executor dials this service through its
        # ClusterIP Service, which only routes to Ready pods, so gating
        # readiness/liveness on executor presence deadlocked rollouts). Now
        # only the threshold for the periodic zero-executor ERROR log
        # (`crate::host_api::run_zero_executor_watchdog`).
        - name: EXECUTOR_GRACE_SECONDS
          value: {{ .Values.pipeline.rustDataPlane.svcProcess.executorGraceSeconds | default 60 | quote }}
        # Security review fix (PR #468, MEDIUM): the bundle `http` egress guard's
        # cluster-CIDR denylist and instance-wide private-IP policy
        # (bundle_host_http::egress::{ClusterCidrDenylist,InstanceEgressPolicy}) -- shared
        # across every Rust data-plane stage so pod/Service/node ranges are declared once.
        # DEPLOYMENT_TIER itself comes from the shared ConfigMap (envFrom above,
        # global.deploymentTier) -- CliConfig::validate hard-fails startup if this list is
        # empty outside alpha/local. See values.yaml's own comment on this key for the
        # "OVERRIDE REQUIRED in beta/gamma/production" note.
        - name: EGRESS_CLUSTER_CIDR_DENYLIST
          value: {{ .Values.pipeline.rustDataPlane.egressClusterCidrDenylist | join "," | quote }}
        - name: INSTANCE_EGRESS_ALLOW_PRIVATE_IP
          value: {{ .Values.pipeline.rustDataPlane.instanceEgressAllowPrivateIp | quote }}
        {{- if eq (include "waddlebot.hostApiTlsMaterialAvailable" .) "true" }}
        {{- include "waddlebot.hostApiTlsServerEnv" . | nindent 8 }}
        {{- end }}
        - name: HUB_API_URL
          value: "http://{{ include "waddlebot.fullname" . }}-hub-api-v3:{{ .Values.pipeline.hubApi.port }}"
        # feature/hub-grpc-env-wiring (closes #569's startup seam) -- core/hub_client::
        # HubClient needs hub-api's internal gRPC endpoint (TLS mandatory, see
        # hub_api/grpc_internal/server.py) and its machine-JWT bootstrap endpoint
        # (hub_api/blueprints/service_jwt_bp.py POST /internal/service-token). Both
        # default to hub-api's own in-cluster Service, computed here rather than
        # requiring a per-environment override (see values.yaml's own comment on this
        # key, incl. the KNOWN GAP note on hub-api's TLS wiring + hub_client's CA trust).
        - name: HUB_API_GRPC_ENDPOINT
          value: {{ .Values.pipeline.rustDataPlane.hubApiGrpcEndpoint | default (printf "https://%s-hub-api-v3:%v" (include "waddlebot.fullname" .) .Values.pipeline.hubApi.grpcPort) | quote }}
        - name: SERVICE_JWT_TOKEN_ENDPOINT
          value: {{ .Values.pipeline.rustDataPlane.serviceJwtTokenEndpoint | default (printf "http://%s-hub-api-v3:%v/internal/service-token" (include "waddlebot.fullname" .) .Values.pipeline.hubApi.port) | quote }}
        # Matches the audience-scoped projected token this pod already mounts via
        # waddlebot.serviceJwtBootstrapVolume(Mount) below -- NOT the generic default
        # k8s SA token path (wrong audience, hub-api's TokenReview call would reject
        # it with "missing required audience").
        - name: SERVICE_JWT_SA_TOKEN_PATH
          value: "/var/run/secrets/waddlebot/service-jwt/service-jwt-bootstrap-token"
        # fix/pii-tokenization-env-override -- plain env off-switch, independent of the
        # waddles.core.disable-pii-tokenization PostHog kill-switch (unusable in an
        # environment with no in-cluster PostHog, e.g. alpha). Only rendered when
        # pipeline.piiTokenization.enabled is false (see values.yaml's own comment);
        # omitted entirely otherwise, so the default PostHog-gated behavior is unchanged.
        {{- if not .Values.pipeline.piiTokenization.enabled }}
        - name: PII_TOKENIZATION_ENABLED
          value: "false"
        {{- end }}
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: DB_PASSWORD
        - name: SERVICE_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: SERVICE_API_KEY
        # CliConfig reads CACHE_HOST/CACHE_PORT/CACHE_PASSWORD -- the shared ConfigMap only
        # publishes REDIS_HOST/REDIS_PORT (a different name), so these are wired explicitly.
        - name: CACHE_HOST
          value: {{ .Values.infrastructure.redis.service.name | quote }}
        - name: CACHE_PORT
          value: {{ .Values.infrastructure.redis.service.port | quote }}
        - name: CACHE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: REDIS_PASSWORD
        {{- if eq (include "waddlebot.valkeyTlsMaterialAvailable" .) "true" }}
        # fix/valkey-tls-alpha -- overrides the plaintext VALKEY_URL this container would
        # otherwise inherit via envFrom's secretRef (templates/secrets.yaml) with the
        # rediss:// TLS listener (see infrastructure/redis.yaml's dual-listener). K8s env
        # resolution: an explicit `env:` entry always wins over the same name from
        # `envFrom` regardless of list order. Sourced via secretKeyRef (VALKEY_URL_TLS,
        # never an inline `value:`) so this entry's field TYPE never flips between
        # deploys regardless of infrastructure.redis.tls.enabled -- see secrets.yaml's
        # comment on VALKEY_URL_TLS for why that matters for an in-place upgrade.
        # VALKEY_PASSWORD is wired explicitly because `penguin_spine::SpineConfig::
        # validate()`'s security.transport.auth check reads this env var directly -- it
        # does NOT parse credentials back out of VALKEY_URL. No VALKEY_CA_FILE override:
        # the mounted CA lands at SpineConfig's own default path
        # (/etc/waddles/ca/valkey-ca.crt).
        - name: VALKEY_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: VALKEY_URL_TLS
        - name: VALKEY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: REDIS_PASSWORD
        {{- end }}
        # fix/alpha-deploy-executor-and-failfast -- the legacy single-app selection env
        # below (PROCESS_APP_ID, PROCESS_INGEST_*, PROCESS_BUNDLE_*) now renders ONLY
        # when an operator explicitly sets the driving value -- never unconditionally
        # with an empty string. Default posture (unset): the DB-driven multi-tenant
        # active-bundle loader further below is the sole bundle-selection path. Empty
        # (default) previously disabled the spine drain loop/executor load path the
        # same way, functionally, but left a stale digest/app_id one `helm upgrade` away
        # from silently winning back if the DB-driven path is ever disabled -- see
        # values-alpha.yaml's own comment on this change.
        {{- if .Values.pipeline.rustDataPlane.svcProcess.processAppId }}
        - name: PROCESS_APP_ID
          value: {{ .Values.pipeline.rustDataPlane.svcProcess.processAppId | quote }}
        {{- end }}
        {{- if .Values.pipeline.rustDataPlane.svcProcess.processIngestPlatform }}
        - name: PROCESS_INGEST_PLATFORM
          value: {{ .Values.pipeline.rustDataPlane.svcProcess.processIngestPlatform | quote }}
        {{- end }}
        {{- if .Values.pipeline.rustDataPlane.svcProcess.processIngestSourceId }}
        - name: PROCESS_INGEST_SOURCE_ID
          value: {{ .Values.pipeline.rustDataPlane.svcProcess.processIngestSourceId | quote }}
        {{- end }}
        {{- if .Values.pipeline.rustDataPlane.svcProcess.processBundleDigest }}
        - name: PROCESS_BUNDLE_DIGEST
          value: {{ .Values.pipeline.rustDataPlane.svcProcess.processBundleDigest | quote }}
        - name: PROCESS_BUNDLE_VERSION
          value: {{ .Values.pipeline.rustDataPlane.svcProcess.processBundleVersion | default "1" | quote }}
        - name: PROCESS_BUNDLE_COMPONENT_KEY
          value: {{ .Values.pipeline.rustDataPlane.svcProcess.processBundleComponentKey | default "" | quote }}
        - name: PROCESS_BUNDLE_SIDECAR_KEY
          value: {{ .Values.pipeline.rustDataPlane.svcProcess.processBundleSidecarKey | default "" | quote }}
        {{- end }}
        # DB-driven active-bundle loader (core/svc_process/src/config.rs,
        # core/bundle_active_set) -- see values.yaml's comment on this block. Reader
        # host/port/name default to the SAME primary Postgres this pod's DB_* above
        # already points at (no read replica provisioned yet); DB_READER_PASSWORD comes
        # from the shared secret (empty by default -- the loader stays disabled until a
        # real RO-account password is provisioned, see templates/secrets.yaml).
        - name: DB_READER_HOST
          value: {{ .Values.pipeline.rustDataPlane.svcProcess.dbReaderHost | default .Values.infrastructure.postgresql.service.name | quote }}
        - name: DB_READER_PORT
          value: {{ .Values.pipeline.rustDataPlane.svcProcess.dbReaderPort | default .Values.infrastructure.postgresql.service.port | quote }}
        - name: DB_READER_NAME
          value: {{ .Values.pipeline.rustDataPlane.svcProcess.dbReaderName | default .Values.infrastructure.postgresql.database | quote }}
        # fix/helm-apply-errors -- see templates/svc-action-rust.yaml's identical comment
        # on this same env var name for the full rationale (identical here): never
        # switch DB_READER_USER back to valueFrom, a retired chart revision's
        # valueFrom(waddlebot-bundle-reader/...) for this exact name is why a live
        # upgrade fails with "env[N].valueFrom: ... may not be specified when value is
        # not empty" (kubectl's merge-by-name deep-merges the old and new field sets).
        # feature/bundle-reader-role -- default changed from "svc_process_ro" (never
        # backed by any migration) to "waddles_bundle_reader" (alembic/versions/
        # 0032_bundle_reader_role.py), the role name migrations 0025/0028 already
        # grant SELECT to.
        - name: DB_READER_USER
          value: {{ .Values.pipeline.rustDataPlane.svcProcess.dbReaderUser | default "waddles_bundle_reader" | quote }}
        - name: DB_READER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: DB_READER_PASSWORD
        {{- /* BUNDLE_SCOPE_TENANT_ID/BUNDLE_SCOPE_COMMUNITY_ID REMOVED (dataplane
        scale design, multi-tenant change-log consumer -- user requirement: "every
        svc_process/svc_action pod serves ALL tenants"). This loader now discovers
        and serves every (tenant_id, community_id) scope in the database itself
        (bundle_active_set::read_active_set_all); there is no per-pod tenant scope
        left to configure. */}}
        - name: BUNDLE_CONFIG_POLL_SECONDS
          # Incremental change-log poll interval, in whole seconds (floor: 5s,
          # core/svc_process/src/config.rs CliConfig::bundle_config_poll_interval).
          # Semantics unchanged from the retired single-tenant watermark loader.
          value: {{ .Values.pipeline.rustDataPlane.svcProcess.bundleConfigPollSeconds | default 300 | quote }}
        - name: BUNDLE_CONFIG_FULL_RECONCILE_MINUTES
          # Periodic full active-set reconcile interval, in whole minutes (floor:
          # 1m) -- bounds the blast radius of any change-log defect to one
          # interval, independent of the change-log's own correctness.
          value: {{ .Values.pipeline.rustDataPlane.svcProcess.bundleConfigFullReconcileMinutes | default 15 | quote }}
        {{- if .Values.pipeline.hubApi.enabled }}
        # fix/hub-grpc-tls-and-ca-trust (PR #570 review blocker 2) -- the CA that signed
        # hub-api's internal gRPC server cert, so core/hub_client::HubClient::connect can
        # verify it (rustls client root store) instead of trusting only system/webpki
        # roots, which never includes this chart's self-signed/internal CA.
        {{- include "waddlebot.hubApiGrpcCaEnv" . | nindent 8 }}
        {{- end }}
        # feature/alpha-command-flag-envs -- Docker ENV baseline for data-plane feature
        # flags, keyed `FLAG_<KEY>` (flag key uppercased, `.`/`-` -> `_`), e.g.
        # `waddles.command-8ball` -> `FLAG_WADDLES_COMMAND_8BALL`. waddle_sdk's
        # feature_enabled() reads this as the baseline and PostHog overrides it when
        # connected -- lets alpha run command bundles with posthog.enabled=false. NOT
        # usable for license-gated flags (Enterprise/Professional entitlements) -- those
        # resolve against license.penguintech.io only, no env override, by design.
        {{- if .Values.pipeline.rustDataPlane.svcProcess.extraEnv }}
        {{- range $key, $value := .Values.pipeline.rustDataPlane.svcProcess.extraEnv }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.pipeline.rustDataPlane.svcProcess.resources | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        {{- if eq (include "waddlebot.valkeyTlsMaterialAvailable" .) "true" }}
        {{- include "waddlebot.valkeyTlsCaVolumeMount" . | nindent 8 }}
        {{- end }}
        {{- if eq (include "waddlebot.hostApiTlsMaterialAvailable" .) "true" }}
        {{- include "waddlebot.hostApiTlsVolumeMount" . | nindent 8 }}
        {{- end }}
        {{- if .Values.pipeline.hubApi.enabled }}
        {{- include "waddlebot.hubApiGrpcCaVolumeMount" . | nindent 8 }}
        {{- end }}
        {{- include "waddlebot.serviceJwtBootstrapVolumeMount" . | nindent 8 }}
      volumes:
      - name: tmp
        emptyDir: {}
      {{- include "waddlebot.serviceJwtBootstrapVolume" . | nindent 6 }}
      {{- if eq (include "waddlebot.hostApiTlsMaterialAvailable" .) "true" }}
      {{- include "waddlebot.hostApiTlsVolume" . | nindent 6 }}
      {{- end }}
      {{- if eq (include "waddlebot.valkeyTlsMaterialAvailable" .) "true" }}
      {{- include "waddlebot.valkeyTlsCaVolume" . | nindent 6 }}
      {{- end }}
      {{- if .Values.pipeline.hubApi.enabled }}
      {{- include "waddlebot.hubApiGrpcCaVolume" . | nindent 6 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "waddlebot.fullname" . }}-svc-process-rust
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: svc-process-rust
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.pipeline.rustDataPlane.svcProcess.port }}
    targetPort: http
    protocol: TCP
    name: http
  - port: {{ .Values.pipeline.rustDataPlane.svcProcess.metricsPort }}
    targetPort: metrics
    protocol: TCP
    name: metrics
  - port: {{ .Values.pipeline.rustDataPlane.svcProcess.hostApiPort }}
    targetPort: host-api
    protocol: TCP
    name: host-api
  selector:
    {{- include "waddlebot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: svc-process-rust
{{- end }}

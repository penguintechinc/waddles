# feature/e2e-helm-rust-dataplane -- Rust svc-process (core/svc_process) Deployment,
# ADDITIVE to templates/svc-process.yaml's Python Deployment -- never replaces it. Gated on
# the top-level pipeline.rustDataPlane.enabled flag (default false) plus this stage's own
# .enabled sub-flag. See templates/svc-ingest-rust.yaml's header for the full `-rust`
# resource-naming-vs-shared-image-tag rationale (identical here) -- not repeated per file.
#
# fix/svc-process-host-api-wiring-alpha -- core/svc_process/src/config.rs now HAS
# HOST_API_PORT/HOST_API_SERVER_CERT_FILE/HOST_API_SERVER_KEY_FILE/HOST_API_CLIENT_CA_FILE
# fields (the M4 host-API server landed; the prior "KNOWN GAP" comment here was stale) --
# wired the same way templates/svc-action-rust.yaml's own server-role host-API env/volume
# already is. bundleExecutor.stageTarget must point at svc-process-rust (not its
# svc-action-rust default) for the ping-bundle e2e proof, since PROCESS_BUNDLE_* above is
# what drives the `load`/`invoke` calls this connection carries. CACHE_HOST/CACHE_PORT are
# wired explicitly below (not envFrom'd) because the shared ConfigMap only exposes
# REDIS_HOST/REDIS_PORT, a different name than this crate's CliConfig reads.
{{- if and .Values.pipeline.rustDataPlane.enabled .Values.pipeline.rustDataPlane.svcProcess.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "waddlebot.fullname" . }}-svc-process-rust
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: svc-process-rust
spec:
  replicas: {{ .Values.pipeline.rustDataPlane.svcProcess.replicas }}
  selector:
    matchLabels:
      {{- include "waddlebot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: svc-process-rust
  template:
    metadata:
      labels:
        {{- include "waddlebot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: svc-process-rust
    spec:
      # Dedicated identity (feature/eddsa-machine-jwt, security review HIGH
      # finding) -- distinguishes this deployment's pods from every other
      # workload in the namespace for `flask_core.service_jwt`'s TokenReview
      # bootstrap; see templates/service-jwt-rbac.yaml. Shared with the
      # Python svc-process Deployment above -- both are the same logical
      # caller identity, never both running against hub-api at once in a
      # given environment.
      serviceAccountName: svc-process
      {{- include "waddlebot.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
      {{- include "waddlebot.dbMigrateInitContainer" . | nindent 6 }}
      containers:
      - name: svc-process-rust
        image: "{{ include "waddlebot.legacyModuleImage" (dict "root" . "module" (.Values.pipeline.rustDataPlane.svcProcess.imageRepository | default "svc-process-rust") "imageTag" .Values.global.imageTag) }}"
        # Hardcoded Always (not .Values.global.imagePullPolicy) -- this Rust data-plane image
        # iterates rapidly against the mutable `alpha` tag on the in-cluster registry and the
        # node's containerd IfNotPresent cache was proven to serve a stale binary after a
        # same-tag push (alpha deploy retro). Always guarantees the running pod matches the
        # registry's current digest for this actively-iterating tag.
        # feature/ci-chart-kind-e2e -- Always is right for real alpha (mutable
        # tag reuse staleness, see comment above/nearby), but wrong whenever
        # global.imagePullPolicy is explicitly "Never" (kind/CI, air-gapped,
        # `kind load`-ed images only) -- Always would force a real registry
        # pull attempt that can never succeed there. "Never" itself carries no
        # staleness risk to guard against (no pull happens at all either way).
        imagePullPolicy: {{ eq .Values.global.imagePullPolicy "Never" | ternary "Never" "Always" }}
        # Pinned to the Rust image's own `appuser` (uid 10001, core/svc_process/
        # Dockerfile.rust), not the chart-wide .Values.securityContext (uid 1000) the
        # Python placeholder templates use -- same pattern as templates/svc-streaming.yaml.
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: {{ .Values.pipeline.rustDataPlane.svcProcess.port }}
          protocol: TCP
        - name: metrics
          containerPort: {{ .Values.pipeline.rustDataPlane.svcProcess.metricsPort }}
          protocol: TCP
        - name: host-api
          containerPort: {{ .Values.pipeline.rustDataPlane.svcProcess.hostApiPort }}
          protocol: TCP
        envFrom:
        - configMapRef:
            name: {{ include "waddlebot.fullname" . }}-config
        - secretRef:
            name: {{ include "waddlebot.fullname" . }}-secrets
        env:
        - name: MODULE_PORT
          value: {{ .Values.pipeline.rustDataPlane.svcProcess.port | quote }}
        - name: METRICS_PORT
          value: {{ .Values.pipeline.rustDataPlane.svcProcess.metricsPort | quote }}
        - name: HOST_API_PORT
          value: {{ .Values.pipeline.rustDataPlane.svcProcess.hostApiPort | quote }}
        {{- if eq (include "waddlebot.hostApiTlsMaterialAvailable" .) "true" }}
        {{- include "waddlebot.hostApiTlsServerEnv" . | nindent 8 }}
        {{- end }}
        - name: HUB_API_URL
          value: "http://{{ include "waddlebot.fullname" . }}-hub-api-v3:{{ .Values.pipeline.hubApi.port }}"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: DB_PASSWORD
        - name: SERVICE_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: SERVICE_API_KEY
        # CliConfig reads CACHE_HOST/CACHE_PORT/CACHE_PASSWORD -- the shared ConfigMap only
        # publishes REDIS_HOST/REDIS_PORT (a different name), so these are wired explicitly.
        - name: CACHE_HOST
          value: {{ .Values.infrastructure.redis.service.name | quote }}
        - name: CACHE_PORT
          value: {{ .Values.infrastructure.redis.service.port | quote }}
        - name: CACHE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: REDIS_PASSWORD
        {{- if eq (include "waddlebot.valkeyTlsMaterialAvailable" .) "true" }}
        # fix/valkey-tls-alpha -- overrides the plaintext VALKEY_URL this container would
        # otherwise inherit via envFrom's secretRef (templates/secrets.yaml) with the
        # rediss:// TLS listener (see infrastructure/redis.yaml's dual-listener). K8s env
        # resolution: an explicit `env:` entry always wins over the same name from
        # `envFrom` regardless of list order. Sourced via secretKeyRef (VALKEY_URL_TLS,
        # never an inline `value:`) so this entry's field TYPE never flips between
        # deploys regardless of infrastructure.redis.tls.enabled -- see secrets.yaml's
        # comment on VALKEY_URL_TLS for why that matters for an in-place upgrade.
        # VALKEY_PASSWORD is wired explicitly because `penguin_spine::SpineConfig::
        # validate()`'s security.transport.auth check reads this env var directly -- it
        # does NOT parse credentials back out of VALKEY_URL. No VALKEY_CA_FILE override:
        # the mounted CA lands at SpineConfig's own default path
        # (/etc/waddles/ca/valkey-ca.crt).
        - name: VALKEY_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: VALKEY_URL_TLS
        - name: VALKEY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: REDIS_PASSWORD
        {{- end }}
        # Empty (default) disables the spine drain loop entirely -- see config.rs.
        - name: PROCESS_APP_ID
          value: {{ .Values.pipeline.rustDataPlane.svcProcess.processAppId | default "" | quote }}
        # fix/process-bundle-wiring-alpha -- see values.yaml's comment on these fields.
        - name: PROCESS_INGEST_PLATFORM
          value: {{ .Values.pipeline.rustDataPlane.svcProcess.processIngestPlatform | default "" | quote }}
        - name: PROCESS_INGEST_SOURCE_ID
          value: {{ .Values.pipeline.rustDataPlane.svcProcess.processIngestSourceId | default "" | quote }}
        - name: PROCESS_BUNDLE_DIGEST
          value: {{ .Values.pipeline.rustDataPlane.svcProcess.processBundleDigest | default "" | quote }}
        - name: PROCESS_BUNDLE_VERSION
          value: {{ .Values.pipeline.rustDataPlane.svcProcess.processBundleVersion | default "1" | quote }}
        - name: PROCESS_BUNDLE_COMPONENT_KEY
          value: {{ .Values.pipeline.rustDataPlane.svcProcess.processBundleComponentKey | default "" | quote }}
        - name: PROCESS_BUNDLE_SIDECAR_KEY
          value: {{ .Values.pipeline.rustDataPlane.svcProcess.processBundleSidecarKey | default "" | quote }}
        # DB-driven active-bundle loader (core/svc_process/src/config.rs,
        # core/bundle_active_set) -- see values.yaml's comment on this block. Reader
        # host/port/name default to the SAME primary Postgres this pod's DB_* above
        # already points at (no read replica provisioned yet); DB_READER_PASSWORD comes
        # from the shared secret (empty by default -- the loader stays disabled until a
        # real RO-account password is provisioned, see templates/secrets.yaml).
        - name: DB_READER_HOST
          value: {{ .Values.pipeline.rustDataPlane.svcProcess.dbReaderHost | default .Values.infrastructure.postgresql.service.name | quote }}
        - name: DB_READER_PORT
          value: {{ .Values.pipeline.rustDataPlane.svcProcess.dbReaderPort | default .Values.infrastructure.postgresql.service.port | quote }}
        - name: DB_READER_NAME
          value: {{ .Values.pipeline.rustDataPlane.svcProcess.dbReaderName | default .Values.infrastructure.postgresql.database | quote }}
        # fix/helm-apply-errors -- see templates/svc-action-rust.yaml's identical comment
        # on this same env var name for the full rationale (identical here): never
        # switch DB_READER_USER back to valueFrom, a retired chart revision's
        # valueFrom(waddlebot-bundle-reader/...) for this exact name is why a live
        # upgrade fails with "env[N].valueFrom: ... may not be specified when value is
        # not empty" (kubectl's merge-by-name deep-merges the old and new field sets).
        - name: DB_READER_USER
          value: {{ .Values.pipeline.rustDataPlane.svcProcess.dbReaderUser | default "svc_process_ro" | quote }}
        - name: DB_READER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: DB_READER_PASSWORD
        {{- /* BUNDLE_SCOPE_TENANT_ID/BUNDLE_SCOPE_COMMUNITY_ID REMOVED (dataplane
        scale design, multi-tenant change-log consumer -- user requirement: "every
        svc_process/svc_action pod serves ALL tenants"). This loader now discovers
        and serves every (tenant_id, community_id) scope in the database itself
        (bundle_active_set::read_active_set_all); there is no per-pod tenant scope
        left to configure. */}}
        - name: BUNDLE_CONFIG_POLL_SECONDS
          # Incremental change-log poll interval, in whole seconds (floor: 5s,
          # core/svc_process/src/config.rs CliConfig::bundle_config_poll_interval).
          # Semantics unchanged from the retired single-tenant watermark loader.
          value: {{ .Values.pipeline.rustDataPlane.svcProcess.bundleConfigPollSeconds | default 300 | quote }}
        - name: BUNDLE_CONFIG_FULL_RECONCILE_MINUTES
          # Periodic full active-set reconcile interval, in whole minutes (floor:
          # 1m) -- bounds the blast radius of any change-log defect to one
          # interval, independent of the change-log's own correctness.
          value: {{ .Values.pipeline.rustDataPlane.svcProcess.bundleConfigFullReconcileMinutes | default 15 | quote }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.pipeline.rustDataPlane.svcProcess.resources | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        {{- if eq (include "waddlebot.valkeyTlsMaterialAvailable" .) "true" }}
        {{- include "waddlebot.valkeyTlsCaVolumeMount" . | nindent 8 }}
        {{- end }}
        {{- if eq (include "waddlebot.hostApiTlsMaterialAvailable" .) "true" }}
        {{- include "waddlebot.hostApiTlsVolumeMount" . | nindent 8 }}
        {{- end }}
        {{- include "waddlebot.serviceJwtBootstrapVolumeMount" . | nindent 8 }}
      volumes:
      - name: tmp
        emptyDir: {}
      {{- include "waddlebot.serviceJwtBootstrapVolume" . | nindent 6 }}
      {{- if eq (include "waddlebot.hostApiTlsMaterialAvailable" .) "true" }}
      {{- include "waddlebot.hostApiTlsVolume" . | nindent 6 }}
      {{- end }}
      {{- if eq (include "waddlebot.valkeyTlsMaterialAvailable" .) "true" }}
      {{- include "waddlebot.valkeyTlsCaVolume" . | nindent 6 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "waddlebot.fullname" . }}-svc-process-rust
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: svc-process-rust
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.pipeline.rustDataPlane.svcProcess.port }}
    targetPort: http
    protocol: TCP
    name: http
  - port: {{ .Values.pipeline.rustDataPlane.svcProcess.metricsPort }}
    targetPort: metrics
    protocol: TCP
    name: metrics
  - port: {{ .Values.pipeline.rustDataPlane.svcProcess.hostApiPort }}
    targetPort: host-api
    protocol: TCP
    name: host-api
  selector:
    {{- include "waddlebot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: svc-process-rust
{{- end }}

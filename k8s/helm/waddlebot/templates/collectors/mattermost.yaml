{{- if .Values.modules.collectors.mattermost.enabled }}
---
# Mattermost Collector Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "waddlebot.fullname" . }}-mattermost-collector
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: mattermost-collector
    tier: trigger
spec:
  replicas: {{ .Values.modules.collectors.mattermost.replicas }}
  selector:
    matchLabels:
      {{- include "waddlebot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mattermost-collector
  template:
    metadata:
      labels:
        {{- include "waddlebot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mattermost-collector
        tier: trigger
    spec:
      {{- include "waddlebot.terminationGracePeriod" $ | nindent 6 }}
      {{- include "waddlebot.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
      # fix/chart-fresh-install-hooks (alpha 2026-10-01) -- waits on hub-api's own /ready.
      {{- include "waddlebot.waitForHubApiInitContainer" . | nindent 8 }}
      containers:
        - name: mattermost-collector
          image: "{{ include "waddlebot.legacyModuleImage" (dict "root" . "module" (.Values.modules.collectors.mattermost.image) "imageTag" .Values.modules.collectors.mattermost.imageTag) }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- include "waddlebot.preStop" $ | nindent 10 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8009
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "waddlebot.fullname" . }}-config
            - secretRef:
                name: {{ include "waddlebot.fullname" . }}-secrets
          env:
            # H-1/H-3 -- this workload's OWN least-privilege database identity (role waddles_legacy_mattermost_collector;
            # config/postgres/service-roles.yaml). Overrides the envFrom block above; the database
            # owner/superuser credential is NOT in waddlebot-secrets any more.
{{- include "waddlebot.dbEnv" (dict "root" . "role" "waddles_legacy_mattermost_collector") | nindent 12 }}
            - name: PORT
              value: "8009"
            - name: MODULE_NAME
              value: "mattermost-collector"
            - name: ROUTER_URL
              value: "http://{{ include "waddlebot.fullname" . }}-router:8000"
            - name: MATTERMOST_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "waddlebot.fullname" . }}-secrets
                  key: MATTERMOST_URL
            - name: MATTERMOST_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "waddlebot.fullname" . }}-secrets
                  key: MATTERMOST_BOT_TOKEN
            - name: MATTERMOST_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "waddlebot.fullname" . }}-secrets
                  key: MATTERMOST_WEBHOOK_SECRET
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.modules.collectors.mattermost.resources | nindent 12 }}
          # readOnlyRootFilesystem: log + scratch dirs are the only writable paths.
          volumeMounts:
          - name: logs
            mountPath: /var/log/waddlebotlog
          - name: tmp
            mountPath: /tmp
      volumes:
      - name: logs
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
# Mattermost Collector Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "waddlebot.fullname" . }}-mattermost-collector
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: mattermost-collector
spec:
  type: ClusterIP
  ports:
    - port: 8009
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "waddlebot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mattermost-collector
# R5 posture: ingress scoped to declared ports, default-deny egress, enforced Tetragon exec allowlist.
{{- include "waddlebot.workloadPolicies" (dict "root" $ "component" "mattermost-collector" "ports" (list 8009) "runtime" "python") }}
{{- end }}

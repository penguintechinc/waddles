{{- if .Values.modules.collectors.googlechat.enabled }}
---
# Google Chat Collector Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "waddlebot.fullname" . }}-googlechat-collector
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: googlechat-collector
    tier: trigger
spec:
  replicas: {{ .Values.modules.collectors.googlechat.replicas }}
  selector:
    matchLabels:
      {{- include "waddlebot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: googlechat-collector
  template:
    metadata:
      labels:
        {{- include "waddlebot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: googlechat-collector
        tier: trigger
    spec:
      {{- include "waddlebot.imagePullSecrets" . | nindent 6 }}
      initContainers:
      # fix/chart-fresh-install-hooks (alpha 2026-10-01) -- waits on hub-api's own /ready.
      {{- include "waddlebot.waitForHubApiInitContainer" . | nindent 8 }}
      containers:
        - name: googlechat-collector
          image: "{{ include "waddlebot.legacyModuleImage" (dict "root" . "module" (.Values.modules.collectors.googlechat.image) "imageTag" .Values.modules.collectors.googlechat.imageTag) }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8012
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "waddlebot.fullname" . }}-config
            - secretRef:
                name: {{ include "waddlebot.fullname" . }}-secrets
          env:
            - name: PORT
              value: "8012"
            - name: MODULE_NAME
              value: "googlechat-collector"
            - name: ROUTER_URL
              value: "http://{{ include "waddlebot.fullname" . }}-router:8000"
            - name: GOOGLE_CHAT_SERVICE_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "waddlebot.fullname" . }}-secrets
                  key: GOOGLE_CHAT_SERVICE_ACCOUNT_KEY
            - name: GOOGLE_CHAT_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "waddlebot.fullname" . }}-secrets
                  key: GOOGLE_CHAT_PROJECT_ID
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.modules.collectors.googlechat.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
# Google Chat Collector Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "waddlebot.fullname" . }}-googlechat-collector
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: googlechat-collector
spec:
  type: ClusterIP
  ports:
    - port: 8012
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "waddlebot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: googlechat-collector
{{- end }}

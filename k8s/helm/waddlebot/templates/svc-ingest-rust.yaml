# feature/e2e-helm-rust-dataplane -- Rust svc-ingest (core/svc_ingest, full receiver stack
# implemented; INERT unless the PostHog flag waddles.core.rust-data-plane is ON -- see
# pipeline.rustDataPlane in values.yaml) Deployment (the legacy Python svc-ingest template was removed). Gated on the top-level pipeline.rustDataPlane.enabled flag (default false)
# plus this stage's own .enabled sub-flag, so flipping the parent flag alone doesn't force
# every stage on.
#
# Resource name keeps its `-rust` suffix; the image repository is `svc-ingest`
# (waddlebot.legacyModuleImage, rustDataPlane.svcIngest.imageRepository) now that the
# Python svc-ingest image/Deployment is gone.
#
# CURRENT STATE: core/svc_ingest is implemented -- native Twitch IRC, Discord Gateway,
# Twitch EventSub (HMAC-verified), and Twitch/Discord outbound drains. Valkey is read from
# VALKEY_URL via penguin_spine::SpineConfig::from_env(); receiver tokens come from its Config.
# The stage is inert until the PostHog flag waddles.core.rust-data-plane is ON (default OFF,
# fail-closed). Remaining gaps: no Slack/YouTube/Kick/Spectrum receivers (TODO(M5)), static
# single-source config, no host-API listener. No DB -- this stage owns no tables (config.rs's
# own doc comment), so unlike svc-process-rust/svc-action-rust there is no db-migrate
# initContainer here.
{{- if and .Values.pipeline.rustDataPlane.enabled .Values.pipeline.rustDataPlane.svcIngest.enabled }}
{{- /* P6a -- waddles.connector-tools (generic outbound executor). Resolved ONCE at render: every
prerequisite is required here too, so a half-configured ON deployment fails `helm template`
instead of crash-looping at boot (svc_ingest itself also refuses to start, naming the item). */}}
{{- $ct := .Values.pipeline.rustDataPlane.svcIngest.connectorTools | default dict }}
{{- if $ct.enabled }}
{{- if not .Values.pipeline.rustDataPlane.svcIngest.dynamicConnections.enabled }}
{{- fail "svcIngest.connectorTools.enabled requires svcIngest.dynamicConnections.enabled (the executor resolves per-community credentials and platform users through hub-api)" }}
{{- end }}
{{- if not .Values.pipeline.hubApi.enabled }}
{{- fail "svcIngest.connectorTools.enabled requires pipeline.hubApi.enabled (hub-api gRPC platform-user resolver + CA)" }}
{{- end }}
{{- range $p := list "twitch" "discord" "youtube" }}
{{- $d := include "waddlebot.connectorDigest" (dict "root" $ "platform" $p) }}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" $d) }}
{{- fail (printf "svcIngest.connectorTools requires pipeline.connectors.digests.%s = the pinned connector component digest sha256:<64 lowercase hex> (got %q)" $p $d) }}
{{- end }}
{{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "waddlebot.fullname" . }}-svc-ingest-rust
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: svc-ingest-rust
spec:
  {{- if not (include "waddlebot.hpaManaged" (dict "root" $ "key" "svcIngestRust")) }}
  replicas: {{ .Values.pipeline.rustDataPlane.svcIngest.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "waddlebot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: svc-ingest-rust
  template:
    metadata:
      annotations:
        # fix/valkey-cert-rollout-and-migrate-wait -- see templates/infrastructure/
        # redis.yaml's identical annotation comment; rolls this client pod in lockstep
        # with the Valkey server on any identity/SAN change.
        # regression: valkey cert regenerated but server pod not rolled; clients BadSignature (alpha 2026-10-02)
        {{- if eq (include "waddlebot.valkeyTlsMaterialAvailable" .) "true" }}
        checksum/valkey-tls: {{ include "waddlebot.valkeyTlsPodChecksum" . | quote }}
        {{- end }}
      labels:
        {{- include "waddlebot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: svc-ingest-rust
    spec:
      {{- include "waddlebot.terminationGracePeriod" $ | nindent 6 }}
      # feature/svc-ingest-connections-scope -- dedicated identity so hub-api's TokenReview-backed
      # machine-JWT bootstrap can tell this pod from every other workload in the namespace
      # (templates/service-jwt-rbac.yaml; serviceJwt.identities.svc-ingest, scope
      # connections:resolve only) -- same pattern as svc-action/svc-process/svc-presentation.
      serviceAccountName: svc-ingest
      {{- include "waddlebot.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # fix/chart-fresh-install-hooks (alpha 2026-10-01) -- waits on hub-api's own
      # /ready before this pod's main container starts (see _helpers.tpl).
      initContainers:
      {{- include "waddlebot.waitForHubApiInitContainer" . | nindent 6 }}
      containers:
      - name: svc-ingest-rust
        image: "{{ include "waddlebot.legacyModuleImage" (dict "root" . "module" (.Values.pipeline.rustDataPlane.svcIngest.imageRepository | default "svc-ingest")) }}"
        # Values-driven -- see templates/svc-process-rust.yaml's comment on this same line
        # for why the old hardcoded Always was removed (identical here).
        imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
        {{- include "waddlebot.preStop" $ | nindent 8 }}
        # Pinned to the Rust image's own `appuser` (uid 10001, core/svc_ingest/
        # Dockerfile.rust), not the chart-wide .Values.securityContext (uid 1000) the
        # Python placeholder templates use -- same pattern as templates/svc-streaming.yaml.
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: {{ .Values.pipeline.rustDataPlane.svcIngest.port }}
          protocol: TCP
        - name: metrics
          containerPort: {{ .Values.pipeline.rustDataPlane.svcIngest.metricsPort }}
          protocol: TCP
        {{- if $ct.enabled }}
        # Host-API mTLS listener the bundle executor dials (generic outbound executor).
        - name: host-api
          containerPort: {{ $ct.hostApiPort | default 8301 }}
          protocol: TCP
        {{- end }}
        envFrom:
        - configMapRef:
            name: {{ include "waddlebot.fullname" . }}-config
        - secretRef:
            name: {{ include "waddlebot.fullname" . }}-secrets
        env:
        # H-1/H-3 -- this workload's OWN least-privilege database identity (role waddles_svc_ingest;
        # config/postgres/service-roles.yaml). Overrides the envFrom block above; the database
        # owner/superuser credential is NOT in waddlebot-secrets any more.
{{- include "waddlebot.dbEnv" (dict "root" . "role" "waddles_svc_ingest") | nindent 8 }}
{{- include "waddlebot.transitTls.clientEnv" . | nindent 8 }}
        - name: MODULE_PORT
          value: {{ .Values.pipeline.rustDataPlane.svcIngest.port | quote }}
        - name: METRICS_PORT
          value: {{ .Values.pipeline.rustDataPlane.svcIngest.metricsPort | quote }}
        - name: RUNNER_TENANT_SLUG
          value: {{ .Values.pipeline.runnerTenantSlug | quote }}
        {{- if .Values.pipeline.defaultTenantId }}
        - name: DEFAULT_TENANT_ID
          value: {{ .Values.pipeline.defaultTenantId | quote }}
        {{- end }}
        - name: HUB_API_URL
          value: "http://{{ include "waddlebot.fullname" . }}-hub-api-v3:{{ .Values.pipeline.hubApi.port }}"
        # Machine-JWT bootstrap + hub-api's internal gRPC, ALWAYS rendered: every tenant's
        # identity-field DEK is fetched from hub-api's KeyService (scope key:stream-dek:read,
        # serviceJwt.identities.svc-ingest) before an event can be encrypted and published, so
        # svc-ingest cannot run without them. The endpoint defaults to hub-api's own in-cluster
        # Service (same default as svc-action/svc-process). The audience-scoped projected token is
        # mounted below -- NOT the generic k8s SA token path (wrong audience; hub-api's
        # TokenReview would reject it). The mint is gRPC (TLS 1.3, pinned CA via
        # HUB_API_GRPC_CA_FILE).
        - name: SERVICE_JWT_TOKEN_ENDPOINT
          value: {{ .Values.pipeline.rustDataPlane.serviceJwtTokenEndpoint | default (printf "https://%s-hub-api-v3:%v" (include "waddlebot.fullname" .) .Values.pipeline.hubApi.grpcPort) | quote }}
        - name: SERVICE_JWT_SA_TOKEN_PATH
          value: "/var/run/secrets/waddlebot/service-jwt/service-jwt-bootstrap-token"
        # This pod's own SPIFFE id (the same one hub-api authenticates it as). svc-ingest derives
        # the stream-DEK seal-context service name from its last segment, so a rename stays in
        # lock-step with hub-api; boot fails loud if it is missing or malformed.
        - name: SPIFFE_ID
          value: {{ tpl (index .Values.serviceJwt.identities "svc-ingest").spiffeId . | quote }}
        - name: HUB_API_GRPC_ENDPOINT
          value: {{ .Values.pipeline.rustDataPlane.hubApiGrpcEndpoint | default (printf "https://%s-hub-api-v3:%v" (include "waddlebot.fullname" .) .Values.pipeline.hubApi.grpcPort) | quote }}
        {{- include "waddlebot.hubApiGrpcCaEnv" . | nindent 8 }}
        {{- if .Values.pipeline.rustDataPlane.svcIngest.dynamicConnections.enabled }}
        # waddles.ingest-dynamic-connections env baseline: svc-ingest resolves each event's
        # guild/channel to a numeric scope via hub-api and stamps schema-v3 envelopes (an
        # unresolvable source is dropped, never defaulted). Rendered only with the grant above.
        - name: INGEST_DYNAMIC_CONNECTIONS
          value: "true"
        - name: WADDLES_ENVIRONMENT
          value: {{ .Values.global.environment | default "alpha" | quote }}
        # Per-community Twitch sessions (INGEST_DYNAMIC_CONNECTIONS ON): reconcile cadence and
        # the per-call hub-api resolve/list timeout. The static TWITCH_IRC_NICK/TWITCH_IRC_CHANNEL
        # pair is deliberately never rendered here -- with the flag ON it is a FATAL conflict.
        - name: TWITCH_RECONCILE_INTERVAL_SECS
          value: {{ .Values.pipeline.rustDataPlane.svcIngest.dynamicConnections.twitchReconcileIntervalSecs | default 60 | quote }}
        - name: TWITCH_RESOLVE_TIMEOUT_SECS
          value: {{ .Values.pipeline.rustDataPlane.svcIngest.dynamicConnections.twitchResolveTimeoutSecs | default 10 | quote }}
        {{- end }}
        # hub-api internal gRPC (TLS, pinned to the internal CA; HUB_API_GRPC_ENDPOINT above) also
        # serves IdentityService.ResolvePlatformUser (scope identity:platform-user:resolve) and the
        # connection resolver's ProviderConnectionService.ListBindings/ResolveConnection
        # (connections:list / connections:resolve[:static]) -- intra-cluster calls are gRPC,
        # never REST.
        # Egress detokenization (svc-ingest's outbound drain is the only platform egress) reads
        # display names straight from Postgres under this pod's own read-only role
        # (waddles_svc_ingest, column-scoped SELECT -- config/postgres/service-roles.yaml); no
        # hub-api call in the send path. Plain env off-switch independent of the
        # waddles.core.disable-pii-detokenization PostHog kill-switch; rendered only when
        # pipeline.piiTokenization.enabled is false, omitted otherwise.
        {{- if not .Values.pipeline.piiTokenization.enabled }}
        - name: PII_DETOKENIZATION_ENABLED
          value: "false"
        {{- end }}
        # P6a T6: dedicated outbound pin key (NOT the shared envFrom Secret) -- templates/outbound-pin-secret.yaml.
        - name: OUTBOUND_PIN_KEYS
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.outboundPinSecretName" . }}
              key: OUTBOUND_PIN_KEYS
        - name: OUTBOUND_PIN_ACTIVE_KID
          value: {{ .Values.outboundPin.activeKid | default "k1" | quote }}
        {{- if $ct.enabled }}
        # waddles.connector-tools env baseline (default OFF = legacy drains). ON: the executor path;
        # svc_ingest refuses to start if any item below is missing/malformed (no silent legacy fallback).
        - name: CONNECTOR_TOOLS_ENABLED
          value: "true"
        - name: SENDER_EXEC_HOST_API_PORT
          value: {{ $ct.hostApiPort | default 8301 | quote }}
        # Host-pinned connector component digests -- never from the queue or the guest.
        - name: SENDER_EXEC_DIGEST_TWITCH
          value: {{ include "waddlebot.connectorDigest" (dict "root" $ "platform" "twitch") | quote }}
        - name: SENDER_EXEC_DIGEST_DISCORD
          value: {{ include "waddlebot.connectorDigest" (dict "root" $ "platform" "discord") | quote }}
        - name: SENDER_EXEC_DIGEST_YOUTUBE
          value: {{ include "waddlebot.connectorDigest" (dict "root" $ "platform" "youtube") | quote }}
        {{- if include "waddlebot.connectorPlatformOn" (dict "root" $ "platform" "kick") }}
        # Kick is opt-in: served by the outbound executor only when its digest is pinned.
        - name: SENDER_EXEC_DIGEST_KICK
          value: {{ include "waddlebot.connectorDigest" (dict "root" $ "platform" "kick") | quote }}
        {{- end }}
        {{- if include "waddlebot.connectorPlatformOn" (dict "root" $ "platform" "wix") }}
        - name: SENDER_EXEC_DIGEST_WIX
          value: {{ include "waddlebot.connectorDigest" (dict "root" $ "platform" "wix") | quote }}
        {{- end }}
        {{- if include "waddlebot.connectorPlatformOn" (dict "root" $ "platform" "spectrum") }}
        # Spectrum is inbound-only (no outbound executor slot): its digest is rendered only when the
        # connector is ON, where the runtime boot requires it (and the render above validated it).
        - name: SENDER_EXEC_DIGEST_SPECTRUM
          value: {{ include "waddlebot.connectorDigest" (dict "root" $ "platform" "spectrum") | quote }}
        {{- end }}
        # Public Helix application client id, from the operator-managed platform-credentials Secret.
        - name: TWITCH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.platformCredentialsSecretName" . }}
              key: TWITCH_CLIENT_ID
        # svc-ingest's OWN server-only cert/key (dedicated Secret, svc-ingest SAN only) -- never the
        # shared executor/stage host-api-tls material. The client identity is pinned.
        - name: HOST_API_SERVER_CERT_FILE
          value: /etc/waddlebot/svc-ingest-host-api-tls/tls.crt
        - name: HOST_API_SERVER_KEY_FILE
          value: /etc/waddlebot/svc-ingest-host-api-tls/tls.key
        - name: HOST_API_CLIENT_CA_FILE
          value: /etc/waddlebot/svc-ingest-host-api-tls/ca.crt
        - name: HOST_API_CLIENT_IDENTITY
          value: {{ include "waddlebot.svcIngestHostApiClientIdentity" . | quote }}
        {{- end }}
        {{- if include "waddlebot.connectorRuntimeActive" . }}
        {{- $cr := .Values.pipeline.rustDataPlane.svcIngest.connectorRuntime }}
        # PR-H connector runtime (spec SS1.3). CONNECTOR_<P>_ENABLED come from the SAME helm value
        # the (removed) Python svc-ingest deployment used to read.
        - name: CONNECTOR_RUNTIME_ENABLED
          value: "true"
        {{- include "waddlebot.connectorPlatformEnv" . | nindent 8 }}
        - name: CONNECTOR_RECONCILE_INTERVAL_SECS
          value: {{ $cr.reconcileIntervalSecs | quote }}
        - name: CONNECTOR_HEARTBEAT_ENABLED
          value: {{ ternary "true" "false" (eq (toString $cr.heartbeatEnabled) "true") | quote }}
        - name: CONNECTOR_MAX_CONNECTIONS
          value: {{ $cr.maxConnections | quote }}
        - name: CONNECTOR_START_CONCURRENCY
          value: {{ $cr.startConcurrency | quote }}
        - name: CONNECTOR_DISCORD_START_PACE_MS
          value: {{ $cr.discordStartPaceMs | quote }}
        {{- if $cr.webhookPlatforms }}
        - name: CONNECTOR_ROUTE_KEY_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ $cr.routeKeySecret.existingSecret | quote }}
              key: {{ $cr.routeKeySecret.key | quote }}
        {{- end }}
        {{- end }}
        {{- if .Values.pipeline.rustDataPlane.svcIngest.envelopeBindingActiveKid }}
        - name: ENVELOPE_BINDING_ACTIVE_KID
          value: {{ .Values.pipeline.rustDataPlane.svcIngest.envelopeBindingActiveKid | quote }}
        {{- end }}
        # Valkey and receiver credentials consumed by core/svc_ingest (see file header) --
        # same Secret keys the (removed) Python svc-ingest Deployment used to read.
        {{- if eq (include "waddlebot.valkeyTlsMaterialAvailable" .) "true" }}
        # fix/valkey-tls-alpha -- see templates/svc-process-rust.yaml's comment on this same
        # override block for the full rationale (identical here). Stays a secretKeyRef
        # (VALKEY_URL_TLS instead of VALKEY_URL) rather than switching to an inline
        # `value:` -- this entry was already a secretKeyRef pre-TLS, and switching an
        # existing env entry's field TYPE breaks Kubernetes' strategic-merge-patch on an
        # in-place upgrade (see secrets.yaml's comment on VALKEY_URL_TLS).
        - name: VALKEY_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: VALKEY_DURABLE_URL_TLS
        - name: VALKEY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: VALKEY_DURABLE_PASSWORD
        {{- else }}
        - name: VALKEY_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: VALKEY_DURABLE_URL
        {{- end }}
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: SECRET_KEY
        - name: WADDLES_AI_ENABLED
          value: {{ .Values.pipeline.hubApi.aiEnabled | quote }}
        # fix/helm-platform-credentials -- sourced from the operator-managed
        # platform-credentials Secret, never the chart-rendered `-secrets`
        # Secret (see docs/PLATFORM_CREDENTIALS.md); `optional: true` so an
        # unconfigured platform doesn't block scheduling -- config.rs must
        # fail fast at startup if a *required* one is absent instead of
        # connecting with an empty/garbage credential.
        - name: DISCORD_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.platformCredentialsSecretName" . }}
              key: DISCORD_BOT_TOKEN
              optional: true
        # fix/helm-platform-credentials -- env var NAME corrected to
        # TWITCH_IRC_OAUTH_TOKEN, the one core/svc_ingest/src/config.rs
        # actually reads (`std::env::var("TWITCH_IRC_OAUTH_TOKEN")`); the
        # previous `TWITCH_OAUTH_TOKEN` name meant this Rust receiver never
        # saw the value regardless of what Helm rendered. Secret key name
        # (TWITCH_OAUTH_TOKEN) is unchanged for continuity with the
        # operator-facing platform-credentials Secret.
        - name: TWITCH_IRC_OAUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.platformCredentialsSecretName" . }}
              key: TWITCH_OAUTH_TOKEN
              optional: true
        {{- /* Static pair is a FATAL conflict with INGEST_DYNAMIC_CONNECTIONS; render only when the flag is off AND a value is set. */}}
        {{- if not .Values.pipeline.rustDataPlane.svcIngest.dynamicConnections.enabled }}
        {{- if .Values.oauth.twitch.nick }}
        - name: TWITCH_IRC_NICK
          value: {{ .Values.oauth.twitch.nick | quote }}
        {{- end }}
        {{- if .Values.oauth.twitch.channels }}
        - name: TWITCH_IRC_CHANNEL
          value: {{ .Values.oauth.twitch.channels | quote }}
        {{- end }}
        {{- end }}
        {{- include "waddlebot.startupProbe" (dict "root" $ "path" "/health" "port" "http") | nindent 8 }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          # /readyz (not /healthz, which is a bare always-ok liveness probe
          # mistakenly wired here) reflects whether every enabled receiver
          # (Discord gateway, Twitch IRC) has actually connected to the
          # spine -- regression: a one-shot valkey probe used to leave this
          # pod Running 1/1 forever with both receivers permanently
          # disabled (alpha 2026-10-02).
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.pipeline.rustDataPlane.svcIngest.resources | nindent 10 }}
        volumeMounts:
        {{- include "waddlebot.transitTls.caVolumeMount" . | nindent 8 }}
        - name: tmp
          mountPath: /tmp
        {{- if eq (include "waddlebot.valkeyTlsMaterialAvailable" .) "true" }}
        {{- include "waddlebot.valkeyTlsCaVolumeMount" . | nindent 8 }}
        {{- end }}
        {{- include "waddlebot.serviceJwtBootstrapVolumeMount" . | nindent 8 }}
        {{- if $ct.enabled }}
        - name: svc-ingest-host-api-tls
          mountPath: /etc/waddlebot/svc-ingest-host-api-tls
          readOnly: true
        {{- end }}
        {{- include "waddlebot.hubApiGrpcCaVolumeMount" . | nindent 8 }}
      volumes:
      {{- include "waddlebot.transitTls.caVolume" . | nindent 6 }}
      - name: tmp
        emptyDir: {}
      {{- include "waddlebot.serviceJwtBootstrapVolume" . | nindent 6 }}
      {{- if $ct.enabled }}
      - name: svc-ingest-host-api-tls
        secret:
          secretName: {{ include "waddlebot.svcIngestHostApiTlsSecretName" . }}
          defaultMode: 0440
      {{- end }}
      {{- include "waddlebot.hubApiGrpcCaVolume" . | nindent 6 }}
      {{- if eq (include "waddlebot.valkeyTlsMaterialAvailable" .) "true" }}
      {{- include "waddlebot.valkeyTlsCaVolume" . | nindent 6 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "waddlebot.fullname" . }}-svc-ingest-rust
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: svc-ingest-rust
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.pipeline.rustDataPlane.svcIngest.port }}
    targetPort: http
    protocol: TCP
    name: http
  - port: {{ .Values.pipeline.rustDataPlane.svcIngest.metricsPort }}
    targetPort: metrics
    protocol: TCP
    name: metrics
  {{- if $ct.enabled }}
  - port: {{ $ct.hostApiPort | default 8301 }}
    targetPort: host-api
    protocol: TCP
    name: host-api
  {{- end }}
  selector:
    {{- include "waddlebot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: svc-ingest-rust
# PR-H: host-api (8301) is NOT in the shared same-namespace allow above --
# templates/svc-ingest-host-api-networkpolicy.yaml admits ONLY the svc-bundles-executor on it.
# R5 posture: ingress scoped to declared ports, default-deny egress, enforced Tetragon exec allowlist.
{{- include "waddlebot.workloadPolicies" (dict "root" $ "component" "svc-ingest-rust" "ports" (list $.Values.pipeline.rustDataPlane.svcIngest.port $.Values.pipeline.rustDataPlane.svcIngest.metricsPort) "runtime" "rust" "binaries" (list "/app/svc-ingest")) }}
{{- end }}

# fix/db-migrate-fresh-install-ordering -- "pre-upgrade" ONLY (was "post-install,pre-upgrade").
#
# Fresh install: the schema now comes from hub-api's `db-migrate` initContainer
# (templates/_db_migrate.tpl). As a post-install hook this Job deadlocked every fresh install
# under `helm upgrade --install --wait`: hub-api `/ready` waits for the alembic head revision,
# --wait waits for hub-api, and post hooks only run after --wait completes.
#
# Upgrade: this Job still migrates BEFORE any regular resource is updated (pre-upgrade, weight
# -5: after the provision-secrets hook at -8, before postgres-handover), so no new-version
# workload ever sees the old schema. "pre-install" is never added: in-chart Postgres is a
# regular resource that does not exist yet during the pre-install hook phase.
#
# Both call sites run the SAME container (waddlebot.dbMigrate.container): migrate_locked.py holds
# a session-level pg_advisory_lock around run-alembic.sh, so this Job and N hub-api replicas'
# initContainers serialize; whoever runs second finds the schema at head and only re-asserts the
# idempotent role/grant reconciles.
#
# Credentials: the dedicated <fullname>-db-migrate-secret (provision-secrets hook, weight -8)
# carries the migrator DATABASE_URL and the role passwords run-alembic.sh reconciles. The hook
# ServiceAccount (migrations-job-rbac.yaml, weight -10) has no token automount.
{{- if .Values.pipeline.migrationsJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "waddlebot.fullname" . }}-db-migrate
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-migrate
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "waddlebot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: db-migrate
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "waddlebot.fullname" . }}-db-migrate
      {{- include "waddlebot.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      {{- include "waddlebot.dbMigrate.container" . | nindent 6 }}
      volumes:
      {{- include "waddlebot.dbMigrate.volume" . | nindent 6 }}
      {{- include "waddlebot.transitTls.caVolume" . | nindent 6 }}
{{- end }}

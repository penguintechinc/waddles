# v3.0.x Task T10 (v3 demo) — pre-install/pre-upgrade Helm hook Job that applies
# config/postgres/migrations/*.sql to completion BEFORE any pipeline Deployment's pods are
# scheduled. Complements (does not replace) the per-pod waddlebot.dbMigrateInitContainer
# already used by svc-ingest/svc-process/svc-action/hub-api/svc-core (_helpers.tpl) — that
# initContainer guards against schema drift if a pod restarts mid-rollout; this Job is what
# actually applies the migration directory to a clean cluster before the demo's Deployments
# come up in the first place, without N pods racing the same advisory lock at once.
#
# T8 landed on release/v3.0.X: migrations now run through
# config/postgres/migrations/083_discord_twitch_demo_convergence.sql (seeds both
# discord.default + twitch.default 3-stage app_ids + `global` tenant activation). This Job
# runs the migrations image's entrypoint (migrations/run-alembic.sh -> `alembic upgrade
# head`) against the whole config/postgres/migrations/ directory the image COPYs in
# (migrations/Dockerfile), never a hardcoded file list or number, so it already covers 083
# with no further Helm change.
{{- if .Values.pipeline.migrationsJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "waddlebot.fullname" . }}-db-migrate
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-migrate
  annotations:
    # resolve-433 -- post-install, NOT pre-install: this Job's DATABASE_URL points at
    # templates/infrastructure/postgres.yaml's Deployment, which is a plain (non-hook)
    # resource Helm only creates in the main-resource phase, AFTER every pre-install
    # hook already ran. A pre-install db-migrate Job therefore deadlocks forever on a
    # genuinely first-ever install (nothing for it to connect to yet) -- exactly the
    # class of bug this chart's kind e2e workflow exists to catch. Post-install
    # guarantees Postgres already exists; the Job's own wait-for-database retry loop
    # absorbs the remaining "pod not Ready yet" gap.
    #
    # PRE-upgrade, NOT post-upgrade: on every upgrade after the first, Postgres
    # already exists (it's a long-lived regular resource, never recreated), so there
    # is no deadlock risk symmetric to the install case. post-upgrade would instead
    # let the upgrade's new app Deployment pods roll out BEFORE this Job applies the
    # new migrations, so new code briefly runs against the OLD schema -- the exact bug
    # this annotation now avoids. pre-upgrade runs the migration first, before any
    # updated pod is created.
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    # fix/helm-hook-rbac-ordering -- serviceAccountName below is now the dedicated
    # {{ include "waddlebot.fullname" . }}-db-migrate hook SA (migrations-job-rbac.yaml,
    # weight -10), not the shared "waddlebot" SA -- see that file for why the shared SA
    # was an ordering bug here too.
    #
    # fix/helm-migrations-fresh-install -- envFrom below now pulls the dedicated
    # {{ include "waddlebot.fullname" . }}-db-migrate-secret hook Secret (templates/
    # secrets.yaml, weight -10), not the shared waddlebot-secrets Secret. That Secret is
    # a plain/regular resource consumed by ~20 other Deployments -- Helm applies regular
    # resources only AFTER every pre-install/pre-upgrade hook has run, so it was never
    # guaranteed to exist yet when this Job's pod is admitted on a true first install
    # (CreateContainerConfigError). The dedicated hook Secret carries only DATABASE_URL,
    # the one value this image's entrypoint (migrations/run-alembic.sh, alembic/env.py)
    # actually reads, and is guaranteed to derive the identical DB password as
    # waddlebot-secrets -- see secrets.yaml's comment on that Secret for the
    # no-divergence guarantee.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "waddlebot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: db-migrate
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "waddlebot.fullname" . }}-db-migrate
      {{- include "waddlebot.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: db-migrate
        # Same image reference as waddlebot.dbMigrateInitContainer (_helpers.tpl) — one
        # migrations image, two call sites (this pre-install/pre-upgrade Job + the per-pod
        # initContainer). Replace once migrations has its own pinned CI-built digest.
        #
        # fix/alpha-helm-deploy -- this used to hardcode
        # "{{ .Values.global.imageRegistry }}/migrations:{{ .Values.global.imageTag }}"
        # with no empty-registry guard and a literal "migrations" repo name that didn't
        # match dbMigrateInitContainer's .Values.modules.migrations.image, so an empty
        # global.imageRegistry rendered the malformed "/migrations:alpha". Reuse the exact
        # same guard + repository source as dbMigrateInitContainer so both call sites can
        # never drift apart again.
        {{- $registry := .Values.global.imageRegistry | default "" }}
        {{- $repository := .Values.modules.migrations.image | default "waddlebot-migrations" }}
        {{- $tag := .Values.global.imageTag }}
        {{- if $registry }}
        image: "{{ $registry }}/{{ $repository }}:{{ $tag }}"
        {{- else }}
        image: "{{ $repository }}:{{ $tag }}"
        {{- end }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        envFrom:
        - secretRef:
            name: {{ include "waddlebot.fullname" . }}-db-migrate-secret
        resources:
          {{- toYaml .Values.pipeline.migrationsJob.resources | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
{{- end }}

# svc-bundles-executor (crate core/bundle_executor, binary svc-bundles-executor): the
# credential-less WASM bundle sandbox host. One StatefulSet PER POOL (default: one pool
# serving every stage; waddlebot.executorPools in _autoscaling.tpl). Each pod
# dials every listener in pipeline.rustDataPlane.bundleExecutor.stages (svc-process-rust
# AND svc-action-rust) plus svc-ingest's connector link, with an independent dial loop,
# reconnect/backoff, bundle registry and metrics `stage` label per link (so one stage
# being down never blocks another), and services `load`/`invoke`/`unload` calls over them.
# It scales HORIZONTALLY (PDB + KEDA/HPA-external in svc-bundles-executor-autoscaling.yaml):
# every replica dials every stage, and each stage/svc-ingest spreads work round-robin
# across the replicas connected to it (each item reaches exactly one executor). Replicas
# are stateless -- the only local state is the emptyDir wasm precompile cache below, which
# warms independently per pod.
# Gated on the top-level pipeline.rustDataPlane.enabled flag (default false) plus this
# module's own .enabled sub-flag.
#
# D9/D10 credential-less posture, deliberately different from every other pod in this
# chart:
#   - NO envFrom (no ConfigMap, no app Secret) -- this pod's only network relationship is
#     the mTLS dial below; it never touches Postgres/Valkey/OAuth tokens/JWT signing keys.
#   - automountServiceAccountToken: false -- never talks to the K8s API either.
#   - The mTLS client cert/key it DOES mount (global.hostApiTls, same Secret
#     svc-action-rust's server side reads) is a peer-identity credential for the closed
#     executor<->stage pair, not an application secret.
#   - readOnlyRootFilesystem + all capabilities dropped + RuntimeDefault seccomp
#     (.Values.podSecurityContext) + non-root uid -- matches the rest of the chart's Rust
#     Deployments (10001, core/bundle_executor's future Dockerfile is assumed to create the
#     same `appuser` convention core/svc_action/Dockerfile.rust already does;
#     core/bundle_executor/Dockerfile.rust exists and is the image build source).
#
# Only a port-less headless Service (StatefulSet governing name): this process has no HTTP/gRPC listener of any kind (core/
# bundle_executor/src/tls.rs's own doc comment -- "this process has no HTTP surface to
# probe"), so every probe below execs this same binary instead of hitting a port.
#
# fix/executor-session-liveness: THREE probes now, not one, closing the incident where an
# executor stayed dialed to a half-open connection to a terminated stage pod (no FIN/RST
# ever arrived) while every probe kept reporting healthy -- `--healthcheck` (bare, no
# mode) only ever build-tested the wasmtime Engine/Linker, which says nothing about
# whether the host-API session is actually alive.
#   - startupProbe: the OLD liveness check (`--healthcheck`, engine/linker build-test),
#     kept as a one-time startup gate -- a broken wasmtime toolchain should still fail
#     fast on boot rather than only being noticed once a session probe eventually fires.
#   - livenessProbe: `--healthcheck=session --max-age 60` (core/bundle_executor/src/
#     probe.rs + src/heartbeat.rs) -- fails (and the kubelet restarts the pod) once the
#     on-disk liveness file is missing/stale for EXECUTOR_GRACE_SECONDS (default 60s).
#     The heartbeat monitor refreshes that file every EXECUTOR_HEARTBEAT_INTERVAL_SECS
#     (default 5s) tick as long as the host-API session has received a frame within the
#     last 3 intervals; a silently stalled session now gets dropped+reconnected on its
#     own (crate::heartbeat), and if reconnection itself is failing this probe is the
#     backstop that makes the pod visibly restart rather than staying permanently "Ready"
#     while dead.
#   - readinessProbe: same subcommand, a much shorter `--max-age 20` -- pulled out of
#     traffic quickly if the session goes quiet, without waiting for the full liveness
#     grace window or a pod restart.
# core/bundle_executor/src/lib.rs::run() still retries the dial forever with capped
# exponential backoff rather than exiting on its own; these probes are what makes a
# truly stuck pod observable and recoverable instead of silently serving nothing forever
# (see global.hostApiTls's comment for the broken/missing mTLS cert case specifically).
{{- if and .Values.pipeline.rustDataPlane.enabled .Values.pipeline.rustDataPlane.bundleExecutor.enabled }}
{{- /*
fix/chart-autogen-bundle-signing-key -- the old render-time `fail` guard here
required a human to run `make generate-bundle-signing-key` and hand-paste the
printed public key into pipeline.rustDataPlane.bundleSigningPublicKeys before
ANY deploy could succeed, in every environment. That's no longer true: the
`{{ fullname }}-bundle-signing-public` ConfigMap (templates/
auto-provisioned-keys-job.yaml, BUNDLE_SIGNING_PUBLIC_KEYS key) is populated
by that pre-install/pre-upgrade hook in every environment -- tier only gates
whether the hook may *generate* a missing private key (alpha/local), never
whether it publishes the public-key ConfigMap from whatever private key is
present. BUNDLE_SIGNING_PUBLIC_KEYS below now sources from that ConfigMap by
default; the values override remains fully supported (e.g. multi-key
rotation, or a manually-run scripts/generate-bundle-signing-key.sh) and wins
when set. If the ConfigMap key is genuinely missing at pod start (hook never
ran, or the hook's own underlying Secret doesn't exist yet in an
externalSecret: true flow), kubelet fails the pod loudly
(CreateContainerConfigError) rather than silently starting unsigned --
preserving the executor's fail-closed posture without a template-render-time
guess.
*/}}
{{- $bsepCmName := .Values.autoProvisionedKeys.bundleSigning.publicKeyConfigMapName | default (printf "%s-bundle-signing-public" (include "waddlebot.fullname" .)) }}
{{- $be := .Values.pipeline.rustDataPlane.bundleExecutor }}
{{- range $pool := (include "waddlebot.executorPools" . | fromJsonArray) }}
{{- with $ }}
{{- $name := printf "%s-svc-bundles-executor%s" (include "waddlebot.fullname" .) $pool.suffix }}
{{- $scaled := ne (($pool.autoscaling).mode | default "none") "none" }}
{{- $limitMi := int (include "waddlebot.memToMi" (($pool.resources).limits).memory) }}
{{- if or (le (int $pool.memoryBudgetMb) 0) (ge (int $pool.memoryBudgetMb) $limitMi) }}
{{- fail (printf "svc-bundles-executor pool %s: memoryBudgetMb (%v) must be >0 and below the memory limit (%vMi) -- the budget is the LRU ceiling for compiled modules; the rest is headroom for instances + compile transients" $pool.name $pool.memoryBudgetMb $limitMi) }}
{{- end }}
---
# Headless Service: required by the StatefulSet (stable network identity). The executor has NO
# listener -- it only dials out -- so there are no ports; this exists for the governing
# serviceName + per-pod DNS, never for traffic (CNP ingress stays deny-all).
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-headless
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: svc-bundles-executor
    waddles.io/executor-pool: {{ $pool.name | quote }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "waddlebot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: svc-bundles-executor
    waddles.io/executor-pool: {{ $pool.name | quote }}
---
# StatefulSet (executor Phase 1, PLAN.md task 8): pod name == executor_id. Stages shard apps
# over LIVE executor ids by rendezvous hashing (slot = xxhash64(app_id) % 1024, 2 owners per
# slot), so the id must be stable across restarts -- a Deployment's random suffix would
# reshuffle slots on every restart. Parallel pod management: ordinals carry identity, not
# ordering; serial start would multiply cold-start time by N. Upgrade from the old Deployment:
# docs/operations/executor-statefulset-migration.md.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: svc-bundles-executor
    waddles.io/executor-pool: {{ $pool.name | quote }}
spec:
  serviceName: {{ $name }}-headless
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  {{- if not $scaled }}
  replicas: {{ $pool.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "waddlebot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: svc-bundles-executor
      waddles.io/executor-pool: {{ $pool.name | quote }}
  template:
    metadata:
      annotations:
        {{- if include "waddlebot.connectorRuntimeActive" . }}
        checksum/connector-host-api-identity: {{ printf "%s|%s" (include "waddlebot.svcIngestHostApiClientIdentity" .) (include "waddlebot.svcIngestHostApiServerIdentity" .) | sha256sum | quote }}
        {{- end }}
        # fix/cert-regen-on-identity-change -- rolls every pod when the desired
        # host-api-tls identity/SANs change, even though the Secret object itself is
        # reused by name when kept (see templates/host-api-tls-secret.yaml's policy
        # comment); derived from identity+SANs only, never key material.
        {{- if eq (include "waddlebot.hostApiTlsMaterialAvailable" .) "true" }}
        checksum/host-api-tls: {{ include "waddlebot.hostApiTlsPodChecksum" . | quote }}
        {{- end }}
      labels:
        {{- include "waddlebot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: svc-bundles-executor
        waddles.io/executor-pool: {{ $pool.name | quote }}
    spec:
      {{- include "waddlebot.terminationGracePeriod" $ | nindent 6 }}
      automountServiceAccountToken: false
      {{- include "waddlebot.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # fix/chart-fresh-install-hooks (alpha 2026-10-01) -- waits on hub-api's own
      # /ready before this pod's main container starts (see _helpers.tpl).
      initContainers:
      {{- include "waddlebot.waitForHubApiInitContainer" . | nindent 6 }}
      containers:
      - name: svc-bundles-executor
        # Own image (self-contained full path per environment, no global.imageRegistry
        # concatenation) -- same pattern as .Values.streaming.image/.Values.reputation.image
        # (see those templates' own image lines); using the waddlebot.image helper here
        # would double-prefix alpha's already-registry-qualified repository value.
        image: "{{ .Values.bundleExecutor.image.repository }}:{{ .Values.bundleExecutor.image.tag | default .Values.global.imageTag | toString }}"
        # Values-driven -- see templates/svc-process-rust.yaml's comment on this same line
        # for why the old hardcoded Always was removed (identical here). The stale-image
        # case that motivated it (a same-tag `:alpha` push) is closed by the per-deploy
        # global.imageTag fall-through above (bundleExecutor.image.tag left unset).
        imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
        {{- include "waddlebot.preStop" $ | nindent 8 }}
        # uid 10001 -- see file header assumption note (no Dockerfile exists for this crate
        # yet, so this mirrors the sibling Rust crates' own established convention).
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        # Comma-separated list: one dial loop per stage (core/bundle_executor/src/config.rs
        # stage_targets). Every stage shares the HOST_API_* mTLS material + identity below.
        - name: STAGE_HOST_API_ADDR
          value: {{ include "waddlebot.bundleExecutorStageAddrs" (dict "root" $ "stages" $pool.stages) | quote }}
        # Executor identity for slot sharding (CONTRACT.md): the StatefulSet pod name, sent as
        # HelloBody.executor_id. The pool scopes the membership set the stages hash over.
        - name: EXECUTOR_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        # POD_NAME: the name the executor crate reads for HelloBody.executor_id (downward API).
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: EXECUTOR_POOL
          value: {{ $pool.name | quote }}
        # LRU ceiling for resident compiled modules (MiB); render fails unless below the limit.
        - name: EXECUTOR_MEMORY_BUDGET_MB
          value: {{ $pool.memoryBudgetMb | quote }}
        # Object-storage prefix of signed AOT artifacts (precompiled/<engine_fp>/<digest>.cwasm)
        # written by the precompile Jobs (part D); read here via the read-only data-plane identity.
        - name: EXECUTOR_PRECOMPILED_PREFIX
          value: {{ $be.precompiledPrefix | quote }}
        {{- include "waddlebot.rustOtelEnv" (dict "root" $ "service" "svc-bundles-executor") | nindent 8 }}
        - name: EXECUTOR_STAGE_CONNECTIONS
          value: {{ .Values.pipeline.rustDataPlane.bundleExecutor.stageConnections | quote }}
        - name: EXECUTOR_CALL_TIMEOUT_MS
          value: {{ .Values.pipeline.rustDataPlane.bundleExecutor.callTimeoutMs | quote }}
        - name: EXECUTOR_MAX_CALL_TIMEOUT_MS
          value: {{ .Values.pipeline.rustDataPlane.bundleExecutor.maxCallTimeoutMs | quote }}
        - name: EXECUTOR_MEMORY_LIMIT_MB
          value: {{ .Values.pipeline.rustDataPlane.bundleExecutor.memoryLimitMb | quote }}
        - name: EXECUTOR_MAX_MEMORY_LIMIT_MB
          value: {{ .Values.pipeline.rustDataPlane.bundleExecutor.maxMemoryLimitMb | quote }}
        - name: EXECUTOR_INSTANCES_PER_BUNDLE
          value: {{ .Values.pipeline.rustDataPlane.bundleExecutor.instancesPerBundle | quote }}
        - name: EXECUTOR_MAX_CONCURRENT_CALLS
          value: {{ .Values.pipeline.rustDataPlane.bundleExecutor.maxConcurrentCalls | quote }}
        - name: EXECUTOR_MAX_CONCURRENT_COMPILES
          value: {{ .Values.pipeline.rustDataPlane.bundleExecutor.maxConcurrentCompiles | default 0 | quote }}
        - name: EXECUTOR_POOL_WAIT_MS
          value: {{ .Values.pipeline.rustDataPlane.bundleExecutor.poolWaitMs | quote }}
        - name: EXECUTOR_PRECOMPILE_DIR
          value: {{ .Values.pipeline.rustDataPlane.bundleExecutor.precompileDir | quote }}
        - name: EXECUTOR_WASM_COLLECTOR
          value: {{ .Values.pipeline.rustDataPlane.bundleExecutor.wasmCollector | quote }}
        - name: WADDLES_SANDBOX_GVISOR
          value: {{ .Values.pipeline.rustDataPlane.bundleExecutor.sandboxGvisor | quote }}
        # feature/bundle-artifact-signing -- shared platform key set, see values.yaml's
        # pipeline.rustDataPlane.bundleSigningPublicKeys comment (not secret; public keys).
        # fix/chart-autogen-bundle-signing-key -- explicit values override wins when set
        # (backward compat); otherwise sourced at pod-start from the auto-provisioned
        # ConfigMap (see this file's header comment) so no manual step is required.
        {{- if .Values.pipeline.rustDataPlane.bundleSigningPublicKeys }}
        - name: BUNDLE_SIGNING_PUBLIC_KEYS
          value: {{ .Values.pipeline.rustDataPlane.bundleSigningPublicKeys | toJson | quote }}
        {{- else }}
        - name: BUNDLE_SIGNING_PUBLIC_KEYS
          valueFrom:
            configMapKeyRef:
              name: {{ $bsepCmName }}
              key: BUNDLE_SIGNING_PUBLIC_KEYS
        {{- end }}
        # BUNDLE_BUCKET_* (core/bundle_executor/src/bucket.rs) -- the executor's one
        # sanctioned credentialed egress path, alongside the mTLS stage dial above. In-cluster
        # SeaweedFS is plain http:// here, so no BUNDLE_BUCKET_CA_FILE is required (bucket.rs only
        # demands one when the endpoint is https://). Access key/secret are individually
        # secretKeyRef'd from the shared secret (not envFrom) -- see values.yaml's comment on
        # this block for why.
        - name: BUNDLE_BUCKET_ENDPOINT
          value: "{{ include "waddlebot.transitTls.s3Endpoint" . }}"
        # feature/transit-tls-core (F5): the executor's own rustls client (core/bundle_executor/src/bucket.rs) verifies the
        # https endpoint against exactly this CA -- BUNDLE_BUCKET_CA_FILE is mandatory for https and never skipped.
        - name: BUNDLE_BUCKET_CA_FILE
          value: {{ include "waddlebot.transitTls.caPath" . | quote }}
        - name: BUNDLE_BUCKET_NAME
          value: {{ .Values.pipeline.rustDataPlane.bundleExecutor.bucketName | quote }}
        - name: BUNDLE_BUCKET_REGION
          value: {{ .Values.pipeline.rustDataPlane.bundleExecutor.bucketRegion | quote }}
        # feature/seaweedfs-object-storage -- least-privilege "svc-bundles-executor"
        # (data-plane) S3 identity: Read/List ONLY, scoped to this bucket -- see
        # templates/infrastructure/seaweedfs.yaml's s3-identities.json. Replaces the
        # former MINIO_ROOT_USER/MINIO_ROOT_PASSWORD admin credential, which could PUT.
        - name: BUNDLE_BUCKET_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: DATAPLANE_S3_ACCESS_KEY_ID
        - name: BUNDLE_BUCKET_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: DATAPLANE_S3_SECRET_ACCESS_KEY
        {{- if eq (include "waddlebot.hostApiTlsMaterialAvailable" .) "true" }}
        {{- include "waddlebot.hostApiTlsClientEnv" . | nindent 8 }}
        {{- end }}
        {{- if include "waddlebot.connectorRuntimeActive" . }}
        # PR-H connector runtime (spec SS2): the executor DIALS svc-ingest's host-api (ONE connection)
        # with a DISTINCT client cert (SAN = executor identity only) from its own Secret, mounted
        # nowhere else. It pins svc-ingest's own server SAN, never the svc-action identity.
        # Env names match executor config.rs: CONNECTOR_HOST_API_{ADDR,IDENTITY,CLIENT_CERT_FILE,
        # CLIENT_KEY_FILE}; the CA is REUSED from HOST_API_CA_FILE (hostApiTlsClientEnv) -- there is
        # no CONNECTOR_HOST_API_CA_FILE, so the executor-ca-bundle (stage + connector CA) is mounted over it.
        - name: CONNECTOR_HOST_API_ADDR
          value: "{{ include "waddlebot.svcIngestHostApiServiceName" . }}:{{ (.Values.pipeline.rustDataPlane.svcIngest.connectorTools).hostApiPort | default 8301 }}"
        - name: CONNECTOR_HOST_API_IDENTITY
          value: {{ include "waddlebot.svcIngestHostApiServerIdentity" . | quote }}
        - name: EXECUTOR_CONNECTOR_CONNECTIONS
          value: "1"
        - name: CONNECTOR_HOST_API_CLIENT_CERT_FILE
          value: /etc/waddlebot/connector-host-api-tls/tls.crt
        - name: CONNECTOR_HOST_API_CLIENT_KEY_FILE
          value: /etc/waddlebot/connector-host-api-tls/tls.key
        {{- range $p := list "twitch" "discord" "youtube" "wix" "spectrum" }}
        {{- $d := include "waddlebot.connectorDigest" (dict "root" $ "platform" $p) }}
        {{- if $d }}
        - name: CONNECTOR_PIN_DIGEST_{{ upper $p }}
          value: {{ $d | quote }}
        {{- end }}
        {{- end }}
        {{- end }}
        startupProbe:
          # fix/alpha-deploy-executor-and-failfast -- failureThreshold bumped from 12
          # (62s total) to 65 (~5.5min total: 5 + 5*65) -- a cold `load` JIT-compiling a
          # 21MB CPython component plus a .NET component via Cranelift (no .cwasm cache
          # yet, see precompile-cache's own comment) was measured exceeding the old 62s
          # budget and getting killed/restarted before compilation ever finished.
          exec:
            command: ["/app/bundle-executor", "--healthcheck"]
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 65
        livenessProbe:
          exec:
            command: ["/app/bundle-executor", "--healthcheck=session", "--max-age", "60"]
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command: ["/app/bundle-executor", "--healthcheck=session", "--max-age", "20"]
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          {{- toYaml $pool.resources | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        {{- include "waddlebot.transitTls.caVolumeMount" . | nindent 8 }}
        - name: precompile-cache
          mountPath: {{ .Values.pipeline.rustDataPlane.bundleExecutor.precompileDir }}
        {{- if eq (include "waddlebot.hostApiTlsMaterialAvailable" .) "true" }}
        {{- include "waddlebot.hostApiTlsVolumeMount" . | nindent 8 }}
        {{- end }}
        {{- if include "waddlebot.connectorRuntimeActive" . }}
        - name: connector-host-api-tls
          mountPath: /etc/waddlebot/connector-host-api-tls
          readOnly: true
        # Stage CA + connector CA bundle OVER the stage ca.crt path HOST_API_CA_FILE points at.
        - name: executor-ca-bundle
          mountPath: /etc/waddlebot/host-api-tls/ca.crt
          subPath: ca.crt
          readOnly: true
        {{- end }}
      volumes:
      - name: tmp
        emptyDir: {}
      {{- include "waddlebot.transitTls.caVolume" . | nindent 6 }}
      # readOnlyRootFilesystem -- EXECUTOR_PRECOMPILE_DIR must be writable regardless.
      # emptyDir (stateless, no PVC): local staging of signed .cwasm fetched from object
      # storage for mmap deserialize. Object storage is the source of truth, so a restart
      # re-fetches (ms per module) instead of re-JIT-compiling; sizeLimit bounds node disk.
      - name: precompile-cache
        emptyDir:
          sizeLimit: {{ $be.precompileCacheSizeLimit | quote }}
      {{- if eq (include "waddlebot.hostApiTlsMaterialAvailable" .) "true" }}
      {{- include "waddlebot.hostApiTlsVolume" . | nindent 6 }}
      {{- end }}
      {{- if include "waddlebot.connectorRuntimeActive" . }}
      - name: connector-host-api-tls
        secret:
          secretName: {{ include "waddlebot.ingestExecutorTlsSecretName" . }}
          defaultMode: 0440
      - name: executor-ca-bundle
        secret:
          secretName: {{ include "waddlebot.executorCaBundleSecretName" . }}
          defaultMode: 0440
      {{- end }}
{{- end }}
{{- end }}
# R5 posture: ingress scoped to declared ports, default-deny egress, enforced Tetragon exec allowlist.
{{- include "waddlebot.workloadPolicies" (dict "root" $ "component" "svc-bundles-executor" "ports" (list ) "runtime" "rust" "binaries" (list "/app/bundle-executor") "cnp" false) }}
{{- end }}

{{- /*
Bundle-admin request integrity key -- DEDICATED symmetric key (HMAC-SHA256, label
`waddles.bundle-admin.v1`) hub-api signs generic bundle-admin tool requests with and svc-process
verifies (core/svc_process/src/bundle_admin.rs; hub-api side: services/bundle_tool_transport.py).
Mounted ONLY into hub-api (signer) and svc-process-rust (verifier) via secretKeyRef -- never the
shared envFrom Secret, never the event-sync or outbound-pin rings (domain separation: a leak of one
ring must not forge another's requests). Format `kid:hexkey[,kid2:hexkey2]`; rotation: add the new
kid (svc-process verifies any kid in the ring), flip bundleAdminRequest.activeKid, later drop the
old kid. Precedence: bundleAdminRequest.existingSecret (key name BUNDLE_ADMIN_REQUEST_KEYS) >
existing in-cluster Secret (KEEP) > alpha/local auto-generation > fail closed.
*/}}
{{- define "waddlebot.bundleAdminRequestSecretName" -}}
{{- .Values.bundleAdminRequest.existingSecret | default (printf "%s-bundle-admin-request" (include "waddlebot.fullname" .)) -}}
{{- end }}
{{- if and .Values.pipeline.rustDataPlane.enabled (not .Values.bundleAdminRequest.existingSecret) }}
{{- $name := include "waddlebot.bundleAdminRequestSecretName" . }}
{{- $kid := .Values.bundleAdminRequest.activeKid | default "b1" }}
{{- $v := include "waddlebot.autoSecretValue" (dict "ctx" . "key" "BUNDLE_ADMIN_REQUEST_KEYS" "explicit" "" "hex" true "secret" $name) }}
{{- if not (contains ":" $v) }}{{- $v = printf "%s:%s" $kid $v }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/component: bundle-admin-request
type: Opaque
stringData:
  BUNDLE_ADMIN_REQUEST_KEYS: {{ $v | quote }}
{{- end }}

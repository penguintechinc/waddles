# v3.0.x Task 0.5. Static SPA assets; different cache/scaling profile from
# hub-api, which is why it is a separate container rather than served by the same one.
# 1:1 fold of core/hub-webui.yaml — see PIPELINE_MAPPING.md. Coexists with that legacy
# Deployment; cutover is a later task. No envFrom / db-migrate init container, matching the
# legacy hub-webui Deployment's precedent (static assets need neither).
#
# fix/hub-webui-health-and-api-url -- runs admin/hub_module/webui-server/server.js
# (Express, house convention: never nginx), which listens on $PORT (default 8080) and
# proxies /api to $HUB_API_URL. containerPort/PORT/liveness+readiness port must all
# agree with .Values.pipeline.hubWebui.port. HUB_API_URL is wired to the in-cluster
# hub-api-v3 Service (never the server's localhost:8060 dev default) -- server.js
# fails fast at startup if it's unset in NODE_ENV=production.
{{- if .Values.pipeline.hubWebui.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "waddlebot.fullname" . }}-hub-webui-v3
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub-webui-v3
spec:
  replicas: {{ .Values.pipeline.hubWebui.replicas }}
  selector:
    matchLabels:
      {{- include "waddlebot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: hub-webui-v3
  template:
    metadata:
      labels:
        {{- include "waddlebot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: hub-webui-v3
    spec:
      serviceAccountName: {{ include "waddlebot.serviceAccountName" . }}
      {{- include "waddlebot.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: hub-webui
        # fix/alpha-helm-deploy -- admin/hub_module/Dockerfile.webui already exists and
        # already builds under CI as module "hub-webui" (containers.yml); no longer the
        # shared pipeline.nodeBaseImage skeleton placeholder. Bare module name "hub-webui"
        # is the alpha-local repo under global.imageRegistry -- see scripts/deploy-alpha.sh.
        image: "{{ include "waddlebot.legacyModuleImage" (dict "root" . "module" "hub-webui" "imageTag" .Values.global.imageTag) }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        ports:
        - name: http
          containerPort: {{ .Values.pipeline.hubWebui.port }}
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "{{ .Values.pipeline.hubWebui.port }}"
        # In-cluster hub-api-v3 Service -- never the server's localhost dev
        # default (see server.js). Same pattern as svc-ingest/svc-action/etc.
        - name: HUB_API_URL
          value: "http://{{ include "waddlebot.fullname" . }}-hub-api-v3:{{ .Values.pipeline.hubApi.port }}"
        livenessProbe:
          # LOCAL only -- /health never calls out to hub-api, so a slow/down
          # upstream never kills this pod via liveness.
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.pipeline.hubWebui.resources | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "waddlebot.fullname" . }}-hub-webui-v3
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub-webui-v3
spec:
  type: {{ .Values.pipeline.hubWebui.service.type | default "ClusterIP" }}
  # fix/helm-apply-errors -- `Service.spec.ports` is keyed by `port` (not `name`) for
  # kubectl's strategic merge patch. A live Service whose `.Values.pipeline.hubWebui.port`
  # was ever different from the current value (an earlier alpha revision ran this on
  # 8205, current default is {{ .Values.pipeline.hubWebui.port }}) merges as a SECOND,
  # unmatched ports[] entry rather than an in-place update -- both entries keep
  # `name: http`, and the API server rejects the object with `spec.ports[1].name:
  # Duplicate value: "http"` (confirmed via `kubectl apply --dry-run=server` against
  # live alpha; scripts/ci/check-helm-rendered-manifest-invariants.py's module
  # docstring). This is a diff-against-live-history bug, not a self-conflict in this
  # rendered document -- no static check on the rendered manifest alone can catch it.
  # A cluster already carrying an old port number needs one `helm upgrade
  # --force-replace` (Helm v4) to recreate the Service cleanly; avoid changing this
  # port number casually afterward.
  ports:
  - port: {{ .Values.pipeline.hubWebui.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "waddlebot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: hub-webui-v3
{{- end }}

# v3.0.x — SKELETON. 8th container / 4th stage-runner. Renders per-community:
# (a) core overlays (full_screen/media/crawler), (b) the Music Station, (c) each activated
# bundle's `presentation` component (HTML/JS overlay). Supersedes/absorbs
# core/browser_source_core_module's per-community browser-source role — that legacy
# Deployment coexists until cutover (not folded here; no PIPELINE_MAPPING.md entry yet).
# See docs/plans/2026-08-31-app-bundle-sdk-design.md §6 (distribution model) and
# docs/plans/2026-08-31-music-station-design.md §8 (presentation container & player).
#
# Unlike svc-rtc (owned solely by Social, gated on modules.social.enabled), presentation is
# generic pipeline infra like svc-ingest/svc-process/svc-action — it serves every Module's
# activated bundles plus Core overlays, so it is NOT gated on any single modules.<name>.enabled.
# It also does not emit MODULE_LOAD_* env vars: module ownership of Music Station is an open
# decision (music-station-design.md §11.2, "either reuse social or add music") and guessing
# a module set here would just be wrong later — left out deliberately, not an oversight.
#
# Distribution model (both stubbed in svc_presentation/app.py, not wired here):
#   1. Poll hub-api's `GET /api/v1/apps/installed?stage=presentation` and reconcile locally
#      (bundle-sdk-design.md §6.2) — KNOWN_SURFACES gains `presentation`, follow-up work.
#   2. Read per-community activation/routing from the read replica, never primary
#      (bundle-sdk-design.md §6.3) — this container gets a read-only DB account.
#
# Base image pinned to the same digest already used by every other pipeline-stage skeleton
# in this file (pipeline.pythonBaseImage) — no Dockerfile/CI image exists for svc-presentation
# yet; core/svc_presentation/Dockerfile in this PR is scaffold-only, not wired into CI.
{{- if .Values.pipeline.svcPresentation.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "waddlebot.fullname" . }}-svc-presentation
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: svc-presentation
spec:
  replicas: {{ .Values.pipeline.svcPresentation.replicas }}
  selector:
    matchLabels:
      {{- include "waddlebot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: svc-presentation
  template:
    metadata:
      labels:
        {{- include "waddlebot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: svc-presentation
    spec:
      serviceAccountName: {{ include "waddlebot.serviceAccountName" . }}
      {{- include "waddlebot.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # fix/chart-fresh-install-hooks (alpha 2026-10-01) -- waits on hub-api's own
      # /ready before this pod's main container starts (see _helpers.tpl).
      initContainers:
      {{- include "waddlebot.waitForHubApiInitContainer" . | nindent 6 }}
      containers:
      - name: svc-presentation
        image: "{{ .Values.presentation.image.repository }}:{{ .Values.presentation.image.tag | default .Values.global.imageTag | toString }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        ports:
        - name: http
          containerPort: {{ .Values.pipeline.svcPresentation.port }}
          protocol: TCP
        envFrom:
        - configMapRef:
            name: {{ include "waddlebot.fullname" . }}-config
        - secretRef:
            name: {{ include "waddlebot.fullname" . }}-secrets
        env:
        - name: MODULE_NAME
          value: "svc-presentation"
        - name: PIPELINE_STAGE
          value: "presentation"
        - name: MODULE_PORT
          value: {{ .Values.pipeline.svcPresentation.port | quote }}
        # core/svc_presentation/blueprints/live_stream.py: cluster-internal svc-streaming
        # base URL for server-side `/live/<community_id>` proxy calls -- the browser never
        # reaches this, only PUBLIC_STREAMING_URL below is embedded into the page.
        - name: STREAMING_URL
          value: "http://{{ include "waddlebot.fullname" . }}-svc-streaming:{{ .Values.pipeline.svcStreaming.port }}"
        # externally-reachable svc-streaming base URL rewritten into HLS playback URLs for
        # the browser's own HLS.js fetches. Empty by default (live_stream.py degrades to
        # "offline" rather than guessing a hostname); see values.yaml/values-alpha.yaml.
        - name: PUBLIC_STREAMING_URL
          value: {{ .Values.presentation.publicStreamingUrl | default "" | quote }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.pipeline.svcPresentation.resources | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "waddlebot.fullname" . }}-svc-presentation
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: svc-presentation
spec:
  type: {{ .Values.presentation.service.type | default "ClusterIP" }}
  ports:
  - port: {{ .Values.pipeline.svcPresentation.port }}
    targetPort: http
    protocol: TCP
    name: http
    {{- if and (eq (.Values.presentation.service.type | default "ClusterIP") "NodePort") .Values.presentation.service.nodePort }}
    nodePort: {{ .Values.presentation.service.nodePort }}
    {{- end }}
  selector:
    {{- include "waddlebot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: svc-presentation
{{- end }}

# cert-manager path (global.grpcTls.certManager.enabled=true) -- preferred over the static
# Secret (templates/grpc-tls-secret.yaml) whenever the cluster already runs cert-manager.
# Mints a single server+client identity cert (SAN covers every in-namespace gRPC service
# name so one cert works for all server-role Deployments) into the SAME Secret name every
# gRPC Deployment already mounts (ca.crt/tls.crt/tls.key), so no Deployment template needs
# to know which path populated it.
# Requires a pre-existing Issuer/ClusterIssuer named global.grpcTls.certManager.issuerName
# (an internal CA issuer -- out of this chart's scope to provision).
{{- if .Values.global.grpcTls.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "waddlebot.fullname" . }}-grpc-tls
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: grpc-tls
spec:
  secretName: {{ include "waddlebot.fullname" . }}-grpc-tls
  duration: {{ .Values.global.grpcTls.certManager.duration | default "2160h" | quote }}
  renewBefore: {{ .Values.global.grpcTls.certManager.renewBefore | default "360h" | quote }}
  usages:
    - server auth
    - client auth
  dnsNames:
    - {{ include "waddlebot.fullname" . }}-core-data
    - {{ include "waddlebot.fullname" . }}-core-identity
    - {{ include "waddlebot.fullname" . }}-interactive-productivity
    - {{ include "waddlebot.fullname" . }}-action-serverless
    {{- /* explicit FQDNs only -- a namespace wildcard would let any holder impersonate other in-cluster services */}}
    - {{ include "waddlebot.fullname" . }}-core-data.{{ .Values.namespace }}.svc.cluster.local
    - {{ include "waddlebot.fullname" . }}-core-identity.{{ .Values.namespace }}.svc.cluster.local
    - {{ include "waddlebot.fullname" . }}-interactive-productivity.{{ .Values.namespace }}.svc.cluster.local
    - {{ include "waddlebot.fullname" . }}-action-serverless.{{ .Values.namespace }}.svc.cluster.local
  issuerRef:
    name: {{ .Values.global.grpcTls.certManager.issuerName }}
    kind: {{ .Values.global.grpcTls.certManager.issuerKind | default "ClusterIssuer" }}
    group: cert-manager.io
{{- end }}

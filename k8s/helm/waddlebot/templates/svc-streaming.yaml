# v3.0.x — Rust data-plane rewrite (Issue #287). Supersedes the Python/ffmpeg-subprocess
# control+data plane this file previously templated (own DB tables, migration 078, real
# `ffmpeg` subprocess data plane) — the Rust crate at `core/svc_streaming/` now owns both
# control and media-ingest (RTMP/SRT/WebRTC) directly, built from
# `core/svc_streaming/Dockerfile.rust`, pushed as
# `localhost:32000/waddlebot/svc-streaming:alpha-<epoch>` in alpha (CI beta/gamma/prod builds
# follow the standard ghcr.io tag convention — see `streaming.image` below).
#
# Image variant: `streaming.gpuVariant` (cpu|amd|nvidia) appends `-<variant>` to the tag and
# selects the per-variant wiring (amd: device-plugin /dev/dri + render GID; nvidia: runtimeClass +
# GPU limit + tolerations). Inside the pod, a missing GPU means CPU encoders (trial-encode gate); the
# scheduler-side gates (hostPath, GPU limit, runtimeClass) are what can keep a pod from starting.
#
# Unlike the old placeholder (control-only, no media ports declared), this pod now listens
# directly on RTMP (1935/tcp), SRT (9000/udp), ONE multiplexed WebRTC UDP media port (plus an
# optional ICE-TCP fallback port), the HTTP control/health/WHIP/WHEP port, the RoomsService gRPC
# port (50208, mTLS + per-call ES256 service JWT), and a Prometheus metrics port. Gated solely on
# `pipeline.svcStreaming.enabled`, same single-condition gate as before.
#
# RTC exposure (docs/RTC_MEDIA_EXPOSURE.md): the SFU's media port is published ONLY by the
# dedicated `<release>-svc-streaming-rtc-media` Service below (alpha/local: NodePort, owner-approved
# exemption; beta/gamma/production: LoadBalancer scoped to that one port). No hostPort, no
# hostNetwork, no externalIPs, no port range. Ingress is carved out of the generic per-workload
# CNP into two dedicated CNPs: gRPC <- hub-api pods only; media <- the configured entities only.
#
# db-migrate initContainer included (same helper every other pipeline-stage/standalone
# service in this chart uses) — svc-streaming reads its own DB tables via SeaORM;
# migrations are applied by the shared `migrations` image/initContainer, not by this crate.
#
# securityContext deliberately does NOT reuse the chart's shared `.Values.securityContext`
# (runAsUser 1000) — the Rust image's Dockerfile creates a dedicated non-root `appuser` at
# uid 10001, so this container pins that uid explicitly instead.
{{- if .Values.pipeline.svcStreaming.enabled }}
{{- /* RTC media exposure: validated settings (fails the render on any bad port/type combination). */}}
{{- $rtc := include "waddlebot.svcStreaming.rtcMedia" . | fromJson }}
{{- /* Image variant (streaming.gpuVariant) selects the image tag suffix and per-variant pod wiring. */}}
{{- $variant := .Values.streaming.gpuVariant | default "cpu" | toString }}
{{- if not (has $variant (list "cpu" "amd" "nvidia")) }}
{{- fail (printf "streaming.gpuVariant must be one of cpu|amd|nvidia, got %q" $variant) }}
{{- end }}
{{- if and (eq $variant "amd") (not .Values.streaming.amd.supplementalGroups) }}
{{- fail "streaming.amd.supplementalGroups must list the host render GID(s) when streaming.gpuVariant=amd (see `getent group render`)" }}
{{- end }}
{{- $amdDevDri := and (eq $variant "amd") (eq (toString .Values.streaming.amd.devDri) "true") (not .Values.streaming.amd.deviceResource) }}
{{- $gpuResource := "" }}
{{- $gpuCount := 0 }}
{{- if and (eq $variant "amd") .Values.streaming.amd.deviceResource }}
{{- $gpuResource = .Values.streaming.amd.deviceResource }}
{{- $gpuCount = 1 }}
{{- else if and (eq $variant "nvidia") (gt (int .Values.streaming.nvidia.gpuLimit) 0) }}
{{- $gpuResource = "nvidia.com/gpu" }}
{{- $gpuCount = int .Values.streaming.nvidia.gpuLimit }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "waddlebot.fullname" . }}-svc-streaming
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: svc-streaming
spec:
  replicas: {{ .Values.pipeline.svcStreaming.replicas }}
  # Recreate, never RollingUpdate: svc-streaming is a stateful singleton (owns the RTMP 1935 /
  # SRT 9000 listeners, the WebRTC UDP range, and the local stream data dir). A RollingUpdate
  # surge starts the replacement while the old pod still holds those ports/dir -- two writers
  # on one stream dir and a bind collision on the media listeners, then the old pod is killed
  # mid-stream. Same data-integrity rationale as postgres.yaml's Recreate. Keep replicas: 1.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "waddlebot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: svc-streaming
  template:
    metadata:
      labels:
        {{- include "waddlebot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: svc-streaming
    spec:
      {{- include "waddlebot.terminationGracePeriod" (dict "root" $ "seconds" $.Values.pipeline.svcStreaming.terminationGracePeriodSeconds) | nindent 6 }}
      serviceAccountName: {{ include "waddlebot.serviceAccountName" . }}
      {{- if and (eq $variant "nvidia") .Values.streaming.nvidia.runtimeClassName }}
      # NVIDIA container runtime -- injects host-matched libcuda/libnvidia-encode into the pod.
      runtimeClassName: {{ .Values.streaming.nvidia.runtimeClassName | quote }}
      {{- end }}
      {{- with .Values.streaming.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq $variant "nvidia" }}
      tolerations:
        {{- toYaml .Values.streaming.nvidia.tolerations | nindent 8 }}
      {{- end }}
      {{- include "waddlebot.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- if eq $variant "amd" }}
        # Render-node access without root: the host render GID as a supplemental group.
        {{- toYaml (merge (dict "supplementalGroups" .Values.streaming.amd.supplementalGroups) (deepCopy .Values.podSecurityContext)) | nindent 8 }}
        {{- else }}
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        {{- end }}
      initContainers:
      # fix/chart-fresh-install-hooks (alpha 2026-10-01) -- waits on hub-api's own /ready.
      {{- include "waddlebot.waitForHubApiInitContainer" . | nindent 6 }}
      containers:
      - name: svc-streaming
        image: "{{ .Values.streaming.image.repository }}:{{ printf "%s-%s" (include "waddlebot.resolveImageTag" (dict "root" . "image" "svc-streaming" "explicit" .Values.streaming.image.tag)) $variant }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        {{- include "waddlebot.preStop" $ | nindent 8 }}
        # Pinned to the Rust image's own `appuser` (uid 10001), not the chart-wide
        # `.Values.securityContext` (uid 1000) every Python-base placeholder uses.
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: {{ .Values.pipeline.svcStreaming.port }}
          protocol: TCP
        - name: metrics
          containerPort: {{ .Values.pipeline.svcStreaming.metricsPort }}
          protocol: TCP
        - name: grpc
          containerPort: {{ .Values.pipeline.svcStreaming.grpcPort }}
          protocol: TCP
        - name: rtmp
          containerPort: {{ .Values.pipeline.svcStreaming.rtmpPort }}
          protocol: TCP
        - name: srt
          containerPort: {{ .Values.pipeline.svcStreaming.srtPort }}
          protocol: UDP
        # RTC SFU media: ONE multiplexed UDP port (the WebRTC UDP mux) + an optional ICE-TCP
        # fallback port. Declared exactly -- no range, no extra containerPort. Published (never via
        # hostPort) by the dedicated -svc-streaming-rtc-media Service below.
        - name: webrtc-media
          containerPort: {{ $rtc.udpPort | int }}
          protocol: UDP
        {{- if $rtc.iceTcpEnabled }}
        - name: webrtc-ice-tcp
          containerPort: {{ $rtc.iceTcpPort | int }}
          protocol: TCP
        {{- end }}
        envFrom:
        - configMapRef:
            name: {{ include "waddlebot.fullname" . }}-config
        - secretRef:
            name: {{ include "waddlebot.fullname" . }}-secrets
        env:
        {{- include "waddlebot.otel.env" (dict "root" $ "service" "svc-streaming") | nindent 8 }}
        # H-1/H-3 -- this workload's OWN least-privilege database identity (role waddles_svc_streaming;
        # config/postgres/service-roles.yaml). Overrides the envFrom block above; the database
        # owner/superuser credential is NOT in waddlebot-secrets any more.
{{- include "waddlebot.dbEnv" (dict "root" . "role" "waddles_svc_streaming") | nindent 8 }}
{{- include "waddlebot.transitTls.clientEnv" . | nindent 8 }}
        - name: MODULE_NAME
          value: "svc-streaming"
        - name: PIPELINE_STAGE
          value: "streaming"
        - name: MODULE_PORT
          value: {{ .Values.pipeline.svcStreaming.port | quote }}
        {{- if eq (include "waddlebot.hostApiTlsMaterialAvailable" .) "true" }}
        # Rooms gRPC control plane (core/svc_streaming/src/rooms/grpc.rs): hub-api -> svc-streaming
        # RoomsService over HTTP/2 + mTLS (the shared host-api-tls identity; client cert required)
        # with a hub-api-issued ES256 machine JWT on every call. The listener refuses to start
        # without the mTLS files AND a trusted JWT public key, so a half-configured pod crashloops
        # loudly instead of serving an open port. Off entirely when the host-api-tls material is
        # not provisioned (pipeline.rustDataPlane.enabled=false).
        - name: ROOMS_GRPC_PORT
          value: {{ .Values.pipeline.svcStreaming.grpcPort | quote }}
        - name: ROOMS_GRPC_SERVER_CERT_FILE
          value: /etc/waddlebot/host-api-tls/tls.crt
        - name: ROOMS_GRPC_SERVER_KEY_FILE
          value: /etc/waddlebot/host-api-tls/tls.key
        - name: ROOMS_GRPC_CLIENT_CA_FILE
          value: /etc/waddlebot/host-api-tls/ca.crt
        # Public half of hub-api's service-JWT signing key (never the private key), published by
        # the auto-provision-keys hook into the `-service-jwt-public` ConfigMap.
        - name: SERVICE_JWT_ACTIVE_KID
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.autoProvisionedKeys.serviceJwt.publicKeyConfigMapName | default (printf "%s-service-jwt-public" (include "waddlebot.fullname" .)) }}
              key: SERVICE_JWT_ACTIVE_KID
        - name: SERVICE_JWT_PUBLIC_KEY
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.autoProvisionedKeys.serviceJwt.publicKeyConfigMapName | default (printf "%s-service-jwt-public" (include "waddlebot.fullname" .)) }}
              key: SERVICE_JWT_PUBLIC_KEY
        - name: SERVICE_JWT_AUDIENCE
          value: {{ .Values.serviceJwt.audience | quote }}
        # Only hub-api's own SPIFFE identity may call RoomsService.
        - name: ROOMS_GRPC_ALLOWED_SUBJECTS
          value: {{ tpl (index .Values.serviceJwt.identities "hub-api").spiffeId . | quote }}
        {{- end }}
        - name: RTMP_PORT
          value: {{ .Values.pipeline.svcStreaming.rtmpPort | quote }}
        - name: SRT_PORT
          value: {{ .Values.pipeline.svcStreaming.srtPort | quote }}
        # Single mux port expressed as a one-port range (core/svc_streaming config.rs
        # parse_udp_range accepts start==end).
        - name: WEBRTC_UDP_RANGE
          value: {{ printf "%d-%d" ($rtc.udpPort | int) ($rtc.udpPort | int) | quote }}
        {{- if $rtc.iceTcpEnabled }}
        # Optional ICE-TCP fallback listener (one TCP port).
        - name: WEBRTC_ICE_TCP_PORT
          value: {{ $rtc.iceTcpPort | int | quote }}
        {{- end }}
        {{- $roomToken := .Values.pipeline.svcStreaming.rooms.roomToken }}
        {{- if $roomToken.existingSecret }}
        # Room-token signing key from a pre-created Secret (never a values literal). SEAM: the
        # platform_secrets store supersedes this reference and the key becomes ES256 (docs/RTC_MEDIA_EXPOSURE.md).
        - name: WEBRTC_ROOM_TOKEN_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ $roomToken.existingSecret | quote }}
              key: {{ $roomToken.key | quote }}
        {{- end }}
        - name: STREAM_DATA_DIR
          value: {{ .Values.pipeline.svcStreaming.streamDataDir | quote }}
        - name: FFMPEG_PATH
          value: "/usr/bin/ffmpeg"
        # auto = GPU encoder only when the trial encode proves it usable, else CPU (core/svc_streaming/README.md).
        - name: STREAM_ENCODER
          value: {{ .Values.streaming.encoder | default "auto" | quote }}
        {{- if .Values.pipeline.svcStreaming.publicBaseUrl }}
        - name: PUBLIC_BASE_URL
          value: {{ .Values.pipeline.svcStreaming.publicBaseUrl | quote }}
        {{- else if .Values.pipeline.svcStreaming.publicBaseUrlFromNodeIP }}
        {{- if not .Values.pipeline.svcStreaming.nodePort.enabled }}
        {{- fail "pipeline.svcStreaming.publicBaseUrlFromNodeIP requires pipeline.svcStreaming.nodePort.enabled=true (the URL is <node hostIP>:<nodePort.httpPort>); set an explicit publicBaseUrl otherwise" }}
        {{- end }}
        # No literal host in values: the node this pod landed on, via the downward API.
        # $(NODE_HOST_IP) is kubelet env expansion -- NODE_HOST_IP must be declared first.
        - name: NODE_HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: PUBLIC_BASE_URL
          value: {{ printf "http://$(NODE_HOST_IP):%v" .Values.pipeline.svcStreaming.nodePort.httpPort | quote }}
        {{- end }}
        # Recordings land in SeaweedFS (S3-compatible, was MinIO) instead of pod-lifetime
        # emptyDir storage -- see infrastructure.seaweedfs and
        # templates/infrastructure/seaweedfs.yaml. Dedicated "svc-streaming" identity
        # (Read/Write, scoped to the "recordings" bucket only -- see
        # infrastructure.seaweedfs.identities.streaming), replacing the former
        # unscoped "waddlebot"/MINIO_ROOT_* admin credential.
        - name: RECORDINGS_BUCKET
          value: "recordings"
        - name: S3_ENDPOINT
          value: {{ include "waddlebot.transitTls.s3Endpoint" . | quote }}
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: STREAMING_S3_ACCESS_KEY_ID
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: STREAMING_S3_SECRET_ACCESS_KEY
        # EXCEPTION (approved): HTTP probes on the plaintext port 8208, not native `grpc.health.v1`
        # probes. The RoomsService listener (50208) requires a client certificate (mTLS) and the
        # kubelet's gRPC probe cannot present one, so a gRPC probe could never succeed. Owner
        # decision 2026-11-14; peers still health-check over mTLS via tonic-health.
        # Startup budget is per-service (pipeline.svcStreaming.startupProbe, 300s) for the cold
        # first boot: DB wait + GPU trial-encode gate + rooms/WASM bundle first compile.
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: {{ .Values.pipeline.svcStreaming.startupProbe.periodSeconds }}
          timeoutSeconds: 5
          failureThreshold: {{ .Values.pipeline.svcStreaming.startupProbe.failureThreshold }}
        # EXCEPTION (approved): HTTP liveness -- see the startupProbe note above.
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        # EXCEPTION (approved): HTTP readiness -- see the startupProbe note above.
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- $limits := deepCopy (.Values.pipeline.svcStreaming.resources.limits | default (dict)) }}
          {{- if $gpuResource }}
          {{- $_ := set $limits $gpuResource $gpuCount }}
          {{- end }}
          {{- toYaml (dict "requests" .Values.pipeline.svcStreaming.resources.requests "limits" $limits) | nindent 10 }}
        volumeMounts:
        {{- include "waddlebot.transitTls.caVolumeMount" . | nindent 8 }}
        {{- include "waddlebot.valkeyTlsCaVolumeMount" . | nindent 8 }}
        {{- if eq (include "waddlebot.hostApiTlsMaterialAvailable" .) "true" }}
        {{- include "waddlebot.hostApiTlsVolumeMount" . | nindent 8 }}
        {{- end }}
        # HLS segment scratch space -- tmpfs-backed (Memory medium) since segments are
        # short-lived and this keeps transcode I/O off the node's disk. Not a durable store;
        # finished recordings are pushed to MinIO (RECORDINGS_BUCKET above), not read back
        # from here.
        - name: stream-data
          mountPath: {{ .Values.pipeline.svcStreaming.streamDataDir }}
        - name: tmp
          mountPath: /tmp
        {{- if $amdDevDri }}
        # amd variant, hostPath fallback (streaming.amd.deviceResource empty). See values.yaml.
        - name: dri
          mountPath: /dev/dri
        {{- end }}
      volumes:
      {{- include "waddlebot.transitTls.caVolume" . | nindent 6 }}
      {{- include "waddlebot.valkeyTlsCaVolume" . | nindent 6 }}
      {{- if eq (include "waddlebot.hostApiTlsMaterialAvailable" .) "true" }}
      {{- include "waddlebot.hostApiTlsVolume" . | nindent 6 }}
      {{- end }}
      - name: stream-data
        emptyDir:
          medium: Memory
          sizeLimit: 512Mi
      - name: tmp
        emptyDir: {}
      {{- if $amdDevDri }}
      - name: dri
        hostPath:
          path: /dev/dri
          type: Directory
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "waddlebot.fullname" . }}-svc-streaming
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: svc-streaming
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.pipeline.svcStreaming.port }}
    targetPort: http
    protocol: TCP
    name: http
  - port: {{ .Values.pipeline.svcStreaming.metricsPort }}
    targetPort: metrics
    protocol: TCP
    name: metrics
  - port: {{ .Values.pipeline.svcStreaming.grpcPort }}
    targetPort: grpc
    protocol: TCP
    name: grpc
  selector:
    {{- include "waddlebot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: svc-streaming
{{- if .Values.pipeline.svcStreaming.nodePort.enabled }}
---
# Alpha-only direct media ingest exposure (RTMP push + SRT push + the control HTTP port),
# mirroring how svc-presentation-rust.yaml templates presentation.rust.nodePort.
# A second, separate Service rather than switching the ClusterIP Service above to NodePort,
# since only 3 of its 3 ports need node-reachability here and fixed nodePorts (not
# Helm/K8s-assigned) keep a local dev's OBS/ffmpeg RTMP target and PUBLIC_BASE_URL stable
# across redeploys. Gated on pipeline.svcStreaming.nodePort.enabled, which only
# values-alpha.yaml sets true -- base/beta stay ClusterIP-only.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "waddlebot.fullname" . }}-svc-streaming-media
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: svc-streaming
spec:
  type: NodePort
  ports:
  - port: {{ .Values.pipeline.svcStreaming.rtmpPort }}
    targetPort: rtmp
    protocol: TCP
    name: rtmp
    nodePort: {{ .Values.pipeline.svcStreaming.nodePort.rtmpPort }}
  - port: {{ .Values.pipeline.svcStreaming.srtPort }}
    targetPort: srt
    protocol: UDP
    name: srt
    nodePort: {{ .Values.pipeline.svcStreaming.nodePort.srtPort }}
  - port: {{ .Values.pipeline.svcStreaming.port }}
    targetPort: http
    protocol: TCP
    name: http
    nodePort: {{ .Values.pipeline.svcStreaming.nodePort.httpPort }}
  selector:
    {{- include "waddlebot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: svc-streaming
{{- end }}
{{- if $rtc.serviceEnabled }}
---
# RTC media Service: publishes ONLY the SFU media port (UDP mux) and, when enabled, the ICE-TCP
# port -- never RTMP/SRT/HTTP/gRPC. alpha/local = NodePort (owner-approved exemption from the
# no-external-ports rule; fixed nodePort == the bound port, owner forwards the router to it);
# beta/gamma/production = LoadBalancer (provider/MetalLB UDP LB, `loadBalancerSourceRanges` and
# annotations hooks). The chart refuses NodePort outside alpha/local and a published port that
# differs from the bound port (waddlebot.svcStreaming.rtcMedia). Mixed UDP+TCP needs a provider
# with mixed-protocol LB support when iceTcp is on. No hostPort/hostNetwork/externalIPs.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "waddlebot.fullname" . }}-svc-streaming-rtc-media
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: svc-streaming
  {{- with .Values.pipeline.svcStreaming.webrtc.media.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $rtc.serviceType }}
  externalTrafficPolicy: {{ .Values.pipeline.svcStreaming.webrtc.media.service.externalTrafficPolicy }}
  {{- if eq $rtc.serviceType "LoadBalancer" }}
  {{- with .Values.pipeline.svcStreaming.webrtc.media.service.loadBalancerClass }}
  loadBalancerClass: {{ . | quote }}
  {{- end }}
  {{- with .Values.pipeline.svcStreaming.webrtc.media.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  ports:
  - name: rtc-media
    port: {{ $rtc.udpPort | int }}
    targetPort: webrtc-media
    protocol: UDP
    {{- if eq $rtc.serviceType "NodePort" }}
    nodePort: {{ $rtc.nodePortUdp | int }}
    {{- end }}
  {{- if $rtc.iceTcpEnabled }}
  - name: rtc-ice-tcp
    port: {{ $rtc.iceTcpPort | int }}
    targetPort: webrtc-ice-tcp
    protocol: TCP
    {{- if eq $rtc.serviceType "NodePort" }}
    nodePort: {{ $rtc.nodePortTcp | int }}
    {{- end }}
  {{- end }}
  selector:
    {{- include "waddlebot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: svc-streaming
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
# RoomsService gRPC (50208): ingress from hub-api pods ONLY (not the whole namespace, not the
# ingress controller / Gateway). Cilium unions allow rules, so this port is deliberately excluded
# from the generic per-workload CNP below (excludePorts) -- same pattern as hub-api-grpc. The
# app-layer boundary (mTLS client cert + ES256 service JWT pinned to hub-api's SPIFFE id) is the
# second layer. hub-api's egress to this port is already covered by its own-namespace egress rule.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "waddlebot.fullname" . }}-svc-streaming-grpc
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: svc-streaming
spec:
  endpointSelector:
    matchLabels:
      {{- include "waddlebot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: svc-streaming
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: {{ .Values.namespace }}
            app.kubernetes.io/component: hub-api
      toPorts:
        - ports:
            - port: {{ .Values.pipeline.svcStreaming.grpcPort | quote }}
              protocol: TCP
---
# RTC media: external clients (browsers/OBS) open ICE/RTP flows to the SFU's single UDP mux port
# (and the optional ICE-TCP port) and nothing else. `world` is every non-cluster source; alpha
# NodePort (externalTrafficPolicy Cluster) adds host + remote-node because the node SNATs the
# flow. Egress is the generic `world` profile (STUN, if ever used, is already permitted).
# Excluded from the generic per-workload CNP (excludePorts) so these ports are admitted ONLY here.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "waddlebot.fullname" . }}-svc-streaming-media
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: svc-streaming
spec:
  endpointSelector:
    matchLabels:
      {{- include "waddlebot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: svc-streaming
  ingress:
    - fromEntities:
        {{- toYaml .Values.pipeline.svcStreaming.webrtc.media.networkPolicy.fromEntities | nindent 8 }}
      toPorts:
        - ports:
            - port: {{ $rtc.udpPort | int | quote }}
              protocol: UDP
            {{- if $rtc.iceTcpEnabled }}
            - port: {{ $rtc.iceTcpPort | int | quote }}
              protocol: TCP
            {{- end }}
{{- end }}
# R5 posture: ingress scoped to declared ports, default-deny egress, enforced Tetragon exec allowlist.
# gRPC + media ports are carved out (excludePorts) and admitted only by the dedicated CNPs above.
{{- $mediaSpec := printf "%d/UDP" ($rtc.udpPort | int) }}
{{- $iceSpec := printf "%d" ($rtc.iceTcpPort | int) }}
{{- $polPorts := list $.Values.pipeline.svcStreaming.port $.Values.pipeline.svcStreaming.metricsPort $.Values.pipeline.svcStreaming.grpcPort $.Values.pipeline.svcStreaming.rtmpPort (printf "%v/UDP" $.Values.pipeline.svcStreaming.srtPort) $mediaSpec }}
{{- $exclude := list $.Values.pipeline.svcStreaming.grpcPort $mediaSpec }}
{{- if $rtc.iceTcpEnabled }}
{{- $polPorts = append $polPorts $iceSpec }}
{{- $exclude = append $exclude $iceSpec }}
{{- end }}
{{- include "waddlebot.workloadPolicies" (dict "root" $ "component" "svc-streaming" "ports" $polPorts "excludePorts" $exclude "runtime" "rust" "binaries" (list "/app/svc-streaming" "/usr/bin/ffmpeg" "/usr/bin/ffprobe") "egress" "world") }}
{{- end }}

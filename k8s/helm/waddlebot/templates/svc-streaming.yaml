# v3.0.x — Rust data-plane rewrite (Issue #287). Supersedes the Python/ffmpeg-subprocess
# control+data plane this file previously templated (own DB tables, migration 078, real
# `ffmpeg` subprocess data plane) — the Rust crate at `core/svc_streaming/` now owns both
# control and media-ingest (RTMP/SRT/WebRTC) directly, built from
# `core/svc_streaming/Dockerfile.rust`, pushed as
# `localhost:32000/waddlebot/svc-streaming:alpha-<epoch>` in alpha (CI beta/gamma/prod builds
# follow the standard ghcr.io tag convention — see `streaming.image` below).
#
# Image variant: `streaming.gpuVariant` (cpu|amd|nvidia) appends `-<variant>` to the tag and
# selects the per-variant wiring (amd: device-plugin /dev/dri + render GID; nvidia: runtimeClass +
# GPU limit + tolerations). Inside the pod, a missing GPU means CPU encoders (trial-encode gate); the
# scheduler-side gates (hostPath, GPU limit, runtimeClass) are what can keep a pod from starting.
#
# Unlike the old placeholder (control-only, no media ports declared), this pod now listens
# directly on RTMP (1935/tcp), SRT (9000/udp), and a WebRTC UDP media range
# (40000-40100/udp) in addition to the HTTP control/health port, gRPC (reserved, still
# REST-primary), and a Prometheus metrics port. Gated solely on
# `pipeline.svcStreaming.enabled`, same single-condition gate as before.
#
# db-migrate initContainer included (same helper every other pipeline-stage/standalone
# service in this chart uses) — svc-streaming reads its own DB tables via SeaORM;
# migrations are applied by the shared `migrations` image/initContainer, not by this crate.
#
# securityContext deliberately does NOT reuse the chart's shared `.Values.securityContext`
# (runAsUser 1000) — the Rust image's Dockerfile creates a dedicated non-root `appuser` at
# uid 10001, so this container pins that uid explicitly instead.
{{- if .Values.pipeline.svcStreaming.enabled }}
{{- /* Image variant (streaming.gpuVariant) selects the image tag suffix and per-variant pod wiring. */}}
{{- $variant := .Values.streaming.gpuVariant | default "cpu" | toString }}
{{- if not (has $variant (list "cpu" "amd" "nvidia")) }}
{{- fail (printf "streaming.gpuVariant must be one of cpu|amd|nvidia, got %q" $variant) }}
{{- end }}
{{- if and (eq $variant "amd") (not .Values.streaming.amd.supplementalGroups) }}
{{- fail "streaming.amd.supplementalGroups must list the host render GID(s) when streaming.gpuVariant=amd (see `getent group render`)" }}
{{- end }}
{{- $amdDevDri := and (eq $variant "amd") (eq (toString .Values.streaming.amd.devDri) "true") (not .Values.streaming.amd.deviceResource) }}
{{- $gpuResource := "" }}
{{- $gpuCount := 0 }}
{{- if and (eq $variant "amd") .Values.streaming.amd.deviceResource }}
{{- $gpuResource = .Values.streaming.amd.deviceResource }}
{{- $gpuCount = 1 }}
{{- else if and (eq $variant "nvidia") (gt (int .Values.streaming.nvidia.gpuLimit) 0) }}
{{- $gpuResource = "nvidia.com/gpu" }}
{{- $gpuCount = int .Values.streaming.nvidia.gpuLimit }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "waddlebot.fullname" . }}-svc-streaming
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: svc-streaming
spec:
  replicas: {{ .Values.pipeline.svcStreaming.replicas }}
  # Recreate, never RollingUpdate: svc-streaming is a stateful singleton (owns the RTMP 1935 /
  # SRT 9000 listeners, the WebRTC UDP range, and the local stream data dir). A RollingUpdate
  # surge starts the replacement while the old pod still holds those ports/dir -- two writers
  # on one stream dir and a bind collision on the media listeners, then the old pod is killed
  # mid-stream. Same data-integrity rationale as postgres.yaml's Recreate. Keep replicas: 1.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "waddlebot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: svc-streaming
  template:
    metadata:
      labels:
        {{- include "waddlebot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: svc-streaming
    spec:
      {{- include "waddlebot.terminationGracePeriod" (dict "root" $ "seconds" $.Values.pipeline.svcStreaming.terminationGracePeriodSeconds) | nindent 6 }}
      serviceAccountName: {{ include "waddlebot.serviceAccountName" . }}
      {{- if and (eq $variant "nvidia") .Values.streaming.nvidia.runtimeClassName }}
      # NVIDIA container runtime -- injects host-matched libcuda/libnvidia-encode into the pod.
      runtimeClassName: {{ .Values.streaming.nvidia.runtimeClassName | quote }}
      {{- end }}
      {{- with .Values.streaming.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq $variant "nvidia" }}
      tolerations:
        {{- toYaml .Values.streaming.nvidia.tolerations | nindent 8 }}
      {{- end }}
      {{- include "waddlebot.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- if eq $variant "amd" }}
        # Render-node access without root: the host render GID as a supplemental group.
        {{- toYaml (merge (dict "supplementalGroups" .Values.streaming.amd.supplementalGroups) (deepCopy .Values.podSecurityContext)) | nindent 8 }}
        {{- else }}
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        {{- end }}
      initContainers:
      # fix/chart-fresh-install-hooks (alpha 2026-10-01) -- waits on hub-api's own /ready.
      {{- include "waddlebot.waitForHubApiInitContainer" . | nindent 6 }}
      containers:
      - name: svc-streaming
        image: "{{ .Values.streaming.image.repository }}:{{ printf "%s-%s" (.Values.streaming.image.tag | default .Values.global.imageTag | toString) $variant }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        {{- include "waddlebot.preStop" $ | nindent 8 }}
        # Pinned to the Rust image's own `appuser` (uid 10001), not the chart-wide
        # `.Values.securityContext` (uid 1000) every Python-base placeholder uses.
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: {{ .Values.pipeline.svcStreaming.port }}
          protocol: TCP
        - name: metrics
          containerPort: {{ .Values.pipeline.svcStreaming.metricsPort }}
          protocol: TCP
        - name: grpc
          containerPort: {{ .Values.pipeline.svcStreaming.grpcPort }}
          protocol: TCP
        - name: rtmp
          containerPort: {{ .Values.pipeline.svcStreaming.rtmpPort }}
          protocol: TCP
        - name: srt
          containerPort: {{ .Values.pipeline.svcStreaming.srtPort }}
          protocol: UDP
        # WebRTC media range is 101 ports (40000-40100/udp) -- too many to enumerate as
        # individual containerPort entries and no range-loop precedent exists elsewhere in
        # this chart's port declarations, so only the range's two boundary ports are
        # declared here for documentation/introspection. WEBRTC_UDP_RANGE (env, below) is
        # what the app actually binds against; no Service/NodePort exposes this range in any
        # environment today (alpha's direct media exposure is RTMP/SRT/HTTP only).
        - name: webrtc-lo
          containerPort: {{ .Values.pipeline.svcStreaming.webrtcRangeStart }}
          protocol: UDP
        - name: webrtc-hi
          containerPort: {{ .Values.pipeline.svcStreaming.webrtcRangeEnd }}
          protocol: UDP
        envFrom:
        - configMapRef:
            name: {{ include "waddlebot.fullname" . }}-config
        - secretRef:
            name: {{ include "waddlebot.fullname" . }}-secrets
        env:
        # H-1/H-3 -- this workload's OWN least-privilege database identity (role waddles_svc_streaming;
        # config/postgres/service-roles.yaml). Overrides the envFrom block above; the database
        # owner/superuser credential is NOT in waddlebot-secrets any more.
{{- include "waddlebot.dbEnv" (dict "root" . "role" "waddles_svc_streaming") | nindent 8 }}
        - name: MODULE_NAME
          value: "svc-streaming"
        - name: PIPELINE_STAGE
          value: "streaming"
        - name: MODULE_PORT
          value: {{ .Values.pipeline.svcStreaming.port | quote }}
        - name: RTMP_PORT
          value: {{ .Values.pipeline.svcStreaming.rtmpPort | quote }}
        - name: SRT_PORT
          value: {{ .Values.pipeline.svcStreaming.srtPort | quote }}
        - name: WEBRTC_UDP_RANGE
          value: {{ printf "%v-%v" .Values.pipeline.svcStreaming.webrtcRangeStart .Values.pipeline.svcStreaming.webrtcRangeEnd | quote }}
        - name: STREAM_DATA_DIR
          value: {{ .Values.pipeline.svcStreaming.streamDataDir | quote }}
        - name: FFMPEG_PATH
          value: "/usr/bin/ffmpeg"
        # auto = GPU encoder only when the trial encode proves it usable, else CPU (core/svc_streaming/README.md).
        - name: STREAM_ENCODER
          value: {{ .Values.streaming.encoder | default "auto" | quote }}
        {{- if .Values.pipeline.svcStreaming.publicBaseUrl }}
        - name: PUBLIC_BASE_URL
          value: {{ .Values.pipeline.svcStreaming.publicBaseUrl | quote }}
        {{- else if .Values.pipeline.svcStreaming.publicBaseUrlFromNodeIP }}
        {{- if not .Values.pipeline.svcStreaming.nodePort.enabled }}
        {{- fail "pipeline.svcStreaming.publicBaseUrlFromNodeIP requires pipeline.svcStreaming.nodePort.enabled=true (the URL is <node hostIP>:<nodePort.httpPort>); set an explicit publicBaseUrl otherwise" }}
        {{- end }}
        # No literal host in values: the node this pod landed on, via the downward API.
        # $(NODE_HOST_IP) is kubelet env expansion -- NODE_HOST_IP must be declared first.
        - name: NODE_HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: PUBLIC_BASE_URL
          value: {{ printf "http://$(NODE_HOST_IP):%v" .Values.pipeline.svcStreaming.nodePort.httpPort | quote }}
        {{- end }}
        # Recordings land in SeaweedFS (S3-compatible, was MinIO) instead of pod-lifetime
        # emptyDir storage -- see infrastructure.seaweedfs and
        # templates/infrastructure/seaweedfs.yaml. Dedicated "svc-streaming" identity
        # (Read/Write, scoped to the "recordings" bucket only -- see
        # infrastructure.seaweedfs.identities.streaming), replacing the former
        # unscoped "waddlebot"/MINIO_ROOT_* admin credential.
        - name: RECORDINGS_BUCKET
          value: "recordings"
        - name: S3_ENDPOINT
          value: {{ printf "http://%s:%v" .Values.infrastructure.seaweedfs.service.name .Values.infrastructure.seaweedfs.service.s3Port | quote }}
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: STREAMING_S3_ACCESS_KEY_ID
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: STREAMING_S3_SECRET_ACCESS_KEY
        {{- include "waddlebot.startupProbe" (dict "root" $ "path" "/health" "port" "http") | nindent 8 }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- $limits := deepCopy (.Values.pipeline.svcStreaming.resources.limits | default (dict)) }}
          {{- if $gpuResource }}
          {{- $_ := set $limits $gpuResource $gpuCount }}
          {{- end }}
          {{- toYaml (dict "requests" .Values.pipeline.svcStreaming.resources.requests "limits" $limits) | nindent 10 }}
        volumeMounts:
        # HLS segment scratch space -- tmpfs-backed (Memory medium) since segments are
        # short-lived and this keeps transcode I/O off the node's disk. Not a durable store;
        # finished recordings are pushed to MinIO (RECORDINGS_BUCKET above), not read back
        # from here.
        - name: stream-data
          mountPath: {{ .Values.pipeline.svcStreaming.streamDataDir }}
        - name: tmp
          mountPath: /tmp
        {{- if $amdDevDri }}
        # amd variant, hostPath fallback (streaming.amd.deviceResource empty). See values.yaml.
        - name: dri
          mountPath: /dev/dri
        {{- end }}
      volumes:
      - name: stream-data
        emptyDir:
          medium: Memory
          sizeLimit: 512Mi
      - name: tmp
        emptyDir: {}
      {{- if $amdDevDri }}
      - name: dri
        hostPath:
          path: /dev/dri
          type: Directory
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "waddlebot.fullname" . }}-svc-streaming
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: svc-streaming
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.pipeline.svcStreaming.port }}
    targetPort: http
    protocol: TCP
    name: http
  - port: {{ .Values.pipeline.svcStreaming.metricsPort }}
    targetPort: metrics
    protocol: TCP
    name: metrics
  - port: {{ .Values.pipeline.svcStreaming.grpcPort }}
    targetPort: grpc
    protocol: TCP
    name: grpc
  selector:
    {{- include "waddlebot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: svc-streaming
{{- if .Values.pipeline.svcStreaming.nodePort.enabled }}
---
# Alpha-only direct media ingest exposure (RTMP push + SRT push + the control HTTP port),
# mirroring how svc-presentation.yaml templates presentation.service.type/nodePort today.
# A second, separate Service rather than switching the ClusterIP Service above to NodePort,
# since only 3 of its 3 ports need node-reachability here and fixed nodePorts (not
# Helm/K8s-assigned) keep a local dev's OBS/ffmpeg RTMP target and PUBLIC_BASE_URL stable
# across redeploys. Gated on pipeline.svcStreaming.nodePort.enabled, which only
# values-alpha.yaml sets true -- base/beta stay ClusterIP-only.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "waddlebot.fullname" . }}-svc-streaming-media
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: svc-streaming
spec:
  type: NodePort
  ports:
  - port: {{ .Values.pipeline.svcStreaming.rtmpPort }}
    targetPort: rtmp
    protocol: TCP
    name: rtmp
    nodePort: {{ .Values.pipeline.svcStreaming.nodePort.rtmpPort }}
  - port: {{ .Values.pipeline.svcStreaming.srtPort }}
    targetPort: srt
    protocol: UDP
    name: srt
    nodePort: {{ .Values.pipeline.svcStreaming.nodePort.srtPort }}
  - port: {{ .Values.pipeline.svcStreaming.port }}
    targetPort: http
    protocol: TCP
    name: http
    nodePort: {{ .Values.pipeline.svcStreaming.nodePort.httpPort }}
  selector:
    {{- include "waddlebot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: svc-streaming
{{- end }}
# R5 posture: ingress scoped to declared ports, default-deny egress, enforced Tetragon exec allowlist.
{{- include "waddlebot.workloadPolicies" (dict "root" $ "component" "svc-streaming" "ports" (list $.Values.pipeline.svcStreaming.port $.Values.pipeline.svcStreaming.metricsPort $.Values.pipeline.svcStreaming.grpcPort $.Values.pipeline.svcStreaming.rtmpPort (printf "%v/UDP" $.Values.pipeline.svcStreaming.srtPort) (printf "%v-%v/UDP" $.Values.pipeline.svcStreaming.webrtcRangeStart $.Values.pipeline.svcStreaming.webrtcRangeEnd)) "runtime" "rust" "binaries" (list "/app/svc-streaming" "/usr/bin/ffmpeg" "/usr/bin/ffprobe") "egress" "world") }}
{{- end }}

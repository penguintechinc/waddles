# v3.0.x — Rust data-plane rewrite (Issue #287). Supersedes the Python/ffmpeg-subprocess
# control+data plane this file previously templated (own DB tables, migration 078, real
# `ffmpeg` subprocess data plane) — the Rust crate at `core/svc_streaming/` now owns both
# control and media-ingest (RTMP/SRT/WebRTC) directly, built from
# `core/svc_streaming/Dockerfile.rust`, pushed as
# `localhost:32000/waddlebot/svc-streaming:alpha-<epoch>` in alpha (CI beta/gamma/prod builds
# follow the standard ghcr.io tag convention — see `streaming.image` below).
#
# Unlike the old placeholder (control-only, no media ports declared), this pod now listens
# directly on RTMP (1935/tcp), SRT (9000/udp), and a WebRTC UDP media range
# (40000-40100/udp) in addition to the HTTP control/health port, gRPC (reserved, still
# REST-primary), and a Prometheus metrics port. Gated solely on
# `pipeline.svcStreaming.enabled`, same single-condition gate as before.
#
# db-migrate initContainer included (same helper every other pipeline-stage/standalone
# service in this chart uses) — svc-streaming reads its own DB tables via SeaORM;
# migrations are applied by the shared `migrations` image/initContainer, not by this crate.
#
# securityContext deliberately does NOT reuse the chart's shared `.Values.securityContext`
# (runAsUser 1000) — the Rust image's Dockerfile creates a dedicated non-root `appuser` at
# uid 10001, so this container pins that uid explicitly instead.
{{- if .Values.pipeline.svcStreaming.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "waddlebot.fullname" . }}-svc-streaming
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: svc-streaming
spec:
  replicas: {{ .Values.pipeline.svcStreaming.replicas }}
  selector:
    matchLabels:
      {{- include "waddlebot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: svc-streaming
  template:
    metadata:
      labels:
        {{- include "waddlebot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: svc-streaming
    spec:
      serviceAccountName: {{ include "waddlebot.serviceAccountName" . }}
      {{- include "waddlebot.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
      {{- include "waddlebot.dbMigrateInitContainer" . | nindent 6 }}
      containers:
      - name: svc-streaming
        image: "{{ .Values.streaming.image.repository }}:{{ .Values.streaming.image.tag | default .Values.global.imageTag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        # Pinned to the Rust image's own `appuser` (uid 10001), not the chart-wide
        # `.Values.securityContext` (uid 1000) every Python-base placeholder uses.
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: {{ .Values.pipeline.svcStreaming.port }}
          protocol: TCP
        - name: metrics
          containerPort: {{ .Values.pipeline.svcStreaming.metricsPort }}
          protocol: TCP
        - name: grpc
          containerPort: {{ .Values.pipeline.svcStreaming.grpcPort }}
          protocol: TCP
        - name: rtmp
          containerPort: {{ .Values.pipeline.svcStreaming.rtmpPort }}
          protocol: TCP
        - name: srt
          containerPort: {{ .Values.pipeline.svcStreaming.srtPort }}
          protocol: UDP
        # WebRTC media range is 101 ports (40000-40100/udp) -- too many to enumerate as
        # individual containerPort entries and no range-loop precedent exists elsewhere in
        # this chart's port declarations, so only the range's two boundary ports are
        # declared here for documentation/introspection. WEBRTC_UDP_RANGE (env, below) is
        # what the app actually binds against; no Service/NodePort exposes this range in any
        # environment today (alpha's direct media exposure is RTMP/SRT/HTTP only).
        - name: webrtc-lo
          containerPort: {{ .Values.pipeline.svcStreaming.webrtcRangeStart }}
          protocol: UDP
        - name: webrtc-hi
          containerPort: {{ .Values.pipeline.svcStreaming.webrtcRangeEnd }}
          protocol: UDP
        envFrom:
        - configMapRef:
            name: {{ include "waddlebot.fullname" . }}-config
        - secretRef:
            name: {{ include "waddlebot.fullname" . }}-secrets
        env:
        - name: MODULE_NAME
          value: "svc-streaming"
        - name: PIPELINE_STAGE
          value: "streaming"
        - name: MODULE_PORT
          value: {{ .Values.pipeline.svcStreaming.port | quote }}
        - name: RTMP_PORT
          value: {{ .Values.pipeline.svcStreaming.rtmpPort | quote }}
        - name: SRT_PORT
          value: {{ .Values.pipeline.svcStreaming.srtPort | quote }}
        - name: WEBRTC_UDP_RANGE
          value: {{ printf "%v-%v" .Values.pipeline.svcStreaming.webrtcRangeStart .Values.pipeline.svcStreaming.webrtcRangeEnd | quote }}
        - name: STREAM_DATA_DIR
          value: {{ .Values.pipeline.svcStreaming.streamDataDir | quote }}
        - name: FFMPEG_PATH
          value: "/usr/bin/ffmpeg"
        {{- if .Values.pipeline.svcStreaming.publicBaseUrl }}
        - name: PUBLIC_BASE_URL
          value: {{ .Values.pipeline.svcStreaming.publicBaseUrl | quote }}
        {{- end }}
        # Recordings land in SeaweedFS (S3-compatible, was MinIO) instead of pod-lifetime
        # emptyDir storage -- see infrastructure.seaweedfs and
        # templates/infrastructure/seaweedfs.yaml. Dedicated "svc-streaming" identity
        # (Read/Write, scoped to the "recordings" bucket only -- see
        # infrastructure.seaweedfs.identities.streaming), replacing the former
        # unscoped "waddlebot"/MINIO_ROOT_* admin credential.
        - name: RECORDINGS_BUCKET
          value: "recordings"
        - name: S3_ENDPOINT
          value: {{ printf "http://%s:%v" .Values.infrastructure.seaweedfs.service.name .Values.infrastructure.seaweedfs.service.s3Port | quote }}
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: STREAMING_S3_ACCESS_KEY_ID
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: STREAMING_S3_SECRET_ACCESS_KEY
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.pipeline.svcStreaming.resources | nindent 10 }}
        volumeMounts:
        # HLS segment scratch space -- tmpfs-backed (Memory medium) since segments are
        # short-lived and this keeps transcode I/O off the node's disk. Not a durable store;
        # finished recordings are pushed to MinIO (RECORDINGS_BUCKET above), not read back
        # from here.
        - name: stream-data
          mountPath: {{ .Values.pipeline.svcStreaming.streamDataDir }}
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: stream-data
        emptyDir:
          medium: Memory
          sizeLimit: 512Mi
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "waddlebot.fullname" . }}-svc-streaming
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: svc-streaming
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.pipeline.svcStreaming.port }}
    targetPort: http
    protocol: TCP
    name: http
  - port: {{ .Values.pipeline.svcStreaming.metricsPort }}
    targetPort: metrics
    protocol: TCP
    name: metrics
  - port: {{ .Values.pipeline.svcStreaming.grpcPort }}
    targetPort: grpc
    protocol: TCP
    name: grpc
  selector:
    {{- include "waddlebot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: svc-streaming
{{- if .Values.pipeline.svcStreaming.nodePort.enabled }}
---
# Alpha-only direct media ingest exposure (RTMP push + SRT push + the control HTTP port),
# mirroring how svc-presentation.yaml templates presentation.service.type/nodePort today.
# A second, separate Service rather than switching the ClusterIP Service above to NodePort,
# since only 3 of its 3 ports need node-reachability here and fixed nodePorts (not
# Helm/K8s-assigned) keep a local dev's OBS/ffmpeg RTMP target and PUBLIC_BASE_URL stable
# across redeploys. Gated on pipeline.svcStreaming.nodePort.enabled, which only
# values-alpha.yaml sets true -- base/beta stay ClusterIP-only.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "waddlebot.fullname" . }}-svc-streaming-media
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: svc-streaming
spec:
  type: NodePort
  ports:
  - port: {{ .Values.pipeline.svcStreaming.rtmpPort }}
    targetPort: rtmp
    protocol: TCP
    name: rtmp
    nodePort: {{ .Values.pipeline.svcStreaming.nodePort.rtmpPort }}
  - port: {{ .Values.pipeline.svcStreaming.srtPort }}
    targetPort: srt
    protocol: UDP
    name: srt
    nodePort: {{ .Values.pipeline.svcStreaming.nodePort.srtPort }}
  - port: {{ .Values.pipeline.svcStreaming.port }}
    targetPort: http
    protocol: TCP
    name: http
    nodePort: {{ .Values.pipeline.svcStreaming.nodePort.httpPort }}
  selector:
    {{- include "waddlebot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: svc-streaming
{{- end }}
{{- end }}

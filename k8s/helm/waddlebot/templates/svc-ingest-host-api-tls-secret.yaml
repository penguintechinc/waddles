# P6a -- svc-ingest's DEDICATED host-api mTLS material for the generic outbound executor
# (svcIngest.connectorTools). Deliberately NOT the shared executor/stage host-api-tls Secret: a
# compromised edge service must not hold a key that lets it impersonate an executor or a stage.
#   <fullname>-svc-ingest-host-api-tls : ca.crt (CA the client cert must chain to), tls.crt/tls.key
#                                        (server-only cert, svc-ingest SAN only) -> mounted by svc-ingest
#   <fullname>-ingest-executor-tls     : ca.crt, tls.crt/tls.key (the ONE client identity svc-ingest
#                                        pins) -> mounted ONLY by svc-bundles-executor (PR-H)
# SEPARATE connector trust domain (NOT the stage CA): stage servers only chain-verify clients, so a
# stage-CA cert issued to svc-ingest would be accepted as a stage client. Both Secrets below come from
# a connector CA (waddlebot.connectorTrustSecrets); the executor trusts stage CA + connector CA via the
# `<fullname>-executor-ca-bundle` Secret mounted over its HOST_API_CA_FILE. On alpha/local with the stage
# Secret being (re)generated, host-api-tls-secret.yaml calls the same helper with its fresh CA.
#   <fullname>-svc-ingest-host-api-tls : connector ca.crt, server-only cert (svc-ingest SAN) -> svc-ingest
#   <fullname>-ingest-executor-tls     : connector ca.crt, client cert (executor identity only) -> executor only
# Policy: both present -> KEPT; alpha/local -> minted; externalSecret -> operator supplies them and
# `executorCaBundleSecretName`; otherwise fail closed.
{{- $ct := .Values.pipeline.rustDataPlane.svcIngest.connectorTools | default dict }}
{{- if and .Values.pipeline.rustDataPlane.enabled .Values.pipeline.rustDataPlane.svcIngest.enabled $ct.enabled }}
{{- if not (include "waddlebot.stageHostApiGenerates" .) }}
{{- include "waddlebot.connectorTrustSecrets" (dict "root" . "stageCa" (include "waddlebot.stageCaPem" .)) }}
{{- end }}
{{- end }}

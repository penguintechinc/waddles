# P6a -- svc-ingest's DEDICATED host-api mTLS material for the generic outbound executor
# (svcIngest.connectorTools). Deliberately NOT the shared executor/stage host-api-tls Secret: a
# compromised edge service must not hold a key that lets it impersonate an executor or a stage.
#   <fullname>-svc-ingest-host-api-tls : ca.crt (CA the client cert must chain to), tls.crt/tls.key
#                                        (server-only cert, svc-ingest SAN only) -> mounted by svc-ingest
#   <fullname>-ingest-executor-tls     : ca.crt, tls.crt/tls.key (the ONE client identity svc-ingest
#                                        pins) -> mounted ONLY by bundle-executor (PR-H)
# ONE CA: the executor verifies this server cert with HOST_API_CA_FILE (the stage host-api CA), so
# both Secrets MUST chain to that same CA. Policy:
#   - alpha/local, stage Secret being (re)generated -> BOTH minted from the stage's CA by
#     host-api-tls-secret.yaml (waddlebot.connectorHostApiTlsSecrets); this file emits nothing.
#   - both present -> KEPT, but fails unless ca.crt matches the stage Secret's ca.crt.
#   - `hostApiTls.externalSecret` -> skipped; requires `hostApiTls.sharedCa: true` (operator
#     attests both chain to the one CA the executor trusts) else fail.
#   - otherwise fail closed.
{{- $ct := .Values.pipeline.rustDataPlane.svcIngest.connectorTools | default dict }}
{{- if and .Values.pipeline.rustDataPlane.enabled .Values.pipeline.rustDataPlane.svcIngest.enabled $ct.enabled }}
{{- $ht := $ct.hostApiTls | default dict }}
{{- $fullname := include "waddlebot.fullname" . }}
{{- $srvName := include "waddlebot.svcIngestHostApiTlsSecretName" . }}
{{- $cliName := include "waddlebot.ingestExecutorTlsSecretName" . }}
{{- $clientId := include "waddlebot.svcIngestHostApiClientIdentity" . }}
{{- $ns := .Values.namespace }}
{{- $tier := .Values.global.deploymentTier }}
{{- $srvExisting := lookup "v1" "Secret" $ns $srvName }}
{{- $cliExisting := lookup "v1" "Secret" $ns $cliName }}
{{- $stageName := printf "%s-host-api-tls" $fullname }}
{{- $stageExisting := lookup "v1" "Secret" $ns $stageName }}
{{- if include "waddlebot.stageHostApiGenerates" . }}
# Emitted by host-api-tls-secret.yaml from the stage CA (single CA for the executor trust root).
{{- else if and $srvExisting $cliExisting }}
{{- if and $stageExisting (ne (index $srvExisting.data "ca.crt" | default "") (index $stageExisting.data "ca.crt" | default "")) (not $ht.sharedCa) }}
{{- fail (printf "svcIngest.connectorTools.hostApiTls: Secrets %q/%q chain to a DIFFERENT CA than %q -- the executor verifies svc-ingest with HOST_API_CA_FILE only, so both must share one CA. alpha/local: delete all three Secrets and re-render (they regenerate from one CA); elsewhere re-issue from the stage CA." $srvName $cliName $stageName) }}
{{- end }}
# Kept -- both Secrets already exist (same CA as the stage Secret).
{{- else if $ht.externalSecret }}
{{- if not $ht.sharedCa }}
{{- fail (printf "svcIngest.connectorTools.hostApiTls.externalSecret=true requires hostApiTls.sharedCa=true: attest that %q/%q chain to the SAME CA as %q (the executor trusts only HOST_API_CA_FILE)." $srvName $cliName $stageName) }}
{{- end }}
# Skipped -- an external controller owns {{ $srvName }} / {{ $cliName }} (shared CA attested).
{{- else if not (or (eq $tier "alpha") (eq $tier "local")) }}
{{- fail (printf "svcIngest.connectorTools.hostApiTls: Secrets %q and %q not found in %q and global.deploymentTier=%q is outside alpha/local -- supply them (ca.crt/tls.crt/tls.key each, signed by the SAME CA as %q; server cert SAN = the svc-ingest Service; client cert identity %q) or set hostApiTls.externalSecret=true with sharedCa=true" $srvName $cliName $ns $tier $stageName $clientId) }}
{{- else }}
{{- fail (printf "svcIngest.connectorTools.hostApiTls: alpha/local, but %q already exists and its CA key was never stored, so %q/%q cannot be signed by it. Delete %q (alpha is disposable) and re-render so all three regenerate from one CA." $stageName $srvName $cliName $stageName) }}
{{- end }}
{{- end }}

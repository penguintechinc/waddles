# P6a -- svc-ingest's DEDICATED host-api mTLS material for the generic outbound executor
# (svcIngest.connectorTools). Deliberately NOT the shared executor/stage host-api-tls Secret: a
# compromised edge service must not hold a key that lets it impersonate an executor or a stage.
#   <fullname>-svc-ingest-host-api-tls : ca.crt (CA the client cert must chain to), tls.crt/tls.key
#                                        (server-only cert, svc-ingest SAN only) -> mounted by svc-ingest
#   <fullname>-ingest-executor-tls     : ca.crt, tls.crt/tls.key (the ONE client identity svc-ingest
#                                        pins) -> for the ingest-dedicated executor; mounted by nothing yet
# Policy: both present -> KEPT; else alpha/local -> BOTH minted from one fresh CA (the CA key is
# never stored); `hostApiTls.externalSecret` -> skipped; otherwise fail closed.
{{- $ct := .Values.pipeline.rustDataPlane.svcIngest.connectorTools | default dict }}
{{- if and .Values.pipeline.rustDataPlane.enabled .Values.pipeline.rustDataPlane.svcIngest.enabled $ct.enabled }}
{{- $ht := $ct.hostApiTls | default dict }}
{{- $fullname := include "waddlebot.fullname" . }}
{{- $srvName := include "waddlebot.svcIngestHostApiTlsSecretName" . }}
{{- $cliName := printf "%s-ingest-executor-tls" $fullname }}
{{- $clientId := include "waddlebot.svcIngestHostApiClientIdentity" . }}
{{- $ns := .Values.namespace }}
{{- $tier := .Values.global.deploymentTier }}
{{- $srvExisting := lookup "v1" "Secret" $ns $srvName }}
{{- $cliExisting := lookup "v1" "Secret" $ns $cliName }}
{{- if and $srvExisting $cliExisting }}
# Kept -- both Secrets already exist.
{{- else if $ht.externalSecret }}
# Skipped -- an external controller owns {{ $srvName }} / {{ $cliName }}.
{{- else if not (or (eq $tier "alpha") (eq $tier "local")) }}
{{- fail (printf "svcIngest.connectorTools.hostApiTls: Secrets %q and %q not found in %q and global.deploymentTier=%q is outside alpha/local -- supply them (ca.crt/tls.crt/tls.key each; server cert SAN = the svc-ingest Service; client cert identity %q) or set hostApiTls.externalSecret=true" $srvName $cliName $ns $tier $clientId) }}
{{- else }}
{{- $ca := genCA (printf "%s-svc-ingest-host-api-ca" $fullname) 365 }}
{{- $svc := printf "%s-svc-ingest-rust" $fullname }}
{{- $srv := genSignedCert $svc nil (list $svc (printf "%s.%s.svc" $svc $ns) (printf "%s.%s.svc.cluster.local" $svc $ns)) 365 $ca }}
{{- $cli := genSignedCert $clientId nil (list $clientId) 365 $ca }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $srvName }}
  namespace: {{ $ns }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: svc-ingest-host-api-tls
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  ca.crt: {{ $ca.Cert | quote }}
  tls.crt: {{ $srv.Cert | quote }}
  tls.key: {{ $srv.Key | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $cliName }}
  namespace: {{ $ns }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingest-executor-tls
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  ca.crt: {{ $ca.Cert | quote }}
  tls.crt: {{ $cli.Cert | quote }}
  tls.key: {{ $cli.Key | quote }}
{{- end }}
{{- end }}

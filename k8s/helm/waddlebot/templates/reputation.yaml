# Issue #310 -- Reputation service (core/reputation_module): standalone internal
# HTTP + gRPC API computing/serving per-user FICO-style reputation scores. Consumed
# over HTTP via REPUTATION_API_URL (templates/configmap.yaml, already wired to
# http://waddlebot-reputation:8021 -- the exact default core/svc_process/config.py's
# REPUTATION_API_URL / services/reputation_gate_client.py already assumes). Mirrors
# svc-action.yaml/hub-api.yaml's top-level pipeline-service template shape (helpers,
# labels, securityContext, envFrom secret/configmap refs, probes, db-migrate
# initContainer) and core/core-data.yaml's gRPC server-role TLS wiring, since
# app.py calls flask_core.grpc_tls.bind_secure_port (a real secured gRPC server),
# not the client-only pattern router.yaml uses. Unlike svc-action's shared
# pythonBaseImage skeleton placeholder, reputation_module already has its own
# Dockerfile/image (core/reputation_module/Dockerfile) -- self-contained
# reputation.image.repository per environment.
{{- if .Values.reputation.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "waddlebot.fullname" . }}-reputation
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: reputation
spec:
  replicas: {{ .Values.reputation.replicas }}
  selector:
    matchLabels:
      {{- include "waddlebot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: reputation
  template:
    metadata:
      labels:
        {{- include "waddlebot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: reputation
    spec:
      serviceAccountName: {{ include "waddlebot.serviceAccountName" . }}
      {{- include "waddlebot.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
      # fix/chart-fresh-install-hooks (alpha 2026-10-01) -- waits on hub-api's own /ready.
      {{- include "waddlebot.waitForHubApiInitContainer" . | nindent 6 }}
      containers:
      - name: reputation
        image: "{{ .Values.reputation.image.repository }}:{{ .Values.reputation.image.tag | default .Values.global.imageTag | toString }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        ports:
        - name: http
          containerPort: {{ .Values.reputation.port }}
          protocol: TCP
        - name: grpc
          containerPort: {{ .Values.reputation.grpcPort }}
          protocol: TCP
        envFrom:
        - configMapRef:
            name: {{ include "waddlebot.fullname" . }}-config
        - secretRef:
            name: {{ include "waddlebot.fullname" . }}-secrets
        env:
        - name: MODULE_NAME
          value: "reputation_module"
        - name: MODULE_PORT
          value: {{ .Values.reputation.port | quote }}
        - name: GRPC_PORT
          value: {{ .Values.reputation.grpcPort | quote }}
        {{- if .Values.reputation.env.deploymentTier }}
        - name: DEPLOYMENT_TIER
          value: {{ .Values.reputation.env.deploymentTier | quote }}
        {{- end }}
        {{- if .Values.reputation.env.workers }}
        - name: WEB_CONCURRENCY
          value: {{ .Values.reputation.env.workers | quote }}
        {{- end }}
        {{- include "waddlebot.grpcTlsInsecureDevEnv" . | nindent 8 }}
        {{- if eq (include "waddlebot.grpcTlsMaterialAvailable" .) "true" }}
        {{- include "waddlebot.grpcTlsServerEnv" . | nindent 8 }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.reputation.resources | nindent 10 }}
        volumeMounts:
        - name: logs
          mountPath: /var/log/waddlebotlog
        - name: tmp
          mountPath: /tmp
        {{- if eq (include "waddlebot.grpcTlsMaterialAvailable" .) "true" }}
        {{- include "waddlebot.grpcTlsVolumeMount" . | nindent 8 }}
        {{- end }}
      volumes:
      - name: logs
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      {{- if eq (include "waddlebot.grpcTlsMaterialAvailable" .) "true" }}
      {{- include "waddlebot.grpcTlsVolume" . | nindent 6 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "waddlebot.fullname" . }}-reputation
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: reputation
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.reputation.port }}
    targetPort: http
    protocol: TCP
    name: http
  - port: {{ .Values.reputation.grpcPort }}
    targetPort: grpc
    protocol: TCP
    name: grpc
  selector:
    {{- include "waddlebot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: reputation
{{- end }}

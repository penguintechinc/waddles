# v3.0.x Task 0.5 — SKELETON. Pipeline stage 1/3: platform receivers + inbound webhooks.
# Folds collectors/{discord,googlechat,kick,mattermost,slack,teams,twitch,youtube-live}.yaml
# and pushing/{trigger-webhooks,trigger-streaming}.yaml — see PIPELINE_MAPPING.md for the
# full 31→7 mapping. Coexists with those 10 legacy Deployments; cutover is a later task.
#
# Module bundle gating: presence of MODULE_LOAD_* env vars signals which Module App bundles
# this stage should import. The actual conditional Python import behind these env vars is
# the remaining build — this skeleton only proves the values flag reaches the container.
#
# 8-container decision (folded in from a briefly-standalone svc-gateway 9th container):
# this same Deployment ALSO runs svc-ingest's socket-owning receivers (Discord gateway
# today, `core/svc_ingest/receivers/discord_gateway.py`) as `supervisor.ReceiverSupervisor`-
# supervised tasks alongside the poll-drain loop. No new env var wiring needed here --
# `DISCORD_BOT_TOKEN` reaches this container via the explicit `secretKeyRef`
# below (fix/helm-platform-credentials: `waddlebot-platform-credentials`
# Secret, not the shared `-secrets` Secret); the receiver/
# socket-lease tuning knobs (`RECEIVER_BASE_BACKOFF_S`/`SOCKET_LEASE_TTL_S`/etc.) fall back
# to `config.py`'s own sane defaults the same way `POLL_INTERVAL_S`/`BASE_BACKOFF_S` already
# do for the poll-drain loop -- not Helm-overridden today. Each replica races to CLAIM the
# `waddles:socket-owner:discord:_platform` Valkey lease (`socket_lease.py`) at startup, so
# `replicas: 2` below is already safe -- only one replica ever actually holds the socket.
# T10 (v3 demo): the `VALKEY_URL` gap flagged above is now closed -- see the `env:` block
# below, which wires `VALKEY_URL` (+ `RUNNER_TENANT_SLUG`/`HUB_API_URL`/`SECRET_KEY`/
# `WADDLES_AI_ENABLED`/Discord+Twitch receiver credentials/socket-lease tuning) explicitly,
# rather than relying on `Config.py`'s `redis://localhost:6379/0` fallback.
{{- if .Values.pipeline.svcIngest.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "waddlebot.fullname" . }}-svc-ingest
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: svc-ingest
spec:
  replicas: {{ .Values.pipeline.svcIngest.replicas }}
  selector:
    matchLabels:
      {{- include "waddlebot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: svc-ingest
  template:
    metadata:
      labels:
        {{- include "waddlebot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: svc-ingest
    spec:
      serviceAccountName: {{ include "waddlebot.serviceAccountName" . }}
      {{- include "waddlebot.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
      # fix/chart-fresh-install-hooks (alpha 2026-10-01) -- waits on hub-api's own /ready.
      {{- include "waddlebot.waitForHubApiInitContainer" . | nindent 6 }}
      containers:
      - name: svc-ingest
        # fix/alpha-helm-deploy -- core/svc_ingest/Dockerfile now exists; no longer the
        # shared pipeline.pythonBaseImage skeleton placeholder. Bare module name
        # "svc-ingest" is the alpha-local repo under global.imageRegistry -- see
        # scripts/deploy-alpha.sh.
        image: "{{ include "waddlebot.legacyModuleImage" (dict "root" . "module" "svc-ingest" "imageTag" .Values.global.imageTag) }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        ports:
        - name: http
          containerPort: {{ .Values.pipeline.svcIngest.port }}
          protocol: TCP
        envFrom:
        - configMapRef:
            name: {{ include "waddlebot.fullname" . }}-config
        - secretRef:
            name: {{ include "waddlebot.fullname" . }}-secrets
        env:
        # H-1/H-3 -- this workload's OWN least-privilege database identity (role waddles_svc_ingest;
        # config/postgres/service-roles.yaml). Overrides the envFrom block above; the database
        # owner/superuser credential is NOT in waddlebot-secrets any more.
{{- include "waddlebot.dbEnv" (dict "root" . "role" "waddles_svc_ingest") | nindent 8 }}
        - name: MODULE_NAME
          value: "svc-ingest"
        - name: PIPELINE_STAGE
          value: "ingest"
        - name: MODULE_PORT
          value: {{ .Values.pipeline.svcIngest.port | quote }}
        # T10 (v3 demo) -- Valkey pub/sub + stage LPUSH/RPOP transport (VALKEY_URL),
        # shared runner tenant scope (RUNNER_TENANT_SLUG; RUNNER_COMMUNITY_ID
        # deliberately UNSET -- tenant-wide per roadmap DATA-MODEL GAPS), hub-api
        # callback URL, and the JWT signing key shared with hub-api (same Secret key
        # SECRET_KEY as hub-api.yaml -- see templates/secrets.yaml).
        - name: VALKEY_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: VALKEY_URL
        - name: RUNNER_TENANT_SLUG
          value: {{ .Values.pipeline.runnerTenantSlug | quote }}
        - name: HUB_API_URL
          value: "http://{{ include "waddlebot.fullname" . }}-hub-api-v3:{{ .Values.pipeline.hubApi.port }}"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: SECRET_KEY
        # ONE-WAY AI kill-switch, same value hub-api.yaml renders as WADDLES_AI_ENABLED
        # (single toggle: pipeline.hubApi.aiEnabled) -- v3 demo runs the whole pipeline
        # with WaddleAI disabled, not just hub-api.
        - name: WADDLES_AI_ENABLED
          value: {{ .Values.pipeline.hubApi.aiEnabled | quote }}
        # Discord gateway + Twitch IRC receiver credentials (svc-ingest/receivers/
        # {discord_gateway,twitch_irc}.py). Empty/absent means the receiver stays idle
        # rather than crash-looping without a token. fix/helm-platform-credentials --
        # sourced from the operator-managed platform-credentials Secret, never the
        # chart-rendered `-secrets` Secret (see docs/PLATFORM_CREDENTIALS.md);
        # `optional: true` so an unconfigured platform doesn't block scheduling.
        - name: DISCORD_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.platformCredentialsSecretName" . }}
              key: DISCORD_BOT_TOKEN
              optional: true
        - name: TWITCH_OAUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.platformCredentialsSecretName" . }}
              key: TWITCH_OAUTH_TOKEN
              optional: true
        # RSI Spectrum session token (gh #101) -- operator-managed platform-credentials
        # Secret, never chart-rendered; optional so an unconfigured platform doesn't block.
        - name: SPECTRUM_RSI_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.platformCredentialsSecretName" . }}
              key: SPECTRUM_RSI_TOKEN
              optional: true
        - name: TWITCH_NICK
          value: {{ .Values.oauth.twitch.nick | default "" | quote }}
        - name: TWITCH_CHANNELS
          value: {{ .Values.oauth.twitch.channels | default "" | quote }}
        # Held-socket lease defaults (supervisor/socket_lease.py) -- see
        # pipeline.svcIngest.socketLease in values.yaml.
        - name: SOCKET_LEASE_TTL_SECONDS
          value: {{ .Values.pipeline.svcIngest.socketLease.ttlSeconds | quote }}
        - name: SOCKET_LEASE_RENEW_SECONDS
          value: {{ .Values.pipeline.svcIngest.socketLease.renewSeconds | quote }}
        - name: SOCKET_LEASE_KEY_PREFIX
          value: {{ .Values.pipeline.svcIngest.socketLease.keyPrefix | quote }}
        {{- if .Values.modules.bot.enabled }}
        - name: MODULE_LOAD_BOT
          value: "true"
        {{- end }}
        {{- if .Values.modules.social.enabled }}
        - name: MODULE_LOAD_SOCIAL
          value: "true"
        {{- end }}
        {{- if .Values.modules.marketing.enabled }}
        - name: MODULE_LOAD_MARKETING
          value: "true"
        {{- end }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.pipeline.svcIngest.resources | nindent 10 }}
        volumeMounts:
        - name: logs
          mountPath: /var/log/waddlebotlog
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: logs
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "waddlebot.fullname" . }}-svc-ingest
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: svc-ingest
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.pipeline.svcIngest.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "waddlebot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: svc-ingest
{{- end }}

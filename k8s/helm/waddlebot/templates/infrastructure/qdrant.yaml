{{- if .Values.infrastructure.qdrant.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.infrastructure.qdrant.persistence.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: vectordb
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  accessModes:
    - {{ .Values.infrastructure.qdrant.persistence.accessMode }}
  {{- if .Values.infrastructure.qdrant.persistence.storageClass }}
  storageClassName: {{ .Values.infrastructure.qdrant.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.infrastructure.qdrant.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: vectordb
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qdrant
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qdrant
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: vectordb
    spec:
      {{- include "waddlebot.terminationGracePeriod" $ | nindent 6 }}
      securityContext:
        {{- toYaml .Values.infrastructure.qdrant.podSecurityContext | nindent 8 }}
      containers:
      - name: qdrant
        image: {{ .Values.infrastructure.qdrant.image }}
        imagePullPolicy: IfNotPresent
        {{- include "waddlebot.preStop" $ | nindent 8 }}
        securityContext:
          {{- toYaml .Values.infrastructure.qdrant.securityContext | nindent 10 }}
        ports:
        - name: http
          containerPort: 6333
          protocol: TCP
        - name: grpc
          containerPort: 6334
          protocol: TCP
        volumeMounts:
        - name: qdrant-data
          mountPath: /qdrant/storage
        # readOnlyRootFilesystem: snapshots + scratch are the only other writable paths.
        - name: qdrant-snapshots
          mountPath: /qdrant/snapshots
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            memory: {{ .Values.infrastructure.qdrant.resources.requests.memory }}
            cpu: {{ .Values.infrastructure.qdrant.resources.requests.cpu }}
          limits:
            memory: {{ .Values.infrastructure.qdrant.resources.limits.memory }}
            cpu: {{ .Values.infrastructure.qdrant.resources.limits.cpu }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
      volumes:
      - name: qdrant-data
        persistentVolumeClaim:
          claimName: {{ .Values.infrastructure.qdrant.persistence.name }}
      - name: qdrant-snapshots
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.infrastructure.qdrant.service.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: vectordb
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: {{ .Values.infrastructure.qdrant.service.type }}
  ports:
  - port: {{ .Values.infrastructure.qdrant.service.port }}
    targetPort: http
    protocol: TCP
    name: http
    {{- if and (eq .Values.infrastructure.qdrant.service.type "NodePort") .Values.infrastructure.qdrant.service.nodePort }}
    nodePort: {{ .Values.infrastructure.qdrant.service.nodePort }}
    {{- end }}
  - port: 6334
    targetPort: grpc
    protocol: TCP
    name: grpc
  selector:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/instance: {{ .Release.Name }}
# R5 posture: ingress scoped to declared ports, default-deny egress (third-party image: no Tetragon allowlist).
{{- include "waddlebot.workloadPolicies" (dict "root" $ "component" "vectordb" "name" "qdrant" "selector" (dict "app.kubernetes.io/name" "qdrant" "app.kubernetes.io/instance" $.Release.Name) "ports" (list 6333 6334) "egress" "internal" "tetragon" false) }}
{{- end }}

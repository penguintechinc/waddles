{{- if .Values.infrastructure.redis.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: cache
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: cache
    spec:
      containers:
      - name: redis
        image: {{ .Values.infrastructure.redis.image }}
        imagePullPolicy: IfNotPresent
        command:
        - redis-server
        - --requirepass
        - $(REDIS_PASSWORD)
        - --appendonly
        - "yes"
        - --maxmemory
        - {{ .Values.infrastructure.redis.maxMemory | quote }}
        - --maxmemory-policy
        - {{ .Values.infrastructure.redis.maxMemoryPolicy | quote }}
        {{- if eq (include "waddlebot.valkeyTlsMaterialAvailable" .) "true" }}
        # fix/valkey-tls-alpha -- dual-listener: this TLS port runs ALONGSIDE the plaintext
        # `--port 6379` above (never replacing it), so hub-api/Python services already on
        # plaintext VALKEY_URL/REDIS_URL are undisturbed. tls-auth-clients no: server-auth
        # only (see global.valkeyTls's values.yaml comment) -- clients verify this cert via
        # the CA, requirepass above still gates every connection regardless of transport.
        - --tls-port
        - {{ .Values.infrastructure.redis.tls.port | quote }}
        - --tls-cert-file
        - /etc/valkey/tls/tls.crt
        - --tls-key-file
        - /etc/valkey/tls/tls.key
        - --tls-ca-cert-file
        - /etc/valkey/tls/ca.crt
        - --tls-auth-clients
        - "no"
        - --tls-protocols
        - "TLSv1.2 TLSv1.3"
        {{- end }}
        ports:
        - name: redis
          containerPort: 6379
          protocol: TCP
        {{- if eq (include "waddlebot.valkeyTlsMaterialAvailable" .) "true" }}
        - name: valkey-tls
          containerPort: {{ .Values.infrastructure.redis.tls.port }}
          protocol: TCP
        {{- end }}
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: waddlebot-secrets
              key: REDIS_PASSWORD
        volumeMounts:
        - name: redis-data
          mountPath: /data
        {{- if eq (include "waddlebot.valkeyTlsMaterialAvailable" .) "true" }}
        {{- include "waddlebot.valkeyTlsServerVolumeMount" . | nindent 8 }}
        {{- end }}
        resources:
          requests:
            memory: {{ .Values.infrastructure.redis.resources.requests.memory }}
            cpu: {{ .Values.infrastructure.redis.resources.requests.cpu }}
          limits:
            memory: {{ .Values.infrastructure.redis.resources.limits.memory }}
            cpu: {{ .Values.infrastructure.redis.resources.limits.cpu }}
        livenessProbe:
          exec:
            command:
            - redis-cli
            - -a
            - $(REDIS_PASSWORD)
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - redis-cli
            - -a
            - $(REDIS_PASSWORD)
            - ping
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: redis-data
        {{- if .Values.infrastructure.redis.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ .Values.infrastructure.redis.persistence.name }}
        {{- else }}
        emptyDir: {}
        {{- end }}
      {{- if eq (include "waddlebot.valkeyTlsMaterialAvailable" .) "true" }}
      {{- include "waddlebot.valkeyTlsServerVolume" . | nindent 6 }}
      {{- end }}
---
{{- if .Values.infrastructure.redis.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.infrastructure.redis.persistence.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: cache
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  accessModes:
    - {{ .Values.infrastructure.redis.persistence.accessMode }}
  {{- if .Values.infrastructure.redis.persistence.storageClass }}
  storageClassName: {{ .Values.infrastructure.redis.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.infrastructure.redis.persistence.size }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.infrastructure.redis.service.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: cache
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: {{ .Values.infrastructure.redis.service.type }}
  ports:
  - port: {{ .Values.infrastructure.redis.service.port }}
    targetPort: redis
    protocol: TCP
    name: redis
  {{- if eq (include "waddlebot.valkeyTlsMaterialAvailable" .) "true" }}
  - port: {{ .Values.infrastructure.redis.tls.port }}
    targetPort: valkey-tls
    protocol: TCP
    name: valkey-tls
  {{- end }}
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}

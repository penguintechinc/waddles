{{- if .Values.infrastructure.redis.enabled }}
{{- /* feature/transit-tls-core (F2) -- the cache Valkey is TLS-only. No plaintext listener exists any more, so a
render with TLS off would leave every client unable to connect (or tempt a plaintext fallback): fail loudly instead. */}}
{{- if not .Values.infrastructure.redis.tls.enabled }}
{{- fail "infrastructure.redis.enabled=true requires infrastructure.redis.tls.enabled=true: the cache Valkey serves TLS only (plaintext 6379 was removed, feature/transit-tls-core F2). Disable infrastructure.redis.enabled instead if you do not want an in-cluster cache." }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: cache
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        # fix/valkey-cert-rollout-and-migrate-wait -- rolls the Valkey server pod when the
        # desired valkey-tls identity/SANs change, even when the `-valkey-tls` Secret
        # object itself is KEPT by name (templates/infrastructure/valkey-tls-secret.yaml's
        # policy comment) -- without this the server kept serving its old leaf cert while
        # regenerated clients trusted the new CA, failing every connection with
        # `invalid peer certificate: BadSignature`.
        # regression: valkey cert regenerated but server pod not rolled; clients BadSignature (alpha 2026-10-02)
        {{- if eq (include "waddlebot.valkeyTlsMaterialAvailable" .) "true" }}
        checksum/valkey-tls: {{ include "waddlebot.valkeyTlsPodChecksum" . | quote }}
        {{- end }}
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: cache
    spec:
      {{- include "waddlebot.terminationGracePeriod" $ | nindent 6 }}
      securityContext:
        {{- toYaml .Values.infrastructure.redis.podSecurityContext | nindent 8 }}
      initContainers:
      # R5 rootless migration (kind upgrade-path regression). Before R5 this pod ran as ROOT
      # (`redis-server` is not the image entrypoint's `valkey-server`, so it never dropped privileges),
      # leaving root-owned AOF/RDB files in /data. The rootless pod (uid 999) cannot open them
      # for writing -- and volumes without fsGroup support (hostPath/local-path: kind, MicroK8s)
      # never chown them -- so valkey crash-looped with "Can't open the append-only file ...
      # Permission denied". The pod now persists under /data/valkey, created here as uid 999
      # (volume roots are 0777/fsGroup-writable), copying any pre-R5 state across once. cp reads
      # the old 0644 files fine; a failure is loud (set -e), never a silent data reset.
      - name: migrate-data-dir
        image: {{ .Values.infrastructure.redis.image }}
        imagePullPolicy: IfNotPresent
        securityContext:
          {{- toYaml .Values.infrastructure.redis.securityContext | nindent 10 }}
        command:
        - sh
        - -c
        - |
          set -eu
          if [ ! -d /data/valkey ]; then
            mkdir /data/valkey
            for f in appendonlydir dump.rdb; do
              if [ -e "/data/$f" ]; then cp -R "/data/$f" /data/valkey/; fi
            done
          fi
        volumeMounts:
        - name: redis-data
          mountPath: /data
        resources:
          requests:
            memory: 16Mi
            cpu: 10m
          limits:
            memory: 64Mi
            cpu: 100m
      containers:
      - name: redis
        image: {{ .Values.infrastructure.redis.image }}
        imagePullPolicy: IfNotPresent
        {{- include "waddlebot.preStop" $ | nindent 8 }}
        securityContext:
          {{- toYaml .Values.infrastructure.redis.securityContext | nindent 10 }}
        command:
        - redis-server
        - --dir
        - /data/valkey
        - --requirepass
        - $(REDIS_PASSWORD)
        - --appendonly
        - "yes"
        - --maxmemory
        - {{ .Values.infrastructure.redis.maxMemory | quote }}
        - --maxmemory-policy
        - {{ .Values.infrastructure.redis.maxMemoryPolicy | quote }}
        # feature/transit-tls-core (F2) -- TLS ONLY: `--port 0` disables the plaintext listener (same as valkey-kv /
        # valkey-durable), so neither the password nor any data crosses the wire in clear. tls-auth-clients no:
        # server-auth only (see global.valkeyTls's values.yaml comment) -- clients verify this cert via the CA,
        # requirepass above still gates every connection.
        # Negotiation bar: TLS 1.2 minimum / 1.3 preferred; AEAD-only AES-128-GCM / ChaCha20-Poly1305 (ECDSA and RSA
        # variants so a kept pre-ECDSA server cert keeps working until it is re-minted); session resumption on; clients
        # hold pooled keep-alive connections (redis-py ConnectionPool, redis-rs ConnectionManager).
        - --port
        - "0"
        - --tls-port
        - {{ .Values.infrastructure.redis.tls.port | quote }}
        - --tls-ciphers
        - "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305"
        - --tls-ciphersuites
        - "TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256"
        - --tls-session-caching
        - "yes"
        - --tls-session-cache-timeout
        - "300"
        - --tls-cert-file
        - /etc/valkey/tls/tls.crt
        - --tls-key-file
        - /etc/valkey/tls/tls.key
        - --tls-ca-cert-file
        - /etc/valkey/tls/ca.crt
        - --tls-auth-clients
        - "no"
        - --tls-protocols
        - "TLSv1.2 TLSv1.3"
        ports:
        - name: valkey-tls
          containerPort: {{ .Values.infrastructure.redis.tls.port }}
          protocol: TCP
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: waddlebot-secrets
              key: REDIS_PASSWORD
        volumeMounts:
        - name: redis-data
          mountPath: /data
        {{- include "waddlebot.valkeyTlsServerVolumeMount" . | nindent 8 }}
        resources:
          requests:
            memory: {{ .Values.infrastructure.redis.resources.requests.memory }}
            cpu: {{ .Values.infrastructure.redis.resources.requests.cpu }}
          limits:
            memory: {{ .Values.infrastructure.redis.resources.limits.memory }}
            cpu: {{ .Values.infrastructure.redis.resources.limits.cpu }}
        # Loopback probe over TLS (the plaintext listener is off); --insecure only skips chain/hostname verification of
        # the pod's own 127.0.0.1 connection, exactly as valkey-kv does.
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli --tls --insecure -p {{ .Values.infrastructure.redis.tls.port }} -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli --tls --insecure -p {{ .Values.infrastructure.redis.tls.port }} -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: redis-data
        {{- if .Values.infrastructure.redis.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ .Values.infrastructure.redis.persistence.name }}
        {{- else }}
        emptyDir: {}
        {{- end }}
      {{- include "waddlebot.valkeyTlsServerVolume" . | nindent 6 }}
---
{{- if .Values.infrastructure.redis.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.infrastructure.redis.persistence.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: cache
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  accessModes:
    - {{ .Values.infrastructure.redis.persistence.accessMode }}
  {{- if .Values.infrastructure.redis.persistence.storageClass }}
  storageClassName: {{ .Values.infrastructure.redis.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.infrastructure.redis.persistence.size }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.infrastructure.redis.service.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: cache
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: {{ .Values.infrastructure.redis.service.type }}
  ports:
  # TLS port only -- there is no plaintext Service port (feature/transit-tls-core F2).
  - port: {{ .Values.infrastructure.redis.tls.port }}
    targetPort: valkey-tls
    protocol: TCP
    name: valkey-tls
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: {{ .Release.Name }}
# R5 posture: ingress scoped to declared ports, default-deny egress (third-party image: no Tetragon allowlist).
{{- $redisPorts := list .Values.infrastructure.redis.tls.port }}
{{- include "waddlebot.workloadPolicies" (dict "root" $ "component" "cache" "name" "redis" "selector" (dict "app.kubernetes.io/name" "redis" "app.kubernetes.io/instance" $.Release.Name) "ports" $redisPorts "egress" "internal" "tetragon" false) }}
{{- end }}

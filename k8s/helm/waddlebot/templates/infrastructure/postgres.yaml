{{- if .Values.infrastructure.postgresql.enabled }}
{{- $pg := .Values.infrastructure.postgresql }}
{{- $rr := $pg.readReplicas }}
{{- $replicas := eq (include "waddlebot.postgres.replicasActive" .) "true" }}
{{- $rcount := int ($rr.count | default 0) }}
{{- $primaryHost := include "waddlebot.postgres.host" . }}
---
# The primary's data volume is a STANDALONE PVC mounted by claimName (NOT a volumeClaimTemplate) so the
# Deployment -> StatefulSet migration reuses the existing alpha volume untouched; `keep` stops helm from
# ever deleting it (uninstall, or a values change that drops this template).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.infrastructure.postgresql.persistence.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  accessModes:
    - {{ .Values.infrastructure.postgresql.persistence.accessMode }}
  {{- if .Values.infrastructure.postgresql.persistence.storageClass }}
  storageClassName: {{ .Values.infrastructure.postgresql.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.infrastructure.postgresql.persistence.size }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  init.sql: |
    -- Waddles PostgreSQL initialization script
    -- This script is executed when the database is first created

    -- Enable required extensions
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS "pg_trgm";

    -- Create schemas for module separation
    CREATE SCHEMA IF NOT EXISTS router;
    CREATE SCHEMA IF NOT EXISTS identity;
    CREATE SCHEMA IF NOT EXISTS community;

    -- Grant permissions
    GRANT ALL PRIVILEGES ON SCHEMA router TO {{ .Values.infrastructure.postgresql.username }};
    GRANT ALL PRIVILEGES ON SCHEMA identity TO {{ .Values.infrastructure.postgresql.username }};
    GRANT ALL PRIVILEGES ON SCHEMA community TO {{ .Values.infrastructure.postgresql.username }};

---
# feature/transit-tls-core (F1) -- TLS-only pg_hba. `local` (unix socket: pg_isready probes, the image's
# initdb temp server) stays trust like the stock image; every TCP connection MUST be hostssl + scram, and a
# non-TLS TCP attempt is explicitly rejected (loud, never silently downgraded). Replaces the image's stock
# `host all all all scram-sha-256` line, which would also accept plaintext. Applies to an EXISTING PVC too
# (hba_file is a server flag, not baked into PGDATA).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-hba
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  pg_hba.conf: |
    {{- include "waddlebot.postgres.hba" . | nindent 4 }}
{{- if $replicas }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-replication-scripts
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  bootstrap.sh: |
    {{- include "waddlebot.postgres.bootstrapScript" . | nindent 4 }}
  basebackup.sh: |
    {{- include "waddlebot.postgres.basebackupScript" . | nindent 4 }}
  ready.sh: |
    {{- include "waddlebot.postgres.readyScript" . | nindent 4 }}
{{- end }}
---
# STATEFUL EXCEPTION (approved): a database primary on a ReadWriteOnce volume. StatefulSet replicas:1 guarantees at-most-one
# pod per identity (the old Deployment's Recreate hack is no longer needed): the controller never starts postgres-0 while a
# previous postgres-0 still exists, so two postmasters can never share PGDATA. The pre-existing PVC is mounted by claimName
# (migration-safe, see the PVC above); the Deployment this replaces MUST be scaled to 0 before `helm upgrade` -- README
# "PostgreSQL topology" -> "Alpha upgrade".
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  serviceName: {{ $pg.service.name }}
  replicas: 1
  podManagementPolicy: OrderedReady
  # RollingUpdate on a 1-replica StatefulSet = delete the old pod, wait for it to be gone, then create the new one
  # (never a surge pod): same single-writer guarantee the former Deployment `Recreate` gave, but enforced by the
  # StatefulSet identity itself. Any pod-template change (e.g. the H-1/H-3 POSTGRES_PASSWORD Secret move) rolls it.
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/role: primary
  template:
    metadata:
      annotations:
        # Roll the server when the transit-TLS SAN identity changes (the Secret object itself is kept by name).
        checksum/transit-tls: {{ include "waddlebot.transitTls.podChecksum" . | quote }}
        checksum/hba: {{ include "waddlebot.postgres.hba" . | sha256sum | quote }}
        {{- if $replicas }}
        checksum/replication-scripts: {{ include "waddlebot.postgres.bootstrapScript" . | sha256sum | quote }}
        {{- end }}
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: database
        app.kubernetes.io/role: primary
    spec:
      {{- include "waddlebot.terminationGracePeriod" $ | nindent 6 }}
      securityContext:
        {{- toYaml .Values.infrastructure.postgresql.podSecurityContext | nindent 8 }}
      containers:
      - name: postgres
        image: {{ .Values.infrastructure.postgresql.image }}
        imagePullPolicy: IfNotPresent
        {{- include "waddlebot.preStop" $ | nindent 8 }}
        securityContext:
          {{- toYaml .Values.infrastructure.postgresql.securityContext | nindent 10 }}
        # feature/transit-tls-core (F1): TLS-only. TLS 1.2 minimum (1.3 negotiated when the client offers it), ECDSA
        # P-256 cert, P-256 key exchange, AEAD-only TLS 1.2 suites (AES-128-GCM / ChaCha20-Poly1305). Session tickets are
        # on by default in OpenSSL; clients pool connections (sqlx / SQLAlchemy / pydal pools), so no per-request handshake.
        args:
        - "-c"
        - "max_connections=300"
        - "-c"
        - "ssl=on"
        - "-c"
        - "ssl_cert_file=/etc/postgres-tls/tls.crt"
        - "-c"
        - "ssl_key_file=/etc/postgres-tls/tls.key"
        - "-c"
        - "ssl_min_protocol_version=TLSv1.2"
        - "-c"
        - "ssl_ecdh_curve=prime256v1"
        - "-c"
        - "ssl_ciphers=ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305"
        - "-c"
        - "hba_file=/etc/postgres-hba/pg_hba.conf"
        {{- if $replicas }}
        # Streaming replication: physical slots (one per replica) + bounded WAL retention.
        - "-c"
        - "wal_level=replica"
        - "-c"
        - "max_wal_senders={{ add (max $rcount 2) 8 }}"
        - "-c"
        - "max_replication_slots={{ add (max $rcount 2) 4 }}"
        - "-c"
        - "hot_standby=on"
        - "-c"
        - "wal_keep_size={{ $rr.walKeepSize }}"
        - "-c"
        - "max_slot_wal_keep_size={{ $rr.maxSlotWalKeepSize }}"
        {{- end }}
        ports:
        - name: postgres
          containerPort: 5432
          protocol: TCP
        env:
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: waddlebot-config
              key: POSTGRES_USER
        # H-1/H-3 -- the database OWNER credential is read from its own Secret
        # (<release>-db-admin / infrastructure.postgresql.admin.existingSecret), never
        # from waddlebot-secrets, which every other workload envFrom's.
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.db.adminSecretName" . }}
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: waddlebot-config
              key: POSTGRES_DB
        - name: POSTGRES_INITDB_ARGS
          valueFrom:
            configMapKeyRef:
              name: waddlebot-config
              key: POSTGRES_INITDB_ARGS
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        # readOnlyRootFilesystem: the unix-socket dir and /tmp must be writable.
        - name: pg-run
          mountPath: /var/run/postgresql
        - name: tmp
          mountPath: /tmp
        - name: transit-tls
          mountPath: /etc/postgres-tls
          readOnly: true
        - name: postgres-hba
          mountPath: /etc/postgres-hba
          readOnly: true
        resources:
          requests:
            memory: {{ .Values.infrastructure.postgresql.resources.requests.memory }}
            cpu: {{ .Values.infrastructure.postgresql.resources.requests.cpu }}
          limits:
            memory: {{ .Values.infrastructure.postgresql.resources.limits.memory }}
            cpu: {{ .Values.infrastructure.postgresql.resources.limits.cpu }}
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U {{ .Values.infrastructure.postgresql.username }}
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U {{ .Values.infrastructure.postgresql.username }}
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        # Crash recovery on a large existing volume can take minutes; liveness must not kill it mid-replay.
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U {{ .Values.infrastructure.postgresql.username }}
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 180
      {{- if $replicas }}
      - name: replication-bootstrap
        image: {{ $pg.image }}
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "/scripts/bootstrap.sh"]
        securityContext:
          {{- toYaml $pg.securityContext | nindent 10 }}
        env:
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: waddlebot-config
              key: POSTGRES_USER
        - name: REPL_USER
          value: {{ $rr.replicationUser | quote }}
        # Replication password: mounted into the postgres pods ONLY (never envFrom, never waddlebot-secrets).
        - name: REPL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.postgres.replicationSecretName" . }}
              key: PW_WADDLES_REPLICATOR
        - name: REPLICA_COUNT
          value: {{ $rcount | quote }}
        volumeMounts:
        - name: pg-run
          mountPath: /var/run/postgresql
        - name: tmp
          mountPath: /tmp
        - name: replication-scripts
          mountPath: /scripts
          readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
      {{- end }}
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: {{ .Values.infrastructure.postgresql.persistence.name }}
      - name: init-script
        configMap:
          name: postgres-init-script
      - name: pg-run
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      # Server leaf + key from the transit-tls Secret. 0440 root:fsGroup(999) satisfies Postgres' key-permission check
      # (root-owned, group-readable, no world access).
      - name: transit-tls
        secret:
          secretName: {{ include "waddlebot.transitTls.pgSecretName" . }}
          defaultMode: 0440
          items:
          {{- include "waddlebot.transitTls.pgItems" . | nindent 10 }}
      - name: postgres-hba
        configMap:
          name: postgres-hba
      {{- if $replicas }}
      - name: replication-scripts
        configMap:
          name: postgres-replication-scripts
          defaultMode: 0555
      {{- end }}
---
# Primary (read-write) Service: the existing name/host every writer already uses.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.infrastructure.postgresql.service.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: {{ .Values.infrastructure.postgresql.service.type }}
  ports:
  - port: {{ .Values.infrastructure.postgresql.service.port }}
    targetPort: postgres
    protocol: TCP
    name: postgres
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/role: primary
# R5 posture: ingress scoped to declared ports, default-deny egress (third-party image: no Tetragon allowlist).
# Same-namespace ingress also covers the replicas' replication connections to the primary.
{{- include "waddlebot.workloadPolicies" (dict "root" $ "component" "database" "name" "postgres" "selector" (dict "app.kubernetes.io/name" "postgres" "app.kubernetes.io/instance" $.Release.Name "app.kubernetes.io/role" "primary") "ports" (list 5432) "egress" "internal" "tetragon" false) }}
{{- if $replicas }}
{{- $rsize := $rr.persistence.size | default $pg.persistence.size }}
{{- $roName := include "waddlebot.postgres.roName" . }}
{{- $hlName := include "waddlebot.postgres.replicaHeadlessName" . }}
---
# Headless Service: stable per-pod DNS for the replica StatefulSet (also in the server cert SANs).
apiVersion: v1
kind: Service
metadata:
  name: {{ $hlName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database
    app.kubernetes.io/role: replica
spec:
  clusterIP: None
  ports:
  - port: {{ $pg.service.port }}
    targetPort: postgres
    protocol: TCP
    name: postgres
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/role: replica
---
# Read-only Service: load-balances across READY replicas only (readiness = streaming + lag within
# readReplicas.maxLagSeconds), so a lagging or broken replica is removed from rotation automatically.
apiVersion: v1
kind: Service
metadata:
  name: {{ $roName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database
    app.kubernetes.io/role: replica
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: ClusterIP
  ports:
  - port: {{ $pg.service.port }}
    targetPort: postgres
    protocol: TCP
    name: postgres
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/role: replica
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-replica
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database
    app.kubernetes.io/role: replica
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  serviceName: {{ $hlName }}
  replicas: {{ $rcount }}
  # Each replica owns its volume + replication slot (replica_<ordinal>); no ordering dependency between them.
  podManagementPolicy: Parallel
  # One replica at a time; the lag-aware readiness probe gates the next, so reads stay served during a roll.
  updateStrategy:
    type: RollingUpdate
  # Retain on delete/scale-down: a replica's PVC is a cheap-to-rebuild copy, but never deleted implicitly.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/role: replica
  template:
    metadata:
      annotations:
        checksum/transit-tls: {{ include "waddlebot.transitTls.podChecksum" . | quote }}
        checksum/hba: {{ include "waddlebot.postgres.hba" . | sha256sum | quote }}
        checksum/replication-scripts: {{ printf "%s%s" (include "waddlebot.postgres.basebackupScript" .) (include "waddlebot.postgres.readyScript" .) | sha256sum | quote }}
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: database
        app.kubernetes.io/role: replica
    spec:
      {{- include "waddlebot.terminationGracePeriod" $ | nindent 6 }}
      securityContext:
        {{- toYaml $pg.podSecurityContext | nindent 8 }}
      # Spread replicas (and the primary) across nodes when the cluster has them; preferred, so a
      # single-node cluster still schedules everything.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: postgres
                  app.kubernetes.io/instance: {{ .Release.Name }}
      initContainers:
      - name: basebackup
        image: {{ $pg.image }}
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "/scripts/basebackup.sh"]
        securityContext:
          {{- toYaml $pg.securityContext | nindent 10 }}
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: PRIMARY_HOST
          value: {{ $primaryHost | quote }}
        - name: PRIMARY_PORT
          value: {{ $pg.service.port | quote }}
        - name: REPL_USER
          value: {{ $rr.replicationUser | quote }}
        - name: REPL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.postgres.replicationSecretName" . }}
              key: PW_WADDLES_REPLICATOR
        # libpq reads the password from this 0600 passfile (emptyDir); primary_conninfo only carries its PATH.
        - name: PGPASSFILE
          value: /pgpass/pgpass
        - name: PGSSLMODE
          value: verify-full
        - name: PGSSLROOTCERT
          value: {{ include "waddlebot.transitTls.caPath" . | quote }}
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: tmp
          mountPath: /tmp
        - name: pgpass
          mountPath: /pgpass
        - name: transit-ca
          mountPath: /etc/waddles/transit-ca
          readOnly: true
        - name: replication-scripts
          mountPath: /scripts
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
      containers:
      - name: postgres
        image: {{ $pg.image }}
        imagePullPolicy: IfNotPresent
        {{- include "waddlebot.preStop" $ | nindent 8 }}
        securityContext:
          {{- toYaml $pg.securityContext | nindent 10 }}
        # Standby: standby.signal + primary_conninfo + primary_slot_name were written by pg_basebackup -R -S.
        # max_connections / max_wal_senders must be >= the primary's (hot-standby parameter rule): same values.
        command: ["postgres"]
        args:
        - "-c"
        - "max_connections=300"
        - "-c"
        - "ssl=on"
        - "-c"
        - "ssl_cert_file=/etc/postgres-tls/tls.crt"
        - "-c"
        - "ssl_key_file=/etc/postgres-tls/tls.key"
        - "-c"
        - "ssl_min_protocol_version=TLSv1.2"
        - "-c"
        - "ssl_ecdh_curve=prime256v1"
        - "-c"
        - "ssl_ciphers=ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305"
        - "-c"
        - "hba_file=/etc/postgres-hba/pg_hba.conf"
        - "-c"
        - "hot_standby=on"
        - "-c"
        - "max_wal_senders={{ add (max $rcount 2) 8 }}"
        - "-c"
        - "max_replication_slots={{ add (max $rcount 2) 4 }}"
        ports:
        - name: postgres
          containerPort: 5432
          protocol: TCP
        env:
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: waddlebot-config
              key: POSTGRES_USER
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        # The WAL receiver is libpq: verify-full against the transit CA (primary_conninfo may omit it).
        - name: PGSSLMODE
          value: verify-full
        - name: PGSSLROOTCERT
          value: {{ include "waddlebot.transitTls.caPath" . | quote }}
        - name: PGPASSFILE
          value: /pgpass/pgpass
        - name: MAX_LAG_SECONDS
          value: {{ $rr.maxLagSeconds | quote }}
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: pg-run
          mountPath: /var/run/postgresql
        - name: tmp
          mountPath: /tmp
        - name: transit-tls
          mountPath: /etc/postgres-tls
          readOnly: true
        - name: pgpass
          mountPath: /pgpass
          readOnly: true
        - name: transit-ca
          mountPath: /etc/waddles/transit-ca
          readOnly: true
        - name: postgres-hba
          mountPath: /etc/postgres-hba
          readOnly: true
        - name: replication-scripts
          mountPath: /scripts
          readOnly: true
        resources:
          {{- toYaml $rr.resources | nindent 10 }}
        startupProbe:
          exec:
            command: ["/bin/sh", "-c", "pg_isready -U {{ $pg.username }}"]
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 180
        livenessProbe:
          exec:
            command: ["/bin/sh", "-c", "pg_isready -U {{ $pg.username }}"]
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        # Ready only while in recovery + streaming + lag within maxLagSeconds (see ready.sh).
        readinessProbe:
          exec:
            command: ["/bin/sh", "/scripts/ready.sh"]
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: pg-run
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      # Passfile (0600, uid 999) for the WAL receiver; tmpfs so it never touches disk.
      - name: pgpass
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
      # Replica-only server key/cert (SANs: -ro + headless + replica pods). The primary key is never mounted here.
      - name: transit-tls
        secret:
          secretName: {{ include "waddlebot.transitTls.pgReplicaSecretName" . }}
          defaultMode: 0440
          items:
          {{- include "waddlebot.transitTls.pgReplicaItems" . | nindent 10 }}
      - name: transit-ca
        secret:
          secretName: {{ include "waddlebot.transitTls.caSecretName" . }}
          defaultMode: 0444
          items:
          - key: {{ include "waddlebot.transitTls.caKey" . }}
            path: ca.crt
      - name: postgres-hba
        configMap:
          name: postgres-hba
      - name: replication-scripts
        configMap:
          name: postgres-replication-scripts
          defaultMode: 0555
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: database
        app.kubernetes.io/role: replica
    spec:
      accessModes:
      - {{ $pg.persistence.accessMode }}
      {{- $sc := $rr.persistence.storageClass | default $pg.persistence.storageClass }}
      {{- if $sc }}
      storageClassName: {{ $sc }}
      {{- end }}
      resources:
        requests:
          storage: {{ $rsize }}
{{- if and (ge $rcount 2) .Values.podDisruptionBudget.enabled }}
---
# Keep one replica serving reads through node drains / voluntary evictions.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres-replica
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database
    app.kubernetes.io/role: replica
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/role: replica
{{- end }}
# Replicas: same posture as the primary (ingress scoped to 5432, default-deny egress to own namespace + DNS --
# replication egress to the primary is own-namespace; the primary's ingress policy admits it).
{{- include "waddlebot.workloadPolicies" (dict "root" $ "component" "database" "name" "postgres-replica" "selector" (dict "app.kubernetes.io/name" "postgres" "app.kubernetes.io/instance" $.Release.Name "app.kubernetes.io/role" "replica") "ports" (list 5432) "egress" "internal" "tetragon" false) }}
{{- end }}
{{- end }}

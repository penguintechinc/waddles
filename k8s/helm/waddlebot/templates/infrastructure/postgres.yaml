{{- if .Values.infrastructure.postgresql.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.infrastructure.postgresql.persistence.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  accessModes:
    - {{ .Values.infrastructure.postgresql.persistence.accessMode }}
  {{- if .Values.infrastructure.postgresql.persistence.storageClass }}
  storageClassName: {{ .Values.infrastructure.postgresql.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.infrastructure.postgresql.persistence.size }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  init.sql: |
    -- Waddles PostgreSQL initialization script
    -- This script is executed when the database is first created

    -- Enable required extensions
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS "pg_trgm";

    -- Create schemas for module separation
    CREATE SCHEMA IF NOT EXISTS router;
    CREATE SCHEMA IF NOT EXISTS identity;
    CREATE SCHEMA IF NOT EXISTS community;

    -- Grant permissions
    GRANT ALL PRIVILEGES ON SCHEMA router TO {{ .Values.infrastructure.postgresql.username }};
    GRANT ALL PRIVILEGES ON SCHEMA identity TO {{ .Values.infrastructure.postgresql.username }};
    GRANT ALL PRIVILEGES ON SCHEMA community TO {{ .Values.infrastructure.postgresql.username }};

---
# feature/transit-tls-core (F1) -- TLS-only pg_hba. `local` (unix socket: pg_isready probes, the image's
# initdb temp server) stays trust like the stock image; every TCP connection MUST be hostssl + scram, and a
# non-TLS TCP attempt is explicitly rejected (loud, never silently downgraded). Replaces the image's stock
# `host all all all scram-sha-256` line, which would also accept plaintext. Applies to an EXISTING PVC too
# (hba_file is a server flag, not baked into PGDATA).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-hba
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  pg_hba.conf: |
    local   all   all                  trust
    hostssl all   all   0.0.0.0/0      scram-sha-256
    hostssl all   all   ::/0           scram-sha-256
    hostnossl all all   0.0.0.0/0      reject
    hostnossl all all   ::/0           reject
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  # Recreate, never RollingUpdate: one single-writer Postgres on one ReadWriteOnce PVC. A
  # RollingUpdate surge starts the replacement pod while the old one still has PGDATA open --
  # two postmasters on one data directory (each is PID 1 in its own container, so
  # postmaster.pid never detects the other), then the old pod is killed mid-write and the
  # survivor PANICs "could not locate a valid checkpoint record" (kind upgrade-path, run
  # 38098458861). Any pod-template change (this chart's H-1/H-3 move of POSTGRES_PASSWORD to
  # the <release>-db-admin Secret is one) rolls Postgres on `helm upgrade`, so this is a
  # live-upgrade data-integrity requirement. Same strategy redis/seaweedfs/qdrant/ollama use.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        # Roll the server when the transit-TLS SAN identity changes (the Secret object itself is kept by name).
        checksum/transit-tls: {{ include "waddlebot.transitTls.podChecksum" . | quote }}
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: database
    spec:
      {{- include "waddlebot.terminationGracePeriod" $ | nindent 6 }}
      securityContext:
        {{- toYaml .Values.infrastructure.postgresql.podSecurityContext | nindent 8 }}
      containers:
      - name: postgres
        image: {{ .Values.infrastructure.postgresql.image }}
        imagePullPolicy: IfNotPresent
        {{- include "waddlebot.preStop" $ | nindent 8 }}
        securityContext:
          {{- toYaml .Values.infrastructure.postgresql.securityContext | nindent 10 }}
        # feature/transit-tls-core (F1): TLS-only. TLS 1.2 minimum (1.3 negotiated when the client offers it), ECDSA
        # P-256 cert, P-256 key exchange, AEAD-only TLS 1.2 suites (AES-128-GCM / ChaCha20-Poly1305). Session tickets are
        # on by default in OpenSSL; clients pool connections (sqlx / SQLAlchemy / pydal pools), so no per-request handshake.
        args:
        - "-c"
        - "max_connections=300"
        - "-c"
        - "ssl=on"
        - "-c"
        - "ssl_cert_file=/etc/postgres-tls/tls.crt"
        - "-c"
        - "ssl_key_file=/etc/postgres-tls/tls.key"
        - "-c"
        - "ssl_min_protocol_version=TLSv1.2"
        - "-c"
        - "ssl_ecdh_curve=prime256v1"
        - "-c"
        - "ssl_ciphers=ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305"
        - "-c"
        - "hba_file=/etc/postgres-hba/pg_hba.conf"
        ports:
        - name: postgres
          containerPort: 5432
          protocol: TCP
        env:
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: waddlebot-config
              key: POSTGRES_USER
        # H-1/H-3 -- the database OWNER credential is read from its own Secret
        # (<release>-db-admin / infrastructure.postgresql.admin.existingSecret), never
        # from waddlebot-secrets, which every other workload envFrom's.
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.db.adminSecretName" . }}
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: waddlebot-config
              key: POSTGRES_DB
        - name: POSTGRES_INITDB_ARGS
          valueFrom:
            configMapKeyRef:
              name: waddlebot-config
              key: POSTGRES_INITDB_ARGS
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        # readOnlyRootFilesystem: the unix-socket dir and /tmp must be writable.
        - name: pg-run
          mountPath: /var/run/postgresql
        - name: tmp
          mountPath: /tmp
        - name: transit-tls
          mountPath: /etc/postgres-tls
          readOnly: true
        - name: postgres-hba
          mountPath: /etc/postgres-hba
          readOnly: true
        resources:
          requests:
            memory: {{ .Values.infrastructure.postgresql.resources.requests.memory }}
            cpu: {{ .Values.infrastructure.postgresql.resources.requests.cpu }}
          limits:
            memory: {{ .Values.infrastructure.postgresql.resources.limits.memory }}
            cpu: {{ .Values.infrastructure.postgresql.resources.limits.cpu }}
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U {{ .Values.infrastructure.postgresql.username }}
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U {{ .Values.infrastructure.postgresql.username }}
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: {{ .Values.infrastructure.postgresql.persistence.name }}
      - name: init-script
        configMap:
          name: postgres-init-script
      - name: pg-run
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      # Server leaf + key from the transit-tls Secret. 0440 root:fsGroup(999) satisfies Postgres' key-permission check
      # (root-owned, group-readable, no world access).
      - name: transit-tls
        secret:
          secretName: {{ include "waddlebot.transitTls.secretName" . }}
          defaultMode: 0440
          items:
          - key: postgres.crt
            path: tls.crt
          - key: postgres.key
            path: tls.key
      - name: postgres-hba
        configMap:
          name: postgres-hba
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.infrastructure.postgresql.service.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: {{ .Values.infrastructure.postgresql.service.type }}
  ports:
  - port: {{ .Values.infrastructure.postgresql.service.port }}
    targetPort: postgres
    protocol: TCP
    name: postgres
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
# R5 posture: ingress scoped to declared ports, default-deny egress (third-party image: no Tetragon allowlist).
{{- include "waddlebot.workloadPolicies" (dict "root" $ "component" "database" "name" "postgres" "selector" (dict "app.kubernetes.io/name" "postgres" "app.kubernetes.io/instance" $.Release.Name) "ports" (list 5432) "egress" "internal" "tetragon" false) }}
{{- end }}

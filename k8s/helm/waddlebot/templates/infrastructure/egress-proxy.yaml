# Bundle egress gateway — feature/bundle-egress-gateway.
#
# Design choice (see PR description for the full write-up): a dedicated,
# rootless egress-proxy Deployment (Option A), not a bare Cilium egress
# gateway / FQDN policy (Option B). The in-process guard
# (core/bundle_host_http, feature/svc-process-http-capability) forwards
# validated net.http requests here with a signed per-tenant/app allowlist
# header (net.http.fqdn / .public-ip / .private-ip grants); the proxy
# verifies that signature and re-checks the destination against it before
# dialing upstream. Cilium FQDN/egress-gateway policies alone can't express
# "this specific tenant/app may reach this specific destination" — they're
# cluster-wide L3/L4/DNS policy, not per-request L7 identity — so they stay
# as defense-in-depth (templates/network-policies-egress.yaml) rather than
# the primary enforcement point.
#
# core/egress_proxy (feature/egress-proxy-service) now has a real
# Dockerfile.rust + CI build target (`docker build -f
# egress_proxy/Dockerfile.rust`, context = core/). Image composed via the
# same `waddlebot.legacyModuleImage` helper every other Rust data-plane
# service uses (svc-action-rust/svc-process-rust) -- `egressProxy.image`
# below is just the bare repo name; CI/build fills `global.imageTag` (or
# `egressProxy.imageTag` for a component-specific override) with the
# actual built digest/tag at deploy time, same as those services.
#
# fix/alpha-clean-deploy -- removed the ALLOWLIST_SIGNING_KEY_PATH env var and
# its "signing-key" Secret volume (formerly egressProxy.allowlistSigning,
# mounting a Secret this proxy never actually reads): core/egress_proxy has
# zero references to that env var anywhere in its source. The real assertion
# verification path is the shared per-service JWKS trust bundle
# (MACHINE_JWT_JWKS_URL below), same as machine-JWT auth. Mounting a private
# signing key into this pod would be wrong regardless -- if/when the egress
# assertion Ed25519 keypair (core/egress_assertion, PR #468) is wired up, the
# private half belongs to the SIGNER (bundle_host_http in svc-process/
# svc-action), never this verifier. That wiring is separate follow-up work,
# not done here; this alpha rev-28 fix only removes the dead reference that
# was leaving this Deployment stuck ContainerCreating on a Secret nothing
# ever provisioned.
{{- if and (ne .Values.egressProxy.environment "alpha") (ne .Values.egressProxy.environment "local") (not .Values.egressProxy.enabled) }}
{{- fail "egressProxy.enabled must be true in beta/gamma/production — bundle net.http and connector-platform traffic has no host-level enforcement without it (see feature/bundle-egress-gateway)." }}
{{- end }}
{{- if .Values.egressProxy.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "waddlebot.fullname" . }}-egress-proxy
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: egress-proxy
spec:
  replicas: {{ .Values.egressProxy.replicas }}
  selector:
    matchLabels:
      {{- include "waddlebot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: egress-proxy
  template:
    metadata:
      labels:
        {{- include "waddlebot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: egress-proxy
    spec:
      serviceAccountName: {{ include "waddlebot.serviceAccountName" . }}
      {{- include "waddlebot.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: egress-proxy
        image: "{{ include "waddlebot.legacyModuleImage" (dict "root" . "module" .Values.egressProxy.image "imageTag" .Values.egressProxy.imageTag) }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        ports:
        - name: proxy
          containerPort: {{ .Values.egressProxy.port }}
          protocol: TCP
        - name: metrics
          containerPort: {{ .Values.egressProxy.metricsPort }}
          protocol: TCP
        env:
        - name: PROXY_LISTEN_PORT
          value: {{ .Values.egressProxy.port | quote }}
        - name: ALLOWED_PORTS
          value: {{ .Values.egressProxy.allowedPorts | join "," | quote }}
        - name: DENY_CIDRS
          value: {{ .Values.egressPolicy.denyCidrs | join "," | quote }}
        # fix/alpha-clean-deploy -- found while verifying this Deployment reaches
        # Ready on kind: piping to quote inside a ">-" folded block scalar
        # embeds literal double-quote characters INTO the value itself (the
        # block scalar's own indentation/folding is what YAML uses to delimit
        # the string here, not a wrapping quote pair like a single-line
        # "value: <templated>" field would get) -- egress_proxy's CIDR parser
        # then rejected the leading quote character as invalid and
        # crash-looped on every startup. No quoting needed: this is a plain
        # comma/dot/slash string, none of which require YAML quoting.
        - name: DENY_CLUSTER_CIDRS
          value: >-
            {{ printf "%s,%s,%s"
                 .Values.egressPolicy.clusterCidrs.podCidr
                 .Values.egressPolicy.clusterCidrs.serviceCidr
                 .Values.egressPolicy.clusterCidrs.nodeCidr }}
        # Machine-JWT verification (core/service_auth, feature/eddsa-machine-jwt)
        # -- authenticates svc-ingest/svc-process/svc-action before the
        # allowlist assertion or destination is even parsed. Shares hub-api's
        # existing `serviceJwt.audience`/JWKS endpoint rather than minting a
        # new per-consumer audience; callers additionally need the
        # `egress:connect` scope granted in `serviceJwt.identities` (see that
        # block's own comment).
        - name: MACHINE_JWT_JWKS_URL
          value: "http://{{ include "waddlebot.fullname" . }}-hub-api-v3:{{ .Values.pipeline.hubApi.port }}/internal/service-jwks.json"
        - name: MACHINE_JWT_AUDIENCE
          value: {{ .Values.serviceJwt.audience | quote }}
        - name: MACHINE_JWT_TRUSTED_ISSUERS
          value: "hub-api"
        - name: MACHINE_JWT_REQUIRED_SCOPE
          value: {{ .Values.egressProxy.machineJwtRequiredScope | quote }}
        - name: ALLOWED_CALLER_SERVICES
          value: {{ .Values.egressProxy.allowedCallerServices | join "," | quote }}
        - name: PER_TENANT_MAX_CONNECTIONS
          value: {{ .Values.egressProxy.perTenantMaxConnections | quote }}
        - name: PER_TENANT_BANDWIDTH_BYTES_PER_SEC
          value: {{ .Values.egressProxy.perTenantBandwidthBytesPerSec | quote }}
        - name: CONNECT_TIMEOUT_SECONDS
          value: {{ .Values.egressProxy.connectTimeoutSeconds | quote }}
        - name: ASSERTION_MAX_TTL_SECONDS
          value: {{ .Values.egressProxy.assertionMaxTtlSeconds | quote }}
        livenessProbe:
          httpGet:
            path: /health
            port: metrics
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.egressProxy.resources | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "waddlebot.fullname" . }}-egress-proxy
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: egress-proxy
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.egressProxy.port }}
    targetPort: proxy
    protocol: TCP
    name: proxy
  - port: {{ .Values.egressProxy.metricsPort }}
    targetPort: metrics
    protocol: TCP
    name: metrics
  selector:
    {{- include "waddlebot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: egress-proxy
{{- end }}

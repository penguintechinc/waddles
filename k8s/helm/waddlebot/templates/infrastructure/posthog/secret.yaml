{{- if .Values.posthog.enabled }}
{{- if .Values.posthog.existingSecret }}
# existingSecret set -- operator/ExternalSecret-managed, this chart renders nothing.
{{- else if .Values.posthog.secrets.create }}
{{- if not .Values.posthog.secrets.SECRET_KEY }}{{- fail "posthog.secrets.create=true requires posthog.secrets.SECRET_KEY" }}{{- end }}
{{- if not .Values.posthog.secrets.POSTGRES_PASSWORD }}{{- fail "posthog.secrets.create=true requires posthog.secrets.POSTGRES_PASSWORD" }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: posthog-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.posthog.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.posthog.secrets.SECRET_KEY | quote }}
  POSTGRES_PASSWORD: {{ .Values.posthog.secrets.POSTGRES_PASSWORD | quote }}
  CLICKHOUSE_PASSWORD: {{ .Values.posthog.secrets.CLICKHOUSE_PASSWORD | default "" | quote }}
{{- else }}
{{- /* feature/alpha-localized-posthog -- same lookup-then-generate-or-fail KEEP policy as
templates/auto-provisioned-secrets.yaml, applied to PostHog's own dedicated Secret so
alpha needs neither a literal committed in values-alpha.yaml nor a manual --set: the
value is generated once (alpha/local tier only) and then kept forever via
helm.sh/resource-policy: keep + the `lookup` KEEP branch on every later `helm upgrade`.
Beta/gamma/production are untouched -- they still must set posthog.existingSecret
(the first `{{- if }}` branch above) or this `fail`s, same as before this change. */}}
{{- $tier := .Values.global.deploymentTier }}
{{- $canGenerate := or (eq $tier "alpha") (eq $tier "local") }}
{{- if not $canGenerate }}
{{- fail "posthog.enabled=true requires posthog.existingSecret (a pre-created Secret with keys SECRET_KEY, POSTGRES_PASSWORD, CLICKHOUSE_PASSWORD) outside alpha/local -- auto-generation is alpha/local only. Pre-create the Secret or point an ExternalSecret/SealedSecret at it." }}
{{- end }}
{{- $existing := lookup "v1" "Secret" .Values.namespace "posthog-secrets" }}
{{- $hasKey := include "waddlebot.secretKeyNonEmpty" (dict "existing" $existing "key" "SECRET_KEY") }}
apiVersion: v1
kind: Secret
metadata:
  name: posthog-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.posthog.labels" . | nindent 4 }}
  annotations:
    # Survives `helm uninstall`; never regenerated/rotated by a future `helm
    # upgrade` once it exists -- the `lookup` KEEP branch wins from then on.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  SECRET_KEY: {{ if $hasKey }}{{ index $existing.data "SECRET_KEY" | b64dec | quote }}{{ else }}{{ randAlphaNum 40 | quote }}{{ end }}
  POSTGRES_PASSWORD: {{ if (include "waddlebot.secretKeyNonEmpty" (dict "existing" $existing "key" "POSTGRES_PASSWORD")) }}{{ index $existing.data "POSTGRES_PASSWORD" | b64dec | quote }}{{ else }}{{ randAlphaNum 32 | quote }}{{ end }}
  CLICKHOUSE_PASSWORD: {{ if (include "waddlebot.secretKeyNonEmpty" (dict "existing" $existing "key" "CLICKHOUSE_PASSWORD")) }}{{ index $existing.data "CLICKHOUSE_PASSWORD" | b64dec | quote }}{{ else }}{{ randAlphaNum 32 | quote }}{{ end }}
{{- end }}
{{- end }}

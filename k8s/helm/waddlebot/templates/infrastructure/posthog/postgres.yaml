{{- if .Values.posthog.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: posthog-postgres
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.posthog.labels" . | nindent 4 }}
    app.kubernetes.io/name: posthog-postgres
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: posthog-postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: posthog-postgres
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.posthog.labels" . | nindent 4 }}
    app.kubernetes.io/name: posthog-postgres
    app.kubernetes.io/component: database
spec:
  serviceName: posthog-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: posthog-postgres
  template:
    metadata:
      labels:
        {{- include "waddlebot.posthog.labels" . | nindent 8 }}
        app.kubernetes.io/name: posthog-postgres
        app.kubernetes.io/component: database
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: "{{ .Values.posthog.postgres.image }}@{{ .Values.posthog.postgres.digest }}"
          imagePullPolicy: {{ .Values.posthog.image.pullPolicy }}
          # Writable rootfs required: writes PGDATA + runtime sockets/locks
          # outside the mounted data volume. Still non-root, no added caps.
          securityContext:
            {{- toYaml .Values.posthog.securityContext.postgres | nindent 12 }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.posthog.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.posthog.postgres.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "waddlebot.posthog.secretName" . }}
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            {{- toYaml .Values.posthog.postgres.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.posthog.postgres.username | quote }}, "-d", {{ .Values.posthog.postgres.database | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.posthog.postgres.username | quote }}, "-d", {{ .Values.posthog.postgres.database | quote }}]
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.posthog.postgres.storage }}
# R5 posture: ingress scoped to declared ports, default-deny egress (third-party image: no Tetragon allowlist).
{{- include "waddlebot.workloadPolicies" (dict "root" $ "component" "database" "name" "posthog-postgres" "selector" (dict "app.kubernetes.io/name" "posthog-postgres") "ports" (list 5432) "egress" "internal" "tetragon" false) }}
{{- end }}

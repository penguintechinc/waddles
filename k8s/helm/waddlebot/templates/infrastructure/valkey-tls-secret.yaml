# fix/valkey-tls-alpha (original) + fix/helm-alpha-self-provisioning (lookup/generate) --
# TLS Secret for the Valkey (infra-redis) cache/streams listener. Mirrors
# templates/host-api-tls-secret.yaml's static-Secret shape for key names (ca.crt/
# tls.crt/tls.key -- `valkey-ca.crt` additionally duplicates `ca.crt` under the exact
# filename penguin_spine::SpineConfig's VALKEY_CA_FILE default expects,
# /etc/waddles/ca/valkey-ca.crt, so client pods (templates/_helpers.tpl
# waddlebot.valkeyTlsCaVolume) need no VALKEY_CA_FILE env override).
#
# Same KEEP-vs-GENERATE-vs-REQUIRE policy as templates/auto-provisioned-secrets.yaml:
#   1. Secret already exists -> KEPT untouched, never re-templated (avoids fighting an
#      ExternalSecret/SealedSecret/prior revision for ownership of the same object).
#   2. global.valkeyTls.ca.crt/tls.crt/tls.key all explicitly supplied via values
#      (--set-file, out-of-git override, or an ExternalSecret writing into .Values via
#      a values-producing controller) -> rendered from those, annotated keep so a
#      future upgrade without --set-file re-supplied still takes the lookup branch.
#   3. global.valkeyTls.externalSecret: true -> skipped; an out-of-band controller owns
#      this exact Secret name and will populate it before infra-redis/its clients start.
#   4. global.deploymentTier is alpha/local -> generated with Helm's own genCA/
#      genSignedCert builtins (RSA -- Sprig has no ECDSA cert generator; rustls's `ring`
#      provider used by core/svc_ingest, core/svc_process, core/svc_action verifies RSA
#      server certs without issue, confirmed against their rustls-pki-types usage), SANs
#      covering the infra-redis Service's short/namespaced/svc.cluster.local DNS forms,
#      365-day validity (alpha/local only -- short-lived is fine, chart auto-renews
#      nothing today and re-provisioning here is a non-event).
#   5. Otherwise (beta/gamma/production, no material, not delegated) -> render fails
#      closed with an actionable message. NEVER a literal cert/key committed to git in
#      ANY environment.
{{- if .Values.infrastructure.redis.tls.enabled }}
{{- $tier := .Values.global.deploymentTier }}
{{- $canGenerate := or (eq $tier "alpha") (eq $tier "local") }}
{{- $secretName := printf "%s-valkey-tls" (include "waddlebot.fullname" .) }}
{{- $vt := .Values.global.valkeyTls }}
{{- $existing := lookup "v1" "Secret" .Values.namespace $secretName }}
{{- if $existing }}
# Kept as-is -- {{ $secretName }} already exists (helm.sh/resource-policy: keep means it
# also survived any prior `helm uninstall`). Not re-templated on purpose, see policy
# comment above.
{{- else if and $vt.ca.crt $vt.tls.crt $vt.tls.key }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey-tls
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  ca.crt: {{ $vt.ca.crt | quote }}
  valkey-ca.crt: {{ $vt.ca.crt | quote }}
  tls.crt: {{ $vt.tls.crt | quote }}
  tls.key: {{ $vt.tls.key | quote }}
{{- else if $vt.externalSecret }}
# Skipped -- {{ $secretName }} does not exist yet, but global.valkeyTls.externalSecret is
# true, meaning an ExternalSecret/SealedSecret controller owns and will populate it.
{{- else if not $canGenerate }}
{{- fail (printf "global.valkeyTls: Secret %q not found in namespace %q, no ca.crt/tls.crt/tls.key supplied via values, and global.deploymentTier=%q is outside alpha/local -- auto-generation is alpha/local only. Either supply real material (helm upgrade --set-file global.valkeyTls.ca.crt=... --set-file global.valkeyTls.tls.crt=... --set-file global.valkeyTls.tls.key=...), point an ExternalSecret/SealedSecret at this Secret name and set global.valkeyTls.externalSecret=true, or fix global.deploymentTier if this really is alpha/local." $secretName .Values.namespace $tier) }}
{{- else }}
{{- $svcName := .Values.infrastructure.redis.service.name }}
{{- $ns := .Values.namespace }}
{{- $ca := genCA (printf "%s-valkey-ca" (include "waddlebot.fullname" .)) 365 }}
{{- $dnsNames := list $svcName (printf "%s.%s" $svcName $ns) (printf "%s.%s.svc" $svcName $ns) (printf "%s.%s.svc.cluster.local" $svcName $ns) }}
{{- $cert := genSignedCert $svcName nil $dnsNames 365 $ca }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey-tls
  annotations:
    # Survives `helm uninstall` and is never re-generated/rotated by a future
    # `helm upgrade` -- the lookup branch above always wins once this exists.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  ca.crt: {{ $ca.Cert | quote }}
  valkey-ca.crt: {{ $ca.Cert | quote }}
  tls.crt: {{ $cert.Cert | quote }}
  tls.key: {{ $cert.Key | quote }}
{{- end }}
{{- end }}

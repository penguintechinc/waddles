# fix/valkey-tls-alpha -- Static TLS Secret for the Valkey (infra-redis) cache/streams
# listener. Mirrors templates/host-api-tls-secret.yaml's static-Secret shape exactly, but
# for a SEPARATE identity (Valkey server auth, not the bundle-executor<->stage host-API
# mTLS wire). `valkey-ca.crt` duplicates `ca.crt`'s content under the exact filename
# penguin_spine::SpineConfig's VALKEY_CA_FILE default expects
# (/etc/waddles/ca/valkey-ca.crt) so client pods (templates/_helpers.tpl
# waddlebot.valkeyTlsCaVolume) need no VALKEY_CA_FILE env override.
#
# NEVER a literal cert/key in git in ANY environment, alpha included -- populate via
# `helm upgrade --set-file global.valkeyTls.ca.crt=... --set-file
# global.valkeyTls.tls.crt=... --set-file global.valkeyTls.tls.key=...` (or an
# out-of-git values override / ExternalSecrets/SealedSecrets) before setting
# infrastructure.redis.tls.enabled=true.
{{- if .Values.infrastructure.redis.tls.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "waddlebot.fullname" . }}-valkey-tls
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey-tls
type: Opaque
stringData:
  ca.crt: {{ .Values.global.valkeyTls.ca.crt | quote }}
  valkey-ca.crt: {{ .Values.global.valkeyTls.ca.crt | quote }}
  tls.crt: {{ .Values.global.valkeyTls.tls.crt | quote }}
  tls.key: {{ .Values.global.valkeyTls.tls.key | quote }}
{{- end }}

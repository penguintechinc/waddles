{{- if .Values.infrastructure.seaweedfs.enabled }}
{{- include "waddlebot.bundleStorage.validate" . }}
{{- if .Values.infrastructure.seaweedfs.encryption.enabled }}
{{- if not .Values.infrastructure.seaweedfs.encryption.secretName }}
{{- if ne .Values.global.deploymentTier "alpha" }}
{{- fail "infrastructure.seaweedfs.enabled=true requires infrastructure.seaweedfs.encryption.secretName outside alpha (beta/gamma/production) -- at-rest encryption is mandatory (security.md Encryption), never disable infrastructure.seaweedfs.encryption.enabled to work around this. Pre-create the Secret via `make generate-seaweedfs-sse-key` / scripts/generate-seaweedfs-sse-key.sh (default name seaweedfs-sse-kek, key WEED_S3_SSE_KEK), then set infrastructure.seaweedfs.encryption.secretName via --set or an out-of-git values override / ExternalSecret. Only alpha may leave this unset (values-alpha.yaml documents its own default)." }}
{{- end }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.infrastructure.seaweedfs.persistence.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: storage
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  accessModes:
    - {{ .Values.infrastructure.seaweedfs.persistence.accessMode }}
  {{- if .Values.infrastructure.seaweedfs.persistence.storageClass }}
  storageClassName: {{ .Values.infrastructure.seaweedfs.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.infrastructure.seaweedfs.persistence.size }}
---
# SeaweedFS bucket initialization Job (creates bucketName + recordings if they
# don't exist, then sets default SSE-S3 bucket encryption) -- replaces the
# former MinIO `mc`-based minio-init Job (chrislusf/seaweedfs is Apache-2.0;
# the SeaweedFS S3 gateway is AWS-S3-API-compatible so the stock aws-cli works
# unmodified, no vendor-specific client needed).
#
# post-install/post-upgrade hook + before-hook-creation delete policy for the
# same reason as before: Job.spec.template is immutable in-place, so a plain
# Job would break every `helm upgrade` once it exists from an earlier release.
# post- (not pre-) hook because this Job talks to the SeaweedFS Service over
# the network -- it needs the Deployment/Service/PVC above already created,
# which post-install/post-upgrade guarantees. backoffLimit covers the
# transient case where the SeaweedFS pod is created but not yet Ready. Weight
# "1" runs it before core-bundle-seeder-job.yaml's weight "5" in case seeded
# bundles ever need the buckets to exist first.
{{- $bij := .Values.infrastructure.seaweedfs.bucketInitJob }}
{{- if gt (int $bij.totalBudgetSeconds) (sub (int $bij.activeDeadlineSeconds) 60) }}
{{- fail (printf "infrastructure.seaweedfs.bucketInitJob.totalBudgetSeconds (%d) must be <= activeDeadlineSeconds (%d) - 60" (int $bij.totalBudgetSeconds) (int $bij.activeDeadlineSeconds)) }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: seaweedfs-bucket-init
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: storage-init
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  # Bounded so this post-install/post-upgrade HOOK can never hang `helm --wait`
  # past the deploy timeout (#1391 class). activeDeadlineSeconds spans the WHOLE Job (pod
  # scheduling, image pull, termination), and 300s was hit on dal2alpha (DeadlineExceeded, no
  # script log), so it defaults to 600s. The script's own TOTAL_BUDGET (default 480s) must stay
  # strictly below this with >=60s margin (enforced by `fail` above), so the script always exits
  # itself first with an `elapsed/budget` log line.
  # scripts/ci/check-helm-hook-job-timeouts.py enforces the deadline < deploy timeout statically.
  # Tunables: infrastructure.seaweedfs.bucketInitJob.* in values.yaml.
  activeDeadlineSeconds: {{ int $bij.activeDeadlineSeconds }}
  # FAILED Jobs (and their pods/logs) stay inspectable for 24h; hook-succeeded above only
  # deletes on success. NOTE: on DeadlineExceeded the Job controller itself reaps running pods,
  # so diagnosability comes from the script's own per-call timeouts (it fails first, with logs).
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      restartPolicy: Never
      {{- include "waddlebot.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: seaweedfs-bucket-init
        image: {{ .Values.infrastructure.seaweedfs.bucketInitImage }}
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          # pipefail is absent from some sh builds; enable when supported.
          (set -o pipefail) 2>/dev/null && set -o pipefail
          export AWS_ACCESS_KEY_ID="${S3_ACCESS_KEY_ID}"
          export AWS_SECRET_ACCESS_KEY="${S3_SECRET_ACCESS_KEY}"
          export AWS_DEFAULT_REGION="us-east-1"
          # feature/transit-tls-core (F5): https against the FQDN, internal CA pinned (aws cli reads AWS_CA_BUNDLE).
          export AWS_CA_BUNDLE="{{ include "waddlebot.transitTls.caPath" . }}"
          ENDPOINT="{{ include "waddlebot.transitTls.s3Endpoint" . }}"
          # Fail FAST and DIAGNOSABLY: the Job controller reaps the pod on
          # activeDeadlineSeconds (no logs survive), so the script enforces ONE total budget
          # (TOTAL_BUDGET) strictly below that deadline minus a margin for scheduling/image pull/
          # termination (default activeDeadlineSeconds 600 - 120 = 480). The budget is checked before every
          # call and caps each call's timeout to the remaining time, so a stall makes THIS script
          # exit non-zero with an `elapsed/budget` log line, leaving a Failed pod whose logs
          # `kubectl logs` can still read.
          TOTAL_BUDGET={{ int $bij.totalBudgetSeconds }}
          # Per-call cap (also used by the readiness wait loop): aws-cli v2 is a python cold start
          # and list-buckets is authenticated, so ~10s was intermittently killed on dal2alpha.
          CALL_TIMEOUT={{ int $bij.callTimeoutSeconds }}
          # Wall-clock seconds to keep retrying the readiness probe (time-based, not sleep-counted).
          WAIT_MAX={{ int $bij.waitMaxSeconds }}
          START_TS=$(date +%s)
          log() { echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) bucket-init: $*"; }
          elapsed() { echo $(( $(date +%s) - START_TS )); }
          remaining() { echo $(( TOTAL_BUDGET - $(elapsed) )); }
          trap 'rc=$?; if [ "${rc}" -ne 0 ]; then log "ERROR: exiting rc=${rc} elapsed=$(elapsed)s/budget=${TOTAL_BUDGET}s"; fi' EXIT
          # budget_check: abort the whole script (main shell only) once the total budget is spent.
          budget_check() {
            if [ "$(remaining)" -le 0 ]; then
              log "ERROR: total budget exhausted elapsed=$(elapsed)s/budget=${TOTAL_BUDGET}s while: $*"
              exit 1
            fi
          }
          command -v timeout >/dev/null 2>&1 || { log "ERROR: 'timeout' not found in image; cannot bound aws calls"; exit 1; }
          # capped_timeout <max>: min(max, remaining budget), never below 1s.
          capped_timeout() {
            r=$(remaining)
            if [ "${r}" -lt 1 ]; then echo 1; elif [ "${r}" -lt "$1" ]; then echo "${r}"; else echo "$1"; fi
          }
          awsx() {
            budget_check "aws $*"
            timeout "$(capped_timeout "${CALL_TIMEOUT}")" aws --endpoint-url "$ENDPOINT" "$@"
          }
          # Bounded wait for the S3 gateway (post-hook can fire before SeaweedFS is Ready).
          log "waiting for S3 endpoint ${ENDPOINT} (max ${WAIT_MAX}s, total budget ${TOTAL_BUDGET}s)"
          WAIT_START=$(date +%s)
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            budget_check "waiting for S3 endpoint ${ENDPOINT}"
            call_to=$(capped_timeout "${CALL_TIMEOUT}")
            t0=$(date +%s)
            rc=0
            err=$(timeout "${call_to}" aws --endpoint-url "$ENDPOINT" s3api list-buckets 2>&1 >/dev/null) || rc=$?
            [ "${rc}" -eq 0 ] && break
            took=$(( $(date +%s) - t0 ))
            case "${rc}" in
              124) why="timeout after ${call_to}s (killed by our own per-call cap; not refused/TLS/403)" ;;
              *) why="aws exited rc=${rc} (refused/TLS/auth: see stderr)" ;;
            esac
            log "attempt ${attempt} failed rc=${rc} took=${took}s: ${why}; stderr: $(echo "${err}" | tail -n 3)"
            waited=$(( $(date +%s) - WAIT_START ))
            if [ "${waited}" -ge "${WAIT_MAX}" ]; then
              log "ERROR: S3 endpoint ${ENDPOINT} not ready after ${waited}s/${WAIT_MAX}s attempts=${attempt} last_rc=${rc} elapsed=$(elapsed)s/budget=${TOTAL_BUDGET}s; last error: $(echo "${err}" | tail -n 3)"
              exit 1
            fi
            sleep 3
          done
          waited=$(( $(date +%s) - WAIT_START ))
          log "S3 endpoint ready after ${waited}s (elapsed=$(elapsed)s/budget=${TOTAL_BUDGET}s)"
          # "recordings" (svc-streaming egress) and bundleExecutor.bucketName
          # ("waddles-bundles", core/bundle_executor's BUNDLE_BUCKET_NAME) --
          # both consumers expect their bucket to already exist; previously
          # only bucketName + "recordings" were created here, leaving
          # "waddles-bundles" as a pre-existing gap.
          EXPECTED={{ if eq .Values.bundleStorage.mode "bundled" }}5{{ else }}4{{ end }}
          VERIFIED=0
          for bucket in "{{ .Values.infrastructure.seaweedfs.bucketName }}" "recordings" "{{ .Values.pipeline.rustDataPlane.bundleExecutor.bucketName }}" "{{ .Values.infrastructure.seaweedfs.escrow.bucketName }}"{{ if eq .Values.bundleStorage.mode "bundled" }} "{{ .Values.bundleStorage.bucketName }}"{{ end }}; do
            budget_check "bucket ${bucket}"
            log "bucket ${bucket}: ensure exists (elapsed=$(elapsed)s/budget=${TOTAL_BUDGET}s)"
            # Best-effort mb (masked on purpose): the head-bucket || create-bucket gate below is the real check.
            { awsx s3 mb "s3://${bucket}" --region us-east-1 2>&1 | grep -qi "already"; } || true
            awsx s3api head-bucket --bucket "${bucket}" 2>/dev/null \
              || awsx s3api create-bucket --bucket "${bucket}" --region us-east-1
          {{- if and .Values.infrastructure.seaweedfs.encryption.enabled .Values.infrastructure.seaweedfs.encryption.autoEncryptBucket (or .Values.infrastructure.seaweedfs.encryption.secretName (include "waddlebot.kms.objectStorageActive" .)) }}
            # Default bucket encryption (SSE-S3) -- objects written without an
            # explicit ServerSideEncryption header are still encrypted at rest,
            # requires WEED_S3_SSE_KEK to already be configured on the server.
            # kms.objectStorage.mode=kms (templates/_kms.tpl) swaps the default to
            # SSE-KMS under the operator's key, ON TOP of the baseline above.
            log "bucket ${bucket}: put-bucket-encryption"
            awsx s3api put-bucket-encryption --bucket "${bucket}" \
              --server-side-encryption-configuration '{{ include "waddlebot.kms.bucketEncryptionConfig" . }}'
          {{- end }}
            awsx s3api head-bucket --bucket "${bucket}"
            VERIFIED=$((VERIFIED + 1))
            log "bucket ${bucket}: verified (${VERIFIED}/${EXPECTED})"
          done
          {{- if .Values.infrastructure.seaweedfs.escrow.versioning }}
          # Platform-secret escrow bucket: versioning keeps every prior object/manifest version so a
          # poisoned or mistaken overwrite is recoverable. Loud (not fatal) if unsupported.
          log "bucket {{ .Values.infrastructure.seaweedfs.escrow.bucketName }}: put-bucket-versioning"
          awsx s3api put-bucket-versioning --bucket "{{ .Values.infrastructure.seaweedfs.escrow.bucketName }}" \
            --versioning-configuration Status=Enabled \
            || echo "WARNING: could not enable versioning on {{ .Values.infrastructure.seaweedfs.escrow.bucketName }} -- escrow history is NOT retained" >&2
          {{- end }}
          awsx s3 ls
          if [ "${EXPECTED}" -lt 1 ] || [ "${VERIFIED}" -ne "${EXPECTED}" ]; then
            log "ERROR: ${VERIFIED}/${EXPECTED} buckets verified"
            exit 1
          fi
          log "${VERIFIED}/${EXPECTED} buckets verified (elapsed=$(elapsed)s/budget=${TOTAL_BUDGET}s)"
        env:
        # Dedicated hook-scoped "bucket-init" identity (Admin) -- never the
        # shared rootUser/rootPassword admin credential, and never mounted by
        # any long-running Deployment. See values.yaml
        # infrastructure.seaweedfs.identities.bucketInit.
        - name: S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: waddlebot-secrets
              key: BUCKET_INIT_S3_ACCESS_KEY_ID
        - name: S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: waddlebot-secrets
              key: BUCKET_INIT_S3_SECRET_ACCESS_KEY
        resources:
          {{- toYaml $bij.resources | nindent 10 }}
        volumeMounts:
        {{- include "waddlebot.transitTls.caVolumeMount" . | nindent 8 }}
      volumes:
      {{- include "waddlebot.transitTls.caVolume" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: storage
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/transit-tls: {{ include "waddlebot.transitTls.podChecksum" . | quote }}
      labels:
        app.kubernetes.io/name: seaweedfs
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: storage
    spec:
      {{- include "waddlebot.terminationGracePeriod" $ | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: seaweedfs
        image: {{ .Values.infrastructure.seaweedfs.image }}
        imagePullPolicy: IfNotPresent
        {{- include "waddlebot.preStop" $ | nindent 8 }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        command:
        - /bin/sh
        - -c
        - |
          set -e
          mkdir -p /etc/seaweedfs
          # Least-privilege S3 identities, one per workload (feature/seaweedfs-object-storage),
          # replacing the former single "waddlebot" identity that granted every consumer full
          # Read/Write/List/Tagging/Admin across every bucket -- that identity has been
          # REMOVED entirely (no unscoped/full-access identity remains except the
          # hook-scoped, never-Deployment-mounted "bucket-init" below). Bucket-scoped actions
          # ("Action:bucket") restrict an identity's Read/Write/List/Tagging grant to exactly
          # the bucket it owns -- see SeaweedFS's s3.config IAM docs.
          cat > /etc/seaweedfs/s3-identities.json <<EOF
          {
            "identities": [
              {
                "name": "hub-api",
                "credentials": [
                  {"accessKey": "${HUB_API_S3_ACCESS_KEY_ID}", "secretKey": "${HUB_API_S3_SECRET_ACCESS_KEY}"}
                ],
                "actions": [
                  "Read:{{ .Values.infrastructure.seaweedfs.bucketName }}",
                  "Write:{{ .Values.infrastructure.seaweedfs.bucketName }}",
                  "List:{{ .Values.infrastructure.seaweedfs.bucketName }}",
                  "Tagging:{{ .Values.infrastructure.seaweedfs.bucketName }}",
                  {{/* regression: bundle publish/fetch bucket split after SeaweedFS migration
                  (#508/#509) -- hub_api/services/storage_service.py's upload_bundle_component()
                  (and the core-bundle-seeder, which shares this identity) writes bundle
                  components/sidecars to pipeline.rustDataPlane.bundleExecutor.bucketName
                  ("waddles-bundles"), NOT bucketName above -- without a grant here every
                  publish 403s even though svc-bundles-executor's own Read/List-only grant on this
                  SAME bucket (below) is correctly scoped. */}}
                  "Read:{{ .Values.pipeline.rustDataPlane.bundleExecutor.bucketName }}",
                  "Write:{{ .Values.pipeline.rustDataPlane.bundleExecutor.bucketName }}",
                  "List:{{ .Values.pipeline.rustDataPlane.bundleExecutor.bucketName }}"
                ]
              },
              {
                "name": "svc-bundles-executor",
                "credentials": [
                  {"accessKey": "${DATAPLANE_S3_ACCESS_KEY_ID}", "secretKey": "${DATAPLANE_S3_SECRET_ACCESS_KEY}"}
                ],
                "actions": [
                  "Read:{{ .Values.pipeline.rustDataPlane.bundleExecutor.bucketName }}",
                  "List:{{ .Values.pipeline.rustDataPlane.bundleExecutor.bucketName }}"
                ]
              },
              {
                "name": "svc-bundles-precompiler",
                "credentials": [
                  {"accessKey": "${PRECOMPILER_S3_ACCESS_KEY_ID}", "secretKey": "${PRECOMPILER_S3_SECRET_ACCESS_KEY}"}
                ],
                "actions": [
                  "Read:{{ .Values.pipeline.rustDataPlane.bundleExecutor.bucketName }}",
                  "List:{{ .Values.pipeline.rustDataPlane.bundleExecutor.bucketName }}",
                  "Write:{{ .Values.pipeline.rustDataPlane.bundleExecutor.bucketName }}/precompiled"
                ]
              },
              {
                "name": "hub-api-escrow",
                "credentials": [
                  {"accessKey": "${ESCROW_S3_ACCESS_KEY_ID}", "secretKey": "${ESCROW_S3_SECRET_ACCESS_KEY}"}
                ],
                "actions": [
                  "Read:{{ .Values.infrastructure.seaweedfs.escrow.bucketName }}",
                  "Write:{{ .Values.infrastructure.seaweedfs.escrow.bucketName }}",
                  "List:{{ .Values.infrastructure.seaweedfs.escrow.bucketName }}"
                ]
              },
              {
                "name": "bucket-init",
                "credentials": [
                  {"accessKey": "${BUCKET_INIT_S3_ACCESS_KEY_ID}", "secretKey": "${BUCKET_INIT_S3_SECRET_ACCESS_KEY}"}
                ],
                "actions": ["Admin"]
              },
              {
                "name": "svc-streaming",
                "credentials": [
                  {"accessKey": "${STREAMING_S3_ACCESS_KEY_ID}", "secretKey": "${STREAMING_S3_SECRET_ACCESS_KEY}"}
                ],
                "actions": ["Read:recordings", "Write:recordings"]
              }
              {{- if eq .Values.bundleStorage.mode "bundled" }},
              {
                "name": "bundle-storage",
                "credentials": [
                  {"accessKey": "${BUNDLE_STORAGE_S3_ACCESS_KEY_ID}", "secretKey": "${BUNDLE_STORAGE_S3_SECRET_ACCESS_KEY}"}
                ],
                "actions": [
                  "Read:{{ .Values.bundleStorage.bucketName }}",
                  "Write:{{ .Values.bundleStorage.bucketName }}",
                  "List:{{ .Values.bundleStorage.bucketName }}",
                  "Tagging:{{ .Values.bundleStorage.bucketName }}"
                ]
              }
              {{- end }}
            ]
            {{- with (include "waddlebot.kms.seaweedfsConfigBlock" .) }}{{ . | nindent 12 }}{{- end }}
          }
          EOF
          exec weed server \
            -dir=/data \
            -s3 \
            -s3.port={{ .Values.infrastructure.seaweedfs.s3Port }} \
            -s3.cert.file=/etc/seaweedfs-tls/tls.crt \
            -s3.key.file=/etc/seaweedfs-tls/tls.key \
            -s3.config=/etc/seaweedfs/s3-identities.json \
            -master.port={{ .Values.infrastructure.seaweedfs.masterPort }} \
            -volume.port=8080 \
            -volume.max=100 \
            -filer=true \
            -filer.port=8888 \
            -ip=0.0.0.0
        ports:
        - name: s3
          containerPort: {{ .Values.infrastructure.seaweedfs.s3Port }}
          protocol: TCP
        - name: master
          containerPort: {{ .Values.infrastructure.seaweedfs.masterPort }}
          protocol: TCP
        env:
        - name: HUB_API_S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: waddlebot-secrets
              key: HUB_API_S3_ACCESS_KEY_ID
        - name: HUB_API_S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: waddlebot-secrets
              key: HUB_API_S3_SECRET_ACCESS_KEY
        - name: ESCROW_S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-platform-escrow-s3
              key: ESCROW_S3_ACCESS_KEY_ID
        - name: ESCROW_S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-platform-escrow-s3
              key: ESCROW_S3_SECRET_ACCESS_KEY
        - name: DATAPLANE_S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: waddlebot-secrets
              key: DATAPLANE_S3_ACCESS_KEY_ID
        - name: DATAPLANE_S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: waddlebot-secrets
              key: DATAPLANE_S3_SECRET_ACCESS_KEY
        - name: BUCKET_INIT_S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: waddlebot-secrets
              key: BUCKET_INIT_S3_ACCESS_KEY_ID
        - name: BUCKET_INIT_S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: waddlebot-secrets
              key: BUCKET_INIT_S3_SECRET_ACCESS_KEY
        - name: PRECOMPILER_S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: waddlebot-secrets
              key: PRECOMPILER_S3_ACCESS_KEY_ID
        - name: PRECOMPILER_S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: waddlebot-secrets
              key: PRECOMPILER_S3_SECRET_ACCESS_KEY
        - name: STREAMING_S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: waddlebot-secrets
              key: STREAMING_S3_ACCESS_KEY_ID
        - name: STREAMING_S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: waddlebot-secrets
              key: STREAMING_S3_SECRET_ACCESS_KEY
        {{- if eq .Values.bundleStorage.mode "bundled" }}
        - name: BUNDLE_STORAGE_S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: waddlebot-secrets
              key: BUNDLE_STORAGE_S3_ACCESS_KEY_ID
        - name: BUNDLE_STORAGE_S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: waddlebot-secrets
              key: BUNDLE_STORAGE_S3_SECRET_ACCESS_KEY
        {{- end }}
        {{- if and .Values.infrastructure.seaweedfs.encryption.enabled .Values.infrastructure.seaweedfs.encryption.secretName }}
        - name: WEED_S3_SSE_KEK
          valueFrom:
            secretKeyRef:
              name: {{ .Values.infrastructure.seaweedfs.encryption.secretName }}
              key: {{ .Values.infrastructure.seaweedfs.encryption.secretKey }}
        {{- end }}
        {{- with (include "waddlebot.kms.seaweedfsEnv" .) }}{{ . | nindent 8 }}{{- end }}
        volumeMounts:
        - name: seaweedfs-data
          mountPath: /data
        - name: seaweedfs-etc
          mountPath: /etc/seaweedfs
        - name: tmp
          mountPath: /tmp
        - name: transit-tls
          mountPath: /etc/seaweedfs-tls
          readOnly: true
        {{- include "waddlebot.transitTls.caVolumeMount" . | nindent 8 }}
        {{- with (include "waddlebot.kms.seaweedfsVolumeMounts" .) }}{{ . | nindent 8 }}{{- end }}
        resources:
          requests:
            memory: {{ .Values.infrastructure.seaweedfs.resources.requests.memory }}
            cpu: {{ .Values.infrastructure.seaweedfs.resources.requests.cpu }}
          limits:
            memory: {{ .Values.infrastructure.seaweedfs.resources.limits.memory }}
            cpu: {{ .Values.infrastructure.seaweedfs.resources.limits.cpu }}
        # fix/seaweedfs-mem-httpprobe -- a tcpSocket probe only proves the
        # listener is accepting connections; under bundle-seed load the pod
        # OOMKilled at the old 512Mi alpha limit and on restart the S3 HTTP
        # handler wedged (TCP accept succeeds, HTTP requests hang / the
        # seeder's .wasm uploads see ConnectionClosedError) while tcpSocket
        # stayed green the whole time. An httpGet probe can't replace it
        # directly: kubelet only treats HTTP 200-399 as Success, and an
        # unsigned/anonymous GET against the S3 gateway's IAM-protected
        # identities (s3-identities.json above) correctly returns 403 --
        # i.e. the one HTTP status that proves the handler IS serving is
        # the one status kubelet always calls a Failure. So this execs curl
        # itself and accepts 200 OR 403 as "handler responding"; a wedged
        # handler (connection accepted but no response within --max-time)
        # yields an empty/"000" code, which correctly fails the probe.
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - |
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 --cacert /etc/waddles/transit-ca/ca.crt --resolve "{{ include "waddlebot.transitTls.s3Host" . }}:{{ .Values.infrastructure.seaweedfs.s3Port }}:127.0.0.1" "https://{{ include "waddlebot.transitTls.s3Host" . }}:{{ .Values.infrastructure.seaweedfs.s3Port }}/")
              [ "$code" = "200" ] || [ "$code" = "403" ]
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - |
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 --cacert /etc/waddles/transit-ca/ca.crt --resolve "{{ include "waddlebot.transitTls.s3Host" . }}:{{ .Values.infrastructure.seaweedfs.s3Port }}:127.0.0.1" "https://{{ include "waddlebot.transitTls.s3Host" . }}:{{ .Values.infrastructure.seaweedfs.s3Port }}/")
              [ "$code" = "200" ] || [ "$code" = "403" ]
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 3
      volumes:
      - name: seaweedfs-data
        persistentVolumeClaim:
          claimName: {{ .Values.infrastructure.seaweedfs.persistence.name }}
      - name: seaweedfs-etc
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      {{- include "waddlebot.transitTls.caVolume" . | nindent 6 }}
      # Server leaf + key from the transit-tls Secret; probes verify against the shared CA volume above (no -k).
      - name: transit-tls
        secret:
          secretName: {{ include "waddlebot.transitTls.s3SecretName" . }}
          defaultMode: 0440
          items:
          {{- include "waddlebot.transitTls.s3Items" . | nindent 10 }}
      {{- with (include "waddlebot.kms.seaweedfsVolumes" .) }}{{ . | nindent 6 }}{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.infrastructure.seaweedfs.service.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: storage
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: {{ .Values.infrastructure.seaweedfs.service.type }}
  ports:
  - port: {{ .Values.infrastructure.seaweedfs.service.s3Port }}
    targetPort: s3
    protocol: TCP
    name: s3
    {{- if and (eq .Values.infrastructure.seaweedfs.service.type "NodePort") .Values.infrastructure.seaweedfs.service.nodePortS3 }}
    nodePort: {{ .Values.infrastructure.seaweedfs.service.nodePortS3 }}
    {{- end }}
  - port: {{ .Values.infrastructure.seaweedfs.service.masterPort }}
    targetPort: master
    protocol: TCP
    name: master
    {{- if and (eq .Values.infrastructure.seaweedfs.service.type "NodePort") .Values.infrastructure.seaweedfs.service.nodePortMaster }}
    nodePort: {{ .Values.infrastructure.seaweedfs.service.nodePortMaster }}
    {{- end }}
  selector:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/instance: {{ .Release.Name }}
# R5 posture: ingress scoped to declared ports, default-deny egress (third-party image: no Tetragon allowlist).
{{- include "waddlebot.workloadPolicies" (dict "root" $ "component" "storage" "name" "seaweedfs" "selector" (dict "app.kubernetes.io/name" "seaweedfs" "app.kubernetes.io/instance" $.Release.Name) "ports" (list $.Values.infrastructure.seaweedfs.s3Port $.Values.infrastructure.seaweedfs.masterPort) "egress" "internal" "tetragon" false) }}
{{- end }}

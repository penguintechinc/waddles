{{- if .Values.infrastructure.minio.enabled }}
{{- if .Values.infrastructure.minio.kms.enabled }}
{{- if not .Values.infrastructure.minio.kms.secretName }}
{{- if ne .Values.global.deploymentTier "alpha" }}
{{- fail "infrastructure.minio.enabled=true requires infrastructure.minio.kms.secretName outside alpha (beta/gamma/production) -- at-rest encryption is mandatory (security.md Encryption), never disable infrastructure.minio.kms.enabled to work around this. Pre-create the Secret via `make generate-minio-kms-key` / scripts/generate-minio-kms-key.sh (default name minio-kms, key MINIO_KMS_SECRET_KEY), then set infrastructure.minio.kms.secretName via --set or an out-of-git values override / ExternalSecret. Only alpha may leave this unset (values-alpha.yaml documents its own default)." }}
{{- end }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.infrastructure.minio.persistence.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: storage
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  accessModes:
    - {{ .Values.infrastructure.minio.persistence.accessMode }}
  {{- if .Values.infrastructure.minio.persistence.storageClass }}
  storageClassName: {{ .Values.infrastructure.minio.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.infrastructure.minio.persistence.size }}
---
# MinIO bucket initialization Job (creates bucketName if it doesn't exist)
# MinIO License: AGPL-3.0 — self-hosted object store, not linked into our code
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: storage-init
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      restartPolicy: Never
      containers:
      - name: minio-init
        image: {{ .Values.infrastructure.minio.initImage }}
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          set -e
          # `mc alias set` replaced the removed `mc config host add` in current mc releases.
          /usr/bin/mc alias set minio http://{{ .Values.infrastructure.minio.service.name }}:{{ .Values.infrastructure.minio.service.apiPort }} "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}"
          /usr/bin/mc mb --ignore-existing minio/{{ .Values.infrastructure.minio.bucketName }}
          # svc-streaming recordings (RECORDINGS_BUCKET) live in their own bucket.
          /usr/bin/mc mb --ignore-existing minio/recordings
          {{- if and .Values.infrastructure.minio.kms.enabled .Values.infrastructure.minio.kms.autoEncryptBucket .Values.infrastructure.minio.kms.secretName }}
          # Default bucket auto-encryption (SSE-S3) -- objects written without an
          # explicit ServerSideEncryption header are still encrypted at rest,
          # requires MINIO_KMS_SECRET_KEY to already be configured on the server.
          /usr/bin/mc encrypt set sse-s3 minio/{{ .Values.infrastructure.minio.bucketName }}
          /usr/bin/mc encrypt set sse-s3 minio/recordings
          {{- end }}
          /usr/bin/mc ls minio/
          echo "Buckets {{ .Values.infrastructure.minio.bucketName }}, recordings initialized successfully"
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: waddlebot-secrets
              key: MINIO_ROOT_USER
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: waddlebot-secrets
              key: MINIO_ROOT_PASSWORD
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: storage
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: storage
    spec:
      containers:
      - name: minio
        image: {{ .Values.infrastructure.minio.image }}
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - minio server /data --console-address :9001
        ports:
        - name: api
          containerPort: 9000
          protocol: TCP
        - name: console
          containerPort: 9001
          protocol: TCP
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: waddlebot-secrets
              key: MINIO_ROOT_USER
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: waddlebot-secrets
              key: MINIO_ROOT_PASSWORD
        - name: MINIO_DOMAIN
          value: {{ .Values.infrastructure.minio.domain | quote }}
        {{- if and .Values.infrastructure.minio.kms.enabled .Values.infrastructure.minio.kms.secretName }}
        - name: MINIO_KMS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.infrastructure.minio.kms.secretName }}
              key: {{ .Values.infrastructure.minio.kms.secretKey }}
        {{- end }}
        volumeMounts:
        - name: minio-data
          mountPath: /data
        resources:
          requests:
            memory: {{ .Values.infrastructure.minio.resources.requests.memory }}
            cpu: {{ .Values.infrastructure.minio.resources.requests.cpu }}
          limits:
            memory: {{ .Values.infrastructure.minio.resources.limits.memory }}
            cpu: {{ .Values.infrastructure.minio.resources.limits.cpu }}
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: api
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 20
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: api
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 20
          failureThreshold: 3
      volumes:
      - name: minio-data
        persistentVolumeClaim:
          claimName: {{ .Values.infrastructure.minio.persistence.name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.infrastructure.minio.service.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: storage
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: {{ .Values.infrastructure.minio.service.type }}
  ports:
  - port: {{ .Values.infrastructure.minio.service.apiPort }}
    targetPort: api
    protocol: TCP
    name: api
    {{- if and (eq .Values.infrastructure.minio.service.type "NodePort") .Values.infrastructure.minio.service.nodePortApi }}
    nodePort: {{ .Values.infrastructure.minio.service.nodePortApi }}
    {{- end }}
  - port: {{ .Values.infrastructure.minio.service.consolePort }}
    targetPort: console
    protocol: TCP
    name: console
    {{- if and (eq .Values.infrastructure.minio.service.type "NodePort") .Values.infrastructure.minio.service.nodePortConsole }}
    nodePort: {{ .Values.infrastructure.minio.service.nodePortConsole }}
    {{- end }}
  selector:
    app.kubernetes.io/name: minio
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}

{{- /*
Event-sync request integrity key -- DEDICATED symmetric key (HMAC-SHA256) hub-api signs Discord
scheduled-event requests with and svc-action verifies (core/svc_action capabilities/event_sync.rs).
Mounted ONLY into hub-api, the event-sync reconcile CronJob (signers) and svc-action-rust (verifier)
via secretKeyRef -- never the shared envFrom Secret, and never the outbound pin ring (hub-api must not
hold that). Format `kid:hexkey[,kid2:hexkey2]`; rotation: add the new kid (svc-action verifies any kid
in the ring), flip eventSyncRequest.activeKid, later drop the old kid. Precedence:
eventSyncRequest.existingSecret (key name EVENT_SYNC_REQUEST_KEYS) > existing in-cluster Secret (KEEP)
> alpha/local auto-generation > fail closed.
*/}}
{{- define "waddlebot.eventSyncRequestSecretName" -}}
{{- .Values.eventSyncRequest.existingSecret | default (printf "%s-event-sync-request" (include "waddlebot.fullname" .)) -}}
{{- end }}
{{- if and .Values.pipeline.rustDataPlane.enabled (not .Values.eventSyncRequest.existingSecret) }}
{{- $name := include "waddlebot.eventSyncRequestSecretName" . }}
{{- $kid := .Values.eventSyncRequest.activeKid | default "r1" }}
{{- $v := include "waddlebot.autoSecretValue" (dict "ctx" . "key" "EVENT_SYNC_REQUEST_KEYS" "explicit" "" "hex" true "secret" $name) }}
{{- if not (contains ":" $v) }}{{- $v = printf "%s:%s" $kid $v }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/component: event-sync-request
type: Opaque
stringData:
  EVENT_SYNC_REQUEST_KEYS: {{ $v | quote }}
{{- end }}

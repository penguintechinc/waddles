# v3.0.x Task 0.5 — SKELETON. Admin + marketplace + tenant management; low-volume admin
# traffic, so it is not on svc-core's deploy cadence and does not carry the auth path.
# Folds core/{hub,marketplace}.yaml — see PIPELINE_MAPPING.md. Coexists with those 2 legacy
# Deployments; cutover is a later task. Per the design doc, hub-api is where Customer's
# Apps mostly live (CRUD), and where every Module's admin/marketplace surface is exposed.
{{- if .Values.pipeline.hubApi.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "waddlebot.fullname" . }}-hub-api-v3
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub-api
spec:
  replicas: {{ .Values.pipeline.hubApi.replicas }}
  selector:
    matchLabels:
      {{- include "waddlebot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: hub-api
  template:
    metadata:
      labels:
        {{- include "waddlebot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: hub-api
    spec:
      serviceAccountName: {{ include "waddlebot.serviceAccountName" . }}
      {{- include "waddlebot.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
      {{- include "waddlebot.dbMigrateInitContainer" . | nindent 6 }}
      containers:
      - name: hub-api
        # fix/alpha-helm-deploy -- hub_api/Dockerfile (Python 3.13 + Quart control-plane
        # API, see critical-rules.md Data Plane) now exists; no longer the shared
        # pipeline.pythonBaseImage skeleton placeholder. Bare module name "hub-api" is the
        # alpha-local repo under global.imageRegistry -- see scripts/deploy-alpha.sh.
        image: "{{ include "waddlebot.legacyModuleImage" (dict "root" . "module" "hub-api" "imageTag" .Values.global.imageTag) }}"
        # Hardcoded Always (not .Values.global.imagePullPolicy, which alpha pins to
        # IfNotPresent) -- same node-image-cache rationale as templates/svc-process-rust.yaml/
        # svc-action-rust.yaml/bundle-executor.yaml: proven stale here too (this Deployment
        # kept serving a pre-fix image with a `ModuleNotFoundError: penguin_dal` crash for
        # hours after a same-tag push carried the fix). hub-api iterates against the same
        # mutable `alpha` tag those Rust services do, so it needs the same guarantee.
        imagePullPolicy: Always
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        ports:
        - name: http
          containerPort: {{ .Values.pipeline.hubApi.port }}
          protocol: TCP
        - name: grpc
          containerPort: {{ .Values.pipeline.hubApi.grpcPort }}
          protocol: TCP
        envFrom:
        - configMapRef:
            name: {{ include "waddlebot.fullname" . }}-config
        - secretRef:
            name: {{ include "waddlebot.fullname" . }}-secrets
        env:
        - name: MODULE_NAME
          value: "hub-api"
        - name: PIPELINE_STAGE
          value: "hub-api"
        - name: MODULE_PORT
          value: {{ .Values.pipeline.hubApi.port | quote }}
        - name: GRPC_PORT
          value: {{ .Values.pipeline.hubApi.grpcPort | quote }}
        # ONE-WAY AI kill-switch (hub_api/config.py's WADDLES_AI_ENABLED) --
        # lets this Deployment run with no Ollama/model backend reachable;
        # never grants access on its own, see values.yaml's own comment.
        - name: WADDLES_AI_ENABLED
          value: {{ .Values.pipeline.hubApi.aiEnabled | quote }}
        # #320 Connections: PUBLIC_WEBUI_URL (OAuth redirect_uri base) and the 12
        # {DISCORD,TWITCH,SLACK,YOUTUBE,SPOTIFY,KICK}_CLIENT_ID/_CLIENT_SECRET pairs
        # already reach this container via the envFrom.configMapRef/secretRef blocks
        # above (shared -config/-secrets objects) -- same whole-object envFrom pattern
        # svc-action.yaml/svc-ingest.yaml use for the same keys; no per-key duplicates
        # added here.
        - name: CONNECTIONS_STATE_TTL_S
          value: {{ .Values.pipeline.hubApi.connectionsStateTtlS | quote }}
        - name: CREDENTIAL_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: CREDENTIAL_ENCRYPTION_KEY
              # optional: true -- mirrors _helpers.tpl's dbMigrateInitContainer pattern
              # for secret keys that may not exist yet on an already-deployed Secret
              # (live alpha's waddlebot-secrets predates this key); hub_api/config.py
              # must fail closed on Connections use if this resolves empty/unset.
              optional: true
        {{- if .Values.modules.bot.enabled }}
        - name: MODULE_LOAD_BOT
          value: "true"
        {{- end }}
        {{- if .Values.modules.social.enabled }}
        - name: MODULE_LOAD_SOCIAL
          value: "true"
        {{- end }}
        {{- if .Values.modules.customer.enabled }}
        - name: MODULE_LOAD_CUSTOMER
          value: "true"
        {{- end }}
        {{- if .Values.modules.marketing.enabled }}
        - name: MODULE_LOAD_MARKETING
          value: "true"
        {{- end }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.pipeline.hubApi.resources | nindent 10 }}
        volumeMounts:
        - name: logs
          mountPath: /var/log/waddlebotlog
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: logs
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "waddlebot.fullname" . }}-hub-api-v3
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub-api
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.pipeline.hubApi.port }}
    targetPort: http
    protocol: TCP
    name: http
  - port: {{ .Values.pipeline.hubApi.grpcPort }}
    targetPort: grpc
    protocol: TCP
    name: grpc
  selector:
    {{- include "waddlebot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: hub-api
{{- end }}

# v3.0.x Task 0.5 — SKELETON. Admin + marketplace + tenant management; low-volume admin
# traffic, so it is not on svc-core's deploy cadence and does not carry the auth path.
# Folds core/{hub,marketplace}.yaml — see PIPELINE_MAPPING.md. Coexists with those 2 legacy
# Deployments; cutover is a later task. Per the design doc, hub-api is where Customer's
# Apps mostly live (CRUD), and where every Module's admin/marketplace surface is exposed.
{{- if .Values.pipeline.hubApi.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "waddlebot.fullname" . }}-hub-api-v3
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub-api
spec:
  replicas: {{ .Values.pipeline.hubApi.replicas }}
  selector:
    matchLabels:
      {{- include "waddlebot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: hub-api
  template:
    metadata:
      annotations:
        # fix/valkey-cert-rollout-and-migrate-wait -- see templates/infrastructure/
        # redis.yaml's identical annotation comment; rolls this client pod in lockstep
        # with the Valkey server on any identity/SAN change.
        # regression: valkey cert regenerated but server pod not rolled; clients BadSignature (alpha 2026-10-02)
        {{- if eq (include "waddlebot.valkeyTlsMaterialAvailable" .) "true" }}
        checksum/valkey-tls: {{ include "waddlebot.valkeyTlsPodChecksum" . | quote }}
        {{- end }}
      labels:
        {{- include "waddlebot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: hub-api
    spec:
      serviceAccountName: {{ include "waddlebot.serviceAccountName" . }}
      {{- include "waddlebot.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # fix/chart-fresh-install-hooks (alpha 2026-10-01) -- no initContainers: hub-api
      # bootstraps its own schema in-process at startup (hub_api/bootstrap.py), gated on
      # its own `/ready` readinessProbe below rather than a pre-run initContainer. hub-api
      # is the one Deployment in this chart that never waits on itself.
      containers:
      - name: hub-api
        # fix/alpha-helm-deploy -- hub_api/Dockerfile (Python 3.13 + Quart control-plane
        # API, see critical-rules.md Data Plane) now exists; no longer the shared
        # pipeline.pythonBaseImage skeleton placeholder. Bare module name "hub-api" is the
        # alpha-local repo under global.imageRegistry -- see scripts/deploy-alpha.sh.
        image: "{{ include "waddlebot.legacyModuleImage" (dict "root" . "module" "hub-api" "imageTag" .Values.global.imageTag) }}"
        # Values-driven (.Values.global.imagePullPolicy, default IfNotPresent). Every deploy
        # now carries a unique per-deploy global.imageTag (alpha SHA8, beta beta-<epoch>), so
        # the old hardcoded Always (a workaround for a stale same-tag `alpha` push) is
        # unnecessary -- and fatal for locally-loaded images (kind e2e, alpha local builds),
        # where Always forces a registry pull the node cannot satisfy and the pod never
        # becomes Ready. Set global.imagePullPolicy=Always per-env only for a mutable tag.
        imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        ports:
        - name: http
          containerPort: {{ .Values.pipeline.hubApi.port }}
          protocol: TCP
        - name: grpc
          containerPort: {{ .Values.pipeline.hubApi.grpcPort }}
          protocol: TCP
        envFrom:
        - configMapRef:
            name: {{ include "waddlebot.fullname" . }}-config
        - secretRef:
            name: {{ include "waddlebot.fullname" . }}-secrets
        # feature/alpha-localized-posthog -- POSTHOG_API_KEY/POSTHOG_KEY auto-
        # provisioned by templates/infrastructure/posthog/bootstrap.yaml once
        # posthog.enabled=true (alpha). Listed BEFORE platformCredentials below
        # so an operator-managed POSTHOG_API_KEY there still wins on a name
        # collision (envFrom: later source wins) -- this is purely a
        # convenience default for the in-cluster alpha PostHog, never an
        # override of an operator's explicit choice. `optional: true`: safe to
        # reference before the bootstrap Job has run, or when posthog.enabled
        # is false (Secret never created).
        - secretRef:
            name: {{ .Values.posthog.bootstrap.secretName | default "posthog-bootstrap-secret" }}
            optional: true
        # fix/helm-platform-credentials -- OAuth app client IDs/secrets, AWS/GCP,
        # WaddleAI, and PostHog API key (hub_api/services/platform_integrations_crypto.py
        # and Connections OAuth-flow initiation) come from the operator-managed
        # platform-credentials Secret, never the chart-rendered `-secrets` Secret.
        # `optional: true`: hub-api starts fine with zero platforms configured.
        - secretRef:
            name: {{ include "waddlebot.platformCredentialsSecretName" . }}
            optional: true
        # Per-service EdDSA machine JWT signing key (feature/eddsa-machine-jwt,
        # security review HIGH finding) -- SERVICE_JWT_ACTIVE_KID and
        # SERVICE_JWT_PRIVATE_KEY_<kid> land directly as env vars from the
        # externally-managed Secret `scripts/generate-service-jwt-key.sh`
        # creates (never from `values.yaml`, see serviceJwt's own comment).
        # hub-api ONLY -- no other Deployment in this chart mounts this
        # Secret; `optional: true` lets a deployment boot with issuance
        # disabled (fails closed, see hub_api/app.py::startup) before the
        # Secret has ever been generated.
        - secretRef:
            name: {{ .Values.serviceJwt.signingSecretName }}
            optional: true
        env:
        # `flask_core.service_jwt.load_issuer_from_env` also reads
        # SERVICE_JWT_PUBLIC_KEY_<kid> for every still-valid-for-verification
        # rotation key -- these are public keys, safe to render directly
        # from values.yaml rather than round-tripping through a Secret.
        {{- range $kid, $pem := .Values.serviceJwt.publicKeys }}
        - name: SERVICE_JWT_PUBLIC_KEY_{{ $kid }}
          value: {{ $pem | quote }}
        {{- end }}
        - name: SERVICE_JWT_AUDIENCE
          value: {{ .Values.serviceJwt.audience | quote }}
        - name: SERVICE_JWT_BOOTSTRAP_AUDIENCE
          value: {{ .Values.serviceJwt.bootstrapAudience | quote }}
        # `blueprints/service_jwt_bp.py`'s allow-list -- see
        # templates/_service_jwt.tpl::waddlebot.serviceJwtIdentitiesJson.
        - name: SERVICE_JWT_IDENTITIES
          value: {{ include "waddlebot.serviceJwtIdentitiesJson" . | quote }}
        - name: MODULE_NAME
          value: "hub-api"
        - name: PIPELINE_STAGE
          value: "hub-api"
        - name: MODULE_PORT
          value: {{ .Values.pipeline.hubApi.port | quote }}
        - name: GRPC_PORT
          value: {{ .Values.pipeline.hubApi.grpcPort | quote }}
        # fix/hub-grpc-tls-and-ca-trust (PR #570 review blocker 1) -- without these,
        # hub_api/grpc_internal/server.py::_load_server_credentials raises KeyError on
        # os.environ["GRPC_TLS_CERT_PATH"]/["GRPC_TLS_KEY_PATH"] and the internal gRPC
        # listener never starts (TLS is mandatory there, no insecureDev escape hatch).
        {{- include "waddlebot.hubApiGrpcTlsServerEnv" . | nindent 8 }}
        # ONE-WAY AI kill-switch (hub_api/config.py's WADDLES_AI_ENABLED) --
        # lets this Deployment run with no Ollama/model backend reachable;
        # never grants access on its own, see values.yaml's own comment.
        - name: WADDLES_AI_ENABLED
          value: {{ .Values.pipeline.hubApi.aiEnabled | quote }}
        # #320 Connections: PUBLIC_WEBUI_URL (OAuth redirect_uri base) and the 12
        # {DISCORD,TWITCH,SLACK,YOUTUBE,SPOTIFY,KICK}_CLIENT_ID/_CLIENT_SECRET pairs
        # already reach this container via the envFrom.configMapRef/secretRef blocks
        # above (shared -config/-secrets objects) -- same whole-object envFrom pattern
        # svc-action.yaml/svc-ingest.yaml use for the same keys; no per-key duplicates
        # added here.
        - name: CONNECTIONS_STATE_TTL_S
          value: {{ .Values.pipeline.hubApi.connectionsStateTtlS | quote }}
        # feature/seaweedfs-object-storage -- least-privilege "hub-api" S3 identity
        # (Read/Write/List/Tagging, scoped to bucketName only -- see
        # templates/infrastructure/seaweedfs.yaml's s3-identities.json), overriding the
        # admin-identity S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY that would otherwise reach
        # this container via the envFrom.secretRef block above (Kubernetes resolves `env`
        # after `envFrom`, so an explicit entry here always wins on a name collision).
        # hub_api/services/storage_service.py reads exactly these two var names.
        - name: S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: HUB_API_S3_ACCESS_KEY_ID
        - name: S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: HUB_API_S3_SECRET_ACCESS_KEY
        - name: CREDENTIAL_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: CREDENTIAL_ENCRYPTION_KEY
              # optional: true -- mirrors _helpers.tpl's dbMigrateInitContainer pattern
              # for secret keys that may not exist yet on an already-deployed Secret
              # (live alpha's waddlebot-secrets predates this key); hub_api/config.py
              # must fail closed on Connections use if this resolves empty/unset.
              optional: true
        # feature/bundle-artifact-signing -- BUNDLE_SIGNING_PRIVATE_KEY/BUNDLE_SIGNING_KEY_ID
        # (hub_api/services/bundle_signing_service.py::PlatformSigner.from_env). Sourced
        # from a SEPARATE, externally-managed Secret (never this chart's values-templated
        # waddlebot-secrets, never a `value:` literal) -- see values.yaml's
        # pipeline.hubApi.bundleSigning comment and scripts/generate-bundle-signing-key.sh.
        # `optional: true` on both keys: a hub-api deploy that predates the secret being
        # created must still start (approvals fail closed at sign time, per
        # PlatformSigner.from_env()'s own 500 rather than this pod crash-looping).
        - name: BUNDLE_SIGNING_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.pipeline.hubApi.bundleSigning.secretName | default (printf "%s-bundle-signing" (include "waddlebot.fullname" .)) }}
              key: BUNDLE_SIGNING_PRIVATE_KEY
              optional: true
        - name: BUNDLE_SIGNING_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Values.pipeline.hubApi.bundleSigning.secretName | default (printf "%s-bundle-signing" (include "waddlebot.fullname" .)) }}
              key: BUNDLE_SIGNING_KEY_ID
              optional: true
        # #684 / PR #718 -- OTS AES-256-GCM key (64 hex), auto-provisioned by
        # auto-provisioned-secrets.yaml; hub-api fails at startup if blank, so not optional.
        - name: ONE_TIME_SECRET_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.autoProvisionedKeys.oneTimeSecret.secretName }}
              key: {{ .Values.autoProvisionedKeys.oneTimeSecret.secretKey }}
        # Enterprise SSO (hub_api/services/sso_*.py) -- encryption key (optional: SSO is
        # entitlement-gated), tuning, SSRF allowlist, shared Google client. See templates/_sso.tpl.
        {{- include "waddlebot.sso.hubApiEnv" . | nindent 8 }}
        {{- if eq (include "waddlebot.valkeyTlsMaterialAvailable" .) "true" }}
        # regression: seeder VALKEY_URL REPLACE_ME / missing TLS wiring -- hub-api itself
        # calls hub_api/services/valkey_admin_client.py::build_client() (via
        # bundle_approval_service.py/bundle_version_service.py/usage_aggregator_service.py,
        # consumer-group provisioning), the same function the core-bundle-seeder Job calls
        # (see templates/core-bundle-seeder-job.yaml's identical block) -- without this
        # override this container inherits the plaintext VALKEY_URL from envFrom's
        # secretRef above and crashes the first time any of those call sites run, with
        # "VALKEY_URL must use rediss://" (SECURITY_TRANSPORT_TLS defaults true).
        - name: VALKEY_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: VALKEY_URL_TLS
        - name: VALKEY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: REDIS_PASSWORD
        {{- end }}
        {{- if .Values.modules.bot.enabled }}
        - name: MODULE_LOAD_BOT
          value: "true"
        {{- end }}
        {{- if .Values.modules.social.enabled }}
        - name: MODULE_LOAD_SOCIAL
          value: "true"
        {{- end }}
        {{- if .Values.modules.customer.enabled }}
        - name: MODULE_LOAD_CUSTOMER
          value: "true"
        {{- end }}
        {{- if .Values.modules.marketing.enabled }}
        - name: MODULE_LOAD_MARKETING
          value: "true"
        {{- end }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          # fix/chart-fresh-install-hooks (alpha 2026-10-01) -- /ready (hub_api/app.py),
          # not /health: gated on BootstrapStatus.is_ready so K8s never routes traffic to
          # hub-api until the schema is confirmed at head. livenessProbe stays on
          # flask_core's /health above -- a schema that's legitimately SCHEMA_BEHIND
          # (waiting on an operator-run migrate hook) must not get this pod killed.
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.pipeline.hubApi.resources | nindent 10 }}
        volumeMounts:
        - name: logs
          mountPath: /var/log/waddlebotlog
        - name: tmp
          mountPath: /tmp
        {{- if eq (include "waddlebot.valkeyTlsMaterialAvailable" .) "true" }}
        {{- include "waddlebot.valkeyTlsCaVolumeMount" . | nindent 8 }}
        {{- end }}
        {{- include "waddlebot.hubApiGrpcTlsVolumeMount" . | nindent 8 }}
      volumes:
      - name: logs
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      {{- if eq (include "waddlebot.valkeyTlsMaterialAvailable" .) "true" }}
      {{- include "waddlebot.valkeyTlsCaVolume" . | nindent 6 }}
      {{- end }}
      {{- include "waddlebot.hubApiGrpcTlsVolume" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "waddlebot.fullname" . }}-hub-api-v3
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub-api
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.pipeline.hubApi.port }}
    targetPort: http
    protocol: TCP
    name: http
  - port: {{ .Values.pipeline.hubApi.grpcPort }}
    targetPort: grpc
    protocol: TCP
    name: grpc
  selector:
    {{- include "waddlebot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: hub-api
{{- end }}

# Bundle egress gateway — CiliumNetworkPolicy layer (feature/bundle-egress-gateway).
# Same convention as templates/bundle-executor-networkpolicy.yaml (devops-kubernetes.md
# Cluster Security Baseline / security.md Kubernetes Network Security — CiliumNetworkPolicy,
# never plain NetworkPolicy). Additive on top of templates/network-policies.yaml's namespace-
# wide plain-NetworkPolicy pair.
#
# Data-plane pods (svc-ingest/svc-process/svc-action, Rust and legacy per-module Deployments
# performing the same role — see egressPolicy.dataPlaneComponents) are default-deny for
# egress to the internet. Their only way out is in-cluster dependencies (DNS, Valkey,
# Postgres, hub-api gRPC, SeaweedFS, OTel collector) plus the egress-proxy Service. The egress
# proxy is the ONLY component in this chart allowed a broad "world" egress rule, and even
# that is capped to 80/443/6697 with loopback/link-local/metadata/cluster-CIDR carve-outs
# (egressPolicy.denyCidrs/clusterCidrs).
#
# Per-tenant/app FQDN and private-IP grants (net.http.fqdn/.public-ip/.private-ip) are NOT
# enforced here — Cilium CNPs are cluster-wide L3/L4/DNS policy and can't see which bundle/
# tenant a proxied request belongs to. That check lives in the egress-proxy's signed-
# allowlist re-check (templates/infrastructure/egress-proxy.yaml). This file is the network-
# level backstop: even a fully compromised data-plane pod cannot open a socket to the
# internet, loopback, link-local/metadata, or another pod/node's cluster-internal address
# directly — and even a fully compromised egress-proxy host cannot reach those same deny
# ranges, regardless of what a forged/replayed allowlist header claims.
{{- if .Values.egressPolicy.enabled }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "waddlebot.fullname" . }}-dataplane-egress-deny
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          {{- toYaml .Values.egressPolicy.dataPlaneComponents | nindent 10 }}
  egress:
    # DNS — required to resolve in-cluster Service names.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: {{ .Values.egressPolicy.inCluster.dnsPort | quote }}
              protocol: UDP
            - port: {{ .Values.egressPolicy.inCluster.dnsPort | quote }}
              protocol: TCP
    # In-namespace infra: Valkey, Postgres, SeaweedFS. These infra Deployments
    # label pods with app.kubernetes.io/name: redis|postgres|seaweedfs directly
    # (NOT the chart-wide selectorLabels name — see
    # templates/infrastructure/{redis,postgres,seaweedfs}.yaml's own pod
    # template labels), so match on instance + name + component, not the
    # shared selector helper.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/name: redis
            app.kubernetes.io/component: cache
      toPorts:
        - ports:
            - port: {{ .Values.egressPolicy.inCluster.valkeyPort | quote }}
              protocol: TCP
    {{- /*
      Valkey dual-listener TLS port. Rust data-plane pods use
      rediss://<svc>:<tls.port> when TLS material is available; permit that
      listener only under the same condition used by the deployment and clients.
    */}}
    {{- if eq (include "waddlebot.valkeyTlsMaterialAvailable" .) "true" }}
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/name: redis
            app.kubernetes.io/component: cache
      toPorts:
        - ports:
            - port: {{ .Values.infrastructure.redis.tls.port | quote }}
              protocol: TCP
    {{- end }}
    {{- if .Values.infrastructure.valkeyDurable.enabled }}
    # Durable delivery-state Valkey (templates/infrastructure/valkey-durable.yaml): spine
    # streams / transport queues / acks. TLS port only when TLS is on (plaintext listener is
    # disabled server-side); plaintext port only in the TLS-off local/ci path.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/name: valkey-durable
            app.kubernetes.io/component: delivery-store
      toPorts:
        - ports:
            {{- if eq (include "waddlebot.valkeyTlsMaterialAvailable" .) "true" }}
            - port: {{ .Values.infrastructure.redis.tls.port | quote }}
              protocol: TCP
            {{- else }}
            - port: {{ .Values.egressPolicy.inCluster.valkeyPort | quote }}
              protocol: TCP
            {{- end }}
    {{- end }}
    {{- if .Values.infrastructure.valkeyKv.enabled }}
    # Dedicated bundle-kv Valkey (templates/infrastructure/valkey-kv.yaml): quota counters.
    # TLS port only when TLS is on (plaintext listener disabled server-side).
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/name: valkey-kv
            app.kubernetes.io/component: kv-store
      toPorts:
        - ports:
            {{- if eq (include "waddlebot.valkeyTlsMaterialAvailable" .) "true" }}
            - port: {{ .Values.infrastructure.redis.tls.port | quote }}
              protocol: TCP
            {{- else }}
            - port: {{ .Values.egressPolicy.inCluster.valkeyPort | quote }}
              protocol: TCP
            {{- end }}
    {{- end }}
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/name: postgres
            app.kubernetes.io/component: database
      toPorts:
        - ports:
            - port: {{ .Values.egressPolicy.inCluster.postgresReplicaPort | quote }}
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/name: seaweedfs
            app.kubernetes.io/component: storage
      toPorts:
        - ports:
            - port: {{ .Values.egressPolicy.inCluster.seaweedfsPort | quote }}
              protocol: TCP
    # hub-api gRPC + HTTP readiness (the wait-for-hub-api init container probes
    # /ready on the HTTP port; without it every data-plane pod sticks in Init).
    - toEndpoints:
        - matchLabels:
            {{- include "waddlebot.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: hub-api
      toPorts:
        - ports:
            - port: {{ .Values.egressPolicy.inCluster.hubApiGrpcPort | quote }}
              protocol: TCP
            - port: {{ .Values.egressPolicy.inCluster.hubApiHttpPort | quote }}
              protocol: TCP
    # feature/alpha-localized-posthog -- in-cluster PostHog (feature-flag
    # execution plane), reached directly by svc-process-rust/svc-action-rust's
    # penguin_licensing client (POSTHOG_HOST), not proxied through
    # egress-proxy (that path is for bundle-initiated HTTP egress only). Only
    # rendered when posthog.enabled=true; when false, POSTHOG_HOST resolves
    # to the external hosted license.penguintech.io and these dataplane pods
    # have no route to it under this CNP either way (pre-existing, unrelated
    # to this change -- those calls already degrade to cached/default per
    # penguin_licensing's own fail-open-to-cache semantics).
    {{- if .Values.posthog.enabled }}
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/name: posthog-web
      toPorts:
        - ports:
            - port: {{ .Values.posthog.web.port | quote }}
              protocol: TCP
    {{- end }}
    # OTel collector (logs/metrics/traces — mandatory emission, never the
    # public internet). Not yet deployed by this chart (otel.collector.enabled
    # stub); pre-allowed so no further CNP change is needed once it lands.
    {{- if .Values.otel.collector.enabled }}
    - toEndpoints:
        - matchLabels:
            {{- include "waddlebot.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: otel-collector
      toPorts:
        - ports:
            - port: {{ .Values.egressPolicy.inCluster.otelGrpcPort | quote }}
              protocol: TCP
    {{- end }}
    # The egress proxy — the only path to the outside world.
    - toEndpoints:
        - matchLabels:
            {{- include "waddlebot.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: egress-proxy
      toPorts:
        - ports:
            - port: {{ .Values.egressProxy.port | quote }}
              protocol: TCP
---
# Discord gateway egress for svc-ingest-rust ONLY (additive to dataplane-egress-deny; Cilium
# policies union). toFQDNs needs the DNS lookups proxied (rules.dns), so this policy carries
# its own kube-dns rule with a matchPattern -- the shared deny CNP's DNS rule is untouched.
# Scoped: 443/TCP to the named Discord hosts only, no blanket world egress.
{{- if .Values.egressPolicy.discordGateway.enabled }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "waddlebot.fullname" . }}-ingest-discord-egress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: svc-ingest-rust
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: {{ .Values.egressPolicy.inCluster.dnsPort | quote }}
              protocol: UDP
            - port: {{ .Values.egressPolicy.inCluster.dnsPort | quote }}
              protocol: TCP
          rules:
            dns:
              {{- range .Values.egressPolicy.discordGateway.fqdns }}
              - matchName: {{ . | quote }}
              {{- end }}
    - toFQDNs:
        {{- range .Values.egressPolicy.discordGateway.fqdns }}
        - matchName: {{ . | quote }}
        {{- end }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
{{- end }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "waddlebot.fullname" . }}-egress-proxy-egress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "waddlebot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: egress-proxy
  egress:
    # DNS to resolve the external hostnames it's proxying to.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: {{ .Values.egressPolicy.inCluster.dnsPort | quote }}
              protocol: UDP
            - port: {{ .Values.egressPolicy.inCluster.dnsPort | quote }}
              protocol: TCP
    # The world — minus loopback/link-local/metadata and this cluster's own
    # pod/service/node CIDRs. Customer private ranges (net.http.private-ip
    # grants) are intentionally reachable at the network level; the
    # per-tenant/app check that a given private IP was actually granted
    # happens in the proxy's signed-allowlist re-check, not here — this CNP
    # only guarantees the proxy can NEVER reach loopback/link-local/metadata/
    # this cluster's own CIDRs, no matter what a request claims.
    # (R5: v4/v6 carve-outs split into separate cidr entries -- Cilium requires every `except`
    # to be a subnet of its cidr; `::1/128`/`fe80::/10` under `0.0.0.0/0` was invalid.)
    - toCIDRSet:
        {{- include "waddlebot.splitCidrSet" (concat .Values.egressPolicy.denyCidrs (list .Values.egressPolicy.clusterCidrs.podCidr .Values.egressPolicy.clusterCidrs.serviceCidr .Values.egressPolicy.clusterCidrs.nodeCidr)) | nindent 8 }}
      toPorts:
        - ports:
            {{- range .Values.egressProxy.allowedPorts }}
            - port: {{ . | quote }}
              protocol: TCP
            {{- end }}
---
{{- if .Values.pipeline.rustDataPlane.svcIngest.dynamicConnections.enabled }}
# feature/edge-reshape-chunk2-twitch-inbound -- hub-api HTTP egress for svc-ingest-rust ONLY.
# hub-api's HTTP port carries the internal provider-connections routes (list bindings /
# resolve token) and /internal/service-token used by svc-ingest's per-community Twitch
# sessions. Deliberately NOT part of dataplane-egress-deny (which selects every dataplane
# component): granting it there would hand hub-api HTTP to every dataplane pod. Cilium
# unions allows across CNPs selecting the same endpoint, so this adds to that baseline.
# svc-action has its OWN sibling policy below -- never widen this one.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "waddlebot.fullname" . }}-svc-ingest-hubapi-http-egress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "waddlebot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: svc-ingest-rust
  egress:
    - toEndpoints:
        - matchLabels:
            {{- include "waddlebot.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: hub-api
      toPorts:
        - ports:
            - port: {{ .Values.pipeline.hubApi.port | quote }}
              protocol: TCP
{{- end }}
---
{{- if .Values.pipeline.rustDataPlane.svcAction.dynamicConnections.enabled }}
# hub-api HTTP egress for svc-action ONLY: its per-send community credential resolution
# (connections:resolve via /internal/service-token + the provider-connections routes) calls
# hub-api's HTTP port. Own policy, not dataplane-wide -- see the svc-ingest policy above.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "waddlebot.fullname" . }}-svc-action-hubapi-http-egress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "waddlebot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: svc-action
  egress:
    - toEndpoints:
        - matchLabels:
            {{- include "waddlebot.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: hub-api
      toPorts:
        - ports:
            - port: {{ .Values.pipeline.hubApi.port | quote }}
              protocol: TCP
{{- end }}
{{- end }}

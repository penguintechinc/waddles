{{- if .Values.networkPolicy.enabled }}
# R5 posture -- namespace default-deny ingress, as a CiliumNetworkPolicy (house rule: never a plain
# K8s NetworkPolicy; every cluster targets Cilium). This replaces the old plain-NetworkPolicy pair
# (`default-deny-ingress` + `allow-same-namespace-and-ingress`): the broad allow-all-ports
# same-namespace rule is GONE. Each workload instead gets its own per-port allow, rendered next to the
# workload by `waddlebot.workloadPolicies` (templates/_networkpolicy.tpl): same-namespace callers
# on the workload's declared containerPort(s) only, plus the ingress controller / Gateway on those same
# ports for `networkPolicy.externalIngressComponents`. Pods with no per-workload policy (Jobs/CronJobs
# have no listeners; spire ships its own CNPs) get nothing inbound -- default deny.
# An empty ingress rule (`- {}`) is Cilium's documented "select, allow nothing" default-deny form.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: waddlebot
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  endpointSelector: {}
  ingress:
    - {}
{{- end }}

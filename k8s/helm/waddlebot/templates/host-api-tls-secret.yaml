# feature/e2e-helm-rust-dataplane (original) + fix/alpha-host-api-tls (lookup/generate) --
# Static host-API mTLS cert Secret (the default path, global.hostApiTls.certManager.
# enabled=false). Mirrors templates/infrastructure/valkey-tls-secret.yaml's KEEP-vs-
# GENERATE-vs-REQUIRE policy exactly, but for a SEPARATE identity: the bundle-executor<->
# stage host-API wire protocol (core/bundle_executor/src/tls.rs dialing
# core/svc_action/src/host_api.rs / core/svc_process/src/host_api.rs), never the gRPC
# transport. Mounted by templates/svc-action-rust.yaml + templates/svc-process-rust.yaml
# (server role) and templates/bundle-executor.yaml + templates/bundle-executor-action.yaml
# (client role) at /etc/waddlebot/host-api-tls (see _helpers.tpl's waddlebot.hostApiTls*
# helpers). UNLIKE global.valkeyTls (server-auth-only), this is mutual TLS -- one identity
# cert (usages: server auth + client auth) serves both roles, so a single Secret/CA pair is
# mounted into every consumer regardless of role, matching cert-manager's own fixed Secret
# key names (ca.crt/tls.crt/tls.key) so both provisioning paths are interchangeable.
#
# Policy:
#   1. Secret already exists, is COMPLETE (waddlebot.tlsSecretComplete), AND its
#      waddlebot.io/cert-identity / waddlebot.io/cert-sans-sha256 annotations match the
#      identity/SANs this render currently wants (waddlebot.tlsSecretIdentityMatches) ->
#      KEPT untouched, never re-templated (avoids fighting an ExternalSecret/SealedSecret/
#      prior revision for ownership of the same object).
#   1b. fix/cert-regen-on-identity-change -- Secret exists and is complete, but those
#      annotations are MISSING (pre-dates this fix) or MISMATCHED (the desired identity or
#      SAN list changed since the Secret was minted -- e.g. fix/chart-host-api-stage-
#      identity's CN pin) -> alpha/local falls through to branch 4 below and mints a fresh
#      cert under the SAME Secret name (Helm already owns this object from the prior
#      generate, so this is a normal managed update, not an adopt); beta/gamma/production
#      instead FAILS closed with an actionable message (waddlebot.tlsSecretStaleFailsClosed)
#      rather than silently keeping a cert pinned to the wrong identity forever. This is the
#      exact gap fix/chart-host-api-stage-identity and fix/no-empty-kept-secrets left open:
#      alpha's live waddlebot-host-api-tls Secret was COMPLETE under the OLD `waddlebot` CN,
#      so plain completeness was never going to catch it.
#   2. global.hostApiTls.ca.crt/tls.crt/tls.key all explicitly supplied via values
#      (--set-file, out-of-git override, or an ExternalSecret writing into .Values via a
#      values-producing controller) -> rendered from those, annotated keep so a future
#      upgrade without --set-file re-supplied still takes the lookup branch.
#   3. global.hostApiTls.externalSecret: true -> skipped; an out-of-band controller owns
#      this exact Secret name and will populate it before svc-action-rust/svc-process-rust/
#      bundle-executor start.
#   4. global.deploymentTier is alpha/local -> generated with Helm's own genCA/genSignedCert
#      builtins (RSA -- Sprig has no ECDSA cert generator; rustls's `ring` provider used by
#      core/svc_process, core/svc_action, core/bundle_executor verifies RSA certs without
#      issue, confirmed against their rustls-pki-types usage -- same conclusion as
#      valkey-tls-secret.yaml), SANs covering every consumer Service's short DNS name plus a
#      namespace-wide wildcard (mirrors templates/host-api-tls-certificate.yaml's cert-
#      manager dnsNames list exactly -- both sourced from the shared
#      waddlebot.hostApiTlsDesiredDnsNames helper so they can never drift apart -- so both
#      paths mint functionally equivalent certs), 365-day validity (alpha/local only --
#      short-lived is fine, chart auto-renews nothing today and re-provisioning here is a
#      non-event).
#   5. Otherwise (beta/gamma/production, no material, not delegated) -> render fails closed
#      with an actionable message. NEVER a literal cert/key committed to git in ANY
#      environment -- unlike global.grpcTls, there is no insecureDev/plaintext escape hatch
#      on either side of this wire protocol (core/svc_action/src/host_api.rs
#      build_server_config and core/bundle_executor/src/tls.rs build_client_config both fail
#      closed without real material), so beta/gamma/production MUST supply real material or
#      delegate to cert-manager/ExternalSecret before pipeline.rustDataPlane.enabled=true.
#
# When global.hostApiTls.certManager.enabled=true, cert-manager (templates/
# host-api-tls-certificate.yaml) owns this exact Secret name instead and this template
# no-ops to avoid a competing owner for the same object.
{{- if and .Values.pipeline.rustDataPlane.enabled (not .Values.global.hostApiTls.certManager.enabled) }}
{{- $tier := .Values.global.deploymentTier }}
{{- $canGenerate := or (eq $tier "alpha") (eq $tier "local") }}
{{- $secretName := printf "%s-host-api-tls" (include "waddlebot.fullname" .) }}
{{- $ht := .Values.global.hostApiTls }}
{{- $ns := .Values.namespace }}
{{- $fullname := include "waddlebot.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Values.namespace $secretName }}
{{- $desiredIdentity := include "waddlebot.hostApiStageIdentity" . }}
{{- $desiredSansHash := include "waddlebot.hostApiTlsSansSha256" . }}
{{- /* genSignedCert needs a real []interface{}; splitList on the comma-joined helper
string yields []string, which genSignedCert rejects -- rebuild inline instead, kept
byte-for-byte identical to waddlebot.hostApiTlsDesiredDnsNames's own list. */}}
{{- $desiredDnsNames := list (printf "%s-svc-process-rust" $fullname) (printf "%s-svc-action-rust" $fullname) (printf "%s-bundle-executor" $fullname) (printf "*.%s.svc.cluster.local" $ns) }}
{{- $identityCurrent := include "waddlebot.tlsSecretIdentityMatches" (dict "existing" $existing "identity" $desiredIdentity "sansSha256" $desiredSansHash) }}
{{- if $identityCurrent }}
# Kept as-is -- {{ $secretName }} already exists (helm.sh/resource-policy: keep means it
# also survived any prior `helm uninstall`), is a COMPLETE ca.crt/tls.crt/tls.key bundle,
# and its waddlebot.io/cert-identity/waddlebot.io/cert-sans-sha256 annotations match the
# identity/SANs this render currently wants. Not re-templated on purpose, see policy
# comment above.
{{- else if eq (include "waddlebot.tlsSecretStaleFailsClosed" (dict "existing" $existing "identity" $desiredIdentity "sansSha256" $desiredSansHash "canGenerate" $canGenerate)) "true" }}
{{- /* regression: kept host-api cert with stale CN after identity pin change (alpha 2026-10-02) */}}
{{- fail (printf "global.hostApiTls: Secret %q in namespace %q is COMPLETE but its waddlebot.io/cert-identity/waddlebot.io/cert-sans-sha256 annotations are missing or stale (desired identity=%q sans-sha256=%q), and global.deploymentTier=%q is outside alpha/local -- this chart will not silently keep a Secret pinned to the wrong identity, nor silently regenerate it outside alpha/local. Rotate the certificate (via cert-manager: set global.hostApiTls.certManager.enabled=true; or your ExternalSecret/SealedSecret controller) so it carries the new identity/SANs, or set global.hostApiTls.stageIdentity explicitly to match the live cert's actual CN if it is still current, then helm upgrade again." $secretName .Values.namespace $desiredIdentity $desiredSansHash $tier) }}
{{- else if and $ht.ca.crt $ht.tls.crt $ht.tls.key }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: host-api-tls
  annotations:
    helm.sh/resource-policy: keep
    waddlebot.io/cert-identity: {{ $desiredIdentity | quote }}
    waddlebot.io/cert-sans-sha256: {{ $desiredSansHash | quote }}
type: Opaque
stringData:
  ca.crt: {{ $ht.ca.crt | quote }}
  tls.crt: {{ $ht.tls.crt | quote }}
  tls.key: {{ $ht.tls.key | quote }}
{{- else if $ht.externalSecret }}
# Skipped -- {{ $secretName }} does not exist yet, but global.hostApiTls.externalSecret is
# true, meaning an ExternalSecret/SealedSecret controller owns and will populate it.
{{- else if not $canGenerate }}
{{- fail (printf "global.hostApiTls: Secret %q not found in namespace %q, no ca.crt/tls.crt/tls.key supplied via values, and global.deploymentTier=%q is outside alpha/local -- auto-generation is alpha/local only. Either supply real material (helm upgrade --set-file global.hostApiTls.ca.crt=... --set-file global.hostApiTls.tls.crt=... --set-file global.hostApiTls.tls.key=...), point an ExternalSecret/SealedSecret at this Secret name and set global.hostApiTls.externalSecret=true, or fix global.deploymentTier if this really is alpha/local." $secretName .Values.namespace $tier) }}
{{- else }}
{{- $ca := genCA (printf "%s-host-api-ca" $fullname) 365 }}
{{- $cert := genSignedCert $desiredIdentity nil $desiredDnsNames 365 $ca }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: host-api-tls
  annotations:
    # Survives `helm uninstall` and is never re-generated/rotated by a future
    # `helm upgrade` unless the identity/SANs change -- see
    # waddlebot.tlsSecretIdentityMatches.
    helm.sh/resource-policy: keep
    waddlebot.io/cert-identity: {{ $desiredIdentity | quote }}
    waddlebot.io/cert-sans-sha256: {{ $desiredSansHash | quote }}
type: Opaque
stringData:
  ca.crt: {{ $ca.Cert | quote }}
  tls.crt: {{ $cert.Cert | quote }}
  tls.key: {{ $cert.Key | quote }}
{{- end }}
{{- end }}

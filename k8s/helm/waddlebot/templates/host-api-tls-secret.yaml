# feature/e2e-helm-rust-dataplane -- Static host-API mTLS cert Secret (the default path,
# global.hostApiTls.certManager.enabled=false). Mirrors templates/grpc-tls-secret.yaml's
# shape exactly, but for a SEPARATE identity: the bundle-executor<->stage host-API wire
# protocol (core/bundle_executor/src/tls.rs dialing core/svc_action/src/host_api.rs),
# never the gRPC transport. Mounted by templates/svc-action-rust.yaml (server role) and
# templates/bundle-executor.yaml (client role) at /etc/waddlebot/host-api-tls (see
# _helpers.tpl's waddlebot.hostApiTls* helpers). Key names (ca.crt/tls.crt/tls.key) match
# cert-manager's own fixed Secret output so both paths are interchangeable to every
# Deployment without it knowing which one populated it -- one identity cert (server auth +
# client auth) serves both roles, same as the gRPC identity.
#
# NEVER a literal cert/key in git in ANY environment, alpha included -- unlike
# global.grpcTls, the Rust host-API code on both ends has NO insecureDev/plaintext escape
# hatch (core/svc_action/src/host_api.rs build_server_config and
# core/bundle_executor/src/tls.rs build_client_config both fail closed without real
# material). Populate via `helm upgrade --set-file global.hostApiTls.ca.crt=...
# --set-file global.hostApiTls.tls.crt=... --set-file global.hostApiTls.tls.key=...`
# (or an out-of-git values override / ExternalSecrets/SealedSecrets) before setting
# pipeline.rustDataPlane.enabled=true anywhere.
#
# When global.hostApiTls.certManager.enabled=true, cert-manager (templates/
# host-api-tls-certificate.yaml) owns this exact Secret name instead and this template
# no-ops to avoid a competing owner for the same object.
{{- if not .Values.global.hostApiTls.certManager.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "waddlebot.fullname" . }}-host-api-tls
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: host-api-tls
type: Opaque
stringData:
  ca.crt: {{ .Values.global.hostApiTls.ca.crt | quote }}
  tls.crt: {{ .Values.global.hostApiTls.tls.crt | quote }}
  tls.key: {{ .Values.global.hostApiTls.tls.key | quote }}
{{- end }}

{{- if .Values.modules.interactiveProductivity.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "waddlebot.fullname" . }}-interactive-productivity
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: interactive-productivity
spec:
  replicas: {{ .Values.modules.interactiveProductivity.replicas }}
  selector:
    matchLabels:
      {{- include "waddlebot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: interactive-productivity
  template:
    metadata:
      labels:
        {{- include "waddlebot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: interactive-productivity
    spec:
      serviceAccountName: {{ include "waddlebot.serviceAccountName" . }}
      {{- include "waddlebot.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
      # fix/chart-fresh-install-hooks (alpha 2026-10-01) -- waits on hub-api's own /ready.
      {{- include "waddlebot.waitForHubApiInitContainer" . | nindent 6 }}
      containers:
      - name: interactive-productivity
        image: "{{ include "waddlebot.legacyModuleImage" (dict "root" . "module" "interactive-productivity" "imageTag" .Values.modules.interactiveProductivity.imageTag) }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        ports:
        - name: http
          containerPort: 8030
          protocol: TCP
        - name: grpc
          containerPort: 50033
          protocol: TCP
        envFrom:
        - configMapRef:
            name: {{ include "waddlebot.fullname" . }}-config
        - secretRef:
            name: {{ include "waddlebot.fullname" . }}-secrets
        env:
        # H-1/H-3 -- this workload's OWN least-privilege database identity (role waddles_legacy_interactive_productivity;
        # config/postgres/service-roles.yaml). Overrides the envFrom block above; the database
        # owner/superuser credential is NOT in waddlebot-secrets any more.
{{- include "waddlebot.dbEnv" (dict "root" . "role" "waddles_legacy_interactive_productivity") | nindent 8 }}
        - name: MODULE_NAME
          value: "interactive-productivity"
        - name: MODULE_PORT
          value: "8030"
        - name: GRPC_PORT
          value: "50033"
        {{- include "waddlebot.grpcTlsInsecureDevEnv" . | nindent 8 }}
        {{- if eq (include "waddlebot.grpcTlsMaterialAvailable" .) "true" }}
        {{- include "waddlebot.grpcTlsServerEnv" . | nindent 8 }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.modules.interactiveProductivity.resources | nindent 10 }}
        volumeMounts:
        - name: logs
          mountPath: /var/log/waddlebotlog
        - name: tmp
          mountPath: /tmp
        {{- if eq (include "waddlebot.grpcTlsMaterialAvailable" .) "true" }}
        {{- include "waddlebot.grpcTlsVolumeMount" . | nindent 8 }}
        {{- end }}
      volumes:
      - name: logs
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      {{- if eq (include "waddlebot.grpcTlsMaterialAvailable" .) "true" }}
      {{- include "waddlebot.grpcTlsVolume" . | nindent 6 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "waddlebot.fullname" . }}-interactive-productivity
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: interactive-productivity
spec:
  type: ClusterIP
  ports:
  - port: 8030
    targetPort: http
    protocol: TCP
    name: http
  - port: 50033
    targetPort: grpc
    protocol: TCP
    name: grpc
  selector:
    {{- include "waddlebot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: interactive-productivity
{{- end }}

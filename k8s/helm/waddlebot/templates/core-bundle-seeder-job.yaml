# Core-bundle seeder -- post-install/post-upgrade hook Job that activates first-party
# `waddles.core.*` App Bundles (hub_api/cli/seed_core_bundles.py) under the platform's SYSTEM
# identity, no human global-admin approval. Runs AFTER templates/migrations-job.yaml, now
# that both are post-install hooks (2026-10-01 user decision: the schema always comes from
# that Job, fresh install included) -- ordering between them is by hook-weight within the
# SAME post-install phase (migrate's SA/Secret at -10, migrate itself at -5,
# seaweedfs-bucket-init at 1, this Job at 5), not by phase separation: Helm runs a phase's
# hooks strictly by ascending weight, waiting for each to complete before the next starts,
# so 0020-0026's tables are guaranteed to exist here. This Job ALSO waits on hub-api's own
# `/ready` (initContainer below) even though it talks to Postgres/SeaweedFS/Valkey directly,
# never hub-api's HTTP API -- the wait is for the schema-observation signal hub-api's
# bootstrap exposes, which only flips true once this Job has already run, giving a second,
# independent confirmation beyond hook-wait ordering alone.
{{- if .Values.pipeline.coreBundleSeeder.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "waddlebot.fullname" . }}-core-bundle-seeder
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: core-bundle-seeder
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    # fix/helm-hook-rbac-ordering audit: this Job's serviceAccountName (shared
    # "waddlebot" SA) plus its configMapRef/secretRef below are all plain/regular
    # resources, unlike auto-provisioned-keys-job.yaml/migrations-job.yaml -- but
    # because this hook is post-install/post-upgrade, Helm has already created every
    # regular resource by the time it fires, so no ordering gap exists here.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.pipeline.coreBundleSeeder.backoffLimit }}
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "waddlebot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: core-bundle-seeder
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "waddlebot.serviceAccountName" . }}
      {{- include "waddlebot.imagePullSecrets" . | nindent 6 }}
      # Explicit (not a `toYaml .Values.podSecurityContext` reference) so this Job's rootless
      # posture is self-evident from this file alone, per devops-kubernetes.md's mandatory
      # baseline -- values match .Values.podSecurityContext's own defaults verbatim.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # fix/chart-fresh-install-hooks (alpha 2026-10-01) -- waits on hub-api's own
      # /ready before this pod's main container starts (see _helpers.tpl).
      initContainers:
      {{- include "waddlebot.waitForHubApiInitContainer" . | nindent 6 }}
      containers:
      - name: core-bundle-seeder
        image: "{{ include "waddlebot.legacyModuleImage" (dict "root" . "module" "core-bundle-seeder" "imageTag" .Values.global.imageTag) }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        # Explicit (not a `toYaml .Values.securityContext` reference) for the same reason as
        # the pod-level securityContext above -- also adds a container-level seccompProfile,
        # which the shared .Values.securityContext does not itself carry (only the pod-level
        # block does); belt-and-suspenders since seccomp is inherited from the pod either way.
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        envFrom:
        - configMapRef:
            name: {{ include "waddlebot.fullname" . }}-config
        - secretRef:
            name: {{ include "waddlebot.fullname" . }}-secrets
        env:
        - name: MODULE_NAME
          value: "core-bundle-seeder"
        # regression: bundle publish/fetch bucket split after SeaweedFS migration (#508/#509) --
        # this Job calls services/bundle_version_service.py::create_version()/
        # process_prebuilt_component() -> storage_service.upload_bundle_component(), the exact
        # same S3 write path hub-api.yaml's Deployment uses -- but unlike that Deployment, this
        # Job previously had NO explicit S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY override, so
        # storage_service._client() fell back to os.getenv(..., "") (empty credentials): every
        # core-bundle seed attempt failed with botocore InvalidAccessKeyId, silently swallowed
        # into the generic "core-bundle-seeder: bundle failed" log line (hand-rolled `logging`
        # drops `extra`, see hub_api/cli/seed_core_bundles.py). Same least-privilege "hub-api"
        # S3 identity hub-api.yaml uses (Read/Write/List/Tagging, scoped to S3_BUCKET_NAME AND
        # BUNDLE_BUCKET_NAME -- see templates/infrastructure/seaweedfs.yaml), not the
        # envFrom.secretRef block above (that Secret carries no plain S3_ACCESS_KEY_ID/
        # S3_SECRET_ACCESS_KEY key at all since the former unscoped admin identity was removed).
        - name: S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: HUB_API_S3_ACCESS_KEY_ID
        - name: S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: HUB_API_S3_SECRET_ACCESS_KEY
        {{- if eq (include "waddlebot.valkeyTlsMaterialAvailable" .) "true" }}
        # regression: seeder VALKEY_URL REPLACE_ME / missing TLS wiring -- this Job calls
        # services/bundle_version_service.py::create_version()/process_prebuilt_component()
        # -> valkey_admin_client.build_client() (consumer-group provisioning), the exact
        # same function hub-api's Deployment calls -- see templates/hub-api.yaml's identical
        # block for the full rationale. Without this override the Job inherited the
        # plaintext VALKEY_URL from envFrom's secretRef above and crashed at
        # valkey_admin_client.build_client() with "VALKEY_URL must use rediss://" (hub_api/
        # services/valkey_admin_client.py's SECURITY_TRANSPORT_TLS=true-by-default check).
        - name: VALKEY_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: VALKEY_URL_TLS
        - name: VALKEY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: REDIS_PASSWORD
        {{- end }}
        # Platform connections (services/ingest_source_service.py::ensure_ingest_source(),
        # NO credentials/tokens stored -- see hub_api/cli/seed_core_bundles.py's own module
        # docstring) -- sourced from the seeder's OWN dedicated
        # pipeline.coreBundleSeeder.platformConnections value (fix/preexisting-test-failures),
        # never from rustDataPlane.svcProcess's legacy processIngestPlatform/processIngestSourceId
        # fields (removed from alpha by PR #538 now that the DB-driven multi-tenant
        # active-bundle loader is the sole bundle-selection path there -- see
        # values-alpha.yaml's rustDataPlane.svcProcess comment). Keeping the seeder's ingest
        # sources on their own value means this Job still registers them even when
        # svc-process's legacy single-app env is intentionally empty. Omitted entirely (no env
        # var) when the list is empty, so the seeder falls back to `bundles/core-bundles.yaml`'s
        # own (empty by default) static `platform_connections:` list.
        {{- if .Values.pipeline.coreBundleSeeder.platformConnections }}
        {{- $connections := list }}
        {{- range .Values.pipeline.coreBundleSeeder.platformConnections }}
        {{- $connections = append $connections (dict
              "tenant_slug" (.tenantSlug | default $.Values.pipeline.coreBundleSeeder.defaultTenantSlug | default "global")
              "community_id" (.communityId | default nil)
              "platform" .platform
              "source_id" .sourceId
              "label" (.label | default (printf "%s platform connection" .platform))
            ) }}
        {{- end }}
        - name: CORE_BUNDLES_PLATFORM_CONNECTIONS
          value: {{ toJson $connections | quote }}
        {{- end }}
        {{- if .Values.pipeline.coreBundleSeeder.tenantSlugs }}
        - name: CORE_BUNDLES_TENANT_SLUGS
          value: {{ .Values.pipeline.coreBundleSeeder.tenantSlugs | quote }}
        {{- end }}
        resources:
          {{- toYaml .Values.pipeline.coreBundleSeeder.resources | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        {{- if eq (include "waddlebot.valkeyTlsMaterialAvailable" .) "true" }}
        {{- include "waddlebot.valkeyTlsCaVolumeMount" . | nindent 8 }}
        {{- end }}
      volumes:
      - name: tmp
        emptyDir: {}
      {{- if eq (include "waddlebot.valkeyTlsMaterialAvailable" .) "true" }}
      {{- include "waddlebot.valkeyTlsCaVolume" . | nindent 6 }}
      {{- end }}
{{- end }}

# Core-bundle seeder -- post-install/post-upgrade hook Job that activates first-party
# `waddles.core.*` App Bundles (hub_api/cli/seed_core_bundles.py) under the platform's SYSTEM
# identity, no human global-admin approval. Runs AFTER templates/migrations-job.yaml (a
# pre-install/pre-upgrade hook -- Helm always finishes the pre-* hook phase before starting the
# post-* phase, so 0020-0026's tables are guaranteed to exist here with no explicit weight
# ordering needed against that other Job) and independently of the hub-api Deployment's own
# readiness -- this Job talks to Postgres/SeaweedFS/Valkey directly, never hub-api's HTTP API.
{{- if .Values.pipeline.coreBundleSeeder.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "waddlebot.fullname" . }}-core-bundle-seeder
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: core-bundle-seeder
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    # fix/helm-hook-rbac-ordering audit: this Job's serviceAccountName (shared
    # "waddlebot" SA) plus its configMapRef/secretRef below are all plain/regular
    # resources, unlike auto-provisioned-keys-job.yaml/migrations-job.yaml -- but
    # because this hook is post-install/post-upgrade, Helm has already created every
    # regular resource by the time it fires, so no ordering gap exists here.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.pipeline.coreBundleSeeder.backoffLimit }}
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "waddlebot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: core-bundle-seeder
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "waddlebot.serviceAccountName" . }}
      {{- include "waddlebot.imagePullSecrets" . | nindent 6 }}
      # Explicit (not a `toYaml .Values.podSecurityContext` reference) so this Job's rootless
      # posture is self-evident from this file alone, per devops-kubernetes.md's mandatory
      # baseline -- values match .Values.podSecurityContext's own defaults verbatim.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: core-bundle-seeder
        image: "{{ include "waddlebot.legacyModuleImage" (dict "root" . "module" "core-bundle-seeder" "imageTag" .Values.global.imageTag) }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        # Explicit (not a `toYaml .Values.securityContext` reference) for the same reason as
        # the pod-level securityContext above -- also adds a container-level seccompProfile,
        # which the shared .Values.securityContext does not itself carry (only the pod-level
        # block does); belt-and-suspenders since seccomp is inherited from the pod either way.
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        envFrom:
        - configMapRef:
            name: {{ include "waddlebot.fullname" . }}-config
        - secretRef:
            name: {{ include "waddlebot.fullname" . }}-secrets
        env:
        - name: MODULE_NAME
          value: "core-bundle-seeder"
        # regression: bundle publish/fetch bucket split after SeaweedFS migration (#508/#509) --
        # this Job calls services/bundle_version_service.py::create_version()/
        # process_prebuilt_component() -> storage_service.upload_bundle_component(), the exact
        # same S3 write path hub-api.yaml's Deployment uses -- but unlike that Deployment, this
        # Job previously had NO explicit S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY override, so
        # storage_service._client() fell back to os.getenv(..., "") (empty credentials): every
        # core-bundle seed attempt failed with botocore InvalidAccessKeyId, silently swallowed
        # into the generic "core-bundle-seeder: bundle failed" log line (hand-rolled `logging`
        # drops `extra`, see hub_api/cli/seed_core_bundles.py). Same least-privilege "hub-api"
        # S3 identity hub-api.yaml uses (Read/Write/List/Tagging, scoped to S3_BUCKET_NAME AND
        # BUNDLE_BUCKET_NAME -- see templates/infrastructure/seaweedfs.yaml), not the
        # envFrom.secretRef block above (that Secret carries no plain S3_ACCESS_KEY_ID/
        # S3_SECRET_ACCESS_KEY key at all since the former unscoped admin identity was removed).
        - name: S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: HUB_API_S3_ACCESS_KEY_ID
        - name: S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: HUB_API_S3_SECRET_ACCESS_KEY
        # Platform connections (services/ingest_source_service.py::ensure_ingest_source(),
        # NO credentials/tokens stored -- see hub_api/cli/seed_core_bundles.py's own module
        # docstring) -- built from the SAME values already wired to svc-ingest's Discord guild
        # (templates/svc-process-rust.yaml's processIngestPlatform/processIngestSourceId env),
        # never a second, hand-maintained copy of the guild id. Omitted entirely (no env var)
        # when that value isn't set, so the seeder falls back to `bundles/core-bundles.yaml`'s
        # own (empty by default) static `platform_connections:` list.
        {{- if .Values.pipeline.rustDataPlane.svcProcess.processIngestSourceId }}
        {{- $connections := list (dict
              "tenant_slug" (.Values.pipeline.coreBundleSeeder.defaultTenantSlug | default "global")
              "community_id" nil
              "platform" .Values.pipeline.rustDataPlane.svcProcess.processIngestPlatform
              "source_id" .Values.pipeline.rustDataPlane.svcProcess.processIngestSourceId
              "label" "svc-ingest platform connection"
            ) }}
        - name: CORE_BUNDLES_PLATFORM_CONNECTIONS
          value: {{ toJson $connections | quote }}
        {{- end }}
        {{- if .Values.pipeline.coreBundleSeeder.tenantSlugs }}
        - name: CORE_BUNDLES_TENANT_SLUGS
          value: {{ .Values.pipeline.coreBundleSeeder.tenantSlugs | quote }}
        {{- end }}
        resources:
          {{- toYaml .Values.pipeline.coreBundleSeeder.resources | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
{{- end }}

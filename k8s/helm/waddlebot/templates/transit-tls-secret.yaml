{{- /*
feature/transit-tls-core (F1 Postgres + F5 SeaweedFS S3 + F8 CA prerequisites) -- the <fullname>-transit-tls Secret:
ca.crt (CA certificate only, NO CA key is stored), postgres.crt/postgres.key, seaweedfs.crt/seaweedfs.key. All ECDSA P-256 /
ecdsa-with-SHA256 (see templates/_transit_tls.tpl for the design and the F8 rationale).

Policy (same shape as templates/infrastructure/valkey-tls-secret.yaml):
  1. Existing Secret COMPLETE and its waddlebot.io/cert-sans-sha256 annotation matches this render -> KEPT, not re-templated.
  2. global.transitTls.ca.crt + postgres.{crt,key} + seaweedfs.{crt,key} all supplied via values -> rendered from those.
  3. global.transitTls.externalSecret=true -> skipped; an ExternalSecret/SealedSecret controller owns this exact Secret.
  4. global.deploymentTier alpha/local -> generated (ECDSA P-256, 365d; alpha is disposable, re-provisioning is a non-event).
  5. Otherwise -> the render fails closed. NEVER a literal cert/key committed to git.

It is a pre-install/pre-upgrade HOOK (weight -30): the db-migrate / hub-admin-seed hook Jobs verify-full against Postgres and
mount ca.crt, so the Secret must exist before them -- a regular resource is applied only AFTER every pre-upgrade hook ran.
Hook resources are not owned by the release, so the Secret survives `helm uninstall`; a kept (lookup) Secret emits nothing.
*/ -}}
{{- if include "waddlebot.transitTls.enabled" . }}
{{- $tier := .Values.global.deploymentTier }}
{{- $canGenerate := or (eq $tier "alpha") (eq $tier "local") }}
{{- $secretName := include "waddlebot.transitTls.secretName" . }}
{{- $tt := .Values.global.transitTls }}
{{- $existing := lookup "v1" "Secret" .Values.namespace $secretName }}
{{- $sansHash := include "waddlebot.transitTls.sansSha256" . }}
{{- $keys := list "ca.crt" "postgres.crt" "postgres.key" "seaweedfs.crt" "seaweedfs.key" }}
{{- $complete := true }}
{{- range $keys }}
{{- if not (include "waddlebot.secretKeyNonEmpty" (dict "existing" $existing "key" .)) }}{{- $complete = false }}{{- end }}
{{- end }}
{{- $annotations := dict }}
{{- if and $existing $existing.metadata }}{{- $annotations = $existing.metadata.annotations | default dict }}{{- end }}
{{- $current := and $complete (eq (get $annotations "waddlebot.io/cert-sans-sha256") $sansHash) }}
{{- $supplied := and $tt.ca.crt $tt.postgres.tls.crt $tt.postgres.tls.key $tt.seaweedfs.tls.crt $tt.seaweedfs.tls.key }}
{{- if $current }}
# Kept as-is -- {{ $secretName }} exists, is complete and its SAN/algorithm identity matches this render.
{{- else if $supplied }}
{{- include "waddlebot.transitTls.secretHead" (dict "root" . "name" $secretName "sans" $sansHash) }}
stringData:
  ca.crt: {{ $tt.ca.crt | quote }}
  postgres.crt: {{ $tt.postgres.tls.crt | quote }}
  postgres.key: {{ $tt.postgres.tls.key | quote }}
  seaweedfs.crt: {{ $tt.seaweedfs.tls.crt | quote }}
  seaweedfs.key: {{ $tt.seaweedfs.tls.key | quote }}
{{- else if $tt.externalSecret }}
# Skipped -- global.transitTls.externalSecret=true: an out-of-band controller owns {{ $secretName }}.
{{- else if not $canGenerate }}
{{- fail (printf "global.transitTls: Secret %q (namespace %q) is missing, incomplete or stale (desired sans-sha256=%q), no ca.crt/postgres/seaweedfs material was supplied via values, and global.deploymentTier=%q is outside alpha/local -- auto-generation is alpha/local only. Supply global.transitTls.ca.crt / .postgres.tls.{crt,key} / .seaweedfs.tls.{crt,key} (ECDSA P-256, SANs from templates/_transit_tls.tpl), or set global.transitTls.externalSecret=true and let an ExternalSecret/SealedSecret controller provision the Secret." $secretName .Values.namespace $sansHash $tier) }}
{{- else }}
{{- $caKey := genPrivateKey "ecdsa" }}
{{- $ca := genCAWithKey (printf "%s-transit-ca" (include "waddlebot.fullname" .)) 365 $caKey }}
{{- $pgKey := genPrivateKey "ecdsa" }}
{{- $pg := genSignedCertWithKey (.Values.infrastructure.postgresql.service.name) nil (include "waddlebot.transitTls.pgDnsNames" . | fromJsonArray) 365 $ca $pgKey }}
{{- $s3Key := genPrivateKey "ecdsa" }}
{{- $s3 := genSignedCertWithKey (.Values.infrastructure.seaweedfs.service.name) nil (include "waddlebot.transitTls.s3DnsNames" . | fromJsonArray) 365 $ca $s3Key }}
{{- include "waddlebot.transitTls.secretHead" (dict "root" . "name" $secretName "sans" $sansHash) }}
stringData:
  ca.crt: {{ $ca.Cert | quote }}
  postgres.crt: {{ $pg.Cert | quote }}
  postgres.key: {{ $pg.Key | quote }}
  seaweedfs.crt: {{ $s3.Cert | quote }}
  seaweedfs.key: {{ $s3.Key | quote }}
{{- end }}
{{- end }}

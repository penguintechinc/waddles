{{- /*
Moved to runtime provisioning in templates/provision-secrets.yaml + files/provision-secrets.sh
(Section 11, ECDSA P-256 via OpenSSL). Helm no longer generates keys or calls `lookup` on
<fullname>-transit-tls at template render time.

Policy (enforced by provision-secrets.yaml / provision-secrets.sh):
  1. Existing Secret complete and waddlebot.io/cert-sans-sha256 matches -> KEPT.
  2. global.transitTls.ca.crt + postgres.{crt,key} + seaweedfs.{crt,key} supplied -> written from values.
  3. global.transitTls.externalSecret=true -> skipped (ExternalSecret/SealedSecret owns it).
  4. global.deploymentTier alpha/local -> generated at runtime (ECDSA P-256, 365d).
  5. global.transitTls.certManager.enabled=true -> skipped (templates/transit-data-tls-certificates.yaml).
*/ -}}

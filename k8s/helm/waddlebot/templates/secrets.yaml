{{- /* fix/helm-alpha-self-provisioning -- randomness-bearing platform secrets computed
ONCE here into $-variables (never inline per-key): Sprig's randAlphaNum/randBytes
advance a process-wide PRNG on every call, so calling a generator twice for the same
logical value (e.g. POSTGRES_PASSWORD and the copy embedded in DATABASE_URL) would
silently mint two DIFFERENT values in one render. Each resolves via
waddlebot.autoSecretValue's lookup(KEEP)-then-generate(alpha/local)-or-require(else)
policy, same as templates/auto-provisioned-secrets.yaml -- an existing waddlebot-secrets
Secret's generated fields are never rotated by a future `helm upgrade`. The
"REPLACE_ME*"/empty values.yaml defaults are treated as "unset", never as an explicit
operator-supplied value; any real value the operator does set (not empty, not
REPLACE_ME-prefixed) always wins over both lookup and generation, so beta/gamma/
production keep working exactly as before by setting real values in their own values
file. OAuth/AWS/GCP/WaddleAI/PostHog fields further below remain plain values
pass-through on purpose -- not generated randomness, and locking them via lookup would
silently ignore an operator's updated token on upgrade. */}}
{{- $pg := .Values.infrastructure.postgresql.password }}
{{- $postgresPassword := include "waddlebot.autoSecretValue" (dict "ctx" . "key" "POSTGRES_PASSWORD" "explicit" (ternary "" $pg (hasPrefix "REPLACE_ME" $pg))) }}
{{- /* feature/bundle-reader-role -- waddles_bundle_reader (alembic/versions/
0032_bundle_reader_role.py) is the real, now-provisioned RO role for the Rust
data-plane's multi-app active-bundle loader. Same lookup-KEEP-then-generate
(alpha/local)-or-require(else) policy as POSTGRES_PASSWORD above -- unlike the
graceful-degradation BUNDLE_MIGRATOR_PASSWORD/BUNDLE_RUNTIME_PASSWORD below
(those roles' own migration tolerates an empty password), this key going
empty in beta/prod would silently leave the multi-app path disabled, so it is
required there, not optional. */}}
{{- $rp := .Values.infrastructure.postgresql.readerPassword }}
{{- $readerPassword := include "waddlebot.autoSecretValue" (dict "ctx" . "key" "DB_READER_PASSWORD" "explicit" (ternary "" $rp (hasPrefix "REPLACE_ME" $rp))) }}
{{- $rd := .Values.infrastructure.redis.password }}
{{- $redisPassword := include "waddlebot.autoSecretValue" (dict "ctx" . "key" "REDIS_PASSWORD" "explicit" (ternary "" $rd (hasPrefix "REPLACE_ME" $rd))) }}
{{- $mpAdmin := .Values.infrastructure.redis.modulePasswords.admin }}
{{- $redisAdminPassword := include "waddlebot.autoSecretValue" (dict "ctx" . "key" "REDIS_ADMIN_PASSWORD" "explicit" (ternary "" $mpAdmin (hasPrefix "REPLACE_ME" $mpAdmin))) }}
{{- $mpRouter := .Values.infrastructure.redis.modulePasswords.router }}
{{- $redisRouterPassword := include "waddlebot.autoSecretValue" (dict "ctx" . "key" "REDIS_ROUTER_PASSWORD" "explicit" (ternary "" $mpRouter (hasPrefix "REPLACE_ME" $mpRouter))) }}
{{- $mpHub := .Values.infrastructure.redis.modulePasswords.hub }}
{{- $redisHubPassword := include "waddlebot.autoSecretValue" (dict "ctx" . "key" "REDIS_HUB_PASSWORD" "explicit" (ternary "" $mpHub (hasPrefix "REPLACE_ME" $mpHub))) }}
{{- $mpWorkflow := .Values.infrastructure.redis.modulePasswords.workflow }}
{{- $redisWorkflowPassword := include "waddlebot.autoSecretValue" (dict "ctx" . "key" "REDIS_WORKFLOW_PASSWORD" "explicit" (ternary "" $mpWorkflow (hasPrefix "REPLACE_ME" $mpWorkflow))) }}
{{- $mpAi := .Values.infrastructure.redis.modulePasswords.ai }}
{{- $redisAiPassword := include "waddlebot.autoSecretValue" (dict "ctx" . "key" "REDIS_AI_PASSWORD" "explicit" (ternary "" $mpAi (hasPrefix "REPLACE_ME" $mpAi))) }}
{{- $mpAnalytics := .Values.infrastructure.redis.modulePasswords.analytics }}
{{- $redisAnalyticsPassword := include "waddlebot.autoSecretValue" (dict "ctx" . "key" "REDIS_ANALYTICS_PASSWORD" "explicit" (ternary "" $mpAnalytics (hasPrefix "REPLACE_ME" $mpAnalytics))) }}
{{- $mpSecurity := .Values.infrastructure.redis.modulePasswords.security }}
{{- $redisSecurityPassword := include "waddlebot.autoSecretValue" (dict "ctx" . "key" "REDIS_SECURITY_PASSWORD" "explicit" (ternary "" $mpSecurity (hasPrefix "REPLACE_ME" $mpSecurity))) }}
{{- $mpLoyalty := .Values.infrastructure.redis.modulePasswords.loyalty }}
{{- $redisLoyaltyPassword := include "waddlebot.autoSecretValue" (dict "ctx" . "key" "REDIS_LOYALTY_PASSWORD" "explicit" (ternary "" $mpLoyalty (hasPrefix "REPLACE_ME" $mpLoyalty))) }}
{{- $mpSpotify := .Values.infrastructure.redis.modulePasswords.spotify }}
{{- $redisSpotifyPassword := include "waddlebot.autoSecretValue" (dict "ctx" . "key" "REDIS_SPOTIFY_PASSWORD" "explicit" (ternary "" $mpSpotify (hasPrefix "REPLACE_ME" $mpSpotify))) }}
{{- $mpYtmusic := .Values.infrastructure.redis.modulePasswords.ytmusic }}
{{- $redisYtmusicPassword := include "waddlebot.autoSecretValue" (dict "ctx" . "key" "REDIS_YTMUSIC_PASSWORD" "explicit" (ternary "" $mpYtmusic (hasPrefix "REPLACE_ME" $mpYtmusic))) }}
{{- $mpTwitch := .Values.infrastructure.redis.modulePasswords.twitch }}
{{- $redisTwitchPassword := include "waddlebot.autoSecretValue" (dict "ctx" . "key" "REDIS_TWITCH_PASSWORD" "explicit" (ternary "" $mpTwitch (hasPrefix "REPLACE_ME" $mpTwitch))) }}
{{- $mpDiscord := .Values.infrastructure.redis.modulePasswords.discord }}
{{- $redisDiscordPassword := include "waddlebot.autoSecretValue" (dict "ctx" . "key" "REDIS_DISCORD_PASSWORD" "explicit" (ternary "" $mpDiscord (hasPrefix "REPLACE_ME" $mpDiscord))) }}
{{- $mpSlack := .Values.infrastructure.redis.modulePasswords.slack }}
{{- $redisSlackPassword := include "waddlebot.autoSecretValue" (dict "ctx" . "key" "REDIS_SLACK_PASSWORD" "explicit" (ternary "" $mpSlack (hasPrefix "REPLACE_ME" $mpSlack))) }}
{{- /* feature/seaweedfs-object-storage -- least-privilege per-workload S3 identities
(hub-api, data-plane/bundle-executor, bucket-init hook, svc-streaming), replacing the
former single unscoped "waddlebot" admin identity (rootUser/rootPassword/MINIO_ROOT_*)
for every consumer -- that admin identity has been removed entirely, not just
deprecated. Same autoSecretValue lookup(KEEP)-then-generate(alpha/local)-or-
require(else) policy, so each identity's credentials are stable across `helm upgrade`
(lookup wins once the Secret exists) and REQUIRED (render fails) outside alpha/local
unless explicitly set or already present in an existing waddlebot-secrets Secret. */}}
{{- $hak := .Values.infrastructure.seaweedfs.identities.hubApi.accessKey }}
{{- $hubApiAccessKey := include "waddlebot.autoSecretValue" (dict "ctx" . "key" "HUB_API_S3_ACCESS_KEY_ID" "explicit" (ternary "" $hak (hasPrefix "REPLACE_ME" $hak)) "length" 16) }}
{{- $hsk := .Values.infrastructure.seaweedfs.identities.hubApi.secretKey }}
{{- $hubApiSecretKey := include "waddlebot.autoSecretValue" (dict "ctx" . "key" "HUB_API_S3_SECRET_ACCESS_KEY" "explicit" (ternary "" $hsk (hasPrefix "REPLACE_ME" $hsk))) }}
{{- $dak := .Values.infrastructure.seaweedfs.identities.dataPlane.accessKey }}
{{- $dataPlaneAccessKey := include "waddlebot.autoSecretValue" (dict "ctx" . "key" "DATAPLANE_S3_ACCESS_KEY_ID" "explicit" (ternary "" $dak (hasPrefix "REPLACE_ME" $dak)) "length" 16) }}
{{- $dsk := .Values.infrastructure.seaweedfs.identities.dataPlane.secretKey }}
{{- $dataPlaneSecretKey := include "waddlebot.autoSecretValue" (dict "ctx" . "key" "DATAPLANE_S3_SECRET_ACCESS_KEY" "explicit" (ternary "" $dsk (hasPrefix "REPLACE_ME" $dsk))) }}
{{- $bak := .Values.infrastructure.seaweedfs.identities.bucketInit.accessKey }}
{{- $bucketInitAccessKey := include "waddlebot.autoSecretValue" (dict "ctx" . "key" "BUCKET_INIT_S3_ACCESS_KEY_ID" "explicit" (ternary "" $bak (hasPrefix "REPLACE_ME" $bak)) "length" 16) }}
{{- $bsk := .Values.infrastructure.seaweedfs.identities.bucketInit.secretKey }}
{{- $bucketInitSecretKey := include "waddlebot.autoSecretValue" (dict "ctx" . "key" "BUCKET_INIT_S3_SECRET_ACCESS_KEY" "explicit" (ternary "" $bsk (hasPrefix "REPLACE_ME" $bsk))) }}
{{- $stak := .Values.infrastructure.seaweedfs.identities.streaming.accessKey }}
{{- $streamingAccessKey := include "waddlebot.autoSecretValue" (dict "ctx" . "key" "STREAMING_S3_ACCESS_KEY_ID" "explicit" (ternary "" $stak (hasPrefix "REPLACE_ME" $stak)) "length" 16) }}
{{- $stsk := .Values.infrastructure.seaweedfs.identities.streaming.secretKey }}
{{- $streamingSecretKey := include "waddlebot.autoSecretValue" (dict "ctx" . "key" "STREAMING_S3_SECRET_ACCESS_KEY" "explicit" (ternary "" $stsk (hasPrefix "REPLACE_ME" $stsk))) }}
{{- $jwt := .Values.global.jwtSecret }}
{{- $jwtSecret := include "waddlebot.autoSecretValue" (dict "ctx" . "key" "JWT_SECRET" "explicit" (ternary "" $jwt (hasPrefix "REPLACE_ME" $jwt)) "length" 48) }}
{{- $msk := .Values.global.moduleSecretKey }}
{{- $moduleSecretKey := include "waddlebot.autoSecretValue" (dict "ctx" . "key" "MODULE_SECRET_KEY" "explicit" (ternary "" $msk (hasPrefix "REPLACE_ME" $msk)) "length" 48) }}
{{- $sak := .Values.global.serviceApiKey }}
{{- $serviceApiKey := include "waddlebot.autoSecretValue" (dict "ctx" . "key" "SERVICE_API_KEY" "explicit" (ternary "" $sak (hasPrefix "REPLACE_ME" $sak)) "length" 48) }}
{{- $cek := .Values.global.credentialEncryptionKey | default "" }}
{{- $credentialEncryptionKey := include "waddlebot.autoSecretValue" (dict "ctx" . "key" "CREDENTIAL_ENCRYPTION_KEY" "explicit" $cek "hex" true) }}
{{- $ebk := .Values.global.envelopeBindingKeys | default "" }}
{{- /* Not routed through waddlebot.autoSecretValue: the Secret stores the fully
formatted "k1:<hex>" string under this same key name, so a plain lookup-and-reuse
would need to strip the prefix back off before re-wrapping it -- simpler to inline
the identical lookup/generate/require policy once here, keyed on the exact stored
value, than special-case the shared helper's format-free contract for one field. */}}
{{- $envelopeBindingKeys := $ebk }}
{{- if eq $ebk "" }}
{{- $ebkTier := .Values.global.deploymentTier }}
{{- $ebkCanGenerate := or (eq $ebkTier "alpha") (eq $ebkTier "local") }}
{{- $ebkExisting := lookup "v1" "Secret" .Values.namespace "waddlebot-secrets" }}
{{- if and $ebkExisting $ebkExisting.data (hasKey $ebkExisting.data "ENVELOPE_BINDING_KEYS") }}
{{- $envelopeBindingKeys = index $ebkExisting.data "ENVELOPE_BINDING_KEYS" | b64dec }}
{{- else if $ebkCanGenerate }}
{{- $ebkKid := .Values.pipeline.rustDataPlane.svcIngest.envelopeBindingActiveKid | default "k1" }}
{{- $envelopeBindingKeys = printf "%s:%s" $ebkKid (sha256sum (randBytes 32)) }}
{{- else }}
{{- fail (printf "waddlebot-secrets: key \"ENVELOPE_BINDING_KEYS\" has no value and global.deploymentTier=%q is outside alpha/local -- set global.envelopeBindingKeys explicitly (or pre-populate this Secret via ExternalSecret/SealedSecret) before deploying." $ebkTier) }}
{{- end }}
{{- end }}
{{- /* fix/helm-migrations-fresh-install -- dedicated pre-install/pre-upgrade hook
Secret for templates/migrations-job.yaml (weight -5), following the same
"before-hook-creation" pattern templates/migrations-job-rbac.yaml already established
for that Job's ServiceAccount (weight -10). waddlebot-secrets below is a REGULAR
(non-hook) resource: Helm only applies regular resources AFTER every pre-install/
pre-upgrade hook has already run and completed, so migrations-job.yaml's Job can never
safely envFrom waddlebot-secrets directly -- CreateContainerConfigError on a true first
install, since the Secret it references does not exist yet at hook-run time. This
Secret instead carries only the single value the migrations image's entrypoint
(migrations/run-alembic.sh) and alembic/env.py actually read (DATABASE_URL) -- never
envFrom'd from the shared Secret wholesale.

No-divergence guarantee: $postgresPassword is computed exactly ONCE, above, and reused
by BOTH this Secret's DATABASE_URL and waddlebot-secrets's own POSTGRES_PASSWORD/
DB_PASS/DATABASE_URL keys below, in this SAME template file/render pass -- on a fresh
install both resolve from the identical in-memory Go-template variable; on upgrade both
resolve via the identical `lookup` of the already-live waddlebot-secrets Secret inside
waddlebot.autoSecretValue (_helpers.tpl), so the DB password is never regenerated or
rotated out from under either consumer. This canNOT be split into its own separate
template file the way migrations-job-rbac.yaml is: verified empirically that Helm v4
does not propagate a `set`-mutated .Values.global across template files within a single
render (each file gets its own snapshot) -- so a second file re-deriving
$postgresPassword via its own autoSecretValue call would mint a second, DIFFERENT
random value on a fresh install instead of reusing this one. */}}
{{- if .Values.pipeline.migrationsJob.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "waddlebot.fullname" . }}-db-migrate-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  DATABASE_URL: "postgresql://{{ .Values.infrastructure.postgresql.username }}:{{ $postgresPassword }}@{{ .Values.infrastructure.postgresql.service.name }}:{{ .Values.infrastructure.postgresql.service.port }}/{{ .Values.infrastructure.postgresql.database }}"
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: waddlebot-secrets
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: waddlebot
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: secrets
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    # `resource-policy: keep` only changes `helm uninstall` behavior (this Secret
    # survives it) -- it has NO effect on `helm upgrade`, which always applies whatever
    # this template renders. The generated fields above stay stable across upgrades
    # because waddlebot.autoSecretValue's lookup-KEEP branch wins, not because of this
    # annotation; OAuth/cloud-credential fields further below are still freely
    # updatable on every upgrade as before.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # Database Credentials
  POSTGRES_PASSWORD: {{ $postgresPassword | quote }}
  DB_PASS: {{ $postgresPassword | quote }}
  DATABASE_PASSWORD: {{ $postgresPassword | quote }}
  DATABASE_URL: "postgresql://{{ .Values.infrastructure.postgresql.username }}:{{ $postgresPassword }}@{{ .Values.infrastructure.postgresql.service.name }}:{{ .Values.infrastructure.postgresql.service.port }}/{{ .Values.infrastructure.postgresql.database }}"
  # feature/e2e-helm-rust-dataplane -- core/svc_process and core/svc_action (Rust) read the
  # DB password as a bare env_required("DB_PASSWORD") (see their src/config.rs), never
  # assembled from a DATABASE_URL like the Python services above. Same underlying shared
  # postgresql.password value as DB_PASS/DATABASE_PASSWORD above -- per-service DB accounts
  # (backend-database.md) remain pre-existing debt this Helm-only change doesn't fix.
  DB_PASSWORD: {{ $postgresPassword | quote }}
  # DB-driven active-bundle loader (core/svc_process, core/svc_action, core/
  # bundle_active_set) -- a distinct, SELECT-only Postgres role's password, never the
  # primary DB_PASSWORD above. feature/bundle-reader-role: the role
  # (waddles_bundle_reader) is now actually provisioned by alembic/versions/
  # 0032_bundle_reader_role.py, which reads this SAME secret key (via the
  # db-migrate initContainer below) so the migration and the two services
  # that log in as this role never drift onto two different passwords.
  # $readerPassword resolves via the same lookup-KEEP-then-generate(alpha/
  # local)-or-require(else) policy as POSTGRES_PASSWORD -- see this file's
  # header comment and values-alpha.yaml's infrastructure.postgresql comment.
  DB_READER_PASSWORD: {{ $readerPassword | quote }}
  # Bundle app-schema roles (Phase 0, docs/superpowers/specs/2026-09-28-
  # bundle-db-capability-and-schemas.md Sec2/alembic/versions/
  # 0030_bundle_app_schemas.py) -- waddles_bundle_migrator (DDL owner of
  # app_core/app_community, hub-api only) and waddles_bundle_runtime
  # (DML-only, those two schemas; svc_process/svc_action). Unlike
  # DB_READER_PASSWORD above, this migration is the actual consumer today
  # (via the db-migrate initContainer, _helpers.tpl
  # waddlebot.dbMigrateInitContainer) -- it stages an unset value as "no
  # credential provided this run" and creates/leaves the role LOGIN with no
  # usable password rather than failing the migration, so shipping this
  # empty is safe. Set infrastructure.postgresql.bundleMigratorPassword/
  # bundleRuntimePassword before relying on either role for real traffic.
  BUNDLE_MIGRATOR_PASSWORD: {{ .Values.infrastructure.postgresql.bundleMigratorPassword | default "" | quote }}
  BUNDLE_RUNTIME_PASSWORD: {{ .Values.infrastructure.postgresql.bundleRuntimePassword | default "" | quote }}
  # Redis Credentials (admin password)
  REDIS_PASSWORD: {{ $redisPassword | quote }}
  # Assembled connection URL, mirroring DATABASE_URL above. The configmap
  # provides REDIS_HOST/PORT as components, but 44 modules read REDIS_URL and
  # would otherwise fall back to their localhost default — under the Helm-only
  # deploy path that meant Redis/Valkey was unreachable for those modules.
  # Password-only auth uses an empty username (redis://:pass@host). DB index 0
  # matches every module's REDIS_DB default.
  REDIS_URL: "redis://:{{ $redisPassword }}@{{ .Values.infrastructure.redis.service.name }}:{{ .Values.infrastructure.redis.service.port }}/0"
  # T10 (v3 demo) -- identical value to REDIS_URL above, under the name the v3 pipeline
  # stages (svc-ingest/svc-process/svc-action) actually read (VALKEY_URL). Same backing
  # infrastructure.redis Deployment -- Valkey, per devops-kubernetes.md -- just two env
  # var names during the legacy-module/pipeline-stage coexistence window.
  VALKEY_URL: "redis://:{{ $redisPassword }}@{{ .Values.infrastructure.redis.service.name }}:{{ .Values.infrastructure.redis.service.port }}/0"
  {{- if .Values.infrastructure.redis.tls.enabled }}
  # fix/valkey-tls-alpha -- the rediss:// counterpart of VALKEY_URL above, read by the 3
  # Rust data-plane pods only (templates/svc-process-rust.yaml et al, via a `valueFrom`
  # secretKeyRef pointed at THIS key rather than an inline templated `value:` string) --
  # keeping it a secretKeyRef in both the TLS-off and TLS-on case means switching
  # infrastructure.redis.tls.enabled never changes an env entry's field TYPE (valueFrom vs
  # value) for an existing pod, which Kubernetes' strategic-merge-patch cannot always
  # reconcile cleanly against a live object (observed: "valueFrom: Invalid value: \"\": may
  # not be specified when `value` is not empty" on an in-place upgrade). No embedded
  # credentials -- VALKEY_PASSWORD is wired as its own separate env var everywhere this is
  # used, because `penguin_spine::SpineConfig::validate()` reads that var directly rather
  # than parsing credentials back out of VALKEY_URL.
  VALKEY_URL_TLS: "rediss://{{ .Values.infrastructure.redis.service.name }}:{{ .Values.infrastructure.redis.tls.port }}/0"
  {{- end }}
  REDIS_ADMIN_PASSWORD: {{ $redisAdminPassword | quote }}
  # Module-specific Redis passwords (matches docker-compose.yml ACL setup)
  REDIS_ROUTER_PASSWORD: {{ $redisRouterPassword | quote }}
  REDIS_HUB_PASSWORD: {{ $redisHubPassword | quote }}
  REDIS_WORKFLOW_PASSWORD: {{ $redisWorkflowPassword | quote }}
  REDIS_AI_PASSWORD: {{ $redisAiPassword | quote }}
  REDIS_ANALYTICS_PASSWORD: {{ $redisAnalyticsPassword | quote }}
  REDIS_SECURITY_PASSWORD: {{ $redisSecurityPassword | quote }}
  REDIS_LOYALTY_PASSWORD: {{ $redisLoyaltyPassword | quote }}
  REDIS_SPOTIFY_PASSWORD: {{ $redisSpotifyPassword | quote }}
  REDIS_YTMUSIC_PASSWORD: {{ $redisYtmusicPassword | quote }}
  REDIS_TWITCH_PASSWORD: {{ $redisTwitchPassword | quote }}
  REDIS_DISCORD_PASSWORD: {{ $redisDiscordPassword | quote }}
  REDIS_SLACK_PASSWORD: {{ $redisSlackPassword | quote }}

  # Least-privilege per-workload S3 identities (feature/seaweedfs-object-storage) --
  # see values.yaml infrastructure.seaweedfs.identities and templates/infrastructure/
  # seaweedfs.yaml's s3-identities.json for the permissions each is scoped to. The
  # former unscoped "waddlebot" admin identity (MINIO_ROOT_USER/MINIO_ROOT_PASSWORD/
  # S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY back-compat keys) has been removed --
  # svc-streaming (the last consumer) now uses its own STREAMING_S3_* identity below.
  HUB_API_S3_ACCESS_KEY_ID: {{ $hubApiAccessKey | quote }}
  HUB_API_S3_SECRET_ACCESS_KEY: {{ $hubApiSecretKey | quote }}
  DATAPLANE_S3_ACCESS_KEY_ID: {{ $dataPlaneAccessKey | quote }}
  DATAPLANE_S3_SECRET_ACCESS_KEY: {{ $dataPlaneSecretKey | quote }}
  BUCKET_INIT_S3_ACCESS_KEY_ID: {{ $bucketInitAccessKey | quote }}
  BUCKET_INIT_S3_SECRET_ACCESS_KEY: {{ $bucketInitSecretKey | quote }}
  STREAMING_S3_ACCESS_KEY_ID: {{ $streamingAccessKey | quote }}
  STREAMING_S3_SECRET_ACCESS_KEY: {{ $streamingSecretKey | quote }}

  # JWT Secret (default matches docker-compose.yml). Also emitted as
  # SECRET_KEY/JWT_SECRET_KEY -- the exact env var names flask_core's
  # require_secret_key() (C1 security fix) and several Python modules'
  # own config.py read via envFrom secretRef; without these two keys every
  # flask_core-based Deployment refuses to start (RELEASE_MODE/NODE_ENV
  # default to production-posture -- see values.yaml's global.nodeEnv),
  # since JWT_SECRET alone doesn't satisfy either lookup name.
  JWT_SECRET: {{ $jwtSecret | quote }}
  SECRET_KEY: {{ $jwtSecret | quote }}
  JWT_SECRET_KEY: {{ $jwtSecret | quote }}

  # Module Secret Key
  MODULE_SECRET_KEY: {{ $moduleSecretKey | quote }}

  # First-run super-admin bootstrap (C1/CWE-798, PR #256). Consumed by the shared
  # db-migrate initContainer (_helpers.tpl waddlebot.dbMigrateInitContainer), which mirrors
  # docker-compose.yml's db-migrations service -- the actual live bootstrap trigger.
  # Empty (the default) means no admin account is created (fail closed). Never a literal
  # here for beta/gamma/production -- see global.initialAdmin in values.yaml.
  {{- include "waddlebot.rejectPlaceholder" (dict "key" "INITIAL_ADMIN_EMAIL" "value" .Values.global.initialAdmin.email) }}
  {{- include "waddlebot.rejectPlaceholder" (dict "key" "INITIAL_ADMIN_PASSWORD" "value" .Values.global.initialAdmin.password) }}
  INITIAL_ADMIN_EMAIL: {{ .Values.global.initialAdmin.email | default "" | quote }}
  INITIAL_ADMIN_PASSWORD: {{ .Values.global.initialAdmin.password | default "" | quote }}

  # Service API Key
  SERVICE_API_KEY: {{ $serviceApiKey | quote }}

  # Credential Encryption Key (#320, hub-api-v3 Connections) -- symmetric key used to
  # encrypt stored per-community OAuth tokens at rest. hub_api/services/
  # platform_integrations_crypto.py requires a 64-character hex string (32 bytes),
  # NOT base64 -- generate with `openssl rand -hex 32`; never commit a value. Empty
  # by default (fail closed); OVERRIDE REQUIRED via --set or an out-of-git values
  # override / ExternalSecret before Connections can be used in any environment.
  CREDENTIAL_ENCRYPTION_KEY: {{ $credentialEncryptionKey | quote }}

  # fix/helm-platform-credentials -- externally-issued platform/third-party
  # credentials (Discord/Twitch/Slack/YouTube/Spotify/Kick/Teams/Mattermost/
  # Google Chat OAuth values, AWS/GCP access keys, WaddleAI + PostHog API
  # keys) are DELIBERATELY NOT rendered into this chart-managed Secret
  # anymore. Root cause of the alpha incident: this template unconditionally
  # wrote `.Values.oauth.discord.botToken` (a values.yaml dev placeholder,
  # "REPLACE_ME_discord_bot_token_dev_only") into this Secret on every
  # `helm upgrade`, silently clobbering the real bot token an operator had
  # set out-of-band and closing the live Discord gateway session (4004).
  # These now live ONLY in a separate Secret this chart never writes --
  # see `waddlebot.platformCredentialsSecretName` in _helpers.tpl and
  # docs/PLATFORM_CREDENTIALS.md for the operator setup command. Pods
  # consume it via `envFrom: secretRef: {name: ..., optional: true}` so a
  # platform an operator hasn't configured simply stays absent, never
  # replaced by a placeholder.
  #
  # Non-secret companion config (URLs/regions/project & tenant IDs) for
  # those same platforms stays here since it isn't a credential and losing
  # it on a missing Secret would be a regression, not a safety improvement.
  YOUTUBE_WEBHOOK_CALLBACK_URL: {{ .Values.oauth.youtube.webhookCallbackUrl | default "" | quote }}
  TEAMS_TENANT_ID: {{ .Values.oauth.teams.tenantId | default "" | quote }}
  MATTERMOST_URL: {{ .Values.oauth.mattermost.url | default "" | quote }}
  GOOGLE_CHAT_PROJECT_ID: {{ .Values.oauth.googlechat.projectId | default "" | quote }}
  AWS_REGION: {{ .Values.aws.region | default "us-east-1" | quote }}
  GCP_PROJECT_ID: {{ .Values.gcp.projectId | default "" | quote }}
  GCP_REGION: {{ .Values.gcp.region | default "us-central1" | quote }}
  WADDLEAI_BASE_URL: {{ .Values.waddleai.baseUrl | default "" | quote }}

  # OpenWhisk Configuration -- self-hosted/local serverless platform, not an
  # externally-issued third-party credential; out of scope for this change.
  # authKey defaults to OpenWhisk's own well-known "guest" devkey (upstream
  # quickstart default), not a real secret.
  OPENWHISK_API_HOST: {{ .Values.openwhisk.apiHost | default "http://openwhisk-service:3233" | quote }}
  OPENWHISK_AUTH_KEY: {{ .Values.openwhisk.authKey | quote }}
  OPENWHISK_NAMESPACE: {{ .Values.openwhisk.namespace | default "guest" | quote }}
  OPENWHISK_INSECURE: {{ .Values.openwhisk.insecure | default "true" | quote }}

  # feature/e2e-helm-rust-dataplane -- core/svc_action (Rust) envelope hop-verification
  # HMAC keyring (`kid:hexkey[,kid:hexkey...]`, core/svc_action/src/hop.rs KeyRing). Empty
  # by default (fail closed) -- dispatch refuses to start hop verification without it
  # rather than silently accepting every envelope, same "OVERRIDE REQUIRED" posture as
  # CREDENTIAL_ENCRYPTION_KEY above. Generate a dev value with e.g.
  # `echo "k1:$(openssl rand -hex 32)"`; never a literal here.
  ENVELOPE_BINDING_KEYS: {{ $envelopeBindingKeys | quote }}

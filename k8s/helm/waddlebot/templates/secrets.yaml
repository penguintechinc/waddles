apiVersion: v1
kind: Secret
metadata:
  name: waddlebot-secrets
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: waddlebot
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: secrets
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  # Database Credentials
  POSTGRES_PASSWORD: {{ .Values.infrastructure.postgresql.password | default "REPLACE_ME" | quote }}
  DB_PASS: {{ .Values.infrastructure.postgresql.password | default "REPLACE_ME" | quote }}
  DATABASE_PASSWORD: {{ .Values.infrastructure.postgresql.password | default "REPLACE_ME" | quote }}
  DATABASE_URL: "postgresql://{{ .Values.infrastructure.postgresql.username }}:{{ .Values.infrastructure.postgresql.password | default "REPLACE_ME" }}@{{ .Values.infrastructure.postgresql.service.name }}:{{ .Values.infrastructure.postgresql.service.port }}/{{ .Values.infrastructure.postgresql.database }}"
  # feature/e2e-helm-rust-dataplane -- core/svc_process and core/svc_action (Rust) read the
  # DB password as a bare env_required("DB_PASSWORD") (see their src/config.rs), never
  # assembled from a DATABASE_URL like the Python services above. Same underlying shared
  # postgresql.password value as DB_PASS/DATABASE_PASSWORD above -- per-service DB accounts
  # (backend-database.md) remain pre-existing debt this Helm-only change doesn't fix.
  DB_PASSWORD: {{ .Values.infrastructure.postgresql.password | default "REPLACE_ME" | quote }}
  # Redis Credentials (admin password)
  REDIS_PASSWORD: {{ .Values.infrastructure.redis.password | default "REPLACE_ME" | quote }}
  # Assembled connection URL, mirroring DATABASE_URL above. The configmap
  # provides REDIS_HOST/PORT as components, but 44 modules read REDIS_URL and
  # would otherwise fall back to their localhost default — under the Helm-only
  # deploy path that meant Redis/Valkey was unreachable for those modules.
  # Password-only auth uses an empty username (redis://:pass@host). DB index 0
  # matches every module's REDIS_DB default.
  REDIS_URL: "redis://:{{ .Values.infrastructure.redis.password | default "REPLACE_ME" }}@{{ .Values.infrastructure.redis.service.name }}:{{ .Values.infrastructure.redis.service.port }}/0"
  # T10 (v3 demo) -- identical value to REDIS_URL above, under the name the v3 pipeline
  # stages (svc-ingest/svc-process/svc-action) actually read (VALKEY_URL). Same backing
  # infrastructure.redis Deployment -- Valkey, per devops-kubernetes.md -- just two env
  # var names during the legacy-module/pipeline-stage coexistence window.
  VALKEY_URL: "redis://:{{ .Values.infrastructure.redis.password | default "REPLACE_ME" }}@{{ .Values.infrastructure.redis.service.name }}:{{ .Values.infrastructure.redis.service.port }}/0"
  REDIS_ADMIN_PASSWORD: {{ .Values.infrastructure.redis.modulePasswords.admin | default "REPLACE_ME" | quote }}
  # Module-specific Redis passwords (matches docker-compose.yml ACL setup)
  REDIS_ROUTER_PASSWORD: {{ .Values.infrastructure.redis.modulePasswords.router | default "REPLACE_ME" | quote }}
  REDIS_HUB_PASSWORD: {{ .Values.infrastructure.redis.modulePasswords.hub | default "REPLACE_ME" | quote }}
  REDIS_WORKFLOW_PASSWORD: {{ .Values.infrastructure.redis.modulePasswords.workflow | default "REPLACE_ME" | quote }}
  REDIS_AI_PASSWORD: {{ .Values.infrastructure.redis.modulePasswords.ai | default "REPLACE_ME" | quote }}
  REDIS_ANALYTICS_PASSWORD: {{ .Values.infrastructure.redis.modulePasswords.analytics | default "REPLACE_ME" | quote }}
  REDIS_SECURITY_PASSWORD: {{ .Values.infrastructure.redis.modulePasswords.security | default "REPLACE_ME" | quote }}
  REDIS_LOYALTY_PASSWORD: {{ .Values.infrastructure.redis.modulePasswords.loyalty | default "REPLACE_ME" | quote }}
  REDIS_SPOTIFY_PASSWORD: {{ .Values.infrastructure.redis.modulePasswords.spotify | default "REPLACE_ME" | quote }}
  REDIS_YTMUSIC_PASSWORD: {{ .Values.infrastructure.redis.modulePasswords.ytmusic | default "REPLACE_ME" | quote }}
  REDIS_TWITCH_PASSWORD: {{ .Values.infrastructure.redis.modulePasswords.twitch | default "REPLACE_ME" | quote }}
  REDIS_DISCORD_PASSWORD: {{ .Values.infrastructure.redis.modulePasswords.discord | default "REPLACE_ME" | quote }}
  REDIS_SLACK_PASSWORD: {{ .Values.infrastructure.redis.modulePasswords.slack | default "REPLACE_ME" | quote }}

  # MinIO Credentials (defaults match docker-compose.yml)
  MINIO_ROOT_USER: {{ .Values.infrastructure.minio.rootUser | default "REPLACE_ME" | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.infrastructure.minio.rootPassword | default "REPLACE_ME" | quote }}
  S3_ACCESS_KEY_ID: {{ .Values.infrastructure.minio.rootUser | default "REPLACE_ME" | quote }}
  S3_SECRET_ACCESS_KEY: {{ .Values.infrastructure.minio.rootPassword | default "REPLACE_ME" | quote }}

  # JWT Secret (default matches docker-compose.yml). Also emitted as
  # SECRET_KEY/JWT_SECRET_KEY -- the exact env var names flask_core's
  # require_secret_key() (C1 security fix) and several Python modules'
  # own config.py read via envFrom secretRef; without these two keys every
  # flask_core-based Deployment refuses to start (RELEASE_MODE/NODE_ENV
  # default to production-posture -- see values.yaml's global.nodeEnv),
  # since JWT_SECRET alone doesn't satisfy either lookup name.
  JWT_SECRET: {{ .Values.global.jwtSecret | default "REPLACE_ME_jwt_secret" | quote }}
  SECRET_KEY: {{ .Values.global.jwtSecret | default "REPLACE_ME_jwt_secret" | quote }}
  JWT_SECRET_KEY: {{ .Values.global.jwtSecret | default "REPLACE_ME_jwt_secret" | quote }}

  # Module Secret Key
  MODULE_SECRET_KEY: {{ .Values.global.moduleSecretKey | quote }}

  # First-run super-admin bootstrap (C1/CWE-798, PR #256). Consumed by the shared
  # db-migrate initContainer (_helpers.tpl waddlebot.dbMigrateInitContainer), which mirrors
  # docker-compose.yml's db-migrations service -- the actual live bootstrap trigger.
  # Empty (the default) means no admin account is created (fail closed). Never a literal
  # here for beta/gamma/production -- see global.initialAdmin in values.yaml.
  INITIAL_ADMIN_EMAIL: {{ .Values.global.initialAdmin.email | default "" | quote }}
  INITIAL_ADMIN_PASSWORD: {{ .Values.global.initialAdmin.password | default "" | quote }}

  # Service API Key
  SERVICE_API_KEY: {{ .Values.global.serviceApiKey | quote }}

  # Credential Encryption Key (#320, hub-api-v3 Connections) -- symmetric key used to
  # encrypt stored per-community OAuth tokens at rest. hub_api/services/
  # platform_integrations_crypto.py requires a 64-character hex string (32 bytes),
  # NOT base64 -- generate with `openssl rand -hex 32`; never commit a value. Empty
  # by default (fail closed); OVERRIDE REQUIRED via --set or an out-of-git values
  # override / ExternalSecret before Connections can be used in any environment.
  CREDENTIAL_ENCRYPTION_KEY: {{ .Values.global.credentialEncryptionKey | default "" | quote }}

  # OAuth - Discord
  DISCORD_CLIENT_ID: {{ .Values.oauth.discord.clientId | default "" | quote }}
  DISCORD_CLIENT_SECRET: {{ .Values.oauth.discord.clientSecret | default "" | quote }}
  DISCORD_BOT_TOKEN: {{ .Values.oauth.discord.botToken | default "" | quote }}
  DISCORD_APPLICATION_ID: {{ .Values.oauth.discord.applicationId | default "" | quote }}

  # OAuth - Twitch
  TWITCH_CLIENT_ID: {{ .Values.oauth.twitch.clientId | default "" | quote }}
  TWITCH_CLIENT_SECRET: {{ .Values.oauth.twitch.clientSecret | default "" | quote }}
  TWITCH_WEBHOOK_SECRET: {{ .Values.oauth.twitch.webhookSecret | default "" | quote }}
  # T10 (v3 demo) -- IRC OAuth token for svc-ingest's twitch_irc.py held socket. Empty
  # (the default) means the Twitch ingest receiver has no credential and stays idle.
  TWITCH_OAUTH_TOKEN: {{ .Values.oauth.twitch.oauthToken | default "" | quote }}

  # OAuth - Slack
  SLACK_CLIENT_ID: {{ .Values.oauth.slack.clientId | default "" | quote }}
  SLACK_CLIENT_SECRET: {{ .Values.oauth.slack.clientSecret | default "" | quote }}
  SLACK_BOT_TOKEN: {{ .Values.oauth.slack.botToken | default "" | quote }}
  SLACK_SIGNING_SECRET: {{ .Values.oauth.slack.signingSecret | default "" | quote }}
  SLACK_APP_TOKEN: {{ .Values.oauth.slack.appToken | default "" | quote }}

  # OAuth - YouTube
  YOUTUBE_API_KEY: {{ .Values.oauth.youtube.apiKey | default "" | quote }}
  YOUTUBE_CLIENT_ID: {{ .Values.oauth.youtube.clientId | default "" | quote }}
  YOUTUBE_CLIENT_SECRET: {{ .Values.oauth.youtube.clientSecret | default "" | quote }}
  YOUTUBE_REFRESH_TOKEN: {{ .Values.oauth.youtube.refreshToken | default "" | quote }}
  YOUTUBE_WEBHOOK_CALLBACK_URL: {{ .Values.oauth.youtube.webhookCallbackUrl | default "" | quote }}

  # OAuth - Spotify
  SPOTIFY_CLIENT_ID: {{ .Values.oauth.spotify.clientId | default "" | quote }}
  SPOTIFY_CLIENT_SECRET: {{ .Values.oauth.spotify.clientSecret | default "" | quote }}

  # OAuth - Kick
  KICK_CLIENT_ID: {{ .Values.oauth.kick.clientId | default "" | quote }}
  KICK_CLIENT_SECRET: {{ .Values.oauth.kick.clientSecret | default "" | quote }}
  KICK_WEBHOOK_SECRET: {{ .Values.oauth.kick.webhookSecret | default "" | quote }}
  KICK_ACCESS_TOKEN: {{ .Values.oauth.kick.accessToken | default "" | quote }}

  # OAuth - Teams
  TEAMS_APP_ID: {{ .Values.oauth.teams.appId | default "" | quote }}
  TEAMS_APP_PASSWORD: {{ .Values.oauth.teams.appPassword | default "" | quote }}
  TEAMS_TENANT_ID: {{ .Values.oauth.teams.tenantId | default "" | quote }}

  # OAuth - Mattermost
  MATTERMOST_URL: {{ .Values.oauth.mattermost.url | default "" | quote }}
  MATTERMOST_BOT_TOKEN: {{ .Values.oauth.mattermost.botToken | default "" | quote }}
  MATTERMOST_WEBHOOK_SECRET: {{ .Values.oauth.mattermost.webhookSecret | default "" | quote }}

  # OAuth - Google Chat
  GOOGLE_CHAT_SERVICE_ACCOUNT_KEY: {{ .Values.oauth.googlechat.serviceAccountKey | default "" | quote }}
  GOOGLE_CHAT_PROJECT_ID: {{ .Values.oauth.googlechat.projectId | default "" | quote }}

  # AWS Credentials (for Lambda)
  AWS_ACCESS_KEY_ID: {{ .Values.aws.accessKeyId | default "" | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.aws.secretAccessKey | default "" | quote }}
  AWS_REGION: {{ .Values.aws.region | default "us-east-1" | quote }}
  AWS_LAMBDA_ROLE_ARN: {{ .Values.aws.lambdaRoleArn | default "" | quote }}

  # GCP Credentials (for Cloud Functions)
  GCP_PROJECT_ID: {{ .Values.gcp.projectId | default "" | quote }}
  GCP_REGION: {{ .Values.gcp.region | default "us-central1" | quote }}
  GCP_SERVICE_ACCOUNT_KEY: {{ .Values.gcp.serviceAccountKey | default "" | quote }}
  GCP_SERVICE_ACCOUNT_EMAIL: {{ .Values.gcp.serviceAccountEmail | default "" | quote }}

  # OpenWhisk Configuration
  OPENWHISK_API_HOST: {{ .Values.openwhisk.apiHost | default "http://openwhisk-service:3233" | quote }}
  OPENWHISK_AUTH_KEY: {{ .Values.openwhisk.authKey | quote }}
  OPENWHISK_NAMESPACE: {{ .Values.openwhisk.namespace | default "guest" | quote }}
  OPENWHISK_INSECURE: {{ .Values.openwhisk.insecure | default "true" | quote }}

  # WaddleAI Integration
  WADDLEAI_BASE_URL: {{ .Values.waddleai.baseUrl | default "" | quote }}
  WADDLEAI_API_KEY: {{ .Values.waddleai.apiKey | default "" | quote }}

  # PostHog feature-flag API key (personal/project key, feature_flag:read
  # scope) — paired with POSTHOG_HOST from the ConfigMap. Never commit a
  # literal value; set via --set or an out-of-git values file.
  POSTHOG_API_KEY: {{ .Values.posthog.apiKey | default "" | quote }}

  # feature/e2e-helm-rust-dataplane -- core/svc_action (Rust) envelope hop-verification
  # HMAC keyring (`kid:hexkey[,kid:hexkey...]`, core/svc_action/src/hop.rs KeyRing). Empty
  # by default (fail closed) -- dispatch refuses to start hop verification without it
  # rather than silently accepting every envelope, same "OVERRIDE REQUIRED" posture as
  # CREDENTIAL_ENCRYPTION_KEY above. Generate a dev value with e.g.
  # `echo "k1:$(openssl rand -hex 32)"`; never a literal here.
  ENVELOPE_BINDING_KEYS: {{ .Values.global.envelopeBindingKeys | default "" | quote }}

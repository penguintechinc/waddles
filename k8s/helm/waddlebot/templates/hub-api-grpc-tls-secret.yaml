# fix/hub-grpc-tls-and-ca-trust -- TLS Secret for hub-api's internal gRPC listener
# (hub_api/grpc_internal/server.py, PR #570 review blocker 1: GRPC_TLS_CERT_PATH/
# GRPC_TLS_KEY_PATH were never wired so the TLS listener never started). Mirrors
# templates/infrastructure/valkey-tls-secret.yaml's KEEP-vs-GENERATE-vs-REQUIRE policy
# exactly (not repeated here), but for a SEPARATE identity: hub-api's own gRPC Service DNS
# name, never the shared fullname-grpc-tls Secret (that one has no alpha/local
# auto-generate fallback and hub_api/grpc_internal/server.py has no insecureDev escape
# hatch -- TLS is mandatory for this listener in every tier). Mounted by
# templates/hub-api.yaml (server role, _helpers.tpl's waddlebot.hubApiGrpcTls* helpers) and
# templates/svc-process-rust.yaml/svc-action-rust.yaml (CA-only, client role, HUB_API_GRPC_
# CA_FILE consumed by core/hub_client::HubClient::connect -- PR #570 review blocker 2).
#
# Policy:
#   1. Secret already exists, is COMPLETE, AND its waddlebot.io/cert-identity /
#      waddlebot.io/cert-sans-sha256 annotations match what this render wants -> KEPT
#      untouched, never re-templated.
#   1b. Complete but those annotations are missing or stale -> alpha/local regenerates
#      (falls through to branch 4); beta/gamma/production fails closed with an actionable
#      message (same fix/cert-regen-on-identity-change class of fix as host-api-tls/
#      valkey-tls).
#   2. global.hubApiGrpcTls.ca.crt/tls.crt/tls.key all explicitly supplied via values
#      (--set-file, or an ExternalSecret writing into .Values) -> rendered from those,
#      annotated keep.
#   3. global.hubApiGrpcTls.externalSecret: true -> skipped; an out-of-band controller owns
#      this exact Secret name.
#   4. global.deploymentTier is alpha/local -> generated with Helm's own genCA/
#      genSignedCert builtins (RSA -- grpc's ssl_server_credentials and rustls's `ring`
#      provider both verify RSA certs without issue), SANs covering the hub-api gRPC
#      Service's short/namespaced/svc.cluster.local DNS forms, 365-day validity.
#   5. Otherwise (beta/gamma/production, no material, not delegated) -> render fails closed
#      with an actionable message. NEVER a literal cert/key committed to git in ANY
#      environment.
{{- if .Values.pipeline.hubApi.enabled }}
{{- $tier := .Values.global.deploymentTier }}
{{- $canGenerate := or (eq $tier "alpha") (eq $tier "local") }}
{{- $secretName := printf "%s-hub-api-grpc-tls" (include "waddlebot.fullname" .) }}
{{- $hgt := .Values.global.hubApiGrpcTls }}
{{- $svcName := printf "%s-hub-api-v3" (include "waddlebot.fullname" .) }}
{{- $ns := .Values.namespace }}
{{- $existing := lookup "v1" "Secret" .Values.namespace $secretName }}
{{- $desiredIdentity := $svcName }}
{{- $desiredSansHash := include "waddlebot.hubApiGrpcTlsSansSha256" . }}
{{- /* genSignedCert needs a real []interface{}; splitList on the comma-joined helper
string yields []string, which genSignedCert rejects -- rebuild inline instead, kept
byte-for-byte identical to waddlebot.hubApiGrpcTlsDesiredDnsNames's own list. */}}
{{- $desiredDnsNames := list $svcName (printf "%s.%s" $svcName $ns) (printf "%s.%s.svc" $svcName $ns) (printf "%s.%s.svc.cluster.local" $svcName $ns) }}
{{- $identityCurrent := include "waddlebot.tlsSecretIdentityMatches" (dict "existing" $existing "identity" $desiredIdentity "sansSha256" $desiredSansHash) }}
{{- if $identityCurrent }}
# Kept as-is -- {{ $secretName }} already exists, is a COMPLETE ca.crt/tls.crt/tls.key
# bundle, and its waddlebot.io/cert-identity/waddlebot.io/cert-sans-sha256 annotations
# match the identity/SANs this render currently wants. See policy comment above.
{{- else if eq (include "waddlebot.tlsSecretStaleFailsClosed" (dict "existing" $existing "identity" $desiredIdentity "sansSha256" $desiredSansHash "canGenerate" $canGenerate)) "true" }}
{{- fail (printf "global.hubApiGrpcTls: Secret %q in namespace %q is COMPLETE but its waddlebot.io/cert-identity/waddlebot.io/cert-sans-sha256 annotations are missing or stale (desired identity=%q sans-sha256=%q), and global.deploymentTier=%q is outside alpha/local -- this chart will not silently keep a Secret pinned to the wrong identity, nor silently regenerate it outside alpha/local. Supply fresh global.hubApiGrpcTls.ca.crt/tls.crt/tls.key, point an ExternalSecret/SealedSecret at this Secret name and set global.hubApiGrpcTls.externalSecret=true, then helm upgrade again." $secretName .Values.namespace $desiredIdentity $desiredSansHash $tier) }}
{{- else if and $hgt.ca.crt $hgt.tls.crt $hgt.tls.key }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub-api-grpc-tls
  annotations:
    helm.sh/resource-policy: keep
    waddlebot.io/cert-identity: {{ $desiredIdentity | quote }}
    waddlebot.io/cert-sans-sha256: {{ $desiredSansHash | quote }}
type: Opaque
stringData:
  ca.crt: {{ $hgt.ca.crt | quote }}
  tls.crt: {{ $hgt.tls.crt | quote }}
  tls.key: {{ $hgt.tls.key | quote }}
{{- else if $hgt.externalSecret }}
# Skipped -- {{ $secretName }} does not exist yet, but global.hubApiGrpcTls.externalSecret
# is true, meaning an ExternalSecret/SealedSecret controller owns and will populate it.
{{- else if not $canGenerate }}
{{- fail (printf "global.hubApiGrpcTls: Secret %q not found in namespace %q, no ca.crt/tls.crt/tls.key supplied via values, and global.deploymentTier=%q is outside alpha/local -- auto-generation is alpha/local only. Either supply real material (helm upgrade --set-file global.hubApiGrpcTls.ca.crt=... --set-file global.hubApiGrpcTls.tls.crt=... --set-file global.hubApiGrpcTls.tls.key=...), point an ExternalSecret/SealedSecret at this Secret name and set global.hubApiGrpcTls.externalSecret=true, or fix global.deploymentTier if this really is alpha/local." $secretName .Values.namespace $tier) }}
{{- else }}
{{- $ca := genCA (printf "%s-hub-api-grpc-ca" (include "waddlebot.fullname" .)) 365 }}
{{- $cert := genSignedCert $desiredIdentity nil $desiredDnsNames 365 $ca }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub-api-grpc-tls
  annotations:
    helm.sh/resource-policy: keep
    waddlebot.io/cert-identity: {{ $desiredIdentity | quote }}
    waddlebot.io/cert-sans-sha256: {{ $desiredSansHash | quote }}
type: Opaque
stringData:
  ca.crt: {{ $ca.Cert | quote }}
  tls.crt: {{ $cert.Cert | quote }}
  tls.key: {{ $cert.Key | quote }}
{{- end }}
{{- end }}

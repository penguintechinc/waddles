{{- if .Values.modules.actionServerless.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "waddlebot.fullname" . }}-action-serverless
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: action-serverless
spec:
  replicas: {{ .Values.modules.actionServerless.replicas }}
  selector:
    matchLabels:
      {{- include "waddlebot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: action-serverless
  template:
    metadata:
      labels:
        {{- include "waddlebot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: action-serverless
    spec:
      serviceAccountName: {{ include "waddlebot.serviceAccountName" . }}
      {{- include "waddlebot.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
      # fix/chart-fresh-install-hooks (alpha 2026-10-01) -- waits on hub-api's own /ready.
      {{- include "waddlebot.waitForHubApiInitContainer" . | nindent 6 }}
      containers:
      - name: action-serverless
        image: "{{ include "waddlebot.legacyModuleImage" (dict "root" . "module" "action-serverless" "imageTag" .Values.modules.actionServerless.imageTag) }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        ports:
        - name: http
          containerPort: 8103
          protocol: TCP
        - name: grpc-lambda
          containerPort: 50051
          protocol: TCP
        - name: grpc-openwhisk
          containerPort: 50052
          protocol: TCP
        - name: grpc-gcp
          containerPort: 50053
          protocol: TCP
        envFrom:
        - configMapRef:
            name: {{ include "waddlebot.fullname" . }}-config
        - secretRef:
            name: {{ include "waddlebot.fullname" . }}-secrets
        env:
        - name: MODULE_NAME
          value: "action-serverless"
        - name: MODULE_PORT
          value: "8103"
        {{- include "waddlebot.grpcTlsInsecureDevEnv" . | nindent 8 }}
        {{- if eq (include "waddlebot.grpcTlsMaterialAvailable" .) "true" }}
        {{- include "waddlebot.grpcTlsServerEnv" . | nindent 8 }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.modules.actionServerless.resources | nindent 10 }}
        volumeMounts:
        - name: logs
          mountPath: /var/log/waddlebotlog
        - name: tmp
          mountPath: /tmp
        {{- if eq (include "waddlebot.grpcTlsMaterialAvailable" .) "true" }}
        {{- include "waddlebot.grpcTlsVolumeMount" . | nindent 8 }}
        {{- end }}
      volumes:
      - name: logs
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      {{- if eq (include "waddlebot.grpcTlsMaterialAvailable" .) "true" }}
      {{- include "waddlebot.grpcTlsVolume" . | nindent 6 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "waddlebot.fullname" . }}-action-serverless
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: action-serverless
spec:
  type: ClusterIP
  ports:
  - port: 8103
    targetPort: http
    protocol: TCP
    name: http
  - port: 50051
    targetPort: grpc-lambda
    protocol: TCP
    name: grpc-lambda
  - port: 50052
    targetPort: grpc-openwhisk
    protocol: TCP
    name: grpc-openwhisk
  - port: 50053
    targetPort: grpc-gcp
    protocol: TCP
    name: grpc-gcp
  selector:
    {{- include "waddlebot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: action-serverless
{{- end }}

{{- if .Values.ingress.enabled -}}
{{- $fullName := include "waddlebot.fullname" . -}}
{{- /*
Defence in depth: hub-api's /api/v1/internal prefix is service-to-service only (machine-JWT) and must
never be reachable from the public Ingress. Refuse a path naming that prefix, or a prefix covering
it ("/", "/api", "/api/v1") that targets hub-api directly (hub-webui is the only public front door).
*/ -}}
{{- range .Values.ingress.hosts }}{{ range .paths }}
{{- $p := (.path | toString | lower | trimSuffix "/") }}
{{- $target := printf "%s %s" ((.service | default "") | toString) ((.rawService | default "") | toString) }}
{{- if regexMatch "^/api/v[0-9]+/internal" $p }}{{ fail (printf "ingress path %q exposes hub-api internal routes" .path) }}{{ end }}
{{- if and (contains "hub-api" $target) (regexMatch "^(/api(/v[0-9]+)?)?$" $p) }}{{ fail (printf "ingress path %q routes a prefix covering /api/v1/internal directly to hub-api" .path) }}{{ end }}
{{- end }}{{ end }}
{{- if and .Values.ingress.className (not (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion)) }}
  {{- if not (hasKey .Values.ingress.annotations "kubernetes.io/ingress.class") }}
  {{- $_ := set .Values.ingress.annotations "kubernetes.io/ingress.class" .Values.ingress.className}}
  {{- end }}
{{- end }}
{{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1
{{- else if semverCompare ">=1.14-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1beta1
{{- else -}}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if and .Values.ingress.className (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- if and .pathType (semverCompare ">=1.18-0" $.Capabilities.KubeVersion.GitVersion) }}
            pathType: {{ .pathType }}
            {{- end }}
            backend:
              {{- if semverCompare ">=1.19-0" $.Capabilities.KubeVersion.GitVersion }}
              service:
                name: {{ if .rawService }}{{ .rawService }}{{ else }}{{ $fullName }}-{{ .service }}{{ end }}
                port:
                  number: {{ include "waddlebot.routeBackendPort" (dict "root" $ "route" .) }}
              {{- else }}
              serviceName: {{ if .rawService }}{{ .rawService }}{{ else }}{{ $fullName }}-{{ .service }}{{ end }}
              servicePort: {{ include "waddlebot.routeBackendPort" (dict "root" $ "route" .) }}
              {{- end }}
          {{- end }}
    {{- end }}
{{- end }}

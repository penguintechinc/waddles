# feature/e2e-helm-rust-dataplane -- Rust svc-action (core/svc_action, M3 executor
# integration landed) Deployment, ADDITIVE to templates/svc-action.yaml's Python
# Deployment -- never replaces it. Gated on the top-level pipeline.rustDataPlane.enabled
# flag (default false) plus this stage's own .enabled sub-flag. See
# templates/svc-ingest-rust.yaml's header for the full `-rust` resource-naming-vs-shared-
# image-tag rationale (identical here) -- not repeated per file.
#
# This is the ONE stage whose host-API mTLS server (core/svc_action/src/host_api.rs) is
# real today -- pipeline.rustDataPlane.bundleExecutor.stageTarget defaults to
# svc-action-rust for exactly this reason (svc-process's own host-API is TODO(M4), see
# templates/svc-process-rust.yaml). The HOST_API_SERVER_CERT_FILE/KEY_FILE/CLIENT_CA_FILE
# env + volume below only render when waddlebot.hostApiTlsMaterialAvailable is true (real
# PEM material supplied via global.hostApiTls, see its values.yaml comment) -- otherwise
# host_api.rs's own build_server_config fails closed with a clear "must both be set" error
# INSIDE its own spawned task (try_start_host_api's graceful-degradation contract), never
# crashing this pod's HTTP/metrics servers.
{{- if and .Values.pipeline.rustDataPlane.enabled .Values.pipeline.rustDataPlane.svcAction.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "waddlebot.fullname" . }}-svc-action-rust
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: svc-action-rust
spec:
  replicas: {{ .Values.pipeline.rustDataPlane.svcAction.replicas }}
  selector:
    matchLabels:
      {{- include "waddlebot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: svc-action-rust
  template:
    metadata:
      labels:
        {{- include "waddlebot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: svc-action-rust
    spec:
      # Dedicated identity (feature/eddsa-machine-jwt, security review HIGH
      # finding) -- distinguishes this deployment's pods from every other
      # workload in the namespace for `flask_core.service_jwt`'s TokenReview
      # bootstrap; see templates/service-jwt-rbac.yaml. Shared with the
      # Python svc-action Deployment above -- both are the same logical
      # caller identity, never both running against hub-api at once in a
      # given environment.
      serviceAccountName: svc-action
      {{- include "waddlebot.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
      {{- include "waddlebot.dbMigrateInitContainer" . | nindent 6 }}
      containers:
      - name: svc-action-rust
        image: "{{ include "waddlebot.legacyModuleImage" (dict "root" . "module" (.Values.pipeline.rustDataPlane.svcAction.imageRepository | default "svc-action-rust") "imageTag" .Values.global.imageTag) }}"
        # Hardcoded Always -- see templates/svc-process-rust.yaml's comment on this same line
        # for the node-image-cache rationale (identical here).
        # feature/ci-chart-kind-e2e -- Always is right for real alpha (mutable
        # tag reuse staleness, see comment above/nearby), but wrong whenever
        # global.imagePullPolicy is explicitly "Never" (kind/CI, air-gapped,
        # `kind load`-ed images only) -- Always would force a real registry
        # pull attempt that can never succeed there. "Never" itself carries no
        # staleness risk to guard against (no pull happens at all either way).
        imagePullPolicy: {{ eq .Values.global.imagePullPolicy "Never" | ternary "Never" "Always" }}
        # Pinned to the Rust image's own `appuser` (uid 10001, core/svc_action/
        # Dockerfile.rust), not the chart-wide .Values.securityContext (uid 1000) the
        # Python placeholder templates use -- same pattern as templates/svc-streaming.yaml.
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: {{ .Values.pipeline.rustDataPlane.svcAction.port }}
          protocol: TCP
        - name: metrics
          containerPort: {{ .Values.pipeline.rustDataPlane.svcAction.metricsPort }}
          protocol: TCP
        - name: host-api
          containerPort: {{ .Values.pipeline.rustDataPlane.svcAction.hostApiPort }}
          protocol: TCP
        envFrom:
        - configMapRef:
            name: {{ include "waddlebot.fullname" . }}-config
        - secretRef:
            name: {{ include "waddlebot.fullname" . }}-secrets
        env:
        - name: MODULE_PORT
          value: {{ .Values.pipeline.rustDataPlane.svcAction.port | quote }}
        - name: METRICS_PORT
          value: {{ .Values.pipeline.rustDataPlane.svcAction.metricsPort | quote }}
        - name: HOST_API_PORT
          value: {{ .Values.pipeline.rustDataPlane.svcAction.hostApiPort | quote }}
        # fix/executor-link-heartbeat (alpha 2026-10-02 incident): how often
        # this stage pings each connected executor session, and how long
        # `/health` tolerates zero live sessions before liveness (not just
        # readiness) fails -- see `core/svc_action/src/host_api.rs`.
        - name: HEARTBEAT_INTERVAL_MS
          value: {{ .Values.pipeline.rustDataPlane.svcAction.heartbeatIntervalMs | default 5000 | quote }}
        - name: EXECUTOR_GRACE_SECONDS
          value: {{ .Values.pipeline.rustDataPlane.svcAction.executorGraceSeconds | default 60 | quote }}
        # Security review fix (PR #468, MEDIUM): the bundle `http` egress guard's
        # cluster-CIDR denylist and instance-wide private-IP policy
        # (bundle_host_http::egress::{ClusterCidrDenylist,InstanceEgressPolicy}) -- shared
        # across every Rust data-plane stage so pod/Service/node ranges are declared once.
        # DEPLOYMENT_TIER itself comes from the shared ConfigMap (envFrom above,
        # global.deploymentTier) -- CliConfig::validate hard-fails startup if this list is
        # empty outside alpha/local. See values.yaml's own comment on this key for the
        # "OVERRIDE REQUIRED in beta/gamma/production" note.
        - name: EGRESS_CLUSTER_CIDR_DENYLIST
          value: {{ .Values.pipeline.rustDataPlane.egressClusterCidrDenylist | join "," | quote }}
        - name: INSTANCE_EGRESS_ALLOW_PRIVATE_IP
          value: {{ .Values.pipeline.rustDataPlane.instanceEgressAllowPrivateIp | quote }}
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: DB_PASSWORD
        # fix/helm-platform-credentials -- core/svc_action/src/config.rs reads
        # this directly (`std::env::var("DISCORD_BOT_TOKEN").ok()`) and already
        # degrades gracefully (relay provider disabled, clear log line) when
        # absent -- see capabilities.rs/lib.rs. Sourced from the
        # operator-managed platform-credentials Secret, never the
        # chart-rendered `-secrets` Secret; `optional: true` so an
        # unconfigured community starts without this var.
        - name: DISCORD_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.platformCredentialsSecretName" . }}
              key: DISCORD_BOT_TOKEN
              optional: true
        - name: WADDLES_SANDBOX_GVISOR
          value: {{ .Values.pipeline.rustDataPlane.svcAction.sandboxGvisor | quote }}
        # Per-call wall-clock budget handed to the executor on every `invoke` -- kept in
        # sync with bundleExecutor.callTimeoutMs (the SAME spec SS7.3 default, 2000ms) so
        # the stage and the executor it drives never disagree about the budget.
        - name: EXECUTOR_CALL_TIMEOUT_MS
          value: {{ .Values.pipeline.rustDataPlane.bundleExecutor.callTimeoutMs | quote }}
        # Empty (default) disables the dispatch drain loop entirely -- see config.rs.
        - name: ACTION_APP_ID
          value: {{ .Values.pipeline.rustDataPlane.svcAction.actionAppId | default "" | quote }}
        # ACTION_BUNDLE_* (core/svc_action/src/config.rs) -- the legacy bundle-selection
        # path, active only when the DB-driven active-bundle loader below is not
        # (mutual exclusion, core/svc_action/src/lib.rs's top doc). Field-for-field
        # mirror of svc-process-rust.yaml's own PROCESS_BUNDLE_* block above. Empty
        # digest (default) disables this path entirely.
        - name: ACTION_BUNDLE_DIGEST
          value: {{ .Values.pipeline.rustDataPlane.svcAction.actionBundleDigest | default "" | quote }}
        - name: ACTION_BUNDLE_VERSION
          value: {{ .Values.pipeline.rustDataPlane.svcAction.actionBundleVersion | default "1" | quote }}
        - name: ACTION_BUNDLE_COMPONENT_KEY
          value: {{ .Values.pipeline.rustDataPlane.svcAction.actionBundleComponentKey | default "" | quote }}
        - name: ACTION_BUNDLE_SIDECAR_KEY
          value: {{ .Values.pipeline.rustDataPlane.svcAction.actionBundleSidecarKey | default "" | quote }}
        # DB-driven active-bundle loader (core/svc_action/src/config.rs,
        # core/bundle_active_set) -- see values.yaml's comment on this block. Field-for-
        # field mirror of svc-process-rust.yaml's own identical block.
        - name: DB_READER_HOST
          value: {{ .Values.pipeline.rustDataPlane.svcAction.dbReaderHost | default .Values.infrastructure.postgresql.service.name | quote }}
        - name: DB_READER_PORT
          value: {{ .Values.pipeline.rustDataPlane.svcAction.dbReaderPort | default .Values.infrastructure.postgresql.service.port | quote }}
        - name: DB_READER_NAME
          value: {{ .Values.pipeline.rustDataPlane.svcAction.dbReaderName | default .Values.infrastructure.postgresql.database | quote }}
        # fix/helm-apply-errors -- DB_READER_USER is a plain `value:` here (never
        # valueFrom) and must stay that way. A now-retired chart revision shipped this
        # SAME env var name as `valueFrom: secretKeyRef(waddlebot-bundle-reader/...)`
        # (that Secret no longer exists anywhere in this chart). `kubectl`'s strategic
        # merge patch keys env list items by `name` and deep-merges the matched dict,
        # so any live pod still carrying that old revision's env entry gets BOTH
        # fields on upgrade -- API server then rejects the whole object with
        # `env[N].valueFrom: Invalid value: "": may not be specified when value is not
        # empty` (see scripts/ci/check-helm-rendered-manifest-invariants.py's module
        # docstring; confirmed via `kubectl apply --dry-run=server` against live
        # alpha). That check validates the rendered manifest in isolation and cannot
        # see this class of bug -- it only exists as a diff against a specific live
        # object's history, not a self-conflict in any single rendered document. A
        # cluster already carrying the old revision needs one `helm upgrade
        # --force-replace` (Helm v4) to clear it; never reintroduce `valueFrom` for
        # this name afterward.
        - name: DB_READER_USER
          value: {{ .Values.pipeline.rustDataPlane.svcAction.dbReaderUser | default "svc_action_ro" | quote }}
        - name: DB_READER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: DB_READER_PASSWORD
        {{- /* BUNDLE_SCOPE_TENANT_ID/BUNDLE_SCOPE_COMMUNITY_ID REMOVED -- see
        templates/svc-process-rust.yaml's identical block for the full rationale
        (dataplane scale design, multi-tenant change-log consumer). */}}
        - name: BUNDLE_CONFIG_POLL_SECONDS
          # Incremental change-log poll interval, in whole seconds (floor: 5s).
          value: {{ .Values.pipeline.rustDataPlane.svcAction.bundleConfigPollSeconds | default 300 | quote }}
        - name: BUNDLE_CONFIG_FULL_RECONCILE_MINUTES
          # Periodic full active-set reconcile interval, in whole minutes (floor: 1m).
          value: {{ .Values.pipeline.rustDataPlane.svcAction.bundleConfigFullReconcileMinutes | default 15 | quote }}
        - name: ENVELOPE_BINDING_KEYS
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: ENVELOPE_BINDING_KEYS
        {{- if .Values.pipeline.rustDataPlane.svcAction.envelopeBindingActiveKid }}
        - name: ENVELOPE_BINDING_ACTIVE_KID
          value: {{ .Values.pipeline.rustDataPlane.svcAction.envelopeBindingActiveKid | quote }}
        {{- end }}
        {{- if eq (include "waddlebot.valkeyTlsMaterialAvailable" .) "true" }}
        # fix/valkey-tls-alpha -- see templates/svc-process-rust.yaml's comment on this same
        # override block for the full rationale (identical here).
        - name: VALKEY_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: VALKEY_URL_TLS
        - name: VALKEY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: REDIS_PASSWORD
        {{- end }}
        {{- if eq (include "waddlebot.hostApiTlsMaterialAvailable" .) "true" }}
        {{- include "waddlebot.hostApiTlsServerEnv" . | nindent 8 }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.pipeline.rustDataPlane.svcAction.resources | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        {{- if eq (include "waddlebot.hostApiTlsMaterialAvailable" .) "true" }}
        {{- include "waddlebot.hostApiTlsVolumeMount" . | nindent 8 }}
        {{- end }}
        {{- if eq (include "waddlebot.valkeyTlsMaterialAvailable" .) "true" }}
        {{- include "waddlebot.valkeyTlsCaVolumeMount" . | nindent 8 }}
        {{- end }}
        {{- include "waddlebot.serviceJwtBootstrapVolumeMount" . | nindent 8 }}
      volumes:
      - name: tmp
        emptyDir: {}
      {{- include "waddlebot.serviceJwtBootstrapVolume" . | nindent 6 }}
      {{- if eq (include "waddlebot.hostApiTlsMaterialAvailable" .) "true" }}
      {{- include "waddlebot.hostApiTlsVolume" . | nindent 6 }}
      {{- end }}
      {{- if eq (include "waddlebot.valkeyTlsMaterialAvailable" .) "true" }}
      {{- include "waddlebot.valkeyTlsCaVolume" . | nindent 6 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "waddlebot.fullname" . }}-svc-action-rust
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: svc-action-rust
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.pipeline.rustDataPlane.svcAction.port }}
    targetPort: http
    protocol: TCP
    name: http
  - port: {{ .Values.pipeline.rustDataPlane.svcAction.metricsPort }}
    targetPort: metrics
    protocol: TCP
    name: metrics
  - port: {{ .Values.pipeline.rustDataPlane.svcAction.hostApiPort }}
    targetPort: host-api
    protocol: TCP
    name: host-api
  selector:
    {{- include "waddlebot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: svc-action-rust
{{- end }}

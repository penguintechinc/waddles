{{- if .Values.modules.marketplace.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "waddlebot.fullname" . }}-marketplace
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: marketplace
spec:
  replicas: {{ .Values.modules.marketplace.replicas }}
  selector:
    matchLabels:
      {{- include "waddlebot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: marketplace
  template:
    metadata:
      labels:
        {{- include "waddlebot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: marketplace
    spec:
      serviceAccountName: {{ include "waddlebot.serviceAccountName" . }}
      {{- include "waddlebot.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
      # fix/chart-fresh-install-hooks (alpha 2026-10-01) -- waits on hub-api's own /ready.
      {{- include "waddlebot.waitForHubApiInitContainer" . | nindent 6 }}
      containers:
      - name: marketplace
        image: "{{ include "waddlebot.legacyModuleImage" (dict "root" . "module" "marketplace" "imageTag" .Values.modules.marketplace.imageTag) }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        ports:
        - name: http
          containerPort: 8100
          protocol: TCP
        envFrom:
        - configMapRef:
            name: {{ include "waddlebot.fullname" . }}-config
        - configMapRef:
            name: {{ include "waddlebot.fullname" . }}-marketplace-config
            optional: true
        - secretRef:
            name: {{ include "waddlebot.fullname" . }}-secrets
        - secretRef:
            name: {{ include "waddlebot.fullname" . }}-marketplace-secret
            optional: true
        env:
        # H-1/H-3 -- this workload's OWN least-privilege database identity (role waddles_legacy_marketplace;
        # config/postgres/service-roles.yaml). Overrides the envFrom block above; the database
        # owner/superuser credential is NOT in waddlebot-secrets any more.
{{- include "waddlebot.dbEnv" (dict "root" . "role" "waddles_legacy_marketplace") | nindent 8 }}
        - name: MODULE_NAME
          value: "marketplace"
        - name: MODULE_PORT
          value: "8100"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.modules.marketplace.resources | nindent 10 }}
        volumeMounts:
        - name: logs
          mountPath: /var/log/waddlebotlog
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: logs
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "waddlebot.fullname" . }}-marketplace
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: marketplace
spec:
  type: {{ .Values.modules.marketplace.service.type | default "ClusterIP" }}
  ports:
  - port: 8100
    targetPort: http
    protocol: TCP
    name: http
    {{- if and (eq (.Values.modules.marketplace.service.type | default "ClusterIP") "NodePort") .Values.modules.marketplace.service.nodePort }}
    nodePort: {{ .Values.modules.marketplace.service.nodePort }}
    {{- end }}
  selector:
    {{- include "waddlebot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: marketplace
{{- end }}

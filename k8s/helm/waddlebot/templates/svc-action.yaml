# v3.0.x Task 0.5 — SKELETON. Pipeline stage 3/3: outbound actions, interaction Apps,
# third-party App calls. Folds 8 legacy interaction/action Deployments — see
# PIPELINE_MAPPING.md for the full file-by-file list. Coexists with those 8 legacy
# Deployments; cutover is a later task.
#
# Module bundle gating: presence of MODULE_LOAD_* env vars signals which Module App bundles
# this stage should import. The actual conditional Python import behind these env vars is
# the remaining build — this skeleton only proves the values flag reaches the container.
{{- if .Values.pipeline.svcAction.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "waddlebot.fullname" . }}-svc-action
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: svc-action
spec:
  replicas: {{ .Values.pipeline.svcAction.replicas }}
  selector:
    matchLabels:
      {{- include "waddlebot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: svc-action
  template:
    metadata:
      labels:
        {{- include "waddlebot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: svc-action
    spec:
      serviceAccountName: {{ include "waddlebot.serviceAccountName" . }}
      {{- include "waddlebot.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
      {{- include "waddlebot.dbMigrateInitContainer" . | nindent 6 }}
      containers:
      - name: svc-action
        # fix/alpha-helm-deploy -- core/svc_action/Dockerfile now exists; no longer the
        # shared pipeline.pythonBaseImage skeleton placeholder. Bare module name
        # "svc-action" is the alpha-local repo under global.imageRegistry -- see
        # scripts/deploy-alpha.sh.
        image: "{{ include "waddlebot.legacyModuleImage" (dict "root" . "module" "svc-action" "imageTag" .Values.global.imageTag) }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        ports:
        - name: http
          containerPort: {{ .Values.pipeline.svcAction.port }}
          protocol: TCP
        envFrom:
        - configMapRef:
            name: {{ include "waddlebot.fullname" . }}-config
        - secretRef:
            name: {{ include "waddlebot.fullname" . }}-secrets
        env:
        - name: MODULE_NAME
          value: "svc-action"
        - name: PIPELINE_STAGE
          value: "action"
        - name: MODULE_PORT
          value: {{ .Values.pipeline.svcAction.port | quote }}
        # T10 (v3 demo) -- Valkey pub/sub + stage LPUSH/RPOP transport (VALKEY_URL),
        # shared runner tenant scope (RUNNER_TENANT_SLUG; RUNNER_COMMUNITY_ID
        # deliberately UNSET -- tenant-wide per roadmap DATA-MODEL GAPS), hub-api
        # callback URL, and the JWT signing key shared with hub-api (same Secret key
        # SECRET_KEY as hub-api.yaml -- see templates/secrets.yaml).
        - name: VALKEY_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: VALKEY_URL
        - name: RUNNER_TENANT_SLUG
          value: {{ .Values.pipeline.runnerTenantSlug | quote }}
        - name: HUB_API_URL
          value: "http://{{ include "waddlebot.fullname" . }}-hub-api-v3:{{ .Values.pipeline.hubApi.port }}"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: SECRET_KEY
        # ONE-WAY AI kill-switch, same value hub-api.yaml renders as WADDLES_AI_ENABLED
        # (single toggle: pipeline.hubApi.aiEnabled) -- v3 demo runs the whole pipeline
        # with WaddleAI disabled, not just hub-api.
        - name: WADDLES_AI_ENABLED
          value: {{ .Values.pipeline.hubApi.aiEnabled | quote }}
        # svc-action writes action_dispatch_log rows directly (core/svc_action/runner.py)
        # and sends outbound Discord messages via CANON-LIB (waddle_transports) using this
        # bot token -- same Secret keys hub-api/svc-ingest already read.
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: DATABASE_URL
        - name: DISCORD_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-secrets
              key: DISCORD_BOT_TOKEN
        {{- if .Values.modules.bot.enabled }}
        - name: MODULE_LOAD_BOT
          value: "true"
        {{- end }}
        {{- if .Values.modules.social.enabled }}
        - name: MODULE_LOAD_SOCIAL
          value: "true"
        {{- end }}
        {{- if .Values.modules.customer.enabled }}
        - name: MODULE_LOAD_CUSTOMER
          value: "true"
        {{- end }}
        {{- if .Values.modules.marketing.enabled }}
        - name: MODULE_LOAD_MARKETING
          value: "true"
        {{- end }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.pipeline.svcAction.resources | nindent 10 }}
        volumeMounts:
        - name: logs
          mountPath: /var/log/waddlebotlog
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: logs
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "waddlebot.fullname" . }}-svc-action
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: svc-action
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.pipeline.svcAction.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "waddlebot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: svc-action
{{- end }}

# Marketplace source auto-update CronJob (Phase 1, Task 8) -- runs hub_api/cli/marketplace_source_rescan.py.
# Resolves each external source's `ref` to its latest commit via `git ls-remote` THROUGH the allowlisting
# git-proxy (no clone/build/scan/install), records new commits as pending_commit_sha and notifies admins
# via the audit chain. NEVER advances a pin -- only the human approve-update does. Same hub-api image,
# rootless/restricted, own egress policy (same-namespace: git-proxy + DB, DNS) via workloadPolicies.
# Needs gitProxy.enabled (the proxy URL is the only egress route; absent => every check fails closed).
{{- if and .Values.sourceAutoUpdate.enabled .Values.gitProxy.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "waddlebot.fullname" . }}-marketplace-source-rescan
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: marketplace-source-rescan
spec:
  schedule: {{ .Values.sourceAutoUpdate.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.sourceAutoUpdate.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.sourceAutoUpdate.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "waddlebot.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: marketplace-source-rescan
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "waddlebot.serviceAccountName" . }}
          {{- include "waddlebot.imagePullSecrets" . | nindent 10 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
          {{- include "waddlebot.waitForHubApiInitContainer" . | nindent 10 }}
          containers:
          - name: marketplace-source-rescan
            image: "{{ include "waddlebot.legacyModuleImage" (dict "root" . "module" "hub-api" "imageTag" (.Values.hubApi.imageTag | default .Values.global.imageTag)) }}"
            imagePullPolicy: {{ .Values.global.imagePullPolicy }}
            command: ["python3", "-m", "cli.marketplace_source_rescan"]
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
              seccompProfile:
                type: RuntimeDefault
            envFrom:
            - configMapRef:
                name: {{ include "waddlebot.fullname" . }}-config
            - secretRef:
                name: {{ include "waddlebot.fullname" . }}-secrets
            env:
            # H-1/H-3 -- this workload's OWN least-privilege database identity (role waddles_hub_api;
            # config/postgres/service-roles.yaml). Overrides the envFrom block above; the database
            # owner/superuser credential is NOT in waddlebot-secrets any more.
{{- include "waddlebot.dbEnv" (dict "root" . "role" "waddles_hub_api") | nindent 12 }}
            - name: MODULE_NAME
              value: "marketplace-source-rescan"
            - name: MARKETPLACE_GIT_PROXY_URL
              value: "http://{{ include "waddlebot.fullname" . }}-git-proxy:{{ .Values.gitProxy.port }}"
            resources:
              {{- toYaml .Values.sourceAutoUpdate.resources | nindent 14 }}
            volumeMounts:
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: tmp
            emptyDir: {}
{{- include "waddlebot.workloadPolicies" (dict "root" $ "component" "marketplace-source-rescan" "ports" (list ) "runtime" "python") }}
{{- end }}

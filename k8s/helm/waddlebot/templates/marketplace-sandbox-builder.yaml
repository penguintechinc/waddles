# Marketplace-sources sandbox builder (Phase 1, Task 7B). hub-api creates the per-build Jobs at
# runtime from services/marketplace_sandbox_builder.py::build_job_manifest; THIS template renders
# the standing policy around them so the lockdown does not depend on the Job spec alone:
#   - dedicated ServiceAccount (token never mounted) the build pods run as
#   - minimal Role/RoleBinding (bound ONLY to hub-api's dedicated SA) letting hub-api create/read/delete build Jobs + their ConfigMaps
#     and read build-pod logs (the artifact return path) -- nothing else
#   - deny-ALL-egress (and ingress) CiliumNetworkPolicy for build pods: offline, no DNS, no cluster
#     or world access, so a malicious build can neither fetch code nor exfiltrate
#   - Tetragon TracingPolicy: exec allowlist = the builder's toolchain only (SIGKILL)
#   - `helm test` Job: runs the builder image under the SAME lockdown and asserts egress is denied
#   - ValidatingAdmissionPolicy confining hub-api's Job-create to sandbox build Jobs
#   - (follow-up) dedicated build namespace -- deferred: needs cross-ns Role/CNP/Tetragon/PSA + hub config
# Pod Security Admission `restricted` is the chart-wide namespace posture (values podSecurity...);
# every pod this renders/creates is restricted-compliant (non-root, no caps, RuntimeDefault seccomp).
{{- if .Values.sandboxBuilder.enabled }}
{{- $sb := .Values.sandboxBuilder }}
{{- $name := printf "%s-sandbox-builder" (include "waddlebot.fullname" .) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-builder
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-launcher
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-builder
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-launcher
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-builder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-launcher
subjects:
  # ONLY hub-api's dedicated ServiceAccount -- never the shared chart SA (privilege escalation).
  - kind: ServiceAccount
    name: {{ include "waddlebot.hubApiServiceAccountName" . }}
    namespace: {{ .Values.namespace }}
---
# Admission constraint (native ValidatingAdmissionPolicy, GA k8s 1.30 -- no Kyverno dependency):
# a Job created BY hub-api's ServiceAccount must be a sandbox build Job and nothing else, so the
# Job-create right cannot launch a secret-mounting / hostPath / privileged-identity Job.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}-job-guard
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-builder
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
  matchConditions:
    - name: from-hub-api-sa
      expression: {{ printf "request.userInfo.username == 'system:serviceaccount:%s:%s'" .Values.namespace (include "waddlebot.hubApiServiceAccountName" .) | quote }}
  variables:
    - name: pod
      expression: "object.spec.template.spec"
  validations:
    - expression: "has(object.metadata.labels) && 'app.kubernetes.io/component' in object.metadata.labels && object.metadata.labels['app.kubernetes.io/component'] == 'sandbox-builder'"
      message: "hub-api may only create Jobs labelled app.kubernetes.io/component=sandbox-builder"
    - expression: "has(object.spec.template.metadata) && has(object.spec.template.metadata.labels) && object.spec.template.metadata.labels['app.kubernetes.io/component'] == 'sandbox-builder'"
      message: "sandbox Job pod template must carry component=sandbox-builder"
    - expression: {{ printf "has(object.spec.template.metadata) && has(object.spec.template.metadata.labels) && object.spec.template.metadata.labels['app.kubernetes.io/name'] == '%s' && object.spec.template.metadata.labels['app.kubernetes.io/instance'] == '%s'" (include "waddlebot.name" .) .Release.Name | quote }}
      message: "sandbox Job pod template must carry the full selector label set (name+instance+component) so the CNP/Tetragon sandbox selectors match it"
    - expression: {{ printf "has(variables.pod.serviceAccountName) && variables.pod.serviceAccountName == '%s'" $name | quote }}
      message: "sandbox Job must run as the sandbox-builder ServiceAccount"
    - expression: "has(variables.pod.automountServiceAccountToken) && variables.pod.automountServiceAccountToken == false"
      message: "sandbox Job must set automountServiceAccountToken: false"
    - expression: "!has(variables.pod.volumes) || variables.pod.volumes.all(v, has(v.configMap) || has(v.emptyDir))"
      message: "sandbox Job may only use configMap/emptyDir volumes (no secret/hostPath/projected)"
    - expression: "!has(variables.pod.hostNetwork) || variables.pod.hostNetwork == false"
      message: "sandbox Job must not use hostNetwork"
    - expression: "!has(variables.pod.hostPID) || variables.pod.hostPID == false"
      message: "sandbox Job must not use hostPID"
    - expression: "!has(variables.pod.hostIPC) || variables.pod.hostIPC == false"
      message: "sandbox Job must not use hostIPC"
    - expression: "!has(variables.pod.shareProcessNamespace) || variables.pod.shareProcessNamespace == false"
      message: "sandbox Job must not set shareProcessNamespace"
    - expression: "!has(variables.pod.nodeName)"
      message: "sandbox Job must not pin a nodeName"
    - expression: "variables.pod.containers.all(c, has(c.securityContext) && (!has(c.securityContext.privileged) || c.securityContext.privileged == false))"
      message: "sandbox Job container must not be privileged"
    - expression: "variables.pod.containers.all(c, has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false)"
      message: "sandbox Job container must set allowPrivilegeEscalation: false"
    - expression: "variables.pod.containers.all(c, has(c.securityContext) && has(c.securityContext.runAsNonRoot) && c.securityContext.runAsNonRoot == true)"
      message: "sandbox Job container must set runAsNonRoot: true"
    - expression: "variables.pod.containers.all(c, has(c.securityContext) && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop) && 'ALL' in c.securityContext.capabilities.drop && !has(c.securityContext.capabilities.add))"
      message: "sandbox Job container must drop ALL capabilities and add none"
    - expression: "!has(variables.pod.initContainers) && variables.pod.containers.size() == 1"
      message: "sandbox Job must have exactly one container and no initContainers"
    - expression: {{ printf "variables.pod.containers.all(c, c.image == '%s')" (include "waddlebot.legacyModuleImage" (dict "root" . "module" $sb.image "imageTag" $sb.imageTag)) | quote }}
      message: "sandbox Job must use the pinned sandbox-builder image"
    - expression: "variables.pod.containers.all(c, !has(c.envFrom) && (!has(c.env) || c.env.all(e, !has(e.valueFrom))))"
      message: "sandbox Job containers must not reference secrets/configmaps via env"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}-job-guard
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-builder
spec:
  policyName: {{ $name }}-job-guard
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Values.namespace | quote }}
---
# Deny ALL egress (DNS included) and ALL ingress: `- {}` enables default-deny for the direction
# with no allow rule. Build pods are selected by the component label hub-api stamps on them.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $name }}-deny-all
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-builder
spec:
  endpointSelector:
    matchLabels:
      {{- include "waddlebot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: sandbox-builder
  ingress:
    - {}
  egress:
    - {}
{{- if .Values.tetragon.enabled }}
---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: {{ $name }}-exec-allowlist
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-builder
spec:
  podSelector:
    matchLabels:
      {{- include "waddlebot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: sandbox-builder
  kprobes:
    - call: "sys_execve"
      syscall: true
      args:
        - index: 0
          type: "string"
      selectors:
        # Kill any exec that is neither an allowlisted binary NOR under an allowlisted directory.
        - matchArgs:
            - index: 0
              operator: "NotEqual"
              values:
                {{- range $sb.execPaths }}
                - {{ . | quote }}
                {{- end }}
            - index: 0
              operator: "NotPrefix"
              values:
                {{- range $sb.execPrefixes }}
                - {{ . | quote }}
                {{- end }}
          matchActions:
            - action: {{ .Values.tetragon.action }}
{{- end }}
---
# `helm test`: the same lockdown, running the builder's --selftest (toolchain present AND a TCP
# connect to the internet must FAIL -- proves the deny-all CNP is enforced).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-selftest
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-builder
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ $sb.deadlineSeconds }}
  ttlSecondsAfterFinished: {{ $sb.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "waddlebot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: sandbox-builder
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostNetwork: false
      {{- include "waddlebot.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: builder
          image: "{{ include "waddlebot.legacyModuleImage" (dict "root" . "module" $sb.image "imageTag" $sb.imageTag) }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["--selftest"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: {{ $sb.resources.cpu | quote }}
              memory: {{ $sb.resources.memory | quote }}
              ephemeral-storage: {{ $sb.resources.ephemeralStorage | quote }}
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          emptyDir:
            sizeLimit: {{ $sb.scratchSizeLimit | quote }}
{{- end }}

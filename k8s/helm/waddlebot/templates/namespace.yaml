{{- if .Values.namespaceCreate }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    name: {{ .Values.namespace }}
    app.kubernetes.io/name: waddlebot
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    {{- if .Values.podSecurity.enabled }}
    {{- if and .Values.spire.enabled (has .Values.podSecurity.enforce (list "restricted" "baseline")) }}
    {{- fail "podSecurity.enforce must be `privileged` while spire.enabled=true: the SPIRE agent DaemonSet is an approved ROOT EXCEPTION (uid 0 + hostPath Workload-API socket dir, charts/spire/templates/agent-daemonset.yaml) and is rejected by BOTH baseline and restricted. Keep audit/warn=restricted, or run SPIRE in its own namespace to enforce restricted here." }}
    {{- end }}
    # Pod Security Admission (R5) -- cluster-security baseline: `restricted` enforced, audited, warned.
    pod-security.kubernetes.io/enforce: {{ .Values.podSecurity.enforce | quote }}
    pod-security.kubernetes.io/enforce-version: {{ .Values.podSecurity.version | quote }}
    pod-security.kubernetes.io/audit: {{ .Values.podSecurity.audit | quote }}
    pod-security.kubernetes.io/audit-version: {{ .Values.podSecurity.version | quote }}
    pod-security.kubernetes.io/warn: {{ .Values.podSecurity.warn | quote }}
    pod-security.kubernetes.io/warn-version: {{ .Values.podSecurity.version | quote }}
    {{- end }}
{{- end }}

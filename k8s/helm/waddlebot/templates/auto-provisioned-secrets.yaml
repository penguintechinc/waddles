# feature/helm-auto-provision-keys -- symmetric platform key Secrets (see values.yaml's
# autoProvisionedKeys comment for the full policy). Handled with pure Helm template
# functions (no hook Job needed): `lookup` decides KEEP-vs-GENERATE, `randBytes`/
# `sha256sum` supply the randomness. Both are Helm v4 builtins/Sprig functions, no
# external tooling required.
#
# IMPORTANT -- `lookup` in `helm template`/`helm lint`/`--dry-run`: it always returns an
# empty result outside a real `helm install`/`upgrade` against a live cluster (no API
# server to query in template mode). That means every `helm template` run takes the
# "not found" branch below, which is exactly what we want to validate here: it proves
# generation renders without error, and proves the beta/gamma/production fail-guard
# fires correctly. It does NOT by itself prove keep-on-second-run idempotency against a
# live release -- that guarantee comes from `lookup` only ever querying the real cluster
# during an actual `helm install`/`upgrade`, not from comparing two `helm template`
# outputs (which will be identical to each other regardless, since both take the same
# "not found" branch -- documented so that identity is never mistaken for having
# exercised the keep path).
{{- $tier := .Values.global.deploymentTier }}
{{- $canGenerate := or (eq $tier "alpha") (eq $tier "local") }}

{{- /* --- seaweedfs-sse-kek (feature/seaweedfs-object-storage, was minio-kms PR #439) --- */}}
{{- $minioCfg := .Values.autoProvisionedKeys.seaweedfsSseKek }}
{{- $minioExisting := lookup "v1" "Secret" .Values.namespace $minioCfg.secretName }}
{{- /* fix/no-empty-kept-secrets -- an EMPTY stored value counts as MISSING, not KEEP;
see _helpers.tpl waddlebot.secretKeyNonEmpty header comment for why. */}}
{{- if (include "waddlebot.secretKeyNonEmpty" (dict "existing" $minioExisting "key" $minioCfg.secretKey)) }}
# Kept as-is -- {{ $minioCfg.secretName }} already exists (helm.sh/resource-policy: keep
# means it also survived any prior `helm uninstall`). Not re-templated here on purpose:
# re-declaring it as a chart-owned Secret with `data` would either fight over ownership
# with whoever created it (ExternalSecret/SealedSecret/a previous chart revision) or
# force Helm to re-diff it as an "orphaned" resource going forward.
{{- else if $minioCfg.externalSecret }}
# Skipped -- {{ $minioCfg.secretName }} does not exist yet, but externalSecret: true says
# an ExternalSecret/SealedSecret controller owns and will populate it out-of-band.
{{- else if not $canGenerate }}
{{- fail (printf "autoProvisionedKeys.seaweedfsSseKek: Secret %q not found in namespace %q and global.deploymentTier=%q is outside alpha/local -- auto-generation is alpha/local only. Either pre-create this Secret (WEED_S3_SSE_KEK key, lowercase hex), point an ExternalSecret/SealedSecret at it and set autoProvisionedKeys.seaweedfsSseKek.externalSecret=true, or fix global.deploymentTier if this really is alpha/local." $minioCfg.secretName .Values.namespace $tier) }}
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $minioCfg.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: auto-provisioned-key
  annotations:
    # Survives `helm uninstall` and is never re-generated/rotated by a future
    # `helm upgrade` -- the `lookup` branch above always wins once this exists.
    helm.sh/resource-policy: keep
type: Opaque
data:
  # SeaweedFS s3.sse.kek / WEED_S3_SSE_KEK requires lowercase hex, never base64 --
  # same sha256sum(randBytes) extract-style KDF as tenant-kek below.
  {{ $minioCfg.secretKey }}: {{ sha256sum (randBytes 32) | b64enc }}
{{- end }}
---
{{- /* --- tenant-kek (PR #442) ------------------------------------------------ */}}
{{- $kekCfg := .Values.autoProvisionedKeys.tenantKek }}
{{- $kekExisting := lookup "v1" "Secret" .Values.namespace $kekCfg.secretName }}
{{- /* fix/no-empty-kept-secrets -- an EMPTY stored value counts as MISSING, not KEEP;
see _helpers.tpl waddlebot.secretKeyNonEmpty header comment for why. */}}
{{- if (include "waddlebot.secretKeyNonEmpty" (dict "existing" $kekExisting "key" $kekCfg.secretKey)) }}
# Kept as-is -- see minioKms's identical comment above.
{{- else if $kekCfg.externalSecret }}
# Skipped -- delegated to an external secret manager, see minioKms's identical comment.
{{- else if not $canGenerate }}
{{- fail (printf "autoProvisionedKeys.tenantKek: Secret %q not found in namespace %q and global.deploymentTier=%q is outside alpha/local -- auto-generation is alpha/local only. Either pre-create this Secret (TENANT_KEK_HEX key, lowercase hex), point an ExternalSecret/SealedSecret at it and set autoProvisionedKeys.tenantKek.externalSecret=true, or fix global.deploymentTier if this really is alpha/local." $kekCfg.secretName .Values.namespace $tier) }}
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $kekCfg.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: auto-provisioned-key
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  # hub_api/services/tenant_keystore.py::K8sSecretKekProvider does `bytes.fromhex(...)` --
  # this MUST be lowercase hex, never base64. `randBytes 32` is Helm's own
  # cryptographically-secure random source (documented as such), returned base64-encoded;
  # `sha256sum` re-hashes that high-entropy base64 string down to a fixed 64-lowercase-hex-
  # char (32 byte) digest -- a standard extract-style KDF step, not a weakening of the
  # entropy (still seeded entirely by randBytes' CSPRNG output), and it sidesteps Sprig
  # having no direct "raw bytes -> hex" encoder.
  {{ $kekCfg.secretKey }}: {{ sha256sum (randBytes 32) | b64enc }}
{{- end }}

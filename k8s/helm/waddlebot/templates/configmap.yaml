apiVersion: v1
kind: ConfigMap
metadata:
  name: waddlebot-config
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: waddlebot
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: config
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  # Database Configuration - individual vars for modules to build connection strings
  DB_HOST: {{ .Values.infrastructure.postgresql.service.name | quote }}
  DB_PORT: {{ .Values.infrastructure.postgresql.service.port | quote }}
  DB_NAME: {{ .Values.infrastructure.postgresql.database | quote }}
  # H-1/H-3 -- NO DB_USER / DATABASE_USER here. The database owner (superuser) name used
  # to be handed to every pod through this shared ConfigMap; each workload now sets its OWN
  # role via waddlebot.dbEnv (_helpers.tpl). POSTGRES_USER below is read only by the
  # Postgres Deployment (initdb) and is the owner, not an application identity.
  DB_TYPE: "postgres"
  POSTGRES_USER: {{ .Values.infrastructure.postgresql.username | quote }}
  POSTGRES_DB: {{ .Values.infrastructure.postgresql.database | quote }}
  # Alternative naming convention used by some modules (router, etc.)
  DATABASE_HOST: {{ .Values.infrastructure.postgresql.service.name | quote }}
  DATABASE_PORT: {{ .Values.infrastructure.postgresql.service.port | quote }}
  DATABASE_NAME: {{ .Values.infrastructure.postgresql.database | quote }}

  # Redis Configuration
  REDIS_HOST: {{ .Values.infrastructure.redis.service.name | quote }}
  REDIS_PORT: {{ .Values.infrastructure.redis.service.port | quote }}

  # S3-compatible object storage (SeaweedFS, was MinIO) -- key names kept as
  # MINIO_* for backward compatibility with consumers still reading them
  # (e.g. core/video_proxy_module); S3_* names are the primary/preferred keys.
  MINIO_ENDPOINT: "http://{{ .Values.infrastructure.seaweedfs.service.name }}:{{ .Values.infrastructure.seaweedfs.service.s3Port }}"
  MINIO_CONSOLE_ENDPOINT: "http://{{ .Values.infrastructure.seaweedfs.service.name }}:{{ .Values.infrastructure.seaweedfs.service.masterPort }}"
  S3_ENDPOINT_URL: "http://{{ .Values.infrastructure.seaweedfs.service.name }}:{{ .Values.infrastructure.seaweedfs.service.s3Port }}"
  S3_BUCKET_NAME: {{ .Values.infrastructure.seaweedfs.bucketName | quote }}
  S3_STORAGE_ENABLED: "true"
  # regression: bundle publish/fetch bucket split after SeaweedFS migration (#508/#509) --
  # hub_api/services/storage_service.py's bundle component/sidecar uploads (and
  # hub_api/cli/seed_core_bundles.py, which shares this ConfigMap via envFrom) MUST target
  # the SAME bucket core/bundle_executor's BUNDLE_BUCKET_NAME reads from
  # (pipeline.rustDataPlane.bundleExecutor.bucketName), never S3_BUCKET_NAME
  # ("waddlebot-assets", avatars/community assets only) -- a publish into the wrong bucket
  # 404s for the executor even though the upload itself "succeeded".
  BUNDLE_BUCKET_NAME: {{ .Values.pipeline.rustDataPlane.bundleExecutor.bucketName | quote }}

  # Qdrant Configuration
  QDRANT_URL: "http://{{ .Values.infrastructure.qdrant.service.name }}:{{ .Values.infrastructure.qdrant.service.port }}"
  MEM0_VECTOR_STORE: "qdrant"

  # Ollama Configuration
  OLLAMA_HOST: {{ .Values.infrastructure.ollama.service.name | quote }}
  OLLAMA_PORT: {{ .Values.infrastructure.ollama.service.port | quote }}
  OLLAMA_USE_TLS: "false"
  AI_PROVIDER: {{ .Values.infrastructure.ollama.defaultProvider | quote }}
  AI_MODEL: {{ .Values.infrastructure.ollama.defaultModel | quote }}
  OLLAMA_MODEL: {{ .Values.infrastructure.ollama.defaultModel | quote }}

  # Service URLs - Router
  ROUTER_API_URL: "http://waddlebot-router:8000"

  # Service URLs - Core
  IDENTITY_API_URL: "http://waddlebot-identity-core:8050"
  LABELS_API_URL: "http://waddlebot-labels-core:8023"
  BROWSER_SOURCE_API_URL: "http://waddlebot-browser-source:8027"
  COMMUNITY_API_URL: "http://waddlebot-community:8020"
  REPUTATION_API_URL: "http://waddlebot-reputation:8021"

  # Service URLs - Interactive
  AI_INTERACTION_API_URL: "http://waddlebot-ai-interaction:8005"
  ALIAS_API_URL: "http://waddlebot-alias-interaction:8010"
  SHOUTOUT_API_URL: "http://waddlebot-shoutout-interaction:8011"
  INVENTORY_API_URL: "http://waddlebot-inventory-interaction:8024"
  CALENDAR_API_URL: "http://waddlebot-calendar-interaction:8030"
  MEMORIES_API_URL: "http://waddlebot-memories-interaction:8031"
  YOUTUBE_MUSIC_API_URL: "http://waddlebot-youtube-music:8025"
  SPOTIFY_API_URL: "http://waddlebot-spotify-interaction:8026"
  LOYALTY_API_URL: "http://waddlebot-loyalty-interaction:8032"
  PRESENCE_API_URL: "http://waddlebot-presence:8042"

  # Service URLs - Collectors
  TWITCH_COLLECTOR_API_URL: "http://waddlebot-twitch-collector:8002"
  DISCORD_COLLECTOR_API_URL: "http://waddlebot-discord-collector:8003"
  SLACK_COLLECTOR_API_URL: "http://waddlebot-slack-collector:8004"
  YOUTUBE_LIVE_COLLECTOR_API_URL: "http://waddlebot-youtube-live-collector:8006"
  KICK_COLLECTOR_API_URL: "http://waddlebot-kick-collector:8007"
  TEAMS_COLLECTOR_API_URL: "http://waddlebot-teams-collector:8008"
  MATTERMOST_COLLECTOR_API_URL: "http://waddlebot-mattermost-collector:8009"
  GOOGLECHAT_COLLECTOR_API_URL: "http://waddlebot-googlechat-collector:8012"
  TEAMS_ACTION_API_URL: "http://waddlebot-teams-action:8074"
  MATTERMOST_ACTION_API_URL: "http://waddlebot-mattermost-action:8075"
  GOOGLECHAT_ACTION_API_URL: "http://waddlebot-googlechat-action:8076"

  # CORS Configuration (comma-separated origins for hub-api)
  CORS_ORIGIN: {{ .Values.global.corsOrigin | default "http://localhost:5173" | quote }}

  # General Configuration
  LOG_LEVEL: {{ .Values.global.logLevel | quote }}
  NODE_ENV: {{ .Values.global.nodeEnv | quote }}
  DEPLOYMENT_TIER: {{ .Values.global.deploymentTier | quote }}
  BASE_DOMAIN: {{ .Values.global.baseDomain | quote }}
  OVERLAY_BASE_URL: {{ .Values.global.overlayBaseUrl | quote }}
  OVERLAY_KEY_GRACE_PERIOD_MINUTES: "5"

  # PostgreSQL Init Configuration
  POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"

  # PostHog (feature-flag execution plane) — in-cluster posthog-web Service
  # when posthog.enabled=true and posthog.host is blank, else the external
  # hosted default. See templates/infrastructure/posthog/_helpers.tpl.
  POSTHOG_HOST: {{ include "waddlebot.posthog.effectiveHost" . | quote }}

  # Connector channel configuration (svc-ingest receivers)
  TWITCH_CHANNELS: {{ .Values.config.twitchChannels | default "" | quote }}
  KICK_CHANNELS: {{ .Values.config.kickChannels | default "" | quote }}
  KICK_PUSHER_KEY: {{ .Values.config.kickPusherKey | default "" | quote }}
  KICK_PUSHER_CLUSTER: {{ .Values.config.kickPusherCluster | default "" | quote }}
  YOUTUBE_LIVE_CHANNELS: {{ .Values.config.youtubeLiveChannels | default "" | quote }}
  # RSI Spectrum one-way ingest (gh #101). Flag baseline defaults OFF; PostHog overrides when connected.
  SPECTRUM_FORUM_CHANNELS: {{ .Values.config.spectrumForumChannels | default "" | quote }}
  SPECTRUM_LOBBIES: {{ .Values.config.spectrumLobbies | default "" | quote }}
  FLAG_WADDLES_SPECTRUM_INTEGRATION: {{ .Values.config.spectrumIntegrationEnabled | default false | quote }}

  # Service Discovery URLs
  HUB_API_URL: "http://{{ include "waddlebot.fullname" . }}-hub-api-v3:8204"
  PUBLIC_WEBUI_URL: {{ .Values.webui.publicUrl | quote }}
  # #320 Connections: OAuth redirect_uri base for the per-community connect flow. Empty
  # by default -- hub-api falls back to PUBLIC_WEBUI_URL when this is blank. Override
  # per-env where the provider's accepted redirect host differs from the public link URL
  # (e.g. alpha: Google/Spotify only accept http redirect URIs on localhost).
  CONNECTIONS_CALLBACK_BASE_URL: {{ .Values.webui.connectionsCallbackBaseUrl | default "" | quote }}

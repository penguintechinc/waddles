apiVersion: v1
kind: ConfigMap
metadata:
  name: waddlebot-config
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: waddlebot
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: config
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  # Database Configuration - individual vars for modules to build connection strings
  DB_HOST: {{ include "waddlebot.postgres.host" . | quote }}
  DB_PORT: {{ .Values.infrastructure.postgresql.service.port | quote }}
  DB_NAME: {{ .Values.infrastructure.postgresql.database | quote }}
  # H-1/H-3 -- NO DB_USER / DATABASE_USER here. The database owner (superuser) name used
  # to be handed to every pod through this shared ConfigMap; each workload now sets its OWN
  # role via waddlebot.dbEnv (_helpers.tpl). POSTGRES_USER below is read only by the
  # Postgres Deployment (initdb) and is the owner, not an application identity.
  DB_TYPE: "postgres"
  POSTGRES_USER: {{ .Values.infrastructure.postgresql.username | quote }}
  POSTGRES_DB: {{ .Values.infrastructure.postgresql.database | quote }}
  # Alternative naming convention used by some modules (router, etc.)
  DATABASE_HOST: {{ include "waddlebot.postgres.host" . | quote }}
  DATABASE_PORT: {{ .Values.infrastructure.postgresql.service.port | quote }}
  DATABASE_NAME: {{ .Values.infrastructure.postgresql.database | quote }}

  # S3-compatible object storage (SeaweedFS)
  S3_ENDPOINT_URL: "{{ include "waddlebot.transitTls.s3Endpoint" . }}"
  S3_BUCKET_NAME: {{ .Values.infrastructure.seaweedfs.bucketName | quote }}
  # regression: bundle publish/fetch bucket split after SeaweedFS migration (#508/#509) --
  # hub_api/services/storage_service.py's bundle component/sidecar uploads (and
  # hub_api/cli/seed_core_bundles.py, which shares this ConfigMap via envFrom) MUST target
  # the SAME bucket core/bundle_executor's BUNDLE_BUCKET_NAME reads from
  # (pipeline.rustDataPlane.bundleExecutor.bucketName), never S3_BUCKET_NAME
  # ("waddlebot-assets", avatars/community assets only) -- a publish into the wrong bucket
  # 404s for the executor even though the upload itself "succeeded".
  BUNDLE_BUCKET_NAME: {{ .Values.pipeline.rustDataPlane.bundleExecutor.bucketName | quote }}

  # Qdrant Configuration
  QDRANT_URL: "http://{{ .Values.infrastructure.qdrant.service.name }}:{{ .Values.infrastructure.qdrant.service.port }}"

  # General Configuration
  LOG_LEVEL: {{ .Values.global.logLevel | quote }}
  NODE_ENV: {{ .Values.global.nodeEnv | quote }}
  DEPLOYMENT_TIER: {{ .Values.global.deploymentTier | quote }}
  OVERLAY_BASE_URL: {{ .Values.global.overlayBaseUrl | quote }}

  # PostgreSQL Init Configuration
  POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"

  # PostHog (feature-flag execution plane) — in-cluster posthog-web Service
  # when posthog.enabled=true and posthog.host is blank, else the external
  # hosted default. See templates/infrastructure/posthog/_helpers.tpl.
  POSTHOG_HOST: {{ include "waddlebot.posthog.effectiveHost" . | quote }}

  # waddles.analytics-stream ENV baseline (default OFF; PostHog overrides when connected).
  FLAG_WADDLES_ANALYTICS_STREAM: {{ .Values.config.analyticsStreamEnabled | default false | quote }}
  # waddles.calendar.event_discord_sync ENV baseline (default OFF; PostHog overrides when connected).
  # Read by hub-api via envFrom waddlebot-config.
  FLAG_WADDLES_CALENDAR_EVENT_DISCORD_SYNC: {{ .Values.config.eventDiscordSyncEnabled | default false | quote }}
  # waddles.role_sync ENV baseline (default OFF; PostHog overrides when connected).
  # Read by hub-api AND the role-sync CronJob (hub_api/services/role_sync_service.py) via envFrom waddlebot-config.
  FLAG_WADDLES_ROLE_SYNC: {{ .Values.config.roleSyncEnabled | default false | quote }}
  # waddles.community.guild_pairing (guild pairing + Discord role-mirror routes) and
  # waddles.webui.role_sync_mapping (the admin role-sync page) ENV baselines (default OFF).
  FLAG_WADDLES_COMMUNITY_GUILD_PAIRING: {{ .Values.config.guildPairingEnabled | default false | quote }}
  FLAG_WADDLES_WEBUI_ROLE_SYNC_MAPPING: {{ .Values.config.webuiRoleSyncMappingEnabled | default false | quote }}
  # waddles.webui.super_tenants ENV baseline (super-admin Tenants page; PostHog -> ENV -> default).
  FLAG_WADDLES_WEBUI_SUPER_TENANTS: {{ .Values.config.webuiSuperTenantsEnabled | default false | quote }}
  # waddles.dsar-inbox ENV baseline (DSAR request inbox rollout; PostHog -> ENV -> default OFF).
  # Gates ONLY the new inbox -- the existing manual export/erase/do-not-sell routes are never gated.
  FLAG_WADDLES_DSAR_INBOX: {{ .Values.config.dsarInboxEnabled | default false | quote }}
  # waddles.community-tier-allocation ENV baseline (tenant-admin tier allocation; default OFF).
  FLAG_WADDLES_COMMUNITY_TIER_ALLOCATION: {{ .Values.config.communityTierAllocationEnabled | default false | quote }}
  # DSAR inbox tunables (non-secret). Secrets (DSAR_FINGERPRINT_KEY, captcha secret/HMAC key) come from the Secret.
  DSAR_UNVERIFIED_EXPIRY_HOURS: {{ .Values.config.dsarUnverifiedExpiryHours | default 72 | quote }}
  DSAR_CONTACT_RETENTION_DAYS: {{ .Values.config.dsarContactRetentionDays | default 30 | quote }}
  DSAR_CAPTCHA_PROVIDER: {{ .Values.config.dsarCaptchaProvider | default "" | quote }}
  DSAR_CAPTCHA_SITE_KEY: {{ .Values.config.dsarCaptchaSiteKey | default "" | quote }}
  # Provider-reported hostnames accepted for turnstile/recaptcha (comma list). Blank => host of DSAR_VERIFY_URL_BASE; none resolvable => captcha fails closed (503).
  DSAR_CAPTCHA_HOSTNAMES: {{ .Values.config.dsarCaptchaHostnames | default "" | quote }}
  DSAR_RECAPTCHA_VERSION: {{ .Values.config.dsarRecaptchaVersion | default "v3" | quote }}
  # Public verification page. Blank => derived from webui.publicUrl (+ /privacy-request/verify); both blank => verification mail cannot be built (fails loud, request stays verification_pending).
  {{- $verifyBase := .Values.config.dsarVerifyUrlBase | default "" }}
  {{- if and (not $verifyBase) .Values.webui.publicUrl }}{{ $verifyBase = printf "%s/privacy-request/verify" (trimSuffix "/" .Values.webui.publicUrl) }}{{ end }}
  DSAR_VERIFY_URL_BASE: {{ $verifyBase | quote }}
  # DSAR verification mail over SMTP (hub-api, hub_api/services/dsar_email_sender.py). Non-secret settings; the
  # username/password come from the operator-supplied Secret named by config.dsarSmtp.existingSecret (hub-api.yaml).
  # DSAR_SMTP_HOST blank => no sender: delivery fails loud (event + ERROR log), never faked.
  DSAR_SMTP_HOST: {{ .Values.config.dsarSmtp.host | default "" | quote }}
  DSAR_SMTP_PORT: {{ .Values.config.dsarSmtp.port | default "" | quote }}
  DSAR_SMTP_TLS: {{ .Values.config.dsarSmtp.tls | default "starttls" | quote }}
  DSAR_SMTP_ALLOW_PLAINTEXT: {{ .Values.config.dsarSmtp.allowPlaintext | default false | quote }}
  DSAR_SMTP_TLS_CA_FILE: {{ .Values.config.dsarSmtp.tlsCaFile | default "" | quote }}
  DSAR_SMTP_FROM_ADDRESS: {{ .Values.config.dsarSmtp.fromAddress | default "" | quote }}
  DSAR_SMTP_FROM_NAME: {{ .Values.config.dsarSmtp.fromName | default "" | quote }}
  DSAR_SMTP_REPLY_TO: {{ .Values.config.dsarSmtp.replyTo | default "" | quote }}
  DSAR_SMTP_CONNECT_TIMEOUT: {{ .Values.config.dsarSmtp.connectTimeoutSeconds | default 5 | quote }}
  DSAR_SMTP_SEND_TIMEOUT: {{ .Values.config.dsarSmtp.sendTimeoutSeconds | default 10 | quote }}
  DSAR_SMTP_MAX_RETRIES: {{ .Values.config.dsarSmtp.maxRetries | default 2 | quote }}
  DSAR_SMTP_BACKOFF_SECONDS: {{ .Values.config.dsarSmtp.backoffSeconds | default 0.5 | quote }}
  DSAR_SMTP_TOTAL_TIMEOUT: {{ .Values.config.dsarSmtp.totalTimeoutSeconds | default 30 | quote }}
  # DSAR verification-mail outbox worker (hub_api/services/dsar_outbox.py).
  DSAR_OUTBOX_MAX_ATTEMPTS: {{ (.Values.config.dsarOutbox | default dict).maxAttempts | default 5 | quote }}
  DSAR_OUTBOX_BACKOFF_SECONDS: {{ (.Values.config.dsarOutbox | default dict).backoffSeconds | default 30 | quote }}
  DSAR_OUTBOX_LEASE_SECONDS: {{ (.Values.config.dsarOutbox | default dict).leaseSeconds | default 180 | quote }}
  DSAR_OUTBOX_POLL_SECONDS: {{ (.Values.config.dsarOutbox | default dict).pollSeconds | default 5 | quote }}
  DSAR_OUTBOX_RETENTION_DAYS: {{ (.Values.config.dsarOutbox | default dict).retentionDays | default 7 | quote }}
  # waddles.community.connections ENV baseline (default OFF; PostHog overrides when connected).
  # Gates the per-community Discord/Twitch connect authorize route (hub-api); also tier-gated
  # (Professional) -- tier is bypassed only on *.penguintech.cloud hosts.
  FLAG_WADDLES_COMMUNITY_CONNECTIONS: {{ .Values.config.communityConnectionsEnabled | default false | quote }}
  # Data-plane FEATURE-flag ENV baselines (svc-action/process/ingest/presentation via envFrom).
  # The license-bypass domain no longer forces flags ON (2026-11-12, docs/licensing/
  # feature-flags-and-domain-bypass.md); PostHog -> these -> OFF. Never for licensed flags.
  {{- range $key, $value := .Values.config.dataPlaneFlagBaselines }}
  {{- if not (hasPrefix "FLAG_" $key) }}
  {{- fail (printf "config.dataPlaneFlagBaselines key %q must start with FLAG_" $key) }}
  {{- end }}
  {{- if contains "_DISABLE_" $key }}
  {{- fail (printf "config.dataPlaneFlagBaselines key %q is a kill switch (waddles.*.disable-*): never ENV-baseline it on; unset = mechanism ON" $key) }}
  {{- end }}
  {{- /* Licensed (tier/entitlement-gated) flags are never env-baselined: the license server decides. */}}
  {{- if has $key (list "FLAG_WADDLES_COMMUNITY_CONNECTIONS" "FLAG_WADDLES_COMPLIANCE_EXTERNAL_KMS" "FLAG_WADDLES_AUTH_SSO_SAML" "FLAG_WADDLES_AUTH_SSO_CUSTOM" "FLAG_WADDLES_HUB_API_SSO" "FLAG_WADDLES_TENANCY_WHITELABEL" "FLAG_WADDLES_AI_BYOK") }}
  {{- fail (printf "config.dataPlaneFlagBaselines key %q is a licensed flag: licensed flags are never ENV-baselined" $key) }}
  {{- end }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  # Command-latency canary (alpha only; docs/observability/command-latency.md "Synthetic canary").
  # Rendered ONLY when latencyCanary.enabled, and then fail-loud (missing ids / non-alpha fail the
  # render). Read by svc-ingest (driver) and svc-action (confirm point) via envFrom. No secrets.
{{- include "waddlebot.latencyCanary.env" . }}
  # hub-api login-OAuth redirect-back origin. Only rendered when set (hub-api defaults to localhost:5173).
  {{- if .Values.webui.frontendOrigin }}
  FRONTEND_ORIGIN: {{ .Values.webui.frontendOrigin | quote }}
  {{- end }}

  # Service Discovery URLs
  HUB_API_URL: {{ include "waddlebot.hubApiBaseUrl" . | quote }}
  PUBLIC_WEBUI_URL: {{ .Values.webui.publicUrl | quote }}
  # #320 Connections: OAuth redirect_uri base for the per-community connect flow. Empty
  # by default -- hub-api falls back to PUBLIC_WEBUI_URL when this is blank. Override
  # per-env where the provider's accepted redirect host differs from the public link URL
  # (e.g. alpha: Google/Spotify only accept http redirect URIs on localhost).
  CONNECTIONS_CALLBACK_BASE_URL: {{ .Values.webui.connectionsCallbackBaseUrl | default "" | quote }}
  # Identity/auth/Discord-install callback base. Only rendered when set so hub-api keeps its
  # built-in default (http://localhost:8204) in other envs.
  {{- if .Values.webui.identityCallbackBaseUrl }}
  IDENTITY_CALLBACK_BASE_URL: {{ .Values.webui.identityCallbackBaseUrl | quote }}
  {{- end }}

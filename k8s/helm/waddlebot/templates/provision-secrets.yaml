{{- /*
Runtime create-if-absent provisioning of EVERY internally generated Secret, in EVERY tier
(alpha, beta, gamma, production, local). Replaces the former Helm template-time `lookup` +
randAlphaNum/randBytes generation (secrets.yaml, auto-provisioned-secrets.yaml, sso.yaml,
the HMAC-ring Secrets and posthog-secrets), which was (a) alpha/local-only and (b) EMPTY under
`helm template | kubectl apply` / ArgoCD -- there `lookup` finds nothing, so every auto value,
including every DB password and the root KEK, would have been regenerated on each sync.

Mechanism: a pre-install/pre-upgrade hook Job running files/provision-secrets.sh against the
rendered spec below. Per Secret it asks the CLUSTER whether a key already holds a real value:
yes -> untouched (never overwritten, never rotated); absent/empty/REPLACE_ME* -> filled from an
explicit values override, else a validated import from a NAMED legacy Secret, else a fresh
CSPRNG value. `externalSecret: true` / `existingSecret` opt-outs are honoured (logged, never
touched). Secret NAMES and KEYS are identical to before, so no consumer changes.

The Secrets are created by the Job, not rendered here: Helm never owns their data, so an
upgrade can never clobber a value (the incident behind `waddlebot-platform-credentials`, which
is owner-supplied and deliberately absent from this spec). Existing releases migrate in place:
the live Secrets already exist, the hook finds real values and changes nothing except adding
the helm.sh/resource-policy=keep annotation (so Helm does not delete the no-longer-rendered
object on the first upgrade) and any key the new chart owns that was missing.

Ordering: hook RBAC/spec at weight -10, Job at weight -8; every consumer of these Secrets is
an ordinary resource or a later hook (migrations -5, seeders 0/5). scripts/ci/
check-helm-hook-dependency-ordering.py models this Job's `waddles.penguintech.io/
provisions-secrets` annotation as the provider of each listed Secret.
*/ -}}
{{- $fn := include "waddlebot.fullname" . }}
{{- $ns := .Values.namespace }}
{{- $tier := .Values.global.deploymentTier }}
{{- $acc := dict "lines" (list) "names" (list) "inputs" (dict) "skipped" (list) }}
{{- $pgv := .Values.infrastructure.postgresql }}
{{- $redis := .Values.infrastructure.redis }}
{{- $vd := .Values.infrastructure.valkeyDurable }}
{{- $kv := .Values.infrastructure.valkeyKv }}
{{- $seaweed := .Values.infrastructure.seaweedfs }}
{{- $gl := .Values.global }}
{{- $strong := "urlsafe;nodefaults;min=16" }}
{{- $secretsName := "waddlebot-secrets" }}
{{- $adminSecret := include "waddlebot.db.adminSecretName" . }}
{{- $credsSecret := include "waddlebot.db.credentialsSecretName" . }}
{{- $vdOn := eq (include "waddlebot.valkeyDurableEnabled" .) "true" }}
{{- $kvOn := eq (include "waddlebot.valkeyKvEnabled" .) "true" }}
{{- /* Fail the render if durable is enabled without TLS (delivery state would silently ride the cache/plaintext path). */}}
{{- include "waddlebot.assertDurableTls" . }}
{{- include "waddlebot.rejectPlaceholder" (dict "key" "INITIAL_ADMIN_EMAIL" "value" $gl.initialAdmin.email) }}
{{- include "waddlebot.rejectPlaceholder" (dict "key" "INITIAL_ADMIN_PASSWORD" "value" $gl.initialAdmin.password) }}

{{- /* ---- 1. database OWNER credential (Postgres Deployment + db-migrate only) ---- */}}
{{- if $pgv.admin.existingSecret }}
{{- include "waddlebot.prov.skip" (dict "acc" $acc "name" $adminSecret "reason" "infrastructure.postgresql.admin.existingSecret") }}
{{- else }}
{{- include "waddlebot.prov.secret" (dict "acc" $acc "name" $adminSecret) }}
{{- /* legacy: pre-H1 clusters held the owner password in waddlebot-secrets -- imported once so the password the Postgres PVC was initdb'd with is preserved (validated, named Secret only). */}}
{{- include "waddlebot.prov.gen" (dict "acc" $acc "secret" $adminSecret "key" "POSTGRES_PASSWORD" "alg" "b64url:32" "opts" (printf "%s;legacy=%s/POSTGRES_PASSWORD" $strong $secretsName) "explicit" $pgv.password) }}
{{- end }}

{{- /* ---- 2. per-service DB LOGIN role passwords (one PW_<ROLE> key per role) ---- */}}
{{- $ptCfg := $pgv.platformTable | default dict }}
{{- if $pgv.serviceRoles.existingSecret }}
{{- include "waddlebot.prov.skip" (dict "acc" $acc "name" $credsSecret "reason" "infrastructure.postgresql.serviceRoles.existingSecret") }}
{{- else }}
{{- include "waddlebot.prov.secret" (dict "acc" $acc "name" $credsSecret) }}
{{- range $role := $pgv.serviceRoles.roles }}
{{- $explicit := index ($pgv.serviceRoles.passwords | default dict) $role | default "" | toString }}
{{- include "waddlebot.prov.gen" (dict "acc" $acc "secret" $credsSecret "key" (include "waddlebot.db.passwordKey" $role) "alg" "b64url:32" "opts" (printf "%s;strict-kept" $strong) "explicit" $explicit) }}
{{- end }}
{{- if $ptCfg.enabled }}
{{- include "waddlebot.prov.gen" (dict "acc" $acc "secret" $credsSecret "key" "PW_WADDLES_PLATFORM_TABLE" "alg" "b64url:32" "opts" (printf "%s;strict-kept" $strong) "explicit" ($ptCfg.password | default "")) }}
{{- end }}
{{- end }}

{{- /* ---- 3. waddlebot-secrets (envFrom'd by ~40 workloads): generated + composed + chart config keys ---- */}}
{{- include "waddlebot.prov.secret" (dict "acc" $acc "name" $secretsName) }}
{{- include "waddlebot.prov.gen" (dict "acc" $acc "secret" $secretsName "key" "DB_READER_PASSWORD" "alg" "b64url:32" "opts" $strong "explicit" $pgv.readerPassword) }}
{{- include "waddlebot.prov.gen" (dict "acc" $acc "secret" $secretsName "key" "DB_REPUTATION_PASSWORD" "alg" "b64url:32" "opts" $strong "explicit" "") }}
{{- include "waddlebot.prov.static" (dict "acc" $acc "secret" $secretsName "key" "BUNDLE_MIGRATOR_PASSWORD" "value" $pgv.bundleMigratorPassword) }}
{{- include "waddlebot.prov.static" (dict "acc" $acc "secret" $secretsName "key" "BUNDLE_RUNTIME_PASSWORD" "value" $pgv.bundleRuntimePassword) }}
{{- include "waddlebot.prov.gen" (dict "acc" $acc "secret" $secretsName "key" "REDIS_PASSWORD" "alg" "b64url:32" "opts" $strong "explicit" $redis.password) }}
{{- include "waddlebot.prov.gen" (dict "acc" $acc "secret" $secretsName "key" "REDIS_ADMIN_PASSWORD" "alg" "b64url:32" "opts" $strong "explicit" $redis.modulePasswords.admin) }}
{{- range $m := (list "router" "hub" "workflow" "ai" "analytics" "security" "loyalty" "spotify" "ytmusic" "twitch" "discord" "slack") }}
{{- include "waddlebot.prov.gen" (dict "acc" $acc "secret" $secretsName "key" (printf "REDIS_%s_PASSWORD" (upper $m)) "alg" "b64url:32" "opts" $strong "explicit" (index $redis.modulePasswords $m)) }}
{{- end }}
{{- if $vdOn }}
{{- include "waddlebot.prov.gen" (dict "acc" $acc "secret" $secretsName "key" "VALKEY_DURABLE_PASSWORD" "alg" "b64url:32" "opts" $strong "explicit" $vd.password) }}
{{- else }}
{{- include "waddlebot.prov.derived" (dict "acc" $acc "key" "VALKEY_DURABLE_PASSWORD" "template" "%%REDIS_PASSWORD%%") }}
{{- end }}
{{- /* Least-privilege per-workload S3 identities (access key id = 16 alnum chars, secret = 256-bit base64url). */}}
{{- range $id := (list (list "hubApi" "HUB_API") (list "dataPlane" "DATAPLANE") (list "bucketInit" "BUCKET_INIT") (list "streaming" "STREAMING") (list "bundleStorage" "BUNDLE_STORAGE")) }}
{{- $cfg := index $seaweed.identities (index $id 0) }}
{{- include "waddlebot.prov.gen" (dict "acc" $acc "secret" $secretsName "key" (printf "%s_S3_ACCESS_KEY_ID" (index $id 1)) "alg" "alnum:16" "opts" "min=16" "explicit" $cfg.accessKey) }}
{{- include "waddlebot.prov.gen" (dict "acc" $acc "secret" $secretsName "key" (printf "%s_S3_SECRET_ACCESS_KEY" (index $id 1)) "alg" "b64url:32" "opts" $strong "explicit" $cfg.secretKey) }}
{{- end }}
{{- /* Legacy HS256 / module / service keys (JWT_SECRET is replaced by an ES256 key in platform_secrets later -- A6). */}}
{{- include "waddlebot.prov.gen" (dict "acc" $acc "secret" $secretsName "key" "JWT_SECRET" "alg" "b64url:48" "opts" "nodefaults;min=32" "explicit" $gl.jwtSecret) }}
{{- include "waddlebot.prov.derived" (dict "acc" $acc "key" "SECRET_KEY" "template" "%%JWT_SECRET%%") }}
{{- include "waddlebot.prov.derived" (dict "acc" $acc "key" "JWT_SECRET_KEY" "template" "%%JWT_SECRET%%") }}
{{- include "waddlebot.prov.gen" (dict "acc" $acc "secret" $secretsName "key" "MODULE_SECRET_KEY" "alg" "b64url:48" "opts" "nodefaults;min=32" "explicit" $gl.moduleSecretKey) }}
{{- include "waddlebot.prov.gen" (dict "acc" $acc "secret" $secretsName "key" "SERVICE_API_KEY" "alg" "b64url:48" "opts" "nodefaults;min=32" "explicit" $gl.serviceApiKey) }}
{{- /* 256-bit hex symmetric key (hub_api/services/platform_integrations_crypto.py needs 64 hex chars). */}}
{{- include "waddlebot.prov.gen" (dict "acc" $acc "secret" $secretsName "key" "CREDENTIAL_ENCRYPTION_KEY" "alg" "hex:32" "opts" "hex64" "explicit" ($gl.credentialEncryptionKey | default "")) }}
{{- /* core/svc_action envelope hop-verification HMAC keyring ("kid:hexkey[,...]"). */}}
{{- include "waddlebot.prov.gen" (dict "acc" $acc "secret" $secretsName "key" "ENVELOPE_BINDING_KEYS" "alg" (printf "ring:%s" (.Values.pipeline.rustDataPlane.svcIngest.envelopeBindingActiveKid | default "k1")) "opts" "min=32" "explicit" ($gl.envelopeBindingKeys | default "")) }}
{{- /* Composed connection URLs -- recomputed every run from the final passwords (host/port/TLS changes still apply on upgrade). */}}
{{- $redisFqdn := include "waddlebot.transitTls.fqdn" (dict "root" . "name" $redis.service.name) }}
{{- $redisTlsUrl := printf "rediss://:%%%%REDIS_PASSWORD%%%%@%s:%v/0?ssl_cert_reqs=required&ssl_ca_certs=/etc/waddles/ca/valkey-ca.crt&ssl_check_hostname=true" $redisFqdn $redis.tls.port }}
{{- include "waddlebot.prov.derived" (dict "acc" $acc "key" "REDIS_URL" "template" $redisTlsUrl) }}
{{- include "waddlebot.prov.derived" (dict "acc" $acc "key" "VALKEY_URL" "template" $redisTlsUrl) }}
{{- if $redis.tls.enabled }}
{{- include "waddlebot.prov.derived" (dict "acc" $acc "key" "VALKEY_URL_TLS" "template" (printf "rediss://%s:%v/0" $redisFqdn $redis.tls.port)) }}
{{- end }}
{{- $vdSvc := ternary $vd.service.name $redis.service.name $vdOn }}
{{- $vdPort := ternary $vd.service.port $redis.service.port $vdOn }}
{{- if $redis.tls.enabled }}
{{- $vdFqdn := include "waddlebot.transitTls.fqdn" (dict "root" . "name" $vdSvc) }}
{{- include "waddlebot.prov.derived" (dict "acc" $acc "key" "VALKEY_DURABLE_URL_TLS" "template" (printf "rediss://%s:%v/0" $vdFqdn $redis.tls.port)) }}
{{- include "waddlebot.prov.derived" (dict "acc" $acc "key" "VALKEY_DURABLE_URL_TLS_AUTH" "template" (printf "rediss://:%%%%VALKEY_DURABLE_PASSWORD%%%%@%s:%v/0?ssl_cert_reqs=required&ssl_ca_certs=/etc/waddles/ca/valkey-ca.crt&ssl_check_hostname=true" $vdFqdn $redis.tls.port)) }}
{{- else }}
{{- include "waddlebot.prov.derived" (dict "acc" $acc "key" "VALKEY_DURABLE_URL" "template" (printf "redis://:%%%%VALKEY_DURABLE_PASSWORD%%%%@%s:%v/0" $vdSvc $vdPort)) }}
{{- end }}
{{- if $vdOn }}
{{- /* Scrub the leaked pre-isolation admin value from this envFrom'd Secret (blanked, not merely omitted). */}}
{{- include "waddlebot.prov.blank" (dict "acc" $acc "key" "VALKEY_DURABLE_ADMIN_PASSWORD") }}
{{- end }}
{{- /* Non-credential platform config + OpenWhisk (values pass-through; externally issued platform credentials live in waddlebot-platform-credentials, which this hook never touches). */}}
{{- range $kvp := (list
      (list "YOUTUBE_WEBHOOK_CALLBACK_URL" (.Values.oauth.youtube.webhookCallbackUrl | default ""))
      (list "TEAMS_TENANT_ID" (.Values.oauth.teams.tenantId | default ""))
      (list "MATTERMOST_URL" (.Values.oauth.mattermost.url | default ""))
      (list "GOOGLE_CHAT_PROJECT_ID" (.Values.oauth.googlechat.projectId | default ""))
      (list "AWS_REGION" (.Values.aws.region | default "us-east-1"))
      (list "GCP_PROJECT_ID" (.Values.gcp.projectId | default ""))
      (list "GCP_REGION" (.Values.gcp.region | default "us-central1"))
      (list "WADDLEAI_BASE_URL" (.Values.waddleai.baseUrl | default ""))
      (list "OPENWHISK_API_HOST" (.Values.openwhisk.apiHost | default "http://openwhisk-service:3233"))
      (list "OPENWHISK_NAMESPACE" (.Values.openwhisk.namespace | default "guest"))
      (list "OPENWHISK_INSECURE" (.Values.openwhisk.insecure | default "true" | toString))) }}
{{- include "waddlebot.prov.derived" (dict "acc" $acc "key" (index $kvp 0) "template" (index $kvp 1 | toString)) }}
{{- end }}
{{- include "waddlebot.prov.static" (dict "acc" $acc "secret" $secretsName "key" "OPENWHISK_AUTH_KEY" "value" .Values.openwhisk.authKey) }}

{{- /* ---- 4. durable-Valkey admin (replication masteruser; never envFrom'd) ---- */}}
{{- if $vdOn }}
{{- $vdaName := printf "%s-valkey-durable-admin" $fn }}
{{- include "waddlebot.prov.secret" (dict "acc" $acc "name" $vdaName) }}
{{- include "waddlebot.prov.gen" (dict "acc" $acc "secret" $vdaName "key" "VALKEY_DURABLE_ADMIN_PASSWORD" "alg" "b64url:32" "opts" $strong "explicit" $vd.adminPassword) }}
{{- end }}

{{- /* ---- 5. dedicated bundle-kv Valkey (password + URLs; never envFrom'd) ---- */}}
{{- if $kvOn }}
{{- $kvName := printf "%s-valkey-kv" $fn }}
{{- include "waddlebot.prov.secret" (dict "acc" $acc "name" $kvName) }}
{{- include "waddlebot.prov.gen" (dict "acc" $acc "secret" $kvName "key" "VALKEY_KV_PASSWORD" "alg" "b64url:32" "opts" $strong "explicit" $kv.password) }}
{{- if eq (include "waddlebot.valkeyTlsMaterialAvailable" .) "true" }}
{{- $kvFqdn := include "waddlebot.transitTls.fqdn" (dict "root" . "name" $kv.service.name) }}
{{- include "waddlebot.prov.derived" (dict "acc" $acc "key" "VALKEY_KV_URL_TLS" "template" (printf "rediss://%s:%v/0" $kvFqdn $redis.tls.port)) }}
{{- include "waddlebot.prov.derived" (dict "acc" $acc "key" "VALKEY_KV_URL_TLS_AUTH" "template" (printf "rediss://:%%%%VALKEY_KV_PASSWORD%%%%@%s:%v/0?ssl_cert_reqs=required&ssl_ca_certs=/etc/waddles/ca/valkey-ca.crt&ssl_check_hostname=true" $kvFqdn $redis.tls.port)) }}
{{- else }}
{{- include "waddlebot.prov.derived" (dict "acc" $acc "key" "VALKEY_KV_URL" "template" (printf "redis://:%%%%VALKEY_KV_PASSWORD%%%%@%s:%v/0" $kv.service.name $kv.service.port)) }}
{{- end }}
{{- end }}

{{- /* ---- 6. hub super-admin bootstrap credentials ---- */}}
{{- $adminBootName := printf "%s-hub-admin-bootstrap" $fn }}
{{- include "waddlebot.prov.secret" (dict "acc" $acc "name" $adminBootName) }}
{{- include "waddlebot.prov.derived" (dict "acc" $acc "key" "INITIAL_ADMIN_EMAIL" "template" ($gl.initialAdmin.email | default "" | toString)) }}
{{- include "waddlebot.prov.gen" (dict "acc" $acc "secret" $adminBootName "key" "INITIAL_ADMIN_PASSWORD" "alg" "b64url:18" "opts" "min=12" "explicit" ($gl.initialAdmin.password | default "" | toString)) }}

{{- /* ---- 7. root + platform symmetric keys (autoProvisionedKeys.*; externalSecret: true => skipped) ---- */}}
{{- $apk := .Values.autoProvisionedKeys }}
{{- range $k := (list (list "seaweedfsSseKek" false) (list "tenantKek" true) (list "oneTimeSecret" false)) }}
{{- $cfg := index $apk (index $k 0) }}
{{- if $cfg.externalSecret }}
{{- include "waddlebot.prov.skip" (dict "acc" $acc "name" $cfg.secretName "reason" (printf "autoProvisionedKeys.%s.externalSecret" (index $k 0))) }}
{{- else }}
{{- include "waddlebot.prov.secret" (dict "acc" $acc "name" $cfg.secretName) }}
{{- include "waddlebot.prov.gen" (dict "acc" $acc "secret" $cfg.secretName "key" $cfg.secretKey "alg" "hex:32" "opts" "hex64" "explicit" "") }}
{{- /* Root-of-trust guard: TENANT_KEK_HEX is stamped with waddles.penguintech.io/root-marker (v1.<kek_id>.<HMAC-SHA256(KEK,"waddles-root-check")>) -- hub-api compares it with its DB marker. */}}
{{- if index $k 1 }}{{ include "waddlebot.prov.marker" (dict "acc" $acc "key" $cfg.secretKey) }}{{ end }}
{{- end }}
{{- end }}
{{- if .Values.sso.enabled }}
{{- $sso := .Values.sso.encryptionKey }}
{{- if $sso.externalSecret }}
{{- include "waddlebot.prov.skip" (dict "acc" $acc "name" $sso.secretName "reason" "sso.encryptionKey.externalSecret") }}
{{- else }}
{{- include "waddlebot.prov.secret" (dict "acc" $acc "name" $sso.secretName) }}
{{- include "waddlebot.prov.gen" (dict "acc" $acc "secret" $sso.secretName "key" $sso.secretKey "alg" "hex:32" "opts" "hex64" "explicit" "") }}
{{- end }}
{{- end }}

{{- /* ---- 8. HMAC request/pin rings ("kid:hex64") ---- */}}
{{- if .Values.pipeline.rustDataPlane.enabled }}
{{- range $r := (list
      (list .Values.bundleAdminRequest (include "waddlebot.bundleAdminRequestSecretName" .) "BUNDLE_ADMIN_REQUEST_KEYS" "b1")
      (list .Values.outboundPin (include "waddlebot.outboundPinSecretName" .) "OUTBOUND_PIN_KEYS" "k1")
      (list .Values.eventSyncRequest (include "waddlebot.eventSyncRequestSecretName" .) "EVENT_SYNC_REQUEST_KEYS" "r1")) }}
{{- $rc := index $r 0 }}
{{- if $rc.existingSecret }}
{{- include "waddlebot.prov.skip" (dict "acc" $acc "name" (index $r 1) "reason" "existingSecret") }}
{{- else }}
{{- include "waddlebot.prov.secret" (dict "acc" $acc "name" (index $r 1)) }}
{{- include "waddlebot.prov.gen" (dict "acc" $acc "secret" (index $r 1) "key" (index $r 2) "alg" (printf "ring:%s" ($rc.activeKid | default (index $r 3))) "opts" "min=32" "explicit" "") }}
{{- end }}
{{- end }}
{{- end }}

{{- /* ---- 9. in-cluster PostHog's own Secret (generated when neither existingSecret nor secrets.create is set) ---- */}}
{{- if and .Values.posthog.enabled (not .Values.posthog.existingSecret) (not .Values.posthog.secrets.create) }}
{{- include "waddlebot.prov.secret" (dict "acc" $acc "name" "posthog-secrets") }}
{{- include "waddlebot.prov.gen" (dict "acc" $acc "secret" "posthog-secrets" "key" "SECRET_KEY" "alg" "alnum:50" "opts" "min=32" "explicit" "") }}
{{- include "waddlebot.prov.gen" (dict "acc" $acc "secret" "posthog-secrets" "key" "POSTGRES_PASSWORD" "alg" "alnum:43" "opts" "min=32" "explicit" "") }}
{{- include "waddlebot.prov.gen" (dict "acc" $acc "secret" "posthog-secrets" "key" "CLICKHOUSE_PASSWORD" "alg" "alnum:43" "opts" "min=32" "explicit" "") }}
{{- end }}

{{- /* ---- 10. db-migrate hook inputs: DERIVED from the secrets above, re-applied every run ---- */}}
{{- if .Values.pipeline.migrationsJob.enabled }}
{{- $migName := printf "%s-db-migrate-secret" $fn }}
{{- include "waddlebot.prov.secret" (dict "acc" $acc "name" $migName) }}
{{- $dbUrl := printf "postgresql://%s:%%%%%s/POSTGRES_PASSWORD%%%%@%s:%v/%s?sslmode=verify-full&sslrootcert=%s" $pgv.username $adminSecret (include "waddlebot.postgres.host" .) $pgv.service.port $pgv.database (include "waddlebot.transitTls.caPath" .) }}
{{- include "waddlebot.prov.derived" (dict "acc" $acc "key" "DATABASE_URL" "template" $dbUrl) }}
{{- include "waddlebot.prov.derived" (dict "acc" $acc "key" "DB_READER_PASSWORD" "template" (printf "%%%%%s/DB_READER_PASSWORD%%%%" $secretsName)) }}
{{- include "waddlebot.prov.derived" (dict "acc" $acc "key" "DB_REPUTATION_PASSWORD" "template" (printf "%%%%%s/DB_REPUTATION_PASSWORD%%%%" $secretsName)) }}
{{- if $ptCfg.enabled }}
{{- include "waddlebot.prov.derived" (dict "acc" $acc "key" "DB_PLATFORM_TABLE_PASSWORD" "template" (printf "%%%%%s/PW_WADDLES_PLATFORM_TABLE%%%%" $credsSecret)) }}
{{- end }}
{{- $rolePw := dict }}
{{- range $role := $pgv.serviceRoles.roles }}
{{- $_ := set $rolePw $role (printf "%%%%%s/%s%%%%" $credsSecret (include "waddlebot.db.passwordKey" $role)) }}
{{- end }}
{{- include "waddlebot.prov.derived" (dict "acc" $acc "key" "WADDLES_DB_SERVICE_ROLE_PASSWORDS" "template" ($rolePw | toJson) "opts" "urlsafe-values") }}
{{- include "waddlebot.prov.derived" (dict "acc" $acc "key" "WADDLES_DEPLOYMENT_TIER" "template" ($tier | toString)) }}
{{- end }}

{{- $provides := list }}
{{- range $n := $acc.names }}{{ $provides = append $provides $n }}{{ end }}
{{- $rbacNames := concat $acc.names $acc.skipped | uniq | sortAlpha }}
{{- $hookImage := .Values.autoProvisionedKeys.hookImage }}
---
# Hook-only identity (weight -10, deleted after the pre-* phase succeeds). automount is OFF on
# the ServiceAccount and switched on for the Job pod only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fn }}-provision-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: provision-secrets
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
automountServiceAccountToken: false
---
# Least privilege. RBAC cannot scope `create` to a resourceName (Kubernetes ignores
# resourceNames on create) -- RESIDUAL RISK, documented in README "Secrets: generated on first
# run": this identity can create a Secret under any name for the few seconds the hook lives;
# it can only get/patch the NAMED Secrets below, and has no list/watch/update/delete.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fn }}-provision-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: provision-secrets
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- range $rbacNames }}
      - {{ . }}
      {{- end }}
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fn }}-provision-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: provision-secrets
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fn }}-provision-secrets
subjects:
  - kind: ServiceAccount
    name: {{ $fn }}-provision-secrets
    namespace: {{ $ns }}
---
# Script + structure-only spec. Holds NO secret value: values from .Values go to the inputs
# Secret below; composed URLs use %%markers%% resolved in memory at run time.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fn }}-provision-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: provision-secrets
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
  provision-secrets.sh: |
{{ .Files.Get "files/provision-secrets.sh" | indent 4 }}
  spec.psv: |
{{ join "\n" $acc.lines | indent 4 }}
---
# Explicit operator-supplied values (and OPENWHISK/BUNDLE_* pass-through) for the hook only.
# Deleted as soon as the hook succeeds; REPLACE_ME* placeholders are never emitted.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fn }}-provision-secrets-inputs
  namespace: {{ $ns }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: provision-secrets
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
type: Opaque
stringData:
  _none: ""
  {{- range $k := keys $acc.inputs | sortAlpha }}
  {{ $k }}: {{ index $acc.inputs $k | quote }}
  {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fn }}-provision-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: provision-secrets
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-8"
    # failed Job + logs are kept for inspection and replaced on the next attempt; success deletes it.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    # Read by scripts/ci/check-helm-hook-dependency-ordering.py: every Secret this Job creates
    # at runtime (hook weight -8), so later hooks/consumers that reference them resolve.
    waddles.penguintech.io/provisions-secrets: {{ join "," ($provides | sortAlpha) | quote }}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "waddlebot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: provision-secrets
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $fn }}-provision-secrets
      automountServiceAccountToken: true
      {{- include "waddlebot.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provision-secrets
          # Pinned by digest (immutable; multi-arch amd64+arm64): bitnami/kubectl is Photon-based
          # with bash, openssl, kubectl, base64, tr, mktemp. See auto-provisioned-keys-job.yaml.
          image: {{ $hookImage | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            # Photon's distro OpenSSL config auto-loads a FIPS provider; /dev/null = default provider.
            - name: OPENSSL_CONF
              value: "/dev/null"
            - name: NAMESPACE
              value: {{ $ns | quote }}
            - name: LABEL_RELEASE
              value: {{ .Release.Name | quote }}
            - name: SPEC_FILE
              value: /opt/provision/spec.psv
            - name: INPUTS_DIR
              value: /inputs
            - name: TMPDIR
              value: /work
          command: ["/bin/bash", "/opt/provision/provision-secrets.sh"]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          volumeMounts:
            - name: provision
              mountPath: /opt/provision
              readOnly: true
            - name: inputs
              mountPath: /inputs
              readOnly: true
            # tmpfs: generated values only ever exist in memory and are gone with the pod.
            - name: work
              mountPath: /work
      volumes:
        - name: provision
          configMap:
            name: {{ $fn }}-provision-secrets
        - name: inputs
          secret:
            secretName: {{ $fn }}-provision-secrets-inputs
        - name: work
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi

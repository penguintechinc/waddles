{{- /*
P6a T6 provenance -- DEDICATED symmetric key for the outbound relay queue `pin_sig` (HMAC-SHA256).
Mounted ONLY into svc-action-rust (signer) and svc-ingest-rust (verifier) via secretKeyRef --
deliberately NOT part of the shared envFrom `waddlebot-secrets` (that Secret reaches every service,
so a compromise of any of them would forge outbound entries). Format `kid:hexkey[,kid2:hexkey2]`;
rotation: add the new kid (both pods verify any kid in the ring), flip outboundPin.activeKid, later
drop the old kid. Precedence: outboundPin.existingSecret (operator/ExternalSecret owns it, no Secret
rendered here, key name OUTBOUND_PIN_KEYS) > existing in-cluster Secret (KEEP) > alpha/local
auto-generation > fail closed. No literal key ever lives in values. The Valkey ACL is defense in depth
only (the durable instance's shared `default` user can write the list).
*/}}
{{- define "waddlebot.outboundPinSecretName" -}}
{{- .Values.outboundPin.existingSecret | default (printf "%s-outbound-pin" (include "waddlebot.fullname" .)) -}}
{{- end }}
{{- if and .Values.pipeline.rustDataPlane.enabled (not .Values.outboundPin.existingSecret) }}
{{- $name := include "waddlebot.outboundPinSecretName" . }}
{{- $kid := .Values.outboundPin.activeKid | default "k1" }}
{{- $v := include "waddlebot.autoSecretValue" (dict "ctx" . "key" "OUTBOUND_PIN_KEYS" "explicit" "" "hex" true "secret" $name) }}
{{- if not (contains ":" $v) }}{{- $v = printf "%s:%s" $kid $v }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/component: outbound-pin
type: Opaque
stringData:
  OUTBOUND_PIN_KEYS: {{ $v | quote }}
{{- end }}

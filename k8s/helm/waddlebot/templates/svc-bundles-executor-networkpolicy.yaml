# feature/e2e-helm-rust-dataplane -- default-deny CiliumNetworkPolicy scoped to ONLY the
# svc-bundles-executor pod (devops-kubernetes.md Cluster Security Baseline / security.md
# Kubernetes Network Security -- CiliumNetworkPolicy, never plain NetworkPolicy). This is
# additive on top of the chart's existing namespace-wide plain-NetworkPolicy pair
# (templates/network-policies.yaml, which already allows all same-namespace traffic) --
# this CiliumNetworkPolicy further restricts what the credential-less svc-bundles-executor pod
# ITSELF may originate/receive, independent of that broader namespace policy.
#
# Ingress: explicit deny-all -- this pod has no listening port of any kind (see
# templates/svc-bundles-executor.yaml's header), so nothing should ever dial it.
# Egress: DNS (to resolve the stage Service names below) + EACH configured stage's
# host-API mTLS port ONLY (one rule per entry of bundleExecutor.stages) + a future bucket-egress allowance (core/bundle_executor/src/invoke.rs's
# UnimplementedBucketSource -- not yet wired, pre-allowed so no further chart change is
# needed once object_store lands).
{{- if and .Values.pipeline.rustDataPlane.enabled .Values.pipeline.rustDataPlane.bundleExecutor.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "waddlebot.fullname" . }}-svc-bundles-executor
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: svc-bundles-executor
spec:
  endpointSelector:
    matchLabels:
      {{- include "waddlebot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: svc-bundles-executor
  ingress: []
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    {{- range $stage := .Values.pipeline.rustDataPlane.bundleExecutor.stages }}
    - toEndpoints:
        - matchLabels:
            {{- include "waddlebot.selectorLabels" $ | nindent 12 }}
            app.kubernetes.io/component: {{ $stage.target | quote }}
      toPorts:
        - ports:
            - port: {{ $stage.port | quote }}
              protocol: TCP
    {{- end }}
    {{- if include "waddlebot.connectorRuntimeActive" . }}
    # PR-H: the executor's ONE dial to svc-ingest's host-api, that port only.
    - toEndpoints:
        - matchLabels:
            {{- include "waddlebot.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: svc-ingest-rust
      toPorts:
        - ports:
            - port: {{ (.Values.pipeline.rustDataPlane.svcIngest.connectorTools).hostApiPort | default 8301 | quote }}
              protocol: TCP
    {{- end }}
    # SeaweedFS pods carry app.kubernetes.io/name: seaweedfs (templates/infrastructure/
    # seaweedfs.yaml), NOT the chart-wide selectorLabels name -- the previous
    # selectorLabels-based match here selected zero endpoints, so the bundle bucket fetch
    # was silently blocked. Same selector the dataplane egress CNP uses.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/name: seaweedfs
            app.kubernetes.io/component: storage
      toPorts:
        - ports:
            - port: {{ .Values.infrastructure.seaweedfs.service.s3Port | quote }}
              protocol: TCP
    {{- if .Values.otel.collector.enabled }}
    # OTLP export (executor Phase 1): in-namespace collector only, gRPC port only.
    - toEndpoints:
        - matchLabels:
            {{- include "waddlebot.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: otel-collector
      toPorts:
        - ports:
            - port: {{ .Values.egressPolicy.inCluster.otelGrpcPort | quote }}
              protocol: TCP
    {{- end }}
    # hub-api HTTP readiness ONLY: the `wait-for-hub-api` init container polls /ready on
    # this port (without it the pod sticks in Init:0/1). The executor has no hub-api
    # client at runtime (no gRPC/HTTP dep -- core/bundle_executor/Cargo.toml) and no
    # Valkey dep (dependency_policy test), so gRPC (50204) and the cache are deliberately
    # NOT granted.
    - toEndpoints:
        - matchLabels:
            {{- include "waddlebot.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: hub-api
      toPorts:
        - ports:
            - port: {{ .Values.egressPolicy.inCluster.hubApiHttpPort | quote }}
              protocol: TCP
{{- end }}

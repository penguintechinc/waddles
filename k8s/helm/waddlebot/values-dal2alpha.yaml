## Waddlebot - dal2-alpha (dedicated cluster) Environment Overrides
# Derived from values-alpha.yaml + staged Monday-demo deltas (881ac8dd). Unlike local alpha, dal2-alpha
# is a REAL 2-node amd64 cluster (Cilium CNI, k8s v1.35): ghcr.io images, ClusterIP + Ingress/TLS only (no
# NodePort), and the full security baseline (default-deny CNP, PSA restricted, Tetragon) is ON.
# Usage: helm upgrade --install waddlebot . -n waddlebot -f values-dal2alpha.yaml (NO other -f needed).
# Prereqs (operator-provisioned, never in git): Secret ghcr-pull + waddlebot-platform-credentials in ns waddlebot.
hubApi:
  trustForwardedHost: true
  trustedProxyCidrs: ["10.244.0.0/16"]

# Shared Gateway gateway-system/shared listener `https` only admits routes from namespaces carrying this label;
# without it HTTPRoute `waddlebot` is Accepted=False NotAllowedByListeners and the public URL 404s.
namespaceLabels:
  gateway-access: shared-dal2a

webui:
  publicHostnames: ["waddles-alpha.penguintech.cloud"]
  publicUrl: "https://waddles-alpha.penguintech.cloud:8443"
  # #320 Connections: Google/Spotify only accept http (non-TLS) redirect URIs on
  # `localhost` -- the LAN-IP publicUrl above is rejected by their OAuth consent screens.
  connectionsCallbackBaseUrl: "https://waddles-alpha.penguintech.cloud:8443"
  identityCallbackBaseUrl: "https://waddles-alpha.penguintech.cloud:8443"
  frontendOrigin: "https://waddles-alpha.penguintech.cloud:8443"

global:
  # Public origin incl. :8443 (CF -> NAT :8443 -> Gateway:443; plain :443 is beta): hub-api CORS_ORIGIN.
  corsOrigin: "https://waddles-alpha.penguintech.cloud:8443"
  # fix/alpha-helm-deploy -- was "" (empty), which (a) rendered every
  # pipeline app container on its shared stock base image instead of its own
  # app image (templates/hub-api.yaml et al now use waddlebot.legacyModuleImage
  # instead), and (b) combined with migrations-job.yaml's then-unguarded
  # registry concatenation to render the malformed "/migrations:alpha". MUST
  # match scripts/deploy-alpha.sh's REGISTRY constant -- that script pushes
  # here, this chart pulls from here.
  imageRegistry: "ghcr.io/penguintechinc/waddles"
  imageTag: "demo-881ac8dd"
  imagePullSecrets:
    - name: ghcr-pull
  # IfNotPresent: every alpha deploy gets a unique per-deploy global.imageTag (SHA8), and kind e2e /
  # alpha local builds load images onto the node -- Always would force a registry pull that fails
  # and hang the pod. (Never would make containerd skip localhost:32000 -> ErrImageNeverPull.)
  # This now governs EVERY workload incl. hub-api + the Rust svc-*/svc-bundles-executor Deployments.
  imagePullPolicy: IfNotPresent
  # POSTURE: dedicated-cluster (stricter than local alpha). The "alpha" tier string is kept ONLY because the
  # chart gates secret self-provisioning on it; every alpha-exempt transport/network shortcut is off here.
  deploymentTier: "alpha"
  # Dedicated transit trust root for Postgres / SeaweedFS S3 / Valkey: a namespaced SelfSigned Issuer -> root CA -> CA Issuer
  # rendered by the chart (PREREQ: cert-manager with the NameConstraints feature gate). Clients trust only that root; the
  # hostApiTls/grpcTls identities below keep waddlebot-internal-ca. Overrides global.valkeyTls.externalSecret (cert-manager owns
  # <release>-valkey-tls in this mode).
  transitTls:
    certManager:
      enabled: true
  hostApiTls:
    certManager:
      enabled: true
      issuerKind: "ClusterIssuer"
      issuerName: "waddlebot-internal-ca"
  # First-run super-admin bootstrap (PR #256) -- email is non-sensitive and
  # documented so alpha's Playwright e2e suite (tests/k8s/alpha/) has a known
  # login. The password is NOT committed here (fix/alpha-helm-deploy) -- it
  # comes from the required WADDLEBOT_ALPHA_ADMIN_PASSWORD env var via
  # scripts/deploy-alpha.sh's generated secrets values file, same as
  # jwtSecret/moduleSecretKey/serviceApiKey/minio root creds below. NEVER
  # reused in beta/gamma/production (see values.yaml global.initialAdmin).
  initialAdmin:
    email: "admin@waddles-alpha.penguintech.cloud"

# fix/helm-platform-credentials -- the Discord bot token / Twitch IRC OAuth
# token placeholders that used to live here are REMOVED, not just blanked:
# this is exactly the field (`oauth.discord.botToken`) whose
# "REPLACE_ME_discord_bot_token_dev_only" default got templated into
# waddlebot-secrets on a routine `helm upgrade` and overwrote the real alpha
# Discord bot token, killing the live gateway session (4004). Real values now
# come ONLY from the operator-managed `waddlebot-platform-credentials` Secret
# (see values.yaml platformCredentials, docs/PLATFORM_CREDENTIALS.md) --
# this chart never renders or overwrites it. Non-secret IRC config
# (nick/channels) stays here since it isn't a credential.
oauth:
  twitch:
    nick: "waddlebot_demo"
    channels: "#waddlebot_demo_channel"

infrastructure:
  postgresql:
    enabled: true
    replicas: 1
    persistence: {size: 1Gi}
    resources:
      requests: { cpu: "250m", memory: "256Mi" }
      limits: { cpu: "1000m", memory: "1Gi" }
  redis:
    enabled: true
    replicas: 1
    persistence: {size: 512Mi}
    # fix/valkey-tls-alpha -- dual-listener TLS port for the 3 Rust data-plane pods, whose
    # `penguin_spine::SpineConfig::validate()` fail-closes on plaintext VALKEY_URL. Real CA/
    # cert/key material has NO alpha-file default (never a literal in git, see
    # global.valkeyTls's values.yaml comment) -- supplied via `helm upgrade --set-file
    # global.valkeyTls.ca.crt=... --set-file global.valkeyTls.tls.crt=... --set-file
    # global.valkeyTls.tls.key=...` at deploy time; this flag alone is a no-op without it
    # (waddlebot.valkeyTlsMaterialAvailable stays false, dual-listener never renders).
    tls:
      enabled: true
    resources:
      requests: { cpu: "50m", memory: "64Mi" }
      limits: { cpu: "250m", memory: "256Mi" }
  # Incident 2026-11: ~150 activated bundles drove a TLS handshake storm that CPU-starved valkey-durable
  # (250m) until liveness failed and kubelet restarted it. Small requests, generous limits; maxMemory sits
  # well under the memory limit (AOF-rewrite COW + buffers live outside it). Policy stays noeviction (chart-hardwired).
  valkeyDurable:
    maxMemory: "3gb"
    probeTimeoutSeconds: 10
    resources:
      requests: { cpu: "100m", memory: "256Mi" }
      limits: { cpu: "4", memory: "4Gi" }
  # Issue #287 -- svc-streaming (Rust) recordings target. Min-spec'd for a single-node
  # laptop; service.name overridden to "waddlebot-seaweedfs" so the literal S3_ENDPOINT
  # wired into svc-streaming's env (templates/svc-streaming.yaml) resolves correctly.
  seaweedfs:
    enabled: true
    service:
      name: "waddlebot-seaweedfs"
      type: ClusterIP
    persistence:
      size: 2Gi
    # fix/seaweedfs-mem-httpprobe -- the former 512Mi limit OOMKilled under
    # bundle-seed load (observed twice on alpha); on restart the S3 HTTP
    # handler on s3Port wedged (TCP accepts, HTTP hangs) while the old
    # tcpSocket-only probes stayed green, stalling the seeder's .wasm
    # uploads. Raised to match values.yaml's base tier (proven-good via a
    # live patch + restart: fast HTTP 403 confirmed, no more OOMKill under
    # the same seed load) rather than carrying a separate, lower alpha tier
    # for this one service.
    # 2026-11-10: 1Gi also OOMKilled (exit 137) under bundle-seed load during
    # core-bundle-seeder; raised to 2Gi limit / 512Mi request (alpha only).
    resources:
      requests: { cpu: "200m", memory: "512Mi" }
      limits: { cpu: "1000m", memory: "2Gi" }
    # feature/seaweedfs-object-storage -- alpha is exempt from the beta/gamma/production
    # fail guard (templates/infrastructure/seaweedfs.yaml) and may reference this
    # well-known secret name; the Secret itself is never committed -- provision it once
    # per cluster via `make generate-seaweedfs-sse-key` /
    # scripts/generate-seaweedfs-sse-key.sh before deploy.
    encryption:
      secretName: "seaweedfs-sse-kek"
  ollama:
    enabled: false
  qdrant:
    enabled: false

# WADDLES_AI_ENABLED=false -- no Ollama deployed above (infrastructure.
# ollama.enabled: false), so hub-api's AI-routing subsystem stays off too
# rather than crash-looping/degrading against an unreachable backend. Now global (T10):
# svc-ingest/svc-process/svc-action all render WADDLES_AI_ENABLED from this same value.
#
# Resources/replicas min-spec'd for a single-node laptop (see docs/plans -- alpha
# min-spec pass). Pipeline app services share one generic tier; hubApi/hubWebui are
# sized individually to match their lighter footprint.
#
# fix/alpha-helm-deploy -- this file must render a COMPLETE working stack on its
# own (no --set needed for anything but secrets), so hubWebui/svcPresentation/
# svcStreaming are re-enabled here, superseding the earlier T10 (v3 demo)
# "minimal 5-of-8" scoping that left them off. All three already had their
# resources/replicas min-spec'd below for exactly this re-enable (see the old
# comment this replaces), so no re-sizing was needed. svcCore/svcRtc stay
# disabled -- svcCore has no Dockerfile yet (still the shared base-image
# skeleton) and svcRtc is additionally gated on modules.social.enabled; neither
# is part of this fix's scope.
pipeline:
  # Monday-demo (881ac8dd): role-sync reconcile CronJob ON, 1-min cadence.
  # demotePairingIds left empty (grant-only); demoteBaselineRole = member fallback.
  roleSync:
    enabled: true
    schedule: "*/1 * * * *"
    demoteBaselineRole: "member"
  # Monday-demo: Discord event-sync reconcile CronJob ON (was base-default false, so it was NOT
  # deployed). The hub-api image follows global.imageTag (sync-worker DAL fix, PR #878, is in release).
  # Still double-gated by the waddles.calendar.event_discord_sync PostHog flag (default OFF).
  eventSync:
    enabled: true
  svcCore:
    enabled: false
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
  hubApi:
    aiEnabled: false
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "400m", memory: "384Mi" }
  # core-bundle-seeder-job.yaml -- explicit true here (matches values.yaml's own default)
  # since this is the environment this milestone's own e2e proof (waddles.core.example.ping/
  # pyping + the Discord guild connection below) targets first.
  #
  # fix/seeder-memory: this override previously capped the seeder at 64Mi/128Mi -- far
  # below what a real seed run needs and the actual OOMKilled cause in CI's kind install
  # (gh PR #480: "Job/waddlebot-core-bundle-seeder ... failed: 3/1", Reason: OOMKilled),
  # NOT the base values.yaml limit (512Mi) the bug report assumed was in effect; Helm
  # merges this file over the chart default, so this 128Mi override was the one actually
  # applied to every alpha/pre-alpha install. Measured peak cgroup memory (`docker run
  # --memory=4g` + `/sys/fs/cgroup/memory.peak`) running seed_one() against the REAL
  # ping.wasm (173KB, Rust) and pyping.wasm (21.6MB, componentize-py) artifacts through
  # the actual wasm-tools subprocess validate_component() call, sequentially in one
  # process (matching `_run()`'s own for-loop, never concurrent) with only the S3 PUT
  # network call mocked: 228,876,288 bytes (~218Mi) for BOTH bundles. Limits set to
  # ~1.5x that measured peak, rounded up, with extra headroom for real asyncpg/Postgres
  # (vs the measurement's sqlite fixture) and OTel SDK overhead not present in the probe.
  # Seeder publishes the signed connector objects the executor pins at boot; digests are build
  # outputs (see values.yaml pipeline.connectors) -- set digests.<p> from the seeder log after
  # the first deploy, then enable the connector (connectorRuntime.connector.<p>.enabled).
  connectors:
    publishAtSeed: true
  coreBundleSeeder:
    enabled: true
    # fix/preexisting-test-failures: the alpha Discord ingest source, moved here from
    # rustDataPlane.svcProcess's legacy processIngestPlatform/processIngestSourceId
    # (removed by PR #538 -- see rustDataPlane.svcProcess comment above). Activation
    # and bindings for the alpha Discord community still require this seeded here,
    # independent of svc-process's DB-driven bundle path.
    platformConnections:
      - platform: "discord"
        sourceId: "474965105759748096"
        label: "svc-ingest platform connection"
    # fix/seeder-memory (not yet merged as of this branch's base): 64Mi/128Mi was
    # the real OOMKilled cause in CI's kind install (gh PR #480), overriding the
    # base chart's 512Mi limit -- Helm merges this file over the chart default,
    # so this override was what actually applied. Measured real peak (cgroup
    # memory.peak) seeding both ping.wasm/pyping.wasm sequentially: ~218Mi.
    # Raised to 256Mi/512Mi (~1.5x peak headroom). Reconcile/drop this block if
    # fix/seeder-memory (PR #515) lands first.
    #
    # fix/seeder-throughput: this 100m/300m CPU override (unrelated to the memory
    # fix above) was the real bottleneck across 3 deploy attempts (13->15->24 of
    # ~39 bundles seeded) -- real per-bundle work (component inspect/stage/publish,
    # catalog install, source-binding sync, Ed25519 signing) got throttled to
    # ~75s/bundle instead of the ~20s assumed by values.yaml's activeDeadlineSeconds
    # comment, so the Job hit its deadline partway through every run and the
    # capability-grants phase (which only runs after seeding completes) never
    # executed. Raised to 1000m/2000m so the one-shot hook can use the alpha
    # node's spare headroom instead of being CFS-throttled.
    resources:
      requests: { cpu: "1000m", memory: "256Mi" }
      limits: { cpu: "2000m", memory: "512Mi" }
  hubWebui:
    enabled: true
    replicas: 1
    # Direct host-IP access for testers (http://<node-ip>:30879, no /etc/hosts or
    # Host-header needed) -- port matches webui.publicUrl/connectionsCallbackBaseUrl
    # above, which already assumed this NodePort. Ingress (waddles.localhost.local)
    # keeps working unchanged alongside it -- see templates/hub-webui.yaml.
    # dal2-alpha: NO NodePort (real cluster) -- reached only via the Ingress below.
    nodePort:
      enabled: false
    resources:
      requests: { cpu: "50m", memory: "64Mi" }
      limits: { cpu: "200m", memory: "256Mi" }
  svcRtc:
    enabled: false
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
  svcPresentation:
    enabled: true
    # Pinned to 1: overlay fan-out is in-process, >1 replica splits frames across pods (the chart
    # refuses replicas > 1 without sharedFanout.enabled -- see values.yaml).
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
  # Issue #287 -- transcode-capable min-spec (higher than the generic pipeline tier above)
  # plus fixed alpha NodePorts for direct RTMP/SRT/HTTP media ingest (OBS/ffmpeg target
  # localhost:31935 for RTMP push). PUBLIC_BASE_URL is derived at runtime from the node the
  # pod runs on (downward API status.hostIP) + the http NodePort below, so playback URLs
  # resolve off-laptop without a hardcoded LAN IP that goes stale when the host's network
  # changes (it did: 192.168.10.75 -> 192.168.2.210).
  svcStreaming:
    enabled: true
    replicas: 1
    publicBaseUrl: ""
    # dal2-alpha: no NodePort media exposure; RTMP/SRT external ingest + public HLS URL need a
    # dedicated LB/route (chart gap -- see handoff report), so streaming is internal-only for now.
    publicBaseUrlFromNodeIP: false
    nodePort:
      enabled: false
    resources:
      requests: { cpu: "200m", memory: "256Mi" }
      limits: { cpu: "2000m", memory: "1Gi" }

  # feature/e2e-helm-rust-dataplane -- Rust data-plane stack. Formalizing the alpha e2e
  # cutover state here (svc-action executor wiring) -- this was previously
  # `enabled: false` with the e2e run only ever reached via ad hoc `--set` flags never
  # committed to git (tribal knowledge, at risk of being lost between sessions). This alpha
  # cluster's real, proven purpose today IS the Rust data-plane e2e proof (ping/pong bundle,
  # spec `docs/superpowers/specs/2026-09-14-rust-data-plane-design.md`), so `enabled: true`
  # now reflects that honestly. The legacy Python svc-ingest/svc-process/svc-action
  # Deployments have been removed from the chart entirely. Still requires, via --reuse-values or an ephemeral
  # secrets file (never committed, critical-rules.md Token & Secret Hygiene):
  #   1. global.envelopeBindingKeys (kid e2e1) -- HMAC key material, secret, never committed.
  # fix/chart-autogen-bundle-signing-key -- item 2 (feature/bundle-artifact-signing's
  # manual `make generate-bundle-signing-key` + hand-set bundleSigningPublicKeys below)
  # is REMOVED: templates/auto-provisioned-keys-job.yaml's pre-install/pre-upgrade hook
  # now generates the `waddlebot-bundle-signing` Secret itself on alpha/local and
  # publishes its public key into the `waddlebot-bundle-signing-public` ConfigMap, which
  # templates/svc-bundles-executor.yaml sources
  # BUNDLE_SIGNING_PUBLIC_KEYS from directly -- no manual step before the executor(s)
  # start. See the chart README's "Bundle Artifact Signing Rollout Order" section.
  # global.hostApiTls real mTLS material is NO LONGER a manual --set-file requirement here
  # (fix/alpha-host-api-tls) -- templates/host-api-tls-secret.yaml self-provisions it on
  # alpha/local (lookup-then-generate, same policy as global.valkeyTls), so
  # waddlebot.hostApiTlsMaterialAvailable is true whenever this enabled flag is, with no
  # insecureDev escape hatch needed (unlike global.grpcTls).
  rustDataPlane:
    enabled: true
    # Left empty: no longer required (see comment above) -- the executor(s) now source
    # BUNDLE_SIGNING_PUBLIC_KEYS from the auto-provisioned ConfigMap by default. Only
    # set this explicitly to pin a specific key (e.g. multi-key rotation): e.g.
    # --set pipeline.rustDataPlane.bundleSigningPublicKeys.e2e1=<base64 pubkey>
    bundleSigningPublicKeys: {}
    svcIngest:
      replicas: 1
      # kid `e2e1` -- must match a key present in global.envelopeBindingKeys (secret,
      # supplied at deploy time only, see comment above). Enables the Discord gateway
      # receiver's envelope signing (core/svc_ingest/src/config.rs) -- DISCORD_BOT_TOKEN
      # already reaches this pod via envFrom/explicit secretKeyRef either way.
      envelopeBindingActiveKid: "e2e1"
      # F4 -- turns on svc-ingest's machine-JWT grant + SERVICE_JWT_* env + token mount
      # (alpha only; the base values.yaml default is false so beta/prod never render them).
      dynamicConnections:
        enabled: true
      # P6a generic outbound executor (waddles.connector-tools): OFF until the pinned connector
      # digests exist and a svc-bundles-executor dials the host-api port (core/svc_ingest/README.md).
      connectorTools:
        enabled: false
      # PR-H inbound connector runtime: EVERY connector stays OFF by default (spec SS7). Per-platform
      # ON procedure on alpha, ONE at a time, in this order (youtube -> discord -> twitch):
      #   1. connectorTools.enabled: true and set pipeline.connectors.digests.<p> (sha256:<hex>)
      #   2. connector.<p>.enabled: true (flips BOTH svc-ingest deployments), redeploy, smoke
      #   3. discord additionally needs identifyBudgetReady (true here: the Valkey IDENTIFY budget is wired;
      #      base/beta/gamma/production keep false and REJECT discord at render)
      #   4. webhookPlatforms needs routeKeySecret.existingSecret (operator-managed, never a literal)
      # Rollback: connector.<p>.enabled: false + redeploy. Beta/gamma/prod inherit OFF.
      connectorRuntime:
        enabled: false
        identifyBudgetReady: true
        connector:
          twitch: { enabled: false }
          discord: { enabled: false }
          youtube: { enabled: false }
      resources:
        requests: { cpu: "100m", memory: "128Mi" }
        limits: { cpu: "500m", memory: "512Mi" }
    svcProcess:
      replicas: 1
      # fix/alpha-deploy-executor-and-failfast -- the legacy single-app env
      # (processAppId, processIngestPlatform/SourceId, processBundleDigest/
      # Version/ComponentKey/SidecarKey, including the stale pinned
      # waddles.core.example.ping 1.0.0 digest sha256:4d24eedf...) is REMOVED
      # here. The DB-driven multi-tenant active-bundle loader below
      # (feature/bundle-reader-role, waddles_bundle_reader RO Postgres role)
      # is the sole bundle-selection path in this cluster now -- it serves
      # every app/tenant/community it finds in the DB (ping, pyping, later
      # csping) rather than one hardcoded app_id/digest, and core/svc_process/
      # src/lib.rs's mutual-exclusion rule means the legacy fields never ran
      # anyway once DB_READER_PASSWORD was provisioned. Leaving them unset
      # here (chart default: "", templates/svc-process-rust.yaml now omits
      # these env vars entirely when unset) closes the regression risk of a
      # stale digest silently winning back over the DB path on a future
      # `helm upgrade` if the DB-driven path is ever disabled.
      #
      # Multi-tenant, change-log-driven active-bundle loader (core/svc_process/
      # src/config.rs, core/bundle_active_set, core/svc_process/src/
      # changelog_consumer.rs) -- feature/bundle-reader-role: the RO Postgres
      # role (waddles_bundle_reader, alembic/versions/0032_bundle_reader_role.py)
      # is provisioned, and templates/secrets.yaml auto-generates
      # DB_READER_PASSWORD in alpha (same lookup-KEEP-then-generate policy as
      # POSTGRES_PASSWORD), so `resolve_multi_tenant_path_active`
      # (core/svc_process/src/lib.rs) resolves true at startup (both
      # kill-switch gates default enabled when unseen) and this DB-driven path
      # is authoritative for this pod's whole lifetime. Only overriding the
      # poll interval here (tunable per deployment) -- a shorter interval than
      # the 300s chart default so hot-swap changes are noticed without a
      # multi-minute wait.
      bundleConfigPollSeconds: 30
      # feature/alpha-command-flag-envs -- Docker ENV baseline for the 4 command
      # bundle flags (process-stage `transform()` only; action-stage `dispatch()`
      # has no flag check), now that posthog.enabled is false below. Convention:
      # `FLAG_<KEY>` (flag key uppercased, `.`/`-` -> `_`) -- PostHog overrides
      # these when connected (see templates/svc-process-rust.yaml's comment).
      # License-gated flags are NOT env-overridable -- those always resolve
      # against license.penguintech.io.
      extraEnv:
        FLAG_WADDLES_COMMAND_8BALL: "true"
        FLAG_WADDLES_COMMAND_ROLL: "true"
        FLAG_WADDLES_COMMAND_LURK: "true"
        FLAG_WADDLES_COMMAND_COUNT: "true"
        # PR #615 (waddles.core.example.command, custom text commands/timers) --
        # same Docker ENV baseline convention as the 4 flags above.
        FLAG_WADDLES_COMMAND_CUSTOMCOMMANDS: "true"
      resources:
        requests: { cpu: "100m", memory: "128Mi" }
        limits: { cpu: "2000m", memory: "512Mi" }
    svcAction:
      replicas: 1
      envelopeBindingActiveKid: "e2e1"
      # fix/alpha-deploy-executor-and-failfast -- see svcProcess's identical
      # comment above: the legacy actionAppId/actionBundleDigest/Version/
      # ComponentKey/SidecarKey fields (including the same stale pinned
      # sha256:4d24eedf... digest) are REMOVED here. The DB-driven active-
      # bundle loader below (same RO role/mechanism as svcProcess) is the sole
      # path; templates/svc-action-rust.yaml now omits these env vars entirely
      # when unset.
      # Multi-tenant changelog consumer -- see svcProcess's identical comment above.
      bundleConfigPollSeconds: 30
      resources:
        requests: { cpu: "100m", memory: "128Mi" }
        limits: { cpu: "2000m", memory: "512Mi" }
    # ONE svc-bundles-executor Deployment serves BOTH the process (svc-process-rust:8301) and
    # action (svc-action-rust:8302) stages plus the connector link -- the `stages` default in
    # values.yaml already lists both, so no stage override is needed here. Resources are the
    # larger of the two former Deployments (each replica holds a bundle registry per stage and
    # compiles the active set via Cranelift: the OOM finding that sized these still applies).
    # executor Phase 1: StatefulSet x2 (pod name = executor_id; each slot owned by both),
    # one pool serving every stage. dal2alpha has NO KEDA, NO metrics API and NO OTel
    # collector (checked 2026-11-11) -> autoscaling.mode none, fixed 2 replicas.
    bundleExecutor:
      replicas: 2
      # 4-CPU limit: compile 2 at a time (connectors + apps share it); AOT makes compiles rare.
      maxConcurrentCompiles: 2
      bucketName: "waddles-bundles"
      bucketRegion: "us-east-1"
      # 2 x 8Gi = the previous single pod's 16Gi ceiling; LRU budget ~5/8 of the limit.
      memoryBudgetMb: 5120
      resources:
        requests: { cpu: "500m", memory: "2Gi" }
        limits: { cpu: "4000m", memory: "8Gi" }
      autoscaling:
        mode: none

presentation:
  # Rust svc-presentation (overlay + image surface). Overlay view/SSE port reachable on-host at
  # localhost:31032. Image built by scripts/alpha-deploy.sh (global.imageTag).
  rust:
    enabled: true
    nodePort:
      enabled: false

# Issue #287 -- svc-streaming (Rust) image, built locally + pushed to the local registry
# (no CI image for it yet), same as every other alpha module.
streaming:
  image:
    repository: "ghcr.io/penguintechinc/waddles/svc-streaming"
    tag: ""

# feature/e2e-helm-rust-dataplane -- svc-bundles-executor built locally + pushed to the local
# registry, same pattern as every other alpha module image. fix/alpha-deploy-executor-
# and-failfast: core/bundle_executor/Dockerfile.rust now exists and scripts/
# alpha-deploy.sh builds+pushes it -- tag is intentionally left unset (not a static
# "alpha") so the svc-bundles-executor.yaml template's `.Values.
# bundleExecutor.image.tag | default .Values.global.imageTag` falls through to the
# per-commit SHA8 alpha-deploy.sh sets via `--set global.imageTag`, same as every other
# SHA-tagged alpha image. This closes the stale-mutable-tag bug where both executor
# Deployments kept running a build from before the live object_store bucket wiring
# landed (svc-bundles-executor.yaml's own imagePullPolicy comment) because nothing ever
# rebuilt/pushed a new `:alpha` tag for this image.
bundleExecutor:
  image:
    repository: "ghcr.io/penguintechinc/waddles/svc-bundles-executor"
    tag: ""

# svc-bundles-executor: the old CPU/memory HPA (targets <unknown>, no metrics API here) is
# removed; the executor is a StatefulSet with its own PDB (maxUnavailable 1) and optional
# KEDA autoscaling (pipeline.rustDataPlane.bundleExecutor.autoscaling) once KEDA lands.

# Ingress via Gateway API: Waddles does NOT own a gateway. It attaches an HTTPRoute to the
# cluster-wide Cilium Gateway `shared` (ns gateway-system, class cilium-shared). TLS terminates
# at that Gateway's 443 listener (cloudflare-origin-wildcard); Cloudflare is the public edge, so
# no cert is referenced here. hub-webui proxies /api/* to hub-api itself -> one route suffices.
# nginx Ingress is OFF; the Gateway owns the NodePort (Waddles Services stay ClusterIP).
ingress:
  enabled: false
httproute:
  enabled: true
  gatewayName: shared
  gatewayNamespace: gateway-system
  hostnames:
    - waddles-alpha.penguintech.cloud
  rules:
    - path: /
      service: "waddlebot-hub-webui-v3"
      port: 8080
      timeoutSeconds: 3600

# Operator-provisioned Secret (never rendered/overwritten by this chart).
platformCredentials:
  existingSecret: "waddlebot-platform-credentials"


# Egress lockdown stays on even in alpha so the CNP + proxy path gets
# exercised before beta — resource-trimmed only.
egressProxy:
  enabled: true
  environment: "alpha"
  replicas: 1
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits: { cpu: "150m", memory: "128Mi" }
egressPolicy:
  enabled: true
  # dal2-alpha is a real cluster: full all-workload egress default-deny (base default true).
  workloadEgress:
    enabled: true
  # Verified from live cluster: kubeadm clusterCIDR 10.244.0.0/16 (per-node /24), service 10.96.0.0/12.
  # nodeCidr feeds the SSRF/internal-range deny backstop -- kept broad (10.0.0.0/8, the base/alpha
  # value) on purpose; narrowing it to the pod CIDR weakened the backstop (security review).
  clusterCidrs:
    podCidr: "10.244.0.0/16"
    serviceCidr: "10.96.0.0/12"
    nodeCidr: "10.0.0.0/8"

# spire.enabled defaults to false at the chart level (values.yaml) pending
# https://github.com/penguintechinc/waddles/issues/437 (SPIRE server/agent
# crash-loop -- the waddlebot-spire-auto-enroll post-upgrade hook Job fails
# every rollout while this is true, which pins the whole release in FAILED
# state). Flip back to true once #437 is resolved and the hook has been
# verified green in a scratch namespace first. If a release is ALREADY stuck
# FAILED because of this, see the chart README "Recovering a FAILED release"
# section (helm rollback to the last good revision, or helm upgrade once
# this flag -- and therefore the hook -- is false).
spire:
  enabled: false
  environment: "alpha"
  server:
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "250m", memory: "256Mi" }
  agent:
    resources:
      requests: { cpu: "50m", memory: "64Mi" }
      limits: { cpu: "150m", memory: "128Mi" }

# Alpha is where the local e2e Playwright suite runs (tests/k8s/alpha/07-page-load.sh).
# Unlike beta (which already raises this 3x for the same reason), alpha inherited no
# override at all and ran on the hardcoded 100 req/min production default -- too strict
# for rapid SERIAL Playwright runs against a cold, cache-less cluster. Alpha-only,
# env-var driven; production/default
# stays untouched at 100.
#
# T10 (v3 demo) -- the ~26 legacy per-module Deployments (collectors/pushing/interactive/
# core) are superseded for this demo by the 4 new pipeline containers above (svc-ingest
# now owns Discord/Twitch ingest in-process; see PIPELINE_MAPPING.md for the full 31->7
# mapping). Disabled here (enabled: false) rather than left running duplicate/idle
# capacity alongside the new pipeline -- resources/replicas below stay min-spec'd (hub/
# hubWebui match their pipeline.hubApi/hubWebui tier above; every other rendered module
# shares one generic legacy tier of 50m/96Mi req, 300m/384Mi lim) so re-enabling any one
# of them for a non-demo alpha run needs no re-sizing. modules.bot/social stay enabled
# (true, from values.yaml) -- those are the MODULE_LOAD_* bundle-import toggles the
# pipeline containers themselves read, not legacy Deployment gates.
# feature/alpha-command-flag-envs -- flipped back OFF: this in-cluster stack was
# crashlooping on alpha, and the 4 command flags below are now covered by the
# FLAG_WADDLES_COMMAND_* Docker ENV baseline on svcProcess.extraEnv above
# (waddle_sdk feature_enabled() baseline, PostHog overrides when connected), so
# PostHog is no longer required to unblock them. Revert to `enabled: true` (no
# other change needed, per the comment below) once the crashloop is root-caused
# or a non-command flag needs in-cluster control.
#
# feature/alpha-localized-posthog -- flipped ON for alpha so feature flags
# (incl. the 4 command flags below) are controllable in-cluster, without a
# human needing PostHog organization access on license.penguintech.io.
#
# REAL FOOTPRINT at the trimmed resource tier below (6 new pods: web,
# worker, postgres, redis/valkey, clickhouse, kafka/redpanda) -- measured
# from the requests/limits actually rendered, not estimated:
#   requests: ~575m CPU / ~2.1Gi RAM   limits: ~2.6 CPU / ~4.2Gi RAM
#   persistent storage: postgres 2Gi + redis 512Mi + clickhouse 3Gi + kafka 2Gi = 7.5Gi
# This is heavier than a typical alpha service and was deliberately left OFF
# before this change (see docs/posthog-feature-flags.md in license-server:
# ClickHouse + Kafka are REQUIRED for the Django web app to boot at all --
# flag management can't currently drop them). If the laptop alpha node is
# already under disk/memory pressure, do NOT enable this blindly: either
# free capacity first (disable an idle module/collector in this file) or
# keep posthog.enabled=false and continue pointing at the hosted
# license.penguintech.io PostHog (comment this whole block back to
# `enabled: false` to revert instantly -- no other change needed).
#
# existingSecret/secrets.create both left unset: templates/infrastructure/
# posthog/secret.yaml auto-generates posthog-secrets (SECRET_KEY/
# POSTGRES_PASSWORD/CLICKHOUSE_PASSWORD) for alpha/local tiers only, via the
# same lookup-then-generate-or-keep pattern as auto-provisioned-secrets.yaml
# -- no literal committed here, no manual --set. posthog.bootstrap
# (values.yaml) then auto-provisions the admin/org/project/API key and seeds
# the command flags -- no manual PostHog UI step required either.
posthog:
  enabled: false
  bootstrap:
    enabled: true
  web:
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "384Mi" }
      limits: { cpu: "500m", memory: "768Mi" }
  worker:
    replicas: 1
    resources:
      requests: { cpu: "50m", memory: "256Mi" }
      limits: { cpu: "250m", memory: "512Mi" }
  postgres:
    storage: 2Gi
    resources:
      requests: { cpu: "50m", memory: "128Mi" }
      limits: { cpu: "250m", memory: "256Mi" }
  redis:
    storage: 512Mi
    resources:
      requests: { cpu: "25m", memory: "64Mi" }
      limits: { cpu: "100m", memory: "128Mi" }
  clickhouse:
    storage: 3Gi
    resources:
      requests: { cpu: "100m", memory: "768Mi" }
      limits: { cpu: "500m", memory: "1536Mi" }
  kafka:
    storage: 2Gi
    resources:
      requests: { cpu: "100m", memory: "512Mi" }
      limits: { cpu: "500m", memory: "1Gi" }

# R5 security baseline -- MANDATORY on dal2-alpha (release audit checks these).
# default-deny-ingress CiliumNetworkPolicy + per-workload CNPs (ports scoped, no NodePort/world).
networkPolicy:
  enabled: true
# Tetragon TracingPolicyNamespaced per workload, ENFORCED (Sigkill) -- needs Tetragon agent+CRD in cluster.
tetragon:
  enabled: true
  action: Sigkill
# Pod Security Admission restricted labels on the chart-managed namespace.
podSecurity:
  enabled: true
  enforce: restricted
  audit: restricted
  warn: restricted
# PII tokenization stays ON (opt-out only via PostHog kill-switch). Do NOT set enabled:false here.
# (piiTokenization is under pipeline: -- base default true is inherited.)

# Monday-demo: ENV baseline for waddles.calendar.event_discord_sync -> FLAG_WADDLES_CALENDAR_EVENT_DISCORD_SYNC
# in waddlebot-config (hub-api envFrom). NOTE: requires configmap.yaml template line from the demo branch.
config:
  eventDiscordSyncEnabled: true
  communityConnectionsEnabled: true
  # Monday-demo: ENV baseline for waddles.role_sync -> FLAG_WADDLES_ROLE_SYNC
  # (read by hub-api + the role-sync CronJob via envFrom waddlebot-config; PostHog still overrides).
  roleSyncEnabled: true
  # Cross-guild Discord role mirror demo: guild-pairing routes + the role-sync admin page.
  guildPairingEnabled: true
  webuiRoleSyncMappingEnabled: true

# Bundle storage v2 (references only; Secrets are created out-of-band). Enable once the
# Secrets exist -- off here so the pods keep starting without them:
# bundleStorageV2:
#   db: {enabled: true, existingSecret: waddlebot-bundle-db}
#   migrator: {enabled: true, existingSecret: waddlebot-bundle-migrator}

## Waddlebot - dal2-alpha overlay (layered AFTER values-alpha.yaml)
# Used by .github/workflows/deploy-dal2alpha.yml:
#   helm upgrade --install waddlebot ... -f values-alpha.yaml -f values-dal2alpha.yaml \
#     --set-string global.imageTag=alpha-<epoch64>
# values-alpha.yaml is the local-MicroK8s baseline (localhost:32000 images, LAN NodePort
# URLs); this overlay only repoints images at the CI-built ghcr.io set and the dal2a host.
global:
  imageRegistry: "ghcr.io/penguintechinc/waddles"
  deploymentTier: "alpha"
  imagePullSecrets:
    - name: ghcr-pull-secret

webui:
  publicUrl: "https://waddlebot.dal2a.penguintech.cloud"
  connectionsCallbackBaseUrl: "https://waddlebot.dal2a.penguintech.cloud"

# Empty tag = fall through to global.imageTag (set per deploy by the workflow).
presentation:
  image:
    repository: "ghcr.io/penguintechinc/waddles/svc-presentation-rust"
    tag: ""
streaming:
  image:
    repository: "ghcr.io/penguintechinc/waddles/svc-streaming"
    tag: ""
bundleExecutor:
  image:
    repository: "ghcr.io/penguintechinc/waddles/bundle-executor"
    tag: ""
reputation:
  image:
    repository: "ghcr.io/penguintechinc/waddles/reputation-module"
    tag: ""

## Waddlebot - Gamma Environment Overrides
#
# feature/bundle-artifact-signing + feature/bundle-egress-gateway -- gamma has no full
# values-gamma.yaml yet (DO gamma context/cluster is TBD, see
# admin/.claude/rules/penguintech.md); this file exists ONLY to carry the bundle-signing
# and egress-proxy overrides those two PRs required per environment. Extend in place once
# gamma's full topology (infrastructure sizing, image registry, etc.) lands, mirroring
# values-beta.yaml's shape rather than duplicating it here.
global:
  deploymentTier: "gamma"
  # Per-deploy unique gamma-<epoch> tags -> IfNotPresent (matches values.yaml default; stated
  # explicitly so all four env files declare the policy). Always only for a mutable tag.
  imagePullPolicy: IfNotPresent
  # Rust data plane TLS prerequisites (pipeline.rustDataPlane below). Names only, never material:
  #  - host-API mTLS (svc-process/svc-action/svc-bundles-executor): cert-manager mints
  #    <release>-host-api-tls from the ClusterIssuer below (PREREQ: cert-manager + that issuer in
  #    this cluster); the chart derives the stage identity itself on this path.
  #  - Valkey server TLS + hub-api internal gRPC TLS: Secrets <release>-valkey-tls and
  #    <release>-hub-api-grpc-tls are owned by an out-of-band ExternalSecret/SealedSecret
  #    (externalSecret: true). They MUST exist before `helm upgrade`; a missing Secret leaves the
  #    pods in ContainerCreating (loud), never a silent plaintext fallback.
  # Dedicated transit trust root for Postgres / SeaweedFS S3 / Valkey: a namespaced SelfSigned Issuer -> root CA -> CA Issuer
  # rendered by the chart (PREREQ: cert-manager with the NameConstraints feature gate). Clients trust only that root; the
  # hostApiTls/grpcTls identities below keep waddlebot-internal-ca. Overrides global.valkeyTls.externalSecret (cert-manager owns
  # <release>-valkey-tls in this mode).
  transitTls:
    certManager:
      enabled: true
  hostApiTls:
    certManager:
      enabled: true
      issuerKind: "ClusterIssuer"
      issuerName: "waddlebot-internal-ca"
  valkeyTls:
    externalSecret: true
  hubApiGrpcTls:
    externalSecret: true

pipeline:
  hubApi:
    # Run `make generate-bundle-signing-key KEY_ID=<label> KUBE_CONTEXT=<DO gamma context>
    # NAMESPACE=waddlebot` once before the first bundle approval on this env -- see
    # values.yaml's pipeline.hubApi.bundleSigning comment and the chart README's rollout
    # order. Default secret name (waddlebot-bundle-signing) used -- no override needed
    # unless running multiple releases in one namespace.
    bundleSigning:
      secretName: ""
  rustDataPlane:
    # Rust data plane (svc-ingest/svc-process/svc-action + svc-bundles-executor) -- the legacy
    # Python stages no longer exist in the chart, so this is the only ingest/process/action
    # path. Per-stage sub-toggles, replicas and resources inherit the base values.yaml defaults.
    enabled: true
    # Bundle `http` egress SSRF backstop (REQUIRED outside alpha/local -- the chart fails the
    # render when empty). Same pod/Service/node CIDRs as this file's egressPolicy.clusterCidrs;
    # confirm against the live cluster (`kubectl cluster-info dump | grep -E 'cluster-cidr|service-cluster-ip-range'`).
    egressClusterCidrDenylist:
      - "10.244.0.0/16"
      - "10.96.0.0/12"
      - "10.0.0.0/8"
    # ONE svc-bundles-executor pool (StatefulSet) serves BOTH stages (the `stages` default in values.yaml
    # lists svc-process-rust:8301 + svc-action-rust:8302). Resources are sized for the two
    # stages in one pod (the larger of the two former Deployments).
    # executor Phase 1: StatefulSet (pod name = executor_id), R=2 slot owners -> >=2 pods.
    # autoscaling.mode stays none until KEDA + Prometheus exist on this cluster (fails loud).
    bundleExecutor:
      replicas: 2
      memoryBudgetMb: 5120
      resources:
        requests: { cpu: "1000m", memory: "2Gi" }
        limits: { cpu: "4000m", memory: "8Gi" }
    bundleSigningPublicKeys: {}

# Egress lockdown — MANDATORY (fail guard blocks a render with this off).
egressProxy:
  enabled: true
  environment: "gamma"
  replicas: 1
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "250m", memory: "256Mi" }

egressPolicy:
  enabled: true
  clusterCidrs:
    podCidr: "10.244.0.0/16"    # DigitalOcean DOKS default — confirm against cluster before deploy
    serviceCidr: "10.96.0.0/12"
    nodeCidr: "10.0.0.0/8"

spire:
  environment: "gamma"

infrastructure:
  # SeaweedFS at-rest SSE-S3 KEK Secret NAME (pre-create via `make generate-seaweedfs-sse-key`;
  # the template fails closed outside alpha without it). Name only, same as values-beta.yaml.
  seaweedfs:
    encryption:
      secretName: "seaweedfs-sse-kek"
  # Durable delivery-state Valkey: primary + 1 warm replica, required anti-affinity.
  # Set infrastructure.valkeyDurable.password explicitly (no auto-generation outside alpha/local).
  valkeyDurable:
    enabled: true
    replicas: 2
    maxMemory: "600mb"
    antiAffinity: "hard"
    persistence:
      size: 5Gi
  # Dedicated bundle-kv Valkey (noeviction quota store): single pod, no replication.
  valkeyKv:
    enabled: true
    maxMemory: "128mb"
    persistence:
      size: 1Gi
    resources:
      requests: { cpu: "50m", memory: "128Mi" }
      limits: { cpu: "250m", memory: "256Mi" }

# svc-bundles-executor is a StatefulSet with its own PDB + optional KEDA/HPA-external
# autoscaling (pipeline.rustDataPlane.bundleExecutor.autoscaling) -- not in this registry.
autoscaling:
  services: {}

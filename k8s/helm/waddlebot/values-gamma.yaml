# Waddles Helm Chart - Gamma Cluster Values (DigitalOcean, upgrade-in-place)
#
# NOTE: this file is scoped to the feature/bundle-egress-gateway PR only.
# The chart has no existing values-gamma.yaml — full gamma parity (infra
# sizing, ingress hosts, image registry, etc. matching values-beta.yaml's
# breadth) is tracked separately and NOT part of this change. This file
# only carries the egress-proxy / egress-policy overrides required so a
# gamma render doesn't hit the `fail` guard.

# Egress lockdown — MANDATORY (fail guard blocks a render with this off).
egressProxy:
  enabled: true
  environment: "gamma"
  replicas: 1
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "250m", memory: "256Mi" }

egressPolicy:
  enabled: true
  clusterCidrs:
    podCidr: "10.244.0.0/16"    # DigitalOcean DOKS default — confirm against cluster before deploy
    serviceCidr: "10.96.0.0/12"
    nodeCidr: "10.0.0.0/8"

spire:
  environment: "gamma"

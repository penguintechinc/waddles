# Waddles Helm Chart - Beta Cluster Values
# This file overrides default values for beta cluster deployment
# Usage: helm upgrade --install waddlebot . -f values.yaml -f values-beta.yaml

# Webui Configuration
webui:
  publicUrl: "https://waddlebot.penguintech.cloud"

# Global settings for beta cluster
global:
  imageRegistry: "ghcr.io/penguintechinc/waddlebot"
  imageTag: "latest"
  imagePullPolicy: Always
  imagePullSecrets:
    - name: ghcr-pull-secret
  corsOrigin: "https://hub.waddlebot.io,https://waddlebot.io,https://waddles.penguintech.cloud,https://waddlebot.penguintech.cloud,http://localhost:3000,http://localhost:5173"

# Infrastructure - Enable core services in beta
infrastructure:
  postgresql:
    enabled: true
    # Database credentials (H-1 / H-3, docs/DATABASE_CREDENTIALS.md). global.deploymentTier=
    # production means NOTHING is generated: pre-create BOTH Secrets (ExternalSecret / SealedSecret
    # in practice) before `helm upgrade`, or the render fails with the missing key's name.
    #   owner:  kubectl -n waddlebot create secret generic waddlebot-db-admin \
    #             --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 24)"
    #   roles:  one PW_<ROLE_UPPERCASE> key per role in config/postgres/service-roles.yaml, e.g.
    #             kubectl -n waddlebot create secret generic waddlebot-db-credentials \
    #               --from-literal=PW_WADDLES_HUB_API="$(openssl rand -hex 24)" ...   (33 keys)
    # (or point serviceRoles.existingSecret / admin.existingSecret at your own Secret names).
    # The old repo-public *_dev_changeme passwords are burned and neutralized by alembic 0049.
    image: postgres:16-bookworm@sha256:a0fd72825431f4b7fd3f9d5def9f370b9c22012f1a9e37ece1a5749b95333fb7
    replicas: 1
    persistence:
      size: 10Gi
      storageClass: "longhorn"
    resources:
      requests: { cpu: "250m", memory: "384Mi" }
      limits: { cpu: "1500m", memory: "1536Mi" }
  redis:
    enabled: true
    image: valkey/valkey:8-bookworm@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
    replicas: 1
    persistence:
      size: 2Gi
      storageClass: "longhorn"
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "400m", memory: "384Mi" }
  seaweedfs:
    enabled: false
  ollama:
    enabled: false
  qdrant:
    enabled: false

# WADDLES_AI_ENABLED=false -- no Ollama deployed above (infrastructure.
# ollama.enabled: false), so hub-api's AI-routing subsystem stays off too
# rather than crash-looping/degrading against an unreachable backend.
#
# Resources/replicas min-spec'd for a shared beta cluster (economical, but
# slightly more headroom than alpha). Pipeline app services share one
# generic tier; hubApi/hubWebui are sized individually.
pipeline:
  svcIngest:
    replicas: 1
    resources:
      requests: { cpu: "150m", memory: "192Mi" }
      limits: { cpu: "750m", memory: "768Mi" }
  svcProcess:
    replicas: 1
    resources:
      requests: { cpu: "150m", memory: "192Mi" }
      limits: { cpu: "750m", memory: "768Mi" }
  svcAction:
    replicas: 1
    resources:
      requests: { cpu: "150m", memory: "192Mi" }
      limits: { cpu: "750m", memory: "768Mi" }
  svcCore:
    replicas: 1
    resources:
      requests: { cpu: "150m", memory: "192Mi" }
      limits: { cpu: "750m", memory: "768Mi" }
  hubApi:
    aiEnabled: false
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
    # feature/bundle-artifact-signing -- run `make generate-bundle-signing-key
    # KEY_ID=<label> KUBE_CONTEXT=dal2-beta NAMESPACE=waddlebot` once before the first
    # bundle approval on this env (uses the default secret name -- see values.yaml's
    # pipeline.hubApi.bundleSigning comment); deploymentTier=beta is outside alpha/local
    # so templates/auto-provisioned-keys-job.yaml's hook cannot generate this Secret
    # itself, only derive+publish its public key once it exists. rustDataPlane stays
    # disabled here (base default) -- fix/chart-autogen-bundle-signing-key: no
    # bundleSigningPublicKeys override is needed when the executor IS enabled here, it
    # now sources the public key from the auto-derived ConfigMap by default.
  hubWebui:
    replicas: 1
    resources:
      requests: { cpu: "50m", memory: "96Mi" }
      limits: { cpu: "300m", memory: "384Mi" }
  svcRtc:
    replicas: 1
    resources:
      requests: { cpu: "150m", memory: "192Mi" }
      limits: { cpu: "750m", memory: "768Mi" }
  svcPresentation:
    replicas: 1
    resources:
      requests: { cpu: "150m", memory: "192Mi" }
      limits: { cpu: "750m", memory: "768Mi" }
  # Issue #287 -- transcode-capable tier, higher than the generic pipeline stage tier
  # above (not the generic pipeline.svcProcess/svcAction resources -- ffmpeg/transcode is
  # real CPU work). No nodePort override -- base's pipeline.svcStreaming.nodePort.enabled
  # stays false, beta is ClusterIP-only per devops-kubernetes.md's "no NodePort in
  # beta/prod" rule (svc-streaming isn't RTMP-reachable from outside dal2 yet).
  svcStreaming:
    replicas: 1
    resources:
      requests: { cpu: "500m", memory: "512Mi" }
      limits: { cpu: "4000m", memory: "2Gi" }

# Issue #287 -- svc-streaming (Rust) image, CI-built from core/svc_streaming/Dockerfile.rust,
# published to ghcr.io like every other beta module.
streaming:
  image:
    repository: "ghcr.io/penguintechinc/waddlebot/svc-streaming"
    tag: ""

# Reputation service (Issue #310) -- CI-built image from ghcr.io, matches
# modules.hub's beta tier (lightweight internal API).
reputation:
  replicas: 1
  image:
    repository: "ghcr.io/penguintechinc/waddlebot/reputation-module"
    tag: ""
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "500m", memory: "512Mi" }

# PostHog stays OFF by default in beta too — flip on deliberately per
# release. When enabled, secrets MUST come from a pre-created Secret, never
# inline:
#   kubectl -n waddlebot create secret generic posthog-secrets \
#     --from-literal=SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 16)" \
#     --from-literal=CLICKHOUSE_PASSWORD=
# then: --set posthog.enabled=true --set posthog.existingSecret=posthog-secrets
posthog:
  enabled: false
  existingSecret: "posthog-secrets"
  web:
    replicas: 1
    resources:
      requests: { cpu: "250m", memory: "512Mi" }
      limits: { cpu: "1000m", memory: "1Gi" }
  worker:
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "384Mi" }
      limits: { cpu: "500m", memory: "768Mi" }
  postgres:
    storage: 10Gi
  clickhouse:
    storage: 20Gi
  kafka:
    storage: 10Gi

# Module image overrides - use registry image names
modules:
  # Router (legacy modules.* tier -- min-spec)
  router:
    image: router
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }

  # Hub (hub-api tier -- matches pipeline.hubApi)
  hub:
    image: hub-api
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
    env:
      RATE_LIMIT_MAX_REQUESTS: "300"     # 3× default; E2E suite generates bursts
      RATE_LIMIT_WINDOW_MS: "60000"      # Keep 60s window unchanged
      # Stricter, separate tier for login/token/passkey -- see
      # hub_api/services/rate_limiting.py. 3× its own 10/60s default,
      # matching this file's standard-tier "3x default" headroom above.
      RATE_LIMIT_AUTH_MAX_REQUESTS: "30"
      RATE_LIMIT_AUTH_WINDOW_MS: "60000"

  hubWebui:
    image: hub-webui
    replicas: 1
    resources:
      requests: { cpu: "50m", memory: "96Mi" }
      limits: { cpu: "300m", memory: "384Mi" }

  # Core Modules
  identityCore:
    image: core-identity
    replicas: 1

  labelsCore:
    image: core-labels
    replicas: 1

  browserSource:
    image: core-browser-source
    replicas: 1

  reputation:
    image: core-reputation
    replicas: 1

  community:
    image: core-community
    replicas: 1

  aiResearcher:
    image: ai-researcher
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }

  videoProxy:
    image: core-video-proxy

  engagement:
    image: core-engagement

  moduleRtc:
    image: core-module-rtc
    replicas: 1
    autoscaling:
      minReplicas: 1
      maxReplicas: 1

  # Collectors/Triggers
  collectors:
    twitch:
      image: collector-twitch
      replicas: 1
      resources:
        requests: { cpu: "100m", memory: "128Mi" }
        limits: { cpu: "500m", memory: "512Mi" }
    discord:
      image: collector-discord
      replicas: 1
      resources:
        requests: { cpu: "100m", memory: "128Mi" }
        limits: { cpu: "500m", memory: "512Mi" }
    slack:
      image: collector-slack
      replicas: 1
      resources:
        requests: { cpu: "100m", memory: "128Mi" }
        limits: { cpu: "500m", memory: "512Mi" }
    youtubeLive:
      image: collector-youtube
      replicas: 1
      resources:
        requests: { cpu: "100m", memory: "128Mi" }
        limits: { cpu: "500m", memory: "512Mi" }
    kick:
      image: collector-kick

  # Interactive Modules
  interactive:
    ai:
      image: interactive-ai
      replicas: 1
    alias:
      image: interactive-alias
      replicas: 1
    shoutout:
      image: interactive-shoutout
      replicas: 1
    inventory:
      image: interactive-inventory
      replicas: 1
    calendar:
      image: interactive-calendar
      replicas: 1
    memories:
      image: interactive-memories
      replicas: 1
    youtubeMusic:
      image: interactive-youtube-music
    spotify:
      image: interactive-spotify
    loyalty:
      image: interactive-loyalty
      replicas: 1
    translate:
      enabled: true
      name: translate-interaction
      image: interactive-translate
      replicas: 1
    lfg:
      image: interactive-lfg
      replicas: 1
    clip:
      image: interactive-clip
      replicas: 1
    serverStatus:
      image: interactive-server-status
      replicas: 1
    serverManager:
      image: interactive-server-manager
      replicas: 1

  # Core - missing modules
  analytics:
    image: core-analytics
    replicas: 1
  security:
    image: core-security
    replicas: 1
  workflow:
    image: core-workflow
    replicas: 1
  credentialManager:
    image: core-credential-manager
    replicas: 1

  # Marketplace Module
  marketplace:
    image: marketplace
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }

  # Platform Action Modules
  platformActions:
    discord:
      image: action-discord
      replicas: 1
    slack:
      image: action-slack
      replicas: 1
    twitch:
      image: action-twitch
      replicas: 1
    youtube:
      image: action-youtube

  # Rendered-but-not-yet-listed-above legacy modules (see
  # k8s/helm/waddlebot/templates/{core,interactive,pushing}/*.yaml) --
  # resources/replicas min-spec only, no image override needed (the
  # keys above under identityCore/labelsCore/etc. are stale leftovers
  # from an earlier module naming scheme and are not rendered by any
  # current template -- left untouched, out of scope for this pass).
  coreData:
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
  coreIdentity:
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
  coreCommunity:
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
  triggerWebhooks:
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
  triggerStreaming:
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
  actionPlatforms:
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
  actionServerless:
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
  interactiveSocial:
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
  interactiveGaming:
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
  interactiveMedia:
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
  interactiveProductivity:
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
  interactiveAi:
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
  interactiveLoyalty:
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }

# Shared Environment
sharedEnv:
  DB_HOST: "infra-postgres"
  REDIS_HOST: "infra-redis"
  MINIO_ENDPOINT: "infra-seaweedfs:8333"
  QDRANT_HOST: "infra-qdrant"
  ROUTER_URL: "http://waddlebot-router:8000"
  HUB_URL: "http://waddlebot-hub-api:8060"
  OAUTH_CALLBACK_BASE_URL: "https://waddles.penguintech.cloud"

# Ingress - disabled in favour of Cilium Gateway API HTTPRoute
ingress:
  enabled: false
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/websocket-services: "waddlebot-hub-api"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: waddlebot.penguintech.cloud
      paths: &api-paths
        # WebSocket
        - path: /socket.io
          pathType: Prefix
          service: hub-api
          port: 8060

        # Hub API routes
        - path: /api/v1/public
          pathType: Prefix
          service: hub-api
          port: 8060
        - path: /api/v1/auth
          pathType: Prefix
          service: hub-api
          port: 8060
        - path: /api/v1/user
          pathType: Prefix
          service: hub-api
          port: 8060
        - path: /api/v1/community
          pathType: Prefix
          service: hub-api
          port: 8060
        - path: /api/v1/communities
          pathType: Prefix
          service: hub-api
          port: 8060
        - path: /api/v1/admin
          pathType: Prefix
          service: hub-api
          port: 8060
        - path: /api/v1/platform
          pathType: Prefix
          service: hub-api
          port: 8060
        - path: /api/v1/superadmin
          pathType: Prefix
          service: hub-api
          port: 8060
        - path: /api/v1/cookie
          pathType: Prefix
          service: hub-api
          port: 8060
        - path: /api/v1/signup-settings
          pathType: Prefix
          service: hub-api
          port: 8060
        - path: /api/v1/internal
          pathType: Prefix
          service: hub-api
          port: 8060

        # Router
        - path: /api/v1/router
          pathType: Prefix
          service: router
          port: 8000

        # Core modules
        - path: /api/v1/identity
          pathType: Prefix
          service: identity-core
          port: 8050
        - path: /api/v1/labels
          pathType: Prefix
          service: labels-core
          port: 8023
        - path: /api/v1/reputation
          pathType: Prefix
          service: reputation
          port: 8021
        - path: /api/v1/community-core
          pathType: Prefix
          service: community
          port: 8020

        # Interactive modules
        - path: /api/v1/ai
          pathType: Prefix
          service: ai-interaction
          port: 8005
        - path: /api/v1/ai-researcher
          pathType: Prefix
          service: ai-researcher
          port: 8070
        - path: /api/v1/alias
          pathType: Prefix
          service: alias-interaction
          port: 8010
        - path: /api/v1/shoutout
          pathType: Prefix
          service: shoutout-interaction
          port: 8011
        - path: /api/v1/inventory
          pathType: Prefix
          service: inventory-interaction
          port: 8024
        # SECURITY: routed through hub-api, NOT calendar-interaction directly
        # -- hub-api's scope-gated event_calendar_bp + EventCalendarProxyClient
        # are the only legitimate JWT-validators/setters of the
        # X-User-Context/X-API-Key headers calendar_interaction_module trusts
        # (live authz bypass, fixed 2026-10).
        - path: /api/v1/calendar
          pathType: Prefix
          service: hub-api
          port: 8060
        - path: /api/v1/memories
          pathType: Prefix
          service: memories-interaction
          port: 8031
        - path: /api/v1/loyalty
          pathType: Prefix
          service: loyalty-interaction
          port: 8032
        - path: /api/v1/youtube-music
          pathType: Prefix
          service: youtube-music
          port: 8025
        - path: /api/v1/spotify
          pathType: Prefix
          service: spotify-interaction
          port: 8026

        # Marketplace standalone service (specific paths before hub-api catch-all)
        - path: /api/v1/marketplace/catalog
          pathType: Prefix
          service: marketplace
          port: 8100
        - path: /api/v1/marketplace/communities
          pathType: Prefix
          service: marketplace
          port: 8100
        - path: /api/v1/marketplace/vendor
          pathType: Prefix
          service: marketplace
          port: 8100
        - path: /api/v1/marketplace/admin
          pathType: Prefix
          service: marketplace
          port: 8100
        - path: /api/v1/marketplace/premium
          pathType: Prefix
          service: marketplace
          port: 8100
        - path: /api/v1/marketplace/payments
          pathType: Prefix
          service: marketplace
          port: 8100
        - path: /api/v1/marketplace/webhooks
          pathType: Prefix
          service: marketplace
          port: 8100
        - path: /api/v1/marketplace/internal
          pathType: Prefix
          service: marketplace
          port: 8100
        - path: /api/v1/marketplace
          pathType: Prefix
          service: hub-api
          port: 8060

        # Platform webhook receivers
        - path: /api/messages
          pathType: Prefix
          service: teams-collector
          port: 8008
        - path: /api/v1/mattermost/webhook
          pathType: Prefix
          service: mattermost-collector
          port: 8009
        - path: /api/v1/googlechat/webhook
          pathType: Prefix
          service: googlechat-collector
          port: 8012

        # Existing webhook receivers
        - path: /webhooks/twitch
          pathType: Prefix
          service: twitch-collector
          port: 8002
        - path: /webhooks/discord
          pathType: Prefix
          service: discord-collector
          port: 8003
        - path: /webhooks/slack
          pathType: Prefix
          service: slack-collector
          port: 8004

        # Frontend catch-all (must be last)
        - path: /
          pathType: Prefix
          service: hub-webui
          port: 80

    - host: waddles.penguintech.cloud
      paths: *api-paths
  tls:
    - secretName: penguintech-cloud-wildcard-tls
      hosts:
        - waddlebot.penguintech.cloud
        - waddles.penguintech.cloud

# HTTPRoute (Cilium Gateway API) — replaces nginx ingress
# WebSocket is native in HTTPRoute; 3600s timeout preserves long-lived WS connections.
# Service names follow waddlebot Helm convention: waddlebot-{service}
httproute:
  enabled: false  # Routes split into k8s/httproute-{hub,modules,misc}.yaml (>16 rules exceeds HTTPRoute limit)
  gatewayName: shared
  gatewayNamespace: gateway
  hostnames:
    - "waddlebot.penguintech.cloud"
    - "waddles.penguintech.cloud"
  rules:
    # WebSocket + Hub API routes (3600s timeout for long-lived WS connections)
    - path: /socket.io
      service: "waddlebot-hub-api"
      port: 8060
      timeoutSeconds: 3600
    - path: /api/v1/public
      service: "waddlebot-hub-api"
      port: 8060
      timeoutSeconds: 3600
    - path: /api/v1/auth
      service: "waddlebot-hub-api"
      port: 8060
      timeoutSeconds: 3600
    - path: /api/v1/user
      service: "waddlebot-hub-api"
      port: 8060
      timeoutSeconds: 3600
    - path: /api/v1/community
      service: "waddlebot-hub-api"
      port: 8060
      timeoutSeconds: 3600
    - path: /api/v1/communities
      service: "waddlebot-hub-api"
      port: 8060
      timeoutSeconds: 3600
    - path: /api/v1/admin
      service: "waddlebot-hub-api"
      port: 8060
      timeoutSeconds: 3600
    - path: /api/v1/platform
      service: "waddlebot-hub-api"
      port: 8060
      timeoutSeconds: 3600
    - path: /api/v1/superadmin
      service: "waddlebot-hub-api"
      port: 8060
      timeoutSeconds: 3600
    - path: /api/v1/cookie
      service: "waddlebot-hub-api"
      port: 8060
      timeoutSeconds: 3600
    - path: /api/v1/signup-settings
      service: "waddlebot-hub-api"
      port: 8060
      timeoutSeconds: 3600
    - path: /api/v1/internal
      service: "waddlebot-hub-api"
      port: 8060
      timeoutSeconds: 3600
    # Router
    - path: /api/v1/router
      service: "waddlebot-router"
      port: 8000
    # Core modules (updated to current service names)
    - path: /api/v1/identity
      service: "waddlebot-core-identity"
      port: 8050
    - path: /api/v1/community-core
      service: "waddlebot-core-community"
      port: 8020
    # Interactive modules (updated to current service names)
    - path: /api/v1/ai
      service: "waddlebot-interactive-ai"
      port: 8005
    - path: /api/v1/ai-researcher
      service: "waddlebot-ai-researcher"
      port: 8070
    - path: /api/v1/alias
      service: "waddlebot-interactive-social"
      port: 8010
    # SECURITY: routed through hub-api, NOT waddlebot-interactive-productivity
    # directly (live authz bypass, fixed 2026-10) -- see matching comment above.
    - path: /api/v1/calendar
      service: "waddlebot-hub-api"
      port: 8060
      timeoutSeconds: 3600
    - path: /api/v1/loyalty
      service: "waddlebot-interactive-loyalty"
      port: 8032
    # Marketplace (specific paths before hub-api catch-all)
    - path: /api/v1/marketplace/catalog
      service: "waddlebot-marketplace"
      port: 8100
    - path: /api/v1/marketplace/communities
      service: "waddlebot-marketplace"
      port: 8100
    - path: /api/v1/marketplace/vendor
      service: "waddlebot-marketplace"
      port: 8100
    - path: /api/v1/marketplace/admin
      service: "waddlebot-marketplace"
      port: 8100
    - path: /api/v1/marketplace/premium
      service: "waddlebot-marketplace"
      port: 8100
    - path: /api/v1/marketplace/payments
      service: "waddlebot-marketplace"
      port: 8100
    - path: /api/v1/marketplace/webhooks
      service: "waddlebot-marketplace"
      port: 8100
    - path: /api/v1/marketplace/internal
      service: "waddlebot-marketplace"
      port: 8100
    - path: /api/v1/marketplace
      service: "waddlebot-hub-api"
      port: 8060
      timeoutSeconds: 3600
    # Webhook receivers
    - path: /webhooks/twitch
      service: "waddlebot-twitch-collector"
      port: 8002
    - path: /webhooks/discord
      service: "waddlebot-discord-collector"
      port: 8003
    - path: /webhooks/slack
      service: "waddlebot-slack-collector"
      port: 8004
    # Frontend catch-all (must be last)
    - path: /
      service: "waddlebot-hub-webui"
      port: 80

# Network Policies — enabled in beta for namespace isolation
networkPolicy:
  enabled: true

# Egress lockdown — MANDATORY from beta on (the fail guard in
# infrastructure/egress-proxy.yaml blocks a render with this off).
egressProxy:
  enabled: true
  environment: "beta"
  replicas: 1
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "250m", memory: "256Mi" }
egressPolicy:
  enabled: true
  clusterCidrs:
    podCidr: "10.244.0.0/16"      # dal2 — confirm against cluster CNI config before deploy
    serviceCidr: "10.96.0.0/12"
    nodeCidr: "10.0.0.0/8"

presentation:
  image:
    repository: "waddlebot-svc-presentation"
    tag: "latest"

spire:
  enabled: true
  environment: "beta"
  server:
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "250m", memory: "256Mi" }
  agent:
    resources:
      requests: { cpu: "50m", memory: "64Mi" }
      limits: { cpu: "150m", memory: "128Mi" }

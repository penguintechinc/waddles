apiVersion: v1
kind: Pod
metadata:
  name: {{ include "ollama.fullname" . }}-test
  labels:
    {{- include "ollama.labels" (dict "root" . "component" "helm-test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  enableServiceLinks: false
  {{- with .Values.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    {{- include "ollama.podSecurityContext" . | nindent 4 }}
  containers:
    - name: test
      image: {{ printf "%s@%s" .Values.test.image.repository .Values.test.image.digest }}
      command:
        - /bin/sh
        - -c
        - |
          set -eu
          # absolute paths: Tetragon sees every PATH-walk execve attempt, not only the one that succeeds
          out=$(/usr/bin/curl -sf --max-time 15 {{ include "ollama.url" . }}/api/tags)
          echo "$out" | /bin/grep -q '"name":"{{ .Values.model }}"'
          echo "OK: {{ .Values.model }} is listed by /api/tags"
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 200m, memory: 64Mi}
      securityContext:
        {{- include "ollama.containerSecurityContext" . | nindent 8 }}

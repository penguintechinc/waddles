# ClusterIP only: no NodePort/HostPort/externalIPs. Ollama's HTTP API is an approved third-party
# exception to the in-cluster gRPC rule (see README).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ollama.fullname" . }}
  labels:
    {{- include "ollama.labels" (dict "root" . "component" "server") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ollama.selectorLabels" (dict "root" . "component" "server") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP

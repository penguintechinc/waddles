apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: waddlebot-modules
  namespace: waddlebot
spec:
  parentRefs:
    - name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - "waddlebot.penguintech.cloud"
    - "waddles.penguintech.cloud"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/ai-researcher
      backendRefs:
        - name: waddlebot-ai-researcher
          port: 8070
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/alias
      backendRefs:
        - name: waddlebot-interactive-social
          port: 8010
    # SECURITY: routed through hub-api, NOT waddlebot-interactive-productivity
    # directly. hub-api's scope-gated `event_calendar_bp`
    # (hub_api/blueprints/v1/event.py) + `EventCalendarProxyClient`
    # (hub_api/services/event_calendar_proxy.py) are the only legitimate
    # JWT-validators and setters of the `X-User-Context` /`X-API-Key`
    # headers that calendar_interaction_module trusts. A direct route here
    # bypassed JWT auth entirely (live authz bypass, fixed 2026-10).
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/calendar
      timeouts:
        request: 3600s
        backendRequest: 3600s
      backendRefs:
        - name: waddlebot-hub-api
          port: 8060
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/loyalty
      backendRefs:
        - name: waddlebot-interactive-loyalty
          port: 8032
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/marketplace/catalog
      backendRefs:
        - name: waddlebot-marketplace
          port: 8100
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/marketplace/communities
      backendRefs:
        - name: waddlebot-marketplace
          port: 8100
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/marketplace/vendor
      backendRefs:
        - name: waddlebot-marketplace
          port: 8100
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/marketplace/admin
      backendRefs:
        - name: waddlebot-marketplace
          port: 8100
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/marketplace/premium
      backendRefs:
        - name: waddlebot-marketplace
          port: 8100
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/marketplace/payments
      backendRefs:
        - name: waddlebot-marketplace
          port: 8100
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/marketplace/webhooks
      backendRefs:
        - name: waddlebot-marketplace
          port: 8100
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/marketplace/internal
      backendRefs:
        - name: waddlebot-marketplace
          port: 8100

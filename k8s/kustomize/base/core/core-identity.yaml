---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-identity
  labels:
    app: core-identity
    app.kubernetes.io/component: core
spec:
  replicas: 2
  selector:
    matchLabels:
      app: core-identity
  template:
    metadata:
      labels:
        app: core-identity
        app.kubernetes.io/component: core
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
      - name: db-migrate
        image: migrations:latest
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: waddlebot-config
        - secretRef:
            name: waddlebot-secrets
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
      containers:
      - name: core-identity
        image: core-identity:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8050
          protocol: TCP
        - name: grpc
          containerPort: 50030
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        envFrom:
        - configMapRef:
            name: waddlebot-config
        - secretRef:
            name: waddlebot-secrets
            optional: true
        env:
        - name: MODULE_NAME
          value: "core-identity"
        - name: MODULE_PORT
          value: "8050"
        - name: GRPC_PORT
          value: "50030"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        volumeMounts:
        - name: logs
          mountPath: /var/log/waddlebotlog
        - name: databases
          mountPath: /app/databases
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: logs
        emptyDir: {}
      - name: databases
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: core-identity
  labels:
    app: core-identity
    app.kubernetes.io/component: core
spec:
  type: ClusterIP
  selector:
    app: core-identity
  ports:
  - name: http
    port: 8050
    targetPort: http
    protocol: TCP
  - name: grpc
    port: 50030
    targetPort: grpc
    protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub-api
  labels:
    app: hub-api
    app.kubernetes.io/component: hub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hub-api
  template:
    metadata:
      labels:
        app: hub-api
        app.kubernetes.io/component: hub
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
      - name: db-migrate
        image: waddlebot-migrations:latest
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: waddlebot-config
        - secretRef:
            name: waddlebot-secrets
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
      containers:
      - name: hub-api
        image: hub-api:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8060
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        envFrom:
        - configMapRef:
            name: waddlebot-config
        - secretRef:
            name: waddlebot-secrets
            optional: true
        env:
        - name: MODULE_NAME
          value: "hub-api"
        - name: MODULE_PORT
          value: "8060"
        # gh-894 -- analytics-core is consolidated into core-data (:8040, /api/v1/analytics/*).
        - name: ANALYTICS_CORE_API_URL
          value: "http://core-data:8040"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        volumeMounts:
        - name: logs
          mountPath: /var/log/waddlebotlog
        - name: databases
          mountPath: /app/databases
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: logs
        emptyDir: {}
      - name: databases
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hub-api
  labels:
    app: hub-api
spec:
  type: ClusterIP
  ports:
  - port: 8060
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: hub-api

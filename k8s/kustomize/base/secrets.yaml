# IMPORTANT: Placeholder values only. MUST be overridden via Kustomize secretGenerator (alpha)
# or Helm --set / sealed-secrets (beta/prod). Deploying these values will fail authentication.
---
apiVersion: v1
kind: Secret
metadata:
  name: waddlebot-secrets
type: Opaque
stringData:
  # Database credentials (matches docker-compose.yml defaults)
  POSTGRES_PASSWORD: "REPLACE_ME"
  DATABASE_PASSWORD: "REPLACE_ME"
  DB_PASS: "REPLACE_ME"

  # JWT and module secrets (matches docker-compose.yml defaults)
  JWT_SECRET: "REPLACE_ME_jwt_secret"
  MODULE_SECRET_KEY: "REPLACE_ME_module_secret"
  SERVICE_API_KEY: "REPLACE_ME_service_key"

  # Redis credentials (matches docker-compose.yml ACL setup)
  REDIS_PASSWORD: "REPLACE_ME"
  REDIS_ADMIN_PASSWORD: "REPLACE_ME"
  REDIS_ROUTER_PASSWORD: "REPLACE_ME"
  REDIS_HUB_PASSWORD: "REPLACE_ME"
  REDIS_WORKFLOW_PASSWORD: "REPLACE_ME"
  REDIS_AI_PASSWORD: "REPLACE_ME"
  REDIS_ANALYTICS_PASSWORD: "REPLACE_ME"
  REDIS_SECURITY_PASSWORD: "REPLACE_ME"
  REDIS_LOYALTY_PASSWORD: "REPLACE_ME"
  REDIS_SPOTIFY_PASSWORD: "REPLACE_ME"
  REDIS_YTMUSIC_PASSWORD: "REPLACE_ME"
  REDIS_TWITCH_PASSWORD: "REPLACE_ME"
  REDIS_DISCORD_PASSWORD: "REPLACE_ME"
  REDIS_SLACK_PASSWORD: "REPLACE_ME"

  # SeaweedFS S3 identity credentials (matches docker-compose.yml defaults)
  S3_ACCESS_KEY_ID: "REPLACE_ME"
  S3_SECRET_ACCESS_KEY: "REPLACE_ME"

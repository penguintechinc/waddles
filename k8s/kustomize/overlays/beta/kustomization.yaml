    newTag: latest
  - name: core-router
    newName: ghcr.io/penguintechinc/waddlebot/core-router
    newTag: latest
  - name: core-identity
    newName: ghcr.io/penguintechinc/waddlebot/core-identity
    newTag: latest
  - name: core-labels
    newName: ghcr.io/penguintechinc/waddlebot/core-labels
    newTag: latest
  - name: core-browser-source
    newName: ghcr.io/penguintechinc/waddlebot/core-browser-source
    newTag: latest
  - name: core-reputation
    newName: ghcr.io/penguintechinc/waddlebot/core-reputation
    newTag: latest
  - name: core-community
    newName: ghcr.io/penguintechinc/waddlebot/core-community
    newTag: latest
  - name: core-ai-researcher
    newName: ghcr.io/penguintechinc/waddlebot/core-ai-researcher
    newTag: latest
  - name: core-video-proxy
    newName: ghcr.io/penguintechinc/waddlebot/core-video-proxy
    newTag: latest
  - name: core-engagement
    newName: ghcr.io/penguintechinc/waddlebot/core-engagement
    newTag: latest
  - name: core-module-rtc
    newName: ghcr.io/penguintechinc/waddlebot/core-module-rtc
    newTag: latest

  # Collectors
  - name: collector-twitch
    newName: ghcr.io/penguintechinc/waddlebot/collector-twitch
    newTag: latest
  - name: collector-discord
    newName: ghcr.io/penguintechinc/waddlebot/collector-discord
    newTag: latest
  - name: collector-slack
    newName: ghcr.io/penguintechinc/waddlebot/collector-slack
    newTag: latest
  - name: collector-youtube-live
    newName: ghcr.io/penguintechinc/waddlebot/collector-youtube-live
    newTag: latest
  - name: collector-kick
    newName: ghcr.io/penguintechinc/waddlebot/collector-kick
    newTag: latest

  # Interactive Modules
  - name: interactive-ai
    newName: ghcr.io/penguintechinc/waddlebot/interactive-ai
    newTag: latest
  - name: interactive-alias
    newName: ghcr.io/penguintechinc/waddlebot/interactive-alias
    newTag: latest
  - name: interactive-shoutout
    newName: ghcr.io/penguintechinc/waddlebot/interactive-shoutout
    newTag: latest
  - name: interactive-inventory
    newName: ghcr.io/penguintechinc/waddlebot/interactive-inventory
    newTag: latest
  - name: interactive-calendar
    newName: ghcr.io/penguintechinc/waddlebot/interactive-calendar
    newTag: latest
  - name: interactive-memories
    newName: ghcr.io/penguintechinc/waddlebot/interactive-memories
    newTag: latest
  - name: interactive-youtube-music
    newName: ghcr.io/penguintechinc/waddlebot/interactive-youtube-music
    newTag: latest
  - name: interactive-spotify
    newName: ghcr.io/penguintechinc/waddlebot/interactive-spotify
    newTag: latest
  - name: interactive-loyalty
    newName: ghcr.io/penguintechinc/waddlebot/interactive-loyalty
    newTag: latest
  - name: interactive-translate
    newName: ghcr.io/penguintechinc/waddlebot/interactive-translate
    newTag: latest
  - name: ghcr.io/penguintechinc/waddlebot/clip-interaction
    newName: ghcr.io/penguintechinc/waddlebot/clip-interaction
    newTag: latest
  - name: ghcr.io/penguintechinc/waddlebot/lfg-interaction
    newName: ghcr.io/penguintechinc/waddlebot/lfg-interaction
    newTag: latest
  - name: ghcr.io/penguintechinc/waddlebot/server-status-interaction
    newName: ghcr.io/penguintechinc/waddlebot/server-status-interaction
    newTag: latest

  # Action/Pushing Services
  - name: action-discord
    newName: ghcr.io/penguintechinc/waddlebot/action-discord
    newTag: latest
  - name: action-slack
    newName: ghcr.io/penguintechinc/waddlebot/action-slack
    newTag: latest
  - name: action-twitch
    newName: ghcr.io/penguintechinc/waddlebot/action-twitch
    newTag: latest
  - name: action-youtube

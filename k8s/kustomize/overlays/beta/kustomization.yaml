    newName: ghcr.io/penguintechinc/waddlebot/infra-seaweedfs
    newTag: latest
  - name: infra-qdrant
    newName: ghcr.io/penguintechinc/waddlebot/infra-qdrant
    newTag: latest
  - name: infra-ollama
    newName: ghcr.io/penguintechinc/waddlebot/infra-ollama
    newTag: latest

  # Migrations
  - name: waddlebot-migrations
    newName: ghcr.io/penguintechinc/waddlebot/waddlebot-migrations
    newTag: latest

labels:
  - pairs:
      environment: beta
    includeSelectors: false

patches:
  # Configure ingress for beta environment
  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: waddlebot.penguintech.cloud
      - op: replace
        path: /spec/tls
        value:
          - hosts:
              - waddlebot.penguintech.cloud
            secretName: waddlebot-tls
    target:
      kind: Ingress
      name: waddlebot-ingress

  # Raise hub-api rate limit for beta (E2E test burst headroom). Adds the
  # auth-tier (login/token/passkey) env vars alongside the existing
  # standard-tier bump -- see the alpha overlay's matching patch for the
  # full rationale (hub_api/services/rate_limiting.py now actually reads
  # these for the first time).
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: RATE_LIMIT_MAX_REQUESTS
          value: "300"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: RATE_LIMIT_WINDOW_MS
          value: "60000"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: RATE_LIMIT_AUTH_MAX_REQUESTS
          value: "30"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: RATE_LIMIT_AUTH_WINDOW_MS
          value: "60000"
    target:
      kind: Deployment
      name: hub-api

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: waddlebot

resources:
  - ../../base

components:
  - ../../components/infrastructure

images:
  # Core Services — use locally built images (waddlebot/{service}:alpha)
  - name: hub-api
    newName: waddlebot/hub-api
    newTag: alpha
  - name: hub-webui
    newName: waddlebot/hub-webui
    newTag: alpha
  - name: router
    newName: waddlebot/core-router
    newTag: alpha
  - name: core-ai-researcher
    newName: waddlebot/core-ai-researcher
    newTag: alpha

  # Consolidated services — use locally built images (waddlebot/{service}:alpha)
  - name: core-data
    newName: waddlebot/core-data
    newTag: alpha
  - name: core-identity
    newName: waddlebot/core-identity
    newTag: alpha
  - name: core-community
    newName: waddlebot/core-community
    newTag: alpha

  # Collectors
  - name: collector-twitch
    newName: waddlebot/collector-twitch
    newTag: alpha
  - name: collector-discord
    newName: waddlebot/collector-discord
    newTag: alpha

  # Consolidated trigger services
  - name: trigger-webhooks
    newName: waddlebot/trigger-webhooks
    newTag: alpha
  - name: trigger-streaming
    newName: waddlebot/trigger-streaming
    newTag: alpha

  # Interactive Modules
  - name: interactive-ai
    newName: waddlebot/interactive-ai
    newTag: alpha
  - name: interactive-loyalty
    newName: waddlebot/interactive-loyalty
    newTag: alpha
  - name: interactive-translate
    newName: waddlebot/interactive-translate
    newTag: alpha

  # Consolidated interactive services
  - name: interactive-social
    newName: waddlebot/interactive-social
    newTag: alpha
  - name: interactive-gaming
    newName: waddlebot/interactive-gaming
    newTag: alpha
  - name: interactive-media
    newName: waddlebot/interactive-media
    newTag: alpha
  - name: interactive-productivity
    newName: waddlebot/interactive-productivity
    newTag: alpha

  # Action/Pushing Services
  - name: action-discord
    newName: waddlebot/action-discord
    newTag: alpha

  # Consolidated action services
  - name: action-platforms
    newName: waddlebot/action-platforms
    newTag: alpha
  - name: action-serverless
    newName: waddlebot/action-serverless
    newTag: alpha

  # Infrastructure Services — use upstream images directly
  - name: infra-postgres
    newName: postgres
    newTag: "15"
  - name: infra-redis
    newName: redis
    newTag: 7-bookworm@sha256:33d7c9a245edd95e6703a0addbeaa48fe40c3b3b4783627a72085155462ebfdb
  - name: infra-seaweedfs
    newName: chrislusf/seaweedfs
    newTag: "4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d"
  - name: infra-qdrant
    newName: qdrant/qdrant
    newTag: latest@sha256:75eab8c4ba42096724fdcfde8b4de0b5713d529dde32f285a1f86fdcb2c9e50c
  - name: infra-ollama
    newName: ollama/ollama
    newTag: latest

  # Migrations
  - name: waddlebot-migrations
    newName: waddlebot/waddlebot-migrations
    newTag: alpha

labels:
  - pairs:
      environment: alpha
    includeSelectors: false

patches:
  # Set all deployments to single replica for alpha environment
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment

  # Set imagePullPolicy to IfNotPresent for locally imported images.
  # Each deployment has exactly one main container at index 0 and
  # one init container (db-migrate) at index 0.
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
    target:
      kind: Deployment
  # Init containers (db-migrate) — target only deployments that have them.
  # Exclude: hub-webui and infra-* (they have no init containers).
  # Using label selector on app.kubernetes.io/component to match app deployments.
  - patch: |-
      - op: replace
        path: /spec/template/spec/initContainers/0/imagePullPolicy
        value: IfNotPresent
    target:
      kind: Deployment
      labelSelector: "app.kubernetes.io/component notin (hub-webui,storage,ai-runtime,database,vector-db,cache)"

  # Configure ingress for alpha environment.
  # Note: Kustomize's namePrefix transformer auto-updates ingress backend
  # service references, so most paths (hub-webui, hub-api, collectors, etc.)
  # are already prefixed correctly. We only need to set host/TLS and fix
  # core-module-rtc which the transformer misses (service name differs in base).
  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: waddles.localhost.local
      - op: replace
        path: /spec/tls
        value:
          - hosts:
              - waddles.localhost.local
            secretName: waddlebot-tls
      - op: replace
        path: /spec/rules/0/http/paths/4/backend/service/name
        value: module-rtc
    target:
      kind: Ingress
      name: waddlebot-ingress

  # Raise hub-api rate limit for alpha (higher than beta for E2E test runs).
  # RATE_LIMIT_MAX_REQUESTS/WINDOW_MS govern the standard tier (every
  # endpoint); RATE_LIMIT_AUTH_MAX_REQUESTS/WINDOW_MS is the separate,
  # stricter tier `hub_api/services/rate_limiting.py` applies to
  # login/token/passkey specifically -- added alongside the existing
  # standard-tier bump (not replacing it) so hub-api actually reading
  # these env vars for the first time doesn't newly 429 the E2E suite's
  # auth flow. `tests/e2e/auth.setup.js` already caches the login
  # session across spec files ("dramatically reduces the number of
  # login API calls"), so 50/60s here is generous headroom, not a
  # brute-force-protection bypass.
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: RATE_LIMIT_MAX_REQUESTS
          value: "1000"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: RATE_LIMIT_WINDOW_MS
          value: "60000"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: RATE_LIMIT_AUTH_MAX_REQUESTS
          value: "50"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: RATE_LIMIT_AUTH_WINDOW_MS
          value: "60000"
    target:
      kind: Deployment
      name: hub-api

configMapGenerator:
  - name: environment
    behavior: create
    literals:
      - LOG_LEVEL=DEBUG
      - RELEASE_MODE=false

# Propagate namePrefix into env var values that reference services.
# Kustomize namePrefix only updates resource metadata, not env var values.

# ==========================================================================
# DEPRECATED: Docker Compose support has been deprecated.
# Kubernetes (microk8s) with Helm v3 is now the standard deployment method.
#
# Use instead:
#   Alpha:  make k8s-alpha-deploy
#   Beta:   make k8s-beta-deploy
#   Prod:   make k8s-prod-deploy
#
# See k8s/helm/waddlebot/ for Helm charts and values files.
# This file is retained for reference only and will be removed in a future release.
# ==========================================================================

# Waddles Docker Compose - Unified Configuration
# Secure network isolation: internal services not exposed to host

networks:
  # Public network - services exposed to host
  waddlebot-public:
    driver: bridge

  # Internal network - database, redis, inter-service communication
  waddlebot-internal:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  postgres-replica-data:
  redis-data:
  rabbitmq-data:
  seaweedfs-data:
  ollama-data:
  qdrant-data:

services:
  # =============================================================================
  # INFRASTRUCTURE SERVICES (Internal Only - NOT exposed to host)
  # =============================================================================

  infra-postgres:
    image: postgres:16-bookworm@sha256:7858a1a43bb2e3decc07650c8989ba526e0a8164f212c9bb88b622cdbd71c4be
    container_name: infra-postgres
    environment:
      POSTGRES_USER: waddlebot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: waddlebot
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      # Allow replication connections from any host on the internal network
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./config/postgres/performance.conf:/etc/postgresql/performance.conf:ro
      - ./config/postgres/replication.conf:/etc/postgresql/replication.conf:ro
      - ./config/postgres/pg_hba.conf:/var/lib/postgresql/pg_hba.conf:ro
    command:
      - postgres
      - -c
      - hba_file=/var/lib/postgresql/pg_hba.conf
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hot_standby=on
      - -c
      - max_connections=400
      - -c
      - listen_addresses=*
    networks:
      - waddlebot-internal
    # NO ports exposed - internal only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waddlebot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db-migrations:
    build:
      context: .
      dockerfile: migrations/Dockerfile
    container_name: db-migrations
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-waddlebot}:${POSTGRES_PASSWORD:-changeme}@infra-postgres:5432/${POSTGRES_DB:-waddlebot}
      # SECURITY (CWE-798): dev/local-only bootstrap credential for the
      # first-run admin (see config/postgres/migrations/081_seed_default_hub_admin.sql).
      # No default is used in beta/gamma/prod -- leaving these unset there
      # means no admin account is auto-created (fail closed); an operator
      # must set them explicitly or run scripts/seed-admin.sh. Override
      # locally via .env to change the dev login.
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@localhost.local}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-WaddleDev-Local-Only-2026!}
    networks:
      - waddlebot-internal
    depends_on:
      infra-postgres:
        condition: service_healthy
    restart: "no"

  # PostgreSQL Read Replica - routes SELECT queries here to reduce primary load
  infra-postgres-replica:
    image: postgres:16-bookworm@sha256:7858a1a43bb2e3decc07650c8989ba526e0a8164f212c9bb88b622cdbd71c4be
    container_name: infra-postgres-replica
    user: postgres
    environment:
      POSTGRES_USER: waddlebot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: waddlebot
      PGUSER: waddlebot
      PGPASSWORD: ${POSTGRES_PASSWORD:-changeme}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
      - ./config/postgres/performance.conf:/etc/postgresql/performance.conf:ro
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e

        # Wait for primary to be ready
        until pg_isready -h infra-postgres -p 5432 -U waddlebot 2>/dev/null; do
          echo "Waiting for primary postgres..."
          sleep 2
        done
        echo "Primary is ready!"

        # If replica data doesn't exist, create base backup from primary
        if [ ! -f "$${PGDATA}/PG_VERSION" ]; then
          echo "Creating base backup from primary..."
          mkdir -p "$${PGDATA}"
          rm -rf "$${PGDATA}"/*
          PGPASSWORD="$${POSTGRES_PASSWORD:-changeme}" pg_basebackup -h infra-postgres -p 5432 -U waddlebot -D "$${PGDATA}" -Fp -Xs -P -R
          chmod 700 "$${PGDATA}"
          echo "Base backup complete!"
        fi

        # Start postgres in standby mode
        exec postgres -D "$${PGDATA}" -c hot_standby=on -c max_connections=400
    networks:
      - waddlebot-internal
    depends_on:
      infra-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waddlebot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  infra-redis:
    image: valkey/valkey:8-bookworm@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
    container_name: infra-redis
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    environment:
      # Admin password for maintenance
      REDIS_ADMIN_PASSWORD: ${REDIS_ADMIN_PASSWORD:-changeme}
      # Per-module passwords (use secure passwords in production!)
      REDIS_ROUTER_PASSWORD: ${REDIS_ROUTER_PASSWORD:-changeme}
      REDIS_HUB_PASSWORD: ${REDIS_HUB_PASSWORD:-changeme}
      REDIS_WORKFLOW_PASSWORD: ${REDIS_WORKFLOW_PASSWORD:-changeme}
      REDIS_AI_PASSWORD: ${REDIS_AI_PASSWORD:-changeme}
      REDIS_ANALYTICS_PASSWORD: ${REDIS_ANALYTICS_PASSWORD:-changeme}
      REDIS_SECURITY_PASSWORD: ${REDIS_SECURITY_PASSWORD:-changeme}
      REDIS_LOYALTY_PASSWORD: ${REDIS_LOYALTY_PASSWORD:-changeme}
      REDIS_SPOTIFY_PASSWORD: ${REDIS_SPOTIFY_PASSWORD:-changeme}
      REDIS_YTMUSIC_PASSWORD: ${REDIS_YTMUSIC_PASSWORD:-changeme}
      REDIS_TWITCH_PASSWORD: ${REDIS_TWITCH_PASSWORD:-changeme}
      REDIS_DISCORD_PASSWORD: ${REDIS_DISCORD_PASSWORD:-changeme}
      REDIS_SLACK_PASSWORD: ${REDIS_SLACK_PASSWORD:-changeme}
    volumes:
      - redis-data:/data
      - ./config/redis/redis.conf:/etc/redis/redis.conf:ro
      - ./config/redis/users.acl:/etc/redis/users.acl.template:ro
      - ./config/redis/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
    networks:
      - waddlebot-internal
    # NO ports exposed - internal only
    healthcheck:
      test: ["CMD", "redis-cli", "-u", "redis://admin:${REDIS_ADMIN_PASSWORD:-changeme}@localhost:6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  infra-seaweedfs:
    # chrislusf/seaweedfs (Apache-2.0) -- matches k8s/helm/waddlebot's
    # infrastructure.seaweedfs image/ports (S3 gateway replaces MinIO).
    image: docker.io/chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    container_name: infra-seaweedfs
    ports:
      - "8333:8333"   # S3 API
      - "9333:9333"   # Master
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-waddlebot}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-waddlebot-dev-secret}
    volumes:
      - seaweedfs-data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /etc/seaweedfs
        cat > /etc/seaweedfs/s3-identities.json <<EOF
        {
          "identities": [
            {
              "name": "waddlebot",
              "credentials": [
                {"accessKey": "$${S3_ACCESS_KEY_ID}", "secretKey": "$${S3_SECRET_ACCESS_KEY}"}
              ],
              "actions": ["Read", "Write", "List", "Tagging", "Admin"]
            }
          ]
        }
        EOF
        exec weed server -dir=/data -s3 -s3.port=8333 \
          -s3.config=/etc/seaweedfs/s3-identities.json \
          -master.port=9333 -volume.port=8080 -filer=true -filer.port=8888 -ip=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8333"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - waddlebot-internal
      - waddlebot-public
    restart: unless-stopped

  # Ollama for local AI inference - auto-pulls tinyllama model on startup
  # For GPU support: docker compose --profile gpu up -d
  ai-ollama:
    image: ollama/ollama:latest@sha256:5a5d014aa774f78ebe1340c0d4afc2e35afc12a2c3b34c84e71f78ea20af4ba3
    container_name: ai-ollama
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - waddlebot-internal
      - waddlebot-public  # Needs internet to pull models
    environment:
      OLLAMA_HOST: 0.0.0.0
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    restart: unless-stopped

  # Ollama with GPU - use with: docker compose --profile gpu up -d
  # Requires nvidia-container-toolkit to be installed
  ai-ollama-gpu:
    image: ollama/ollama:latest@sha256:5a5d014aa774f78ebe1340c0d4afc2e35afc12a2c3b34c84e71f78ea20af4ba3
    container_name: ai-ollama-gpu
    profiles:
      - gpu
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - waddlebot-internal
      - waddlebot-public
    environment:
      OLLAMA_HOST: 0.0.0.0
      NVIDIA_VISIBLE_DEVICES: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    restart: unless-stopped

  # Ollama model puller - pulls tinyllama on first startup
  ai-ollama-pull:
    image: ollama/ollama:latest@sha256:5a5d014aa774f78ebe1340c0d4afc2e35afc12a2c3b34c84e71f78ea20af4ba3
    container_name: ai-ollama-pull
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - waddlebot-internal
    environment:
      OLLAMA_HOST: http://ai-ollama:11434
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Waiting for Ollama server..."
        sleep 10
        # Use ollama list to check if server is ready (retries built-in)
        until ollama list 2>/dev/null; do
          echo "Ollama not ready, retrying..."
          sleep 5
        done
        echo "Ollama server ready, pulling tinyllama..."
        ollama pull tinyllama
        echo "tinyllama model ready!"
    depends_on:
      - ai-ollama
    restart: "no"

  # Qdrant vector database for AI memory and research
  infra-qdrant:
    image: qdrant/qdrant:v1.12.3@sha256:283ccc6ee271237b43bfd7b995752f4cbb7a63a11ab68add3ee3bb1137bdafa7
    container_name: infra-qdrant
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - waddlebot-internal
    # Port removed - internal only, accessed by ai-researcher
    # ports:
    #   - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # SearXNG metasearch engine for Game Lookup sub-module
  infra-searxng:
    image: searxng/searxng:latest@sha256:a98723bfb01fb3b8b18a9e33890184b91d270b3fb51f75875a0ad1908ce7b463
    container_name: infra-searxng
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - waddlebot-internal
    # Port exposed for local development/testing only
    ports:
      - "8888:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Apache OpenWhisk standalone for testing serverless actions
  # NOTE: Disabled on ARM64 - openwhisk/standalone:nightly lacks native ARM64 support
  # x86_64 emulation on ARM64 (linux/amd64) fails with exit code 255 (platform mismatch)
  # Enable this service only on native amd64 systems
  # openwhisk:
  #   image: openwhisk/standalone:nightly
  #   container_name: waddlebot-openwhisk
  #   platform: linux/amd64
  #   ports:
  #     - "3233:3233"   # OpenWhisk API
  #   environment:
  #     JAVA_OPTS: "-Xmx1g"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   networks:
  #     - waddlebot-public
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:3233/api/v1"]
  #     interval: 30s
  #     timeout: 10s
  #     start_period: 120s
  #     retries: 10
  #   restart: unless-stopped

  # =============================================================================
  # CORE MODULES
  # =============================================================================

  core-router:
    build:
      context: .
      dockerfile: processing/router_module/Dockerfile
    container_name: core-router
    environment:
      MODULE_NAME: router
      MODULE_PORT: 8000
      # Router module uses component-based DB config
      DATABASE_HOST: infra-postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: waddlebot
      DATABASE_USER: mod_router
      DATABASE_PASSWORD: ${DB_PASS_ROUTER:-mod_router_dev_changeme}
      READ_REPLICA_HOST: infra-postgres-replica
      READ_REPLICA_PORT: 5432
      # Redis configuration
      REDIS_HOST: infra-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_ROUTER_PASSWORD:-changeme}
      REDIS_KEY_PREFIX: "router:"
      JWT_SECRET: ${JWT_SECRET:-changeme_jwt_secret}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Client only -- core-router dials every action/core module's gRPC server.
      GRPC_TLS_CA_PATH: /certs/grpc/ca.crt
      GRPC_TLS_CLIENT_CERT_PATH: /certs/grpc/client.crt
      GRPC_TLS_CLIENT_KEY_PATH: /certs/grpc/client.key
    volumes:
      - ./certs/grpc-dev:/certs/grpc:ro
    networks:
      - waddlebot-internal
    depends_on:
      infra-postgres:
        condition: service_healthy
      # READ_REPLICA_HOST points here unconditionally (below); without this,
      # core-router races the replica's base-backup+WAL-replay (60-90s+,
      # longer than the primary's own startup) and its AsyncDAL read_dal
      # connection fails 5x and crash-loops on the very first boot. It does
      # self-heal via restart:unless-stopped once the replica catches up,
      # but that's a flaky-looking failed health check on every fresh
      # deploy, not a real steady-state problem -- worth removing the race.
      infra-postgres-replica:
        condition: service_healthy
      infra-redis:
        condition: service_healthy
      db-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # marketplace service removed - functionality now in hub admin panel

  hub-api:
    build:
      context: .
      dockerfile: admin/hub_module/Dockerfile
    container_name: hub-api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8060
      # config/postgres/migrations/*.sql (run by db-migrations) owns the schema.
      # Without this, index.js::initializeDatabase() unconditionally runs
      # CREATE TABLE/INDEX IF NOT EXISTS against tables hub_admin doesn't
      # OWN (034_module_db_accounts.sql grants privileges, not ownership) --
      # e.g. `CREATE INDEX ... ON hub_chat_messages` 500s with
      # "must be owner of table hub_chat_messages" and crash-loops the
      # container before it ever binds its HTTP port.
      SKIP_DB_INIT: "true"
      # Forward-compatible with admin/hub_module/backend/src/utils/adminBootstrap.js
      # in case SKIP_DB_INIT is ever unset -- see db-migrations above for
      # the actual (currently live) bootstrap path and its security note.
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@localhost.local}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-WaddleDev-Local-Only-2026!}
      DATABASE_URL: postgresql://hub_admin:${DB_PASS_HUB_ADMIN:-hub_admin_dev_changeme}@infra-postgres:5432/waddlebot
      # Redis ACL: user=hub, prefix=hub:*, waddlebot:session:*, waddlebot:auth:*
      REDIS_URL: redis://hub:${REDIS_HUB_PASSWORD:-changeme}@infra-redis:6379/0
      REDIS_KEY_PREFIX: "hub:"
      JWT_SECRET: ${JWT_SECRET:-changeme_jwt_secret}
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      # OAuth Configuration
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      # Internal service URLs
      ROUTER_API_URL: http://core-router:8000
      IDENTITY_API_URL: http://core-identity:8050
      INVENTORY_API_URL: http://interactive-inventory:8024
      REPUTATION_API_URL: http://core-reputation:8021
      CALENDAR_API_URL: http://interactive-calendar:8030
      MEMORIES_API_URL: http://interactive-memories:8031
      LABELS_API_URL: http://core-labels:8023
      SHOUTOUT_API_URL: http://interactive-shoutout:8011
      BROWSER_SOURCE_API_URL: http://core-browser-source:8027
      LOYALTY_API_URL: http://interactive-loyalty:8032
      # Overlay Configuration
      OVERLAY_BASE_URL: ${OVERLAY_BASE_URL:-http://localhost:8027}
      # S3 Storage Configuration (SeaweedFS)
      S3_STORAGE_ENABLED: "true"
      S3_BUCKET_NAME: waddlebot-assets
      S3_ENDPOINT_URL: http://infra-seaweedfs:8333
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-waddlebot}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-waddlebot-dev-secret}
      S3_PUBLIC_BASE_URL: http://localhost:8333/waddlebot-assets
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8060:8060"  # Hub admin portal
    networks:
      - waddlebot-public
      - waddlebot-internal
    depends_on:
      infra-postgres:
        condition: service_healthy
      infra-redis:
        condition: service_healthy
      infra-seaweedfs:
        condition: service_healthy
      db-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8060/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  hub-webui:
    build:
      context: .
      dockerfile: admin/hub_module/Dockerfile.webui
    container_name: hub-webui
    environment:
      PORT: 8080
      HUB_API_URL: http://hub-api:8060
    ports:
      - "3000:8080"  # Hub WebUI (Express static + /api proxy, never nginx)
    networks:
      - waddlebot-public
      - waddlebot-internal
    depends_on:
      hub-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 5
    restart: unless-stopped

  # =============================================================================
  # COLLECTOR MODULES (Internal)
  # =============================================================================

  trigger-twitch:
    build:
      context: .
      dockerfile: trigger/receiver/twitch_module/Dockerfile
    container_name: trigger-twitch
    environment:
      MODULE_NAME: twitch-collector
      MODULE_PORT: 8002
      DATABASE_URL: postgresql://twitch_trigger:mod_twitch_trigger_dev_changeme@infra-postgres:5432/waddlebot
      SECRETS_BACKEND: kubernetes
      SECRETS_PATH: /secrets/db-passwords
      ROUTER_API_URL: http://core-router:8000
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      TWITCH_WEBHOOK_SECRET: ${TWITCH_WEBHOOK_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RELEASE_MODE: ${RELEASE_MODE:-false}
    networks:
      - waddlebot-internal
    depends_on:
      - core-router
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  trigger-discord:
    build:
      context: .
      dockerfile: trigger/receiver/discord_module/Dockerfile
    container_name: trigger-discord
    environment:
      MODULE_NAME: discord-collector
      MODULE_PORT: 8003
      DATABASE_URL: postgresql://discord_trigger:mod_discord_trigger_dev_changeme@infra-postgres:5432/waddlebot
      SECRETS_BACKEND: kubernetes
      SECRETS_PATH: /secrets/db-passwords
      ROUTER_API_URL: http://core-router:8000
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RELEASE_MODE: ${RELEASE_MODE:-false}
    networks:
      - waddlebot-internal
    depends_on:
      - core-router
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  trigger-slack:
    build:
      context: .
      dockerfile: trigger/receiver/slack_module/Dockerfile
    container_name: trigger-slack
    environment:
      MODULE_NAME: slack-collector
      MODULE_PORT: 8004
      DATABASE_URL: postgresql://slack_trigger:mod_slack_trigger_dev_changeme@infra-postgres:5432/waddlebot
      SECRETS_BACKEND: kubernetes
      SECRETS_PATH: /secrets/db-passwords
      ROUTER_API_URL: http://core-router:8000
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RELEASE_MODE: ${RELEASE_MODE:-false}
    networks:
      - waddlebot-internal
    depends_on:

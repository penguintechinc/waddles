      DATABASE_URL: postgresql://mod_core_reputation:${DB_PASS_CORE_REPUTATION:-mod_core_reputation_dev_changeme}@infra-postgres:5432/waddlebot
      SECRETS_BACKEND: kubernetes
      SECRETS_PATH: /secrets/db-passwords
      ROUTER_API_URL: http://core-router:8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RELEASE_MODE: ${RELEASE_MODE:-false}
      GRPC_TLS_CERT_PATH: /certs/grpc/server.crt
      GRPC_TLS_KEY_PATH: /certs/grpc/server.key
      GRPC_TLS_CA_PATH: /certs/grpc/ca.crt
      GRPC_TLS_REQUIRE_CLIENT_CERT: "true"
    volumes:
      - ./certs/grpc-dev:/certs/grpc:ro
    networks:
      - waddlebot-internal
    depends_on:
      - core-router
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8021/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped


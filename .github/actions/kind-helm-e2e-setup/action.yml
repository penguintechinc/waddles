name: "kind + Helm v4 cluster with waddlebot images"
description: >
  Installs kind (checksum-verified) and Helm v4, creates a kind cluster,
  and builds + kind-loads the waddlebot service images. Shared by
  helm-chart-e2e.yml (both the fresh-install and upgrade-path jobs) and
  live-discord-e2e.yml so the version pins, checksum, and image list live
  in exactly one place.

inputs:
  cluster-name:
    description: "kind cluster name"
    required: true
  image-tag:
    description: "tag applied to every built image"
    required: false
    default: "ci"
  kind-version:
    description: "kind release to install"
    required: false
    default: "v0.30.0"
  kind-node-image:
    description: "kindest/node image, pinned by digest"
    required: false
    default: "kindest/node@sha256:7416a61b42b1662ca6ca89f02028ac133a309a2a30ba309614e8ec94d976dc5a" # v1.34.0
  kind-checksum:
    description: "sha256 of the linux-amd64 kind binary for kind-version"
    required: false
    default: "517ab7fc89ddeed5fa65abf71530d90648d9638ef0c4cde22c2c11f8097b8889"
  helm-version:
    description: "Helm version to install"
    required: false
    default: "v4.0.0"

runs:
  using: "composite"
  steps:
    - name: Install kind (checksum-verified)
      shell: bash
      env:
        KIND_VERSION: ${{ inputs.kind-version }}
        KIND_CHECKSUM: ${{ inputs.kind-checksum }}
      run: |
        set -euo pipefail
        curl -fsSL -o /usr/local/bin/kind \
          "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
        echo "${KIND_CHECKSUM}  /usr/local/bin/kind" | sha256sum -c -
        chmod +x /usr/local/bin/kind
        kind version

    - name: Install Helm v4
      shell: bash
      env:
        HELM_VERSION: ${{ inputs.helm-version }}
      run: |
        set -euo pipefail
        curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        chmod +x get_helm.sh
        DESIRED_VERSION="${HELM_VERSION}" ./get_helm.sh
        rm -f get_helm.sh
        helm version

    - name: Create kind cluster
      shell: bash
      env:
        CLUSTER_NAME: ${{ inputs.cluster-name }}
        KIND_NODE_IMAGE: ${{ inputs.kind-node-image }}
      run: |
        set -euo pipefail
        kind create cluster --name "${CLUSTER_NAME}" --image "${KIND_NODE_IMAGE}" --wait 120s

    - name: Build + kind-load images
      shell: bash
      env:
        CLUSTER_NAME: ${{ inputs.cluster-name }}
        IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        set -euo pipefail
        declare -a IMAGES=(
          "waddlebot-migrations:migrations/Dockerfile:."
          "waddlebot-hub-api:hub_api/Dockerfile:hub_api"
          "core-bundle-seeder:bundles/Dockerfile.core-bundles:."
          "svc-ingest-rust:core/svc_ingest/Dockerfile.rust:."
          "svc-process-rust:core/svc_process/Dockerfile.rust:."
          "svc-action-rust:core/svc_action/Dockerfile.rust:."
        )
        built=0
        for entry in "${IMAGES[@]}"; do
          IFS=":" read -r name dockerfile context <<< "${entry}"
          echo "::group::build ${name}:${IMAGE_TAG}"
          docker build -f "${dockerfile}" -t "${name}:${IMAGE_TAG}" "${context}"
          kind load docker-image "${name}:${IMAGE_TAG}" --name "${CLUSTER_NAME}"
          built=$((built + 1))
          echo "::endgroup::"
        done
        echo "images built and loaded: ${built}"
        if [ "${built}" -eq 0 ]; then
          echo "::error::zero images built - denominator check failed"
          exit 1
        fi

name: Setup build deps (verify, apt-install only if missing)
description: >-
  Verifies the C/C++ toolchain + cmake (needed by ring / aws-lc-sys) and
  optionally installs a sha256-pinned protoc (needed by hub_client's build.rs).
  GitHub-hosted ubuntu runners preinstall the toolchain, so nothing is
  installed there. The bare self-hosted dal2-alpha-ci ARC image ships none of
  it, so any missing tool is installed once via `sudo apt-get` (distro-signed
  repo; exact versions float with the distro security channel). The step then
  re-verifies and fails loudly if a tool is still missing.

inputs:
  packages:
    description: >-
      Space-separated apt package names. Known: cmake, build-essential,
      protobuf-compiler, pkg-config, libssl-dev, libatomic1 (node), unzip;
      any other name FAILS the step (never ignored).
    required: false
    default: 'cmake build-essential protobuf-compiler'

runs:
  using: composite
  steps:
    - name: Resolve requested packages and verify preinstalled tools
      id: resolve
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        set -euo pipefail
        tools=""
        apt=""
        protoc=false
        for p in $PACKAGES; do
          case "$p" in
            cmake) tools="$tools cmake"; apt="$apt cmake" ;;
            build-essential) tools="$tools gcc g++ make"; apt="$apt build-essential" ;;
            pkg-config) tools="$tools pkg-config"; apt="$apt pkg-config" ;;
            unzip) tools="$tools unzip"; apt="$apt unzip" ;;
            libssl-dev) tools="$tools openssl"; apt="$apt libssl-dev openssl" ;;
            libatomic1) apt="$apt libatomic1" ;;
            protobuf-compiler) protoc=true; apt="$apt unzip"; tools="$tools unzip" ;;
            *) echo "setup-build-deps: unknown package '$p' -- add explicit support (verified preinstalled tool or sha256-pinned download); refusing to ignore it" >&2; exit 1 ;;
          esac
        done
        echo "protoc=$protoc" >> "$GITHUB_OUTPUT"
        # Install only what is absent (no-op on hosted runners).
        need=0
        for t in $tools; do command -v "$t" >/dev/null 2>&1 || need=1; done
        for a in $apt; do
          case "$a" in
            libatomic1) [ -e /usr/lib/x86_64-linux-gnu/libatomic.so.1 ] || [ -e /usr/lib/aarch64-linux-gnu/libatomic.so.1 ] || need=1 ;;
            libssl-dev) [ -e /usr/include/openssl/ssl.h ] || need=1 ;;
          esac
        done
        if [ "$need" = 1 ]; then
          SUDO=""
          if [ "$(id -u)" != 0 ]; then
            sudo -n true || { echo "::error::tools missing and passwordless sudo unavailable" >&2; exit 1; }
            SUDO="sudo -n"
          fi
          $SUDO apt-get update -o Acquire::Retries=5
          $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends -o Acquire::Retries=5 $apt
        fi
        missing=0
        for t in $tools; do
          if command -v "$t" >/dev/null 2>&1; then
            echo "found $t: $(command -v "$t")"
          else
            echo "MISSING required build tool: $t" >&2
            missing=1
          fi
        done
        exit "$missing"

    - name: Install pinned protoc (sha256-verified)
      if: steps.resolve.outputs.protoc == 'true'
      shell: bash
      env:
        PROTOC_VERSION: '31.1'
        PROTOC_SHA256_X86_64: 96553041f1a91ea0efee963cb16f462f5985b4d65365f3907414c360044d8065
        PROTOC_SHA256_AARCH64: 6c554de11cea04c56ebf8e45b54434019b1cd85223d4bbd25c282425e306ecc2
      run: |
        set -euo pipefail
        case "$(uname -m)" in
          x86_64)  arch=linux-x86_64;  sha="$PROTOC_SHA256_X86_64" ;;
          aarch64) arch=linux-aarch_64; sha="$PROTOC_SHA256_AARCH64" ;;
          *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
        esac
        dest="${RUNNER_TEMP}/protoc-${PROTOC_VERSION}"
        mkdir -p "$dest"
        zip="${RUNNER_TEMP}/protoc-${PROTOC_VERSION}.zip"
        curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
          --connect-timeout 15 --max-time 120 -o "$zip" \
          "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-${arch}.zip"
        echo "${sha}  ${zip}" | sha256sum --check --strict -
        unzip -q -o "$zip" -d "$dest"
        chmod +x "$dest/bin/protoc"
        "$dest/bin/protoc" --version
        echo "$dest/bin" >> "$GITHUB_PATH"
        echo "PROTOC=$dest/bin/protoc" >> "$GITHUB_ENV"
        echo "PROTOC_INCLUDE=$dest/include" >> "$GITHUB_ENV"

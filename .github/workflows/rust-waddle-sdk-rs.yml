name: Rust waddle-sdk-rs (lint + test)

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'sdk/waddle-sdk-rs/**'
      - 'bundles/rust/example/**'
      - 'wit/waddle-bundle/**'
      - '.github/workflows/rust-waddle-sdk-rs.yml'
      - '.github/workflows/rust-crate-ci.yml'
  pull_request:
    branches: [main, 'release/**']
    paths:
      - 'sdk/waddle-sdk-rs/**'
      - 'bundles/rust/example/**'
      - 'wit/waddle-bundle/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    name: fmt + clippy + deny + coverage
    uses: ./.github/workflows/rust-crate-ci.yml
    with:
      crate_name: waddle-sdk-rs
      working_directory: sdk/waddle-sdk-rs
      # bindings_glue.rs and every capability module's actual host-call fn
      # are #[cfg(target_arch = "wasm32")]-only -- absent entirely from
      # this host build, so no coverage carve-out needed here (unlike
      # svc_process's main.rs). See sdk/waddle-sdk-rs/README.md
      # "Coverage carve-out".

  # Structurally distinct from the shared lint-test pipeline (wasm32
  # target, cargo-component, wasm-tools) -- kept as its own job rather
  # than folded into rust-crate-ci.yml's inputs.
  example-bundle-component:
    name: example bundle -> WASI 0.2 component (cargo-component + wasm-tools)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bundles/rust/example
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust 1.97.1 + wasm32 targets
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable branch snapshot
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
          targets: wasm32-wasip2, wasm32-wasip1

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy --target wasm32-wasip2 --all-targets --locked -- -D warnings
        run: cargo clippy --target wasm32-wasip2 --all-targets --locked -- -D warnings

      - name: Install cargo-deny
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375  # v2.87.12
        with:
          tool: cargo-deny@0.20.2

      - name: cargo deny check (advisories, licenses, bans, sources)
        run: cargo deny check

      # cargo-component and wasm-tools have no taiki-e/install-action
      # binstall-style entry verified working for this repo's toolchain,
      # so this installs from source at the exact versions this SDK was
      # proven against in this session and by
      # spikes/bundle-compiler-sandbox (branch
      # spike/bundle-compiler-sandbox, docker/rust.Dockerfile -- Rust
      # built there in 0.40s). `--locked` pins every transitive dependency
      # via each tool's own committed Cargo.lock. This costs a few
      # minutes of CI time; that is a deliberate, verified-working choice
      # over guessing at a prebuilt-binary tool name for either crate.
      - name: Install cargo-component 0.21.1 + wasm-tools 1.259.0 (pinned, --locked)
        run: |
          cargo install cargo-component --version 0.21.1 --locked
          cargo install wasm-tools --version 1.259.0 --locked

      - name: cargo component build --target wasm32-wasip2
        run: cargo component build --target wasm32-wasip2

      - name: wasm-tools validate (real component, not just a core module)
        run: wasm-tools validate target/wasm32-wasip2/debug/waddle_bundle_example_rust.wasm

      - name: wasm-tools component wit (WIT conformance round-trip)
        # Asserts the built component exports exactly the two interfaces
        # the normative wit/waddle-bundle/stage.wit world declares
        # (`export process-stage; export action-stage;`) -- not a bare
        # function export, and not a subset/superset of the world's
        # exports. Mirrors the manual verification done when
        # sdk/waddle-sdk-rs and this example were first built (see PR
        # description).
        run: |
          set -euo pipefail
          out=target/wasm32-wasip2/debug/waddle_bundle_example_rust.wasm
          wit_text="$(wasm-tools component wit "$out")"
          echo "$wit_text"
          echo "$wit_text" | grep -qF 'export waddle:bundle/process-stage@1.0.0;'
          echo "$wit_text" | grep -qF 'export waddle:bundle/action-stage@1.0.0;'

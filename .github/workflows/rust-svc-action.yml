name: Rust svc-action (lint + test)

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'core/svc_action/**'
      - 'core/bundle_host_kv/**'
      - 'core/bundle_capability_gate/**'
      - 'core/hub_client/**'
      - 'core/egress_detokenizer/**'
      - '.github/workflows/rust-svc-action.yml'
      - '.github/workflows/rust-crate-ci.yml'
  pull_request:
    branches: [main, 'release/**']
    paths:
      - 'core/svc_action/**'
      - 'core/bundle_host_kv/**'
      - 'core/bundle_capability_gate/**'
      - 'core/hub_client/**'
      - 'core/egress_detokenizer/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-test:
    name: fmt + clippy + deny + coverage
    uses: ./.github/workflows/rust-crate-ci.yml
    with:
      crate_name: svc-action
      working_directory: core/svc_action
      # ring needs a C compiler to build its crypto primitives; protoc is
      # needed by hub_client's build.rs (tonic-prost-build).
      extra_apt_packages: build-essential protobuf-compiler
      extra_apt_reason: 'for ring (C compiler) + hub_client (protoc)'

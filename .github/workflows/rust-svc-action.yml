name: Rust svc-action (lint + test)

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'core/svc_action/**'
      - '.github/workflows/rust-svc-action.yml'
      - '.github/workflows/rust-crate-ci.yml'
  pull_request:
    branches: [main, 'release/**']
    paths:
      - 'core/svc_action/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    name: fmt + clippy + deny + coverage
    uses: ./.github/workflows/rust-crate-ci.yml
    with:
      crate_name: svc-action
      working_directory: core/svc_action
      # ring needs a C compiler to build its crypto primitives.
      extra_apt_packages: build-essential
      extra_apt_reason: 'for ring (C compiler)'

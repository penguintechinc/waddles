name: Rust bundle-compiler (lint + test)

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'core/bundle_compiler/**'
      - '.github/workflows/rust-bundle-compiler.yml'
      - '.github/workflows/rust-crate-ci.yml'
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path gate (release PRs only): shared detector, fails closed. A job skipped
  # here means "not affected"; main PRs / pushes / dispatch run everything.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      match: ${{ steps.paths.outputs.match }}
    steps:
      - name: Checkout (change classifier only)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: |
            scripts/ci
            .github/actions
      - name: Classify changed paths
        id: paths
        uses: ./.github/actions/changed-paths
        with:
          area: rust
          globs: |
            core/bundle_compiler/**

  lint-test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.match == 'true') }}
    name: fmt + clippy + deny + audit + coverage
    uses: ./.github/workflows/rust-crate-ci.yml
    with:
      crate_name: bundle-compiler
      working_directory: core/bundle_compiler
      # Includes the D34-ordered scan-pipeline suite (manifest validation
      # -> legacy-DAL import check -> SAST/secrets/dependency-audit ->
      # Skauswatch, strictly before any per-language builder runs) --
      # tests/build_orchestration_test.rs, tests/scan_test.rs,
      # tests/legacy_dal_test.rs, tests/skauswatch_test.rs -- so this
      # crate alone needs cargo-audit/gitleaks/pip-audit installed for
      # local dev/production parity.
      extra_security_scanners: true
      # CSharpBuilder::build (and its wasm-tools-dependent validate_component
      # helper) shells out to a real `docker build`/`docker run` against a
      # containerized .NET 10 SDK + NativeAOT-LLVM toolchain (multi-minute
      # NuGet restore, real network access) -- see `build/csharp.rs`'s own
      # module doc comment. That is exactly the docker+network dependency
      # its `builds_csping_via_docker` test is `#[ignore]`d for (runnable via
      # `make test-csharp-bundle-compile`, never in this crate's own
      # unit-test CI job), so it cannot be covered here the same way
      # `main.rs`'s CLI wiring is excluded in rust-svc-process.yml. Every
      # other function in the file (`run_docker`, `copy_dir_recursive`,
      # `run_id_arg`, `current_uid_gid`) IS unit-tested without docker.
      coverage_ignore_regex: 'build/csharp\.rs'

name: Build community

on:
  push:
    branches: [main, 'v*', 'release/**', 'feature/**', 'fix/**', 'chore/**', 'hotfix/**', 'docs/**', 'refactor/**']
    paths:
      - 'core/community_module/**'
      - 'libs/flask_core/**'
      - '.version'
      - '.github/workflows/build-community.yml'
      - '.github/workflows/build-container.yml'
  pull_request:
    branches: [main, 'v*', 'release/**', 'feature/**', 'fix/**', 'chore/**', 'hotfix/**', 'docs/**', 'refactor/**']
    paths:
      - 'core/community_module/**'
      - 'libs/flask_core/**'
  merge_group:
    types: [checks_requested]
    branches: ['release/**']
  workflow_dispatch:


permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build community Container
    uses: ./.github/workflows/build-container.yml
    with:
      module_path: 'core/community_module'
      module_name: 'community'
      module_port: '8053'
    secrets: inherit

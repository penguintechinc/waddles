name: Rust Crate CI (Reusable)

# Shared fmt + clippy + cargo-deny + test + coverage pipeline for every
# Rust crate/service in this repo. Consolidates the near-identical
# rust-*.yml caller workflows so a toolchain/tool version bump, or a
# security fix like `persist-credentials: false`, only needs to change
# here instead of in every caller.

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''
        description: 'Ref to check out (empty = the triggering ref)'
      crate_name:
        required: true
        type: string
        description: 'Display name for job/step titles (e.g., svc-action)'
      working_directory:
        required: true
        type: string
        description: 'Path to the crate directory (e.g., core/svc_action)'
      extra_apt_packages:
        required: false
        type: string
        default: ''
        description: 'Space-separated apt packages needed before building (e.g., "cmake build-essential")'
      extra_apt_reason:
        required: false
        type: string
        default: ''
        description: 'Short reason shown in the step name (e.g., "for aws-lc-sys (cmake, C/C++ toolchain)")'
      extra_security_scanners:
        required: false
        type: boolean
        default: false
        description: 'Also install cargo-audit + gitleaks + pip-audit alongside cargo-deny/llvm-cov (bundle-compiler)'
      release_build:
        required: false
        type: boolean
        default: false
        description: 'Run `cargo build --release --locked` before tests (proves a pinned git dependency resolves cleanly)'
      coverage_ignore_regex:
        required: false
        type: string
        default: ''
        description: 'Passed to `cargo llvm-cov --ignore-filename-regex` (e.g., a thin binary entrypoint carve-out)'
      valkey:
        required: false
        type: boolean
        default: false
        description: 'Start a real Valkey container and export VALKEY_URL for the crate tests (lease/real-socket tests fail loudly without it, by design)'
      postgres:
        required: false
        type: boolean
        default: false
        description: 'Start a real Postgres container and export TEST_DATABASE_URL (owner credential, CI-only) for the crate tests; they fail loudly without it'

permissions:
  contents: read

jobs:
  lint-test:
    name: "${{ inputs.crate_name }}: fmt + clippy + deny + coverage"
    # bare dal2-alpha-ci image has no cc/cmake/libatomic and sudo is blocked (no-new-privileges): C-toolchain / node jobs stay on hosted ubuntu-latest until a custom runner image bakes them in
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # sccache gives every crate a shared compilation cache on the GitHub
      # Actions cache backend: common deps (tokio/tonic/serde) compile once and
      # are reused by all ~25 callers instead of being recompiled and stored in
      # a per-crate `target/` cache. Those per-crate target caches summed to
      # ~21GB against GitHub's 10GB/repo limit and evicted constantly, so every
      # run started cold. The target/ path is dropped from the actions/cache
      # step below; sccache now owns compilation caching.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      # sccache cannot cache incremental-compilation artifacts and CI builds
      # gain nothing from incremental anyway; disabling it is what lets sccache
      # actually populate (otherwise rustc emits non-cacheable incremental units).
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup build deps (${{ inputs.extra_apt_reason }})
        if: inputs.extra_apt_packages != ''
        uses: ./.github/actions/setup-build-deps
        with:
          packages: ${{ inputs.extra_apt_packages }}
      - name: Install Rust 1.97.1 (rustfmt, clippy, llvm-tools-preview)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable branch snapshot
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy, llvm-tools-preview

      # Shared compilation cache (GitHub Actions cache backend via
      # SCCACHE_GHA_ENABLED). Deduplicates dependency compiles across every
      # crate, so the common dep tree is stored once instead of ~25 times.
      - name: Set up sccache (GitHub Actions cache backend)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11

      # Cargo registry + git caches only (NO target/ -- sccache above owns
      # compilation caching now). Keyed per crate + toolchain + Cargo.lock so a
      # dependency change gets a fresh entry; restore-keys fall back to the
      # newest cache for the same crate/toolchain. These are small (downloaded
      # .crate sources + git deps), so they no longer blow the 10GB/repo limit
      # the way the old per-crate target/ caches did. A cache miss only costs
      # time, never correctness (all cargo steps still run with --locked).
      - name: Cache cargo registry + git
        if: github.event_name != 'merge_group'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809  # v4.2.4  # zizmor: ignore[cache-poisoning]
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ inputs.crate_name }}-1.97.1-${{ runner.os }}-${{ hashFiles(format('{0}/Cargo.lock', inputs.working_directory)) }}
          restore-keys: |
            cargo-${{ inputs.crate_name }}-1.97.1-${{ runner.os }}-

      - name: Restore-only cargo cache (merge_group refs never save; avoids evicting real cache)
        if: github.event_name == 'merge_group'
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809  # v4.2.4  # zizmor: ignore[cache-poisoning]
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ inputs.crate_name }}-1.97.1-${{ runner.os }}-${{ hashFiles(format('{0}/Cargo.lock', inputs.working_directory)) }}
          restore-keys: |
            cargo-${{ inputs.crate_name }}-1.97.1-${{ runner.os }}-

      - name: Install cargo-deny + cargo-llvm-cov
        if: ${{ !inputs.extra_security_scanners }}
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375  # v2.87.12
        with:
          tool: cargo-deny@0.20.2,cargo-llvm-cov@0.9.1

      - name: Install cargo-deny + cargo-llvm-cov + cargo-audit
        if: inputs.extra_security_scanners
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375  # v2.87.12
        with:
          tool: cargo-deny@0.20.2,cargo-llvm-cov@0.9.1,cargo-audit@0.21.0

      # gitleaks is not a cargo tool -- pinned release binary, checksum
      # verified against the upstream published checksums file, matching
      # this repo's pre-commit gitleaks pin (rev v8.21.2 in
      # .pre-commit-config.yaml) so local and CI results agree.
      - name: Install gitleaks 8.21.2 (checksum verified)
        if: inputs.extra_security_scanners
        run: |
          set -euo pipefail
          curl -sLo /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      # pip-audit/cargo-audit/gitleaks are installed for local dev/production
      # parity with the compiler's own container image
      # (build/tool-versions.env), not because cargo test's own suite
      # invokes them for real: every scan::sast dependency-audit test
      # uses a fixture stub instead (tests/fixtures/bin/*-audit-stub-*.sh)
      # so results never depend on CI's network access to the
      # RustSec/PyPI/npm advisory feeds -- see tests/scan_test.rs's own
      # module doc comment.
      - name: Install pip-audit 2.10.0
        if: inputs.extra_security_scanners
        run: pip install --no-cache-dir pip-audit==2.10.0

      # A REAL Valkey for crates whose tests exercise a real lease/stream (svc-ingest's
      # per-community Twitch sessions). The tests FAIL (never skip) when VALKEY_URL is unset,
      # so a failed start here fails the job. Same digest as the chart's Valkey image.
      - name: Start Valkey (VALKEY_URL for crate tests)
        if: inputs.valkey
        run: |
          set -euo pipefail
          docker run -d --name ci-valkey -p 127.0.0.1:6379:6379 \
            valkey/valkey:8-bookworm@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
          for i in $(seq 1 30); do
            if docker exec ci-valkey valkey-cli ping | grep -q PONG; then
              echo "VALKEY_URL=redis://127.0.0.1:6379" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo "valkey did not become ready" >&2
          exit 1

      # A REAL Postgres for crates with real-DB tests (svc-ingest's egress display-name
      # resolver). The tests FAIL (never skip) when TEST_DATABASE_URL is unset. Throwaway CI-only
      # credential on a loopback-bound container.
      - name: Start Postgres (TEST_DATABASE_URL for crate tests)
        if: inputs.postgres
        run: |
          set -euo pipefail
          docker run -d --name ci-postgres -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=ci \
            postgres:17-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
          for i in $(seq 1 60); do
            if docker exec ci-postgres pg_isready -h 127.0.0.1 -U ci -d ci >/dev/null 2>&1; then
              echo "TEST_DATABASE_URL=postgresql://ci:ci@127.0.0.1:5432/ci" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo "postgres did not become ready" >&2
          exit 1

      - name: cargo fmt --check
        run: cargo fmt --check

      # clippy (check-only, clippy-driver) and llvm-cov (instrumented codegen
      # via rustc under -Cinstrument-coverage) genuinely cannot share compiled
      # artifacts: different driver AND different RUSTFLAGS, and collapsing them
      # would mean dropping either clippy's -D warnings gate or coverage
      # instrumentation. They are left as two steps. The repeated dependency
      # compile they caused is now recovered by sccache (env above): each
      # distinct (flags, driver) compile is cached once and reused across runs
      # and across crates, so the second pass is cache hits rather than a cold
      # rebuild of the dep tree.
      - name: cargo clippy --all-targets --locked -- -D warnings
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo deny check (advisories, licenses, bans, sources)
        run: cargo deny check

      # Proves a pinned git dependency (spec SS4.5/SS6.6) resolves and
      # builds from a clean clone with no local sibling checkout anywhere
      # on this runner. `--locked` additionally asserts Cargo.lock is
      # fully up to date with Cargo.toml.
      - name: cargo build --release --locked (proves the git dep resolves)
        if: inputs.release_build
        run: cargo build --release --locked

      - name: cargo llvm-cov --locked (>=90% line coverage gate)
        env:
          COVERAGE_IGNORE_REGEX: ${{ inputs.coverage_ignore_regex }}
        run: |
          set -euo pipefail
          if [ -n "$COVERAGE_IGNORE_REGEX" ]; then
            cargo llvm-cov --locked --fail-under-lines 90 --ignore-filename-regex "$COVERAGE_IGNORE_REGEX"
          else
            cargo llvm-cov --locked --fail-under-lines 90
          fi

      # Hit-rate visibility: prints compile requests vs cache hits so a
      # regression in cache effectiveness (e.g. an env/flag change that stops
      # sccache populating) is obvious in the job log. Never fails the job.
      - name: sccache stats
        if: always()
        run: sccache --show-stats

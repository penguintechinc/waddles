name: CI Gate

# Aggregate merge-queue gate for release/* branches.
#
# GitHub's native merge queue only requires checks that report on the
# merge_group event; workflows without that trigger, or path-filtered
# workflows that don't run for every commit, would otherwise block the
# queue forever. This job is the single always-running required check:
# it polls the Checks/Status APIs for every *other* check on the same
# head SHA and passes only once at least one other check was examined,
# none of them failed, and the set has stayed stable (no pending checks)
# across two consecutive polls - so late-starting checks can't sneak past.

on:
  pull_request:
    branches: ['release/**']
  merge_group:
    branches: ['release/**']

permissions:
  contents: read # required to resolve the head commit ref
  checks: read # to list other check-runs on the head SHA via the Checks API
  statuses: read # to list classic commit statuses (e.g. submit-queue) on the head SHA

concurrency:
  group: ci-gate-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Wait for all other checks on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          SELF_NAME: ci-gate
          IGNORE_CONTEXT: submit-queue
          POLL_INTERVAL_SECONDS: "30"
          MAX_POLLS: "180"
        run: |
          set -euo pipefail

          stable_count=0
          prev_signature=""

          for attempt in $(seq 1 "${MAX_POLLS}"); do
            runs_json=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs" --paginate \
              --jq '[.check_runs[] | select(.name != env.SELF_NAME and .name != env.IGNORE_CONTEXT) | {name: .name, status: .status, conclusion: .conclusion}]')

            statuses_json=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/status" \
              --jq '[.statuses[] | select(.context != env.IGNORE_CONTEXT) | {name: .context, status: (if .state == "pending" then "in_progress" else "completed" end), conclusion: (if .state == "success" then "success" elif (.state == "failure" or .state == "error") then "failure" else .state end)}]')

            combined=$(jq -n --argjson a "${runs_json}" --argjson b "${statuses_json}" '$a + $b')
            examined=$(jq 'length' <<<"${combined}")

            if [ "${examined}" -eq 0 ]; then
              echo "[attempt ${attempt}/${MAX_POLLS}] no other checks reported yet for ${HEAD_SHA} - waiting"
              stable_count=0
              prev_signature=""
              sleep "${POLL_INTERVAL_SECONDS}"
              continue
            fi

            failed=$(jq '[.[] | select(.status == "completed" and (.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "action_required"))]' <<<"${combined}")
            failed_count=$(jq 'length' <<<"${failed}")

            if [ "${failed_count}" -gt 0 ]; then
              echo "::error::ci-gate FAIL - ${failed_count} of ${examined} examined check(s) did not succeed:"
              jq -r '.[] | "  - " + .name + ": " + (.conclusion // .status)' <<<"${failed}"
              exit 1
            fi

            pending=$(jq '[.[] | select(.status != "completed")] | length' <<<"${combined}")

            if [ "${pending}" -gt 0 ]; then
              echo "[attempt ${attempt}/${MAX_POLLS}] ${pending} of ${examined} examined check(s) still pending - waiting"
              stable_count=0
              prev_signature=""
              sleep "${POLL_INTERVAL_SECONDS}"
              continue
            fi

            signature=$(jq -Sc 'map({name, conclusion}) | sort_by(.name)' <<<"${combined}")
            if [ "${signature}" = "${prev_signature}" ]; then
              stable_count=$((stable_count + 1))
            else
              stable_count=1
            fi
            prev_signature="${signature}"

            echo "[attempt ${attempt}/${MAX_POLLS}] ${examined} check(s) examined, all completed successfully, stable_count=${stable_count}:"
            jq -r '.[] | "  - " + .name + ": " + .conclusion' <<<"${combined}"

            if [ "${stable_count}" -ge 2 ]; then
              echo "ci-gate PASS - ${examined} check(s) examined, none failed, set stable across 2 consecutive polls."
              exit 0
            fi

            sleep "${POLL_INTERVAL_SECONDS}"
          done

          echo "::error::ci-gate FAIL - timed out after ${MAX_POLLS} polls without a stable, all-green, non-empty check set for ${HEAD_SHA}."
          exit 1

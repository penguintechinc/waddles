name: No Shared JWT Secret

# Secrets T10 gate: platform JWTs are ES256 (keys in platform_vault). Fails when `JWT_SECRET`,
# `JWT_SECRET_KEY`, `JWT_HMAC_SECRET` or an HS256/384/512 reference reappears outside
# scripts/ci/jwt-hs256-allowlist.txt (tests asserting rejection + documented exceptions).
# Reports its denominator (files examined); zero examined or a stale allowlist entry fails.
# Pure `git grep`, seconds. No `paths:` filter on purpose: a path-filtered workflow that does
# not run reports nothing, and a regression can land in any file. ci-gate.yml aggregates it.

on:
  pull_request:
    branches: [main, 'release/**']
  merge_group:
    types: [checks_requested]
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: no-shared-jwt-secret-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  no-shared-jwt-secret:
    name: No shared JWT secret / HS256
    runs-on: ${{ ((github.event_name == 'pull_request' && github.base_ref != 'main' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'merge_group' && !endsWith(github.event.merge_group.base_ref, '/main')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && 'dal2-alpha-ci' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Gate
        run: bash scripts/ci/check-no-shared-jwt-secret.sh

name: Rust build-all (every core crate compiles)

# Always-run compile gate for EVERY Rust crate under core/. The per-crate
# rust-*.yml workflows are path-filtered (a change in bundle_host_db does not
# trigger svc_action's CI), so a non-compiling crate could ride into a release
# branch. This workflow has NO path filter, so it reports on every PR and
# merge_group run and ci-gate (which fails on any failed sibling check) fails
# if any crate stops compiling. No `|| true`: a build error fails the job.

on:
  pull_request:
    branches: [main, 'release/**']
  merge_group:
    branches: ['release/**']
  push:
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "build ${{ matrix.crate }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        crate:
          - bundle_active_set
          - bundle_capability_gate
          - bundle_compiler
          - bundle_executor
          - bundle_host_db
          - bundle_host_http
          - bundle_host_kv
          - egress_assertion
          - egress_detokenizer
          - egress_proxy
          - hub_client
          - overlay_auth
          - overlay_schema
          - service_auth
          - svc_action
          - svc_ingest
          - svc_presentation
          - svc_process
          - svc_streaming
    defaults:
      run:
        working-directory: core/${{ matrix.crate }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      # Union of the apt deps the per-crate workflows need (ring/aws-lc-sys
      # C toolchain, cmake, protoc for hub_client's build.rs). Bounded retry,
      # fails loudly -- same pattern as rust-crate-ci.yml.
      - name: Install build deps (C toolchain, cmake, protoc)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          for i in 1 2 3; do
            if timeout 180 sudo -E apt-get -y -o Dpkg::Use-Pty=0 update \
               && timeout 300 sudo -E apt-get -y -o Dpkg::Use-Pty=0 install --no-install-recommends build-essential cmake protobuf-compiler; then
              break
            fi
            echo "apt attempt $i failed/timed out" >&2
            if [ "$i" -eq 3 ]; then
              echo "all 3 apt attempts failed/timed out -- failing loudly" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable branch snapshot
        with:
          toolchain: "1.97.1"

      # GitHub-hosted cache service (survives the runner's hourly docker
      # prune); keyed on Cargo.lock with newest-per-crate restore fallback.
      - name: Cache cargo registry + git + target
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809  # v4.2.4  # zizmor: ignore[cache-poisoning]
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            core/${{ matrix.crate }}/target
          key: cargo-build-${{ matrix.crate }}-1.97.1-${{ runner.os }}-${{ hashFiles(format('core/{0}/Cargo.lock', matrix.crate)) }}
          restore-keys: |
            cargo-build-${{ matrix.crate }}-1.97.1-${{ runner.os }}-

      - name: cargo build --locked --all-targets
        run: cargo build --locked --all-targets

name: Rust build-all (every core crate compiles)

# Shared-dependency compile gate for EVERY Rust crate under core/. The per-crate
# rust-*.yml workflows already build+TEST their own crate on a direct change
# (rust-crate-ci.yml reusable: fmt+clippy+deny+build+llvm-cov), so re-compiling
# all 28 on a single-crate change is pure waste. This gate exists for the case
# the per-crate workflows CANNOT catch: a change to a SHARED input (wit/, the
# waddle SDKs, proto/, or a shared core crate many others path-depend on) that
# breaks a crate whose own path-filtered workflow does not fire.
#
# So on release-targeting PRs/merge-groups it runs ONLY when a shared input
# changed (see the `changes` job's `globs` closure + the build job's `match`
# gate). On main PRs / pushes / dispatch it still runs the full matrix (the
# classifier's `match` is true when path gating does not apply). The globs also
# include the three crates with no full per-crate build+test coverage
# (bundle_host_credentials -- no dedicated workflow; connector_e2e &
# tool_invoke_e2e -- their crate-ci is main-tier-only), so scoping never drops
# their existing compile coverage on a release PR. No `|| true`: a build error
# fails the job.

on:
  pull_request:
    branches: [main, 'release/**']
  merge_group:
    branches: ['release/**']
  push:
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap (~5s, no build deps) change classifier. Heavy jobs below depend on it
  # and skip themselves when nothing applicable changed. Jobs that are NOT
  # path-scoped deliberately do NOT depend on it, so they still start at t=0
  # in parallel. Fails open: see scripts/ci/changed-paths.sh.
  changes:
    name: Detect changed areas
    runs-on: ${{ ((github.event_name == 'pull_request' && github.base_ref != 'main' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'merge_group' && !endsWith(github.event.merge_group.base_ref, '/main')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && 'dal2-alpha-ci' || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      python: ${{ steps.paths.outputs.python }}
      node: ${{ steps.paths.outputs.node }}
      go: ${{ steps.paths.outputs.go }}
      # true when a SHARED Rust input changed (globs below), OR when path gating
      # does not apply (main PR / push / dispatch -> full matrix), OR the detector
      # failed (fail-open). Drives the build job's gate.
      shared: ${{ steps.paths.outputs.match }}
    steps:
      - name: Checkout (change classifier only)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: |
            scripts/ci
            .github/actions
      - name: Classify changed paths
        id: paths
        uses: ./.github/actions/changed-paths
        with:
          # Shared Rust inputs a single crate's own path-filtered workflow would
          # NOT catch -- a change here can break/re-digest many crates. Plus the
          # three crates lacking full per-crate build+test coverage, so scoping
          # never drops their existing compile coverage on a release PR.
          # (On main PRs / pushes / dispatch the classifier returns match=true
          #  regardless, so the full matrix still runs there.)
          globs: |
            wit/**
            sdk/waddle-sdk/**
            sdk/waddle-sdk-rs/**
            proto/**
            core/connection_resolver/**
            core/test_support/**
            core/bundle_host_surface/**
            core/hub_client/**
            core/platform_keys/**
            core/bundle_host_credentials/**
            core/connector_e2e/**
            core/tool_invoke_e2e/**
            .github/workflows/rust-build-all.yml

  build:
    name: "build ${{ matrix.crate }}"
    needs: changes
    # Skipped (reports "skipped", which ci-gate treats as non-failing) on a
    # release PR / merge-group whose diff touched NO shared Rust input (the
    # per-crate workflow covers a single-crate change). Still runs the full
    # matrix on main PRs / pushes / dispatch and on any shared-input change
    # (needs.changes.outputs.shared), and fail-open if the detector errored.
    # Real `if:` on the job, so no runner is allocated for the 28-crate matrix.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.shared == 'true') }}
    # bare dal2-alpha-ci image has no cc/cmake/libatomic and sudo is blocked (no-new-privileges): C-toolchain / node jobs stay on hosted ubuntu-latest until a custom runner image bakes them in
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        crate:
          - bundle_active_set
          - bundle_capability_gate
          - bundle_config_db
          - bundle_compiler
          - bundle_executor
          - bundle_host_credentials
          - bundle_host_db
          - bundle_host_http
          - bundle_host_kv
          - bundle_host_crypto
          - bundle_tool_call
          - circuit_breaker
          - command_latency
          - connector_e2e
          - discord_mentions
          - egress_assertion
          - egress_detokenizer
          - egress_proxy
          - hub_client
          - overlay_auth
          - overlay_schema
          - service_auth
          - svc_action
          - svc_ingest
          - svc_presentation
          - svc_process
          - svc_streaming
          - tool_invoke_e2e
    defaults:
      run:
        working-directory: core/${{ matrix.crate }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Setup build deps (C toolchain, cmake, protoc)
        uses: ./.github/actions/setup-build-deps
        with:
          packages: 'cmake build-essential protobuf-compiler'
      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable branch snapshot
        with:
          toolchain: "1.97.1"

      # GitHub-hosted cache service (survives the runner's hourly docker
      # prune); keyed on Cargo.lock with newest-per-crate restore fallback.
      - name: Cache cargo registry + git + target
        if: github.event_name != 'merge_group'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809  # v4.2.4  # zizmor: ignore[cache-poisoning]
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            core/${{ matrix.crate }}/target
          key: cargo-build-${{ matrix.crate }}-1.97.1-${{ runner.os }}-${{ hashFiles(format('core/{0}/Cargo.lock', matrix.crate)) }}
          restore-keys: |
            cargo-build-${{ matrix.crate }}-1.97.1-${{ runner.os }}-

      - name: Restore-only cargo cache (merge_group refs never save; avoids evicting real cache)
        if: github.event_name == 'merge_group'
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809  # v4.2.4  # zizmor: ignore[cache-poisoning]
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            core/${{ matrix.crate }}/target
          key: cargo-build-${{ matrix.crate }}-1.97.1-${{ runner.os }}-${{ hashFiles(format('core/{0}/Cargo.lock', matrix.crate)) }}
          restore-keys: |
            cargo-build-${{ matrix.crate }}-1.97.1-${{ runner.os }}-

      - name: cargo build --locked --all-targets
        run: cargo build --locked --all-targets

name: Rust bundle-host-db (lint + test)

# Per-crate gate for core/bundle_host_db -- the shared `db` capability both
# svc_process and svc_action link. Until this workflow existed NO workflow
# built or tested the crate, so a regression in its tenant/community scoping,
# quota, or connection handling could ride into a release branch unseen.
# Mirrors rust-bundle-host-kv.yml (path-filtered, reusable pipeline).

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'core/bundle_host_db/**'
      - '.github/workflows/rust-bundle-host-db.yml'
      - '.github/workflows/rust-crate-ci.yml'
  pull_request:
    branches: [main, 'release/**']
    paths:
      - 'core/bundle_host_db/**'
      - '.github/workflows/rust-bundle-host-db.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-test:
    name: fmt + clippy + deny + coverage
    uses: ./.github/workflows/rust-crate-ci.yml
    with:
      crate_name: bundle-host-db
      working_directory: core/bundle_host_db
      # `tests/postgres_integration.rs` starts a real Postgres container via
      # `testcontainers` -- needs Docker, which `ubuntu-latest` ships. The
      # crate's own `[dev-dependencies]` self-reference turns on its
      # `test-util` feature for that test, so the reusable pipeline's plain
      # `cargo clippy/test/llvm-cov` invocations need no `--features` flag.

  # Docker-free coverage floor. The job above passes the 90% gate with the
  # Postgres integration test included; this one proves the *unit* suite
  # alone (SeaORM `MockDatabase` + fakes, no container) clears it too, so
  # the scope-enforcement / quota / error-mapping branches can never again
  # depend on a live database to stay covered.
  unit-coverage:
    name: unit-only coverage (no Docker, >=90% lines)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: core/bundle_host_db
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust 1.97.1 (llvm-tools-preview)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable branch snapshot
        with:
          toolchain: "1.97.1"
          components: llvm-tools-preview

      # Own cache key (`-unit-`): never shares or clobbers the reusable
      # pipeline's entry for this crate. A miss only costs time.
      - name: Cache cargo registry + git + target
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809  # v4.2.4  # zizmor: ignore[cache-poisoning]
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            core/bundle_host_db/target
          key: cargo-bundle-host-db-unit-1.97.1-${{ runner.os }}-${{ hashFiles('core/bundle_host_db/Cargo.lock') }}
          restore-keys: |
            cargo-bundle-host-db-unit-1.97.1-${{ runner.os }}-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375  # v2.87.12
        with:
          tool: cargo-llvm-cov@0.9.1

      # `--lib` runs only the inline unit tests -- the Docker-backed
      # `tests/postgres_integration.rs` is excluded by construction. No
      # `|| true`: a missed threshold (or a build/test failure) fails the job.
      - name: cargo llvm-cov --lib --locked (>=90% line coverage, no Docker)
        run: cargo llvm-cov --locked --lib --fail-under-lines 90

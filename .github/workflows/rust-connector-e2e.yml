name: Rust connector-e2e (real-path connector host harness)

# core/connector_e2e links svc-ingest (the host: Transport, driver, sink) and
# bundle-executor (the real wasmtime invoker) into one process and drives a
# real compiled WASM connector end to end (issue #840 B0). It path-depends on
# both crates, so a change in EITHER re-runs it -- the contract between the
# host driver and the executor's connector invocation is only proven here.

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'core/connector_e2e/**'
      - 'core/svc_ingest/**'
      - 'core/discord_mentions/**'
      - 'core/hub_client/**'
      - 'proto/**'
      - 'core/bundle_executor/**'
      - 'wit/waddle-connector/**'
      - '.github/workflows/rust-connector-e2e.yml'
      - '.github/workflows/rust-crate-ci.yml'
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path gate (release PRs only): shared detector, fails closed. A job skipped
  # here means "not affected"; main PRs / pushes / dispatch run everything.
  changes:
    name: Detect changed areas
    runs-on: ${{ ((github.event_name == 'pull_request' && github.base_ref != 'main' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'merge_group' && !endsWith(github.event.merge_group.base_ref, '/main')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && 'dal2-alpha-ci' || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      match: ${{ steps.paths.outputs.match }}
    steps:
      - name: Checkout (change classifier only)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: |
            scripts/ci
            .github/actions
      - name: Classify changed paths
        id: paths
        uses: ./.github/actions/changed-paths
        with:
          area: rust
          globs: |
            core/connector_e2e/**
            core/svc_ingest/**
            core/discord_mentions/**
            core/hub_client/**
            proto/**
            core/bundle_executor/**
            wit/waddle-connector/**

  lint-test:
    needs: changes
    # Main-only tier: skipped on PRs into release/** (see scripts/ci/ci-gate-tier.py)
    if: ${{ (github.event_name != 'pull_request' || github.base_ref == 'main') && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.match == 'true') }}
    name: fmt + clippy + deny + coverage
    uses: ./.github/workflows/rust-crate-ci.yml
    with:
      crate_name: connector-e2e
      # tests/outbound_exec.rs drains a REAL Valkey list (VALKEY_URL unset FAILS, never skips).
      valkey: true
      working_directory: core/connector_e2e
      # ring/aws-lc-sys need a C/C++ toolchain; cmake for aws-lc-sys.
      # protoc: hub_client's build.rs (svc-ingest path dependency).
      extra_apt_packages: 'cmake build-essential protobuf-compiler'
      extra_apt_reason: 'for aws-lc-sys/ring (cmake, C/C++ toolchain) + hub_client (protoc)'

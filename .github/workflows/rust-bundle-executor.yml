name: Rust bundle-executor (lint + test)

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'core/bundle_executor/**'
      - 'wit/waddle-bundle/**'
      - 'wit/waddle-connector/**'
      - 'tests/data_plane_parity/**'
      - 'sdk/waddle-sdk/src/**'
      - '.github/workflows/rust-bundle-executor.yml'
      - '.github/workflows/rust-crate-ci.yml'
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path gate (release PRs only): shared detector, fails closed. A job skipped
  # here means "not affected"; main PRs / pushes / dispatch run everything.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      match: ${{ steps.paths.outputs.match }}
    steps:
      - name: Checkout (change classifier only)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: |
            scripts/ci
            .github/actions
      - name: Classify changed paths
        id: paths
        uses: ./.github/actions/changed-paths
        with:
          area: rust
          globs: |
            core/bundle_executor/**
            wit/waddle-bundle/**
            wit/waddle-connector/**
            tests/data_plane_parity/**
            sdk/waddle-sdk/src/**

  lint-test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.match == 'true') }}
    name: fmt + clippy + deny + build + coverage
    uses: ./.github/workflows/rust-crate-ci.yml
    with:
      crate_name: bundle-executor
      working_directory: core/bundle_executor
      # aws-lc-sys/ring need cmake plus a C/C++ toolchain to build.
      extra_apt_packages: 'cmake build-essential'
      extra_apt_reason: 'for aws-lc-sys/ring (cmake, C/C++ toolchain)'
      # Proves the penguin-bundle-host git dependency (pinned by commit
      # rev in Cargo.toml, spec SS4.5/SS6.6) resolves and builds from a
      # clean clone with no local penguin-libs checkout anywhere on this
      # runner -- exactly the property the M2 task's NON-NEGOTIABLE list
      # requires. Also includes tests/dependency_policy.rs (spec
      # SS4.5/SS14.6 test 16): asserts no redis/sea-orm/sqlx/deadpool-redis/
      # reqwest anywhere in this credential-less binary's dependency graph.
      release_build: true

name: Build svc-action

# Publishes the Rust data-plane svc-action image (`svc-action-rust`) built
# from `core/svc_action/Dockerfile.rust`. See build-svc-ingest.yml for the
# full rationale (self-contained build, `-rust` naming, gated Trivy scan,
# and the PR-path job split so a build-context regression like gh-475 now
# fails the PR).

on:
  push:
    branches: [main, 'v*', 'release/**', 'feature/**', 'fix/**', 'chore/**', 'hotfix/**', 'docs/**', 'refactor/**']
    paths:
      - 'core/svc_action/**'
      - 'core/discord_mentions/**'
      - '.version'
      - '.github/workflows/build-svc-action.yml'
  pull_request:
    branches: [main, 'v*', 'release/**', 'feature/**', 'fix/**', 'chore/**', 'hotfix/**', 'docs/**', 'refactor/**']
    paths:
      - 'core/svc_action/**'
      - 'core/discord_mentions/**'
  merge_group:
    types: [checks_requested]
    branches: [main, 'v*', 'release/**', 'feature/**', 'fix/**', 'chore/**', 'hotfix/**', 'docs/**', 'refactor/**']
  release:
    types: [released, prereleased]
  workflow_dispatch:

concurrency:
  group: build-svc-action-${{ github.event.merge_group.head_sha || github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  MODULE_NAME: svc-action-rust
  MODULE_PATH: core/svc_action
  # Dockerfile.rust COPYs the sibling `bundle_active_set` crate (same-repo
  # path dependency), so the build context must be `core/` (the parent of
  # MODULE_PATH), not MODULE_PATH itself -- see the Dockerfile.rust header
  # comment. `file` stays MODULE_PATH-relative since docker/build-push-action
  # resolves `file` relative to the workflow's working directory, not context.
  BUILD_CONTEXT: core
  # TEMPORARY amd64-only (user-approved 2026-10-03). Re-enable arm64 near
  # release / for the mixed-arch Minisforum alpha cluster by setting
  # BUILD_PLATFORMS=linux/amd64,linux/arm64 (this is the single toggle --
  # every build-*.yml workflow that builds images keys off the same name).
  BUILD_PLATFORMS: linux/amd64

jobs:
  determine-version:
    name: Determine Version and Tags
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      suffix: ${{ steps.version.outputs.suffix }}
      is_release: ${{ steps.version.outputs.is_release }}
      multi_arch: ${{ steps.version.outputs.multi_arch }}
      matrix: ${{ steps.version.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Determine version and suffix
        id: version
        # Uses the default $GITHUB_REF/$GITHUB_HEAD_REF env vars rather than
        # interpolating github.ref/github.head_ref directly into the script
        # (zizmor template-injection).
        run: |
          set -euo pipefail
          # Five-tier tag scheme (devops.md CI/CD Tag Naming) -- tier -> tag -> trigger:
          #   alpha : any non-release branch push / dispatch -> alpha-<epoch>
          #   beta  : push to release/v*.X (or main)         -> beta-<epoch>
          #   gamma : GitHub release flagged pre-release     -> gamma-<epoch>   (release: prereleased)
          #   prod  : GitHub release published as release    -> v{Major}.{Minor}.{Patch} + latest (release: released)
          # <epoch> = unix seconds, computed once here so every matrix job shares it.
          # .version is NOT used for tags. `suffix` is kept (always empty) so
          # downstream ${version}${suffix} references keep resolving.
          EPOCH="$(date +%s)"
          IS_RELEASE=false
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            ACTION="$(jq -r '.action' "$GITHUB_EVENT_PATH")"
            case "$ACTION" in
              released)
                SEMVER_RE='^v[0-9]+\.[0-9]+\.[0-9]+$'
                if ! [[ "$GITHUB_REF_NAME" =~ $SEMVER_RE ]]; then
                  echo "::error::release tag '$GITHUB_REF_NAME' is not v{Major}.{Minor}.{Patch}" >&2
                  exit 1
                fi
                TAG="$GITHUB_REF_NAME"
                IS_RELEASE=true
                ;;
              prereleased)
                TAG="gamma-${EPOCH}"
                ;;
              *)
                echo "::error::unsupported release action '$ACTION'" >&2
                exit 1
                ;;
            esac
          elif [[ "$GITHUB_REF" == refs/heads/release/v* ]] || [ "$GITHUB_REF" = "refs/heads/main" ]; then
            TAG="beta-${EPOCH}"
          else
            TAG="alpha-${EPOCH}"
          fi
          {
            echo "version=${TAG}"
            echo "suffix="
            echo "is_release=${IS_RELEASE}"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${TAG} (release=${IS_RELEASE})"

          # Derive the whole matrix object + multi_arch flag from the single
          # BUILD_PLATFORMS toggle (env, top of file). A comma means more
          # than one platform is requested -- restore arm64 by flipping that
          # one value back to "linux/amd64,linux/arm64".
          #
          # The matrix is emitted as one complete JSON object (not a static
          # "include:" list plus a dynamic "exclude:" expression) because
          # mixing a static matrix key with a fromJSON(...)-driven sibling
          # key resolves to an empty job set -- see gh-577. This is GitHub's
          # documented "defining a matrix dynamically" pattern instead:
          # https://docs.github.com/actions/how-tos/write-workflows/choose-what-workflows-do/run-variations-of-jobs-in-a-workflow#defining-a-matrix-dynamically
          if [[ "$BUILD_PLATFORMS" == *,* ]]; then
            echo "multi_arch=true" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[{"platform":"linux/amd64","runner":"ubuntu-latest","suffix":"amd64"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm","suffix":"arm64"}]}' >> "$GITHUB_OUTPUT"
          else
            echo "multi_arch=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[{"platform":"linux/amd64","runner":"ubuntu-latest","suffix":"amd64"}]}' >> "$GITHUB_OUTPUT"
          fi

  # Push-path only -- pull_request/merge_group is handled entirely by
  # build-pr below so packages:write is never granted to a job building an
  # untrusted PR's Dockerfile.
  build-platform:
    name: Build (${{ matrix.platform }})
    if: >
      (github.ref == 'refs/heads/main' || github.event_name == 'release' || github.event_name == 'workflow_dispatch') &&
      (github.event_name != 'pull_request' && github.event_name != 'merge_group')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # Whole matrix object computed by determine-version (see that job's
      # comment) -- a static `include:` plus dynamic `exclude:` resolved to
      # zero jobs, see gh-577.
      matrix: ${{ fromJSON(needs.determine-version.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    needs: determine-version
    outputs:
      # Only ever set by the single surviving (amd64) matrix entry when
      # BUILD_PLATFORMS is amd64-only -- trivy-scan falls back to this when
      # `merge` (below) is skipped, so the gate still runs on a single-arch
      # build. See `build-container.yml` header for the overall rationale.
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Log in to Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Single-platform builds (BUILD_PLATFORMS has no comma) skip the
      # "Merge Multi-Arch Manifest" job below entirely, so this step must
      # also publish the plain (and, on release, :latest) tag that job
      # would otherwise create -- a single-arch build ends up pushing a
      # normal image, never a manifest list.
      - name: Compute image tags
        id: tags
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ env.MODULE_NAME }}
          VERSION: ${{ needs.determine-version.outputs.version }}${{ needs.determine-version.outputs.suffix }}
          IS_RELEASE: ${{ needs.determine-version.outputs.is_release }}
          MULTI_ARCH: ${{ needs.determine-version.outputs.multi_arch }}
          ARCH_SUFFIX: ${{ matrix.suffix }}
        run: |
          TAGS="${IMAGE}:${VERSION}-${ARCH_SUFFIX}"
          if [ "${MULTI_ARCH}" != "true" ]; then
            TAGS=$(printf '%s\n%s' "$TAGS" "${IMAGE}:${VERSION}")
            if [ "${IS_RELEASE}" = "true" ]; then
              TAGS=$(printf '%s\n%s' "$TAGS" "${IMAGE}:latest")
            fi
          fi
          {
            echo "list<<TAGEOF"
            echo "${TAGS}"
            echo "TAGEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.MODULE_PATH }}/Dockerfile.rust
          # `hub_client`'s build.rs compiles the repo-root `proto/` tree
          # (checked-in source of truth shared with Python) -- that
          # directory is a sibling of `core/` (BUILD_CONTEXT), not inside
          # it, so it must be supplied as a named additional build
          # context (relative to the workflow's checkout root) rather
          # than COPY'd from the primary `core/` context.
          build-contexts: |
            proto=proto
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=${{ env.MODULE_NAME }}-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ env.MODULE_NAME }}-${{ matrix.suffix }}

  # PR/merge_group path: single-arch build, no registry credentials, gated
  # Trivy scan against the locally loaded (never pushed) image -- see
  # build-svc-ingest.yml's header comment for the shared rationale.
  build-pr:
    name: Build & Scan (PR)
    if: >
      (github.ref == 'refs/heads/main' || github.event_name == 'release' || github.event_name == 'workflow_dispatch') &&
      (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-latest
    needs: determine-version
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Build image (amd64 only, not pushed)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.MODULE_PATH }}/Dockerfile.rust
          # `hub_client`'s build.rs compiles the repo-root `proto/` tree
          # (checked-in source of truth shared with Python) -- that
          # directory is a sibling of `core/` (BUILD_CONTEXT), not inside
          # it, so it must be supplied as a named additional build
          # context (relative to the workflow's checkout root) rather
          # than COPY'd from the primary `core/` context.
          build-contexts: |
            proto=proto
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ env.MODULE_NAME }}:pr-${{ github.run_id }}
          cache-from: type=gha,scope=${{ env.MODULE_NAME }}-amd64

      - name: Trivy vulnerability scan (gated, local image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.69.3
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ env.MODULE_NAME }}:pr-${{ github.run_id }}
          format: 'table'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

  merge:
    name: Merge Multi-Arch Manifest
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    needs: [determine-version, build-platform]
    # No-ops cleanly when BUILD_PLATFORMS is amd64-only -- build-platform's
    # "Compute image tags" step already pushed the plain/:latest tags
    # directly in that case, so there is nothing to merge. trivy-scan below
    # falls back to build-platform's own digest output in that case.
    if: >
      (github.ref == 'refs/heads/main' || github.event_name == 'release' || github.event_name == 'workflow_dispatch') &&
      github.event_name != 'pull_request' &&
      github.event_name != 'merge_group' &&
      needs.determine-version.outputs.multi_arch == 'true'
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Log in to Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}${{ needs.determine-version.outputs.suffix }}
          IS_RELEASE: ${{ needs.determine-version.outputs.is_release }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ env.MODULE_NAME }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"

          if [ "$IS_RELEASE" = "true" ]; then
            docker buildx imagetools create \
              -t "${IMAGE}:latest" \
              "${IMAGE}:${VERSION}-amd64" \
              "${IMAGE}:${VERSION}-arm64"
          fi

          {
            echo "## Build Complete: ${{ env.MODULE_NAME }}"
            echo "**Image:** \`${IMAGE}\`"
            echo "**Tag:** \`${VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Get manifest digest
        # Captures the digest of the manifest just pushed above, in this
        # same job/runner, so the Trivy scan below is guaranteed to target
        # the exact image this run built -- never a stale/mutable tag.
        id: digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ env.MODULE_NAME }}
          VERSION: ${{ needs.determine-version.outputs.version }}${{ needs.determine-version.outputs.suffix }}
        run: |
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ env.MODULE_NAME }}:${{ needs.determine-version.outputs.version }}${{ needs.determine-version.outputs.suffix }}
          format: spdx-json
          output-file: sbom-${{ env.MODULE_NAME }}.spdx.json
          upload-artifact: true
          upload-artifact-retention: 90

  trivy-scan:
    name: Trivy Image Scan (gated)
    permissions:
      contents: read
      packages: read
      security-events: write
    runs-on: ubuntu-latest
    needs: [determine-version, build-platform, merge]
    # `merge` is intentionally skipped (not failed) when BUILD_PLATFORMS is
    # amd64-only -- run this gate off build-platform's own digest in that
    # case instead of letting the skip cascade and silently drop the scan.
    if: >
      (github.ref == 'refs/heads/main' || github.event_name == 'release' || github.event_name == 'workflow_dispatch') &&
      always() &&
      needs.build-platform.result == 'success' &&
      (needs.merge.result == 'success' || needs.merge.result == 'skipped')
    env:
      SCAN_DIGEST: ${{ needs.determine-version.outputs.multi_arch == 'true' && needs.merge.outputs.digest || needs.build-platform.outputs.digest }}
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner (gate)
        # Scans by the digest captured above -- never the mutable tag, which
        # can otherwise point at a stale, already-built image. See
        # rules/critical-rules.md Verification Integrity.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.69.3
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ env.MODULE_NAME }}@${{ env.SCAN_DIGEST }}
          format: 'table'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Run Trivy vulnerability scanner (SARIF)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.69.3
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ env.MODULE_NAME }}@${{ env.SCAN_DIGEST }}
          format: 'sarif'
          output: 'trivy-${{ env.MODULE_NAME }}.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225  # v4
        if: always()
        with:
          sarif_file: 'trivy-${{ env.MODULE_NAME }}.sarif'

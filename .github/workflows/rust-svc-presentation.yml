name: Rust svc-presentation (lint + test)

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'core/svc_presentation/**'
      - 'core/overlay_schema/**'
      - 'core/overlay_auth/**'
      - 'core/service_auth/**'
      - 'core/hub_client/**'
      - 'core/egress_detokenizer/**'
      - '.github/workflows/rust-svc-presentation.yml'
      - '.github/workflows/rust-crate-ci.yml'
  pull_request:
    branches: [main, 'release/**']
    paths:
      - 'core/svc_presentation/**'
      - 'core/overlay_schema/**'
      - 'core/overlay_auth/**'
      - 'core/service_auth/**'
      - 'core/hub_client/**'
      - 'core/egress_detokenizer/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-test:
    name: fmt + clippy + deny + coverage
    uses: ./.github/workflows/rust-crate-ci.yml
    with:
      crate_name: svc-presentation
      working_directory: core/svc_presentation
      # protoc is needed by hub_client's build.rs (tonic-prost-build), a
      # dependency of `overlay::detok` (via egress_detokenizer).
      extra_apt_packages: protobuf-compiler
      extra_apt_reason: 'for hub_client (protoc)'
      # Thin binary entrypoint, untestable without subprocessing -- same
      # convention as rust-svc-process.yml/rust-egress-proxy.yml.
      coverage_ignore_regex: 'main\.rs'

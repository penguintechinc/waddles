name: Rust svc-presentation (lint + test)

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'core/svc_presentation/**'
      - 'core/overlay_schema/**'
      - 'core/overlay_auth/**'
      - 'core/service_auth/**'
      - 'core/hub_client/**'
      - 'core/egress_detokenizer/**'
      - '.github/workflows/rust-svc-presentation.yml'
      - '.github/workflows/rust-crate-ci.yml'
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path gate (release PRs only): shared detector, fails closed. A job skipped
  # here means "not affected"; main PRs / pushes / dispatch run everything.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      match: ${{ steps.paths.outputs.match }}
    steps:
      - name: Checkout (change classifier only)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: |
            scripts/ci
            .github/actions
      - name: Classify changed paths
        id: paths
        uses: ./.github/actions/changed-paths
        with:
          area: rust
          globs: |
            core/svc_presentation/**
            core/overlay_schema/**
            core/overlay_auth/**
            core/service_auth/**
            core/hub_client/**
            core/egress_detokenizer/**

  lint-test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.match == 'true') }}
    name: fmt + clippy + deny + coverage
    uses: ./.github/workflows/rust-crate-ci.yml
    with:
      crate_name: svc-presentation
      working_directory: core/svc_presentation
      # protoc is needed by hub_client's build.rs (tonic-prost-build), a
      # dependency of `overlay::detok` (via egress_detokenizer).
      extra_apt_packages: protobuf-compiler
      extra_apt_reason: 'for hub_client (protoc)'
      # Thin binary entrypoint, untestable without subprocessing -- same
      # convention as rust-svc-process.yml/rust-egress-proxy.yml.
      coverage_ignore_regex: 'main\.rs'

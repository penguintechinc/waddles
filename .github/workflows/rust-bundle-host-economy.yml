name: Rust bundle-host-economy (lint + test)

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'core/bundle_host_economy/**'
      - 'core/bundle_capability_gate/**'
      - 'scripts/db/bundle_economy_store.sql'
      - 'scripts/db/bundle_economy_idempotency.sql'
      - '.github/workflows/rust-bundle-host-economy.yml'
      - '.github/workflows/rust-crate-ci.yml'
  pull_request:
    branches: [main, 'release/**']
    paths:
      - 'core/bundle_host_economy/**'
      - 'core/bundle_capability_gate/**'
      - 'scripts/db/bundle_economy_store.sql'
      - 'scripts/db/bundle_economy_idempotency.sql'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-test:
    name: fmt + clippy + deny + coverage
    uses: ./.github/workflows/rust-crate-ci.yml
    with:
      crate_name: bundle-host-economy
      working_directory: core/bundle_host_economy
      # `tests/postgres_integration.rs` starts a real Postgres container via
      # `testcontainers` -- needs Docker, which `ubuntu-latest` ships.

name: Rust svc-process (lint + test)

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'core/svc_process/**'
      - 'core/bundle_host_kv/**'
      - 'core/bundle_capability_gate/**'
      - 'core/bundle_host_reputation/**'
      - 'core/bundle_host_economy/**'
      - 'core/hub_client/**'
      - '.github/workflows/rust-svc-process.yml'
      - '.github/workflows/rust-crate-ci.yml'
  pull_request:
    branches: [main, 'release/**']
    paths:
      - 'core/svc_process/**'
      - 'core/bundle_host_kv/**'
      - 'core/bundle_capability_gate/**'
      - 'core/bundle_host_reputation/**'
      - 'core/bundle_host_economy/**'
      - 'core/hub_client/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-test:
    name: fmt + clippy + deny + coverage
    uses: ./.github/workflows/rust-crate-ci.yml
    with:
      crate_name: svc-process
      working_directory: core/svc_process
      # main.rs is a 3-line pass-through to `svc_process::run()`/
      # `run_healthcheck()` (both fully unit-tested) -- excluded from the
      # coverage ratio the same way svc_streaming's binary entrypoint is,
      # per its own module doc comment ("thin binary entrypoint").
      coverage_ignore_regex: 'main\.rs'
      # hub_client's build.rs (tonic-prost-build) needs protoc.
      extra_apt_packages: protobuf-compiler
      extra_apt_reason: 'for hub_client (protoc, tonic-prost-build)'

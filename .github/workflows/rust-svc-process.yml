name: Rust svc-process (lint + test)

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'core/svc_process/**'
      - 'core/test_support/**'
      - 'core/bundle_host_kv/**'
      - 'core/bundle_host_crypto/**'
      - 'core/bundle_host_credentials/**'
      - 'core/connection_resolver/**'
      - 'core/bundle_capability_gate/**'
      - 'core/bundle_tool_call/**'
      - 'core/circuit_breaker/**'
      - 'core/bundle_host_reputation/**'
      - 'core/bundle_host_economy/**'
      - 'core/bundle_host_media/**'
      - 'core/bundle_host_http/**'
      - 'core/hub_client/**'
      - 'scripts/db/bundle_identity_resolve.sql'
      - 'scripts/db/bundle_economy_store.sql'
      - 'scripts/db/bundle_economy_idempotency.sql'
      - '.github/workflows/rust-svc-process.yml'
      - '.github/workflows/rust-crate-ci.yml'
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path gate (release PRs only): shared detector, fails closed. A job skipped
  # here means "not affected"; main PRs / pushes / dispatch run everything.
  changes:
    name: Detect changed areas
    runs-on: ${{ ((github.event_name == 'pull_request' && github.base_ref != 'main' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'merge_group' && !endsWith(github.event.merge_group.base_ref, '/main')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && 'dal2-alpha-ci' || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      match: ${{ steps.paths.outputs.match }}
    steps:
      - name: Checkout (change classifier only)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: |
            scripts/ci
            .github/actions
      - name: Classify changed paths
        id: paths
        uses: ./.github/actions/changed-paths
        with:
          area: rust
          globs: |
            core/svc_process/**
            core/test_support/**
            core/bundle_host_kv/**
            core/bundle_host_crypto/**
            core/bundle_host_credentials/**
            core/connection_resolver/**
            core/bundle_capability_gate/**
            core/bundle_tool_call/**
            core/circuit_breaker/**
            core/bundle_host_reputation/**
            core/bundle_host_economy/**
            core/bundle_host_media/**
            core/hub_client/**
            scripts/db/bundle_identity_resolve.sql
            scripts/db/bundle_economy_store.sql
            scripts/db/bundle_economy_idempotency.sql

  lint-test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.match == 'true') }}
    name: fmt + clippy + deny + coverage
    uses: ./.github/workflows/rust-crate-ci.yml
    with:
      crate_name: svc-process
      working_directory: core/svc_process
      # main.rs is a 3-line pass-through to `svc_process::run()`/
      # `run_healthcheck()` (both fully unit-tested) -- excluded from the
      # coverage ratio the same way svc_streaming's binary entrypoint is,
      # per its own module doc comment ("thin binary entrypoint").
      coverage_ignore_regex: 'main\.rs'
      # hub_client's build.rs (tonic-prost-build) needs protoc.
      extra_apt_packages: protobuf-compiler
      extra_apt_reason: 'for hub_client (protoc, tonic-prost-build)'

name: Build clip-interaction

on:
  push:
    branches: [main, 'v*', 'release/**', 'feature/**', 'fix/**', 'chore/**', 'hotfix/**', 'docs/**', 'refactor/**']
    paths:
      - 'action/interactive/clip_interaction_module/**'
      - 'libs/flask_core/**'
      - '.version'
      - '.github/workflows/build-clip-interaction.yml'
      - '.github/workflows/build-container.yml'
  pull_request:
    branches: [main, 'v*', 'release/**', 'feature/**', 'fix/**', 'chore/**', 'hotfix/**', 'docs/**', 'refactor/**']
    paths:
      - 'action/interactive/clip_interaction_module/**'
      - 'libs/flask_core/**'
  merge_group:
    types: [checks_requested]
    branches: ['release/**']
  workflow_dispatch:


permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build clip-interaction Container
    uses: ./.github/workflows/build-container.yml
    with:
      module_path: 'action/interactive/clip_interaction_module'
      module_name: 'clip-interaction'
      module_port: '8098'
    secrets: inherit

name: Build egress-proxy

# Publishes the Rust network-level egress gateway image (`waddlebot-egress-proxy`,
# matching k8s/helm/waddlebot/values.yaml `egressProxy.image`) built from
# `core/egress_proxy/Dockerfile.rust`. See build-svc-ingest.yml for the full
# rationale (self-contained build, gated Trivy scan, and the PR-path job
# split so a build-context regression -- e.g. a missing same-repo path
# dependency COPY -- fails the PR instead of only being caught on push).

on:
  push:
    branches: [main, 'v*', 'release/**', 'feature/**', 'fix/**', 'chore/**', 'hotfix/**', 'docs/**', 'refactor/**']
    tags: ['v*']
    paths:
      - 'core/egress_proxy/**'
      - 'core/service_auth/**'
      - 'core/bundle_host_http/**'
      - 'core/egress_assertion/**'
      - '.version'
      - '.github/workflows/build-egress-proxy.yml'
  pull_request:
    branches: [main, 'v*', 'release/**', 'feature/**', 'fix/**', 'chore/**', 'hotfix/**', 'docs/**', 'refactor/**']
    paths:
      - 'core/egress_proxy/**'
      - 'core/service_auth/**'
      - 'core/bundle_host_http/**'
      - 'core/egress_assertion/**'
  merge_group:
    types: [checks_requested]
    branches: [main, 'v*', 'release/**', 'feature/**', 'fix/**', 'chore/**', 'hotfix/**', 'docs/**', 'refactor/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  MODULE_NAME: waddlebot-egress-proxy
  MODULE_PATH: core/egress_proxy
  # Dockerfile.rust COPYs three sibling crates (same-repo path dependencies:
  # `service_auth`, `bundle_host_http`, `egress_assertion`), so the build
  # context must be `core/` (the parent of MODULE_PATH), not MODULE_PATH
  # itself -- see that Dockerfile's own header comment. `file` stays
  # MODULE_PATH-relative since docker/build-push-action resolves `file`
  # relative to the workflow's working directory, not context.
  BUILD_CONTEXT: core

jobs:
  determine-version:
    name: Determine Version and Tags
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      suffix: ${{ steps.version.outputs.suffix }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Determine version and suffix
        id: version
        # Uses the default $GITHUB_REF/$GITHUB_HEAD_REF env vars rather than
        # interpolating github.ref/github.head_ref directly into the script
        # (zizmor template-injection).
        run: |
          if [ -f .version ]; then
            VERSION=$(tr -d '[:space:]' < .version)
          else
            VERSION="0.0.0"
          fi

          echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "suffix=" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/v* ]] || [[ "$GITHUB_HEAD_REF" == v* ]]; then
            echo "suffix=-beta" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "suffix=-gamma" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=-alpha" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  # Push-path only -- pull_request/merge_group is handled entirely by
  # build-pr below so packages:write is never granted to a job building an
  # untrusted PR's Dockerfile.
  build-platform:
    name: Build (${{ matrix.platform }})
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    needs: determine-version
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Log in to Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (${{ matrix.platform }})
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.MODULE_PATH }}/Dockerfile.rust
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ env.MODULE_NAME }}:${{ needs.determine-version.outputs.version }}${{ needs.determine-version.outputs.suffix }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ env.MODULE_NAME }}-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ env.MODULE_NAME }}-${{ matrix.suffix }}

  # PR/merge_group path: single-arch build, no registry credentials, gated
  # Trivy scan against the locally loaded (never pushed) image -- see
  # build-svc-ingest.yml's header comment for the shared rationale.
  build-pr:
    name: Build & Scan (PR)
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    needs: determine-version
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Build image (amd64 only, not pushed)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.MODULE_PATH }}/Dockerfile.rust
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ env.MODULE_NAME }}:pr-${{ github.run_id }}
          cache-from: type=gha,scope=${{ env.MODULE_NAME }}-amd64

      - name: Trivy vulnerability scan (gated, local image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.69.3
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ env.MODULE_NAME }}:pr-${{ github.run_id }}
          format: 'table'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

  merge:
    name: Merge Multi-Arch Manifest
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    needs: [determine-version, build-platform]
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Log in to Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}${{ needs.determine-version.outputs.suffix }}
          IS_RELEASE: ${{ needs.determine-version.outputs.is_release }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ env.MODULE_NAME }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"

          if [ "$IS_RELEASE" = "true" ]; then
            docker buildx imagetools create \
              -t "${IMAGE}:latest" \
              "${IMAGE}:${VERSION}-amd64" \
              "${IMAGE}:${VERSION}-arm64"
          fi

          {
            echo "## Build Complete: ${{ env.MODULE_NAME }}"
            echo "**Image:** \`${IMAGE}\`"
            echo "**Tag:** \`${VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Get manifest digest
        # Captures the digest of the manifest just pushed above, in this
        # same job/runner, so the Trivy scan below is guaranteed to target
        # the exact image this run built -- never a stale/mutable tag.
        id: digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ env.MODULE_NAME }}
          VERSION: ${{ needs.determine-version.outputs.version }}${{ needs.determine-version.outputs.suffix }}
        run: |
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ env.MODULE_NAME }}:${{ needs.determine-version.outputs.version }}${{ needs.determine-version.outputs.suffix }}
          format: spdx-json
          output-file: sbom-${{ env.MODULE_NAME }}.spdx.json
          upload-artifact: true
          upload-artifact-retention: 90

  trivy-scan:
    name: Trivy Image Scan (gated)
    permissions:
      contents: read
      packages: read
      security-events: write
    runs-on: ubuntu-latest
    needs: [determine-version, merge]
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner (gate)
        # Scans by the digest captured in the `merge` job -- never the
        # mutable tag, which can otherwise point at a stale, already-built
        # image. See rules/critical-rules.md Verification Integrity.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.69.3
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ env.MODULE_NAME }}@${{ needs.merge.outputs.digest }}
          format: 'table'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Run Trivy vulnerability scanner (SARIF)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.69.3
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ env.MODULE_NAME }}@${{ needs.merge.outputs.digest }}
          format: 'sarif'
          output: 'trivy-${{ env.MODULE_NAME }}.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225  # v4
        if: always()
        with:
          sarif_file: 'trivy-${{ env.MODULE_NAME }}.sarif'

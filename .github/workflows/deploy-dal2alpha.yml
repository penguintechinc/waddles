name: Deploy dal2-alpha

# TRUSTED-CODE-ONLY (security constraint): this self-hosted runner must only ever
# build/deploy trusted first-party code (non-fork, protected branch). The in-cluster
# BuildKit runs with --oci-worker-no-process-sandbox, so build steps are NOT
# PID-isolated; untrusted (fork/PR) code must never build here.
#  - Triggers are push to release/v3.0.X only (forks cannot push to this repo) plus
#    workflow_dispatch (maintainer/write-access only). There is deliberately NO
#    pull_request / pull_request_target trigger -- never add one.
#  - Job-level guards below also pin execution to this repo AND the protected
#    release branch, so a dispatch from a feature branch is refused.
# REQUIRED SETUP (repo settings, done by a human): GitHub Environment `dal2-alpha`
# must have deployment protection (required reviewers) as the GitHub-side gate.

# Merge-to-release -> build alpha images -> deploy to the dal2-alpha cluster,
# surfaced as the GitHub Environment/Deployment `dal2-alpha`.
#
# POLICY NOTE: container image builds are otherwise gated to main-only for
# Actions-budget reasons (build-container.yml + callers) -- that gating is
# UNCHANGED. This workflow is the intended extension: ONE release-branch-merge
# alpha build+deploy path. It does NOT re-enable per-PR / per-branch builds.
# It cannot reuse build-container.yml (that workflow is main/release/dispatch
# gated, tags beta-* on release branches, and builds one module at a time).
#
# Runners: gha-runner-scale-set (ARC) matches on the scale-set NAME only, so
# `runs-on: dal2-alpha` is a single label (an array form never picks up).
# Builds use the in-cluster rootless buildkitd via the buildx `remote` driver
# (no docker.sock on the runner). Deploy uses the runner pod's ServiceAccount.
# Runner/BuildKit infra is org-wide: manifests live in penguintechinc/admin at
# k8s/dal2alpha/runners/ (not in this repo).
#
# NOTE: k8s/helm/waddlebot/values-dal2alpha.yaml is the single canonical overlay, owned by
# branch chore/values-dal2alpha (must merge to release BEFORE/with this workflow; no copy here).
#
# CHANGED-ONLY BUILDS (owner decision 2026-11-13: "only build and deploy images that change"):
#   plan   -> reads the deployed Helm release, finds each image's last-built revision (OCI label),
#             diffs it against HEAD with the reviewable map scripts/ci/image-inputs.yaml, and
#             decides BUILD vs REUSE per image. Anything uncertain builds (fail safe).
#   build  -> only the BUILD set, spread over BuildKit lanes (a = primary, b = optional 2nd pod).
#   retag  -> REUSE images are copied to the new alpha tag by digest in the registry (no rebuild).
#   deploy -> helm gets global.imageTags per image: rebuilt images get the new tag, reused images
#             keep their old tag string, so only changed workloads restart.
# Escape hatch: workflow_dispatch with force_all=true rebuilds and redeploys every image.
# One fixed registry cache ref per image (buildcache/<image>:alpha, mode=max, overwritten each build).
# Prune old tags with scripts/ci/prune_alpha_images.py (dry-run by default; never scheduled here).
#
# Alpha is FULLY self-hosted (build AND deploy on the dal2 runner) so it costs
# zero GitHub-hosted Actions minutes. Beta/prod will use a separate HYBRID
# workflow later (GitHub-hosted build + self-hosted deploy) -- not built here.

on:
  push:
    branches: [release/v3.0.X]
  workflow_dispatch:
    inputs:
      force_all:
        description: "Rebuild and redeploy EVERY image (ignore change detection)"
        type: boolean
        default: false

# Serialize deploys; never cancel one mid-flight (a half-applied helm upgrade).
concurrency:
  group: dal2alpha-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Lane a (primary BuildKit pod) -- unchanged default.
  BUILDKIT_HOST: tcp://buildkitd.buildkit.svc:1234
  # Lane b (optional second BuildKit pod, e.g. tcp://buildkitd-1.buildkit.svc:1234). Set the repo
  # variable BUILDKIT_HOST_B once the pod exists; unset/empty = single endpoint (lane b folds into a).
  BUILDKIT_HOST_B: ${{ vars.BUILDKIT_HOST_B }}
  IMAGE_PREFIX: ghcr.io/penguintechinc/waddles

jobs:
  # alpha-<epoch64> (five-tier convention), computed ONCE so every matrix leg and
  # the deploy job share the same tag. No GitHub API call: the stock ARC runner
  # image ships no `gh`, and a bare GITHUB_TOKEN here has no `actions: read`.
  # A "re-run failed jobs" keeps this job's output, so the tag stays stable.
  prepare:
    name: Compute alpha tag
    if: github.repository == 'penguintechinc/waddles' && github.ref == 'refs/heads/release/v3.0.X'
    runs-on: dal2-alpha
    permissions: {}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Compute alpha tag
        id: tag
        run: |
          set -euo pipefail
          EPOCH="$(date -u +%s)"
          [[ "${EPOCH}" =~ ^[0-9]{10,}$ ]] || { echo "::error::could not derive epoch (got '${EPOCH}')" >&2; exit 1; }
          echo "tag=alpha-${EPOCH}" >> "$GITHUB_OUTPUT"
          echo "alpha tag: alpha-${EPOCH}"


  # Decide BUILD vs REUSE per image (scripts/ci/alpha_plan.py). Reads only: the Helm release
  # values (same ServiceAccount access `helm upgrade` already needs) and ghcr image labels
  # (GITHUB_TOKEN, packages: read). No new secrets.
  plan:
    name: Plan changed images
    needs: prepare
    if: github.repository == 'penguintechinc/waddles' && github.ref == 'refs/heads/release/v3.0.X'
    runs-on: dal2-alpha
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      build_count: ${{ steps.plan.outputs.build_count }}
      retag_count: ${{ steps.plan.outputs.retag_count }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Checkout code (full history for per-image diffs)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.13'

      - name: Install plan dependencies (hash-pinned)
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r scripts/ci/requirements-alpha-plan.txt

      - name: Install helm and kubectl
        uses: ./.github/actions/install-deploy-tools

      # Also the lane-a preflight: bootstrapping the remote driver connects to buildkitd and
      # lists its workers (the buildctl-debug-workers equivalent) -- an unreachable primary
      # fails here, loudly, before anything is built.
      - name: Set up Docker Buildx (remote buildkitd, lane a)
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4
        with:
          driver: remote
          endpoint: ${{ env.BUILDKIT_HOST }}

      - name: Log in to ghcr.io
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read deployed Helm release values
        env:
          RELEASE: waddlebot
          NAMESPACE: waddlebot
        run: |
          set -euo pipefail
          # A missing release (first deploy) or unreadable values is NOT fatal: the plan
          # treats it as "unknown deployed state" and builds every image (fail safe).
          if helm get values "${RELEASE}" -n "${NAMESPACE}" -o json > "${RUNNER_TEMP}/helm-values.json" 2> "${RUNNER_TEMP}/helm-values.err"; then
            echo "read release values: $(wc -c < "${RUNNER_TEMP}/helm-values.json") bytes"
          else
            echo "::warning::could not read Helm values ($(head -c 300 "${RUNNER_TEMP}/helm-values.err")); every image will be built"
            echo null > "${RUNNER_TEMP}/helm-values.json"
          fi

      - name: Plan (BUILD vs REUSE per image)
        id: plan
        env:
          FORCE_ALL: ${{ inputs.force_all }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/ci/alpha_plan.py plan \
            --head "${GITHUB_SHA}" \
            --tag "${TAG}" \
            --registry "${IMAGE_PREFIX}" \
            --helm-values "${RUNNER_TEMP}/helm-values.json" \
            --endpoint-a "${BUILDKIT_HOST}" \
            --endpoint-b "${BUILDKIT_HOST_B}" \
            --out "${RUNNER_TEMP}/plan.json"

  build:
    name: Build ${{ matrix.service }}
    needs: [prepare, plan]
    # Only the images the plan marked BUILD; skipped entirely when none changed.
    if: github.repository == 'penguintechinc/waddles' && github.ref == 'refs/heads/release/v3.0.X' && needs.plan.outputs.build_count != '0'
    runs-on: dal2-alpha
    permissions:
      contents: read
      packages: write
    strategy:
      # false: one failed image must not cancel the others, so a single run
      # surfaces every broken build. Deploy still requires all builds green.
      fail-fast: false
      # Pure fromJSON matrix from scripts/ci/image-inputs.yaml (never mixed with a static include).
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      # Lane endpoint comes from the plan (lane a primary; lane b second pod, or lane a when b is
      # unset/unreachable). Bootstrapping the remote driver fails loudly if the endpoint is down.
      - name: Set up Docker Buildx (remote buildkitd, ${{ matrix.buildkit_host }})
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4
        with:
          driver: remote
          endpoint: ${{ matrix.buildkit_host }}

      - name: Log in to ghcr.io
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-contexts: ${{ matrix.extra_ctx }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ needs.prepare.outputs.tag }}${{ matrix.suffix }}
          # The revision label is how the NEXT run finds this image's last-built commit.
          labels: org.opencontainers.image.revision=${{ github.sha }}
          # ONE fixed cache ref per image, overwritten every build (mode=max): the registry
          # holds exactly one cache manifest per image, never per-run cache tags. Survives the
          # dal2 runner's docker prune.
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/buildcache/${{ matrix.service }}:alpha
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/buildcache/${{ matrix.service }}:alpha,mode=max,image-manifest=true,oci-mediatypes=true

  # REUSE images: copy the deployed manifest to the new alpha tag by digest (registry-side, no
  # rebuild) and verify digest equality. Keeps a complete alpha-<epoch> set per image.
  retag:
    name: Retag unchanged images
    needs: [prepare, plan]
    if: github.repository == 'penguintechinc/waddles' && github.ref == 'refs/heads/release/v3.0.X' && needs.plan.outputs.retag_count != '0'
    runs-on: dal2-alpha
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci
            .github/actions

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.13'

      - name: Install plan dependencies (hash-pinned)
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r scripts/ci/requirements-alpha-plan.txt

      - name: Set up Docker Buildx (remote buildkitd, lane a)
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4
        with:
          driver: remote
          endpoint: ${{ env.BUILDKIT_HOST }}

      - name: Log in to ghcr.io
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag reused images (digest-verified)
        env:
          PLAN_JSON: ${{ needs.plan.outputs.plan }}
        run: |
          set -euo pipefail
          printf '%s' "${PLAN_JSON}" > "${RUNNER_TEMP}/plan.json"
          python3 scripts/ci/alpha_plan.py retag --plan "${RUNNER_TEMP}/plan.json"

  deploy:
    name: Deploy to dal2-alpha
    needs: [prepare, plan, build, retag]
    # build/retag are legitimately skipped when nothing needs them; any failure or cancel blocks deploy.
    if: ${{ !cancelled() && github.repository == 'penguintechinc/waddles' && github.ref == 'refs/heads/release/v3.0.X' && needs.plan.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.build.result) && contains(fromJSON('["success","skipped"]'), needs.retag.result) }}
    runs-on: dal2-alpha
    # Creates/updates the GitHub Environment + Deployment; job failure = failure status.
    environment:
      name: dal2-alpha
      url: https://waddlebot.dal2a.penguintech.cloud
    permissions:
      contents: read
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      PLAN_JSON: ${{ needs.plan.outputs.plan }}
      RELEASE: waddlebot
      NAMESPACE: waddlebot
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Install helm and kubectl
        uses: ./.github/actions/install-deploy-tools

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.13'

      - name: Install plan dependencies (hash-pinned)
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r scripts/ci/requirements-alpha-plan.txt

      - name: Write per-image Helm values from the plan
        run: |
          set -euo pipefail
          printf '%s' "${PLAN_JSON}" > "${RUNNER_TEMP}/plan.json"
          python3 scripts/ci/alpha_plan.py helm-values --plan "${RUNNER_TEMP}/plan.json" --out "${RUNNER_TEMP}/image-tags.json"

      - name: Helm upgrade
        run: |
          set -euo pipefail
          # Kube access: the runner pod's in-cluster ServiceAccount (no kubeconfig).
          # Namespace is pre-created (runner RBAC has namespaceCreate:false).
          [ -n "${TAG}" ] || { echo "::error::empty image tag from build job" >&2; exit 1; }
          helm version --short
          helm lint k8s/helm/waddlebot -f k8s/helm/waddlebot/values-alpha.yaml -f k8s/helm/waddlebot/values-dal2alpha.yaml -f "${RUNNER_TEMP}/image-tags.json" --set-string "global.imageTag=${TAG}"
          helm upgrade --install "${RELEASE}" k8s/helm/waddlebot \
            --namespace "${NAMESPACE}" \
            -f k8s/helm/waddlebot/values-alpha.yaml \
            -f k8s/helm/waddlebot/values-dal2alpha.yaml \
            -f "${RUNNER_TEMP}/image-tags.json" \
            --set-string "global.imageTag=${TAG}" \
            --wait --timeout 15m

      - name: Smoke test (count-verified)
        run: |
          set -euo pipefail
          # 1. every Deployment fully available; denominator must be > 0.
          mapfile -t ROWS < <(kubectl -n "${NAMESPACE}" get deploy -o jsonpath='{range .items[*]}{.metadata.name} {.spec.replicas} {.status.readyReplicas}{"\n"}{end}')
          TOTAL="${#ROWS[@]}"; BAD=0
          for r in "${ROWS[@]}"; do
            read -r name want got <<< "${r}"
            want="${want:-0}"; got="${got:-0}"
            if [ "${want}" != "${got}" ]; then echo "NOT READY: ${name} want=${want} ready=${got}" >&2; BAD=$((BAD+1)); fi
          done
          echo "deployments examined=${TOTAL} not_ready=${BAD}"
          [ "${TOTAL}" -gt 0 ] || { echo "::error::zero Deployments examined" >&2; exit 1; }
          [ "${BAD}" -eq 0 ] || exit 1

          # 2. no non-Running/non-Succeeded pods; examine count > 0.
          PODS="$(kubectl -n "${NAMESPACE}" get pods --no-headers | wc -l)"
          PBAD="$(kubectl -n "${NAMESPACE}" get pods --no-headers --field-selector=status.phase!=Running,status.phase!=Succeeded | wc -l)"
          echo "pods examined=${PODS} bad=${PBAD}"
          [ "${PODS}" -gt 0 ] && [ "${PBAD}" -eq 0 ] || exit 1

          # 3. every long-lived Deployment runs exactly its planned image (rebuilt -> new tag,
          #    reused -> its old tag); examined count must equal the planned set, > 0.
          kubectl -n "${NAMESPACE}" get deploy -o jsonpath='{range .items[*]}{.spec.template.spec.containers[*].image}{"\n"}{end}' \
            | python3 scripts/ci/alpha_plan.py verify --plan "${RUNNER_TEMP}/plan.json" --registry "${IMAGE_PREFIX}"

          # 4. real health + readiness check against hub-api (HTTP 200 required).
          PORT="$(kubectl -n "${NAMESPACE}" get deploy "${RELEASE}-hub-api-v3" -o jsonpath='{.spec.template.spec.containers[?(@.name=="hub-api")].ports[?(@.name=="http")].containerPort}')"
          [ -n "${PORT}" ] || { echo "::error::hub-api http port not found" >&2; exit 1; }
          for p in /health /ready; do
            kubectl -n "${NAMESPACE}" exec "deploy/${RELEASE}-hub-api-v3" -c hub-api -- \
              python -c "import sys,urllib.request as u; r=u.urlopen('http://127.0.0.1:${PORT}${p}',timeout=10); print('${p}',r.status); sys.exit(0 if r.status==200 else 1)"
          done

name: Go lint + vuln gates

# Runs golangci-lint and govulncheck against every Go module with a toolchain
# new enough for the module's `go` directive. Both tools must be built with a Go
# >= the module's go.mod version or they crash on load; the previous count-based
# gate read that crash as "0 findings, PASS". Here exit status propagates, and
# the module count is printed so zero modules examined is a failure.

on:
  pull_request:
  merge_group:
    types: [checks_requested]
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Path gate (release PRs only): shared detector, fails closed. A job skipped
  # here means "not affected"; main PRs / pushes / dispatch run everything.
  changes:
    name: Detect changed areas
    runs-on: ${{ ((github.event_name == 'pull_request' && github.base_ref != 'main' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'merge_group' && !endsWith(github.event.merge_group.base_ref, '/main')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && 'dal2-alpha-ci' || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      match: ${{ steps.paths.outputs.match }}
    steps:
      - name: Checkout (change classifier only)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: |
            scripts/ci
            .github/actions
      - name: Classify changed paths
        id: paths
        uses: ./.github/actions/changed-paths
        with:
          area: none
          globs: |
            core/module_rtc/**
            .github/workflows/go-gates.yml

  go-gates:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.match == 'true') }}
    name: golangci-lint + govulncheck (Go 1.26)
    runs-on: ${{ ((github.event_name == 'pull_request' && github.base_ref != 'main' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'merge_group' && !endsWith(github.event.merge_group.base_ref, '/main')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && 'dal2-alpha-ci' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false

      - name: Install lint/vuln tools (built with the pinned toolchain)
        run: |
          set -euo pipefail
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          golangci-lint --version
          govulncheck -version

      - name: Run gates (exit status propagates; zero modules is a failure)
        run: |
          set -euo pipefail
          mods=$(find . -name go.mod -not -path '*/node_modules/*' -not -path './.git/*' -not -path '*/vendor/*')
          n=$(printf '%s\n' "$mods" | grep -c . || true)
          echo "Go modules examined: ${n}"
          if [ "${n}" -eq 0 ]; then
            echo "::error::no go.mod found - refusing to report a pass on zero modules"
            exit 1
          fi
          for mod in $mods; do
            dir=$(dirname "$mod")
            echo "=== ${dir}: golangci-lint ==="
            (cd "$dir" && golangci-lint run ./...)
            echo "=== ${dir}: govulncheck ==="
            (cd "$dir" && govulncheck ./...)
          done

name: Rust tool-invoke-e2e (real-path bundle tool.invoke harness)

# core/tool_invoke_e2e links svc-process (the stage: the real `handle_tool`
# gate/matrix/guards + nested invoke) and bundle-executor (the real wasmtime
# executor) into one process and drives real componentized caller/provider
# bundles end to end (bundle-MCP-tools P3b). It path-depends on both crates and
# the shared policy crate, so a change in ANY re-runs it.

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'core/tool_invoke_e2e/**'
      - 'core/test_support/**'
      - 'core/svc_process/**'
      - 'core/bundle_tool_call/**'
      - 'core/bundle_active_set/**'
      - 'core/bundle_capability_gate/**'
      - 'wit/waddle-bundle/**'
      - 'sdk/waddle-sdk-rs/**'
      - 'core/bundle_executor/**'
      - '.github/workflows/rust-tool-invoke-e2e.yml'
      - '.github/workflows/rust-crate-ci.yml'
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path gate (release PRs only): shared detector, fails closed. A job skipped
  # here means "not affected"; main PRs / pushes / dispatch run everything.
  changes:
    name: Detect changed areas
    runs-on: ${{ ((github.event_name == 'pull_request' && github.base_ref != 'main') || (github.event_name == 'merge_group' && !endsWith(github.event.merge_group.base_ref, '/main')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && 'dal2-alpha' || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      match: ${{ steps.paths.outputs.match }}
    steps:
      - name: Checkout (change classifier only)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: |
            scripts/ci
            .github/actions
      - name: Classify changed paths
        id: paths
        uses: ./.github/actions/changed-paths
        with:
          area: rust
          globs: |
            core/tool_invoke_e2e/**
            core/test_support/**
            core/svc_process/**
            core/bundle_tool_call/**
            core/bundle_active_set/**
            core/bundle_capability_gate/**
            wit/waddle-bundle/**
            sdk/waddle-sdk-rs/**
            core/bundle_executor/**

  lint-test:
    needs: changes
    # Main-only tier: skipped on PRs into release/** (see scripts/ci/ci-gate-tier.py)
    if: ${{ (github.event_name != 'pull_request' || github.base_ref == 'main') && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.match == 'true') }}
    name: fmt + clippy + deny + coverage
    uses: ./.github/workflows/rust-crate-ci.yml
    with:
      crate_name: tool-invoke-e2e
      working_directory: core/tool_invoke_e2e
      # ring/aws-lc-sys need a C/C++ toolchain; cmake for aws-lc-sys.
      # protoc: this crate reaches hub_client (via svc-process), whose
      # build.rs runs tonic-prost-build and fails without protoc.
      extra_apt_packages: 'cmake build-essential protobuf-compiler'
      extra_apt_reason: 'for aws-lc-sys/ring (cmake, C/C++ toolchain) + hub_client (protoc)'

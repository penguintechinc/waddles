name: Rust bundle-host-kv (lint + test)

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'core/bundle_host_kv/**'
      - '.github/workflows/rust-bundle-host-kv.yml'
      - '.github/workflows/rust-crate-ci.yml'
  pull_request:
    branches: [main, 'release/**']
    paths:
      - 'core/bundle_host_kv/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-test:
    name: fmt + clippy + deny + coverage
    uses: ./.github/workflows/rust-crate-ci.yml
    with:
      crate_name: bundle-host-kv
      working_directory: core/bundle_host_kv
      # `tests/valkey_integration.rs` starts a real Valkey container via
      # `testcontainers` -- needs Docker, which `ubuntu-latest` ships.

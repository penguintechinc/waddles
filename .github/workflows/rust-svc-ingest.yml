name: Rust svc-ingest (lint + test)

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'core/svc_ingest/**'
      - 'core/discord_mentions/**'
      - 'core/hub_client/**'
      - 'proto/**'
      - '.github/workflows/rust-svc-ingest.yml'
      - '.github/workflows/rust-crate-ci.yml'
      - 'hub_api/tests/live/**'
      - 'scripts/ci/twitch-sessions-live.sh'
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path gate (release PRs only): shared detector, fails closed. A job skipped
  # here means "not affected"; main PRs / pushes / dispatch run everything.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      match: ${{ steps.paths.outputs.match }}
    steps:
      - name: Checkout (change classifier only)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: |
            scripts/ci
            .github/actions
      - name: Classify changed paths
        id: paths
        uses: ./.github/actions/changed-paths
        with:
          area: rust
          globs: |
            core/svc_ingest/**
            core/discord_mentions/**
            core/hub_client/**
            proto/**

  lint-test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.match == 'true') }}
    name: fmt + clippy + deny + coverage
    uses: ./.github/workflows/rust-crate-ci.yml
    with:
      crate_name: svc-ingest
      working_directory: core/svc_ingest
      # The lease + real-socket + live-hub tests fail loudly without a real Valkey.
      valkey: true
      # protoc is needed by hub_client's build.rs (tonic-prost-build), a path dependency
      # for the Discord platform-user detokenizer.
      extra_apt_packages: protobuf-compiler
      extra_apt_reason: 'for hub_client (protoc)'

  # Per-community Twitch sessions against a REAL hub-api + Postgres + Valkey + IRC test server
  # (scripts/ci/twitch-sessions-live.sh -- fails on zero tests run / zero telemetry).
  twitch-live:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.match == 'true') }}
    name: twitch sessions live e2e (real hub-api)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.13'

      - name: Install hub-api + flask_core deps (hash-verified)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/hub-venv"
          "$RUNNER_TEMP/hub-venv/bin/pip" install --require-hashes -r hub_api/requirements-dev.txt
          "$RUNNER_TEMP/hub-venv/bin/pip" install --require-hashes -r libs/flask_core/requirements.txt

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable branch snapshot
        with:
          toolchain: "1.97.1"

      - name: Setup build deps (C toolchain, cmake, protoc)
        uses: ./.github/actions/setup-build-deps
        with:
          packages: 'cmake build-essential protobuf-compiler'
      - name: Live e2e (starts its own Valkey + Postgres containers)
        env:
          HUB_PYTHON: ${{ runner.temp }}/hub-venv/bin/python
        run: |
          set -euo pipefail
          helm version --short
          make test-svc-ingest-twitch-live

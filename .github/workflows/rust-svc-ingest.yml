name: Rust svc-ingest (lint + test)

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'core/svc_ingest/**'
      - '.github/workflows/rust-svc-ingest.yml'
      - '.github/workflows/rust-crate-ci.yml'
  pull_request:
    branches: [main, 'release/**']
    paths:
      - 'core/svc_ingest/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    name: fmt + clippy + deny + coverage
    uses: ./.github/workflows/rust-crate-ci.yml
    with:
      crate_name: svc-ingest
      working_directory: core/svc_ingest

name: Container Builds

on:
  push:
    branches: [main, 'v*', 'release/**', 'feature/**', 'fix/**', 'chore/**', 'hotfix/**', 'docs/**', 'refactor/**']
    paths:
      - 'admin/hub_module/**'
      - 'hub_api/**'
      - 'libs/flask_core/**'
      - 'migrations/**'
      - 'docker-compose.yml'
      - '.version'
      - '.github/workflows/containers.yml'
  pull_request:
    branches: [main, 'v*', 'release/**', 'feature/**', 'fix/**', 'chore/**', 'hotfix/**', 'docs/**', 'refactor/**']
  merge_group:
    types: [checks_requested]
    branches: ['release/**']
  release:
    types: [released, prereleased]
  workflow_dispatch:

concurrency:
  group: containers-${{ github.event.merge_group.head_sha || github.head_ref || github.ref }}
  cancel-in-progress: true

# Least privilege at workflow level; write scopes are granted per job below.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # TEMPORARY amd64-only (user-approved 2026-10-03). Re-enable arm64 near
  # release / for the mixed-arch Minisforum alpha cluster by setting
  # BUILD_PLATFORMS=linux/amd64,linux/arm64 (this is the single toggle --
  # every build-*.yml workflow that builds images keys off the same name).
  BUILD_PLATFORMS: linux/amd64

jobs:
  # Determine version and tag suffix
  determine-version:
    name: Determine Version and Tags
    runs-on: ${{ ((github.event_name == 'pull_request' && github.base_ref != 'main' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'merge_group' && !endsWith(github.event.merge_group.base_ref, '/main')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && 'dal2-alpha-ci' || 'ubuntu-latest' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      suffix: ${{ steps.version.outputs.suffix }}
      is_release: ${{ steps.version.outputs.is_release }}
      multi_arch: ${{ steps.version.outputs.multi_arch }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Determine version and suffix
        id: version
        run: |
          set -euo pipefail
          # Five-tier tag scheme (devops.md CI/CD Tag Naming) -- tier -> tag -> trigger:
          #   alpha : any non-release branch push / dispatch -> alpha-<epoch>
          #   beta  : push to release/v*.X (or main)         -> beta-<epoch>
          #   gamma : GitHub release flagged pre-release     -> gamma-<epoch>   (release: prereleased)
          #   prod  : GitHub release published as release    -> v{Major}.{Minor}.{Patch} + latest (release: released)
          # <epoch> = unix seconds, computed once here so every matrix job shares it.
          # .version is NOT used for tags. `suffix` is kept (always empty) so
          # downstream ${version}${suffix} references keep resolving.
          EPOCH="$(date +%s)"
          IS_RELEASE=false
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            ACTION="$(jq -r '.action' "$GITHUB_EVENT_PATH")"
            case "$ACTION" in
              released)
                SEMVER_RE='^v[0-9]+\.[0-9]+\.[0-9]+$'
                if ! [[ "$GITHUB_REF_NAME" =~ $SEMVER_RE ]]; then
                  echo "::error::release tag '$GITHUB_REF_NAME' is not v{Major}.{Minor}.{Patch}" >&2
                  exit 1
                fi
                TAG="$GITHUB_REF_NAME"
                IS_RELEASE=true
                ;;
              prereleased)
                TAG="gamma-${EPOCH}"
                ;;
              *)
                echo "::error::unsupported release action '$ACTION'" >&2
                exit 1
                ;;
            esac
          elif [[ "$GITHUB_REF" == refs/heads/release/v* ]] || [ "$GITHUB_REF" = "refs/heads/main" ]; then
            TAG="beta-${EPOCH}"
          else
            TAG="alpha-${EPOCH}"
          fi
          {
            echo "version=${TAG}"
            echo "suffix="
            echo "is_release=${IS_RELEASE}"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${TAG} (release=${IS_RELEASE})"

          # Derive the multi_arch flag from the single BUILD_PLATFORMS toggle
          # (env, top of file). A comma means more than one platform is
          # requested -- restore arm64 by flipping that one value back to
          # "linux/amd64,linux/arm64". (The per-module build matrix itself is
          # computed dynamically by detect-changes's "Build module matrix"
          # step -- see gh-577: a static `include:` + dynamic `exclude:`
          # sibling resolves to zero matrix jobs.)
          if [[ "${BUILD_PLATFORMS}" == *,* ]]; then
            echo "multi_arch=true" >> "$GITHUB_OUTPUT"
          else
            echo "multi_arch=false" >> "$GITHUB_OUTPUT"
          fi

  # Detect changed modules
  detect-changes:
    name: Detect Changed Modules
    runs-on: ${{ ((github.event_name == 'pull_request' && github.base_ref != 'main' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'merge_group' && !endsWith(github.event.merge_group.base_ref, '/main')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && 'dal2-alpha-ci' || 'ubuntu-latest' }}
    outputs:
      hub: ${{ steps.changes.outputs.hub }}
      libs: ${{ steps.changes.outputs.libs }}
      migrations: ${{ steps.changes.outputs.migrations }}
      # Shared by build-platform and build-pr (their include lists are
      # identical) -- see the "Build module matrix" step below for why this
      # is computed here instead of as a static include: + dynamic exclude:.
      matrix: ${{ steps.build-matrix.outputs.matrix }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4
        id: changes
        with:
          filters: |
            hub:
              - 'admin/hub_module/**'
              - 'hub_api/**'
              - 'libs/**'
            libs:
              - 'libs/**'
            migrations:
              - 'migrations/**'

      - name: Build module matrix
        id: build-matrix
        # Emits the complete build-platform/build-pr matrix (identical
        # include list shared by both jobs) as one JSON object instead of a
        # static `include:` list plus a dynamic `exclude: ${{ fromJSON(...) }}`
        # sibling -- that combination resolves to zero matrix jobs, see
        # gh-577. Each module's `condition` is resolved here (from this
        # job's own change-detection outputs) because a baked JSON string
        # can't carry a live `${{ }}` expression the way the old static
        # YAML could. arm64 entries are included/dropped per BUILD_PLATFORMS
        # (env, top of file) exactly like the single-module build-*.yml
        # workflows. Docs: https://docs.github.com/actions/how-tos/write-workflows/choose-what-workflows-do/run-variations-of-jobs-in-a-workflow#defining-a-matrix-dynamically
        env:
          MIGRATIONS: ${{ steps.changes.outputs.migrations }}
          HUB: ${{ steps.changes.outputs.hub }}
          LIBS: ${{ steps.changes.outputs.libs }}
          # workflow_dispatch and release (gamma/prod) must still force-build every module -- the
          # unconditional-emit filter below (gh#ci-mergegroup-optimization)
          # would otherwise drop every module on a manual run with no real
          # file changes, same as the step-level `|| github.event_name ==
          # 'workflow_dispatch'` guards used throughout this workflow.
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [[ "$BUILD_PLATFORMS" == *,* ]]; then
            ARCHES=(amd64 arm64)
          else
            ARCHES=(amd64)
          fi

          # name|changed-flag-var|dockerfile|port
          MODULES=(
            "migrations|$MIGRATIONS|./migrations/Dockerfile|0"
            "hub-api|$HUB|./hub_api/Dockerfile|8060"
            "hub-webui|$HUB|./admin/hub_module/Dockerfile.webui|8080"
          )

          ENTRIES="[]"
          for m in "${MODULES[@]}"; do
            IFS='|' read -r NAME CHANGED DOCKERFILE PORT <<< "$m"
            if [ "$CHANGED" = "true" ] || [ "$LIBS" = "true" ] || [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "release" ]; then
              CONDITION="true"
            else
              CONDITION="false"
            fi
            # Only emit entries for modules that actually changed (or when
            # libs/** changed, which affects every module) -- an unchanged
            # module previously still got a full matrix entry per arch here,
            # guarded only by the step-level `matrix.condition == 'true'`
            # checks below, so it still spawned a job/check-run that did
            # nothing (gh#ci-mergegroup-optimization). Skipping the entry
            # entirely removes that always-present job for every unchanged
            # module instead of just no-opping its steps.
            if [ "$CONDITION" != "true" ]; then
              continue
            fi
            for ARCH in "${ARCHES[@]}"; do
              if [ "$ARCH" = "amd64" ]; then
                PLATFORM="linux/amd64"
                RUNNER="ubuntu-latest"
              else
                PLATFORM="linux/arm64"
                RUNNER="ubuntu-24.04-arm"
              fi
              ENTRIES=$(jq -c -n \
                --argjson entries "$ENTRIES" \
                --arg module "$NAME" \
                --arg platform "$PLATFORM" \
                --arg runner "$RUNNER" \
                --arg condition "$CONDITION" \
                --arg dockerfile "$DOCKERFILE" \
                --argjson port "$PORT" \
                '$entries + [{"module":$module,"platform":$platform,"runner":$runner,"condition":$condition,"dockerfile":$dockerfile,"context":".","port":$port}]')
            done
          done

          MATRIX=$(jq -c -n --argjson include "$ENTRIES" '{"include":$include}')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  # ============================================================
  # Build Docker images — parallel multi-arch
  # ============================================================
  # Push-path only -- pull_request/merge_group is handled entirely by
  # build-pr below so packages:write is never granted to a job building
  # an untrusted PR's Dockerfile (gh-476).
  build-platform:
    name: Build ${{ matrix.module }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: [determine-version, detect-changes]
    permissions:
      contents: read
      packages: write  # GHCR push of per-arch images (build-push-action)
    if: >
      (github.ref == 'refs/heads/main' || github.event_name == 'release' || github.event_name == 'workflow_dispatch') &&
      github.event_name != 'pull_request' &&
      github.event_name != 'merge_group' &&
      (needs.detect-changes.outputs.migrations == 'true' ||
      needs.detect-changes.outputs.hub == 'true' ||
      needs.detect-changes.outputs.libs == 'true' ||
      (github.event_name == 'workflow_dispatch' || github.event_name == 'release'))
    strategy:
      fail-fast: false
      # Whole matrix object computed by detect-changes (see that job's
      # "Build module matrix" step) -- a static `include:` plus dynamic
      # `exclude:` resolved to zero jobs, see gh-577.
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      # Native per-arch builds (amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm)
      # require no QEMU emulation. Docker setup is gated on matrix.condition so
      # unchanged modules don't pull tooling from Docker Hub only to skip the build.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4
        if: matrix.condition == 'true' || (github.event_name == 'workflow_dispatch' || github.event_name == 'release')

      - name: Log in to Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        if: >
          (matrix.condition == 'true' || (github.event_name == 'workflow_dispatch' || github.event_name == 'release')) &&
          github.event_name != 'pull_request' &&
          github.event_name != 'merge_group'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract platform suffix
        id: platform-suffix
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          PLATFORM_SUFFIX="${PLATFORM#linux/}"
          echo "suffix=${PLATFORM_SUFFIX}" >> "$GITHUB_OUTPUT"

      # Single-platform builds (BUILD_PLATFORMS has no comma) skip this
      # module's merge-manifests entry entirely, so this step must also
      # publish the plain (and, on release, :latest) tag that job would
      # otherwise create -- a single-arch build ends up pushing a normal
      # image, never a manifest list. (No-op for build-pr, which never
      # pushes -- push: false there regardless of this tag list.)
      - name: Compute image tags
        id: tags
        if: matrix.condition == 'true' || (github.event_name == 'workflow_dispatch' || github.event_name == 'release')
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.module }}
          VERSION: ${{ needs.determine-version.outputs.version }}${{ needs.determine-version.outputs.suffix }}
          IS_RELEASE: ${{ needs.determine-version.outputs.is_release }}
          MULTI_ARCH: ${{ needs.determine-version.outputs.multi_arch }}
          ARCH_SUFFIX: ${{ steps.platform-suffix.outputs.suffix }}
        run: |
          TAGS="${IMAGE}:${VERSION}-${ARCH_SUFFIX}"
          if [ "${MULTI_ARCH}" != "true" ]; then
            TAGS=$(printf '%s\n%s' "$TAGS" "${IMAGE}:${VERSION}")
            if [ "${IS_RELEASE}" = "true" ]; then
              TAGS=$(printf '%s\n%s' "$TAGS" "${IMAGE}:latest")
            fi
          fi
          {
            echo "list<<TAGEOF"
            echo "${TAGS}"
            echo "TAGEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7
        if: matrix.condition == 'true' || (github.event_name == 'workflow_dispatch' || github.event_name == 'release')
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          load: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && matrix.platform == 'linux/amd64' }}
          tags: ${{ steps.tags.outputs.list }}
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.module }}-${{ steps.platform-suffix.outputs.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}-${{ steps.platform-suffix.outputs.suffix }}
          build-args: |
            MODULE_NAME=${{ matrix.module }}
            MODULE_PORT=${{ matrix.port }}

      # Gated (non-masked) Trivy scan against the image this job just loaded
      # locally -- PR/merge_group never reach merge-manifests (skipped, see
      # that job's `if:`), so without this the push-path's
      # security-scan job (scanner/pull failures fail it; findings stay advisory) is the only scan these
      # events would otherwise get, and it doesn't run on PR either. This
      # step is what actually gates a PR on HIGH/CRITICAL findings.
      - name: Trivy vulnerability scan (gated, local image)
        if: >
          (matrix.condition == 'true' || (github.event_name == 'workflow_dispatch' || github.event_name == 'release')) &&
          (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
          matrix.platform == 'linux/amd64'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.69.3
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.module }}:${{ needs.determine-version.outputs.version }}${{ needs.determine-version.outputs.suffix }}-amd64
          format: 'table'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Run container tests
        if: >
          (matrix.condition == 'true' || (github.event_name == 'workflow_dispatch' || github.event_name == 'release')) &&
          matrix.port != 0 &&
          ((github.event_name != 'pull_request' && github.event_name != 'merge_group') ||
          matrix.platform == 'linux/amd64')
        env:
          MODULE: ${{ matrix.module }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.module }}:${{ needs.determine-version.outputs.version }}${{ needs.determine-version.outputs.suffix }}-${{ steps.platform-suffix.outputs.suffix }}
          PORT: ${{ matrix.port }}
        # Boot-and-health smoke test. Logs are preserved on failure (no --rm);
        # hub-api gets a Postgres sidecar, hub-webui gets HUB_API_URL -- see script header.
        run: scripts/ci/container-smoke.sh "$MODULE" "$IMAGE_REF" "$PORT"

  # PR/merge_group path: same matrix, amd64-only effective work (steps
  # below already gate on matrix.platform == 'linux/amd64' for PR), no
  # registry write scope -- see build-platform's comment above.
  build-pr:
    name: Build ${{ matrix.module }} (${{ matrix.platform }}) [PR]
    runs-on: ${{ matrix.runner }}
    needs: [determine-version, detect-changes]
    permissions:
      contents: read
    if: >
      (github.ref == 'refs/heads/main' || github.event_name == 'release' || github.event_name == 'workflow_dispatch') &&
      (github.event_name == 'pull_request' ||
      github.event_name == 'merge_group') &&
      (needs.detect-changes.outputs.migrations == 'true' ||
      needs.detect-changes.outputs.hub == 'true' ||
      needs.detect-changes.outputs.libs == 'true' ||
      (github.event_name == 'workflow_dispatch' || github.event_name == 'release'))
    strategy:
      fail-fast: false
      # Whole matrix object computed by detect-changes (see that job's
      # "Build module matrix" step) -- a static `include:` plus dynamic
      # `exclude:` resolved to zero jobs, see gh-577.
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      # Native per-arch builds (amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm)
      # require no QEMU emulation. Docker setup is gated on matrix.condition so
      # unchanged modules don't pull tooling from Docker Hub only to skip the build.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4
        if: matrix.condition == 'true' || (github.event_name == 'workflow_dispatch' || github.event_name == 'release')

      - name: Log in to Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        if: >
          (matrix.condition == 'true' || (github.event_name == 'workflow_dispatch' || github.event_name == 'release')) &&
          github.event_name != 'pull_request' &&
          github.event_name != 'merge_group'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract platform suffix
        id: platform-suffix
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          PLATFORM_SUFFIX="${PLATFORM#linux/}"
          echo "suffix=${PLATFORM_SUFFIX}" >> "$GITHUB_OUTPUT"

      # Single-platform builds (BUILD_PLATFORMS has no comma) skip this
      # module's merge-manifests entry entirely, so this step must also
      # publish the plain (and, on release, :latest) tag that job would
      # otherwise create -- a single-arch build ends up pushing a normal
      # image, never a manifest list. (No-op for build-pr, which never
      # pushes -- push: false there regardless of this tag list.)
      - name: Compute image tags
        id: tags
        if: matrix.condition == 'true' || (github.event_name == 'workflow_dispatch' || github.event_name == 'release')
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.module }}
          VERSION: ${{ needs.determine-version.outputs.version }}${{ needs.determine-version.outputs.suffix }}
          IS_RELEASE: ${{ needs.determine-version.outputs.is_release }}
          MULTI_ARCH: ${{ needs.determine-version.outputs.multi_arch }}
          ARCH_SUFFIX: ${{ steps.platform-suffix.outputs.suffix }}
        run: |
          TAGS="${IMAGE}:${VERSION}-${ARCH_SUFFIX}"
          if [ "${MULTI_ARCH}" != "true" ]; then
            TAGS=$(printf '%s\n%s' "$TAGS" "${IMAGE}:${VERSION}")
            if [ "${IS_RELEASE}" = "true" ]; then
              TAGS=$(printf '%s\n%s' "$TAGS" "${IMAGE}:latest")
            fi
          fi
          {
            echo "list<<TAGEOF"
            echo "${TAGS}"
            echo "TAGEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7
        if: matrix.condition == 'true' || (github.event_name == 'workflow_dispatch' || github.event_name == 'release')
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          load: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && matrix.platform == 'linux/amd64' }}
          tags: ${{ steps.tags.outputs.list }}
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.module }}-${{ steps.platform-suffix.outputs.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}-${{ steps.platform-suffix.outputs.suffix }}
          build-args: |
            MODULE_NAME=${{ matrix.module }}
            MODULE_PORT=${{ matrix.port }}

      # Gated (non-masked) Trivy scan against the image this job just loaded
      # locally -- PR/merge_group never reach merge-manifests (skipped, see
      # that job's `if:`), so without this the push-path's
      # security-scan job (scanner/pull failures fail it; findings stay advisory) is the only scan these
      # events would otherwise get, and it doesn't run on PR either. This
      # step is what actually gates a PR on HIGH/CRITICAL findings.
      - name: Trivy vulnerability scan (gated, local image)
        if: >
          (matrix.condition == 'true' || (github.event_name == 'workflow_dispatch' || github.event_name == 'release')) &&
          (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
          matrix.platform == 'linux/amd64'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.69.3
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.module }}:${{ needs.determine-version.outputs.version }}${{ needs.determine-version.outputs.suffix }}-amd64
          format: 'table'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Run container tests
        if: >
          (matrix.condition == 'true' || (github.event_name == 'workflow_dispatch' || github.event_name == 'release')) &&
          matrix.port != 0 &&
          ((github.event_name != 'pull_request' && github.event_name != 'merge_group') ||
          matrix.platform == 'linux/amd64')
        env:
          MODULE: ${{ matrix.module }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.module }}:${{ needs.determine-version.outputs.version }}${{ needs.determine-version.outputs.suffix }}-${{ steps.platform-suffix.outputs.suffix }}
          PORT: ${{ matrix.port }}
        # Boot-and-health smoke test. Logs are preserved on failure (no --rm);
        # hub-api gets a Postgres sidecar, hub-webui gets HUB_API_URL -- see script header.
        run: scripts/ci/container-smoke.sh "$MODULE" "$IMAGE_REF" "$PORT"

  # ============================================================
  # Merge multi-arch manifests
  # ============================================================
  merge-manifests:
    name: Merge ${{ matrix.name }} Manifest
    runs-on: ubuntu-latest
    needs: [determine-version, detect-changes, build-platform]
    permissions:
      contents: read
      packages: write  # GHCR push of multi-arch manifest lists (imagetools create)
    # No-ops cleanly when BUILD_PLATFORMS is amd64-only -- build-platform's
    # "Compute image tags" step already pushed the plain/:latest tags
    # directly per module in that case, so there is nothing to merge.
    if: >
      (github.ref == 'refs/heads/main' || github.event_name == 'release' || github.event_name == 'workflow_dispatch') &&
      github.event_name != 'pull_request' &&
      github.event_name != 'merge_group' &&
      needs.determine-version.outputs.multi_arch == 'true' &&
      (needs.detect-changes.outputs.migrations == 'true' ||
      needs.detect-changes.outputs.hub == 'true' ||
      needs.detect-changes.outputs.libs == 'true' ||
      (github.event_name == 'workflow_dispatch' || github.event_name == 'release'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: migrations
            condition: ${{ needs.detect-changes.outputs.migrations == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - name: hub-api
            condition: ${{ needs.detect-changes.outputs.hub == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - name: hub-webui
            condition: ${{ needs.detect-changes.outputs.hub == 'true' || needs.detect-changes.outputs.libs == 'true' }}
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Create and push multi-arch manifest
        if: matrix.condition == 'true' || (github.event_name == 'workflow_dispatch' || github.event_name == 'release')
        env:
          VERSION: "${{ needs.determine-version.outputs.version }}${{ needs.determine-version.outputs.suffix }}"
          IS_RELEASE: ${{ needs.determine-version.outputs.is_release }}
          IMAGE: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.name }}"
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"

          if [ "$IS_RELEASE" = "true" ]; then
            docker buildx imagetools create \
              -t "${IMAGE}:latest" \
              "${IMAGE}:${VERSION}-amd64" \
              "${IMAGE}:${VERSION}-arm64"
          fi

  # ============================================================
  # Supply-chain self-test: proves scripts/ci/supply-chain.sh signs, attests and
  # verifies against a throwaway local registry (key-based, ephemeral keys) and that
  # its negative cases fail. Runs on every event -- needs no secrets.
  # ============================================================
  supply-chain-selftest:
    name: Supply-chain self-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2

      - name: Run supply-chain self-test
        run: scripts/ci/test-supply-chain.sh

  # ============================================================
  # Supply chain: sign, SBOM-attest and SLSA-attest every released image digest,
  # then fail-closed verify. Push path only -- id-token/attestations write must never
  # be granted to a job that builds untrusted PR code. Signs the digest that
  # ${VERSION} resolves to (manifest list for multi-arch). See docs/SUPPLY_CHAIN.md.
  # ============================================================
  supply-chain:
    name: Supply chain ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [determine-version, detect-changes, build-platform, merge-manifests, supply-chain-selftest]
    if: >
      (github.ref == 'refs/heads/main' || github.event_name == 'release' || github.event_name == 'workflow_dispatch') &&
      always() &&
      github.event_name != 'pull_request' &&
      github.event_name != 'merge_group' &&
      needs.build-platform.result == 'success' &&
      needs.supply-chain-selftest.result == 'success' &&
      (needs.merge-manifests.result == 'success' || needs.merge-manifests.result == 'skipped')
    permissions:
      contents: read
      packages: write        # push cosign signatures/attestations next to the image in GHCR
      id-token: write        # keyless Sigstore signing identity (GitHub OIDC -> Fulcio)
      attestations: write    # SLSA build provenance (actions/attest-build-provenance)
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: hub-api
            condition: ${{ needs.detect-changes.outputs.hub == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - image: hub-webui
            condition: ${{ needs.detect-changes.outputs.hub == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - image: migrations
            condition: ${{ needs.detect-changes.outputs.migrations == 'true' || needs.detect-changes.outputs.libs == 'true' }}
    steps:
      - name: Checkout code
        if: matrix.condition == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        if: matrix.condition == 'true'
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Log in to Container Registry
        if: matrix.condition == 'true'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        if: matrix.condition == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Install syft
        if: matrix.condition == 'true'
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2

      - name: Resolve released image digest
        id: digest
        if: matrix.condition == 'true'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image }}
          VERSION: ${{ needs.determine-version.outputs.version }}${{ needs.determine-version.outputs.suffix }}
        run: |
          set -euo pipefail
          DIGEST="$(scripts/ci/supply-chain.sh digest "$IMAGE" "$VERSION")"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "signing ${IMAGE}@${DIGEST}"

      - name: Sign image (keyless cosign)
        if: matrix.condition == 'true'
        env:
          REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image }}@${{ steps.digest.outputs.digest }}
        run: scripts/ci/supply-chain.sh sign "$REF"

      - name: Generate SBOM (SPDX, syft)
        if: matrix.condition == 'true'
        env:
          REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image }}@${{ steps.digest.outputs.digest }}
        run: scripts/ci/supply-chain.sh sbom "$REF" "$RUNNER_TEMP/sbom.spdx.json"

      - name: Attest SBOM (cosign SPDX attestation)
        if: matrix.condition == 'true'
        env:
          REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image }}@${{ steps.digest.outputs.digest }}
        run: scripts/ci/supply-chain.sh attest "$REF" "$RUNNER_TEMP/sbom.spdx.json"

      - name: Attest SLSA build provenance
        if: matrix.condition == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Verify signature, SBOM and provenance (fail-closed)
        if: matrix.condition == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image }}@${{ steps.digest.outputs.digest }}
        run: scripts/ci/supply-chain.sh verify "$REF"

  # ============================================================
  # Security scanning
  # Security scan is GATING: a Trivy/registry/SARIF-upload failure fails this
  # job (no job-level continue-on-error). Trivy itself still reports findings
  # without failing (action default exit-code 0); only a scanner that cannot
  # run, or an image that cannot be pulled, turns the job red.
  # ============================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [determine-version, detect-changes, merge-manifests]
    permissions:
      contents: read
      packages: read  # pull scanned images from GHCR
      security-events: write  # SARIF upload to code scanning (upload-sarif)
    # merge-manifests is intentionally skipped (not failed) when
    # BUILD_PLATFORMS is amd64-only -- the plain tag this scans still
    # exists (pushed directly by build-platform in that case), so tolerate
    # "skipped" the same as "success".
    if: >
      (github.ref == 'refs/heads/main' || github.event_name == 'release' || github.event_name == 'workflow_dispatch') &&
      always() &&
      (needs.merge-manifests.result == 'success' || needs.merge-manifests.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        # Mirror the build/merge gating: only scan modules that were actually
        # built and merged this run. Unchanged modules have no merged manifest,
        # so scanning them would fail with MANIFEST_UNKNOWN.
        include:
          - image: hub-api
            condition: ${{ needs.detect-changes.outputs.hub == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - image: hub-webui
            condition: ${{ needs.detect-changes.outputs.hub == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - image: migrations
            condition: ${{ needs.detect-changes.outputs.migrations == 'true' || needs.detect-changes.outputs.libs == 'true' }}
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        if: matrix.condition == 'true' || (github.event_name == 'workflow_dispatch' || github.event_name == 'release')
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        if: matrix.condition == 'true' || (github.event_name == 'workflow_dispatch' || github.event_name == 'release')
        with:
          version: v0.69.3
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image }}:${{ needs.determine-version.outputs.version }}${{ needs.determine-version.outputs.suffix }}
          format: 'sarif'
          output: 'trivy-${{ matrix.image }}.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225  # v4
        if: matrix.condition == 'true' || (github.event_name == 'workflow_dispatch' || github.event_name == 'release')
        with:
          sarif_file: 'trivy-${{ matrix.image }}.sarif'

  # ============================================================
  # Notify on completion
  # ============================================================
  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: [determine-version, build-platform, merge-manifests]
    if: always()
    steps:
      - name: Build Status Summary
        env:
          PLATFORM_RESULT: ${{ needs.build-platform.result }}
          MANIFEST_RESULT: ${{ needs.merge-manifests.result }}
        run: |
          {
            echo "## Container Build Summary"
            echo "| Component | Status |"
            echo "|-----------|--------|"
            echo "| Platform Builds | ${PLATFORM_RESULT} |"
            echo "| Manifest Merge | ${MANIFEST_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"

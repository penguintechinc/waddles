name: Container Builds

on:
  push:
    branches: [main, 'v*', 'release/**', 'feature/**', 'fix/**', 'chore/**', 'hotfix/**', 'docs/**', 'refactor/**']
    tags: [ 'v*' ]
    paths:
      - 'processing/router_module/**'
      - 'trigger/receiver/**'
      - 'action/interactive/**'
      - 'action/pushing/**'
      - 'action/security/**'
      - 'core/**'
      - 'admin/hub_module/**'
      - 'admin/marketplace_module/**'
      - 'services/**'
      - 'libs/flask_core/**'
      - 'migrations/**'
      - 'docker-compose.yml'
      - '.version'
      - '.github/workflows/containers.yml'
  pull_request:
    branches: [main, 'v*', 'release/**', 'feature/**', 'fix/**', 'chore/**', 'hotfix/**', 'docs/**', 'refactor/**']
  merge_group:
    types: [checks_requested]
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # TEMPORARY amd64-only (user-approved 2026-10-03). Re-enable arm64 near
  # release / for the mixed-arch Minisforum alpha cluster by setting
  # BUILD_PLATFORMS=linux/amd64,linux/arm64 (this is the single toggle --
  # every build-*.yml workflow that builds images keys off the same name).
  BUILD_PLATFORMS: linux/amd64

jobs:
  # Determine version and tag suffix
  determine-version:
    name: Determine Version and Tags
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      suffix: ${{ steps.version.outputs.suffix }}
      is_release: ${{ steps.version.outputs.is_release }}
      multi_arch: ${{ steps.version.outputs.multi_arch }}
      matrix_exclude: ${{ steps.version.outputs.matrix_exclude }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 2

      - name: Determine version and suffix
        id: version
        run: |
          # Read version from .version file
          if [ -f .version ]; then
            VERSION=$(cat .version | tr -d '[:space:]')
          else
            VERSION="0.0.0"
          fi

          echo "version=v${VERSION}" >> $GITHUB_OUTPUT

          # Determine suffix based on ref type
          # Tagged push (v*) = release + latest
          # Release branch (v*.x) or PR from one = beta
          # Main branch push = gamma (pre-release)
          # Everything else = alpha
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            SUFFIX=""
            echo "suffix=" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "Building RELEASE: v${VERSION} and latest"
          elif [[ "${{ github.ref }}" == refs/heads/v* ]] || [[ "${{ github.head_ref }}" == v* ]]; then
            SUFFIX="-beta"
            echo "suffix=-beta" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "Building BETA: v${VERSION}-beta"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            SUFFIX="-gamma"
            echo "suffix=-gamma" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "Building GAMMA (pre-release): v${VERSION}-gamma"
          else
            SUFFIX="-alpha"
            echo "suffix=-alpha" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "Building ALPHA: v${VERSION}-alpha"
          fi

          # Derive the matrix exclude list + multi_arch flag from the single
          # BUILD_PLATFORMS toggle (env, top of file). A comma means more
          # than one platform is requested -- restore arm64 by flipping that
          # one value back to "linux/amd64,linux/arm64".
          if [[ "${BUILD_PLATFORMS}" == *,* ]]; then
            echo "multi_arch=true" >> $GITHUB_OUTPUT
            echo "matrix_exclude=[]" >> $GITHUB_OUTPUT
          else
            echo "multi_arch=false" >> $GITHUB_OUTPUT
            echo 'matrix_exclude=[{"platform":"linux/arm64"}]' >> $GITHUB_OUTPUT
          fi

  # Detect changed modules
  detect-changes:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      router: ${{ steps.changes.outputs.router }}
      marketplace: ${{ steps.changes.outputs.marketplace }}
      hub: ${{ steps.changes.outputs.hub }}
      trigger-streaming: ${{ steps.changes.outputs.trigger-streaming }}
      trigger-webhooks: ${{ steps.changes.outputs.trigger-webhooks }}
      interactive-social: ${{ steps.changes.outputs.interactive-social }}
      interactive-gaming: ${{ steps.changes.outputs.interactive-gaming }}
      interactive-media: ${{ steps.changes.outputs.interactive-media }}
      interactive-productivity: ${{ steps.changes.outputs.interactive-productivity }}
      core-data: ${{ steps.changes.outputs.core-data }}
      core-identity: ${{ steps.changes.outputs.core-identity }}
      core-community: ${{ steps.changes.outputs.core-community }}
      action-platforms: ${{ steps.changes.outputs.action-platforms }}
      action-serverless: ${{ steps.changes.outputs.action-serverless }}
      libs: ${{ steps.changes.outputs.libs }}
      migrations: ${{ steps.changes.outputs.migrations }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 2

      - name: Detect changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4
        id: changes
        with:
          filters: |
            router:
              - 'processing/router_module/**'
              - 'libs/**'
            marketplace:
              - 'admin/marketplace_module/**'
              - 'libs/**'
            hub:
              - 'admin/hub_module/**'
              - 'libs/**'
            trigger-streaming:
              - 'services/trigger-streaming/**'
              - 'trigger/receiver/twitch_module/**'
              - 'trigger/receiver/youtube_live_module/**'
              - 'trigger/receiver/kick_module_flask/**'
              - 'libs/**'
            trigger-webhooks:
              - 'services/trigger-webhooks/**'
              - 'trigger/receiver/slack_module/**'
              - 'trigger/receiver/teams_module/**'
              - 'trigger/receiver/mattermost_module/**'
              - 'trigger/receiver/googlechat_module/**'
              - 'libs/**'
            interactive-social:
              - 'services/interactive-social/**'
              - 'action/interactive/alias_interaction_module/**'
              - 'action/interactive/shoutout_interaction_module/**'
              - 'action/interactive/presence_module/**'
              - 'action/interactive/quote_interaction_module/**'
              - 'libs/**'
            interactive-gaming:
              - 'services/interactive-gaming/**'
              - 'action/interactive/lfg_interaction_module/**'
              - 'action/interactive/inventory_interaction_module/**'
              - 'action/interactive/server_manager_interaction_module/**'
              - 'action/interactive/server_status_interaction_module/**'
              - 'libs/**'
            interactive-media:
              - 'services/interactive-media/**'
              - 'action/interactive/clip_interaction_module/**'
              - 'action/interactive/spotify_interaction_module/**'
              - 'action/interactive/youtube_music_interaction_module/**'
              - 'libs/**'
            interactive-productivity:
              - 'services/interactive-productivity/**'
              - 'action/interactive/calendar_interaction_module/**'
              - 'action/interactive/memories_interaction_module/**'
              - 'action/interactive/translate_interaction_module/**'
              - 'libs/**'
            core-data:
              - 'services/core-data/**'
              - 'core/analytics_core_module/**'
              - 'core/engagement_module/**'
              - 'core/reputation_module/**'
              - 'core/labels_core_module/**'
              - 'libs/**'
            core-identity:
              - 'services/core-identity/**'
              - 'core/identity_core_module/**'
              - 'core/security_core_module/**'
              - 'core/credential_manager_module/**'
              - 'libs/**'
            core-community:
              - 'services/core-community/**'
              - 'core/community_module/**'
              - 'core/workflow_core_module/**'
              - 'core/browser_source_core_module/**'
              - 'core/video_proxy_module/**'
              - 'core/module_rtc/**'
              - 'libs/**'
            action-platforms:
              - 'services/action-platforms/**'
              - 'action/pushing/slack_action_module/**'
              - 'action/pushing/teams_action_module/**'
              - 'action/pushing/mattermost_action_module/**'
              - 'action/pushing/googlechat_action_module/**'
              - 'action/pushing/twitch_action_module/**'
              - 'action/pushing/youtube_action_module/**'
              - 'libs/**'
            action-serverless:
              - 'services/action-serverless/**'
              - 'action/pushing/lambda_action_module/**'
              - 'action/pushing/openwhisk_action_module/**'
              - 'action/pushing/gcp_functions_action_module/**'
              - 'libs/**'
            libs:
              - 'libs/**'
            migrations:
              - 'migrations/**'

  # ============================================================
  # Build Docker images — parallel multi-arch
  # ============================================================
  # Push-path only -- pull_request/merge_group is handled entirely by
  # build-pr below so packages:write is never granted to a job building
  # an untrusted PR's Dockerfile (gh-476).
  build-platform:
    name: Build ${{ matrix.module }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: [determine-version, detect-changes]
    permissions:
      contents: read
      packages: write
    if: >
      github.event_name != 'pull_request' &&
      github.event_name != 'merge_group' &&
      (needs.detect-changes.outputs.router == 'true' ||
      needs.detect-changes.outputs.marketplace == 'true' ||
      needs.detect-changes.outputs.migrations == 'true' ||
      needs.detect-changes.outputs.core-data == 'true' ||
      needs.detect-changes.outputs.core-identity == 'true' ||
      needs.detect-changes.outputs.core-community == 'true' ||
      needs.detect-changes.outputs.trigger-streaming == 'true' ||
      needs.detect-changes.outputs.trigger-webhooks == 'true' ||
      needs.detect-changes.outputs.interactive-social == 'true' ||
      needs.detect-changes.outputs.interactive-gaming == 'true' ||
      needs.detect-changes.outputs.interactive-media == 'true' ||
      needs.detect-changes.outputs.interactive-productivity == 'true' ||
      needs.detect-changes.outputs.hub == 'true' ||
      needs.detect-changes.outputs.action-platforms == 'true' ||
      needs.detect-changes.outputs.action-serverless == 'true' ||
      needs.detect-changes.outputs.libs == 'true' ||
      github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          # Core modules
          - module: router
            platform: linux/amd64
            runner: ubuntu-latest
            condition: ${{ needs.detect-changes.outputs.router == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./processing/router_module/Dockerfile
            context: .
            port: 0
          - module: router
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            condition: ${{ needs.detect-changes.outputs.router == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./processing/router_module/Dockerfile
            context: .
            port: 0

          - module: marketplace
            platform: linux/amd64
            runner: ubuntu-latest
            condition: ${{ needs.detect-changes.outputs.marketplace == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./admin/marketplace_module/Dockerfile
            context: .
            port: 0
          - module: marketplace
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            condition: ${{ needs.detect-changes.outputs.marketplace == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./admin/marketplace_module/Dockerfile
            context: .
            port: 0

          - module: migrations
            platform: linux/amd64
            runner: ubuntu-latest
            condition: ${{ needs.detect-changes.outputs.migrations == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./migrations/Dockerfile
            context: .
            port: 0
          - module: migrations
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            condition: ${{ needs.detect-changes.outputs.migrations == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./migrations/Dockerfile
            context: .
            port: 0

          - module: core-data
            platform: linux/amd64
            runner: ubuntu-latest
            condition: ${{ needs.detect-changes.outputs.core-data == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/core-data/Dockerfile
            context: .
            port: 0
          - module: core-data
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            condition: ${{ needs.detect-changes.outputs.core-data == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/core-data/Dockerfile
            context: .
            port: 0

          - module: core-identity
            platform: linux/amd64
            runner: ubuntu-latest
            condition: ${{ needs.detect-changes.outputs.core-identity == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/core-identity/Dockerfile
            context: .
            port: 0
          - module: core-identity
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            condition: ${{ needs.detect-changes.outputs.core-identity == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/core-identity/Dockerfile
            context: .
            port: 0

          - module: core-community
            platform: linux/amd64
            runner: ubuntu-latest
            condition: ${{ needs.detect-changes.outputs.core-community == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/core-community/Dockerfile
            context: .
            port: 0
          - module: core-community
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            condition: ${{ needs.detect-changes.outputs.core-community == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/core-community/Dockerfile
            context: .
            port: 0

          # Trigger modules
          - module: trigger-streaming
            platform: linux/amd64
            runner: ubuntu-latest
            condition: ${{ needs.detect-changes.outputs.trigger-streaming == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/trigger-streaming/Dockerfile
            context: .
            port: 0
          - module: trigger-streaming
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            condition: ${{ needs.detect-changes.outputs.trigger-streaming == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/trigger-streaming/Dockerfile
            context: .
            port: 0

          - module: trigger-webhooks
            platform: linux/amd64
            runner: ubuntu-latest
            condition: ${{ needs.detect-changes.outputs.trigger-webhooks == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/trigger-webhooks/Dockerfile
            context: .
            port: 0
          - module: trigger-webhooks
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            condition: ${{ needs.detect-changes.outputs.trigger-webhooks == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/trigger-webhooks/Dockerfile
            context: .
            port: 0

          # Interactive modules
          - module: interactive-social
            platform: linux/amd64
            runner: ubuntu-latest
            condition: ${{ needs.detect-changes.outputs.interactive-social == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/interactive-social/Dockerfile
            context: .
            port: 0
          - module: interactive-social
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            condition: ${{ needs.detect-changes.outputs.interactive-social == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/interactive-social/Dockerfile
            context: .
            port: 0

          - module: interactive-gaming
            platform: linux/amd64
            runner: ubuntu-latest
            condition: ${{ needs.detect-changes.outputs.interactive-gaming == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/interactive-gaming/Dockerfile
            context: .
            port: 0
          - module: interactive-gaming
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            condition: ${{ needs.detect-changes.outputs.interactive-gaming == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/interactive-gaming/Dockerfile
            context: .
            port: 0

          - module: interactive-media
            platform: linux/amd64
            runner: ubuntu-latest
            condition: ${{ needs.detect-changes.outputs.interactive-media == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/interactive-media/Dockerfile
            context: .
            port: 0
          - module: interactive-media
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            condition: ${{ needs.detect-changes.outputs.interactive-media == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/interactive-media/Dockerfile
            context: .
            port: 0

          - module: interactive-productivity
            platform: linux/amd64
            runner: ubuntu-latest
            condition: ${{ needs.detect-changes.outputs.interactive-productivity == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/interactive-productivity/Dockerfile
            context: .
            port: 0
          - module: interactive-productivity
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            condition: ${{ needs.detect-changes.outputs.interactive-productivity == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/interactive-productivity/Dockerfile
            context: .
            port: 0

          # Admin modules
          - module: hub-api
            platform: linux/amd64
            runner: ubuntu-latest
            condition: ${{ needs.detect-changes.outputs.hub == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./admin/hub_module/Dockerfile
            context: .
            port: 8060
          - module: hub-api
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            condition: ${{ needs.detect-changes.outputs.hub == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./admin/hub_module/Dockerfile
            context: .
            port: 8060

          - module: hub-webui
            platform: linux/amd64
            runner: ubuntu-latest
            condition: ${{ needs.detect-changes.outputs.hub == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./admin/hub_module/Dockerfile.webui
            context: .
            port: 8080
          - module: hub-webui
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            condition: ${{ needs.detect-changes.outputs.hub == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./admin/hub_module/Dockerfile.webui
            context: .
            port: 8080

          # Action modules
          - module: action-platforms
            platform: linux/amd64
            runner: ubuntu-latest
            condition: ${{ needs.detect-changes.outputs.action-platforms == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/action-platforms/Dockerfile
            context: .
            port: 0
          - module: action-platforms
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            condition: ${{ needs.detect-changes.outputs.action-platforms == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/action-platforms/Dockerfile
            context: .
            port: 0

          - module: action-serverless
            platform: linux/amd64
            runner: ubuntu-latest
            condition: ${{ needs.detect-changes.outputs.action-serverless == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/action-serverless/Dockerfile
            context: .
            port: 0
          - module: action-serverless
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            condition: ${{ needs.detect-changes.outputs.action-serverless == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/action-serverless/Dockerfile
            context: .
            port: 0
        # Matches every include entry with platform: linux/arm64 regardless
        # of module -- pruned to [] when BUILD_PLATFORMS has >1 entry. See
        # the toggle's comment at the top of this file.
        exclude: ${{ fromJSON(needs.determine-version.outputs.matrix_exclude) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      # Native per-arch builds (amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm)
      # require no QEMU emulation. Docker setup is gated on matrix.condition so
      # unchanged modules don't pull tooling from Docker Hub only to skip the build.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4
        if: matrix.condition == 'true' || github.event_name == 'workflow_dispatch'

      - name: Log in to Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        if: >
          (matrix.condition == 'true' || github.event_name == 'workflow_dispatch') &&
          github.event_name != 'pull_request' &&
          github.event_name != 'merge_group'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract platform suffix
        id: platform-suffix
        run: |
          PLATFORM_SUFFIX=$(echo "${{ matrix.platform }}" | sed 's|linux/||')
          echo "suffix=${PLATFORM_SUFFIX}" >> $GITHUB_OUTPUT

      # Single-platform builds (BUILD_PLATFORMS has no comma) skip this
      # module's merge-manifests entry entirely, so this step must also
      # publish the plain (and, on release, :latest) tag that job would
      # otherwise create -- a single-arch build ends up pushing a normal
      # image, never a manifest list. (No-op for build-pr, which never
      # pushes -- push: false there regardless of this tag list.)
      - name: Compute image tags
        id: tags
        if: matrix.condition == 'true' || github.event_name == 'workflow_dispatch'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.module }}
          VERSION: ${{ needs.determine-version.outputs.version }}${{ needs.determine-version.outputs.suffix }}
          IS_RELEASE: ${{ needs.determine-version.outputs.is_release }}
          MULTI_ARCH: ${{ needs.determine-version.outputs.multi_arch }}
          ARCH_SUFFIX: ${{ steps.platform-suffix.outputs.suffix }}
        run: |
          TAGS="${IMAGE}:${VERSION}-${ARCH_SUFFIX}"
          if [ "${MULTI_ARCH}" != "true" ]; then
            TAGS=$(printf '%s\n%s' "$TAGS" "${IMAGE}:${VERSION}")
            if [ "${IS_RELEASE}" = "true" ]; then
              TAGS=$(printf '%s\n%s' "$TAGS" "${IMAGE}:latest")
            fi
          fi
          {
            echo "list<<TAGEOF"
            echo "${TAGS}"
            echo "TAGEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7
        if: matrix.condition == 'true' || github.event_name == 'workflow_dispatch'
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          load: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && matrix.platform == 'linux/amd64' }}
          tags: ${{ steps.tags.outputs.list }}
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.module }}-${{ steps.platform-suffix.outputs.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}-${{ steps.platform-suffix.outputs.suffix }}
          build-args: |
            MODULE_NAME=${{ matrix.module }}
            MODULE_PORT=${{ matrix.port }}

      # Gated (non-masked) Trivy scan against the image this job just loaded
      # locally -- PR/merge_group never reach merge-manifests (skipped, see
      # that job's `if:`), so without this the push-path's informational-only
      # security-scan job (continue-on-error: true) is the only scan these
      # events would otherwise get, and it doesn't run on PR either. This
      # step is what actually gates a PR on HIGH/CRITICAL findings.
      - name: Trivy vulnerability scan (gated, local image)
        if: >
          (matrix.condition == 'true' || github.event_name == 'workflow_dispatch') &&
          (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
          matrix.platform == 'linux/amd64'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.69.3
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.module }}:${{ needs.determine-version.outputs.version }}${{ needs.determine-version.outputs.suffix }}-amd64
          format: 'table'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Run container tests
        if: >
          (matrix.condition == 'true' || github.event_name == 'workflow_dispatch') &&
          matrix.port != 0 &&
          ((github.event_name != 'pull_request' && github.event_name != 'merge_group') ||
          matrix.platform == 'linux/amd64')
        run: |
          docker run --rm --name test-${{ matrix.module }} -d -p ${{ matrix.port }}:${{ matrix.port }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.module }}:${{ needs.determine-version.outputs.version }}${{ needs.determine-version.outputs.suffix }}-${{ steps.platform-suffix.outputs.suffix }}
          sleep 10
          if curl -f http://localhost:${{ matrix.port }}/health; then
            echo "Health check passed for ${{ matrix.module }}"
          else
            echo "Health check failed for ${{ matrix.module }}"
            exit 1
          fi
          docker stop test-${{ matrix.module }}

  # PR/merge_group path: same matrix, amd64-only effective work (steps
  # below already gate on matrix.platform == 'linux/amd64' for PR), no
  # registry write scope -- see build-platform's comment above.
  build-pr:
    name: Build ${{ matrix.module }} (${{ matrix.platform }}) [PR]
    runs-on: ${{ matrix.runner }}
    needs: [determine-version, detect-changes]
    permissions:
      contents: read
    if: >
      (github.event_name == 'pull_request' ||
      github.event_name == 'merge_group') &&
      (needs.detect-changes.outputs.router == 'true' ||
      needs.detect-changes.outputs.marketplace == 'true' ||
      needs.detect-changes.outputs.migrations == 'true' ||
      needs.detect-changes.outputs.core-data == 'true' ||
      needs.detect-changes.outputs.core-identity == 'true' ||
      needs.detect-changes.outputs.core-community == 'true' ||
      needs.detect-changes.outputs.trigger-streaming == 'true' ||
      needs.detect-changes.outputs.trigger-webhooks == 'true' ||
      needs.detect-changes.outputs.interactive-social == 'true' ||
      needs.detect-changes.outputs.interactive-gaming == 'true' ||
      needs.detect-changes.outputs.interactive-media == 'true' ||
      needs.detect-changes.outputs.interactive-productivity == 'true' ||
      needs.detect-changes.outputs.hub == 'true' ||
      needs.detect-changes.outputs.action-platforms == 'true' ||
      needs.detect-changes.outputs.action-serverless == 'true' ||
      needs.detect-changes.outputs.libs == 'true' ||
      github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          # Core modules
          - module: router
            platform: linux/amd64
            runner: ubuntu-latest
            condition: ${{ needs.detect-changes.outputs.router == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./processing/router_module/Dockerfile
            context: .
            port: 0
          - module: router
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            condition: ${{ needs.detect-changes.outputs.router == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./processing/router_module/Dockerfile
            context: .
            port: 0

          - module: marketplace
            platform: linux/amd64
            runner: ubuntu-latest
            condition: ${{ needs.detect-changes.outputs.marketplace == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./admin/marketplace_module/Dockerfile
            context: .
            port: 0
          - module: marketplace
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            condition: ${{ needs.detect-changes.outputs.marketplace == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./admin/marketplace_module/Dockerfile
            context: .
            port: 0

          - module: migrations
            platform: linux/amd64
            runner: ubuntu-latest
            condition: ${{ needs.detect-changes.outputs.migrations == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./migrations/Dockerfile
            context: .
            port: 0
          - module: migrations
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            condition: ${{ needs.detect-changes.outputs.migrations == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./migrations/Dockerfile
            context: .
            port: 0

          - module: core-data
            platform: linux/amd64
            runner: ubuntu-latest
            condition: ${{ needs.detect-changes.outputs.core-data == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/core-data/Dockerfile
            context: .
            port: 0
          - module: core-data
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            condition: ${{ needs.detect-changes.outputs.core-data == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/core-data/Dockerfile
            context: .
            port: 0

          - module: core-identity
            platform: linux/amd64
            runner: ubuntu-latest
            condition: ${{ needs.detect-changes.outputs.core-identity == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/core-identity/Dockerfile
            context: .
            port: 0
          - module: core-identity
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            condition: ${{ needs.detect-changes.outputs.core-identity == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/core-identity/Dockerfile
            context: .
            port: 0

          - module: core-community
            platform: linux/amd64
            runner: ubuntu-latest
            condition: ${{ needs.detect-changes.outputs.core-community == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/core-community/Dockerfile
            context: .
            port: 0
          - module: core-community
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            condition: ${{ needs.detect-changes.outputs.core-community == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/core-community/Dockerfile
            context: .
            port: 0

          # Trigger modules
          - module: trigger-streaming
            platform: linux/amd64
            runner: ubuntu-latest
            condition: ${{ needs.detect-changes.outputs.trigger-streaming == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/trigger-streaming/Dockerfile
            context: .
            port: 0
          - module: trigger-streaming
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            condition: ${{ needs.detect-changes.outputs.trigger-streaming == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/trigger-streaming/Dockerfile
            context: .
            port: 0

          - module: trigger-webhooks
            platform: linux/amd64
            runner: ubuntu-latest
            condition: ${{ needs.detect-changes.outputs.trigger-webhooks == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/trigger-webhooks/Dockerfile
            context: .
            port: 0
          - module: trigger-webhooks
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            condition: ${{ needs.detect-changes.outputs.trigger-webhooks == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/trigger-webhooks/Dockerfile
            context: .
            port: 0

          # Interactive modules
          - module: interactive-social
            platform: linux/amd64
            runner: ubuntu-latest
            condition: ${{ needs.detect-changes.outputs.interactive-social == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/interactive-social/Dockerfile
            context: .
            port: 0
          - module: interactive-social
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            condition: ${{ needs.detect-changes.outputs.interactive-social == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/interactive-social/Dockerfile
            context: .
            port: 0

          - module: interactive-gaming
            platform: linux/amd64
            runner: ubuntu-latest
            condition: ${{ needs.detect-changes.outputs.interactive-gaming == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/interactive-gaming/Dockerfile
            context: .
            port: 0
          - module: interactive-gaming
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            condition: ${{ needs.detect-changes.outputs.interactive-gaming == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/interactive-gaming/Dockerfile
            context: .
            port: 0

          - module: interactive-media
            platform: linux/amd64
            runner: ubuntu-latest
            condition: ${{ needs.detect-changes.outputs.interactive-media == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/interactive-media/Dockerfile
            context: .
            port: 0
          - module: interactive-media
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            condition: ${{ needs.detect-changes.outputs.interactive-media == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/interactive-media/Dockerfile
            context: .
            port: 0

          - module: interactive-productivity
            platform: linux/amd64
            runner: ubuntu-latest
            condition: ${{ needs.detect-changes.outputs.interactive-productivity == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/interactive-productivity/Dockerfile
            context: .
            port: 0
          - module: interactive-productivity
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            condition: ${{ needs.detect-changes.outputs.interactive-productivity == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/interactive-productivity/Dockerfile
            context: .
            port: 0

          # Admin modules
          - module: hub-api
            platform: linux/amd64
            runner: ubuntu-latest
            condition: ${{ needs.detect-changes.outputs.hub == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./admin/hub_module/Dockerfile
            context: .
            port: 8060
          - module: hub-api
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            condition: ${{ needs.detect-changes.outputs.hub == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./admin/hub_module/Dockerfile
            context: .
            port: 8060

          - module: hub-webui
            platform: linux/amd64
            runner: ubuntu-latest
            condition: ${{ needs.detect-changes.outputs.hub == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./admin/hub_module/Dockerfile.webui
            context: .
            port: 8080
          - module: hub-webui
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            condition: ${{ needs.detect-changes.outputs.hub == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./admin/hub_module/Dockerfile.webui
            context: .
            port: 8080

          # Action modules
          - module: action-platforms
            platform: linux/amd64
            runner: ubuntu-latest
            condition: ${{ needs.detect-changes.outputs.action-platforms == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/action-platforms/Dockerfile
            context: .
            port: 0
          - module: action-platforms
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            condition: ${{ needs.detect-changes.outputs.action-platforms == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/action-platforms/Dockerfile
            context: .
            port: 0

          - module: action-serverless
            platform: linux/amd64
            runner: ubuntu-latest
            condition: ${{ needs.detect-changes.outputs.action-serverless == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/action-serverless/Dockerfile
            context: .
            port: 0
          - module: action-serverless
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            condition: ${{ needs.detect-changes.outputs.action-serverless == 'true' || needs.detect-changes.outputs.libs == 'true' }}
            dockerfile: ./services/action-serverless/Dockerfile
            context: .
            port: 0
        # Matches every include entry with platform: linux/arm64 regardless
        # of module -- pruned to [] when BUILD_PLATFORMS has >1 entry. See
        # the toggle's comment at the top of this file.
        exclude: ${{ fromJSON(needs.determine-version.outputs.matrix_exclude) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      # Native per-arch builds (amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm)
      # require no QEMU emulation. Docker setup is gated on matrix.condition so
      # unchanged modules don't pull tooling from Docker Hub only to skip the build.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4
        if: matrix.condition == 'true' || github.event_name == 'workflow_dispatch'

      - name: Log in to Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        if: >
          (matrix.condition == 'true' || github.event_name == 'workflow_dispatch') &&
          github.event_name != 'pull_request' &&
          github.event_name != 'merge_group'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract platform suffix
        id: platform-suffix
        run: |
          PLATFORM_SUFFIX=$(echo "${{ matrix.platform }}" | sed 's|linux/||')
          echo "suffix=${PLATFORM_SUFFIX}" >> $GITHUB_OUTPUT

      # Single-platform builds (BUILD_PLATFORMS has no comma) skip this
      # module's merge-manifests entry entirely, so this step must also
      # publish the plain (and, on release, :latest) tag that job would
      # otherwise create -- a single-arch build ends up pushing a normal
      # image, never a manifest list. (No-op for build-pr, which never
      # pushes -- push: false there regardless of this tag list.)
      - name: Compute image tags
        id: tags
        if: matrix.condition == 'true' || github.event_name == 'workflow_dispatch'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.module }}
          VERSION: ${{ needs.determine-version.outputs.version }}${{ needs.determine-version.outputs.suffix }}
          IS_RELEASE: ${{ needs.determine-version.outputs.is_release }}
          MULTI_ARCH: ${{ needs.determine-version.outputs.multi_arch }}
          ARCH_SUFFIX: ${{ steps.platform-suffix.outputs.suffix }}
        run: |
          TAGS="${IMAGE}:${VERSION}-${ARCH_SUFFIX}"
          if [ "${MULTI_ARCH}" != "true" ]; then
            TAGS=$(printf '%s\n%s' "$TAGS" "${IMAGE}:${VERSION}")
            if [ "${IS_RELEASE}" = "true" ]; then
              TAGS=$(printf '%s\n%s' "$TAGS" "${IMAGE}:latest")
            fi
          fi
          {
            echo "list<<TAGEOF"
            echo "${TAGS}"
            echo "TAGEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7
        if: matrix.condition == 'true' || github.event_name == 'workflow_dispatch'
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          load: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && matrix.platform == 'linux/amd64' }}
          tags: ${{ steps.tags.outputs.list }}
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.module }}-${{ steps.platform-suffix.outputs.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}-${{ steps.platform-suffix.outputs.suffix }}
          build-args: |
            MODULE_NAME=${{ matrix.module }}
            MODULE_PORT=${{ matrix.port }}

      # Gated (non-masked) Trivy scan against the image this job just loaded
      # locally -- PR/merge_group never reach merge-manifests (skipped, see
      # that job's `if:`), so without this the push-path's informational-only
      # security-scan job (continue-on-error: true) is the only scan these
      # events would otherwise get, and it doesn't run on PR either. This
      # step is what actually gates a PR on HIGH/CRITICAL findings.
      - name: Trivy vulnerability scan (gated, local image)
        if: >
          (matrix.condition == 'true' || github.event_name == 'workflow_dispatch') &&
          (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
          matrix.platform == 'linux/amd64'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.69.3
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.module }}:${{ needs.determine-version.outputs.version }}${{ needs.determine-version.outputs.suffix }}-amd64
          format: 'table'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Run container tests
        if: >
          (matrix.condition == 'true' || github.event_name == 'workflow_dispatch') &&
          matrix.port != 0 &&
          ((github.event_name != 'pull_request' && github.event_name != 'merge_group') ||
          matrix.platform == 'linux/amd64')
        run: |
          docker run --rm --name test-${{ matrix.module }} -d -p ${{ matrix.port }}:${{ matrix.port }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.module }}:${{ needs.determine-version.outputs.version }}${{ needs.determine-version.outputs.suffix }}-${{ steps.platform-suffix.outputs.suffix }}
          sleep 10
          if curl -f http://localhost:${{ matrix.port }}/health; then
            echo "Health check passed for ${{ matrix.module }}"
          else
            echo "Health check failed for ${{ matrix.module }}"
            exit 1
          fi
          docker stop test-${{ matrix.module }}

  # ============================================================
  # Merge multi-arch manifests
  # ============================================================
  merge-manifests:
    name: Merge ${{ matrix.module }} Manifest
    runs-on: ubuntu-latest
    needs: [determine-version, detect-changes, build-platform]
    # No-ops cleanly when BUILD_PLATFORMS is amd64-only -- build-platform's
    # "Compute image tags" step already pushed the plain/:latest tags
    # directly per module in that case, so there is nothing to merge.
    if: >
      github.event_name != 'pull_request' &&
      github.event_name != 'merge_group' &&
      needs.determine-version.outputs.multi_arch == 'true' &&
      (needs.detect-changes.outputs.router == 'true' ||
      needs.detect-changes.outputs.marketplace == 'true' ||
      needs.detect-changes.outputs.migrations == 'true' ||
      needs.detect-changes.outputs.core-data == 'true' ||
      needs.detect-changes.outputs.core-identity == 'true' ||
      needs.detect-changes.outputs.core-community == 'true' ||
      needs.detect-changes.outputs.trigger-streaming == 'true' ||
      needs.detect-changes.outputs.trigger-webhooks == 'true' ||
      needs.detect-changes.outputs.interactive-social == 'true' ||
      needs.detect-changes.outputs.interactive-gaming == 'true' ||
      needs.detect-changes.outputs.interactive-media == 'true' ||
      needs.detect-changes.outputs.interactive-productivity == 'true' ||
      needs.detect-changes.outputs.hub == 'true' ||
      needs.detect-changes.outputs.action-platforms == 'true' ||
      needs.detect-changes.outputs.action-serverless == 'true' ||
      needs.detect-changes.outputs.libs == 'true' ||
      github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: router
            condition: ${{ needs.detect-changes.outputs.router == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - name: marketplace
            condition: ${{ needs.detect-changes.outputs.marketplace == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - name: migrations
            condition: ${{ needs.detect-changes.outputs.migrations == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - name: core-data
            condition: ${{ needs.detect-changes.outputs.core-data == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - name: core-identity
            condition: ${{ needs.detect-changes.outputs.core-identity == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - name: core-community
            condition: ${{ needs.detect-changes.outputs.core-community == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - name: trigger-streaming
            condition: ${{ needs.detect-changes.outputs.trigger-streaming == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - name: trigger-webhooks
            condition: ${{ needs.detect-changes.outputs.trigger-webhooks == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - name: interactive-social
            condition: ${{ needs.detect-changes.outputs.interactive-social == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - name: interactive-gaming
            condition: ${{ needs.detect-changes.outputs.interactive-gaming == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - name: interactive-media
            condition: ${{ needs.detect-changes.outputs.interactive-media == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - name: interactive-productivity
            condition: ${{ needs.detect-changes.outputs.interactive-productivity == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - name: hub-api
            condition: ${{ needs.detect-changes.outputs.hub == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - name: hub-webui
            condition: ${{ needs.detect-changes.outputs.hub == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - name: action-platforms
            condition: ${{ needs.detect-changes.outputs.action-platforms == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - name: action-serverless
            condition: ${{ needs.detect-changes.outputs.action-serverless == 'true' || needs.detect-changes.outputs.libs == 'true' }}
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Create and push multi-arch manifest
        if: matrix.condition == 'true' || github.event_name == 'workflow_dispatch'
        env:
          VERSION: "${{ needs.determine-version.outputs.version }}${{ needs.determine-version.outputs.suffix }}"
          IS_RELEASE: ${{ needs.determine-version.outputs.is_release }}
          IMAGE: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.name }}"
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"

          if [ "$IS_RELEASE" = "true" ]; then
            docker buildx imagetools create \
              -t "${IMAGE}:latest" \
              "${IMAGE}:${VERSION}-amd64" \
              "${IMAGE}:${VERSION}-arm64"
          fi

  # ============================================================
  # Security scanning
  # Security scan is informational only and does not block deployment
  # ============================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [determine-version, detect-changes, merge-manifests]
    # merge-manifests is intentionally skipped (not failed) when
    # BUILD_PLATFORMS is amd64-only -- the plain tag this scans still
    # exists (pushed directly by build-platform in that case), so tolerate
    # "skipped" the same as "success".
    if: >
      always() &&
      (needs.merge-manifests.result == 'success' || needs.merge-manifests.result == 'skipped')
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # Mirror the build/merge gating: only scan modules that were actually
        # built and merged this run. Unchanged modules have no merged manifest,
        # so scanning them would fail with MANIFEST_UNKNOWN.
        include:
          - image: router
            condition: ${{ needs.detect-changes.outputs.router == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - image: marketplace
            condition: ${{ needs.detect-changes.outputs.marketplace == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - image: hub-api
            condition: ${{ needs.detect-changes.outputs.hub == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - image: hub-webui
            condition: ${{ needs.detect-changes.outputs.hub == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - image: trigger-streaming
            condition: ${{ needs.detect-changes.outputs.trigger-streaming == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - image: trigger-webhooks
            condition: ${{ needs.detect-changes.outputs.trigger-webhooks == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - image: interactive-social
            condition: ${{ needs.detect-changes.outputs.interactive-social == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - image: interactive-gaming
            condition: ${{ needs.detect-changes.outputs.interactive-gaming == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - image: interactive-media
            condition: ${{ needs.detect-changes.outputs.interactive-media == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - image: interactive-productivity
            condition: ${{ needs.detect-changes.outputs.interactive-productivity == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - image: core-data
            condition: ${{ needs.detect-changes.outputs.core-data == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - image: core-identity
            condition: ${{ needs.detect-changes.outputs.core-identity == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - image: core-community
            condition: ${{ needs.detect-changes.outputs.core-community == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - image: action-platforms
            condition: ${{ needs.detect-changes.outputs.action-platforms == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - image: action-serverless
            condition: ${{ needs.detect-changes.outputs.action-serverless == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - image: migrations
            condition: ${{ needs.detect-changes.outputs.migrations == 'true' || needs.detect-changes.outputs.libs == 'true' }}
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        if: matrix.condition == 'true' || github.event_name == 'workflow_dispatch'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        if: matrix.condition == 'true' || github.event_name == 'workflow_dispatch'
        with:
          version: v0.69.3
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image }}:${{ needs.determine-version.outputs.version }}${{ needs.determine-version.outputs.suffix }}
          format: 'sarif'
          output: 'trivy-${{ matrix.image }}.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225  # v4
        if: matrix.condition == 'true' || github.event_name == 'workflow_dispatch'
        with:
          sarif_file: 'trivy-${{ matrix.image }}.sarif'

  # ============================================================
  # Create GitHub Release (only on tagged push)
  # ============================================================
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [determine-version, merge-manifests]
    # always() so a skipped merge-manifests (BUILD_PLATFORMS amd64-only)
    # doesn't implicitly block this job -- release tags still get created,
    # pointing at the plain tags build-platform pushed directly.
    if: >
      always() &&
      needs.determine-version.outputs.is_release == 'true' &&
      (needs.merge-manifests.result == 'success' || needs.merge-manifests.result == 'skipped')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.determine-version.outputs.version }}"

          # Check if release already exists
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "Release $VERSION already exists, skipping"
            exit 0
          fi

          # Create release notes
          cat << EOF > release_notes.md
          ## Release $VERSION

          **Container Images Built:**
          - All modules tagged with \`$VERSION\` and \`latest\`
          - Available at \`ghcr.io/${{ github.repository }}\`

          ### Changes

          See commit history for detailed changes since last release.

          ---
          *This release was automatically generated by the CI/CD pipeline.*
          EOF

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file release_notes.md \
            --target ${{ github.sha }}

          echo "Created release $VERSION"

  # ============================================================
  # Notify on completion
  # ============================================================
  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: [determine-version, merge-manifests]
    if: always()
    steps:
      - name: Build Status Summary
        run: |
          echo "## Container Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Platform Builds | ${{ needs.build-platform.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Manifest Merge | ${{ needs.merge-manifests.result }} |" >> $GITHUB_STEP_SUMMARY

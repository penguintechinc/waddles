name: Pull Request Validation

on:
  pull_request:
    branches: [main, 'v*', 'release/**', 'feature/**', 'fix/**', 'chore/**', 'hotfix/**', 'docs/**', 'refactor/**']
  merge_group:
    types: [checks_requested]
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  no-stubs-gate:
    name: No stubs / no silent fallbacks (check-no-stubs)
    runs-on: ubuntu-latest
    # Scope correction (user decision, devops.md Branch Backups): this gate
    # enforces ONLY on merges landing on release/* or main -- feature/fix/
    # chore/docs/etc. branches are exempt so WIP backup-pushes with a TODO
    # are never blocked. `github.base_ref` has no `refs/heads/` prefix on
    # pull_request events (merge_group.base_ref does, but merge_group here
    # is already scoped to release/** by this workflow's own trigger above,
    # so it's always a real release target). A PR targeting a feature/fix/
    # chore branch (e.g. a stacked PR) skips this job entirely -- skipped
    # is neither "failure" nor "pending" to ci-gate's poller, so it never
    # blocks that merge; the check still runs for real the moment the PR
    # (or the stack) targets release/* or main.
    if: >-
      github.event_name == 'merge_group' ||
      github.base_ref == 'main' ||
      startsWith(github.base_ref, 'release/')
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.13'

      # Pinned exact version (critical-rules.md Dependency Pinning) -- not
      # `semgrep` unpinned, not `p/ci` registry configs (no network rule
      # fetch, local config file only -- see scripts/ci/semgrep-silent-fallback.yml).
      # setuptools<81 pinned explicitly: semgrep 1.99.0 -> opentelemetry-
      # instrumentation-requests -> opentelemetry.instrumentation.dependencies
      # imports `pkg_resources` eagerly at module load. setuptools>=81 (the
      # default on actions/setup-python's Python 3.13 image, which ships no
      # setuptools/pkg_resources at all) dropped pkg_resources entirely
      # (removal flagged "as early as 2025-11-30"), so semgrep crashed with
      # ModuleNotFoundError before scanning a single file -- the Makefile
      # then JSON-parsed semgrep's empty stdout and the gate reported
      # files_scanned=0 scanned as a false PASS path (gh-607; verified fix
      # locally: semgrep now runs to completion against the real scan roots).
      - name: Install semgrep + PyYAML
        run: pip install --disable-pip-version-check --no-cache-dir "setuptools==80.9.0" "semgrep==1.99.0" "pyyaml==6.0.3"

      # gh-regression: a `flags capability not wired -- TODO(M4+)` stub
      # returned a silent default and shipped labeled "done" -- caused a
      # multi-hour alpha outage. This is a fast quality gate (like lint/
      # secrets), not part of the advisory container-build set -- any
      # finding outside .ci/stub-allowlist.yml / .ci/silent-fallback-baseline.json
      # fails this job, which is FATAL to ci-gate (not in
      # ADVISORY_CHECK_NAME_REGEX).
      - name: check-no-stubs
        run: make check-no-stubs

  python-unit:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            core/identity_core_module/requirements.txt
            core/workflow_core_module/requirements.txt
            core/community_module/requirements.txt
            libs/flask_core/requirements.txt
            hub_api/requirements.txt
            core/svc_action/requirements.txt
            core/svc_ingest/requirements.txt
            core/svc_presentation/requirements.txt
            core/svc_process/requirements.txt
            core/svc_streaming/requirements.txt

      # test-unit runs the real suites, not just the legacy 173-test subset:
      # hub_api, libs/* (flask_core + every SCCEMBS module library), and
      # every core/svc_* stage-runner container each ship their own
      # hash-pinned requirements.txt -- none of these are satisfied by
      # identity_core_module's requirements alone. scripts/ci/install-unit-test-deps.sh
      # is the single source of truth for the sequential per-package install
      # order (see that script for why a single combined install call
      # doesn't work); make test-unit also runs it, so local and CI installs
      # never drift out of sync.
      - name: Install test dependencies
        env:
          PYTHON_BIN: python
        run: scripts/ci/install-unit-test-deps.sh

      # hub_api/tests/test_bundle_component_validator.py::test_real_conformant_component_validates_ok
      # runs the real bytecodealliance/wasm-tools CLI against a real compiled
      # component fixture (not a mocked subprocess boundary) -- it is only
      # skipped when the fixture file is absent, never when the binary is
      # missing, so this runner needs the same pinned version hub_api/Dockerfile
      # installs at image build time. Same pinned-version + install-action
      # pattern as node-waddle-sdk-js.yml's wasm-tools step; continue-on-error
      # only covers the install step -- the next step turns a failed install
      # into a loud, clearly-labeled job failure, never a silent skip.
      - name: Install wasm-tools 1.259.0 (hub_api bundle-component conformance test)
        id: install-wasm-tools
        continue-on-error: true
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375  # v2.87.12
        with:
          tool: wasm-tools@1.259.0

      - name: wasm-tools unavailable (fail loud, not a silent skip)
        if: steps.install-wasm-tools.outcome != 'success'
        run: |
          echo "::error::wasm-tools failed to install -- hub_api/tests/test_bundle_component_validator.py::test_real_conformant_component_validates_ok needs it and has no missing-binary skip guard (only a missing-fixture one). Failing loudly rather than letting the suite silently pass without running it."
          exit 1

      - name: Run unit tests
        env:
          PYTHON_BIN: python
          SKIP_UNIT_TEST_DEPS_INSTALL: "1"
        run: make test-unit

  alembic-migration-chain:
    name: Alembic migration chain (real Postgres)
    runs-on: ubuntu-latest
    # Scoped to pull_request only: the base-revision diff below needs a real
    # PR base commit to compare against (merge_group/workflow_dispatch have
    # no equivalent single "pre-PR tree" to diff, and this gate's whole job
    # is proving one PR's new migration(s) apply/rollback/reapply cleanly).
    if: github.event_name == 'pull_request'
    # Narrower than the workflow-level default (contents: read + packages:
    # read) -- this job only checks out the repo and talks to its own
    # Postgres service container, no package-registry access needed.
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
        env:
          POSTGRES_USER: waddlebot
          POSTGRES_PASSWORD: testpass123
          POSTGRES_DB: waddlebot
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U waddlebot -d waddlebot"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # `base:` is deliberately omitted -- dorny/paths-filter ignores it on
      # pull_request events (uses the PR's own base ref automatically) and
      # passing it anyway produces a confusing "input parameter is ignored"
      # annotation on every run.
      #
      # Two outputs, not one: `core` is the actual migration surface (a PR
      # touching only this could plausibly add a new revision); `any` adds
      # `alembic/tests/**` test-helper changes (e.g. pg_docker.py) on top --
      # those can never add a revision, but this job is still the right
      # place to prove `alembic upgrade head` still runs clean against the
      # helper's bootstrap. See gh-526: a PR touching only
      # alembic/tests/pg_docker.py used to run the full
      # downgrade/prior-base round trip under the single old `alembic`
      # filter, and alembic_prior_base_revision.py's "no new revisions"
      # case (now exit 2, was conflated with exit 1 -- a real error) failed
      # the whole job for a change with no migration content.
      - name: Detect alembic changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4
        id: changes
        with:
          filters: |
            core:
              - 'alembic/versions/**'
              - 'alembic/env.py'
              - 'alembic.ini'
              - 'scripts/ci/alembic_prior_base_revision.py'
            any:
              - 'alembic/versions/**'
              - 'alembic/env.py'
              - 'alembic.ini'
              - 'alembic/tests/**'
              - 'scripts/ci/alembic_prior_base_revision.py'

      # Always runs (pure Python, no Postgres/alembic/flask_core needed) --
      # this is also what the "Unit test alembic_prior_base_revision.py"
      # step below uses, independent of whether this PR touches alembic/**
      # at all.
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: hub_api/requirements.txt

      # Regression coverage for the gh-526 gap: resolve_prior_base_revision's
      # "no new revisions" (exit 2, benign) vs "ambiguous new revisions"
      # (exit 1, real error) branches, exercised directly against
      # constructed revision maps -- no git/subprocess/Postgres needed, so
      # this runs unconditionally on every PR, not just alembic-touching ones.
      - name: Unit test alembic_prior_base_revision.py
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check "pytest==9.1.1"
          python3 -m pytest scripts/ci/tests/test_alembic_prior_base_revision.py -v

      # hub_api/requirements.txt is hash-pinned and carries sqlalchemy +
      # psycopg2-binary; alembic itself has no hash-pinned entry anywhere in
      # this repo yet (migrations/Dockerfile installs it unpinned via
      # `alembic>=1.13`) -- pinned here to an exact version so this gate is
      # reproducible. Folding a hash-pinned alembic into hub_api/requirements.txt
      # is a follow-up, tracked separately from this migration-chain gate.
      #
      # alembic/env.py imports `flask_core.models.db` (needed for
      # `target_metadata`), which transitively needs flask-sqlalchemy +
      # flask-security-too -- neither is in hub_api/requirements.txt (hub_api
      # itself doesn't use flask_core). This is exactly the dependency set
      # migrations/Dockerfile already installs for the same reason; versions
      # pinned to match libs/flask_core/requirements.txt's own pins. First
      # CI run of this job failed here with `ModuleNotFoundError: No module
      # named 'flask_sqlalchemy'` -- a local run had passed only because the
      # dev venv used for verification had it pre-installed from unrelated
      # prior work, masking the gap.
      - name: Install migration dependencies
        if: steps.changes.outputs.any == 'true'
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check --require-hashes -r hub_api/requirements.txt
          pip install --disable-pip-version-check \
            "alembic==1.20.0" \
            "flask-sqlalchemy==3.1.1" \
            "flask-security-too==5.8.2" \
            "PyYAML>=6.0.2,<7.0.0"

      # This repo's real-Postgres alembic history starts at migration 0020 --
      # everything before it is a 96-file legacy SQL baseline replay
      # (`0001_baseline_from_sql_migrations`) that depends on roles/seed data
      # only present in the full docker-compose dev stack (see
      # `alembic/tests/pg_docker.py`'s own module docstring for the verified
      # failure mode outside that stack). Reproducing that stack in CI is out
      # of this gate's scope, so -- matching `pg_docker.py`'s own,
      # already-proven approach -- this bootstraps only the four tables
      # migrations 0020+ actually reference by FK, then stamps 0019_kick_app
      # (the revision immediately before the first migration this minimal
      # schema supports) so `alembic upgrade head` runs every migration this
      # PR could plausibly touch for real.
      - name: Bootstrap minimal FK schema + stamp pre-0020 baseline
        if: steps.changes.outputs.any == 'true'
        env:
          PGPASSWORD: testpass123
        run: |
          set -euo pipefail
          psql -h localhost -U waddlebot -d waddlebot <<'SQL'
          CREATE TABLE tenants (
              id SERIAL PRIMARY KEY,
              slug TEXT NOT NULL UNIQUE,
              is_active BOOLEAN NOT NULL DEFAULT TRUE,
              logo_url TEXT,
              config JSONB
          );
          CREATE TABLE communities (
              id SERIAL PRIMARY KEY,
              name TEXT
          );
          CREATE TABLE hub_users (
              id SERIAL PRIMARY KEY
          );
          CREATE TABLE app_catalog (
              app_id VARCHAR(255) PRIMARY KEY
          );
          -- 0039_event_sync_enabled is the first Alembic migration to FK into
          -- calendar_events -- a legacy table owned by config/postgres/migrations/
          -- (never Alembic, see alembic/tests/pg_docker.py's own docstring on why
          -- the full legacy baseline isn't replayed here). Same minimal-bootstrap
          -- convention as the tables above: only the column(s) migrations 0020+
          -- actually FK against (just `id`), not the real table's full column
          -- set. Mirrors pg_docker.py's own `_BOOTSTRAP_SQL` addition (gh-643) --
          -- keep both in sync if either changes.
          CREATE TABLE calendar_events (
              id SERIAL PRIMARY KEY
          );
          SQL

      # Runs whenever any alembic-related file changed (`any`), including a
      # test-helper-only PR (gh-526) that can never add a revision: proves
      # `alembic upgrade head` runs clean from an empty-of-migrations DB and
      # the DB actually advances, independent of whether there's a new
      # revision to round-trip below. `alembic current`, not the upgrade
      # command's own log output, is what proves it (this repo's
      # alembic.ini pins `logger_root level = WARN`, which silently
      # swallows alembic's default INFO-level "Running upgrade X -> Y"
      # messages -- confirmed empty stdout/stderr from a real successful
      # upgrade during this job's own development).
      # fix/no-empty-kept-secrets -- 0032_bundle_reader_role.py's upgrade() now
      # refuses an empty DB_READER_PASSWORD (previously silently provisioned
      # waddles_bundle_reader with no usable password). This generic chain
      # smoke test has no chart/Secret involved, so it needs its own throwaway
      # value -- never a real credential, this DB is destroyed at job end.
      - name: alembic upgrade head from empty baseline
        if: steps.changes.outputs.any == 'true'
        env:
          DATABASE_URL: postgresql://waddlebot:testpass123@localhost:5432/waddlebot
          DB_READER_PASSWORD: ci-smoke-test-reader-pw
        run: |
          set -euo pipefail
          python3 -m alembic stamp 0019_kick_app

          echo "== upgrade head =="
          python3 -m alembic upgrade head
          current="$(python3 -m alembic current)"
          heads="$(python3 -m alembic heads)"
          head_count=$(printf '%s\n' "${heads}" | grep -c .)
          if [ "${head_count}" -ne 1 ]; then
            echo "::error::expected exactly 1 alembic head, found ${head_count}: ${heads}"
            exit 1
          fi
          if [ -z "${current}" ]; then
            echo "::error::alembic upgrade head completed without error, but \`alembic current\` reports no stamped revision -- the DB never actually advanced."
            exit 1
          fi
          echo "DB now at: ${current}"

      # Only meaningful when the migration surface itself changed (`core`) --
      # a test-helper-only PR can never add a revision, so skip even
      # attempting this (the script would just report exit 2 anyway).
      #
      # `rev` is parsed out of PR-branch file content (a fork PR's own
      # migration file text) -- never spliced back into `${{ }}` template
      # expansion in a later step. Passed through GITHUB_OUTPUT only after
      # it passes the same [0-9a-z_]+ shape every real revision ID in this
      # repo has, so a crafted `revision = "..."` string with shell
      # metacharacters can never reach a later `run:` block as literal
      # script text.
      #
      # alembic_prior_base_revision.py exit codes: 0 = found it (stdout has
      # the revision); 2 = no new revisions in this PR -- benign, e.g. this
      # PR edited an existing migration's body without adding a new
      # revision id; 1 = a real error (new revisions don't form a single
      # linear stack) and must still fail the job -- `set -e` is
      # deliberately suspended only around this one command so the exit
      # code can be branched on, never masked with `|| true`.
      - name: Compute prior base revision
        if: steps.changes.outputs.core == 'true'
        id: base-rev
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          set +e
          rev=$(python3 scripts/ci/alembic_prior_base_revision.py --base-sha "${PR_BASE_SHA}")
          status=$?
          set -e

          if [ "${status}" -eq 2 ]; then
            echo "::notice::no new alembic/versions/*.py revisions in this PR -- skipping the downgrade/reapply round-trip (upgrade-head-from-empty above still ran)."
            echo "has_new_revisions=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${status}" -ne 0 ]; then
            echo "::error::alembic_prior_base_revision.py failed (exit ${status}): ${rev}"
            exit "${status}"
          fi
          if ! printf '%s' "${rev}" | grep -qE '^[0-9a-z_]+$'; then
            echo "::error::computed prior_base_revision '${rev}' doesn't match the expected [0-9a-z_]+ shape -- refusing to use it."
            exit 1
          fi
          echo "has_new_revisions=true" >> "$GITHUB_OUTPUT"
          echo "prior_base_revision=${rev}" >> "$GITHUB_OUTPUT"

      # Gated on has_new_revisions (the script's own finding), not just the
      # `core` path filter -- a PR can touch alembic/versions/** without
      # adding a new revision id (e.g. fixing a bug in an existing
      # migration's body), in which case there's nothing to round-trip.
      - name: alembic downgrade to prior base -> upgrade head (round-trip)
        if: steps.base-rev.outputs.has_new_revisions == 'true'
        env:
          DATABASE_URL: postgresql://waddlebot:testpass123@localhost:5432/waddlebot
          PRIOR_BASE_REVISION: ${{ steps.base-rev.outputs.prior_base_revision }}
          # fix/no-empty-kept-secrets -- see the identical env var on the
          # "empty baseline" step above: 0032's upgrade() re-runs here too.
          DB_READER_PASSWORD: ci-smoke-test-reader-pw
        run: |
          set -euo pipefail
          base_rev="${PRIOR_BASE_REVISION}"
          # Redundant with the producing step's own check -- cheap, and this
          # step is the one that actually splices base_rev into an `alembic`
          # argv, so it validates independently rather than trusting the
          # upstream step forever.
          if ! printf '%s' "${base_rev}" | grep -qE '^[0-9a-z_]+$'; then
            echo "::error::prior_base_revision '${base_rev}' doesn't match the expected [0-9a-z_]+ shape -- refusing to use it."
            exit 1
          fi

          history_lines=$(python3 -m alembic history -r "${base_rev}:head" | grep -c .)
          # `history -r X:head` always includes the edge *into* X as its last
          # line (see e.g. `alembic history -r 0025_app_source_bindings:head`
          # printing both `0025 -> 0026` and `0024 -> 0025`) -- subtract 1 to
          # get the count of revisions that actually apply going from X to head.
          revision_count=$((history_lines - 1))
          echo "revisions to apply (base ${base_rev} -> head): ${revision_count}"
          if [ "${revision_count}" -le 0 ]; then
            echo "::error::0 revisions between base ${base_rev} and head -- nothing for this gate to verify."
            exit 1
          fi

          echo "== downgrade to prior base revision ${base_rev} =="
          python3 -m alembic downgrade "${base_rev}"
          current_after_downgrade=$(python3 -m alembic current)
          if ! printf '%s\n' "${current_after_downgrade}" | grep -q "${base_rev}"; then
            echo "::error::downgrade to ${base_rev} completed without error, but \`alembic current\` reports '${current_after_downgrade}' -- the DB didn't actually roll back."
            exit 1
          fi

          echo "== upgrade head (2nd pass) =="
          python3 -m alembic upgrade head
          current_2=$(python3 -m alembic current)
          if [ -z "${current_2}" ]; then
            echo "::error::second alembic upgrade head completed without error, but \`alembic current\` reports no stamped revision -- the DB never actually re-advanced."
            exit 1
          fi

          echo "::notice::alembic migration chain verified -- ${revision_count} revision(s) applied from ${base_rev} to head, round-tripped via downgrade/upgrade. Final revision: ${current_2}"

  marketplace-refunds:
    name: Marketplace refund authorization tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin/marketplace_module/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: admin/marketplace_module/backend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run refund tests
        run: npm test

  web-builds:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Hub frontend
            path: admin/hub_module/frontend
            test: true
            native_dependency: esbuild
          - name: Website
            path: website
            test: false
            native_dependency: sharp
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild approved native dependency
        run: npm rebuild ${{ matrix.native_dependency }}

      - name: Run frontend tests
        if: matrix.test
        run: npm test

      - name: Build
        run: npm run build

  helm-chart-lint:
    name: Helm chart lint + hook dependency ordering
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2  # v5
        with:
          version: 'v3.13.0'

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.13'

      - name: Install check dependencies
        run: pip install --no-cache-dir pyyaml==6.0.2 pytest==9.1.1 cryptography==50.0.1

      # fix/preexisting-test-failures: k8s/helm/waddlebot/tests/ (34 helm-template
      # assertion tests, incl. TestSeederPlatformConnections's
      # CORE_BUNDLES_PLATFORM_CONNECTIONS check) was never wired into any CI job --
      # it could regress silently with nothing failing. Running it directly as
      # `pytest <dir>` (no `|| true`/continue-on-error) means a 0-tests-collected
      # state (e.g. the dir gets moved/renamed) fails this step with pytest's own
      # exit code 5, never a silent pass -- critical-rules.md Verification Integrity.
      - name: Helm chart template tests (pytest)
        run: python3 -m pytest k8s/helm/waddlebot/tests/ -v

      # fix/helm-hook-rbac-ordering -- helm.sh/hook-annotated Jobs run BEFORE any
      # regular (non-hook) chart resource. A pre-install/pre-upgrade Job whose
      # serviceAccountName or mounted ConfigMap/Secret resolves to a regular resource
      # (instead of a hook at a strictly lower weight, or a documented allowlist entry)
      # will fail on first install with "serviceaccounts/secrets ... not found" once
      # activeDeadlineSeconds expires -- exactly the class of bug fixed on this branch.
      # scripts/ci/check-helm-hook-dependency-ordering.py asserts this statically for
      # every environment's rendered manifests so it can never silently regress.
      - name: helm lint (alpha)
        run: |
          set -euo pipefail
          helm lint k8s/helm/waddlebot --values k8s/helm/waddlebot/values-alpha.yaml

      - name: helm template + hook dependency ordering check (alpha)
        run: |
          set -euo pipefail
          helm template waddlebot k8s/helm/waddlebot \
            --values k8s/helm/waddlebot/values-alpha.yaml \
            --kube-version 1.30.0 \
          | python3 scripts/ci/check-helm-hook-dependency-ordering.py

      # fix/helm-platform-credentials -- regression gate for the alpha incident where
      # a routine `helm upgrade` overwrote the REAL Discord bot token with the
      # values-alpha.yaml dev placeholder. Asserts no rendered Secret or workload env
      # carries a REPLACE_ME/CHANGE_ME/changeme/example-shaped credential value.
      - name: helm template + placeholder credential check (alpha)
        run: |
          set -euo pipefail
          helm template waddlebot k8s/helm/waddlebot \
            --values k8s/helm/waddlebot/values-alpha.yaml \
            --kube-version 1.30.0 \
          | python3 scripts/ci/check-no-placeholder-credentials.py

      # fix/helm-apply-errors -- neither helm lint nor helm template runs the rendered
      # YAML through API validation, so a duplicate Service port name or a container
      # env entry setting both `value` and `valueFrom` (both rejected only at apply
      # time -- see scripts/ci/check-helm-rendered-manifest-invariants.py's module
      # docstring) passed both of the steps above and reached the live alpha cluster.
      # kubeconform can't catch either: the OpenAPI schema permits both cases, the
      # constraint is API-server business logic, not a schema shape -- hence the
      # small dedicated script instead.
      - name: helm template + rendered-manifest invariants (alpha)
        run: |
          set -euo pipefail
          helm template waddlebot k8s/helm/waddlebot \
            --values k8s/helm/waddlebot/values-alpha.yaml \
            --kube-version 1.30.0 \
          | python3 scripts/ci/check-helm-rendered-manifest-invariants.py

      # regression: seeder VALKEY_URL REPLACE_ME / missing TLS wiring -- the
      # core-bundle-seeder Job (and hub-api, same valkey_admin_client.build_client() call
      # path) used to inherit a plaintext VALKEY_URL from envFrom's chart Secret alone and
      # crash-looped on alpha ("VALKEY_URL must use rediss://"). Checks the EFFECTIVE env
      # (envFrom merged with explicit env, matching Kubernetes' own resolution order)
      # never resolves to a REPLACE_ME placeholder, and that core-bundle-seeder/hub-api
      # mount the same valkey-ca CA volume the Rust data-plane Deployments do.
      - name: helm template + seeder Valkey TLS wiring check (alpha)
        run: |
          set -euo pipefail
          helm template waddlebot k8s/helm/waddlebot \
            --values k8s/helm/waddlebot/values-alpha.yaml \
            --kube-version 1.30.0 \
          | python3 scripts/ci/check-seeder-valkey-tls-wiring.py

      # values-beta.yaml pins global.deploymentTier=production, which requires every
      # generated secret to be supplied explicitly (or already present on a live
      # cluster via `lookup`) -- neither is available to an offline `helm template` in
      # CI. Overriding to the alpha secret-generation tier here renders the SAME
      # beta topology/resource set (hooks, weights, RBAC) purely so this ordering
      # check can run against it; it is not a substitute for the real beta deploy.
      - name: helm lint (beta topology)
        run: |
          set -euo pipefail
          helm lint k8s/helm/waddlebot --values k8s/helm/waddlebot/values-beta.yaml \
            --set global.deploymentTier=alpha

      - name: helm template + hook dependency ordering check (beta topology)
        run: |
          set -euo pipefail
          helm template waddlebot k8s/helm/waddlebot \
            --values k8s/helm/waddlebot/values-beta.yaml \
            --kube-version 1.30.0 \
            --set global.deploymentTier=alpha \
          | python3 scripts/ci/check-helm-hook-dependency-ordering.py

      - name: helm template + placeholder credential check (beta topology)
        run: |
          set -euo pipefail
          helm template waddlebot k8s/helm/waddlebot \
            --values k8s/helm/waddlebot/values-beta.yaml \
            --kube-version 1.30.0 \
            --set global.deploymentTier=alpha \
          | python3 scripts/ci/check-no-placeholder-credentials.py

      - name: helm template + rendered-manifest invariants (beta topology)
        run: |
          set -euo pipefail
          helm template waddlebot k8s/helm/waddlebot \
            --values k8s/helm/waddlebot/values-beta.yaml \
            --kube-version 1.30.0 \
            --set global.deploymentTier=alpha \
          | python3 scripts/ci/check-helm-rendered-manifest-invariants.py

      # fix/alpha-deploy-context-allowlist -- KUBE_CONTEXT=dal2-beta (or any
      # context outside local-alpha/microk8s) must be rejected by
      # scripts/alpha-deploy.sh before docker/helm/kubectl are ever invoked,
      # since values-alpha.yaml auto-generates secrets on upgrade.
      - name: alpha-deploy.sh KUBE_CONTEXT allowlist regression test
        run: bash scripts/ci/tests/test_alpha_deploy_context_allowlist.sh

      # fix/alpha-deploy-hub-webui -- SERVICES omitted hub-webui (and the
      # plain-name Python svc-ingest/svc-process/svc-action images deployed
      # alongside their *-rust counterparts), causing ImagePullBackOff on a
      # fresh alpha build. check_images_in_registry now HEAD-checks every
      # chart-referenced image against the registry before helm ever runs.
      - name: alpha-deploy.sh missing-image preflight regression test
        run: bash scripts/ci/tests/test_alpha_deploy_image_preflight.sh

      # resolve-433 -- the dev box's hourly `docker system prune -a` wipes the
      # local BuildKit cache, so every build was a cold build (~25min). Builds
      # now go through a dedicated docker-container buildx builder with
      # --cache-from/--cache-to pointed at the MicroK8s registry (survives
      # the prune, unlike docker's own cache store).
      - name: alpha-deploy.sh registry build-cache regression test
        run: bash scripts/ci/tests/test_alpha_deploy_build_cache.sh

      # fix/preexisting-test-failures: this test existed but was never wired into
      # any CI job, so its egress-proxy/bundle-executor build-list coverage could
      # silently drift with nothing failing (exactly the Dockerfile-path drift
      # this test was written to catch).
      - name: alpha-deploy.sh service build-list regression test
        run: bash scripts/ci/tests/test_alpha_deploy_service_build_list.sh

      # fix/alpha-deploy-executor-and-failfast -- alpha-deploy.sh could exit 0
      # on a real deploy failure: the Deployment rollout-status loop only
      # logged `err` and kept going, and nothing checked that `helm upgrade
      # --install` actually left the release `deployed`. Both now propagate a
      # non-zero exit -- see this test's own header for the full rationale.
      - name: alpha-deploy.sh failure-propagation regression test
        run: bash scripts/ci/tests/test_alpha_deploy_failure_propagation.sh

      # fix/alpha-deploy-executor-and-failfast -- real `helm template` render
      # assertions (not stubbed) for the bundle-executor OOM-fix resources,
      # startupProbe cold-compile budget, SHA-tagged image, and the removal
      # of the legacy single-bundle env from svc-process-rust/svc-action-rust.
      - name: alpha render -- bundle-executor + legacy-env regression test
        run: bash scripts/ci/tests/test_alpha_render_bundle_executor.sh

      # feature/hub-grpc-env-wiring -- PR #561 (PII tokenization, default ON) + #569
      # (fail loud at startup if HUB_API_GRPC_ENDPOINT/SERVICE_JWT_TOKEN_ENDPOINT are
      # unset) require svc-process-rust/svc-action-rust to render these non-empty or
      # every tokenization-enabled pod crash-loops.
      - name: alpha render -- hub gRPC client env wiring regression test
        run: bash scripts/ci/tests/test_hub_grpc_env_wiring.sh

      # fix/hub-api-grpc-service-jwt-issuer -- the auto-provisioned
      # `service-jwt-signing-key` Secret's shape (unsuffixed key name, raw
      # base64 seed instead of kid-suffixed PEM) silently never matched what
      # `flask_core.service_jwt.load_issuer_from_env` scans for, so hub-api's
      # internal gRPC listener (port 50204) was skipped on every alpha
      # deploy, blocking svc-process/svc-action's HubClient and the whole
      # PII-tokenization data path. Runs the real rendered Job script against
      # a mocked kubectl and feeds its output through the real Python loader.
      - name: alpha render -- hub-api service_jwt auto-provisioning regression test
        run: bash scripts/ci/tests/test_hub_api_service_jwt_auto_provision.sh

      # fix/legacy-path-mutually-exclusive -- the check above hard-requires a
      # bundle-executor Deployment (alpha-only); this covers the bare render
      # (base values.yaml defaults) and every other topology, none of which
      # reach that executor-gated assertion.
      - name: bare + beta/gamma/production render -- legacy single-app env regression test
        run: bash scripts/ci/tests/test_no_legacy_single_app_env.sh

      # regression: all-digit short SHA rendered as %!s(int64=...) image tag
      # (alpha 2026-10-03) -- `--set global.imageTag=35604387` type-infers the
      # all-digit value as an int64, and every chart template building
      # `repo:tag` via Go's `printf "%s"` rendered the corrupted
      # `%!s(int64=35604387)` instead of the tag. Fixed via `--set-string` in
      # every deploy script/workflow plus `| toString` on every chart-side tag
      # build; this asserts both the old `--set` call style and the fixed
      # `--set-string` style render a clean tag with no `%!` anywhere.
      - name: alpha render -- all-digit short SHA image tag regression test
        run: bash scripts/ci/tests/test_image_tag_all_digit_sha.sh

  dockerfile-rust-path-deps:
    name: Dockerfile.rust path-dependency coverage
    runs-on: ubuntu-latest
    # Static analysis of the current tree only (no diff needed) -- narrower
    # than the workflow-level default, matching alembic-migration-chain's
    # own least-privilege override.
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.13'

      # Regression gate for gh-425/gh-498/gh-465/gh-468/gh-469: a Rust
      # service Dockerfile that COPYs a sibling crate directly but misses a
      # deeper transitive same-repo path dependency (e.g. bundle-host-http's
      # own path dependency on egress-assertion) fails INSIDE `cargo build`,
      # discovered only after a full CI round trip. This proves every
      # transitive path dep is COPYed before Docker ever runs.
      - name: Check Dockerfile.rust path-dependency coverage
        run: python3 scripts/ci/check-dockerfile-rust-path-deps.py

  alembic-single-head:
    name: Alembic single-head invariant (static, no DB)
    runs-on: ubuntu-latest
    # Pure revision-graph walk over alembic/versions/*.py source text -- no
    # DB, no alembic package import -- so this runs on every PR regardless
    # of whether alembic/** changed, unlike the heavier real-Postgres
    # alembic-migration-chain job above.
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.13'

      # Regression gate for a class of bug hit 4x: diverged alembic heads
      # (a stacked-branch rebase or a same-cycle parallel migration PR
      # leaves two revisions both claiming no successor) plus the Postgres
      # VARCHAR(32) revision-id width limit and dangling down_revision refs.
      - name: Check single alembic head
        run: bash scripts/ci/check-alembic-single-head.sh .

  lockfile-no-downgrades:
    name: Lockfile additions-only (no silent version changes)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.13'

      # PR body is written to a file via env var (never interpolated into
      # the run script directly -- zizmor template-injection) so the check
      # script can read it without any `${{ }}` expansion touching shell text.
      - name: Write PR body to file
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > /tmp/pr-body.txt

      # Regression gate for gh-425: an unrelated PR silently changed an
      # EXISTING lockfile package's version (buried in a large Cargo.lock/
      # package-lock.json/hashed-requirements.txt diff) and nobody noticed
      # in review. Additions are always fine; a version change on a
      # pre-existing package must carry an explicit
      # `lockfile-bump: <pkg> <old>-><new> <reason>` line in the PR body or
      # a commit message, or this job fails.
      - name: Check lockfiles for unacknowledged version changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/check-lockfile-no-downgrades.py \
            --merge-base "${PR_BASE_SHA}" \
            --head HEAD \
            --pr-body-file /tmp/pr-body.txt

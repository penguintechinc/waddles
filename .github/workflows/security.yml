name: Security & Code Quality

on:
  push:
    branches: [main, 'v*', 'release/**', 'feature/**', 'fix/**', 'chore/**', 'hotfix/**', 'docs/**', 'refactor/**']
  pull_request:
    branches: [main, 'v*', 'release/**', 'feature/**', 'fix/**', 'chore/**', 'hotfix/**', 'docs/**', 'refactor/**']
  merge_group:
    types: [checks_requested]
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  security-events: write
  actions: read

jobs:
  # Fast checks (~2-3 min): Trivy fs + Dependency Review.
  # Python (pip-audit, bandit) and Node audits run as their own jobs below.
  # This is the check that matters for day-to-day development velocity.
  security-fast:
    name: Security & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.69.3
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          limit-severities-for-sarif: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225  # v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48  # v4
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high

  node-audit:
    name: Node audit (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Hub backend
            path: admin/hub_module/backend
          - name: Hub frontend
            path: admin/hub_module/frontend
          - name: Marketplace
            path: admin/marketplace_module/backend
          - name: Website
            path: website
          - name: API tests
            path: tests/api/hub-backend
          - name: End-to-end tests
            path: tests/e2e
          - name: Integration tests
            path: tests/integration
          - name: Smoke tests
            path: tests/smoke
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      # This job only reads and audits; it publishes no artifacts, so the
      # cache-poisoning audit does not apply. It fires only because release/**
      # now appears in the trigger list.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0  # zizmor: ignore[cache-poisoning]
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        env:
          NPM_AUDIT_ALLOW: ${{ matrix.audit_allow }}
        run: node "$GITHUB_WORKSPACE/.github/scripts/npm-audit.mjs"

  python-audit:
    name: Python security checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      # Must match the runtime images. The lockfiles are resolved per Python
      # version, so auditing on an older interpreter reports phantom missing
      # dependencies for markers like `python_version < "3.13"`.
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.13'

      # Pinned + hash-verified per critical-rules.md Dependency Pinning -- see
      # .github/scripts/security-tools-requirements.in for the source pins.
      - name: Install audit tooling
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            -r .github/scripts/security-tools-requirements.txt

      # Two scopes, deliberately. Hash-pinned lockfiles are what the images
      # actually install and they gate this job. The remaining requirement
      # files are unhashed and carry known pre-existing CVEs; they are reported
      # loudly but do not gate yet, so a green run here never means "the whole
      # repo is clean". Move a file into the gated scope by compiling it with
      # `uv pip compile --generate-hashes`. Note some unhashed files still
      # claim a pip-compile header, so detection keys on the hashes themselves.
      - name: Audit pinned Python dependencies
        run: |
          set -euo pipefail
          # PYSEC-2022-252 is the 2022 deep-translator PyPI account takeover.
          # OSV records no fixed version, so every release from 1.8.5 onward is
          # flagged forever. Only the yanked 1.8.5 carried the malicious
          # payload, and our pins are hash-verified against the audited
          # artifact. Drop this once upstream publishes a fixed range.
          IGNORES="--ignore-vuln PYSEC-2022-252"

          gated=0; ungated=0; gated_bad=0; ungated_bad=0
          for f in $(find . -name requirements.txt \
                       -not -path './node_modules/*' \
                       -not -path './.worktrees/*' | sort); do
            if grep -q -- '--hash=sha256' "$f"; then
              gated=$((gated + 1))
              echo "::group::[gated] $f"
              pip-audit -r "$f" --no-deps --progress-spinner off $IGNORES \
                || gated_bad=$((gated_bad + 1))
              echo "::endgroup::"
            else
              ungated=$((ungated + 1))
              echo "::group::[report-only] $f"
              pip-audit -r "$f" --no-deps --progress-spinner off $IGNORES \
                || ungated_bad=$((ungated_bad + 1))
              echo "::endgroup::"
            fi
          done

          echo "Gated (hash-pinned lockfiles): $gated examined, $gated_bad with findings"
          echo "Report-only (unhashed): $ungated examined, $ungated_bad with findings"

          if [ "$gated" -eq 0 ]; then
            echo "::error::No hash-pinned lockfiles found - audit scope is wrong, failing closed"
            exit 1
          fi
          if [ "$ungated_bad" -gt 0 ]; then
            echo "::warning::$ungated_bad unhashed requirement file(s) have known vulnerabilities (pre-existing, not gating)"
          fi
          [ "$gated_bad" -eq 0 ]

      - name: Bandit SAST
        run: |
          set -euo pipefail
          bandit -r . -lll -iii \
            --exclude ./node_modules,./.worktrees,./tests,./.venv,./mobile

  # Slow static analysis (~17-21 min): CodeQL on go/javascript/python.
  # Runs in parallel with builds -- does NOT gate container builds or any other jobs.
  # Pre-existing OS-level CVEs in bookworm base images cause false positives;
  # continue-on-error prevents them from blocking the pipeline.
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@95e58e9a2cdfd71adc6e0353d5c52f41a045d225  # v4
        with:
          languages: go, javascript, python

      - name: Autobuild
        uses: github/codeql-action/autobuild@95e58e9a2cdfd71adc6e0353d5c52f41a045d225  # v4

      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@95e58e9a2cdfd71adc6e0353d5c52f41a045d225  # v4

name: Alembic single head (release push)

# Two PRs that are each green on their own can still diverge once both land on the release
# branch (each only ever saw the other's base). Re-run the static single-head check on every push
# to release/** so a divergence fails loudly on the branch itself, not at the next alembic upgrade.

on:
  push:
    branches: ['release/**']
    paths:
      - 'alembic/versions/**'
      - 'scripts/ci/check-alembic-single-head.sh'
      - '.github/workflows/alembic-single-head-release.yml'

permissions:
  contents: read

concurrency:
  group: alembic-single-head-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alembic-single-head:
    name: alembic single head (release push)
    # Non-main branch -> self-hosted dal2-alpha CI runner set (same label pr-validation.yml uses).
    runs-on: dal2-alpha-ci
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.13'

      - name: Check single alembic head
        run: bash scripts/ci/check-alembic-single-head.sh .

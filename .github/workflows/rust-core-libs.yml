name: Rust core libs (lint + test + 90% coverage)

# These core crates ran in NO coverage-gated workflow (release audit R6). Each
# goes through the reusable pipeline, which fails below 90% line coverage.

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'core/bundle_active_set/**'
      - 'core/bundle_capability_gate/**'
      - 'core/bundle_tool_call/**'
      - 'core/circuit_breaker/**'
      - 'core/egress_detokenizer/**'
      - 'core/hub_client/**'
      - 'core/overlay_auth/**'
      - 'proto/**'
      - '.github/workflows/rust-core-libs.yml'
      - '.github/workflows/rust-crate-ci.yml'
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path gate (release PRs only): shared detector, fails closed. A job skipped
  # here means "not affected"; main PRs / pushes / dispatch run everything.
  changes:
    name: Detect changed areas
    runs-on: ${{ ((github.event_name == 'pull_request' && github.base_ref != 'main' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'merge_group' && !endsWith(github.event.merge_group.base_ref, '/main')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && 'dal2-alpha-ci' || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      match: ${{ steps.paths.outputs.match }}
    steps:
      - name: Checkout (change classifier only)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: |
            scripts/ci
            .github/actions
      - name: Classify changed paths
        id: paths
        uses: ./.github/actions/changed-paths
        with:
          area: rust
          globs: |
            core/bundle_active_set/**
            core/bundle_capability_gate/**
            core/bundle_tool_call/**
            core/circuit_breaker/**
            core/egress_detokenizer/**
            core/hub_client/**
            core/overlay_auth/**
            proto/**
            .github/workflows/rust-core-libs.yml

  lint-test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.match == 'true') }}
    name: ${{ matrix.crate }}
    strategy:
      fail-fast: false
      matrix:
        crate: [bundle_active_set, bundle_capability_gate, bundle_tool_call, circuit_breaker, egress_detokenizer, hub_client, overlay_auth]
    uses: ./.github/workflows/rust-crate-ci.yml
    with:
      crate_name: ${{ matrix.crate }}
      working_directory: core/${{ matrix.crate }}
      # hub_client's build.rs compiles the repo-root proto/ tree (tonic-prost-build).
      extra_apt_packages: protobuf-compiler cmake build-essential
      extra_apt_reason: 'for hub_client build.rs (protoc) + aws-lc-sys'

name: Rust egress-assertion (lint + test)

# core/egress_assertion's own tests (the signed egress-allowlist assertion
# wire format and its verifier) ran only indirectly: rust-bundle-host-http.yml
# and rust-egress-proxy.yml test THEIR crates. This gates the shared crate
# itself with fmt + clippy + cargo-deny + a >=90% coverage gate.

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'core/egress_assertion/**'
      - '.github/workflows/rust-egress-assertion.yml'
      - '.github/workflows/rust-crate-ci.yml'
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path gate (release PRs only): shared detector, fails closed. A job skipped
  # here means "not affected"; main PRs / pushes / dispatch run everything.
  changes:
    name: Detect changed areas
    runs-on: ${{ ((github.event_name == 'pull_request' && github.base_ref != 'main') || (github.event_name == 'merge_group' && !endsWith(github.event.merge_group.base_ref, '/main')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && 'dal2-alpha' || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      match: ${{ steps.paths.outputs.match }}
    steps:
      - name: Checkout (change classifier only)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: |
            scripts/ci
            .github/actions
      - name: Classify changed paths
        id: paths
        uses: ./.github/actions/changed-paths
        with:
          area: rust
          globs: |
            core/egress_assertion/**
            .github/workflows/rust-egress-assertion.yml

  lint-test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.match == 'true') }}
    name: fmt + clippy + deny + coverage
    uses: ./.github/workflows/rust-crate-ci.yml
    with:
      crate_name: egress-assertion
      working_directory: core/egress_assertion
      # aws-lc-sys (the jsonwebtoken aws_lc_rs backend) needs cmake + a
      # C/C++ compiler to build -- same rationale as rust-egress-proxy.yml.
      extra_apt_packages: cmake build-essential
      extra_apt_reason: 'for aws-lc-sys (cmake, C/C++ toolchain)'

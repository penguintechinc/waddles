name: Android App Checks

on:
  push:
    branches: [main, 'v*', 'release/**', 'feature/**', 'fix/**', 'chore/**', 'hotfix/**', 'docs/**', 'refactor/**']
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main, 'v*', 'release/**', 'feature/**', 'fix/**', 'chore/**', 'hotfix/**', 'docs/**', 'refactor/**']
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android.yml'
  merge_group:
    types: [checks_requested]
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, unit test, and assemble
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      # Gradle cache flagged only because release/** now triggers this workflow.
      # GitHub scopes caches per branch (a feature branch cannot write main's
      # cache), and the only artifact here is a debug APK kept for review.
      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5  # zizmor: ignore[cache-poisoning]
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            mobile/android/*.gradle.kts
            mobile/android/gradle/wrapper/gradle-wrapper.properties

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@06832c7b30a0129d7fb559bcc6e43d26f6374244  # v4

      - name: Run Android checks
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug

      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: android-check-results
          path: |
            mobile/android/app/build/reports/
            mobile/android/app/build/outputs/apk/debug/
          if-no-files-found: warn
          retention-days: 14

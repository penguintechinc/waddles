name: Waddles CI/CD Pipeline

# This workflow handles deployment orchestration.
# Security scanning: security.yml
# Container builds: containers.yml, build-container.yml, build-*.yml

on:
  push:
    branches: [main, 'v*', 'release/**', 'feature/**', 'fix/**', 'chore/**', 'hotfix/**', 'docs/**', 'refactor/**']
  pull_request:
    branches: [main, 'v*', 'release/**', 'feature/**', 'fix/**', 'chore/**', 'hotfix/**', 'docs/**', 'refactor/**']
  merge_group:
    types: [checks_requested]
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Deploy to Kubernetes (main branch pushes only)
  deploy-k8s:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Wait for GHCR propagation
        run: |
          echo "Waiting 30 seconds for images to be available in GHCR..."
          sleep 30

      - name: Install kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede  # v4
        with:
          version: 'v1.28.0'

      - name: Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2  # v5
        with:
          version: 'v3.13.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify cluster connectivity
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy with Helm
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          COMMIT_SHA: ${{ github.sha }}
          K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE }}
        run: |
          NAMESPACE="${K8S_NAMESPACE:-waddlebot}"

          helm upgrade --install waddlebot ./k8s/helm/waddlebot \
            --namespace "$NAMESPACE" \
            --create-namespace \
            --set global.imageRegistry="ghcr.io/${REPO_OWNER}/${REPO_NAME}" \
            --set-string global.imageTag="$COMMIT_SHA" \
            --set global.imagePullPolicy=Always \
            --timeout 15m \
            --wait

          echo "Deployment completed successfully"

      - name: Verify rollout
        env:
          K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE }}
        run: |
          NAMESPACE="${K8S_NAMESPACE:-waddlebot}"

          echo "Waiting for all deployments to be ready..."
          kubectl rollout status deployment -n "$NAMESPACE" --timeout=10m || true

          echo ""
          echo "Current pod status:"
          kubectl get pods -n "$NAMESPACE"

          echo ""
          echo "Deployment status:"
          kubectl get deployments -n "$NAMESPACE"

      - name: Run smoke tests
        continue-on-error: true
        env:
          K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE }}
        run: |
          NAMESPACE="${K8S_NAMESPACE:-waddlebot}"

          echo "Testing router health endpoint..."
          kubectl run curl-test --image=curlimages/curl:latest --rm -i --restart=Never \
            --namespace="$NAMESPACE" \
            -- curl -f http://router:8000/health || echo "Router health check failed"

          echo ""
          echo "Testing hub health endpoint..."
          kubectl run curl-test-hub --image=curlimages/curl:latest --rm -i --restart=Never \
            --namespace="$NAMESPACE" \
            -- curl -f http://hub:8060/api/health || echo "Hub health check failed"

      - name: Deployment summary
        if: always()
        env:
          K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE }}
        run: |
          NAMESPACE="${K8S_NAMESPACE:-waddlebot}"

          echo ""
          echo "=== Deployment Summary ==="
          kubectl get all -n "$NAMESPACE"

          echo ""
          echo "=== Recent Events ==="
          kubectl get events -n "$NAMESPACE" --sort-by='.lastTimestamp' | tail -20

  # Notification
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-k8s]
    if: always()
    steps:
      - name: Build Status Summary
        env:
          DEPLOY_RESULT: ${{ needs.deploy-k8s.result }}
        run: |
          echo "## CI/CD Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deploy to Kubernetes | ${DEPLOY_RESULT} |" >> "$GITHUB_STEP_SUMMARY"

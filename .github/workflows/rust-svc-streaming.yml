name: Rust svc-streaming (lint + test)

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'core/svc_streaming/**'
      - '.github/workflows/rust-svc-streaming.yml'
      - '.github/workflows/rust-crate-ci.yml'
  pull_request:
    branches: [main, 'release/**']
    paths:
      - 'core/svc_streaming/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    name: fmt + clippy + deny + coverage
    uses: ./.github/workflows/rust-crate-ci.yml
    with:
      crate_name: svc-streaming
      working_directory: core/svc_streaming
      # aws-lc-sys needs cmake plus a C/C++ toolchain to build.
      extra_apt_packages: 'cmake build-essential'
      extra_apt_reason: 'for aws-lc-sys (cmake, C/C++ toolchain)'

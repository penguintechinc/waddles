name: Rust svc-streaming (lint + test)

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'core/svc_streaming/**'
      - '.github/workflows/rust-svc-streaming.yml'
      - '.github/workflows/rust-crate-ci.yml'
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path gate (release PRs only): shared detector, fails closed. A job skipped
  # here means "not affected"; main PRs / pushes / dispatch run everything.
  changes:
    name: Detect changed areas
    runs-on: ${{ ((github.event_name == 'pull_request' && github.base_ref != 'main' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'merge_group' && !endsWith(github.event.merge_group.base_ref, '/main')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && 'dal2-alpha' || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      match: ${{ steps.paths.outputs.match }}
    steps:
      - name: Checkout (change classifier only)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: |
            scripts/ci
            .github/actions
      - name: Classify changed paths
        id: paths
        uses: ./.github/actions/changed-paths
        with:
          area: rust
          globs: |
            core/svc_streaming/**

  lint-test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.match == 'true') }}
    name: fmt + clippy + deny + coverage
    uses: ./.github/workflows/rust-crate-ci.yml
    with:
      crate_name: svc-streaming
      working_directory: core/svc_streaming
      # aws-lc-sys needs cmake plus a C/C++ toolchain to build.
      extra_apt_packages: 'cmake build-essential'
      extra_apt_reason: 'for aws-lc-sys (cmake, C/C++ toolchain)'

  # Real-media proof: RTMP publish of genuine H.264/AAC -> real ffmpeg -> HLS playlist
  # + segments, asserted with ffprobe. ffmpeg runs in a container built FROM the same
  # sha256-pinned debian:bookworm-slim digest + ffmpeg=7:5.1.9-0+deb12u1 as
  # Dockerfile.rust's runtime image (tests/real_media/Dockerfile.ffmpeg), so the test
  # exercises the ffmpeg that ships. A missing docker/ffmpeg fails the job (the test
  # never skips with the feature on).
  real-media:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.match == 'true') }}
    name: real-media e2e (RTMP -> real ffmpeg -> HLS)
    # Starts Docker containers: GitHub-hosted only (no Docker socket / node creds on the ARC runner).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: core/svc_streaming
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Setup build deps (C toolchain, cmake)
        uses: ./.github/actions/setup-build-deps
        with:
          packages: 'cmake build-essential'
      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable branch snapshot
        with:
          toolchain: "1.97.1"

      - name: Cache cargo registry + git + target
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809  # v4.2.4  # zizmor: ignore[cache-poisoning]
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            core/svc_streaming/target
          key: cargo-svc-streaming-real-media-1.97.1-${{ runner.os }}-${{ hashFiles('core/svc_streaming/Cargo.lock') }}
          restore-keys: |
            cargo-svc-streaming-real-media-1.97.1-${{ runner.os }}-

      # Builds the pinned ffmpeg image, runs the feature-gated test with
      # SVC_STREAMING_REAL_FFMPEG/_FFPROBE/_WORKDIR provisioned, and removes the
      # containers/image afterwards (set -euo pipefail inside; exit status propagates).
      - name: Real-media e2e (cargo test --features real-media-e2e)
        run: tests/real_media/run.sh

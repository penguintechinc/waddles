name: Core bundles (reproducible build gate)

# Regression gate for the core-bundle-seeder's 409 digest_conflict incident: the seeder's
# app_versions table is immutable per (app_id, version), so a non-reproducible build of
# waddles.core.example.ping permanently burns a version slot the moment two different
# environments compute two different digests for it. scripts/verify-core-bundles-reproducible.sh
# builds bundles/Dockerfile.core-bundles TWICE, --no-cache, and asserts ping.wasm hashes
# identically across the two builds -- a check that must prove it actually ran (compared a
# non-zero number of artifacts) on every change under the paths below (critical-rules.md
# Verification Integrity).
#
# waddles.core.example.pyping is intentionally NOT covered by this gate -- it is not currently
# reproducible (componentize-py/CPython wizening, suspected ASLR-sensitive); tracked at
# https://github.com/penguintechinc/waddles/issues/521. Path filters below still include
# bundles/python/pyping/** and sdk/waddle-sdk/src/** so this workflow re-runs (and keeps
# proving the Rust artifact alone) on changes there too, even though pyping itself isn't hashed.

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'bundles/Dockerfile.core-bundles'
      - 'bundles/core-bundles.yaml'
      - 'bundles/rust/ping/**'
      - 'bundles/rust/twitch/**'
      - 'bundles/rust/discord/**'
      - 'bundles/rust/youtube/**'
      - 'bundles/rust/spectrum/**'
      - 'bundles/rust/wix/**'
      - 'bundles/python/pyping/**'
      - 'sdk/waddle-sdk-rs/**'
      - 'sdk/waddle-sdk/src/**'
      - 'wit/waddle-bundle/**'
      - 'scripts/verify-core-bundles-reproducible.sh'
      - '.github/workflows/core-bundles-reproducible.yml'
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path gate (release PRs only): shared detector, fails closed. A job skipped
  # here means "not affected"; main PRs / pushes / dispatch run everything.
  changes:
    name: Detect changed areas
    runs-on: ${{ ((github.event_name == 'pull_request' && github.base_ref != 'main' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'merge_group' && !endsWith(github.event.merge_group.base_ref, '/main')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && 'dal2-alpha-ci' || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      match: ${{ steps.paths.outputs.match }}
    steps:
      - name: Checkout (change classifier only)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: |
            scripts/ci
            .github/actions
      - name: Classify changed paths
        id: paths
        uses: ./.github/actions/changed-paths
        with:
          area: rust
          globs: |
            bundles/Dockerfile.core-bundles
            bundles/core-bundles.yaml
            bundles/rust/ping/**
            bundles/rust/twitch/**
            bundles/rust/discord/**
            bundles/rust/youtube/**
            bundles/rust/spectrum/**
            bundles/rust/wix/**
            bundles/python/pyping/**
            sdk/waddle-sdk-rs/**
            sdk/waddle-sdk/src/**
            wit/waddle-bundle/**
            scripts/verify-core-bundles-reproducible.sh

  reproducible-build:
    needs: changes
    name: two independent --no-cache builds must be byte-identical
    if: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'release' || github.event_name == 'workflow_dispatch') && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.match == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      # Docker Engine + buildx ship preinstalled on ubuntu-latest runners -- no setup-buildx
      # action needed for a plain `docker build` (no multi-platform/cache-export requirement
      # here; the whole point is a from-scratch, uncached build).
      - name: Verify core bundles are byte-reproducible (ping + twitch/discord/youtube/spectrum connectors -- pyping tracked at #521)
        run: bash scripts/verify-core-bundles-reproducible.sh

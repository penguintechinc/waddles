name: Data-Plane Parity

# Golden-vector parity harness (gh #840 PR4): proves the Rust/bundle ingest path
# matches the committed goldens. One shared corpus
# (tests/data_plane_parity/corpus) is run through the real Rust normalize.rs
# oracle (svc_ingest) and svc_process's closed-schema pii_tokenize classifier. Entry point:
# `make test-data-plane-parity` (scripts/ci/data-plane-parity.sh), which
# asserts each step's non-zero denominator.
#
# Path-filtered to the code the harness exercises (a path-filtered workflow that
# does not run reports nothing, so ci-gate.yml is unaffected on unrelated PRs).
# The builtin-handler inventory gate runs separately, on every PR
# (builtin-handler-inventory.yml).

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'tests/data_plane_parity/**'
      - 'core/svc_ingest/**'
      - 'core/svc_process/src/pii_tokenize.rs'
      - 'core/svc_process/tests/parity_pii_tokenize.rs'
      - 'core/svc_process/Cargo.*'
      - 'scripts/ci/data-plane-parity.sh'
      - 'scripts/ci/gen-connector-parity-expected.py'
      - 'scripts/ci/tests/test_gen_connector_parity_expected.py'
      - '.github/workflows/data-plane-parity.yml'
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path gate (release PRs only): shared detector, fails closed. A job skipped
  # here means "not affected"; main PRs / pushes / dispatch run everything.
  changes:
    name: Detect changed areas
    runs-on: ${{ ((github.event_name == 'pull_request' && github.base_ref != 'main' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'merge_group' && !endsWith(github.event.merge_group.base_ref, '/main')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && 'dal2-alpha-ci' || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      match: ${{ steps.paths.outputs.match }}
    steps:
      - name: Checkout (change classifier only)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: |
            scripts/ci
            .github/actions
      - name: Classify changed paths
        id: paths
        uses: ./.github/actions/changed-paths
        with:
          area: rust
          globs: |
            tests/data_plane_parity/**
            core/svc_ingest/**
            core/svc_process/src/pii_tokenize.rs
            core/svc_process/tests/parity_pii_tokenize.rs
            core/svc_process/Cargo.*
            scripts/ci/data-plane-parity.sh
            scripts/ci/gen-connector-parity-expected.py
            scripts/ci/tests/test_gen_connector_parity_expected.py
            .github/workflows/data-plane-parity.yml

  parity:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.match == 'true') }}
    name: Golden-vector parity (Rust oracle, PII classifier)
    # bare dal2-alpha-ci image has no cc/cmake/libatomic and sudo is blocked (no-new-privileges): C-toolchain / node jobs stay on hosted ubuntu-latest until a custom runner image bakes them in
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.13'

      - name: Setup build deps (C toolchain, cmake, protoc)
        uses: ./.github/actions/setup-build-deps
        with:
          packages: 'cmake build-essential protobuf-compiler'
      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable branch snapshot
        with:
          toolchain: "1.97.1"

      - name: Cache cargo registry + git + targets
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809  # v4.2.4  # zizmor: ignore[cache-poisoning]
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            core/svc_ingest/target
            core/svc_process/target
          key: cargo-data-plane-parity-1.97.1-${{ runner.os }}-${{ hashFiles('core/svc_ingest/Cargo.lock', 'core/svc_process/Cargo.lock') }}
          restore-keys: |
            cargo-data-plane-parity-1.97.1-${{ runner.os }}-

      - name: Golden-vector parity harness
        run: make test-data-plane-parity
        env:
          PYTHON_BIN: python3

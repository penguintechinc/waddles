[pytest]
asyncio_mode = auto
testpaths = tests
addopts = --cov --cov-config=.coveragerc --cov-report=term:skip-covered
markers =
    real_env_erasure: use the real EnvExternalErasure in services.data_privacy_service (no autouse fake)
    ollama_realpath: real-endpoint Ollama integration test (needs WADDLE_TEST_OLLAMA_URL; skipped otherwise)

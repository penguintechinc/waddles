[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names are self-documenting (pytest convention); S105/S106/S107 flag
# fixed test-only passwords/JWT secrets (e.g. mirroring flask_core's own
# `os.getenv("SECRET_KEY", "change-me-in-production")` default, or seed-user
# helper default passwords), not real credentials. S101 (assert) is standard
# pytest usage.
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "S101", "S105", "S106", "S107"]
# The example blueprint asserts a tenant_middleware postcondition
# (get_tenant_context always non-None on the success path) -- a defensive
# invariant note, not a security assert-in-prod-strips-it concern.
"blueprints/v2/platform.py" = ["S101"]
# Community-module port (M6, docs/plans/2026-08-31-hubapi-node-to-quart-
# migration.md): every blueprint's `_tenant_ok()`/inline helper repeats
# platform.py's same `assert ctx is not None` postcondition after
# `get_tenant_context()` -- the pattern every ported controller group
# was documented to repeat (see platform.py's own per-file-ignore above).
"blueprints/v1/community_*.py" = ["S101"]
# Bot module (M5): DTO/service-dataclass field names are deliberately
# camelCase to byte-match admin/hub_module/frontend/src/services/api.js's
# frozen /api/v1 JSON contract (soEnabled, platformUsername, createdAt,
# etc.) -- N815 flags every one of them; renaming would break the
# strangler-fig contract these blueprints exist to preserve. S101 covers
# the same tenant_middleware postcondition assert as platform.py above,
# repeated once per handler.
"blueprints/v1/bot.py" = ["N815", "S101"]
"services/bot_shoutout.py" = ["N815"]
"services/bot_ai_knowledge.py" = ["N815"]
# M1 Core Identity/Auth group -- postcondition asserts, same rationale as
# blueprints/v2/platform.py above (register()/get_my_profile() always
# return a populated result on this code path; worst case under -O is an
# AttributeError -> 500, never an auth bypass). Also v1 response/request
# DTOs are wire contracts pinned to `frontend/src/services/api.js` --
# camelCase field names are deliberate (security.md Output Validation:
# the JSON key IS the field name, no alias mechanism in this app's
# QuartSchema setup -- convert_casing defaults False and app.py doesn't
# opt in), not a naming-convention slip.
"blueprints/v1/auth.py" = ["S101", "N815"]
"blueprints/v1/identity.py" = ["N815"]
"blueprints/v1/passkey.py" = ["N815"]
"blueprints/v1/profile.py" = ["N815"]
"blueprints/v1/user_management.py" = ["N815"]
# M3 Platform-admin group -- same rationale as the M1 entries above:
# camelCase DTO fields are wire-contract-pinned to api.js, and
# tenant_middleware postcondition asserts (`ctx is not None`) mirror
# blueprints/v2/platform.py's own precedent.
"blueprints/v1/admin.py" = ["S101", "N815"]
"blueprints/v1/superadmin.py" = ["N815"]
# M2 Core Tenant group -- same rationale as blueprints/v1/auth.py above:
# S101 is a tenant_middleware postcondition assert (get_tenant_context
# always non-None on the success path), N815 is the camelCase DTO wire
# contract pinned to frontend/src/services/api.js's tenantApi.
"blueprints/v1/tenant.py" = ["S101", "N815"]
# Support/access-token port group -- same `_tenant_ok()` postcondition
# assert (`get_tenant_context()` always non-None after `tenant_middleware`
# has already run) as `blueprints/v1/community_*.py` above. No N815: this
# group's wire contract is snake_case (mirrors Node's raw Postgres row
# columns verbatim), not camelCase -- see `blueprints/v1/access_token.py`'s
# module docstring.
"blueprints/v1/support.py" = ["S101"]
"blueprints/v1/access_token.py" = ["S101"]
"services/profile_service.py" = ["S101"]
# M7 Streaming group (overlay/calls) -- same postcondition-assert rationale
# as blueprints/v1/auth.py above (`get_tenant_context(request)` is always
# non-None after `tenant_middleware` already ran; worst case under -O is an
# AttributeError -> 500, never an auth bypass). overlay.py's request/
# response DTOs (`isActive`/`themeConfig`/`enabledSources`/`overlayUrl`)
# and overlay_service.py's `OverlayRecord.overlayUrl` are wire contracts
# pinned to `frontend/src/services/api.js` / `AdminStreamOverlays.jsx` --
# deliberately mixed-case, not a naming-convention slip (see
# `hub_api/PORTING.md`'s DTO casing note).
"blueprints/v1/overlay.py" = ["S101", "N815"]
"blueprints/v1/calls.py" = ["S101"]
"services/overlay_service.py" = ["N815"]
# M7 Streaming group (music/stream/streaming) -- same camelCase-DTO
# rationale as blueprints/v1/auth.py above; DTO field names are wire
# contracts pinned to frontend/src/services/api.js. S101 added to music.py/
# stream.py/streaming.py (SCCEMBS P4 feature-flag PR) for the same
# tenant_middleware postcondition assert (`get_tenant_context` always
# non-None on the success path) the two-gate `feature_enabled(...)` guard
# needs `ctx.tenant_slug` from.
"blueprints/v1/music.py" = ["N815", "S101"]
"blueprints/v1/stream.py" = ["N815", "S101"]
"blueprints/v1/streaming.py" = ["S101"]
"services/music_service.py" = ["N815"]
"services/stream_service.py" = ["N815"]
# Privacy/Compliance group (GDPR DSAR + cookie consent) -- cookie_consent.py's
# request/response DTOs are wire contracts pinned to `frontend/src/contexts/
# CookieConsentContext.jsx` (consentId, userId, consentMethod, ...), same
# camelCase-is-deliberate rationale as blueprints/v1/auth.py above.
# data_privacy.py has no camelCase DTOs (its own contract -- already_deleted,
# exported_at, subject_id -- is snake_case) so needs no ignore.
"blueprints/v1/cookie_consent.py" = ["N815"]
# M3 Platform-admin/Public group -- v1 response/request DTOs are wire
# contracts pinned to `frontend/src/services/api.js` (platformApi/
# superAdminApi/publicApi), same rationale as the M1 blueprints above:
# camelCase field names are deliberate, not a convention slip.
"blueprints/v1/platform.py" = ["N815"]
"blueprints/v1/platform_config.py" = ["N815"]
"blueprints/v1/public.py" = ["N815"]
# M2 Core Tenancy-Misc group (communityProfileController.js /
# joinRequestController.js) -- same N815 rationale as the M1 entries
# above (`avatarUrl`/`socialLinks`/etc are wire-contract field names, not
# a naming-convention slip). `community_authz.py`/`community_profile_
# service.py` use `_get_active_community`'s own postcondition assert.
"blueprints/v1/community_profile.py" = ["N815"]
"blueprints/v1/join_request.py" = ["N815"]
"services/community_profile_service.py" = ["S101"]
"services/join_request_service.py" = ["N815"]
# Music Station queue feature (new API surface, not a port) -- DTO field
# names are camelCase by convention with every other v1 blueprint's own
# JSON contract (see services/community_music_queue_service.py's "DTO
# casing" note); S101 for community_music_queue.py already covered by the
# "blueprints/v1/community_*.py" glob above.
"blueprints/v1/community_music_queue.py" = ["N815"]
"services/community_music_queue_service.py" = ["N815"]
# Analytics module port (M9) -- same tenant_middleware postcondition
# assert as blueprints/v2/platform.py above (`get_tenant_context` always
# non-None on the success path for Scenario 2/4 routes).
"blueprints/v1/analytics.py" = ["S101"]
# Marketplace-catalog port group: `CatalogEntry`/`ModuleEntry`/`ModuleDetail`/
# `ModuleSubscription`/etc DTO fields are deliberately camelCase to byte-match
# `catalogService.js`'s `formatCatalogEntry`/`moduleService.js`'s `formatModule`
# JSON shape (`sourceId`, `displayName`, `avgRating`, `communityLogo`, ...) --
# same rationale as `blueprints/v1/auth.py`'s own N815 ignore above.
"services/marketplace_catalog_service.py" = ["N815"]
# Marketplace-vendor port: request/query dict keys are camelCase to
# byte-match `admin/hub_module/frontend/src/services/api.js`'s pinned
# `vendorApi`/`marketplaceAdminApi` JSON contract -- this group returns
# plain dicts (not quart-schema DTOs, matching the Community/Bot module
# precedent, not M1's), so the camelCase keys are JSON string keys, not
# Python identifiers -- N815 does not fire on them. Nothing group-
# specific to ignore here beyond the shared E711/E712 pydal idiom
# (inline `# noqa` at each call site, matching every other service
# module's own convention -- see `services/auth_service.py`/
# `services/community_activity.py`).
# M4 Marketplace Billing group (subscriptions/payments/premium/discount
# codes) -- request/response DTOs are wire contracts pinned to
# `frontend/src/services/api.js` (`communityId`, `discountType`,
# `successUrl`, ...), camelCase deliberate per the same rationale as
# `blueprints/v1/auth.py` above. S101 covers this group's
# `_require_community_admin`/`cancel_premium_subscription` postcondition
# asserts (tenant_middleware/just-updated-row invariants, never a runtime
# auth decision -- see those call sites' own comments).
"blueprints/v1/marketplace_billing.py" = ["N815", "S101"]
"services/marketplace_billing_service.py" = ["N815", "S101"]
# App Bundle 3-tier lifecycle group (marketplace_lifecycle) -- v1 request/
# response DTOs are camelCase (appId, configDefaults, isDefault, ...), same
# wire-contract rationale as the M1 entries above; `_tenant_id()`/
# `get_resolved_bundles()`/`activate_bundle()` repeat the standard
# tenant_middleware postcondition assert (`ctx is not None`) every other
# port group's own blueprint uses (see blueprints/v2/platform.py's own
# per-file-ignore above).
"blueprints/v1/marketplace_lifecycle.py" = ["S101", "N815"]
# Distribution API (svc-ingest/svc-process stage-runner poll endpoint) --
# `DistributionBundleDTO`'s appId/communityId are deliberately camelCase to
# match this repo's established v1 DTO convention (see the M1/M3/M7 entries
# above), and `list_distribution_bundles` repeats the same
# `assert ctx is not None` tenant_middleware postcondition as
# blueprints/v2/platform.py.
"blueprints/v1/distribution.py" = ["N815", "S101"]
# Music-station provider resolvers -- `ProviderUnavailable`/`TrackNotFound`
# are the literal exception names specified by the resolve()/search()
# contract these modules implement (not a naming-convention slip; adding
# "Error" would break every caller's `except ProviderUnavailable:`).
# S105 on `_TOKEN_URL`/`_TOKEN_FILE` false-positives on the substring
# "token" -- both are a public OAuth token-endpoint URL and a filesystem
# path, never a credential value.
"services/music_providers/errors.py" = ["N818"]
"services/music_providers/spotify.py" = ["S105"]
"services/music_providers/youtube.py" = ["S105"]
# Metered token billing (marketplace module, migration 076) -- credit/
# debit routes assert `result.balance_after is not None and
# result.transaction_id is not None` after `result.ok` is already True
# (`token_billing_service.TokenLedgerResult`'s own contract: both fields
# are only `None` on a blocked/`ok=False` result) -- a postcondition
# assert, same rationale as blueprints/v2/platform.py's `ctx is not None`
# above, not a security control an `-O` strip could bypass (worst case is
# an AttributeError -> 500, never a ledger bypass -- the real oversell
# guard is the WHERE-guarded UPDATE in token_billing_service.py, not this
# assert).
"blueprints/v1/token_billing.py" = ["S101"]
# BYOK egress PII redaction (LLM01 hardening) -- `_TOKEN_PLACEHOLDER =
# "[REDACTED_TOKEN]"` is the literal replacement string `redact_pii()`
# substitutes *in place of* a matched secret, never a credential value
# itself. Same false-positive shape as the music-provider `_TOKEN_URL`/
# `_TOKEN_FILE` entries above.
"services/ai_routing/pii_redaction.py" = ["S105"]
# Workstream usage admin API (spec Sec5.12, D31) -- camelCase DTO fields
# (workstreamId, hostCalls, fuelMs, ...) are the wire contract every other
# v1 blueprint's DTOs already use; S101 is the same tenant_middleware
# postcondition assert (`get_tenant_context` always non-None on the
# success path) as blueprints/v2/platform.py above.
"blueprints/v1/workstream_usage.py" = ["N815", "S101"]
# M2a hub-api install hooks (spec Sec9.2, Sec9.7) -- camelCase DTO
# fields (versionId, scanStatus, permissionHash, ...) match the wire
# contract every other v1 blueprint's DTOs already use; S101 is the
# same tenant_middleware postcondition assert as workstream_usage.py
# above.
"blueprints/v1/bundle_versions.py" = ["N815", "S101"]
"blueprints/v1/bundle_approvals.py" = ["N815", "S101"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
exclude = ["^\\.venv/", "^tests/"]

# libs/flask_core (this monorepo's shared lib -- see mem0 "waddlebot uses
# pydal directly, not penguin-dal") and pydal itself ship no py.typed
# marker / stubs, and several flask_core decorators (tenant_middleware,
# require_scope) have untyped inner wrappers -- follow_imports = "skip"
# (not just ignore_missing_imports) so mypy treats every imported name as
# Any rather than analyzing flask_core's own untyped source and flagging
# "untyped decorator" here. hub-api's own code stays --strict throughout;
# this is a boundary override for an external-to-this-service import, not
# a relaxation of hub-api's own typing bar.
[[tool.mypy.overrides]]
module = ["flask_core.*", "pydal.*"]
ignore_missing_imports = true
follow_imports = "skip"

# boto3/botocore/webauthn ship no py.typed marker either -- same boundary
# override, third-party-import only, not a relaxation of hub-api's own bar.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "webauthn.*"]
ignore_missing_imports = true

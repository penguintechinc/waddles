# Allowlist for scripts/ci/check-no-stubs.sh.
#
# Every entry deliberately defers a stub marker or silent-fallback finding
# to a tracked GitHub issue -- deferral must always be deliberate and
# tracked, never silent. The gate FAILS on:
#   (a) any stub/silent-fallback finding in non-test source that matches
#       NO entry below, and
#   (b) any entry below with a missing or empty `issue` field.
#
# `path`  -- exact repo-relative file path (no globs; keeps each entry
#            auditable to a single reviewed file, not a directory-wide
#            blanket exemption).
# `pattern` -- regex (re.search, case-insensitive) that must also match the
#            finding's line text. Entries here intentionally reuse the same
#            broad marker regex the detector itself uses (see
#            scripts/ci/check-no-stubs.sh STUB_PATTERN) -- the `path` scope
#            is what keeps this tight, not the pattern.
# `issue` -- REQUIRED tracking issue, e.g. "gh-598". Never leave empty.
#
# Triage (2026-10-04): every entry below is a pre-existing, loud (returns
# an explicit error/NotImplementedError or is a documented design gap),
# milestone-tagged seam -- not a silent fallback. New findings outside this
# list fail the gate; genuinely new deferred work needs its own issue +
# allowlist entry, filed deliberately, not silently merged.


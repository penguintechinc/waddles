# Rust-path / connector-bundle mapping for every live Python `builtin_handlers/*` module.
# Enforced by scripts/ci/check-builtin-handler-inventory.py (`make check-builtin-handler-inventory`,
# .github/workflows/builtin-handler-inventory.yml). See that script's docstring for the rules.
#
#   status: covered  -- a Rust path or bundle implements the handler. Every target is verified:
#                       `path` must exist and `contains` (regex) must match the file, so a stale or
#                       wrong mapping fails the gate. `parity`:
#                         verified   -- golden-vector corpus (tests/data_plane_parity) proves the
#                                       Python and Rust outputs match (or diff only by declared,
#                                       tracked divergences); needs `corpus` globs.
#                         unverified -- the replacement EXISTS but behaviour parity is not yet proven
#                                       by the corpus (the next PRs' job).
#   status: pending  -- acknowledged gap (`gap` + `tracking` required). Allowed while the Python
#                       handler exists; FATAL if the handler file is removed while still pending.
#                       `--strict` (the "remove Python" PR) fails on any pending entry.
#
# Deleting a Python handler: delete its entry here in the same PR (a stale entry fails the gate).

handlers:
  # ---------------------------------------------------------------- ingest
  - handler: core/svc_ingest/builtin_handlers/twitch_ingest.py
    status: covered
    parity: verified
    corpus: ["twitch/irc_*.json"]
    targets:
      - {kind: rust-path, path: core/svc_ingest/src/normalize.rs, contains: "pub fn normalize_twitch_irc"}
  - handler: core/svc_ingest/builtin_handlers/discord_ingest.py
    status: covered
    parity: verified
    corpus: ["discord/*.json"]
    targets:
      - {kind: rust-path, path: core/svc_ingest/src/normalize.rs, contains: "pub fn normalize_discord"}
  - handler: core/svc_ingest/builtin_handlers/twitch_eventsub_ingest.py
    status: covered
    parity: verified
    corpus: ["twitch/eventsub_*.json"]
    targets:
      - {kind: rust-path, path: core/svc_ingest/src/normalize.rs, contains: "pub fn normalize_twitch_eventsub"}
  - handler: core/svc_ingest/builtin_handlers/discord_gateway_manifest.py
    status: covered
    parity: unverified
    targets:
      - {kind: rust-path, path: core/svc_ingest/src/ingest/discord.rs, contains: "DiscordGatewayReceiver"}
  - handler: core/svc_ingest/builtin_handlers/twitch_gateway_manifest.py
    status: covered
    parity: unverified
    targets:
      - {kind: rust-path, path: core/svc_ingest/src/ingest/twitch.rs, contains: "normalize_twitch_irc"}
      - {kind: rust-path, path: core/svc_ingest/src/ingest/twitch_eventsub.rs, contains: "KNOWN_EVENT_TYPES"}
  - handler: core/svc_ingest/builtin_handlers/slack_ingest.py
    status: pending
    gap: "no Rust Slack Socket Mode receiver/normalizer or connector bundle (svc_ingest TODO(M5)); corpus slot tests/data_plane_parity/corpus/slack"
    tracking: "#840"
  - handler: core/svc_ingest/builtin_handlers/slack_gateway_manifest.py
    status: pending
    gap: "no Rust Slack receiver registration (see slack_ingest)"
    tracking: "#840"
  - handler: core/svc_ingest/builtin_handlers/kick_ingest.py
    status: pending
    gap: "no Rust Kick Pusher receiver/normalizer/webhook intake or connector bundle; corpus slot corpus/kick"
    tracking: "#840"
  - handler: core/svc_ingest/builtin_handlers/kick_gateway_manifest.py
    status: pending
    gap: "no Rust Kick receiver registration (see kick_ingest)"
    tracking: "#840"
  - handler: core/svc_ingest/builtin_handlers/youtube_live_ingest.py
    status: pending
    gap: "no Rust YouTube Live poll receiver/normalizer or connector bundle; corpus slot corpus/youtube"
    tracking: "#840"
  - handler: core/svc_ingest/builtin_handlers/spectrum_ingest.py
    status: pending
    gap: "no Rust Spectrum poll/org-sync receiver/normalizer or connector bundle (Bar Citizen v3.0 must-have); corpus slot corpus/spectrum"
    tracking: "#840"
  - handler: core/svc_ingest/builtin_handlers/echo_ingest.py
    status: covered
    parity: unverified
    targets:
      - {kind: rust-path, path: core/bundle_executor/tests/fixtures/echo-connector-src/src/lib.rs, contains: "fn on_frame"}


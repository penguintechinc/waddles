# hub-api install-pipeline manifest (bundle_manifest_v2 schema, schema_version 2) for
# waddles.core.example.greeter -- see bundles/python/pyping/hub-manifest.yaml's own header for
# why this is a separate file from this bundle's `bundle.yaml` (a different consumer's schema).
schema_version: 2
app_id: waddles.core.example.greeter
name: Greeter Keyword Responder Bundle (Python)
version: 1.0.2
feature: waddles.core.example
module: core
provider: builtin
language: python
artifact: prebuilt
execution_model: native
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      # NO `filters.command_prefix` on purpose: greeter answers ordinary chat lines, not just
      # `!greeter`. An absent filter key is "not a constraint" (rust-data-plane design spec
      # section 6), so the stage sees every chat.message; transform() cheap-rejects non-matches.
      - platform: twitch
        event_types: ["chat.message"]
      - platform: discord
        event_types: ["chat.message"]
  action:
    entry: "waddle:bundle/action-stage#dispatch"
egress: []
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: storage.kv
    justification: "persists per-community responder toggles and per-user reply cooldowns"
  - id: "chat.send:discord"
    justification: "greeter replies to the invoking user/channel via the relay host import (relay.push -> chat.send:discord)"
  - id: "chat.send:twitch"
    justification: "greeter replies to the invoking user/channel via the relay host import (relay.push -> chat.send:twitch)"
routes_to: []

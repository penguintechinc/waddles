# hub-api install-pipeline manifest (schema_version 2) for penguintechinc.waddles.lastseen.
# 1.0.0: new utility-pack bundle -- see src/app.py's module docstring.
schema_version: 2
app_id: penguintechinc.waddles.lastseen
name: Last Seen Bundle (Python)
version: 1.0.8
module: core
provider: builtin
author: github:penguintechinc
language: python
artifact: prebuilt
execution_model: native
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!lastseen"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!lastseen"]
  action:
    entry: "waddle:bundle/action-stage#dispatch"
egress: []
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: storage.kv
    justification: "persists a last-activity timestamp per pseudonymous user UUID (90-day TTL)"
  - id: "chat.send:discord"
    justification: "lastseen replies to the invoking user/channel via the relay host import (relay.push -> chat.send:discord)"
  - id: "chat.send:twitch"
    justification: "lastseen replies to the invoking user/channel via the relay host import (relay.push -> chat.send:twitch)"
routes_to: []

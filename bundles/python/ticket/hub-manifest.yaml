# hub-api install-pipeline manifest (schema_version 2) for waddles.core.example.ticket.
# 1.0.0: v2 port, KV-backed -- see src/app.py's module docstring.
schema_version: 2
app_id: waddles.core.example.ticket
name: Support Ticket Bundle (Python)
version: 1.0.3
feature: waddles.core.example
module: core
provider: builtin
language: python
artifact: prebuilt
execution_model: native
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!ticket"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!ticket"]
  action:
    entry: "waddle:bundle/action-stage#dispatch"
egress: []
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: storage.kv
    justification: "persists per-community support tickets, the open-ticket index and the id sequence"
  - id: "chat.send:discord"
    justification: "ticket replies to the invoking user/channel via the relay host import (relay.push -> chat.send:discord)"
  - id: "chat.send:twitch"
    justification: "ticket replies to the invoking user/channel via the relay host import (relay.push -> chat.send:twitch)"
routes_to: []

schema_version: 2
app_id: waddles.core.example.poll
name: Community Polls Bundle (Python)
# 1.0.0: extracted from the bot_process monolith (core/svc_process/builtin_handlers/
# community_polls_process.py) onto waddle_sdk.command's standard grammar and
# waddle_sdk.db's structured facade -- feature/bundle-poll. BUILD-ONLY: flag-gated OFF
# (waddles.command-poll), bot_process._FEATURE_MODULES left untouched.
# 1.0.1: PII-free creator/voter pseudonyms (SHA-256).
# 1.0.2: v1 imported the retired waddle_sdk.db.create_dal and could not load or build; ported to
# the structured db + community_kv API (one poll_records table, kv tallies, atomic one-vote
# markers), strict-boolean mod gate (a string badge no longer passes), tenant-wide community
# sentinel support (fix/bundle-defects-wave; refs gh-675).
version: 1.0.2
feature: waddles.core.example
module: core
provider: builtin
author: PenguinTech/waddles
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/poll
language: python
artifact: component
execution_model: wasi-component
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!poll"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!poll"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    config: {}
    spec:
      required_config: []
egress: []
# One app-owned table -- a non-empty `data.tables` is what grants the `db` capability
# (hub_api/services/bundle_approval_service.py::_derive_capabilities). The structured db
# interface gives a bundle exactly ONE table, so the three legacy shared tables
# (community_polls/poll_options/poll_votes) are replaced by this single row-per-poll table;
# the vote tally and one-vote-per-voter markers live in `kv` (see src/app.py's module docstring).
# Columns (informal today -- see loyalty/bundle.yaml for the declarative-schema onboarding gap):
#   poll_id         int8  not null  -- chat-visible sequence number (community_kv counter)
#   title           text  not null  (<= 200 chars, app-enforced)
#   options         text  not null  -- JSON array of 2-10 option strings (<= 100 chars each)
#   is_active       bool  not null
#   created_by_hash text(64) not null -- SHA-256 hex pseudonym of the creator, never a username
#   results         text  null      -- JSON array of final per-option counts, written at close
data:
  tables:
    - poll_records
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: storage.kv
    justification: "poll id counter, id->row index, per-option vote tallies and one-vote-per-voter markers"
  - id: flags.read
    justification: "reads the waddles.command-poll PostHog feature flag via feature_enabled to gate the command"
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: "1.0.2"
  min_version: "1.0.2"
  max_version: null

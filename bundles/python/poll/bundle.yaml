schema_version: 2
app_id: waddles.core.example.poll
name: Community Polls Bundle (Python)
# 1.0.0: extracted from the bot_process monolith (core/svc_process/bundles/
# community_polls_process.py) onto waddle_sdk.command's standard grammar and
# waddle_sdk.db's structured facade -- feature/bundle-poll. BUILD-ONLY: flag-gated OFF
# (waddles.command-poll), bot_process._FEATURE_MODULES left untouched.
version: 1.0.0
feature: waddles.core.example
module: core
provider: builtin
author: PenguinTech/waddles
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/poll
language: python
artifact: component
execution_model: wasi-component
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!poll"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!poll"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    config: {}
    spec:
      required_config: []
egress: []
# `data.tables` non-empty is what grants the `db` capability
# (hub_api/services/bundle_approval_service.py::_derive_capabilities) -- no `storage.kv`
# permission needed (this bundle never touches `kv`).
data:
  tables:
    - community_polls
    - poll_options
    - poll_votes
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions: []
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: "1.0.0"
  min_version: "1.0.0"
  max_version: null

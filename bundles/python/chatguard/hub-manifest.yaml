# hub-api install-pipeline manifest (bundle_manifest_v2 schema, schema_version 2) for
# waddles.core.example.chatguard -- see bundles/python/pyping/hub-manifest.yaml's own header for why
# this is a separate file from this bundle's `bundle.yaml`.
schema_version: 2
app_id: waddles.core.example.chatguard
name: Chat Guard Bundle (Python)
version: 1.1.1
feature: waddles.core.example
module: core
provider: builtin
author: github:penguintechinc
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/chatguard
language: python
artifact: prebuilt
execution_model: native
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      # NO `filters.command_prefix` on purpose -- see bundle.yaml (ordinary chat lines are inspected).
      - platform: twitch
        event_types: ["chat.message"]
      - platform: discord
        event_types: ["chat.message"]
      - platform: youtube
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!ban", "!unban", "!timeout", "!untimeout", "!kick", "!purge", "!modlog"]
  action:
    entry: "waddle:bundle/action-stage#dispatch"
egress: []
data:
  tables: []
limits:
  timeout_ms: 10000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: "storage.kv"
    justification: "persists the community's filter configuration, per-user link permits and warning cooldowns (pseudonymous keys only)"
  - id: "identity.resolve"
    justification: "chatguard resolves the permit target and the offending author to community user uuids (uuid-only, no names)"
  - id: "chat.delete:discord"
    justification: "deletes a message that broke an enabled filter rule (only the triggering event's own channel; the host confirms the delete)"
  - id: "chat.send:discord"
    justification: "chatguard replies to moderators and warns the offending author via the relay host import (relay.push -> chat.send:discord)"
  - id: "chat.send:twitch"
    justification: "chatguard replies to moderators and warns the offending author via the relay host import (relay.push -> chat.send:twitch)"
  - id: "chat.send:youtube"
    justification: "chatguard replies to moderation commands on YouTube via the relay host import (relay.push -> chat.send:youtube)"
  - id: "tool.call:waddles.core.service.twitch:twitch.moderation.ban"
    justification: "moderation commands delegate the platform ban/timeout to the platform service (host checks community:moderate; args carry a user uuid only)"
    params:
      write: true
  - id: "tool.call:waddles.core.service.twitch:twitch.moderation.timeout"
    justification: "moderation commands delegate the platform ban/timeout to the platform service (host checks community:moderate; args carry a user uuid only)"
    params:
      write: true
  - id: "tool.call:waddles.core.service.twitch:twitch.moderation.unban"
    justification: "moderation commands delegate the platform ban/timeout to the platform service (host checks community:moderate; args carry a user uuid only)"
    params:
      write: true
  - id: "tool.call:waddles.core.service.discord:discord.moderation.kick"
    justification: "moderation commands delegate the platform ban/timeout to the platform service (host checks community:moderate; args carry a user uuid only)"
    params:
      write: true
  - id: "tool.call:waddles.core.service.discord:discord.moderation.ban"
    justification: "moderation commands delegate the platform ban/timeout to the platform service (host checks community:moderate; args carry a user uuid only)"
    params:
      write: true
  - id: "tool.call:waddles.core.service.discord:discord.moderation.unban"
    justification: "moderation commands delegate the platform ban/timeout to the platform service (host checks community:moderate; args carry a user uuid only)"
    params:
      write: true
  - id: "tool.call:waddles.core.service.discord:discord.moderation.timeout"
    justification: "moderation commands delegate the platform ban/timeout to the platform service (host checks community:moderate; args carry a user uuid only)"
    params:
      write: true
  - id: "tool.call:waddles.core.service.discord:discord.moderation.untimeout"
    justification: "moderation commands delegate the platform ban/timeout to the platform service (host checks community:moderate; args carry a user uuid only)"
    params:
      write: true
  - id: "tool.call:waddles.core.service.youtube:youtube.chat.ban"
    justification: "moderation commands delegate the platform ban/timeout to the platform service (host checks community:moderate; args carry a user uuid only)"
    params:
      write: true
  - id: "tool.call:waddles.core.service.youtube:youtube.chat.unban"
    justification: "moderation commands delegate the platform ban/timeout to the platform service (host checks community:moderate; args carry a user uuid only)"
    params:
      write: true
routes_to: []
requested_tools:
- tool: twitch.moderation.ban
  access: write
  target_app_id: waddles.core.service.twitch
- tool: twitch.moderation.timeout
  access: write
  target_app_id: waddles.core.service.twitch
- tool: twitch.moderation.unban
  access: write
  target_app_id: waddles.core.service.twitch
- tool: discord.moderation.kick
  access: write
  target_app_id: waddles.core.service.discord
- tool: discord.moderation.ban
  access: write
  target_app_id: waddles.core.service.discord
- tool: discord.moderation.unban
  access: write
  target_app_id: waddles.core.service.discord
- tool: discord.moderation.timeout
  access: write
  target_app_id: waddles.core.service.discord
- tool: discord.moderation.untimeout
  access: write
  target_app_id: waddles.core.service.discord
- tool: youtube.chat.ban
  access: write
  target_app_id: waddles.core.service.youtube
- tool: youtube.chat.unban
  access: write
  target_app_id: waddles.core.service.youtube

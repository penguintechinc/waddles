# hub-api install-pipeline manifest (bundle_manifest_v2 schema, schema_version 2) for
# waddles.core.example.ask -- see bundles/python/pyping/hub-manifest.yaml's own header for why
# this is a separate file from this bundle's `bundle.yaml` (a different consumer's schema).
schema_version: 2
app_id: waddles.core.example.ask
name: Ask Bundle (Python, AI)
version: 1.0.0
feature: waddles.core.example
module: core
provider: builtin
language: python
artifact: prebuilt
execution_model: native
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!ask"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!ask"]
  action:
    entry: "waddle:bundle/action-stage#dispatch"
egress: []
data:
  tables: []
limits:
  timeout_ms: 10000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: ai.generate
    justification: "Dangerous: answers the caller's short question via the host-controlled self-hosted model (ai.generate, plain text, json=false). The question is untrusted: it is delimited inside a fixed SFW/concise/refuse-unsafe prompt, the host rejects PII prompts and rate-limits calls, one call per command, reply length bounded"
  - id: "chat.send:discord"
    justification: "replies with the answer (or an error) to the invoking channel via the relay host import (relay.push -> chat.send:discord)"
  - id: "chat.send:twitch"
    justification: "replies with the answer (or an error) to the invoking channel via the relay host import (relay.push -> chat.send:twitch)"
routes_to: []

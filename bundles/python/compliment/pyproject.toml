[project]
name = "waddle-bundle-compliment"
version = "1.0.3"
description = "`!compliment [@user]` -> a random compliment from a curated built-in bank, optionally directed at a named target, plus a per-community custom compliment bank (`!compliment add <text>`, mod/broadcaster-gated). Python equivalent of bundles/python/pyping, modeled on its hand-built (not bundle_compiler-routed) structure; uses the shared `waddle_sdk.command` grammar parser (see bundles/python/joke, bundles/python/shoutout for the bare-positional-target grammar extension)."
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
build = ["componentize-py==0.25.1"]
dev = ["pytest==8.3.3", "mypy==1.14.1", "ruff==0.11.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

# `waddle-sdk` ships no `py.typed` marker (a pre-existing SDK packaging gap, not fixable from
# this bundle without touching `sdk/waddle-sdk/` -- out of this bundle's scope). Silencing
# `import-untyped` here only, so `--strict` still catches real type errors in this bundle's
# own code -- same workaround as `bundles/python/joke/pyproject.toml`.
[[tool.mypy.overrides]]
module = "waddle_sdk.*"
ignore_missing_imports = true

schema_version: 2
app_id: waddles.core.shoutout.default
name: Shoutout Bundle (Python)
version: 1.0.0
feature: waddles.core.shoutout
module: core
provider: builtin
language: python
artifact: component
execution_model: wasi-component
is_default: false
author: PenguinTech/waddles
license: Apache-2.0
# Feature-flag key this bundle's own `transform()` checks via
# `waddle_sdk.flask_core.feature_flags.feature_enabled()` -- default OFF, per this bundle's
# own task requirement (contrast `waddles.core.example.*`'s always-on example bundles).
# Informational only: hub-api's `bundle_manifest_v2.py` does not read this key today, the
# actual gate lives in `src/app.py`'s `_FEATURE_FLAG` constant.
feature_flag: waddles.shoutout-bundle
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!so", "!shoutout", "!aiso"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!so", "!shoutout", "!aiso"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    # `waddleai_base_url` is `!aiso`-only (src/app.py's KNOWN GAP 5) -- hub-api's internal
    # AI-completions proxy has no fixed, Helm-release-independent DNS name, so this lets an
    # operator override the placeholder default to match their actual `HUB_API_URL`.
    config:
      waddleai_base_url: "http://hub-api:8204"
    spec:
      required_config: []
# Twitch Helix lookups (users + streams -- the latter for `!aiso`'s public, non-PII prompt
# context only, see src/app.py's module docstring "KNOWN GAPS" section) plus a PLACEHOLDER
# entry for hub-api's internal WaddleAI completions proxy: `hub-api` is the bare in-cluster
# Service name this repo's own compose/dev default uses, but a real Helm install's Service
# name is release-prefixed (`{{ fullname }}-hub-api-v3`) -- an operator must keep this entry
# in sync with `action.config.waddleai_base_url` above until templated egress hosts (or a
# native `ai.generate` capability) exist. The Twitch OAuth token exchange itself
# (id.twitch.tv) is still NOT egress this bundle ever performs -- same gap as before.
egress:
  - host: api.twitch.tv
    methods: ["GET"]
  - host: hub-api
    methods: ["POST"]
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions: []
config_schema:
  waddleai_base_url:
    type: string
    required: false
    default: "http://hub-api:8204"
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: "1.0.0"
  min_version: "1.0.0"
  max_version: null

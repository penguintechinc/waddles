[project]
name = "waddle-bundle-shoutout"
version = "1.1.0"
description = "Real `!so`/`!shoutout`/`!vso` -> Twitch/Kick/YouTube shoutout process/action-stage bundle, compiled to a WASI 0.2 component with componentize-py against wit/waddle-bundle/stage.wit. Migrates action/interactive/shoutout_interaction_module + hub_api/services/bot_shoutout.py onto the App Bundle spine; `!vso` adds a video/clip shoutout on the community overlay."
requires-python = ">=3.13"
dependencies = []
authors = [{ name = "PenguinTech/waddles" }]
license = "Apache-2.0"

[project.optional-dependencies]
build = ["componentize-py==0.25.1"]
dev = ["pytest==8.3.3", "pytest-cov==5.0.0", "ruff==0.7.4", "mypy==1.13.0", "bandit==1.7.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests: no module/class/method docstrings mandated, `assert` is pytest's own idiom.
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "S101", "S105", "S106", "S107"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = ["src", "../../../sdk/waddle-sdk/src"]
explicit_package_bases = true

# `wit_world` is componentize-py's generated binding module -- it only exists inside a real
# compiled component (see waddle_sdk.http/kv/log/relay/db's own module docstrings), never as a
# static stub on disk, so mypy can never resolve it. Same gap `bundles/python/pyping` inherits.
[[tool.mypy.overrides]]
module = "wit_world"
ignore_missing_imports = true

[project]
name = "waddle-bundle-shoutout"
version = "1.0.0"
description = "Real `!so`/`!shoutout` -> Twitch shoutout process/action-stage bundle, compiled to a WASI 0.2 component with componentize-py against wit/waddle-bundle/stage.wit. Migrates action/interactive/shoutout_interaction_module + hub_api/services/bot_shoutout.py onto the App Bundle spine."
requires-python = ">=3.13"
dependencies = []
authors = [{ name = "PenguinTech/waddles" }]
license = "Apache-2.0"

[project.optional-dependencies]
build = ["componentize-py==0.25.1"]
dev = ["pytest==8.3.3", "pytest-cov==5.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

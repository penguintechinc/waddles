[project]
name = "waddle-bundle-discord"
version = "1.0.1"
description = "`!discord` -> a per-community Discord invite link (!discord read, !discord set <url> / !discord reset mod-only), kv-backed."
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
build = ["componentize-py==0.25.1"]
dev = ["pytest==8.3.3", "mypy==1.14.1", "ruff==0.11.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

# `waddle-sdk` ships no `py.typed` marker (pre-existing SDK packaging gap, out of this
# bundle's scope) -- silenced for `import-untyped` only so `--strict` still catches real
# type errors in this bundle's own code (`app.py` `cast()`s the untyped `kv` returns).
[[tool.mypy.overrides]]
module = "waddle_sdk.*"
ignore_missing_imports = true

schema_version: 2
app_id: waddles.core.example.hangman
name: Hangman Bundle (Python)
# 1.0.0: initial release -- per-community hangman word-guessing game (feature/bundle-hangman).
# 1.0.3: activation-gated only -- removed the in-bundle waddles.command-hangman feature-flag guard (activation is the sole gate; see docs/reference/command-bundles.md).
version: 1.0.4
feature: waddles.core.example
module: core
provider: builtin
author: PenguinTech/waddles
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/hangman
language: python
artifact: component
execution_model: wasi-component
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!hangman"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!hangman"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    config: {}
    spec:
      required_config: []
egress: []
# No `data.tables` -- state lives in `kv` only (see `permissions` below).
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: storage.kv
    justification: "persists in-progress per-community hangman game state"
  - id: "chat.send:discord"
    justification: "hangman replies to the invoking user/channel via the relay host import (relay.push -> chat.send:discord)"
  - id: "chat.send:twitch"
    justification: "hangman replies to the invoking user/channel via the relay host import (relay.push -> chat.send:twitch)"
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: "1.0.4"
  min_version: "1.0.4"
  max_version: null

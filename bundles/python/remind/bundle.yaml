schema_version: 2
app_id: waddles.core.example.remind
name: Remind Bundle (Python)
# 1.0.0: initial release -- per-user, per-community reminder store/list/cancel, kv-only
# (feature/bundle-remind). Due-time DELIVERY is not wired -- see src/app.py's own module
# docstring "Delivery" section for the honest scope of this release.
version: 1.0.0
feature: waddles.core.example
module: core
provider: builtin
author: PenguinTech/waddles
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/remind
language: python
artifact: component
execution_model: wasi-component
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!remind"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!remind"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    config: {}
    spec:
      required_config: []
egress: []
# No `data.tables` -- state lives in `kv` only (see `permissions` below).
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - storage.kv
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: "1.0.0"
  min_version: "1.0.0"
  max_version: null

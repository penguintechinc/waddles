# hub-api install-pipeline manifest (bundle_manifest_v2, schema_version 2) for
# waddles.core.example.truthordare -- see bundles/python/pyping/hub-manifest.yaml's header
# for why this is separate from `bundle.yaml`.
schema_version: 2
app_id: waddles.core.example.truthordare
name: Truth Or Dare Bundle (Python)
version: 1.0.0
feature: waddles.core.example
module: core
provider: builtin
language: python
artifact: prebuilt
execution_model: native
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!truthordare"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!truthordare"]
  action:
    entry: "waddle:bundle/action-stage#dispatch"
egress: []
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: flags.read
    justification: "gates the command behind its waddles.command-truthordare feature flag (default off)"
  - id: "chat.send:discord"
    justification: "replies to the invoking command on its origin platform via the relay host import (relay.push -> chat.send:discord); stateless, no other capability is used"
  - id: "chat.send:twitch"
    justification: "replies to the invoking command on its origin platform via the relay host import (relay.push -> chat.send:twitch); stateless, no other capability is used"
routes_to: []

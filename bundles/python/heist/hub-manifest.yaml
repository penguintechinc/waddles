# hub-api install-pipeline manifest (bundle_manifest_v2 schema, schema_version 2) for
# waddles.core.example.heist -- see bundles/python/pyping/hub-manifest.yaml's own header for why
# this is a separate file from this bundle's `bundle.yaml` (a different consumer's schema).
schema_version: 2
app_id: waddles.core.example.heist
name: Heist Bundle (Python)
version: 1.0.0
feature: waddles.core.example
module: core
provider: builtin
author: "superpenguintv (Psychoboy)"
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/heist
notice: |
  Group-gamble game concept inspired by superpenguintv (Psychoboy)'s
  PenguinTwitchBot heist (https://github.com/Psychoboy/PenguinTwitchBot).
  This is an original Waddles implementation: the pool/odds mechanics, flavor
  text, resolution logic, and all game code are written fresh for this
  bundle. No original PenguinTwitchBot source code or text is reused.
language: python
artifact: prebuilt
execution_model: native
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!heist"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!heist"]
  action:
    entry: "waddle:bundle/action-stage#dispatch"
egress: []
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
# `storage.kv` -- required for the data plane to grant `kv` at all
# (hub_api/services/bundle_approval_service.py::KV_PERMISSION_ID).
permissions:
  - id: storage.kv
    justification: "persists per-community heist crew/pool state, balances and window config"
  - id: flags.read
    justification: "gates the command behind its waddles.command-heist feature flag"
routes_to: []

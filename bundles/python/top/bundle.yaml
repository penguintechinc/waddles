schema_version: 2
app_id: waddles.core.example.top
name: Top Leaderboard Bundle (Python)
version: 1.0.0
feature: waddles.core.example
module: core
provider: builtin
author: "superpenguintv (Psychoboy)"
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/top
notice: |
  Leaderboard command idea inspired by superpenguintv (Psychoboy)'s PenguinTwitchBot
  (https://github.com/Psychoboy/PenguinTwitchBot), used with permission -- ideas/design only.
  This is an original Waddles implementation: the grammar, limits, reply rendering and all
  logic are written fresh for this bundle. No original PenguinTwitchBot source code or text
  is copied.
language: python
artifact: component
execution_model: wasi-component
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!top"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!top"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    config: {}
    spec:
      required_config: []
egress: []
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: flags.read
    justification: "gates the command behind waddles.command-top"
  - id: economy.read
    justification: "reads the community economy leaderboard (economy.leaderboard) -- read-only, no wager/transfer"
  - id: "chat.send:discord"
    justification: "top replies to the invoking user/channel via the relay host import (relay.push -> chat.send:discord)"
  - id: "chat.send:twitch"
    justification: "top replies to the invoking user/channel via the relay host import (relay.push -> chat.send:twitch)"
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: "1.0.0"
  min_version: "1.0.0"
  max_version: null

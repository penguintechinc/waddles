# hub-api install-pipeline manifest (schema_version 2) for waddles.core.community.feed -- see bundles/python/pyping/hub-manifest.yaml for why this is separate from bundle.yaml.
schema_version: 2
app_id: waddles.core.community.feed
name: Community Feed Reader (Python)
version: 1.0.2
feature: waddles.core.community
module: core
provider: builtin
author: github:penguintechinc
language: python
artifact: prebuilt
execution_model: native
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!feed"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!feed"]
  action:
    entry: "waddle:bundle/action-stage#dispatch"
egress: []
data:
  tables: []
limits:
  timeout_ms: 5000
  memory_mb: 64
  egress_rps: 2
permissions:
  - id: storage.kv
    justification: "per-community feed url config and cache of the last good feed snapshot (events + public info); never the source of truth"
  - id: "chat.send:discord"
    justification: "replies to the invoking user/channel via the relay host import (relay.push -> chat.send:discord)"
  - id: "chat.send:twitch"
    justification: "replies to the invoking user/channel via the relay host import (relay.push -> chat.send:twitch)"
routes_to: []

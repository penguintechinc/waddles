schema_version: 2
app_id: waddles.core.community.feed
name: Community Feed Reader (Python)
version: 1.0.0
feature: waddles.core.community
module: core
provider: builtin
author: PenguinTech/waddles
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/community_feed
language: python
artifact: component
execution_model: wasi-component
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!feed"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!feed"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    config: {}
    spec:
      required_config: []
egress: []
data:
  tables: []
limits:
  timeout_ms: 5000
  memory_mb: 64
  egress_rps: 2
permissions:
  - id: storage.kv
    justification: "per-community feed url config and cache of the last good feed snapshot (events + public info); never the source of truth"
  - id: "chat.send:discord"
    justification: "replies to the invoking user/channel via the relay host import (relay.push -> chat.send:discord)"
  - id: "chat.send:twitch"
    justification: "replies to the invoking user/channel via the relay host import (relay.push -> chat.send:twitch)"
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: "1.0.0"
  min_version: "1.0.0"
  max_version: null

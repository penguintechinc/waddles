# hub-api install-pipeline manifest (bundle_manifest_v2 schema, schema_version 2) for
# waddles.core.example.timer -- see bundles/python/pyping/hub-manifest.yaml's own header for why
# this is a separate file from this bundle's `bundle.yaml` (a different consumer's schema).
#
# 1.0.0: initial kv-only recurring announcements, fired by chat activity -- see this bundle's
# src/app.py module docstring (feature/bundles-queue-timer).
schema_version: 2
app_id: waddles.core.example.timer
name: Timed Announcements Bundle (Python)
version: 1.0.0
feature: waddles.core.example
module: core
provider: builtin
language: python
artifact: prebuilt
execution_model: native
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      # No `filters.command_prefix` on purpose -- see bundle.yaml's comment (chat-activity tick).
      - platform: twitch
        event_types: ["chat.message"]
      - platform: discord
        event_types: ["chat.message"]
  action:
    entry: "waddle:bundle/action-stage#dispatch"
egress: []
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: storage.kv
    justification: "persists the per-community timer config, per-timer last-fired times and short-lived claim/lock keys"
  - id: "chat.send:discord"
    justification: "timer replies to !timer commands and posts due announcements to the channel via the relay host import (relay.push -> chat.send:discord)"
  - id: "chat.send:twitch"
    justification: "timer replies to !timer commands and posts due announcements to the channel via the relay host import (relay.push -> chat.send:twitch)"
routes_to: []

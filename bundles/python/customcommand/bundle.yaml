schema_version: 2
app_id: waddles.core.example.customcommand
name: Custom Command Bundle (Python)
# 1.0.0: new bundle -- see src/app.py's module docstring. Activation-gated only (no feature flag).
version: 1.0.0
feature: waddles.core.example
module: core
provider: builtin
author: PenguinTech/waddles
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/customcommand
language: python
artifact: component
execution_model: wasi-component
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
# NOTE: every chat message reaches `transform` (command_prefix is not an enforced routing filter
# -- see core/svc_process/src/spine.rs::handle_delivered): a stored `!<name>` command cannot be
# declared in a static prefix list, so the bundle filters internally (1 kv.get per `!` token).
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!cc", "!customcommand"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!cc", "!customcommand"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    config: {}
    spec:
      required_config: []
egress: []
# No `data.tables` -- state lives in `kv` only (see `permissions` below).
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: storage.kv
    justification: "stores per-community custom command responses, their run counters, the name index and a short edit lock"
  - id: "chat.send:discord"
    justification: "customcommand replies to the invoking user/channel via the relay host import (relay.push -> chat.send:discord)"
  - id: "chat.send:twitch"
    justification: "customcommand replies to the invoking user/channel via the relay host import (relay.push -> chat.send:twitch)"
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: "1.0.0"
  min_version: "1.0.0"
  max_version: null

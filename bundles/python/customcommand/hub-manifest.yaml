# hub-api install-pipeline manifest (bundle_manifest_v2 schema, schema_version 2) for waddles.core.example.customcommand --
# see bundles/python/pyping/hub-manifest.yaml's own header for why this is a separate file from
# this bundle's `bundle.yaml` (a different consumer's schema).
# 1.0.0: new bundle -- see src/app.py's module docstring.
schema_version: 2
app_id: waddles.core.example.customcommand
name: Custom Command Bundle (Python)
version: 1.0.0
feature: waddles.core.example
module: core
provider: builtin
language: python
artifact: prebuilt
execution_model: native
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
# NOTE: every chat message reaches `transform` (command_prefix is not an enforced routing filter
# -- see core/svc_process/src/spine.rs::handle_delivered): a stored `!<name>` command cannot be
# declared in a static prefix list, so the bundle filters internally (1 kv.get per `!` token).
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!cc", "!customcommand"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!cc", "!customcommand"]
  action:
    entry: "waddle:bundle/action-stage#dispatch"
egress: []
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: storage.kv
    justification: "stores per-community custom command responses, their run counters, the name index and a short edit lock"
  - id: "chat.send:discord"
    justification: "customcommand replies to the invoking user/channel via the relay host import (relay.push -> chat.send:discord)"
  - id: "chat.send:twitch"
    justification: "customcommand replies to the invoking user/channel via the relay host import (relay.push -> chat.send:twitch)"
routes_to: []

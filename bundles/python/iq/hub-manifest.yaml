# hub-api install-pipeline manifest (schema_version 2) for waddles.core.example.iq.
# 1.0.0: new fun-pack2 bundle -- see src/app.py's module docstring.
schema_version: 2
app_id: waddles.core.example.iq
name: Fun IQ Bundle (Python)
version: 1.0.2
feature: waddles.core.example
module: core
provider: builtin
language: python
artifact: prebuilt
execution_model: native
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!iq"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!iq"]
  action:
    entry: "waddle:bundle/action-stage#dispatch"
egress: []
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: "chat.send:discord"
    justification: "replies to the invoking command on its origin platform via the relay host import (relay.push -> chat.send:discord); no other capability is used"
  - id: "chat.send:twitch"
    justification: "replies to the invoking command on its origin platform via the relay host import (relay.push -> chat.send:twitch); no other capability is used"
routes_to: []

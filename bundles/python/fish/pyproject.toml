[project]
name = "waddle-bundle-fish"
version = "1.0.0"
description = "`!fish` -> a weighted-random, per-community fishing minigame (cast/list/admin cooldown config), kv-only v1. Inspired by superpenguintv (Psychoboy)'s PenguinTwitchBot fishing feature -- original implementation, no code/text reused. First bundle to use the shared waddle_sdk.command grammar parser (#618)."
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
build = ["componentize-py==0.25.1"]
dev = ["pytest==8.3.3", "mypy==1.14.1", "ruff==0.14.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

# `wit_world` is generated per-build, only inside a real compiled component
# (see sdk/waddle-sdk/src/waddle_sdk/db.py's own module docstring) -- never
# pip-installable, so no stub can exist for static analysis to find. Mirrors
# sdk/waddle-sdk/pyproject.toml's own override.
[[tool.mypy.overrides]]
module = ["wit_world"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names are self-documenting (pytest convention); S101 is standard
# pytest usage; D1xx docstrings are not required on every test function.
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "S101"]

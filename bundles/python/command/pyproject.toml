[project]
name = "waddle-bundle-command"
version = "1.0.2"
description = "`!command` -> generic per-community custom TEXT commands and timers (Twitch-style). Python equivalent of bundles/python/count, modeled on its hand-built (not bundle_compiler-routed) structure."
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
build = ["componentize-py==0.25.1"]
dev = ["pytest==8.3.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

schema_version: 2
app_id: waddles.core.example.commands
name: Commands Bundle (Python)
# 1.0.0: initial -- `!commands` lists the community's available commands (curated catalog + flag kill-switches).
version: 1.0.0
feature: waddles.core.example
module: core
provider: builtin
author: PenguinTech/waddles
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/commands
language: python
artifact: component
execution_model: wasi-component
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!commands"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!commands"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    config: {}
    spec:
      required_config: []
egress: []
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: flags.read
    justification: "reads each command's waddles.command-<name> flag (kill-switch) to filter the catalog"
  - id: "chat.send:discord"
    justification: "commands relays the list to the origin channel via relay.push -> chat.send:discord"
  - id: "chat.send:twitch"
    justification: "commands relays the list to the origin channel via relay.push -> chat.send:twitch"
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: "1.0.5"
  min_version: "1.0.5"
  max_version: null

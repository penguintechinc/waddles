schema_version: 2
app_id: waddles.core.example.duel
name: Duel Challenge Example Bundle (Python)
# 1.0.0: initial kv-only v1 -- !duel <user> (challenge)/!duel list/!duel set cooldown
# <seconds>. See src/app.py's own module docstring for full scope.
version: 1.0.2
feature: waddles.core.example
module: core
provider: builtin
author: PenguinTech/waddles
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/duel
language: python
artifact: component
execution_model: wasi-component
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!duel"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!duel"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    config: {}
    spec:
      required_config: []
egress: []
# No `data.tables` -- v1 is kv-only by design, same shape as fish/lurk/count (see
# src/app.py module docstring).
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: storage.kv
    justification: "persists per-community duel state and win/loss tallies"
  - id: flags.read
    justification: "gates the command behind its waddles.command-duel feature flag"
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: "1.0.2"
  min_version: "1.0.2"
  max_version: null

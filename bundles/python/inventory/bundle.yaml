schema_version: 2
app_id: waddles.core.example.inventory
name: Inventory Bundle (Python)
# 1.0.0: initial DB-backed v1 -- !inventory|!inv (own items)/!inv <user>/
# !inv give <item> <user>/!inv add|remove <item> <user>. See src/app.py's own module docstring
# for the full data-model rationale (per-user kv directory + db item ledger) and the two
# documented grammar extensions.
version: 1.0.1
feature: waddles.core.example
module: core
provider: builtin
# Attribution: the general shape of "every viewer accrues a per-user collection of items a
# broadcaster/mod can grant, and viewers can trade between each other" is common across Twitch
# economy bots, including superpenguintv (Psychoboy)'s PenguinTwitchBot -- NOT a literal port, no
# original source or text reused. See src/app.py's module docstring for detail.
author: "superpenguintv (Psychoboy)"
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/inventory
notice: |
  Per-user item/collectible concept inspired by the general shape common to Twitch economy bots,
  including superpenguintv (Psychoboy)'s PenguinTwitchBot (https://github.com/Psychoboy/PenguinTwitchBot).
  This is an original Waddles implementation: the command grammar, data model (structured db
  item ledger + kv per-user directory index), optimistic-concurrency update/transfer logic, and
  listing rendering are written fresh for this bundle. No original PenguinTwitchBot source code
  or text is reused.
language: python
artifact: component
execution_model: wasi-component
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!inventory", "!inv"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!inventory", "!inv"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    config: {}
    spec:
      required_config: []
egress: []
# One app-owned table -- this is what grants the `db` capability
# (hub_api/services/bundle_approval_service.py::_derive_capabilities: `data.tables`
# non-empty => `db`). Columns (informal today -- the richer `data.table.columns[]` declarative
# schema in hub_api/services/bundle_data_schema.py is "not wired into onboarding yet" per that
# module's own docstring, so hub-api's provisioning-time table creation for this bundle is a
# separate, pre-existing platform gap, not something this PR fixes -- identical to
# bundles/python/loyalty's own documented note):
#   actor_hash text(64) not null  -- SHA-256 hex pseudonym of the item-holder, never a raw
#                                    username/user_ref (see src/app.py::_pseudonym)
#   item       text     not null  -- normalized (stripped, lower-cased) item name
#   quantity   int8     not null default 0
data:
  tables:
    - inventory_items
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
# `storage.kv` -- required for the data plane to grant `kv` at all
# (hub_api/services/bundle_approval_service.py::KV_PERMISSION_ID); used here as a per-user
# item -> row_id directory index alongside the db ledger (see src/app.py).
permissions:
  - id: storage.kv
    justification: "persists per-user inventory entries keyed by pseudonym"
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: "1.0.1"
  min_version: "1.0.1"
  max_version: null

[project]
name = "waddle-bundle-socials"
version = "1.0.2"
description = "`!socials` -> per-community social-media links (!socials, !socials set/remove/list), kv-backed. Hand-built (not bundle_compiler-routed) structure, modeled on bundles/python/count."
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
build = ["componentize-py==0.25.1"]
dev = ["pytest==8.3.3", "pytest-cov==5.0.0", "mypy==1.14.1", "ruff==0.11.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

# `waddle-sdk` ships no `py.typed` marker (a pre-existing SDK packaging gap, out of this
# bundle's scope). Silencing `import-untyped` here only, so `--strict` still catches real type
# errors in this bundle's own code.
[[tool.mypy.overrides]]
module = "waddle_sdk.*"
ignore_missing_imports = true

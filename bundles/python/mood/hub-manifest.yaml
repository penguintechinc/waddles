# hub-api install-pipeline manifest (schema_version 2) for waddles.core.example.mood.
# 1.0.0: new fun-pack2 bundle -- see src/app.py's module docstring.
schema_version: 2
app_id: waddles.core.example.mood
name: Random Mood Bundle (Python)
version: 1.0.0
feature: waddles.core.example
module: core
provider: builtin
language: python
artifact: prebuilt
execution_model: native
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!mood"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!mood"]
  action:
    entry: "waddle:bundle/action-stage#dispatch"
egress: []
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: flags.read
    justification: "gates the command behind its waddles.command-mood feature flag"
routes_to: []

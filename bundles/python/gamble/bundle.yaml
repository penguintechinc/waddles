schema_version: 2
app_id: waddles.core.example.gamble
name: Gamble Bundle (Python)
# 1.0.1: strict-boolean is_mod/is_broadcaster badge reads -- a string badge ("false") no longer passes the mod gate (fix/bundle-defects-wave).
version: 1.0.1
feature: waddles.core.example
module: core
provider: builtin
# Net-new Waddles content -- no attribution/notice required.
author: PenguinTech/waddles
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/gamble
language: python
artifact: component
execution_model: wasi-component
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!gamble"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!gamble"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    config: {}
    spec:
      required_config: []
egress: []

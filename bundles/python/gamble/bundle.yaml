data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: storage.kv
    justification: "persists per-community gamble balances, cooldowns and odds config"
  - id: flags.read
    justification: "gates the command behind its waddles.command-gamble feature flag"
config_schema: {}
compatible_with: []
incompatible_with: []

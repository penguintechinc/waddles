schema_version: 2
app_id: waddles.core.example.slots
name: Slot Machine Bundle (Python)
# 1.0.0: initial kv-only v1 -- !slots (spin)/!slots list/!slots set cooldown <seconds>. See
# src/app.py's own module docstring for full scope + the cross-community-leaderboard deferral.
version: 1.0.2
feature: waddles.core.example
module: core
provider: builtin
# Net-new Waddles content -- no inspiration source, no attribution/notice required (contrast
# bundles/python/fish, which credits superpenguintv (Psychoboy) for its catch-and-track concept).
author: PenguinTech/waddles
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/slots
language: python
artifact: component
execution_model: wasi-component
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!slots"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!slots"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    config: {}
    spec:
      required_config: []
egress: []
# No `data.tables` -- v1 is kv-only by design (see src/app.py module docstring: no dependency
# on the in-flight #623 db order_by API). Cross-community leaderboards are explicitly deferred
# to a v2 that needs that API, not stubbed here.
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: storage.kv
    justification: "persists per-community slot-machine tallies and state"
  - id: flags.read
    justification: "gates the command behind its waddles.command-slots feature flag"
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: "1.0.2"
  min_version: "1.0.2"
  max_version: null

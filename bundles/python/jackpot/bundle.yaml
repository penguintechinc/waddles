schema_version: 2
app_id: waddles.core.example.jackpot
name: Jackpot Bundle (Python)
# 1.0.0: initial -- !jackpot <stake> / !jackpot. Economy-SDK stake, kv.increment pot, activation-gated.
version: 1.0.0
feature: waddles.core.example
module: core
provider: builtin
# Attribution: ideas/design only (see `notice`); original code, no MIT notice.
author: "SuperPenguinTV (Psychoboy)"
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/jackpot
notice: |
  Inspired by PenguinTwitchBot by SuperPenguinTV (with permission) -- ideas/design only,
  no code copied (https://github.com/Psychoboy/PenguinTwitchBot). The accumulating-pot
  mechanic, odds, flavor text and all code are written fresh for this bundle.
language: python
artifact: component
execution_model: wasi-component
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!jackpot"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!jackpot"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    config: {}
    spec:
      required_config: []
egress: []
# Stage split: the economy/identity host imports are served by the PROCESS stage only (svc_process),
# so every command step runs in `transform`; `dispatch` only relays the reply (relay is action-stage only).
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: storage.kv
    justification: "persists the community's accumulated pot and per-actor cooldown counters (pseudonymous keys)"
  - id: economy.read
    justification: "reads the actor's balance and max stake to fail loud on insufficient funds"
  - id: economy.wager
    justification: "atomically debits the actor's stake and credits a win payout (the pot) in one host call"
    params:
      max_bet: 500
  - id: identity.resolve
    justification: "resolves the triggering actor's community uuid, which the economy import requires"
  - id: "chat.send:discord"
    justification: "jackpot replies to the invoking user/channel via the relay host import (relay.push -> chat.send:discord)"
  - id: "chat.send:twitch"
    justification: "jackpot replies to the invoking user/channel via the relay host import (relay.push -> chat.send:twitch)"
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: "1.0.0"
  min_version: "1.0.0"
  max_version: null

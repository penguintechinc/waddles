[project]
name = "waddle-bundle-loyalty"
version = "1.0.2"
description = "`!points` -> a community-scoped points/currency ledger, DB-backed (structured db ops + a kv lookup index). Inspired by superpenguintv (Psychoboy)'s PenguinTwitchBot loyalty-points feature -- original implementation, no code/text reused. Uses the shared waddle_sdk.command grammar parser (#618) plus a documented single-bare-token extension for `!points <user>`."
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
build = ["componentize-py==0.25.1"]
dev = ["pytest==8.3.3", "mypy==1.14.1", "ruff==0.14.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

# `wit_world` is generated per-build, only inside a real compiled component
# (see sdk/waddle-sdk/src/waddle_sdk/db.py's own module docstring) -- never
# pip-installable, so no stub can exist for static analysis to find. Mirrors
# sdk/waddle-sdk/pyproject.toml's own override.
[[tool.mypy.overrides]]
module = ["wit_world"]
ignore_missing_imports = true

# `waddle_sdk` itself ships no `py.typed` marker yet (a pre-existing, SDK-wide gap --
# `sdk/waddle-sdk/pyproject.toml` has no equivalent override because it IS the package being
# checked there; every *consumer*, this bundle included, hits it). Without this, mypy --strict
# refuses to analyze it at all (`import-untyped`) rather than reading its real inline type
# hints -- `_db_*` wrapper return types are narrowed back explicitly in `src/app.py` where that
# would otherwise surface as `no-any-return`.
[[tool.mypy.overrides]]
module = ["waddle_sdk", "waddle_sdk.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names are self-documenting (pytest convention); S101 is standard
# pytest usage; D1xx docstrings are not required on every test function.
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "S101"]
# `wit_fake_db.py` reproduces componentize-py's exact generated class names
# (`Value_NullValue`, `Error_NotFound`, etc.) -- not Python CapWords, by design (see its own
# module docstring). Same exemption sdk/waddle-sdk/pyproject.toml grants its own
# `tests/wit_shapes.py` for the identical reason.
"tests/wit_fake_db.py" = ["N801", "N818"]

schema_version: 2
app_id: waddles.core.example.loyalty
name: Loyalty Points Bundle (Python)
version: 1.0.6
feature: waddles.core.example
module: core
provider: builtin
author: superpenguintv (Psychoboy)
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/loyalty
notice: 'Points/currency ledger concept inspired by superpenguintv (Psychoboy)''s

  PenguinTwitchBot loyalty-points feature (https://github.com/Psychoboy/PenguinTwitchBot).

  This is an original Waddles implementation: the command grammar, data model (structured

  db ledger + kv lookup index), optimistic-concurrency update loop, and leaderboard

  rendering are written fresh for this bundle. No original PenguinTwitchBot source
  code

  or text is reused.

  '
language: python
artifact: component
execution_model: wasi-component
is_default: false
stages:
  process:
    entry: waddle:bundle/process-stage#transform
    consumes:
    - platform: twitch
      event_types:
      - chat.message
      filters:
        command_prefix:
        - '!points'
        - '!give'
    - platform: discord
      event_types:
      - chat.message
      filters:
        command_prefix:
        - '!points'
        - '!give'
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: waddle:bundle/action-stage#dispatch
    config: {}
    spec:
      required_config: []
egress: []
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
- id: chat.send:discord
  justification: loyalty replies to the invoking user/channel via the relay host import
    (relay.push -> chat.send:discord)
- id: chat.send:twitch
  justification: loyalty replies to the invoking user/channel via the relay host import
    (relay.push -> chat.send:twitch)
- id: identity.resolve
  justification: Resolve the verified caller and host-issued mentions to community
    UUIDs
- id: tool.call:waddles.core.service.economy:points_view
  justification: Delegate points policy and money to the economy service
  params:
    write: false
- id: tool.call:waddles.core.service.economy:points_leaders
  justification: Delegate points policy and money to the economy service
  params:
    write: false
- id: tool.call:waddles.core.service.economy:points_set
  justification: Delegate points policy and money to the economy service
  params:
    write: true
- id: tool.call:waddles.core.service.economy:points_adjust
  justification: Delegate points policy and money to the economy service
  params:
    write: true
- id: tool.call:waddles.core.service.economy:give
  justification: Delegate points policy and money to the economy service
  params:
    write: true
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: 1.0.5
  min_version: 1.0.5
  max_version: null
requested_tools:
- tool: points_view
  access: read
  target_app_id: waddles.core.service.economy
- tool: points_leaders
  access: read
  target_app_id: waddles.core.service.economy
- tool: points_set
  access: write
  target_app_id: waddles.core.service.economy
- tool: points_adjust
  access: write
  target_app_id: waddles.core.service.economy
- tool: give
  access: write
  target_app_id: waddles.core.service.economy

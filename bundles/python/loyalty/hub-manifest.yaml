# hub-api install-pipeline manifest (bundle_manifest_v2 schema, schema_version 2) for
# waddles.core.example.loyalty -- see bundles/python/pyping/hub-manifest.yaml's own header for
# why this is a separate file from this bundle's `bundle.yaml` (a different consumer's schema).
schema_version: 2
app_id: waddles.core.example.loyalty
name: Loyalty Points Bundle (Python)
version: 1.0.0
feature: waddles.core.example
module: core
provider: builtin
author: "superpenguintv (Psychoboy)"
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/loyalty
notice: |
  Points/currency ledger concept inspired by superpenguintv (Psychoboy)'s
  PenguinTwitchBot loyalty-points feature (https://github.com/Psychoboy/PenguinTwitchBot).
  This is an original Waddles implementation: the command grammar, data model (structured
  db ledger + kv lookup index), optimistic-concurrency update loop, and leaderboard
  rendering are written fresh for this bundle. No original PenguinTwitchBot source code
  or text is reused.
language: python
artifact: prebuilt
execution_model: native
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!points"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!points"]
  action:
    entry: "waddle:bundle/action-stage#dispatch"
egress: []
# See bundle.yaml's own comment -- same table, same informal column shape.
data:
  tables:
    - loyalty_balances
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - storage.kv
routes_to: []

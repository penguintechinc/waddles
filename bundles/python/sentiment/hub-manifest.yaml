# hub-api install-pipeline manifest (bundle_manifest_v2 schema, schema_version 2) for
# waddles.core.example.sentiment -- see bundles/python/pyping/hub-manifest.yaml's own header for why
# this is a separate file from this bundle's `bundle.yaml` (a different consumer's schema).
schema_version: 2
app_id: waddles.core.example.sentiment
name: Sentiment Bundle (Python, AI)
version: 1.0.0
feature: waddles.core.example
module: core
provider: builtin
language: python
artifact: prebuilt
execution_model: native
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!sentiment"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!sentiment"]
  action:
    entry: "waddle:bundle/action-stage#dispatch"
egress: []
data:
  tables: []
limits:
  timeout_ms: 10000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: ai.generate
    justification: "DANGEROUS capability, minimal use: one ai.generate call per command to classify the mood of the caller's short text, returning small structured JSON {sentiment, confidence, emoji} (json=true, gemma e4b); the host picks the model, rejects PII and bounds the prompt; input is capped at 400 chars; the completion is treated as untrusted text"
  - id: "chat.send:discord"
    justification: "replies with the result (or an error) to the invoking channel via the relay host import (relay.push -> chat.send:discord)"
  - id: "chat.send:twitch"
    justification: "replies with the result (or an error) to the invoking channel via the relay host import (relay.push -> chat.send:twitch)"
routes_to: []

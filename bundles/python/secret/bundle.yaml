schema_version: 2
app_id: waddles.core.example.secret
name: Secret Messaging Bundle (Python)
version: 1.0.0
feature: waddles.core.example
module: core
provider: builtin
author: PenguinTech/waddles
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/secret
language: python
artifact: component
execution_model: wasi-component
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!secret"]
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!secret"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    config: {}
    spec:
      required_config: [hub_api_url, webui_url]
# hub-api host for POST /api/v1/one-time-secrets (scope secret_messaging:create). The service
# token is injected by the stage as the Authorization header via secret-ref
# SECRET_MESSAGING_SERVICE_TOKEN (value "Bearer <jwt>"); it never enters the guest.
egress:
  - host: hub-api.penguintech.cloud
    methods: ["POST"]
data:
  tables: []
limits:
  timeout_ms: 10000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: "chat.delete:discord"
    justification: "deletes the sender's original !secret chat message so the secret text does not stay public"
  - id: "dm.send:discord"
    justification: "DMs the target the single-use link to the secret (token in the URL fragment)"
  - id: "chat.send:discord"
    justification: "replies to the sender with a generic success/failure notice (never the secret)"
  - id: "net.http.fqdn:hub-api.penguintech.cloud"
    justification: "calls the hub-api one-time-secret create endpoint (scope secret_messaging:create)"
    params:
      methods: ["POST"]
  - id: storage.kv
    justification: "reads the community's username -> hub-user identity index (secret.target.*)"
  - id: flags.read
    justification: "gates the command behind waddles.command-secret and waddles.secret-messaging"
config_schema:
  hub_api_url:
    type: string
    description: "Base URL of hub-api; its host must match the net.http.fqdn grant"
  webui_url:
    type: string
    description: "Base URL of the webui that serves the /secret pull page"
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: "1.0.0"
  min_version: "1.0.0"
  max_version: null

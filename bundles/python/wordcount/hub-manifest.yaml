# hub-api install-pipeline manifest (schema_version 2, bundle_manifest_v2) for waddles.core.example.wordcount.
# 1.0.0: new fun-pack bundle -- see src/app.py's module docstring.
schema_version: 2
app_id: waddles.core.example.wordcount
name: Per-User Word Counter Bundle (Python)
version: 1.0.0
feature: waddles.core.example
module: core
provider: builtin
language: python
artifact: prebuilt
execution_model: native
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
# NOTE: every chat message reaches `transform` (command_prefix is not an enforced routing filter);
# the bundle counts every message and filters `!wordcount` internally.
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!wordcount"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!wordcount"]
  action:
    entry: "waddle:bundle/action-stage#dispatch"
egress: []
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: storage.kv
    justification: "persists per-user message and word counters keyed by a SHA-256 pseudonym of the hub-issued user token (no PII in keys)"
  - id: flags.read
    justification: "reads the waddles.command-wordcount feature flag (default OFF) via the flags host import; no other flag is read"
  - id: "chat.send:discord"
    justification: "replies to !wordcount on its origin platform via the relay host import (relay.push -> chat.send:discord); no other capability is used"
  - id: "chat.send:twitch"
    justification: "replies to !wordcount on its origin platform via the relay host import (relay.push -> chat.send:twitch); no other capability is used"
routes_to: []

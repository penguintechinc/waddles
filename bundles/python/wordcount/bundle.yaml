schema_version: 2
app_id: waddles.core.example.wordcount
name: Per-User Word Counter Bundle (Python)
# 1.0.0: new fun-pack bundle -- per-user kv counters (see src/app.py docstring).
version: 1.0.0
feature: waddles.core.example
module: core
provider: builtin
author: PenguinTech/waddles
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/wordcount
language: python
artifact: component
execution_model: wasi-component
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
# NOTE: every chat message reaches `transform` (command_prefix is not an enforced routing filter
# -- see core/svc_process/src/spine.rs::handle_delivered); the bundle counts every message and filters internally.
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!wordcount"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!wordcount"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    config: {}
    spec:
      required_config: []
egress: []
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: storage.kv
    justification: "persists per-user message and word counters keyed by a SHA-256 pseudonym of the hub-issued user token (no PII in keys)"
  - id: "chat.send:discord"
    justification: "replies to !wordcount on its origin platform via the relay host import (relay.push -> chat.send:discord); no other capability is used"
  - id: "chat.send:twitch"
    justification: "replies to !wordcount on its origin platform via the relay host import (relay.push -> chat.send:twitch); no other capability is used"
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: "1.0.0"
  min_version: "1.0.0"
  max_version: null

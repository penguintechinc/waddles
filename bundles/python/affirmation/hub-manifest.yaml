# hub-api install-pipeline manifest (bundle_manifest_v2 schema, schema_version 2) for
# waddles.core.example.affirmation -- see bundles/python/pyping/hub-manifest.yaml's own header
# for why this is a separate file from this bundle's `bundle.yaml`.
schema_version: 2
app_id: waddles.core.example.affirmation
name: Affirmation Bundle (Python)
version: 1.0.0
feature: waddles.core.example
module: core
provider: builtin
language: python
artifact: prebuilt
execution_model: native
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!affirmation"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!affirmation"]
  action:
    entry: "waddle:bundle/action-stage#dispatch"
egress: []
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: "chat.send:discord"
    justification: "affirmation replies to the invoking channel via the relay host import (relay.push -> chat.send:discord)"
  - id: "chat.send:twitch"
    justification: "affirmation replies to the invoking channel via the relay host import (relay.push -> chat.send:twitch)"
routes_to: []

[project]
name = "waddle-bundle-count"
version = "1.0.1"
description = "`!count` -> a per-(community, caller) kv-backed self counter, incremented and relayed back to the caller's own origin platform. Python equivalent of bundles/python/pyping, modeled on its hand-built (not bundle_compiler-routed) structure."
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
build = ["componentize-py==0.25.1"]
dev = ["pytest==8.3.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

schema_version: 2
app_id: waddles.core.example.count
name: Dynamic Counter Bundle (Python)
# 1.0.0 retired -- fix/bump-command-bundles-1.0.1, see this bundle's hub-manifest.yaml for why.
# 1.0.3: promoted from a trivial self-counter to dynamic, per-community named counters
# (!count add/remove/list, !<name> read/add/sub/set) -- feature/count-dynamic-counters.
# 1.0.4 (fix/bump-count-lurk-1.0.4): version-only bump to republish the colon-free `kv` key
# fix (gh-631, #638) -- app_versions is immutable per (app_id, version).
version: 1.0.6
feature: waddles.core.example
module: core
provider: builtin
author: PenguinTech/waddles
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/count
language: python
artifact: component
execution_model: wasi-component
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!count"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!count"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    config: {}
    spec:
      required_config: []
egress: []
# No `data.tables` -- state lives in `kv` only (see `permissions` below).
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: storage.kv
    justification: "persists per-community named counters and their registry"
  - id: flags.read
    justification: "gates the command behind its waddles.command-count feature flag"
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: "1.0.6"
  min_version: "1.0.6"
  max_version: null

schema_version: 2
app_id: waddles.core.example.uptime
name: Uptime Bundle (Python)
# 1.0.1: activation-gated only -- removed the in-bundle waddles.command-uptime feature-flag guard (activation is the sole gate; see docs/reference/command-bundles.md).
version: 1.0.1
feature: waddles.core.example
module: core
provider: builtin
author: PenguinTech/waddles
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/uptime
language: python
artifact: component
execution_model: wasi-component
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!uptime"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!uptime"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    config: {}
    spec:
      required_config: []
egress: []
# No `data.tables` -- state lives in `kv` only (single key `uptime.start`).
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: storage.kv
    justification: "persists the per-community start timestamp (uptime.start)"
  - id: platform.clock
    justification: "reads the current time to compute elapsed time since first activation"
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: "1.0.1"
  min_version: "1.0.1"
  max_version: null

schema_version: 2
app_id: waddles.core.example.label
name: User Label Bundle (Python)
version: 1.0.0
feature: waddles.core.example
module: core
provider: builtin
author: PenguinTech/waddles
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/label
language: python
artifact: component
execution_model: wasi-component
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!label"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!label"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    config: {}
    spec:
      required_config: []
egress: []
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: storage.kv
    justification: "persists per-community labels keyed by user UUID (never a raw username)"
  - id: flags.read
    justification: "gates the command behind its waddles.command-label feature flag"
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: "1.0.0"
  min_version: "1.0.0"
  max_version: null

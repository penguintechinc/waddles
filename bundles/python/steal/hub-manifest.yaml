# hub-api install-pipeline manifest (bundle_manifest_v2 schema, schema_version 2) for
# waddles.core.example.steal -- see bundles/python/pyping/hub-manifest.yaml's own header for why
# this is a separate file from this bundle's `bundle.yaml`.
schema_version: 2
app_id: waddles.core.example.steal
name: Steal Bundle (Python)
version: 1.0.0
feature: waddles.core.example
module: core
provider: builtin
author: "PenguinTech/waddles"
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/steal
notice: |
  inspired by PenguinTwitchBot by SuperPenguinTV (with permission) -- ideas/design only,
  no code copied. This is an original Waddles implementation: mechanics, flavor text and all
  game code are written fresh for this bundle.
language: python
artifact: prebuilt
execution_model: native
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!steal"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!steal"]
  action:
    entry: "waddle:bundle/action-stage#dispatch"
egress: []
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: "storage.kv"
    justification: "persists per-community steal cooldowns, stats and cooldown config"
  - id: "economy.read"
    justification: "steal reads balances / max-bet via the economy host import"
  - id: "economy.wager"
    justification: "steal settles stakes and payouts atomically via economy.wager"
  - id: "economy.transfer"
    justification: "steal pays the failed-steal penalty from the actor to the victim via economy.transfer"
  - id: "identity.resolve"
    justification: "steal resolves the invoking actor and the @mention target to community user uuids (uuid-only, no names)"
  - id: "chat.send:discord"
    justification: "steal replies to the invoking user/channel via the relay host import (relay.push -> chat.send:discord)"
  - id: "chat.send:twitch"
    justification: "steal replies to the invoking user/channel via the relay host import (relay.push -> chat.send:twitch)"
routes_to: []

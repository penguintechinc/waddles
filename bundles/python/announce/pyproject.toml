[project]
name = "waddle-bundle-announce"
version = "1.0.2"
description = "`!announce` -> saved per-community announcement messages (get/set/remove/list), kv-only v1. Uses the shared waddle_sdk.command grammar parser (#618) for set/remove/list, with a documented bare-key-read extension for the grammar's own 'unknown option or sub-module' case."
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
build = ["componentize-py==0.25.1"]
dev = ["pytest==8.3.3", "pytest-cov==5.0.0", "mypy==1.14.1", "ruff==0.14.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

# `waddle-sdk` ships no `py.typed` marker (a pre-existing SDK packaging gap, not fixable from
# this bundle without touching `sdk/waddle-sdk/` -- out of this bundle's scope). Silencing
# `import-untyped` here only, so `--strict` still catches real type errors in this bundle's
# own code (`app.py`'s `_kv_*` wrappers rely on `community_kv`'s own typed signatures rather
# than needing a `cast()`, but the import itself would otherwise fail `--strict` with
# `import-untyped`). Mirrors `bundles/python/count/pyproject.toml`'s own override.
[[tool.mypy.overrides]]
module = "waddle_sdk.*"
ignore_missing_imports = true

# `wit_world` is generated per-build, only inside a real compiled component
# (see sdk/waddle-sdk/src/waddle_sdk/db.py's own module docstring) -- never
# pip-installable, so no stub can exist for static analysis to find. Mirrors
# sdk/waddle-sdk/pyproject.toml's own override.
[[tool.mypy.overrides]]
module = ["wit_world"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names are self-documenting (pytest convention); S101 is standard
# pytest usage; D1xx docstrings are not required on every test function.
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "S101"]

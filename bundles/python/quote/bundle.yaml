schema_version: 2
app_id: waddles.core.example.quote
name: Quote Book Bundle (Python)
# 1.0.0: strangler extraction of core/svc_process/bundles/social_quote_process.py's
# `!quote` command into its own componentize-py bundle -- feature/bundle-quote.
# BUILD-ONLY / INERT: ships flag-OFF and is not yet wired into the strangler
# cut-over (bot_process._FEATURE_MODULES still owns `quote` live traffic until
# the activation-gate P4 work lands -- see this bundle's src/app.py docstring).
# Ported off the retired `waddle_sdk.db` DAL-style facade (create_dal/TableProxy/
# AsyncQuerySet) onto the structured insert/get/query/update/delete API -- see
# src/app.py's module docstring for the full rationale.
version: 1.0.1
feature: waddles.core.example
module: core
provider: builtin
author: PenguinTech/waddles
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/quote
language: python
artifact: component
execution_model: wasi-component
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!quote"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!quote"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    config: {}
    spec:
      required_config: []
egress: []
# One app-owned table (provisioned at install time in app_core/app_community, not the
# legacy shared `quotes` migration table (config/postgres/migrations/015_add_quote_tables.sql)
# the retired facade used) -- a non-empty `data.tables` is what grants the `db` capability
# (hub_api/services/bundle_approval_service.py::_derive_capabilities), never an explicit
# `storage.tables` permission entry. Columns (informal today, see `rank`'s own bundle.yaml
# comment for the richer declarative-schema gap this shares): seq int8 not null, quote_text
# text not null.
data:
  tables:
    - quote_entries
limits:
  timeout_ms: 3000
  memory_mb: 64
  egress_rps: 10
# `storage.kv` -- required for the data plane to grant `kv` at all
# (hub_api/services/bundle_approval_service.py::KV_PERMISSION_ID); used here as a
# seq -> row_id lookup index + an atomic sequence counter (see src/app.py).
permissions:
  - id: storage.kv
    justification: "persists the per-community quote store and its id sequence"
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: "1.0.1"
  min_version: "1.0.1"
  max_version: null

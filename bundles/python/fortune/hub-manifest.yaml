schema_version: 2
app_id: waddles.core.example.fortune
name: Fortune Cookie Bundle (Python)
version: 1.0.0
feature: waddles.core.example
module: core
provider: builtin
language: python
artifact: prebuilt
execution_model: native
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!fortune"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!fortune"]
  action:
    entry: "waddle:bundle/action-stage#dispatch"
egress: []
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: flags.read
    justification: "reads the waddles.command-fortune PostHog feature flag via feature_enabled to gate the command"
routes_to: []

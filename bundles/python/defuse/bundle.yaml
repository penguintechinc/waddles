schema_version: 2
app_id: waddles.core.example.defuse
name: Defuse Bundle (Python)
version: 1.0.0
feature: waddles.core.example
module: core
provider: builtin
author: "PenguinTech/waddles"
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/defuse
notice: |
  inspired by PenguinTwitchBot by SuperPenguinTV (with permission) -- ideas/design only,
  no code copied. This is an original Waddles implementation: mechanics, flavor text and all
  game code are written fresh for this bundle.
language: python
artifact: component
execution_model: wasi-component
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!defuse"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!defuse"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    config: {}
    spec:
      required_config: []
egress: []
# No `data.tables` -- state is kv-only; currency moves only through the economy host import.
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: "storage.kv"
    justification: "persists per-community defuse cooldowns, stats and odds config"
  - id: "economy.read"
    justification: "defuse reads balances / max-bet via the economy host import"
  - id: "economy.wager"
    justification: "defuse settles stakes and payouts atomically via economy.wager"
  - id: "identity.resolve"
    justification: "defuse resolves the invoking actor to community user uuids (uuid-only, no names)"
  - id: "chat.send:discord"
    justification: "defuse replies to the invoking user/channel via the relay host import (relay.push -> chat.send:discord)"
  - id: "chat.send:twitch"
    justification: "defuse replies to the invoking user/channel via the relay host import (relay.push -> chat.send:twitch)"
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: "1.0.0"
  min_version: "1.0.0"
  max_version: null

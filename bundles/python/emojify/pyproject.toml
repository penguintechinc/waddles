[project]
name = "waddle-bundle-emojify"
version = "1.0.0"
description = "`!emojify <text>` -> sprinkles a relevant emoji after matching words (keyword map, fallback sparkle) (capped, never logged). Stateless: relay only, no kv/db."
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
build = ["componentize-py==0.25.1"]
dev = ["pytest==8.3.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

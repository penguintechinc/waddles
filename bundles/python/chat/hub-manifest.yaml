# hub-api install-pipeline manifest (bundle_manifest_v2 schema, schema_version 2) for
# waddles.core.example.chat -- see bundles/python/pyping/hub-manifest.yaml's own header for why
# this is a separate file from this bundle's `bundle.yaml` (a different consumer's schema).
#
# 1.0.0: initial port of core/svc_process/builtin_handlers/community_chat_process.py's two read-only
# commands (chat-history, channels) -- see this bundle's src/app.py module docstring
# (feature/bundle-chat). BUILD-ONLY / INERT -- see that docstring's own note.
# 2026-10-08: re-ported onto the structured waddle_sdk.db facade -- no data/storage capability
# declared (the facade can't read the hub-owned hub_chat_messages table). Tracked:
# https://github.com/penguintechinc/waddles/issues/678
schema_version: 2
app_id: waddles.core.example.chat
name: Chat History Bundle (Python)
version: 1.0.1
feature: waddles.core.example
module: core
provider: builtin
language: python
artifact: prebuilt
execution_model: native
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!chat-history", "!channels"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!chat-history", "!channels"]
  action:
    entry: "waddle:bundle/action-stage#dispatch"
egress: []
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: flags.read
    justification: "reads the waddles.command-chat PostHog feature flag via feature_enabled to gate the command"
routes_to: []

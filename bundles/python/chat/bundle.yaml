schema_version: 2
app_id: waddles.core.example.chat
name: Chat History Bundle (Python)
# 1.0.0: initial port of core/svc_process/bundles/community_chat_process.py's two read-only
# commands (chat-history, channels) into a WASM-component App Bundle -- feature/bundle-chat.
# BUILD-ONLY / INERT: bot_process._FEATURE_MODULES still runs the original monolith module;
# cut-over to this bundle is a separate, later change (P4 activation gate).
# 2026-10-08: re-ported onto the structured waddle_sdk.db facade (release/v3.0.X) -- the
# facade has no path to read the hub-owned `hub_chat_messages` table (see src/app.py's own
# module docstring), so this bundle no longer declares any data/storage capability at all;
# both commands always reply with an explicit "not available yet" message. Tracked:
# https://github.com/penguintechinc/waddles/issues/678
version: 1.0.1
feature: waddles.core.example
module: core
provider: builtin
author: PenguinTech/waddles
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/chat
language: python
artifact: component
execution_model: wasi-component
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!chat-history", "!channels"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!chat-history", "!channels"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    config: {}
    spec:
      required_config: []
egress: []
# No `data.table` -- this bundle holds no state of its own and has no path to read the
# hub-owned `hub_chat_messages` table under the current structured `db` facade (one
# bundle-owned table only, see src/app.py's module docstring). Both commands reply with an
# explicit "not available yet" message rather than attempting an impossible db call.
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
# No `storage.kv`/`storage.db` -- no capability this bundle actually uses.
permissions:
  - id: flags.read
    justification: "reads the waddles.command-chat PostHog feature flag via feature_enabled to gate the command"
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: "1.0.1"
  min_version: "1.0.1"
  max_version: null

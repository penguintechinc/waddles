# hub-api install-pipeline manifest (schema_version 2) for waddles.core.barcitizen.readonly -- see bundles/python/pyping/hub-manifest.yaml for why this is separate from bundle.yaml.
schema_version: 2
app_id: waddles.core.barcitizen.readonly
name: Bar Citizen Read-Only Module (Python)
version: 1.0.0
feature: waddles.core.barcitizen
module: core
provider: builtin
language: python
artifact: prebuilt
execution_model: native
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!bc"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!bc"]
  action:
    entry: "waddle:bundle/action-stage#dispatch"
egress:
  - host: barcitizen.org
    methods: ["GET"]
data:
  tables: []
limits:
  timeout_ms: 5000
  memory_mb: 64
  egress_rps: 2
permissions:
  - id: storage.kv
    justification: "per-community cache of the last good Bar Citizen feed snapshot (events + public info); never the source of truth"
  - id: net.http.fqdn:barcitizen.org
    justification: "read-only pull of Bar Citizen's public events/info JSON feed; GET only, no credentials"
    params:
      methods: ["GET"]
  - id: "chat.send:discord"
    justification: "replies to the invoking user/channel via the relay host import (relay.push -> chat.send:discord)"
  - id: "chat.send:twitch"
    justification: "replies to the invoking user/channel via the relay host import (relay.push -> chat.send:twitch)"
routes_to: []

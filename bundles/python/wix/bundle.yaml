schema_version: 2
app_id: waddles.core.integration.wix
name: Wix Integration (Python)
version: 1.0.2
feature: waddles.core.integration
module: core
provider: builtin
author: github:penguintechinc
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/wix
language: python
artifact: component
execution_model: wasi-component
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!wix"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    config: {}
    spec:
      required_config: []
egress:
  - host: www.wixapis.com
    methods: ["GET"]
data:
  tables: []
limits:
  timeout_ms: 5000
  memory_mb: 64
  egress_rps: 5
permissions:
  - id: storage.kv
    justification: "per-community Wix member links (keyed by community user UUID, opaque Wix UUID value), a 5-minute status cache and the module flags"
  - id: identity.resolve
    justification: "resolves the verified caller and host-issued @mentions to community UUIDs so no raw handle is ever stored or logged"
  - id: net.http.fqdn:www.wixapis.com
    justification: "Wix REST Members API (GET /members/v1/members/<id>) for membership status; GET only, API key and site id via secret-refs"
    params:
      methods: ["GET"]
  - id: "chat.send:discord"
    justification: "replies to the invoking user/channel via the relay host import (relay.push -> chat.send:discord)"
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: "1.0.0"
  min_version: "1.0.0"
  max_version: null

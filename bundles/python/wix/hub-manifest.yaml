# hub-api install-pipeline manifest (schema_version 2) for waddles.core.integration.wix -- see bundles/python/pyping/hub-manifest.yaml for why this is separate from bundle.yaml.
schema_version: 2
app_id: waddles.core.integration.wix
name: Wix Integration (Python)
version: 1.1.0
feature: waddles.core.integration
module: core
provider: builtin
language: python
artifact: prebuilt
execution_model: native
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!wix"]
      - platform: wix
        event_types: ["subscription.started", "subscription.changed", "subscription.ended", "event.created", "event.updated", "event.canceled"]
  action:
    entry: "waddle:bundle/action-stage#dispatch"
egress:
  - host: www.wixapis.com
    methods: ["GET"]
data:
  tables: []
limits:
  timeout_ms: 5000
  memory_mb: 64
  egress_rps: 5
permissions:
  - id: storage.kv
    justification: "per-community Wix member links (keyed by community user UUID, opaque Wix UUID value), a 5-minute status cache and the module flags"
  - id: identity.resolve
    justification: "resolves the verified caller and host-issued @mentions to community UUIDs so no raw handle is ever stored or logged"
  - id: net.http.fqdn:www.wixapis.com
    justification: "Wix REST Members API (GET /members/v1/members/<id>) for membership status; GET only, API key and site id via secret-refs"
    params:
      methods: ["GET"]
  - id: "tool.call:waddles.core.service.discord:discord.member.roles.add"
    justification: "plan -> role: grant the mapped Discord role on an active Wix subscription (default-OFF module, approved grant required)"
    params:
      write: true
  - id: "tool.call:waddles.core.service.discord:discord.member.roles.remove"
    justification: "plan -> role: revoke the mapped Discord role when the subscription ends (default-OFF module, approved grant required)"
    params:
      write: true
  - id: "tool.call:waddles.core.service.discord:discord.scheduled_event.create"
    justification: "event sync: mirror a new Wix event as a Discord scheduled event (default-OFF module, approved grant required)"
    params:
      write: true
  - id: "tool.call:waddles.core.service.discord:discord.scheduled_event.update"
    justification: "event sync: mirror a Wix event edit to its Discord scheduled event (default-OFF module, approved grant required)"
    params:
      write: true
  - id: "tool.call:waddles.core.service.discord:discord.scheduled_event.cancel"
    justification: "event sync: cancel the Discord scheduled event when the Wix event is canceled (default-OFF module, approved grant required)"
    params:
      write: true
  - id: "chat.send:discord"
    justification: "replies to the invoking user/channel via the relay host import (relay.push -> chat.send:discord)"
routes_to: []
requested_tools:
  - tool: discord.member.roles.add
    access: write
    target_app_id: waddles.core.service.discord
  - tool: discord.member.roles.remove
    access: write
    target_app_id: waddles.core.service.discord
  - tool: discord.scheduled_event.create
    access: write
    target_app_id: waddles.core.service.discord
  - tool: discord.scheduled_event.update
    access: write
    target_app_id: waddles.core.service.discord
  - tool: discord.scheduled_event.cancel
    access: write
    target_app_id: waddles.core.service.discord

[project]
name = "waddle-bundle-wix"
version = "1.0.2"
description = "`!wix` -> Wix integration: membership status/link/remove over the Wix REST API (UUID-tokenized links), plus default-off plan-role and event-sync modules."
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
build = ["componentize-py==0.25.1"]
dev = ["pytest==8.3.3", "pytest-cov==5.0.0", "mypy==1.14.1", "ruff==0.11.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

# `waddle-sdk` ships no `py.typed` marker (pre-existing SDK packaging gap, out of scope here).
[[tool.mypy.overrides]]
module = "waddle_sdk.*"
ignore_missing_imports = true

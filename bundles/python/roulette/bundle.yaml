schema_version: 2
app_id: waddles.core.example.roulette
name: Russian Roulette Bundle (Python)
# 1.0.0: initial kv-only v1 -- !roulette (pull)/!roulette list/!roulette set cooldown
# <seconds>. See src/app.py's own module docstring for full scope, the flavor-only-no-real-
# timeout guarantee, and the cross-community-leaderboard deferral.
version: 1.0.1
feature: waddles.core.example
module: core
provider: builtin
# Net-new Waddles content -- no inspiration source, no attribution/notice required (contrast
# bundles/python/fish, which credits superpenguintv (Psychoboy) for its catch-and-track concept).
author: PenguinTech/waddles
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/roulette
language: python
artifact: component
execution_model: wasi-component
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!roulette"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!roulette"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    config: {}
    spec:
      required_config: []
egress: []
# No `data.tables` -- v1 is kv-only by design (see src/app.py module docstring). Cross-
# community leaderboards are explicitly deferred to a v2 that needs a real `db` capability,
# not stubbed here.
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: storage.kv
    justification: "persists per-community roulette tallies and round state"
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: "1.0.1"
  min_version: "1.0.1"
  max_version: null

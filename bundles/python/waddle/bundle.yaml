schema_version: 2
app_id: waddles.core.example.waddle
name: Waddle Example Bundle (Python)
# 1.0.1: activation-gated only -- removed the in-bundle waddles.command-waddle feature-flag guard (activation is the sole gate; see docs/reference/command-bundles.md).
version: 1.0.2
feature: waddles.core.example
module: core
provider: builtin
author: PenguinTech/waddles
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/waddle
language: python
artifact: component
execution_model: wasi-component
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!waddle"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!waddle"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    config: {}
    spec:
      required_config: []
egress: []
# No kv/db state -- stateless (flags.read only).
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions: []
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: "1.0.1"
  min_version: "1.0.1"
  max_version: null

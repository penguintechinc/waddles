schema_version: 2
app_id: waddles.core.example.lurk
name: Lurk Toggle Example Bundle (Python)
# 1.0.0 retired -- fix/bump-command-bundles-1.0.1, see this bundle's hub-manifest.yaml for why.
# 1.0.3 (feature/lurk-v1): stateful lurk/unlurk rewrite -- per-community message
# templates, 24h TTL lurk-start state, and broadcaster/mod-only config commands
# (`set`/`enable ai`/`disable ai`/`reset`). See src/app.py's own module docstring.
# 1.0.4 (fix/bump-count-lurk-1.0.4): version-only bump to republish the colon-free `kv` key
# fix (gh-631, #638) -- app_versions is immutable per (app_id, version).
# 1.0.5 (fix/lurk-silent-missing-community, gh-655): dispatch() now replies to chat before
# raising on the "no community" path (fail-loud, matching `_fail_kv`'s own shape), instead of
# only logging -- the tenant-wide activation (`community_id: null`) hit this on every message,
# leaving `!lurk` totally silent in Discord.
# 1.0.6 (this task): dispatch() now actually FUNCTIONS under the tenant-wide sentinel
# (`community=None`) instead of only replying with an error -- `community is None` is the
# host's own deliberate tenant-wide signal (`core/bundle_active_set/src/scope.rs::
# resolve_scope`'s `community_id == 0`), not a bug, and is scoped under
# `waddle_sdk.community_kv.TENANT_WIDE_SENTINEL` ("0"), same as `community_kv` itself now
# does. Only an empty-string `community` (never emitted by the host) still fails loud.
# app_versions is immutable per (app_id, version), so this bump is required to republish the
# fixed wasm.
version: 1.0.7
feature: waddles.core.example
module: core
provider: builtin
author: PenguinTech/waddles
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/lurk
language: python
artifact: component
execution_model: wasi-component
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!lurk", "!unlurk"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!lurk", "!unlurk"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    config: {}
    spec:
      required_config: []
egress: []
# No `data.tables` -- state lives in `kv` only (see `permissions` below: the
# `storage.kv` capability id, required to grant `kv` at all per
# hub_api/services/bundle_approval_service.py::_derive_capabilities()).
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: storage.kv
    justification: "persists per-community lurk state"
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: "1.0.7"
  min_version: "1.0.7"
  max_version: null

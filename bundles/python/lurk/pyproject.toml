[project]
name = "waddle-bundle-lurk"
version = "1.0.1"
description = "`!lurk`/`!unlurk` -> a per-(community, caller) kv toggle with a TTL, confirmed by relay. Python equivalent of bundles/python/pyping, modeled on its hand-built (not bundle_compiler-routed) structure. First Python core bundle to declare the `storage.kv` permission."
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
build = ["componentize-py==0.25.1"]
dev = ["pytest==8.3.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

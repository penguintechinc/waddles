# hub-api install-pipeline manifest (bundle_manifest_v2 schema, schema_version 2) for
# waddles.core.example.lurk -- see bundles/python/pyping/hub-manifest.yaml's own header for why
# this is a separate file from this bundle's `bundle.yaml` (a different consumer's schema).
#
# 1.0.0 is permanently retired -- fix/bump-command-bundles-1.0.1. The deployed wasm was
# compiled against an older world missing the `flags` WIT import (feature_enabled() crashes/
# degrades at runtime), while current source compiles correctly WITH it; app_versions enforces
# an immutable digest per (app_id, version), so re-seeding 1.0.0 with the recompiled bytes
# would 409 as digest_conflict and the seeder's #582 resilience change treats that as a
# non-fatal SKIP, leaving the stale wasm active. 1.0.1 is the first version built from the
# flags-enabled source. Mirrors bundles/csharp/csping/hub-manifest.yaml's own 1.0.0/1.0.1
# retirement comment (fix/csping-version-bump, #575).
schema_version: 2
app_id: waddles.core.example.lurk
name: Lurk Toggle Example Bundle (Python)
# 1.0.3 (feature/lurk-v1): stateful lurk/unlurk rewrite -- see bundle.yaml/src/app.py.
# 1.0.4 (fix/bump-count-lurk-1.0.4): version-only bump to republish the colon-free `kv` key
# fix (gh-631, #638) -- app_versions is immutable per (app_id, version).
# 1.0.5 (fix/lurk-silent-missing-community, gh-655): fail-loud chat reply on the "no
# community" dispatch path -- see bundle.yaml/src/app.py.
# 1.0.6 (this task): dispatch() now functions under the tenant-wide sentinel
# (`community=None`) instead of only replying with an error -- see bundle.yaml/src/app.py.
version: 1.0.9
feature: waddles.core.example
module: core
provider: builtin
language: python
artifact: prebuilt
execution_model: native
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!lurk", "!unlurk"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!lurk", "!unlurk"]
  action:
    entry: "waddle:bundle/action-stage#dispatch"
egress: []
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
# `storage.kv` -- required for the data plane to grant `kv` at all
# (hub_api/services/bundle_approval_service.py::KV_PERMISSION_ID).
permissions:
  - id: storage.kv
    justification: "persists per-community lurk state"
  - id: flags.read
    justification: "gates the command behind its waddles.command-lurk feature flag"
routes_to: []

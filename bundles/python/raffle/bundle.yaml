schema_version: 2
app_id: waddles.core.example.raffle
name: Raffle / Giveaway Bundle (Python)
# 1.0.0: initial kv-only v1 -- !raffle open/close/draw/list, bare !raffle / !enter.
# See src/app.py's own module docstring for full scope + the pseudonym-only winner-
# announcement design note.
version: 1.0.1
feature: waddles.core.example
module: core
provider: builtin
author: PenguinTech/waddles
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/raffle
language: python
artifact: component
execution_model: wasi-component
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!raffle", "!enter"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!raffle", "!enter"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    config: {}
    spec:
      required_config: []
egress: []
# No `data.tables` -- v1 is kv-only by design (see src/app.py module docstring): the
# entrant list and open/closed flag are two per-community kv entries, never a
# cross-community query, so no `db` capability is needed.
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: storage.kv
    justification: "persists per-community raffle entrants and state"
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: "1.0.1"
  min_version: "1.0.1"
  max_version: null

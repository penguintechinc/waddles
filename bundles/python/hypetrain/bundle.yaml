schema_version: 2
app_id: waddles.core.example.hypetrain
name: Hype Train Bundle (Python)
version: 1.0.0
feature: waddles.core.example
module: core
provider: builtin
author: "PenguinTech/waddles"
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/hypetrain
language: python
artifact: component
execution_model: wasi-component
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      # NO `filters.command_prefix` on purpose: every chat line builds the combo, not just
      # `!hypetrain`. An absent filter key is "not a constraint" (rust-data-plane design spec
      # section 6), so the stage sees every chat.message; transform() cheap-rejects the rest.
      - platform: twitch
        event_types: ["chat.message"]
      - platform: discord
        event_types: ["chat.message"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    config: {}
    spec:
      required_config: []
egress: []
# No `data.tables` -- state lives in `kv` only (see `permissions` below).
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: storage.kv
    justification: "persists one shared combo meter (integers only) plus a fixed table of per-slot spam-guard timestamps"
  - id: "chat.send:discord"
    justification: "hypetrain replies to the invoking user/channel via the relay host import (relay.push -> chat.send:discord)"
  - id: "chat.send:twitch"
    justification: "hypetrain replies to the invoking user/channel via the relay host import (relay.push -> chat.send:twitch)"
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: "1.0.0"
  min_version: "1.0.0"
  max_version: null

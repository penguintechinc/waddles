schema_version: 2
app_id: waddles.core.example.coinflip
name: Coinflip Bundle (Python)
# 1.0.0: initial kv-only v1 -- !flip/!coinflip (flip)/!flip heads|tails (call)/!flip list/!flip
# set cooldown <seconds>. See src/app.py's own module docstring for full scope + the
# cross-community-leaderboard deferral.
# 1.0.3: strict-boolean is_mod/is_broadcaster badge reads -- a string badge ("false") no longer passes the mod gate (fix/bundle-defects-wave).
# 1.0.4: activation-gated only -- removed the in-bundle waddles.command-coinflip feature-flag guard (activation is the sole gate; see docs/reference/command-bundles.md).
version: 1.0.5
feature: waddles.core.example
module: core
provider: builtin
# Net-new Waddles content -- no inspiration source, no attribution/notice required (contrast
# bundles/python/fish, which credits superpenguintv (Psychoboy) for its catch-and-track concept).
author: PenguinTech/waddles
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/coinflip
language: python
artifact: component
execution_model: wasi-component
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!coinflip", "!flip"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!coinflip", "!flip"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    config: {}
    spec:
      required_config: []
egress: []
# No `data.tables` -- v1 is kv-only by design (see src/app.py module docstring: no dependency
# on the in-flight #623 db order_by API). Cross-community leaderboards are explicitly deferred
# to a v2 that needs that API, not stubbed here.
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: storage.kv
    justification: "persists per-community coin-flip tallies and state"
  - id: "chat.send:discord"
    justification: "coinflip replies to the invoking user/channel via the relay host import (relay.push -> chat.send:discord)"
  - id: "chat.send:twitch"
    justification: "coinflip replies to the invoking user/channel via the relay host import (relay.push -> chat.send:twitch)"
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: "1.0.5"
  min_version: "1.0.5"
  max_version: null

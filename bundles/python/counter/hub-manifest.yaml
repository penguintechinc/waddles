# hub-api install-pipeline manifest (bundle_manifest_v2 schema, schema_version 2) for waddles.core.example.counter --
# see bundles/python/pyping/hub-manifest.yaml's own header for why this is a separate file from
# this bundle's `bundle.yaml` (a different consumer's schema).
# 1.0.0: new bundle -- see src/app.py's module docstring.
schema_version: 2
app_id: waddles.core.example.counter
name: Named Counter Bundle (Python)
version: 1.0.0
feature: waddles.core.example
module: core
provider: builtin
language: python
artifact: prebuilt
execution_model: native
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!counter"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!counter"]
  action:
    entry: "waddle:bundle/action-stage#dispatch"
egress: []
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: storage.kv
    justification: "persists per-community named counter values, the counter-name index, a short creation lock and the public add/sub flag"
  - id: "chat.send:discord"
    justification: "counter replies to the invoking user/channel via the relay host import (relay.push -> chat.send:discord)"
  - id: "chat.send:twitch"
    justification: "counter replies to the invoking user/channel via the relay host import (relay.push -> chat.send:twitch)"
routes_to: []

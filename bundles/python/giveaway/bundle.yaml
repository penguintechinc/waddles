schema_version: 2
app_id: waddles.core.example.giveaway
name: Giveaway Bundle (Python)
version: 1.0.1
feature: waddles.core.example
module: core
provider: builtin
author: PenguinTech/waddles
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/giveaway
language: python
artifact: component
execution_model: wasi-component
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!giveaway", "!enter"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!giveaway", "!enter"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    config: {}
    spec:
      required_config: []
egress: []
# No `data.tables` -- state lives in `kv` only (single key `giveaway.active`).
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: storage.kv
    justification: "persists the per-community active giveaway (giveaway.active: end time + hashed entrants)"
  - id: platform.clock
    justification: "reads the current time to enforce the giveaway deadline and seed the draw"
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: "1.0.0"
  min_version: "1.0.0"
  max_version: null

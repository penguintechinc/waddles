[project]
name = "waddle-bundle-giveaway"
version = "1.0.1"
description = "`!giveaway` -- timed free open-entry giveaway with one random draw (kv-backed state, host clock)."
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
build = ["componentize-py==0.25.1"]
dev = ["pytest==8.3.3", "pytest-cov==5.0.0", "mypy==1.14.1", "ruff==0.11.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.mypy]
strict = true

# `waddle-sdk` ships no `py.typed` marker (pre-existing SDK packaging gap, out of this
# bundle's scope). Silencing `import-untyped` here only, so `--strict` still catches real
# type errors in this bundle's own code (`app.py` `cast()`s the `kv.get` result).
[[tool.mypy.overrides]]
module = ["waddle_sdk", "waddle_sdk.*"]
ignore_missing_imports = true

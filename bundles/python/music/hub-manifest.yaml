# hub-api install-pipeline manifest (bundle_manifest_v2 schema, schema_version 2) for
# waddles.core.example.music -- see bundles/python/pyping/hub-manifest.yaml's own header
# for why this is a separate file from this bundle's `bundle.yaml` (a different consumer's
# schema).
schema_version: 2
app_id: waddles.core.example.music
name: Song Request Queue Bundle (Python)
version: 1.0.5
feature: waddles.core.example
module: core
provider: builtin
author: "superpenguintv (Psychoboy)"
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/music
notice: |
  Song-request-queue concept inspired by superpenguintv (Psychoboy)'s
  PenguinTwitchBot song-request feature (https://github.com/Psychoboy/PenguinTwitchBot).
  This is an original Waddles implementation: the command grammar, queue data
  shape, and all logic are written fresh for this bundle. No original
  PenguinTwitchBot source code or text is reused.
language: python
artifact: prebuilt
execution_model: native
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!sr", "!songrequest", "!music", "!queue"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!sr", "!songrequest", "!music", "!queue"]
  action:
    entry: "waddle:bundle/action-stage#dispatch"
egress: []
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
# `storage.kv` -- required for the data plane to grant `kv` at all
# (hub_api/services/bundle_approval_service.py::KV_PERMISSION_ID).
permissions:
  - id: storage.kv
    justification: "persists the per-community song-request queue, sequence and limits config"
  - id: "chat.send:discord"
    justification: "music replies to the invoking user/channel via the relay host import (relay.push -> chat.send:discord)"
  - id: "chat.send:twitch"
    justification: "music replies to the invoking user/channel via the relay host import (relay.push -> chat.send:twitch)"
routes_to: []
overlay_widgets:
  - widget_id: dj.music.album_now_playing
    display_name: "Now Playing (Album Cover)"
    description: "Overlay widget showing current song, artist, and album artwork"
    category: music
    output_kind: surface
    surface_id: music.now_playing
    default_x: 48
    default_y: 860
    default_width: 460
    default_height: 160
    allow_standalone_output: true
  - widget_id: dj.music.song_request_queue
    display_name: "Song Request Queue"
    description: "Overlay widget showing upcoming song requests from viewers"
    category: music
    output_kind: surface
    surface_id: music.queue
    default_x: 48
    default_y: 500
    default_width: 460
    default_height: 340
    allow_standalone_output: true


schema_version: 2
app_id: waddles.core.example.music
name: Song Request Queue Bundle (Python)
# 1.0.0: initial kv-only v1 -- !sr/!songrequest (add), !music/!queue (show),
# !music list/remove <id>/next/skip/set max-per-user <n>. See src/app.py's own
# module docstring for full scope -- a request QUEUE only, no playback/external
# music-service API call.
# 1.0.3: strict-boolean is_mod/is_broadcaster badge reads -- a string badge ("false") no longer passes the mod gate (fix/bundle-defects-wave).
# 1.1.0: queue moved to waddles.core.service.music-requests (tool calls, stage-next-tools); new !songqueue/!sq (flag waddles.music.queue-page), !music now/history/top/dmca; one-shot kv migration; overlay from service state.
# 1.0.4: activation-gated only -- removed the in-bundle waddles.command-music feature-flag guard (activation is the sole gate; see docs/reference/command-bundles.md).
version: 1.1.0
feature: waddles.core.example
module: core
provider: builtin
# Attribution: net-new Waddles content, NOT a literal port -- credited for inspiration
# only (no original PenguinTwitchBot source or text reused, so no MIT notice
# reproduction is required; contrast bundles/csharp/superpenguin-roll, an actual
# line-for-line port, which does carry the full verbatim notice). Same shape as
# bundles/python/fish and bundles/python/shoutout.
author: github:penguintechinc
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/music
notice: |
  Song-request-queue concept inspired by superpenguintv (Psychoboy)'s
  PenguinTwitchBot song-request feature (https://github.com/Psychoboy/PenguinTwitchBot).
  This is an original Waddles implementation: the command grammar, queue data
  shape, and all logic are written fresh for this bundle. No original
  PenguinTwitchBot source code or text is reused.
language: python
artifact: component
execution_model: wasi-component
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!sr", "!songrequest", "!music", "!queue", "!songqueue", "!sq"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!sr", "!songrequest", "!music", "!queue", "!songqueue", "!sq"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    config: {}
    spec:
      required_config: []
  presentation:
    owned_surfaces:
      - waddles.core.example.music.now_playing
      - waddles.core.example.music.queue
    overlay_widgets:
      - widget_id: dj.music.album_now_playing
        display_name: "Now Playing (Album Cover)"
        description: "Overlay widget showing current song, artist, and album artwork"
        category: music
        output_kind: surface
        surface_id: waddles.core.example.music.now_playing
        default_x: 48
        default_y: 860
        default_width: 460
        default_height: 160
        allow_standalone_output: true
      - widget_id: dj.music.song_request_queue
        display_name: "Song Request Queue"
        description: "Overlay widget showing upcoming song requests from viewers"
        category: music
        output_kind: surface
        surface_id: waddles.core.example.music.queue
        default_x: 48
        default_y: 500
        default_width: 460
        default_height: 340
        allow_standalone_output: true
egress: []
# No `data.tables` -- v1 is kv-only by design (see src/app.py module docstring):
# the queue is a single per-community JSON array under one kv key, never a
# cross-community query, so no `db` capability is needed.
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: overlay.media
    justification: "publishes structured, text-only state to this bundle's own overlay surfaces via overlay.publish-surface (data-only envelopes, no media)"
    params:
      mode: data
  - id: storage.kv
    justification: "one-shot migration only: reads and clears the legacy per-community kv queue (music.queue) and records music.migrated"
  - id: "chat.send:discord"
    justification: "music replies to the invoking user/channel via the relay host import (relay.push -> chat.send:discord)"
  - id: "chat.send:twitch"
    justification: "music replies to the invoking user/channel via the relay host import (relay.push -> chat.send:twitch)"
  - id: "tool.call:waddles.core.service.music-requests:requests.list"
    justification: "Delegate the song-request queue to the music-requests service"
    params:
      write: false
  - id: "tool.call:waddles.core.service.music-requests:requests.advance_due"
    justification: "Delegate the song-request queue to the music-requests service"
    params:
      write: false
  - id: "tool.call:waddles.core.service.music-requests:history.list"
    justification: "Delegate the song-request queue to the music-requests service"
    params:
      write: false
  - id: "tool.call:waddles.core.service.music-requests:config.get"
    justification: "Delegate the song-request queue to the music-requests service"
    params:
      write: false
  - id: "tool.call:waddles.core.service.music-requests:page.link"
    justification: "Delegate the song-request queue to the music-requests service"
    params:
      write: false
  - id: "tool.call:waddles.core.service.music-requests:music.stats.top"
    justification: "Delegate the song-request queue to the music-requests service"
    params:
      write: false
  - id: "tool.call:waddles.core.service.music-requests:requests.add"
    justification: "Delegate the song-request queue to the music-requests service"
    params:
      write: true
  - id: "tool.call:waddles.core.service.music-requests:requests.cancel_own"
    justification: "Delegate the song-request queue to the music-requests service"
    params:
      write: true
  - id: "tool.call:waddles.core.service.music-requests:requests.import"
    justification: "Delegate the song-request queue to the music-requests service"
    params:
      write: true
  - id: "tool.call:waddles.core.service.music-requests:requests.remove"
    justification: "Delegate the song-request queue to the music-requests service"
    params:
      write: true
  - id: "tool.call:waddles.core.service.music-requests:requests.advance"
    justification: "Delegate the song-request queue to the music-requests service"
    params:
      write: true
  - id: "tool.call:waddles.core.service.music-requests:config.set"
    justification: "Delegate the song-request queue to the music-requests service"
    params:
      write: true
  - id: "tool.call:waddles.core.service.music-requests:settings.set"
    justification: "Delegate the song-request queue to the music-requests service"
    params:
      write: true
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: "1.0.6"
  min_version: "1.0.6"
  max_version: null
requested_tools:
  - tool: requests.list
    access: read
    target_app_id: waddles.core.service.music-requests
  - tool: requests.advance_due
    access: read
    target_app_id: waddles.core.service.music-requests
  - tool: history.list
    access: read
    target_app_id: waddles.core.service.music-requests
  - tool: config.get
    access: read
    target_app_id: waddles.core.service.music-requests
  - tool: page.link
    access: read
    target_app_id: waddles.core.service.music-requests
  - tool: music.stats.top
    access: read
    target_app_id: waddles.core.service.music-requests
  - tool: requests.add
    access: write
    target_app_id: waddles.core.service.music-requests
  - tool: requests.cancel_own
    access: write
    target_app_id: waddles.core.service.music-requests
  - tool: requests.import
    access: write
    target_app_id: waddles.core.service.music-requests
  - tool: requests.remove
    access: write
    target_app_id: waddles.core.service.music-requests
  - tool: requests.advance
    access: write
    target_app_id: waddles.core.service.music-requests
  - tool: config.set
    access: write
    target_app_id: waddles.core.service.music-requests
  - tool: settings.set
    access: write
    target_app_id: waddles.core.service.music-requests

[project]
name = "waddle-bundle-dadjoke"
version = "1.0.1"
description = "`!dadjoke` -> a random family-friendly dad joke from a curated built-in list, plus a per-community custom joke pool (`!dadjoke add/remove/list`, mod/broadcaster-gated mutations). Same kv-only shape as bundles/python/joke, distinct bank; uses the shared `waddle_sdk.command` grammar parser (see bundles/python/fish)."
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
build = ["componentize-py==0.25.1"]
dev = ["pytest==8.3.3", "mypy==1.14.1", "ruff==0.11.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

# `waddle-sdk` ships no `py.typed` marker (a pre-existing SDK packaging gap, not fixable from
# this bundle without touching `sdk/waddle-sdk/` -- out of this bundle's scope). Silencing
# `import-untyped` here only, so `--strict` still catches real type errors in this bundle's
# own code (`app.py`'s `_kv_*` wrappers `cast()` the handful of calls that would otherwise
# leak `Any`) -- same workaround as `bundles/python/joke/pyproject.toml`.
[[tool.mypy.overrides]]
module = "waddle_sdk.*"
ignore_missing_imports = true

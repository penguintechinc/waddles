schema_version: 2
app_id: waddles.core.example.queue
name: Viewer Queue Bundle (Python)
# 1.0.0: initial kv-only viewer queue -- !queue join/leave/(position)/list/next/clear. See
# src/app.py's module docstring (feature/bundles-queue-timer).
version: 1.0.0
feature: waddles.core.example
module: core
provider: builtin
author: PenguinTech/waddles
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/queue
language: python
artifact: component
execution_model: wasi-component
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!queue"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!queue"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    config: {}
    spec:
      required_config: []
egress: []
# No `data.tables` -- state lives in `kv` only (see `permissions` below).
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: storage.kv
    justification: "persists the per-community viewer queue (one JSON list) and its short-lived mutation lock"
  - id: "chat.send:discord"
    justification: "queue replies to the invoking user/channel via the relay host import (relay.push -> chat.send:discord)"
  - id: "chat.send:twitch"
    justification: "queue replies to the invoking user/channel via the relay host import (relay.push -> chat.send:twitch)"
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: "1.0.0"
  min_version: "1.0.0"
  max_version: null

[project]
name = "waddle-bundle-clap"
version = "1.0.0"
description = "`!clap <text>` -> puts a clap between each word (hello world -> hello clap world clap) (capped, never logged). Stateless: relay only, no kv/db."
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
build = ["componentize-py==0.25.1"]
dev = ["pytest==8.3.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

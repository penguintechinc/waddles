schema_version: 2
app_id: waddles.core.example.eli5
name: ELI5 (AI) Example Bundle (Python)
version: 1.0.0
feature: waddles.core.example
module: core
provider: builtin
author: PenguinTech/waddles
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/eli5
language: python
artifact: component
execution_model: wasi-component
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!eli5"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!eli5"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    config: {}
    spec:
      required_config: []
egress: []
data:
  tables: []
limits:
  timeout_ms: 10000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: ai.generate
    justification: "DANGEROUS: sends the user's thing to the host-selected model for one text generation per command (host rate limits, rejects PII, frames input as untrusted); output is length-capped and relayed only"
  - id: "chat.send:discord"
    justification: "replies to the invoking command on its origin platform via the relay host import (relay.push -> chat.send:discord)"
  - id: "chat.send:twitch"
    justification: "replies to the invoking command on its origin platform via the relay host import (relay.push -> chat.send:twitch)"
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: "1.0.0"
  min_version: "1.0.0"
  max_version: null

schema_version: 2
app_id: waddles.core.example.insult
name: Playful Insult Bundle (Python)
# 1.0.0: new fun-pack bundle -- stateless static-list relay (see src/app.py docstring).
version: 1.0.0
feature: waddles.core.example
module: core
provider: builtin
author: PenguinTech/waddles
license: Apache-2.0
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/python/insult
language: python
artifact: component
execution_model: wasi-component
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!insult"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!insult"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    config: {}
    spec:
      required_config: []
egress: []
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: flags.read
    justification: "reads the waddles.command-insult feature flag (default OFF) via the flags host import; no other flag is read"
  - id: "chat.send:discord"
    justification: "replies to the invoking command on its origin platform via the relay host import (relay.push -> chat.send:discord); no other capability is used"
  - id: "chat.send:twitch"
    justification: "replies to the invoking command on its origin platform via the relay host import (relay.push -> chat.send:twitch); no other capability is used"
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: "1.0.0"
  min_version: "1.0.0"
  max_version: null

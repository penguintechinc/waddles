schema_version: 2
app_id: waddles.core.app.stream-alerts
name: Stream Alerts (Rust)
version: 1.0.0
feature: waddles.core.app
module: core
provider: builtin
author: github:penguintechinc
license: AGPL-3.0-or-later
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/rust/stream-alerts
language: rust
artifact: component
execution_model: wasi-component
is_default: false
kind: app
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["channel.follow", "channel.subscribe", "channel.subscription.gift", "channel.cheer", "channel.raid"]
      - platform: discord
        event_types: ["donation", "tip", "server_boost"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    config: {}
    spec:
      required_config: []
  presentation:
    owned_surfaces:
      - waddles.core.app.stream-alerts.alerts
egress: []
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: overlay.media
    justification: "publishes structured, text-only state to this bundle's own overlay surfaces via overlay.publish-surface (data-only envelopes, no media)"
    params:
      mode: data

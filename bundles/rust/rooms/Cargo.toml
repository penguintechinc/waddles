[package]
name = "waddle-bundle-rooms"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "AGPL-3.0-or-later"
publish = false
description = "Rooms APP bundle: rooms per community and per calendar event (event UUID refs), virtual rooms (breakout, stage, green room), role-based access and schedules. Chat commands plus gateway admin actions; every media/token operation is a gated tool call to the webrtc service bundle."

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { version = "=0.44.0", features = ["bitflags"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[package.metadata.component]
package = "waddle:bundle-rooms"

[package.metadata.component.target]
path = "../../../wit/waddle-bundle"
world = "stage-next-tools"

[package.metadata.component.dependencies]

schema_version: 2
app_id: waddles.core.app.rooms
name: Rooms App Bundle (Rust)
version: 1.3.0
feature: waddles.core.app
module: core
provider: builtin
author: github:penguintechinc
license: AGPL-3.0-or-later
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/rust/rooms
language: rust
artifact: component
execution_model: wasi-component
is_default: false
stages:
  process:
    entry: waddle:bundle/process-stage#transform
    consumes:
    - platform: twitch
      event_types:
      - chat.message
      filters:
        command_prefix:
        - '!room'
        - '!rooms'
    - platform: discord
      event_types:
      - chat.message
      filters:
        command_prefix:
        - '!room'
        - '!rooms'
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: waddle:bundle/action-stage#dispatch
    config: {}
    spec:
      required_config: []
egress: []
data:
  tables: []
limits:
  timeout_ms: 5000
  memory_mb: 64
  egress_rps: 10
permissions:
- id: chat.send:discord
  justification: rooms replies to the invoking user/channel via the relay host import (relay.push -> chat.send:discord)
- id: chat.send:twitch
  justification: rooms replies to the invoking user/channel via the relay host import (relay.push -> chat.send:twitch)
- id: identity.resolve
  justification: resolves the verified caller to a community user UUID for room access decisions
- id: storage.kv
  justification: persists room records, the per-room ACL, event links and schedules (community-scoped)
- id: tool.call:waddles.core.service.webrtc:admin.verify
  justification: delegates room/token operations to the webrtc service; the media path stays in svc-streaming
  params:
    write: false
- id: tool.call:waddles.core.service.webrtc:participant.self
  justification: asks the webrtc service for the caller's host-derived per-community call-participant id, so room ACLs and svc-streaming speak the same pseudonym and the global user uuid never leaves the platform
  params:
    write: false
- id: tool.call:waddles.core.service.webrtc:room.create
  justification: delegates room/token operations to the webrtc service; the media path stays in svc-streaming
  params:
    write: true
- id: tool.call:waddles.core.service.webrtc:room.close
  justification: delegates room/token operations to the webrtc service; the media path stays in svc-streaming
  params:
    write: true
- id: tool.call:waddles.core.service.webrtc:whip.endpoint
  justification: delegates room/token operations to the webrtc service; the media path stays in svc-streaming
  params:
    write: true
- id: tool.call:waddles.core.service.webrtc:whep.endpoint
  justification: delegates room/token operations to the webrtc service; the media path stays in svc-streaming
  params:
    write: true
- id: tool.call:waddles.core.service.webrtc:room.list
  justification: moderation front-end over the webrtc service (room.list); the bundle checks the per-room ACL role and the host re-checks it
  params:
    write: false
- id: tool.call:waddles.core.service.webrtc:room.participants
  justification: moderation front-end over the webrtc service (room.participants); the bundle checks the per-room ACL role and the host re-checks it
  params:
    write: false
- id: tool.call:waddles.core.service.webrtc:room.leave
  justification: moderation front-end over the webrtc service (room.leave); the bundle checks the per-room ACL role and the host re-checks it
  params:
    write: true
- id: tool.call:waddles.core.service.webrtc:room.kick
  justification: moderation front-end over the webrtc service (room.kick); the bundle checks the per-room ACL role and the host re-checks it
  params:
    write: true
- id: tool.call:waddles.core.service.webrtc:room.mute
  justification: moderation front-end over the webrtc service (room.mute); the bundle checks the per-room ACL role and the host re-checks it
  params:
    write: true
- id: tool.call:waddles.core.service.webrtc:room.unmute
  justification: moderation front-end over the webrtc service (room.unmute); the bundle checks the per-room ACL role and the host re-checks it
  params:
    write: true
- id: tool.call:waddles.core.service.webrtc:room.mute_all
  justification: moderation front-end over the webrtc service (room.mute_all); the bundle checks the per-room ACL role and the host re-checks it
  params:
    write: true
- id: tool.call:waddles.core.service.webrtc:room.lock
  justification: moderation front-end over the webrtc service (room.lock); the bundle checks the per-room ACL role and the host re-checks it
  params:
    write: true
- id: tool.call:waddles.core.service.webrtc:room.unlock
  justification: moderation front-end over the webrtc service (room.unlock); the bundle checks the per-room ACL role and the host re-checks it
  params:
    write: true
- id: tool.call:waddles.core.service.webrtc:room.hand.raise
  justification: raised-hand queue front-end over the webrtc service (room.hand.raise); the queue is authoritative in svc-streaming, the host verifies the scope and the actor, and the bundle keeps no copy
  params:
    write: true
- id: tool.call:waddles.core.service.webrtc:room.hand.lower
  justification: raised-hand queue front-end over the webrtc service (room.hand.lower); the queue is authoritative in svc-streaming, the host verifies the scope and the actor, and the bundle keeps no copy
  params:
    write: true
- id: tool.call:waddles.core.service.webrtc:room.hand.lower_other
  justification: raised-hand queue front-end over the webrtc service (room.hand.lower_other); the queue is authoritative in svc-streaming, the host verifies the scope and the actor, and the bundle keeps no copy
  params:
    write: true
- id: tool.call:waddles.core.service.webrtc:room.hand.list
  justification: raised-hand queue front-end over the webrtc service (room.hand.list); the queue is authoritative in svc-streaming, the host verifies the scope and the actor, and the bundle keeps no copy
  params:
    write: false
- id: tool.call:waddles.core.service.webrtc:room.hand.list_all
  justification: raised-hand queue front-end over the webrtc service (room.hand.list_all); the queue is authoritative in svc-streaming, the host verifies the scope and the actor, and the bundle keeps no copy
  params:
    write: false
- id: tool.call:waddles.core.service.webrtc:room.hand.ack
  justification: raised-hand queue front-end over the webrtc service (room.hand.ack); the queue is authoritative in svc-streaming, the host verifies the scope and the actor, and the bundle keeps no copy
  params:
    write: true
- id: tool.call:waddles.core.service.webrtc:room.hand.reset
  justification: raised-hand queue front-end over the webrtc service (room.hand.reset); the queue is authoritative in svc-streaming, the host verifies the scope and the actor, and the bundle keeps no copy
  params:
    write: true
community_config_schema:
  type: object
  properties:
    join_base_url:
      type:
      - string
      - 'null'
      format: uri
      default: null
  additionalProperties: false

# hub-api install-pipeline manifest (bundle_manifest_v2) for the rooms APP bundle.
schema_version: 2
app_id: waddles.core.app.rooms
name: Rooms App Bundle (Rust)
version: 1.0.1
feature: waddles.core.app
module: core
provider: builtin
author: github:penguintechinc
language: rust
artifact: prebuilt
execution_model: native
is_default: false
stages:
  process:
    entry: waddle:bundle/process-stage#transform
    consumes:
    - platform: twitch
      event_types:
      - chat.message
      filters:
        command_prefix:
        - '!room'
        - '!rooms'
    - platform: discord
      event_types:
      - chat.message
      filters:
        command_prefix:
        - '!room'
        - '!rooms'
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: waddle:bundle/action-stage#dispatch
    config: {}
    spec:
      required_config: []
egress: []
data:
  tables: []
limits:
  timeout_ms: 5000
  memory_mb: 64
  egress_rps: 10
permissions:
- id: chat.send:discord
  justification: rooms replies to the invoking user/channel via the relay host import (relay.push -> chat.send:discord)
- id: chat.send:twitch
  justification: rooms replies to the invoking user/channel via the relay host import (relay.push -> chat.send:twitch)
- id: identity.resolve
  justification: resolves the verified caller to a community user UUID for room access decisions
- id: storage.kv
  justification: persists room records, the per-room ACL, event links and schedules (community-scoped)
- id: tool.call:waddles.core.service.webrtc:admin.verify
  justification: delegates room/token operations to the webrtc service; the media path stays in svc-streaming
  params:
    write: false
- id: tool.call:waddles.core.service.webrtc:room.create
  justification: delegates room/token operations to the webrtc service; the media path stays in svc-streaming
  params:
    write: true
- id: tool.call:waddles.core.service.webrtc:room.close
  justification: delegates room/token operations to the webrtc service; the media path stays in svc-streaming
  params:
    write: true
- id: tool.call:waddles.core.service.webrtc:whip.endpoint
  justification: delegates room/token operations to the webrtc service; the media path stays in svc-streaming
  params:
    write: true
- id: tool.call:waddles.core.service.webrtc:whep.endpoint
  justification: delegates room/token operations to the webrtc service; the media path stays in svc-streaming
  params:
    write: true
community_config_schema:
  type: object
  properties:
    join_base_url:
      type:
      - string
      - 'null'
      format: uri
      default: null
  additionalProperties: false
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: 1.0.0
  min_version: 1.0.0
  max_version: null
requested_tools:
- tool: admin.verify
  access: read
  target_app_id: waddles.core.service.webrtc
- tool: room.create
  access: write
  target_app_id: waddles.core.service.webrtc
- tool: room.close
  access: write
  target_app_id: waddles.core.service.webrtc
- tool: whip.endpoint
  access: write
  target_app_id: waddles.core.service.webrtc
- tool: whep.endpoint
  access: write
  target_app_id: waddles.core.service.webrtc

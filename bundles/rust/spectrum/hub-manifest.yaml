# RSI Spectrum platform CONNECTOR (gh #486): one-way INBOUND `kind: service` bundle on the
# `connector` world. hub-api install-pipeline manifest (prebuilt) for the catalog row in
# bundles/core-bundles.yaml. Cutover flag: PostHog `waddles.connector-spectrum` / env
# `CONNECTOR_SPECTRUM_ENABLED`, default OFF (the Python receivers run unchanged while OFF).
# No outbound capability is requested on purpose (#101: writing to RSI's undocumented API
# risks banning the org). The session credential never enters this component.
schema_version: 2
app_id: waddles.core.service.spectrum
name: RSI Spectrum Platform Connector (Rust, inbound-only)
version: 0.1.1
feature: waddles.core.service
module: core
provider: builtin
language: rust
artifact: prebuilt
execution_model: native
is_default: false
kind: service
# Inbound-only connector: it runs no process/action stage, but manifest v2 requires the key.
stages: {}
# Guest egress is EMPTY by design: the RSI poll host allowlist + session credential live in the
# host-side poll transport config (svc_ingest Spectrum profile), exactly as for YouTube.
egress: []
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 1
permissions:
  - id: connector.pii.read
    justification: "gates identity.lookup, used to tokenize each Spectrum member to its canonical UUID; first-party core only, dangerous, global-admin-approved (no raw member id or handle leaves the connector)"
routes_to: []

[package]
name = "waddle-bundle-game-servers"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "AGPL-3.0-or-later"
publish = false
description = "Game-servers APP bundle: `!server status|players|list` for everyone, mod-only `!rcon <server> <command>`, and scheduled status posts. Pure orchestration -- every network/RCON action is a gated tool call to the gameserver SERVICE bundle (app->service only); this bundle holds no address, no secret and no socket."

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { version = "=0.44.0", features = ["bitflags"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[package.metadata.component]
package = "waddle:bundle-game-servers"

[package.metadata.component.target]
path = "../../../wit/waddle-bundle"
world = "stage-next-tools"

[package.metadata.component.dependencies]

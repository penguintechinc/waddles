# hub-api install-pipeline manifest (schema_version 2) for the YouTube platform CONNECTOR
# (bundle-MCP-tools P6b T3). A `kind: service` connector on the `connector-tools` world.
# Credentials are NEVER in this file or the component: the connector returns request templates
# carrying the opaque secret-ref slot `{{YT_OAUTH_TOKEN}}` -> handle `youtube.oauth`, which the
# host's credential adapter (per-tenant bot credentials spec) resolves at send time.
# Host-pinned slots (the connector never takes caller-chosen ids; the host substitutes, URL-encoding
# in URLs and JSON-escaping in bodies): {{YT_OAUTH_TOKEN}}->youtube.oauth, {{YT_LIVE_CHAT_ID}}->
# youtube.live_chat_id, {{YT_CHANNEL_ID}}->youtube.channel_id, {{YT_VIDEO_ID}}->youtube.video_id.
# Cutover flag: PostHog `waddles.connector-youtube` (default OFF; the Python svc_ingest path runs
# unchanged while OFF).
schema_version: 2
app_id: waddles.core.service.youtube
name: YouTube Platform Connector (Rust)
version: 1.1.0
feature: waddles.core.service
module: core
provider: builtin
language: rust
artifact: prebuilt
execution_model: native
is_default: false
kind: service
stages:
  action:
    entry: waddle:bundle/tool-provider#call
egress:
  - host: www.googleapis.com
    methods: ["GET", "POST", "DELETE"]
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: net.http.fqdn:www.googleapis.com
    justification: YouTube Data API v3 (liveChat/messages list+insert, search, videos); requests are host-transmitted templates
    params:
      methods: ["GET", "POST", "DELETE"]
  - id: chat.send:youtube
    justification: Post chat messages into the host-pinned live chat via liveChatMessages.insert
  - id: chat.delete:youtube
    justification: "Delete live-chat messages in the host-pinned live chat"
  - id: moderation.youtube
    justification: "Ban/unban viewers and add/remove moderators in the host-pinned live chat; the live chat id is a host slot"
  - id: connector.pii.read
    justification: "gates identity.lookup, used to tokenize each chat author to its canonical UUID; first-party core only, dangerous, global-admin-approved (no raw author id leaves the connector)"
routes_to: []
exported_tools:
  - name: discovery_request
    access: read
    risk: normal
    input_schema:
      type: object
      properties:
        step: {type: string, enum: [search, videos]}
      required: [step]
      additionalProperties: false
    output_schema: {type: object}
  - name: discovery_parse
    access: read
    risk: normal
    input_schema:
      type: object
      properties:
        step: {type: string, enum: [search, videos]}
        body: {type: object}
      required: [step, body]
      additionalProperties: false
    output_schema: {type: object}
  - name: poll_request
    access: read
    risk: normal
    input_schema:
      type: object
      properties:
        max_results: {type: integer, minimum: 1, maximum: 2000}
      required: []
      additionalProperties: false
    output_schema: {type: object}
  - name: poll_plan
    access: read
    risk: normal
    input_schema:
      type: object
      properties:
        body: {type: object}
      required: [body]
      additionalProperties: false
    output_schema: {type: object}
  - name: classify_error
    access: read
    risk: normal
    input_schema:
      type: object
      properties:
        status: {type: integer, minimum: 100, maximum: 599}
        body: {}
        consecutive_quota_errors: {type: integer, minimum: 0}
        max_consecutive_quota_errors: {type: integer, minimum: 1}
        no_broadcast_backoff_s: {type: number, minimum: 0}
      required: [status]
      additionalProperties: false
    output_schema: {type: object}
  - name: build_send_chat_request
    access: read
    risk: normal
    input_schema:
      type: object
      properties:
        target_source_id: {type: string, minLength: 1}
        payload:
          type: object
          properties:
            text: {type: string, minLength: 1, maxLength: 200}
          required: [text]
          additionalProperties: false
      required: [target_source_id, payload]
      additionalProperties: false
    output_schema: {type: object}
  - name: youtube.chat.delete_message
    access: write
    risk: dangerous
    required_scope: community:moderate
    input_schema:
      type: object
      properties:
        message_id:
          type: string
          pattern: "^[A-Za-z0-9_.-]{1,128}$"
      required:
        - message_id
      additionalProperties: false
    output_schema:
      type: object
    host_op:
      platform: youtube
      op: chat.delete
      message_id: message_id
      required:
        - message_id
      origin: channel
  - name: youtube.chat.ban
    access: write
    risk: dangerous
    required_scope: community:moderate
    input_schema:
      type: object
      properties:
        user:
          type: string
          format: uuid
        duration_seconds:
          type: string
          pattern: "^[0-9]{1,7}$"
      required:
        - user
      additionalProperties: false
    output_schema:
      type: object
    host_op:
      platform: youtube
      op: mod.ban
      user: user
      user_wire: placeholder
      text: duration_seconds
      required:
        - user
      origin: channel
      returns:
        - id
  - name: youtube.chat.unban
    access: write
    risk: dangerous
    required_scope: community:moderate
    input_schema:
      type: object
      properties:
        ban_id:
          type: string
          pattern: "^[A-Za-z0-9_.-]{1,128}$"
      required:
        - ban_id
      additionalProperties: false
    output_schema:
      type: object
    host_op:
      platform: youtube
      op: mod.unban
      message_id: ban_id
      required:
        - ban_id
      origin: channel
  - name: youtube.chat.add_moderator
    access: write
    risk: dangerous
    required_scope: community:moderate
    input_schema:
      type: object
      properties:
        user:
          type: string
          format: uuid
      required:
        - user
      additionalProperties: false
    output_schema:
      type: object
    host_op:
      platform: youtube
      op: mod.add
      user: user
      user_wire: placeholder
      required:
        - user
      origin: channel
      returns:
        - id
  - name: youtube.chat.remove_moderator
    access: write
    risk: dangerous
    required_scope: community:moderate
    input_schema:
      type: object
      properties:
        moderator_id:
          type: string
          pattern: "^[A-Za-z0-9_.-]{1,128}$"
      required:
        - moderator_id
      additionalProperties: false
    output_schema:
      type: object
    host_op:
      platform: youtube
      op: mod.remove
      message_id: moderator_id
      required:
        - moderator_id
      origin: channel
author: PenguinTech/waddles
license: AGPL-3.0-or-later
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/rust/youtube
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: 1.0.0
  min_version: 1.0.0
  max_version: null

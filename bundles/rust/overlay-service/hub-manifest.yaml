schema_version: 2
app_id: waddles.core.service.overlay
name: Overlay Service Bundle (Rust)
version: 1.0.0
feature: waddles.core.service
module: core
provider: builtin
language: rust
artifact: prebuilt
execution_model: native
is_default: false
kind: service
stages:
  action:
    entry: "waddle:bundle/tool-provider#call"
egress: []
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: storage.kv
    justification: "persists the per-community canvas theme and preset configurations"
routes_to: []
exported_tools:
- name: register_widget
  access: write
  risk: normal
  input_schema:
    type: object
    properties:
      widget_id:
        type: string
      display_name:
        type: string
      description:
        type: string
      category:
        type: string
      output_kind:
        type: string
      surface_id:
        type: string
      allow_standalone_output:
        type: boolean
      default_x:
        type: integer
      default_y:
        type: integer
      default_width:
        type: integer
      default_height:
        type: integer
      default_z_index:
        type: integer
      props_schema:
        type: object
      bundle_app_id:
        type: string
    required:
    - widget_id
    - display_name
    - output_kind
    additionalProperties: false
  output_schema:
    type: object
    properties:
      registered:
        type: boolean
      widget_id:
        type: string
      output_kind:
        type: string
      output_kind_code:
        type: integer

- name: push_widget
  access: write
  risk: normal
  input_schema:
    type: object
    properties:
      widget_id:
        type: string
      output_kind:
        type: string
      html:
        type: string
      image_url:
        type: string
      title:
        type: string
      text:
        type: string
      surface_id:
        type: string
      payload:
        type: object
    required:
    - widget_id
    - output_kind
    additionalProperties: false
  output_schema:
    type: object
    properties:
      status:
        type: string
      widget_id:
        type: string

- name: add_component
  access: write
  risk: normal
  required_scope: community:admin
  input_schema:
    type: object
    properties:
      widget_id:
        type: string
      x:
        type: integer
      y:
        type: integer
      width:
        type: integer
      height:
        type: integer
      z_index:
        type: integer
      props:
        type: object
    required:
    - widget_id
    - x
    - y
    - width
    - height
    additionalProperties: false
  output_schema:
    type: object

- name: update_component
  access: write
  risk: normal
  required_scope: community:admin
  input_schema:
    type: object
    properties:
      instance_id:
        type: string
      x:
        type: integer
      y:
        type: integer
      width:
        type: integer
      height:
        type: integer
      z_index:
        type: integer
      visible:
        type: boolean
      props:
        type: object
    required:
    - instance_id
    additionalProperties: false
  output_schema:
    type: object

- name: remove_component
  access: write
  risk: normal
  required_scope: community:admin
  input_schema:
    type: object
    properties:
      instance_id:
        type: string
    required:
    - instance_id
    additionalProperties: false
  output_schema:
    type: object

- name: list_components
  access: read
  risk: normal
  input_schema:
    type: object
    properties:
      include_hidden:
        type: boolean
    additionalProperties: false
  output_schema:
    type: object

- name: list_registered_widgets
  access: read
  risk: normal
  input_schema:
    type: object
    additionalProperties: false
  output_schema:
    type: object

- name: clear_layout
  access: write
  risk: normal
  required_scope: community:admin
  input_schema:
    type: object
    additionalProperties: false
  output_schema:
    type: object

- name: set_canvas_theme
  access: write
  risk: normal
  required_scope: community:admin
  input_schema:
    type: object
    properties:
      theme:
        type: string
      resolution:
        type: string
      primary_color:
        type: string
      secondary_color:
        type: string
      font_family:
        type: string
    additionalProperties: false
  output_schema:
    type: object

# AI Teammates -- hub-api install-pipeline manifest (bundle_manifest_v2, schema_version 2).
# Kept in lockstep with bundle.yaml (same permissions/requested_tools/config_schema/admin_actions);
# tests/manifest.rs asserts they agree with each other and with the tools the code consumes.
# Command triggers: !research, !onboard, !teammate, !producer (NOT !ask -- the python `ask` bundle owns it
# until it is retired; flipping the Researcher to !ask afterwards is a one-line change).
schema_version: 2
app_id: waddles.core.example.ai-teammates
name: AI Teammates (Researcher, Receptionist, Producer)
version: 1.0.1
feature: waddles.core.example
module: core
provider: builtin
author: github:penguintechinc
license: AGPL-3.0-or-later
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/rust/ai-teammates
language: rust
artifact: component
execution_model: wasi-component
is_default: false
wit_world: stage-next-tools
stages:
  process:
    entry: waddle:bundle/process-stage#transform
    consumes:
    - platform: twitch
      event_types:
      - chat.message
    - platform: discord
      event_types:
      - chat.message
    - platform: youtube
      event_types:
      - chat.message
    - platform: discord
      event_types:
      - member.join
    - platform: twitch
      event_types:
      - member.join
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: waddle:bundle/action-stage#dispatch
    config: {}
    spec:
      required_config: []
egress: []
data:
  tables: []
limits:
  timeout_ms: 8000
  memory_mb: 64
  egress_rps: 10
permissions:
- id: storage.kv
  justification: Per-community teammate overrides, cooldown/rate counters, welcomed-member claims, producer pacing state
- id: identity.resolve
  justification: Resolve the triggering member to a community UUID (cooldowns, welcome-once claim); never a name
- id: chat.send:twitch
  justification: Relay teammate replies to the originating twitch channel via the relay host import
- id: chat.send:discord
  justification: Relay teammate replies to the originating discord channel via the relay host import
- id: chat.send:youtube
  justification: Relay teammate replies to the originating youtube channel via the relay host import
- id: tool.call:waddles.core.service.ai:ai.complete
  justification: Researcher answers, Receptionist greeting line and Producer starter via the AI service
  params:
    write: false
- id: tool.call:waddles.core.service.ai:ai.classify
  justification: Producer moderation check of every generated post before it is sent
  params:
    write: false
- id: tool.call:waddles.core.service.ai:ai.rag.query
  justification: Researcher and onboarding Q&A retrieve from the community knowledge base
  params:
    write: false
- id: tool.call:waddles.core.service.twitch:twitch.live.channels
  justification: Producer checks which configured channels are live (twitch.live.channels)
  params:
    write: false
- id: tool.call:waddles.core.service.discord:discord.live.channels
  justification: Producer checks which configured channels are live (discord.live.channels)
  params:
    write: false
- id: tool.call:waddles.core.service.youtube:youtube.live.channels
  justification: Producer checks which configured channels are live (youtube.live.channels)
  params:
    write: false
- id: streaming.lifecycle.subscribe
  justification: 'Producer heartbeat: stream start/segment hooks drive the quiet-chat check while a stream is live'
requested_tools:
- tool: ai.complete
  access: read
  target_app_id: waddles.core.service.ai
- tool: ai.classify
  access: read
  target_app_id: waddles.core.service.ai
- tool: ai.rag.query
  access: read
  target_app_id: waddles.core.service.ai
- tool: twitch.live.channels
  access: read
  target_app_id: waddles.core.service.twitch
- tool: discord.live.channels
  access: read
  target_app_id: waddles.core.service.discord
- tool: youtube.live.channels
  access: read
  target_app_id: waddles.core.service.youtube
community_config_schema:
  type: object
  additionalProperties: false
  properties:
    researcher:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          default: false
        allow_general:
          type: boolean
          default: true
        user_cooldown_s:
          type: integer
          minimum: 0
          maximum: 3600
          default: 30
        community_per_min:
          type: integer
          minimum: 1
          maximum: 120
          default: 10
        max_answer_chars:
          type: integer
          minimum: 40
          maximum: 400
          default: 300
        collection:
          type:
          - string
          - 'null'
          pattern: ^[a-z0-9][a-z0-9_.-]{0,39}$
          default: null
      default: {}
    receptionist:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          default: false
        templates:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            maxLength: 300
          default:
          - Welcome to the community, {user}!
          description: '{user} is the only placeholder'
        ai_personalize:
          type: boolean
          default: false
        welcome_channel_id:
          type:
          - string
          - 'null'
          maxLength: 100
          default: null
        greet_on_join:
          type: boolean
          default: true
        greet_on_first_message:
          type: boolean
          default: true
        onboarding_collection:
          type: string
          pattern: ^[a-z0-9][a-z0-9_.-]{0,39}$
          default: onboarding
        max_greeting_chars:
          type: integer
          minimum: 40
          maximum: 400
          default: 240
      default: {}
    producer:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          default: false
        channels:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required:
            - platform
            - channel_id
            properties:
              platform:
                type: string
                enum:
                - twitch
                - discord
                - youtube
              channel_id:
                type: string
                maxLength: 100
                description: channel_ref as reported by <platform>.live.channels
          default: []
        quiet_minutes:
          type: integer
          minimum: 1
          maximum: 240
          default: 10
        min_interval_minutes:
          type: integer
          minimum: 5
          maximum: 240
          default: 20
        max_per_hour:
          type: integer
          minimum: 1
          maximum: 6
          default: 3
        quiet_hours:
          type:
          - object
          - 'null'
          additionalProperties: false
          required:
          - start_hour
          - end_hour
          properties:
            start_hour:
              type: integer
              minimum: 0
              maximum: 23
            end_hour:
              type: integer
              minimum: 0
              maximum: 23
            utc_offset_minutes:
              type: integer
              minimum: -840
              maximum: 840
              default: 0
          default: null
        topics:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 120
          default: []
        blocklist:
          type: array
          maxItems: 200
          items:
            type: string
            maxLength: 60
          default: []
        max_chars:
          type: integer
          minimum: 40
          maximum: 300
          default: 200
      default: {}
admin_actions:
- name: teammate.status
  access: read
  description: Effective on/off state and config validity of each teammate
- name: teammate.set_enabled
  access: write
  description: Enable or disable one teammate for this community
- name: producer.pause
  access: write
  description: 'Kill switch: stop all Producer posts'
- name: producer.resume
  access: write
  description: Lift the Producer kill switch
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: 1.0.0
  min_version: 1.0.0
  max_version: null

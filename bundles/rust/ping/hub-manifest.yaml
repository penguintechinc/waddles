# hub-api install-pipeline manifest (bundle_manifest_v2 schema, schema_version 2) for
# waddles.core.example.ping.
#
# Deliberately separate from this bundle's own `bundle.yaml` (that file targets the M1/M1.5
# bundle-compiler/SDK schema -- `artifact: component`, `execution_model: wasi-component` --
# a DIFFERENT consumer than hub-api's M2a install-hooks pipeline, which understands only
# `artifact: source|prebuilt` per services/bundle_manifest_v2.py). This file is what
# hub_api/cli/seed_core_bundles.py feeds to bundle_version_service.create_version() /
# process_prebuilt_component() -- the artifact is already compiled to a WASI 0.2 component
# by bundles/Dockerfile.core-bundles, so `artifact: prebuilt` (matching
# core/bundle_compiler/tests/fixtures/manifests/valid_prebuilt.yaml's own shape).
schema_version: 2
app_id: waddles.core.example.ping
name: Ping Example Bundle (Rust)
# 1.0.0 AND 1.0.1 are permanently retired -- fix/reproducible-core-bundles. 1.0.0: the alpha DB
# already has an app_versions row published from a non-reproducible build (digest
# af00e0384536..., manually onboarded 2026-09-26), and a live pipeline env separately
# referenced yet a THIRD digest (4d24eedf1428...) for the same nominal version. 1.0.1 (added by
# fix/core-bundle-reproducible-ping) added SOURCE_DATE_EPOCH/RUSTFLAGS/codegen-units/strip pins
# to bundles/Dockerfile.core-bundles's rust-bundle-builder stage but never actually proved them
# byte-reproducible in CI (scripts/verify-ping-bundle-reproducible.sh existed but was never
# wired into any workflow) -- and it wasn't: the stage's `cargo component build` depended on
# rustup auto-installing the wasm32-wasip1 target on demand (declared in this bundle's own
# rust-toolchain.toml but never pre-installed by the Dockerfile), an unpinned, network-timed
# step outside every other pin's control. Treating 1.0.1's digest as unverified/potentially
# already-burned rather than risk a second conflict. app_versions is immutable per
# (app_id, version), so neither slot can ever be reused. 1.0.2 is the first version built with
# the wasm32-wasip1 preinstall fix plus a CI-enforced two-build byte-identity gate
# (.github/workflows/core-bundles-reproducible.yml) -- see
# bundles/Dockerfile.core-bundles's own comment block for the full pin list.
version: 1.0.2
feature: waddles.core.example
module: core
provider: builtin
language: rust
artifact: prebuilt
execution_model: native
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!ping"]
      # regression: seeder skipped activation for community_id null (alpha 2026-10-02) --
      # ping's manifest never declared `discord`, so even after the seeder started
      # activating tenant-wide, auto-bind (app_source_binding_service.sync_bindings())
      # had no `platform=discord` rule to match the alpha cluster's real Discord ingest
      # source against (pyping/csping's manifests already declared it; this one did not).
      - platform: discord
        event_types: ["chat.message"]
  action:
    entry: "waddle:bundle/action-stage#dispatch"
egress: []
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions: []
routes_to: []

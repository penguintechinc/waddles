[package]
name = "waddle-bundle-galactic-avatars"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "AGPL-3.0-or-later"
publish = false
description = "Galactic avatars APP bundle: assigns anonymous faction avatars to recently active chatters and publishes the stage strip to its own namespaced overlay surface via publish-surface. Roster is community-scoped kv holding salted-free hashes only; no names or ids are published."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen-rt = { version = "=0.44.0", features = ["bitflags"] }
waddle-sdk-rs = { path = "../../../sdk/waddle-sdk-rs", version = "=0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[package.metadata.component]
package = "waddle:bundle-galactic-avatars"

[package.metadata.component.target]
path = "../../../wit/waddle-bundle"
world = "stage-next-tools"

[package.metadata.component.dependencies]

[profile.release]
opt-level = "s"
lto = true
strip = true

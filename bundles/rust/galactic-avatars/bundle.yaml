schema_version: 2
app_id: waddles.core.app.galactic-avatars
name: Galactic Avatars (Rust)
version: 1.0.0
feature: waddles.core.app
module: core
provider: builtin
author: github:penguintechinc
license: AGPL-3.0-or-later
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/rust/galactic-avatars
language: rust
artifact: component
execution_model: wasi-component
is_default: false
kind: app
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
      - platform: discord
        event_types: ["chat.message"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    config: {}
    spec:
      required_config: []
  presentation:
    owned_surfaces:
      - waddles.core.app.galactic-avatars.stage_strip
egress: []
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: overlay.media
    justification: "publishes structured, text-only state to this bundle's own overlay surfaces via overlay.publish-surface (data-only envelopes, no media)"
    params:
      mode: data
  - id: storage.kv
    justification: "community-scoped roster of hashed chatter keys (never names), at most 50"

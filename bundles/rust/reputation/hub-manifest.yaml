# hub-api install-pipeline manifest (bundle_manifest_v2, schema_version 2) for the reputation
# SERVICE bundle. `kind: service` is accepted only via the trusted core-bundle seeder
# (seed_core_bundles.py passes trusted_source=True). Always-on platform plumbing: it is
# resolved to its platform-installed version, never per-community activated by an admin.
# Mirrors bundle.yaml's kind/tool blocks (the seeder's agreement check enforces that).
schema_version: 2
app_id: waddles.core.service.reputation
name: Reputation Service Bundle (Rust)
version: 1.1.1
feature: waddles.core.service
module: core
provider: builtin
author: github:penguintechinc
language: rust
artifact: prebuilt
execution_model: native
is_default: false
kind: service
# A service has no chat/event surface; the manifest schema requires a non-empty `stages`, so
# the single `action` stage points at the tool-provider export the host nested-invokes. It
# declares no `consumes` (an action stage must not), so no event is ever routed to it.
stages:
  action:
    entry: "waddle:bundle/tool-provider#call"
egress: []
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: reputation.read
    justification: "serves score/leaderboard/check/at_risk/is_soft_banned tool calls from the community reputation store"
  - id: reputation.community.write
    justification: "applies caller-named ACTIVITY deltas (|delta| <= 5) through the capped, idempotent reputation host capability"
    params:
      delta_min: -5
      delta_max: 5
      # Activity reasons callers (reputation-accrual, games, admin tools) pass through `adjust`.
      reason_codes:
        - chat.message
        - command.usage
        - follow
        - subscription
        - subscription.tier2
        - subscription.tier3
        - gift.subscription
        - cheer
        - raid
        - donation
        - boost
        - giveaway.entry
        - game.win
        - game.loss
        - loyalty.bonus
        - admin.adjust
  - id: reputation.moderation.write
    justification: "applies MODERATION-class deltas (|delta| <= 200) and floor-triggered soft bans; core/approved bundles only"
    params:
      delta_min: -200
      delta_max: 200
  - id: reputation.community.admin
    justification: "serves the admin-only absolute score override tool; the host enforces required_scope community:admin on the verified actor before dispatch"
  - id: reputation.history.read
    justification: "serves the history tool (own ledger, or admin)"
  - id: reputation.tenant.read
    justification: "serves get_tenant_score (the actor's own aggregate) and reads the tenant auto-ban policy for floor enforcement"
  - id: storage.kv
    justification: "persists the per-community floor/threshold policy and tier ladder (no scoring weights live here)"
  - id: flags.read
    justification: "reads the waddles.reputation-auto-ban flag (default OFF) that gates every floor action"
  - id: "tool.call:waddles.core.service.twitch:twitch.moderation.ban"
    justification: "hard/tenant floor ban on Twitch (flag-gated, default OFF)"
    params:
      write: true
  - id: "tool.call:waddles.core.service.discord:discord.moderation.ban"
    justification: "hard/tenant floor ban on Discord (flag-gated, default OFF)"
    params:
      write: true
  - id: "tool.call:waddles.core.service.youtube:youtube.moderation.ban"
    justification: "hard/tenant floor ban on YouTube (flag-gated, default OFF)"
    params:
      write: true
routes_to: []
requested_tools:
  - tool: twitch.moderation.ban
    access: write
    target_app_id: waddles.core.service.twitch
  - tool: discord.moderation.ban
    access: write
    target_app_id: waddles.core.service.discord
  - tool: youtube.moderation.ban
    access: write
    target_app_id: waddles.core.service.youtube
# Tools this service exposes through tool-provider.call; identical in hub-manifest.yaml and
# bundle.yaml (the seeder's agreement check fails on drift).
exported_tools:
- name: get_score
  access: read
  risk: normal
  input_schema:
    type: object
    properties:
      user:
        type: string
        format: uuid
    required:
    - user
    additionalProperties: false
  output_schema:
    type: object
    properties:
      user:
        type: string
        format: uuid
      score:
        type: integer
      tier:
        type: string
- name: get_many
  access: read
  risk: normal
  input_schema:
    type: object
    properties:
      users:
        type: array
        items:
          type: string
          format: uuid
        minItems: 1
        maxItems: 100
    required:
    - users
    additionalProperties: false
  output_schema:
    type: object
    properties:
      entries:
        type: array
        items:
          type: object
          properties:
            user:
              type: string
              format: uuid
            score:
              type: integer
            tier:
              type: string
- name: adjust
  access: write
  risk: dangerous
  input_schema:
    type: object
    properties:
      user:
        type: string
        format: uuid
      delta:
        type: integer
        minimum: -5
        maximum: 5
      reason:
        type: string
        pattern: ^[a-z0-9._:-]{1,100}$
      platform:
        type: string
        enum:
        - twitch
        - discord
        - youtube
    required:
    - user
    - delta
    - reason
    additionalProperties: false
  output_schema:
    type: object
    properties:
      user:
        type: string
        format: uuid
      score:
        type: integer
      tier:
        type: string
      delta:
        type: integer
      applied:
        type: boolean
      floors:
        type: object
- name: apply_moderation
  access: write
  risk: dangerous
  input_schema:
    type: object
    properties:
      user:
        type: string
        format: uuid
      delta:
        type: integer
        minimum: -200
        maximum: 200
      reason:
        type: string
        pattern: ^[a-z0-9._:-]{1,100}$
      platform:
        type: string
        enum:
        - twitch
        - discord
        - youtube
    required:
    - user
    - delta
    - reason
    additionalProperties: false
  output_schema:
    type: object
    properties:
      user:
        type: string
        format: uuid
      score:
        type: integer
      tier:
        type: string
      delta:
        type: integer
      applied:
        type: boolean
      floors:
        type: object
- name: override
  access: write
  risk: dangerous
  required_scope: community:admin
  input_schema:
    type: object
    properties:
      user:
        type: string
        format: uuid
      absolute_score:
        type: integer
      reason:
        type: string
        pattern: ^[a-z0-9._:-]{1,100}$
      platform:
        type: string
        enum:
        - twitch
        - discord
        - youtube
    required:
    - user
    - absolute_score
    additionalProperties: false
  output_schema:
    type: object
- name: leaderboard
  access: read
  risk: normal
  input_schema:
    type: object
    properties:
      limit:
        type: integer
        minimum: 1
        maximum: 100
    required: []
    additionalProperties: false
  output_schema:
    type: object
    properties:
      entries:
        type: array
        items:
          type: object
          properties:
            user:
              type: string
              format: uuid
            score:
              type: integer
            tier:
              type: string
- name: rep
  access: read
  risk: normal
  input_schema:
    type: object
    properties:
      user:
        type: string
        format: uuid
    required:
    - user
    additionalProperties: false
  output_schema:
    type: object
    properties:
      user:
        type: string
        format: uuid
      score:
        type: integer
      tier:
        type: string
      next_tier:
        type:
        - object
        - 'null'
      text:
        type: string
- name: get_tenant_score
  access: read
  risk: normal
  required_scope: community:member
  input_schema:
    type: object
    properties: {}
    required: []
    additionalProperties: false
  output_schema:
    type: object
- name: history
  access: read
  risk: normal
  required_scope: community:member
  input_schema:
    type: object
    properties:
      user:
        type: string
        format: uuid
      limit:
        type: integer
        minimum: 1
        maximum: 100
      before:
        type: integer
        minimum: 1
    required:
    - user
    additionalProperties: false
  output_schema:
    type: object
    properties:
      entries:
        type: array
        items:
          type: object
- name: check
  access: read
  risk: normal
  input_schema:
    type: object
    properties:
      user:
        type: string
        format: uuid
    required:
    - user
    additionalProperties: false
  output_schema:
    type: object
- name: at_risk
  access: read
  risk: normal
  required_scope: community:admin
  input_schema:
    type: object
    properties:
      limit:
        type: integer
        minimum: 1
        maximum: 100
    required: []
    additionalProperties: false
  output_schema:
    type: object
- name: is_soft_banned
  access: read
  risk: normal
  input_schema:
    type: object
    properties:
      user:
        type: string
        format: uuid
    required:
    - user
    additionalProperties: false
  output_schema:
    type: object
    properties:
      user:
        type: string
        format: uuid
      soft_banned:
        type: boolean
- name: get_policy
  access: read
  risk: normal
  required_scope: community:admin
  input_schema:
    type: object
    properties: {}
    required: []
    additionalProperties: false
  output_schema:
    type: object
- name: set_policy
  access: write
  risk: dangerous
  required_scope: community:admin
  input_schema:
    type: object
    properties:
      soft_ban_enabled:
        type: boolean
      soft_ban_floor:
        type: integer
        minimum: 300
        maximum: 850
      hard_ban_enabled:
        type: boolean
      hard_ban_floor:
        type: integer
        minimum: 300
        maximum: 850
      at_risk_threshold:
        type: integer
        minimum: 300
        maximum: 850
    required: []
    additionalProperties: false
  output_schema:
    type: object
# Admin UI surface via hub-api's generic bundle-admin gateway (docs/BUNDLE_ADMIN_GATEWAY.md); identical in both manifests.
admin_tools:
- name: leaderboard
  tool: leaderboard
  kind: read
  scope: community:moderate
- name: override
  tool: override
  kind: action
  scope: community:admin
- name: at_risk
  tool: at_risk
  kind: read
  scope: community:admin
- name: set_policy
  tool: set_policy
  kind: action
  scope: community:admin

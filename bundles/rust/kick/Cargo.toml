[package]
name = "waddle-bundle-kick-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "AGPL-3.0-or-later"
publish = false
description = "Kick platform SERVICE bundle: a `kind: service` bundle on the `connector-tools` world. Normalizes Kick Pusher chat frames and signed Kick webhook deliveries into platform-neutral events, builds Kick public-API request templates (chat send/delete) and exports the kick.live.channels tool. Holds no secret, no raw target and no transport code; the host owns sockets, signature verification and credentials."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen-rt = { version = "=0.44.0", features = ["bitflags"] }
waddle-sdk-rs = { path = "../../../sdk/waddle-sdk-rs", version = "=0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[package.metadata.component]
package = "waddle:bundle-kick-service"

[package.metadata.component.target]
path = "../../../wit/waddle-connector"
world = "connector-tools"

[package.metadata.component.dependencies]

[profile.release]
opt-level = "s"
lto = true
strip = true

[package.metadata.component.target.dependencies]
"waddle:bundle" = { path = "../../../wit/waddle-connector/deps/waddle-bundle" }

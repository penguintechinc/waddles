# Kick platform SERVICE bundle (`kind: service`, `connector-tools` world). Credentials are NEVER
# in this file or the component: sender templates carry the opaque slot `{{KICK_TOKEN}}` -> handle
# `token`, resolved host-side per send from the community's Kick OAuth connection (OAuth 2.1 +
# PKCE via the hub-api gateway; the token never enters guest memory). Pusher chat needs no
# credential: the subscribe channel is the host-pinned slot `{{KICK_CHANNEL}}` -> handle `channel`.
# Cutover flag: PostHog `waddles.connector-kick` (default OFF; the Python svc_ingest Kick path
# runs unchanged while OFF).
schema_version: 2
app_id: waddles.core.service.kick
name: Kick Platform Connector (Rust)
version: 1.0.0
feature: waddles.core.service
module: core
provider: builtin
language: rust
artifact: component
execution_model: wasi-component
is_default: false
kind: service
stages:
  action:
    entry: waddle:bundle/tool-provider#call
egress:
- host: api.kick.com
  methods:
  - GET
  - POST
  - DELETE
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
- id: net.http.fqdn:api.kick.com
  justification: Kick public API (chat send template, channels read tool); credentials
    are host-injected secret refs
  params:
    methods:
    - GET
    - POST
- id: chat.send:kick
  justification: Template Kick chat messages (bot post); the host resolves the channel from the
    community connection and substitutes the credential
- id: moderation.kick
  justification: Ban, timeout and unban viewers (/public/v1/moderation/bans); the broadcaster id is a
    host integer slot from the community connection and the host refuses the broadcaster as target
- id: connector.pii.read
  justification: Gates identity.lookup, used to resolve the actor to its canonical UUID and the
    live-channels broadcaster ref; first-party core only, dangerous, global-admin-approved
- id: flags.read
  justification: Reads the waddles.connector-kick cutover flag (default OFF) as the connector's
    defence-in-depth gate; without it the gate always reads OFF
- id: platform.clock
  justification: Stamps as_of on kick.live.channels results (clock.now-rfc3339); read-only time
routes_to: []
exported_tools:
- name: kick.live.channels
  access: read
  risk: normal
  input_schema:
    type: object
    properties:
      scope:
        type: string
        enum:
        - community
        - linked
      cursor:
        type: string
        minLength: 1
        maxLength: 512
      limit:
        type: integer
        minimum: 1
        maximum: 100
    required: []
    additionalProperties: false
  output_schema:
    type: object
    properties:
      channels:
        type: array
        items:
          type: object
          properties:
            channel_ref:
              type: string
            display_name:
              type: string
            is_live:
              type: boolean
            title:
              type: string
            category:
              type: string
            viewers:
              type: integer
            started_at:
              type: string
            thumbnail_ref:
              type: string
          required:
          - channel_ref
          - display_name
          - is_live
      cursor:
        type: string
      as_of:
        type: string
    required:
    - channels
    - as_of
author: github:penguintechinc
license: AGPL-3.0-or-later
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/rust/kick
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: 1.0.0
  min_version: 1.0.0
  max_version: null

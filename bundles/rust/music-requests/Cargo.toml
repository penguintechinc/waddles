[package]
name = "waddle-bundle-music-requests-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "AGPL-3.0-or-later"
publish = false
description = "Music requests SERVICE bundle: the single per-community song-request queue (db-v2 tables) behind gated tool calls on the stage-tools world; the music app and the optional AI DJ layer both use these tools."

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { version = "=0.44.0", features = ["bitflags"] }
# Sibling-crate path dependency (same repo, moves together) -- the real
# `tool` registry/dispatch lives in the SDK; see
# core/bundle_executor/tests/fixtures/tool-provider-fixture-src for the
# adapter pattern this bundle follows.
waddle-sdk-rs = { path = "../../../sdk/waddle-sdk-rs", version = "=0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[package.metadata.component]
package = "waddle:bundle-music-requests-service"

[package.metadata.component.target]
path = "../../../wit/waddle-bundle"
world = "stage-tools"

[package.metadata.component.dependencies]

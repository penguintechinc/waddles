# hub-api install-pipeline manifest (bundle_manifest_v2, schema_version 2) for waddles.core.example.twitch-clips.
# Keep version/permissions/stages in lockstep with bundle.yaml. `config_schema` and `admin_actions` are the
# declarative contract for the generic bundle-admin gateway (tolerated by the v2 parser today).
# limits.timeout_ms=10000 is the host's hard cap: create + bounded poll (<=7s) must fit one invocation.
schema_version: 2
app_id: waddles.core.example.twitch-clips
name: Twitch Clips Bundle (Rust)
version: 1.0.0
feature: waddles.core.example
module: core
provider: builtin
author: github:penguintechinc
license: AGPL-3.0-or-later
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/rust/twitch-clips
language: rust
artifact: prebuilt
execution_model: native
is_default: false
stages:
  process:
    entry: waddle:bundle/process-stage#transform
    consumes:
    - platform: twitch
      event_types:
      - chat.message
      filters:
        command_prefix:
        - '!clip'
        - '!clips'
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: waddle:bundle/action-stage#dispatch
    config: {}
    spec:
      required_config: []
egress: []
data:
  tables: []
limits:
  timeout_ms: 10000
  memory_mb: 64
  egress_rps: 10
permissions:
- id: chat.send:twitch
  justification: Reply to the invoking Twitch channel (clip link, cooldown and error notices) via the
    relay host import
- id: chat.send:discord
  justification: Optional per-community share of a finished clip link to one admin-configured Discord
    channel via the relay host import
- id: identity.resolve
  justification: Resolve the verified chat actor to a community UUID for per-user cooldown keys; never
    a handle
- id: tool.call:waddles.core.service.twitch:twitch.clip.create
  justification: Create a Twitch clip of the live stream; broadcaster is pinned host-side
  params:
    write: true
- id: tool.call:waddles.core.service.twitch:twitch.clip.get
  justification: Poll a just-created clip until Twitch finishes processing it
  params:
    write: false
- id: tool.call:waddles.core.service.twitch:twitch.clip.list
  justification: List the channel's recent clips for !clips
  params:
    write: false
routes_to: []
requested_tools:
- tool: twitch.clip.create
  access: write
  target_app_id: waddles.core.service.twitch
- tool: twitch.clip.get
  access: read
  target_app_id: waddles.core.service.twitch
- tool: twitch.clip.list
  access: read
  target_app_id: waddles.core.service.twitch
config_schema: &id002
  type: object
  properties:
    who_can_clip:
      type: string
      enum: &id001
      - everyone
      - subscribers
      - vip
      - mods
      - broadcaster
      default: mods
    who_can_list:
      type: string
      enum: *id001
      default: everyone
    user_cooldown_secs:
      type: integer
      minimum: 0
      maximum: 3600
      default: 60
    channel_cooldown_secs:
      type: integer
      minimum: 0
      maximum: 3600
      default: 30
    list_cooldown_secs:
      type: integer
      minimum: 0
      maximum: 3600
      default: 10
    default_title:
      type:
      - string
      - 'null'
      maxLength: 100
    announce_template:
      type: string
      maxLength: 200
      default: 'Clip ready: {url}'
    discord_share_enabled:
      type: boolean
      default: false
    discord_share_channel_id:
      type:
      - string
      - 'null'
      pattern: ^[0-9]{15,25}$
    list_limit:
      type: integer
      minimum: 1
      maximum: 10
      default: 5
    poll_budget_ms:
      type: integer
      minimum: 1000
      maximum: 7000
      default: 6000
  additionalProperties: false
admin_actions:
- name: list
  access: read
  description: Recent clips created through this bundle plus pending count
  input_schema: &id003
    type: object
    properties: {}
    additionalProperties: false
- name: delete
  access: write
  description: Remove a clip from this bundle's index and hide it from !clips (does not delete it on Twitch)
  input_schema:
    type: object
    properties:
      clip_id:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,100}$
    required:
    - clip_id
    additionalProperties: false
- name: config
  access: read
  description: Effective config; optionally validates a candidate config without storing it
  input_schema:
    type: object
    properties:
      config: *id002
    additionalProperties: false
- name: sweep
  access: write
  description: 'Resolve pending clips now: announce ready ones, time out stale ones'
  input_schema: *id003
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: 1.0.0
  min_version: 1.0.0
  max_version: null

[package]
name = "waddle-bundle-twitch-clips"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "AGPL-3.0-or-later"
publish = false
description = "Twitch clips APP bundle: `!clip` / `!clips` chat commands and bundle-admin actions over the Twitch platform service bundle's twitch.clip.{create,get,list} tools. Chat reply and optional Discord share go out through the relay host import; no credentials ever enter the guest."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen-rt = { version = "=0.44.0", features = ["bitflags"] }
waddle-sdk-rs = { path = "../../../sdk/waddle-sdk-rs", version = "=0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
jsonschema = { version = "=0.60.2", default-features = false }

[package.metadata.component]
package = "waddle:bundle-twitch-clips"

[package.metadata.component.target]
path = "../../../wit/waddle-bundle"
world = "stage-next-tools"

[package.metadata.component.dependencies]

[profile.release]
opt-level = "s"
lto = true
strip = true

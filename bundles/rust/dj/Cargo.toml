[package]
name = "waddle-bundle-dj-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "AGPL-3.0-or-later"
publish = false
description = "DJ APP bundle: community playlists, viewer song requests (`!sr`) with per-user limits/cooldowns/duplicate guard, mod approve/skip/remove/ban-song, a deterministic song policy (allowlists, deny-lists, duration, explicit flag, DMCA-safe mode) plus an optional AI DJ that compiles plain-language instructions into that policy. Compiled to a WASI 0.2 component on the `stage-next-tools` world; reaches music providers and the AI service only through gated tool calls."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen-rt = { version = "=0.44.0", features = ["bitflags"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"

[package.metadata.component]
package = "waddle:bundle-dj-app"

[package.metadata.component.target]
path = "../../../wit/waddle-bundle"
world = "stage-next-tools"

[package.metadata.component.dependencies]

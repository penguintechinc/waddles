schema_version: 2
app_id: waddles.core.example.dj
name: DJ Bundle (Rust)
version: 1.1.0
feature: waddles.core.example
module: core
provider: builtin
author: github:penguintechinc
license: AGPL-3.0-or-later
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/rust/dj
language: rust
artifact: component
execution_model: wasi-component
is_default: false
stages:
  process:
    entry: waddle:bundle/process-stage#transform
    consumes:
    - platform: twitch
      event_types:
      - chat.message
      filters:
        command_prefix: &id001
        - '!dj'
    - platform: discord
      event_types:
      - chat.message
      filters:
        command_prefix: *id001
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: waddle:bundle/action-stage#dispatch
    config: {}
    spec:
      required_config: []
egress: []
data:
  tables: []
limits:
  timeout_ms: 5000
  memory_mb: 64
  egress_rps: 10
permissions:
- id: chat.send:discord
  justification: Reply to the invoking user/channel via relay.push
- id: chat.send:twitch
  justification: Reply to the invoking user/channel via relay.push
- id: identity.resolve
  justification: Resolve the verified requester to a community user UUID (never store handles)
- id: storage.kv
  justification: Community-scoped DJ config, bans, recent picks, playlists, policy, audit log (the request queue lives in music-requests)
- id: tool.call:waddles.core.service.music-youtube:music.youtube.search
  justification: Resolve AI DJ hints against youtube (metadata only)
  params:
    write: false
- id: tool.call:waddles.core.service.music-youtube:music.youtube.resolve
  justification: Resolve a pasted youtube link to track metadata (metadata only)
  params:
    write: false
- id: tool.call:waddles.core.service.music-youtube:music.youtube.playlist.get
  justification: Import a youtube playlist into a static DJ playlist
  params:
    write: false
- id: tool.call:waddles.core.service.music-spotify:music.spotify.search
  justification: Resolve AI DJ hints against spotify (metadata only)
  params:
    write: false
- id: tool.call:waddles.core.service.music-spotify:music.spotify.resolve
  justification: Resolve a pasted spotify link to track metadata (metadata only)
  params:
    write: false
- id: tool.call:waddles.core.service.music-spotify:music.spotify.playlist.get
  justification: Import a spotify playlist into a static DJ playlist
  params:
    write: false
- id: tool.call:waddles.core.service.music-soundcloud:music.soundcloud.search
  justification: Resolve AI DJ hints against soundcloud (metadata only)
  params:
    write: false
- id: tool.call:waddles.core.service.music-soundcloud:music.soundcloud.resolve
  justification: Resolve a pasted soundcloud link to track metadata (metadata only)
  params:
    write: false
- id: tool.call:waddles.core.service.music-soundcloud:music.soundcloud.playlist.get
  justification: Import a soundcloud playlist into a static DJ playlist
  params:
    write: false
- id: tool.call:waddles.core.service.ai:ai.complete
  justification: Compile admin instructions into a policy and propose AI DJ songs (admin text only, never viewer text)
  params:
    write: false
- id: tool.call:waddles.core.service.ai:ai.classify
  justification: Judge track metadata against fuzzy channel rules; fixed labels, untrusted data field
  params:
    write: false
- id: tool.call:waddles.core.service.music-requests:requests.list
  justification: Re-read the shared queue (now playing + queued, no requester) before every DJ plan
  params:
    write: false
- id: tool.call:waddles.core.service.music-requests:requests.advance_due
  justification: Advance the shared queue when the playing track has elapsed (idempotent) before planning
  params:
    write: false
- id: tool.call:waddles.core.service.music-requests:requests.add
  justification: Add a policy-approved DJ pick with kind dj (never ahead of viewer requests)
  params:
    write: true
- id: tool.call:waddles.core.service.music-requests:requests.import
  justification: One-shot migration of the pre-1.1.0 DJ kv queue into the shared queue
  params:
    write: true
- id: tool.call:waddles.core.service.music-requests:history.list
  justification: Read the last 25 played songs (no requester) so the DJ never replays a recent song (music:history.read enforced host-side)
  params:
    write: false
- id: tool.call:waddles.core.service.music-requests:music.stats.top
  justification: Read aggregate community play history (top artists/songs, no requester) to weight and fill DJ picks
  params:
    write: false
- id: tool.call:waddles.core.service.music-requests:settings.set
  justification: One-shot carry-over of the old DJ-local DMCA-safe switch to the service flag (music:settings.write enforced host-side)
  params:
    write: true
- id: tool.call:waddles.core.service.music-requests:dj.get
  justification: Read the single stored AI DJ on/off setting
  params:
    write: false
- id: tool.call:waddles.core.service.music-requests:dj.set
  justification: Flip the single stored AI DJ setting (music:dj.manage enforced host-side)
  params:
    write: true
requested_tools:
- tool: music.youtube.search
  access: read
  target_app_id: waddles.core.service.music-youtube
- tool: music.youtube.resolve
  access: read
  target_app_id: waddles.core.service.music-youtube
- tool: music.youtube.playlist.get
  access: read
  target_app_id: waddles.core.service.music-youtube
- tool: music.spotify.search
  access: read
  target_app_id: waddles.core.service.music-spotify
- tool: music.spotify.resolve
  access: read
  target_app_id: waddles.core.service.music-spotify
- tool: music.spotify.playlist.get
  access: read
  target_app_id: waddles.core.service.music-spotify
- tool: music.soundcloud.search
  access: read
  target_app_id: waddles.core.service.music-soundcloud
- tool: music.soundcloud.resolve
  access: read
  target_app_id: waddles.core.service.music-soundcloud
- tool: music.soundcloud.playlist.get
  access: read
  target_app_id: waddles.core.service.music-soundcloud
- tool: ai.complete
  access: read
  target_app_id: waddles.core.service.ai
- tool: ai.classify
  access: read
  target_app_id: waddles.core.service.ai
- tool: requests.list
  access: read
  target_app_id: waddles.core.service.music-requests
- tool: requests.advance_due
  access: read
  target_app_id: waddles.core.service.music-requests
- tool: requests.add
  access: write
  target_app_id: waddles.core.service.music-requests
- tool: requests.import
  access: write
  target_app_id: waddles.core.service.music-requests
- tool: history.list
  access: read
  target_app_id: waddles.core.service.music-requests
- tool: music.stats.top
  access: read
  target_app_id: waddles.core.service.music-requests
- tool: settings.set
  access: write
  target_app_id: waddles.core.service.music-requests
- tool: dj.get
  access: read
  target_app_id: waddles.core.service.music-requests
- tool: dj.set
  access: write
  target_app_id: waddles.core.service.music-requests
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: 1.0.0
  min_version: 1.0.0
  max_version: null

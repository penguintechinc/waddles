[package]
name = "waddle-bundle-music-soundcloud"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "AGPL-3.0-or-later"
publish = false
description = "SoundCloud music SERVICE bundle: an always-on `kind: service` bundle on the `stage-tools` world exporting `tool-provider` with music.soundcloud.{search,track,playlist.get,resolve}. Metadata + license/permission flags only (never audio); credentials are host-injected secret refs."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen-rt = { version = "=0.44.0", features = ["bitflags"] }
waddle-sdk-rs = { path = "../../../sdk/waddle-sdk-rs", version = "=0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[package.metadata.component]
package = "waddle:bundle-music-soundcloud"

[package.metadata.component.target]
path = "../../../wit/waddle-bundle"
world = "stage-tools"

[package.metadata.component.dependencies]

[profile.release]
opt-level = "s"
lto = true
strip = true

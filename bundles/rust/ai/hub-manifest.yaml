# hub-api install-pipeline manifest (bundle_manifest_v2, schema_version 2) for the AI SERVICE
# bundle. `kind: service` is accepted only via the trusted core-bundle seeder. Always-on
# platform plumbing, resolved to its platform-installed version. Mirrors bundle.yaml's
# kind/tool blocks; both are generated from tests/contract/*.json.
schema_version: 2
app_id: waddles.core.service.ai
name: AI Service Bundle (Rust)
version: 1.0.0
feature: waddles.core.service
module: core
provider: builtin
author: github:penguintechinc
language: rust
artifact: prebuilt
execution_model: native
is_default: false
kind: service
stages:
  action:
    entry: waddle:bundle/tool-provider#call
egress: []
data:
  tables: []
limits:
  timeout_ms: 10000
  memory_mb: 64
  egress_rps: 10
permissions:
- id: ai.generate
  justification: serves ai.complete/ai.classify through the host-controlled self-hosted model (ai.generate);
    the host owns model choice, BYOK/tier gating, PII rejection and prompt framing
- id: storage.kv
  justification: holds per-community minute/day quota counters and the community AI config (blocklist,
    limits, link policy)
routes_to: []
exported_tools:
- name: ai.complete
  access: read
  risk: normal
  input_schema:
    type: object
    properties:
      prompt:
        type: string
        minLength: 1
        maxLength: 3500
      system:
        type: string
        maxLength: 1200
      max_tokens:
        type: integer
        minimum: 1
        maximum: 512
      temperature:
        type: number
        minimum: 0
        maximum: 2
    required:
    - prompt
    additionalProperties: false
  output_schema:
    type: object
    properties:
      text:
        type: string
        maxLength: 2000
    required:
    - text
- name: ai.classify
  access: read
  risk: normal
  input_schema:
    type: object
    properties:
      text:
        type: string
        minLength: 1
        maxLength: 2000
      labels:
        type: array
        items:
          type: string
          minLength: 1
          maxLength: 40
        minItems: 2
        maxItems: 20
        uniqueItems: true
      instructions:
        type: string
        maxLength: 800
    required:
    - text
    - labels
    additionalProperties: false
  output_schema:
    type: object
    properties:
      label:
        type: string
      confidence:
        type: number
        minimum: 0
        maximum: 1
      reason:
        type: string
        maxLength: 200
    required:
    - label
    - confidence
    - reason
- name: ai.rag.query
  access: read
  risk: normal
  input_schema:
    type: object
    properties:
      collection:
        type: string
        pattern: ^[a-z0-9][a-z0-9_.-]{0,39}$
      question:
        type: string
        minLength: 1
        maxLength: 1000
      top_k:
        type: integer
        minimum: 1
        maximum: 8
    required:
    - collection
    - question
    additionalProperties: false
  output_schema:
    type: object
    properties:
      answer:
        type: string
        maxLength: 2000
      citations:
        type: array
        items:
          type: object
          properties:
            doc_id:
              type: string
            chunk:
              type: integer
              minimum: 0
            score:
              type: number
          required:
          - doc_id
          - chunk
    required:
    - answer
    - citations
- name: ai.rag.ingest
  access: write
  risk: dangerous
  required_scope: community:admin
  input_schema:
    type: object
    properties:
      collection:
        type: string
        pattern: ^[a-z0-9][a-z0-9_.-]{0,39}$
      doc_id:
        type: string
        pattern: ^[a-z0-9][a-z0-9_.-]{0,63}$
      title:
        type: string
        maxLength: 200
      text:
        type: string
        minLength: 1
        maxLength: 100000
    required:
    - collection
    - text
    additionalProperties: false
  output_schema:
    type: object
    properties:
      doc_id:
        type: string
      chunks:
        type: integer
        minimum: 0
    required:
    - doc_id
    - chunks
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: 1.0.0
  min_version: 1.0.0
  max_version: null

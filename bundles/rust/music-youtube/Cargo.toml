[package]
name = "waddle-bundle-music-youtube-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "AGPL-3.0-or-later"
publish = false
description = "Music YouTube SERVICE bundle: always-on kind: service bundle on the stage-tools world exporting tool-provider with the common music tool contract (music.youtube.search/track/playlist.get/resolve) over the YouTube Data API v3 via host HTTP egress; credentials are host-side secret refs, never in the guest."

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { version = "=0.44.0", features = ["bitflags"] }
# Sibling-crate path dependency (same repo, moves together) -- the real
# `tool` registry/dispatch lives in the SDK; see
# core/bundle_executor/tests/fixtures/tool-provider-fixture-src for the
# adapter pattern this bundle follows.
waddle-sdk-rs = { path = "../../../sdk/waddle-sdk-rs", version = "=0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[package.metadata.component]
package = "waddle:bundle-music-youtube-service"

[package.metadata.component.target]
path = "../../../wit/waddle-bundle"
world = "stage-tools"

[package.metadata.component.dependencies]

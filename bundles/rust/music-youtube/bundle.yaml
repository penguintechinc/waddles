schema_version: 2
app_id: waddles.core.service.music-youtube
name: Music YouTube Service Bundle (Rust)
version: 1.0.0
feature: waddles.core.service
module: core
provider: builtin
author: github:penguintechinc
license: AGPL-3.0-or-later
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/rust/music-youtube
language: rust
artifact: component
execution_model: wasi-component
is_default: false
kind: service
stages:
  action:
    entry: "waddle:bundle/tool-provider#call"
    config: {}
    spec:
      required_config: []
# YouTube Data API v3 only. Credentials are host-side secret REFS (YOUTUBE_API_KEY injected as
# ?key=, or YOUTUBE_OAUTH_AUTHORIZATION as the Authorization header for a community's connected
# account); the values never enter the guest.
egress:
  - host: www.googleapis.com
    methods: ["GET"]
data:
  tables: []
limits:
  timeout_ms: 10000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: net.http.fqdn:www.googleapis.com
    justification: "YouTube Data API v3 search.list / videos.list / playlistItems.list (read-only GET); API key or OAuth bearer is injected host-side via secret refs"
    params:
      methods: ["GET"]
  - id: storage.kv
    justification: "caches track metadata and search/playlist result ids with a TTL, holds the per-community rate-limit and daily quota-unit counters, and the optional per-community config"
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: "1.0.0"
  min_version: "1.0.0"
  max_version: null
exported_tools:
- name: music.youtube.search
  access: read
  risk: normal
  input_schema:
    type: object
    properties:
      query:
        type: string
        minLength: 1
        maxLength: 200
      limit:
        type: integer
        minimum: 1
        maximum: 25
    required:
    - query
    additionalProperties: false
  output_schema:
    type: object
    properties:
      tracks:
        type: array
        items:
          type: object
          properties:
            provider:
              type: string
            id:
              type: string
            title:
              type: string
            artist:
              type: string
            duration_ms:
              type: integer
              minimum: 0
            thumbnail:
              type:
              - string
              - 'null'
            explicit:
              type:
              - boolean
              - 'null'
            source_url:
              type: string
          required:
          - provider
          - id
          - title
          - artist
          - duration_ms
          - thumbnail
          - explicit
          - source_url
      cached:
        type: boolean
      skipped:
        type: integer
        minimum: 0
      capability:
        type: object
        properties:
          playback:
            type: string
            enum:
            - embed
            - connect
            - none
          server_audio:
            type: boolean
          queue_add:
            type: boolean
        required:
        - playback
        - server_audio
        - queue_add
    required:
    - tracks
    - capability
- name: music.youtube.track
  access: read
  risk: normal
  input_schema:
    type: object
    properties:
      id:
        type: string
        minLength: 1
        maxLength: 64
    required:
    - id
    additionalProperties: false
  output_schema:
    type: object
    properties:
      track:
        type: object
        properties:
          provider:
            type: string
          id:
            type: string
          title:
            type: string
          artist:
            type: string
          duration_ms:
            type: integer
            minimum: 0
          thumbnail:
            type:
            - string
            - 'null'
          explicit:
            type:
            - boolean
            - 'null'
          source_url:
            type: string
        required:
        - provider
        - id
        - title
        - artist
        - duration_ms
        - thumbnail
        - explicit
        - source_url
      cached:
        type: boolean
      capability:
        type: object
        properties:
          playback:
            type: string
            enum:
            - embed
            - connect
            - none
          server_audio:
            type: boolean
          queue_add:
            type: boolean
        required:
        - playback
        - server_audio
        - queue_add
    required:
    - track
    - capability
- name: music.youtube.playlist.get
  access: read
  risk: normal
  input_schema:
    type: object
    properties:
      playlist_id:
        type: string
        minLength: 1
        maxLength: 64
      limit:
        type: integer
        minimum: 1
        maximum: 50
      page_token:
        type: string
        minLength: 1
        maxLength: 200
    required:
    - playlist_id
    additionalProperties: false
  output_schema:
    type: object
    properties:
      tracks:
        type: array
        items:
          type: object
          properties:
            provider:
              type: string
            id:
              type: string
            title:
              type: string
            artist:
              type: string
            duration_ms:
              type: integer
              minimum: 0
            thumbnail:
              type:
              - string
              - 'null'
            explicit:
              type:
              - boolean
              - 'null'
            source_url:
              type: string
          required:
          - provider
          - id
          - title
          - artist
          - duration_ms
          - thumbnail
          - explicit
          - source_url
      next_page_token:
        type:
        - string
        - 'null'
      cached:
        type: boolean
      skipped:
        type: integer
        minimum: 0
      capability:
        type: object
        properties:
          playback:
            type: string
            enum:
            - embed
            - connect
            - none
          server_audio:
            type: boolean
          queue_add:
            type: boolean
        required:
        - playback
        - server_audio
        - queue_add
    required:
    - tracks
    - next_page_token
    - capability
- name: music.youtube.resolve
  access: read
  risk: normal
  input_schema:
    type: object
    properties:
      url:
        type: string
        minLength: 1
        maxLength: 512
    required:
    - url
    additionalProperties: false
  output_schema:
    type: object
    properties:
      track:
        type: object
        properties:
          provider:
            type: string
          id:
            type: string
          title:
            type: string
          artist:
            type: string
          duration_ms:
            type: integer
            minimum: 0
          thumbnail:
            type:
            - string
            - 'null'
          explicit:
            type:
            - boolean
            - 'null'
          source_url:
            type: string
        required:
        - provider
        - id
        - title
        - artist
        - duration_ms
        - thumbnail
        - explicit
        - source_url
      cached:
        type: boolean
      capability:
        type: object
        properties:
          playback:
            type: string
            enum:
            - embed
            - connect
            - none
          server_audio:
            type: boolean
          queue_add:
            type: boolean
        required:
        - playback
        - server_audio
        - queue_add
    required:
    - track
    - capability

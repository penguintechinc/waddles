# exported_tools identical to hub-manifest.yaml (seeder agreement check).
schema_version: 2
app_id: waddles.core.service.webrtc
name: WebRTC Service Bundle (Rust)
version: 1.4.0
feature: waddles.core.service
module: core
provider: builtin
author: github:penguintechinc
license: AGPL-3.0-or-later
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/rust/webrtc
language: rust
artifact: component
execution_model: wasi-component
is_default: false
kind: service
stages:
  action:
    entry: waddle:bundle/tool-provider#call
    config: {}
    spec:
      required_config: []
egress: []
data:
  tables: []
limits:
  timeout_ms: 5000
  memory_mb: 64
  egress_rps: 10
permissions: []
exported_tools:
- name: room.create
  access: write
  risk: dangerous
  input_schema:
    type: object
    properties:
      label:
        type: string
        maxLength: 128
      max_publishers:
        type: integer
        minimum: 1
        maximum: 64
      route:
        enum:
        - sfu
      kind:
        enum:
        - community
        - stage
        - green_room
      closed:
        type: boolean
      allow_guests:
        type: boolean
      starts_at:
        type: integer
        minimum: 0
      ends_at:
        type: integer
        minimum: 0
    required: []
    additionalProperties: false
  output_schema:
    type: object
    properties:
      room_id:
        type: string
        format: uuid
      label:
        type:
        - string
        - 'null'
      route:
        enum:
        - sfu
      max_publishers:
        type: integer
      created_at:
        type: integer
      publisher_ids:
        type: array
        items:
          type: string
          format: uuid
      subscriber_count:
        type: integer
  required_scope: community:admin
- name: room.update
  access: write

# exported_tools identical to hub-manifest.yaml (seeder agreement check).
schema_version: 2
app_id: waddles.core.service.webrtc
name: WebRTC Service Bundle (Rust)
version: 1.0.0
feature: waddles.core.service
module: core
provider: builtin
author: github:penguintechinc
license: AGPL-3.0-or-later
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/rust/webrtc
language: rust
artifact: component
execution_model: wasi-component
is_default: false
kind: service
stages:
  action:
    entry: waddle:bundle/tool-provider#call
    config: {}
    spec:
      required_config: []
egress: []
data:
  tables: []
limits:
  timeout_ms: 5000
  memory_mb: 64
  egress_rps: 10
permissions: []
exported_tools:
- name: room.create
  access: write
  risk: normal
  input_schema:
    type: object
    properties:
      label:
        type: string
        maxLength: 128
      max_publishers:
        type: integer
        minimum: 1
        maximum: 64
      route:
        enum:
        - sfu
    required: []
    additionalProperties: false
  output_schema:
    type: object
    properties:
      room_id:
        type: string
        format: uuid
      label:
        type:
        - string
        - 'null'
      route:
        enum:
        - sfu
      max_publishers:
        type: integer
      created_at:
        type: integer
      publisher_ids:
        type: array
        items:
          type: string
          format: uuid
      subscriber_count:
        type: integer
  required_scope: community:admin
- name: room.get
  access: read
  risk: normal
  input_schema:
    type: object
    properties:
      room_id:
        type: string
        format: uuid
    required:
    - room_id
    additionalProperties: false
  output_schema:
    type: object
    properties:
      room_id:
        type: string
        format: uuid
      label:
        type:
        - string
        - 'null'
      route:
        enum:
        - sfu
      max_publishers:
        type: integer
      created_at:
        type: integer
      publisher_ids:
        type: array
        items:
          type: string
          format: uuid
      subscriber_count:
        type: integer
- name: room.close
  access: write
  risk: dangerous
  input_schema:
    type: object
    properties:
      room_id:
        type: string
        format: uuid
    required:
    - room_id
    additionalProperties: false
  output_schema:
    type: object
    properties:
      room_id:
        type: string
        format: uuid
      label:
        type:
        - string
        - 'null'
      route:
        enum:
        - sfu
      max_publishers:
        type: integer
      created_at:
        type: integer
      publisher_ids:
        type: array
        items:
          type: string
          format: uuid
      subscriber_count:
        type: integer
  required_scope: community:admin
- name: token.issue
  access: write
  risk: dangerous
  input_schema:
    type: object
    properties:
      room_id:
        type: string
        format: uuid
      participant_id:
        type: string
        format: uuid
      publish:
        type: boolean
      subscribe:
        type: boolean
      source:
        type: string
        format: uuid
      ttl_secs:
        type: integer
        minimum: 30
        maximum: 3600
    required:
    - room_id
    - publish
    - subscribe
    additionalProperties: false
  output_schema:
    type: object
    properties:
      token:
        type: string
      token_id:
        type: string
        format: uuid
      participant_id:
        type: string
        format: uuid
      expires_at:
        type: integer
- name: token.revoke
  access: write
  risk: dangerous
  input_schema:
    type: object
    properties:
      room_id:
        type: string
        format: uuid
      token_id:
        type: string
        format: uuid
    required:
    - room_id
    - token_id
    additionalProperties: false
  output_schema:
    type: object
    properties:
      revoked:
        type: boolean
      token_id:
        type: string
        format: uuid
- name: whip.endpoint
  access: write
  risk: dangerous
  input_schema:
    type: object
    properties:
      room_id:
        type: string
        format: uuid
      participant_id:
        type: string
        format: uuid
      ttl_secs:
        type: integer
        minimum: 30
        maximum: 3600
    required:
    - room_id
    additionalProperties: false
  output_schema:
    type: object
    properties:
      url:
        type: string
      token:
        type: string
      token_id:
        type: string
        format: uuid
      participant_id:
        type: string
        format: uuid
      expires_at:
        type: integer
- name: whep.endpoint
  access: write
  risk: dangerous
  input_schema:
    type: object
    properties:
      room_id:
        type: string
        format: uuid
      participant_id:
        type: string
        format: uuid
      source:
        type: string
        format: uuid
      ttl_secs:
        type: integer
        minimum: 30
        maximum: 3600
    required:
    - room_id
    additionalProperties: false
  output_schema:
    type: object
    properties:
      url:
        type: string
      token:
        type: string
      token_id:
        type: string
        format: uuid
      participant_id:
        type: string
        format: uuid
      expires_at:
        type: integer
- name: track.route
  access: write
  risk: normal
  input_schema:
    type: object
    properties:
      room_id:
        type: string
        format: uuid
      mode:
        enum:
        - sfu
        - relay
    required:
    - room_id
    - mode
    additionalProperties: false
  output_schema:
    type: object
    properties:
      room_id:
        type: string
        format: uuid
      mode:
        type: string
- name: recording.start
  access: write
  risk: dangerous
  input_schema:
    type: object
    properties:
      room_id:
        type: string
        format: uuid
    required:
    - room_id
    additionalProperties: false
  output_schema:
    type: object
    properties:
      room_id:
        type: string
        format: uuid
      recording_id:
        type: string
        format: uuid
      object_key:
        type: string
      state:
        type: string
- name: token.revoke_all
  access: write
  risk: dangerous
  input_schema:
    type: object
    properties:
      room_id:
        type: string
        format: uuid
    required:
    - room_id
    additionalProperties: false
  output_schema:
    type: object
    properties:
      room_id:
        type: string
        format: uuid
      epoch:
        type: integer
  required_scope: community:admin
- name: admin.verify
  access: read
  risk: normal
  input_schema:
    type: object
    properties: {}
    required: []
    additionalProperties: false
  output_schema:
    type: object
    properties:
      verified:
        type: boolean
  required_scope: community:admin
- name: recording.stop
  access: write
  risk: normal
  input_schema:
    type: object
    properties:
      room_id:
        type: string
        format: uuid
    required:
    - room_id
    additionalProperties: false
  output_schema:
    type: object
    properties:
      room_id:
        type: string
        format: uuid
      recording_id:
        type: string
        format: uuid
      object_key:
        type: string
      state:
        type: string
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: 1.0.0
  min_version: 1.0.0
  max_version: null

schema_version: 2
app_id: waddles.core.service.twitch
name: Twitch Platform Connector (Rust)
version: 1.1.0
feature: waddles.core.service
module: core
provider: builtin
language: rust
artifact: prebuilt
execution_model: native
is_default: false
kind: service
stages:
  action:
    entry: waddle:bundle/tool-provider#call
egress:
- host: api.twitch.tv
  methods:
  - GET
  - POST
  - DELETE
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
- id: net.http.fqdn:api.twitch.tv
  justification: Helix read tools and host-templated chat/whisper/delete requests;
    credentials are host-injected secret refs
  params:
    methods:
    - GET
    - POST
    - DELETE
- id: chat.send:twitch
  justification: Template Twitch chat messages; the host pins the channel and substitutes
    the credential
- id: dm.send:twitch
  justification: Template Twitch whispers; the host substitutes the sender id and
    credential
- id: chat.delete:twitch
  justification: Template Twitch chat message deletion in the host-pinned channel
- id: chat.clear:twitch
  justification: Clear the whole chat of the host-pinned channel (moderator-scoped Helix
    call); admin-approved dangerous grant
- id: moderation.twitch
  justification: Chat deletion is a moderation action; admin-approved dangerous grant,
    host-pinned channel and moderator
- id: eventsub.manage:twitch
  justification: Template EventSub subscription create/delete/list with the host-held
    APP credential; the broadcaster, callback and secret are host slots, never bundle input
- id: connector.pii.read
  justification: Gates identity.lookup, used to resolve the actor to its canonical UUID
    and the read-tool users; first-party core only, dangerous, global-admin-approved
- id: flags.read
  justification: Reads the waddles.connector-twitch cutover flag (default OFF) as the
    connector's defence-in-depth gate; without it the gate always reads OFF
- id: platform.log
  justification: Bounded, PII-free lifecycle diagnostics (op and count only, debug
    level); the host drops guest text and keeps only level and size
routes_to: []
exported_tools:
- name: get_chatters
  access: read
  risk: normal
  input_schema:
    type: object
    properties:
      first: &id001
        type: integer
        minimum: 1
        maximum: 1000
      after: &id002
        type: string
        maxLength: 512
    required: []
    additionalProperties: false
  output_schema:
    type: object
- name: get_followers
  access: read
  risk: normal
  input_schema:
    type: object
    properties:
      first: *id001
      after: *id002
    required: []
    additionalProperties: false
  output_schema:
    type: object
- name: get_subscriptions
  access: read
  risk: normal
  input_schema:
    type: object
    properties:
      first: *id001
      after: *id002
    required: []
    additionalProperties: false
  output_schema:
    type: object
- name: twitch.moderation.ban
  access: write
  risk: dangerous
  required_scope: community:moderate
  input_schema:
    type: object
    properties:
      user:
        type: string
        format: uuid
      reason:
        type: string
        maxLength: 500
    required:
    - user
    additionalProperties: false
  output_schema:
    type: object
  host_op:
    platform: twitch
    op: mod.ban
    user: user
    text_object:
      reason: reason
    required:
    - user
    origin: channel
- name: twitch.moderation.timeout
  access: write
  risk: dangerous
  required_scope: community:moderate
  input_schema:
    type: object
    properties:
      user:
        type: string
        format: uuid
      duration:
        type: integer
        minimum: 1
        maximum: 1209600
      reason:
        type: string
        maxLength: 500
    required:
    - user
    - duration
    additionalProperties: false
  output_schema:
    type: object
  host_op:
    platform: twitch
    op: mod.timeout
    user: user
    text_object:
      duration: duration
      reason: reason
    required:
    - user
    - duration
    origin: channel
- name: twitch.moderation.unban
  access: write
  risk: dangerous
  required_scope: community:moderate
  input_schema:
    type: object
    properties:
      user:
        type: string
        format: uuid
    required:
    - user
    additionalProperties: false
  output_schema:
    type: object
  host_op:
    platform: twitch
    op: mod.unban
    user: user
    required:
    - user
    origin: channel
- name: twitch.moderation.delete_message
  access: write
  risk: dangerous
  required_scope: community:moderate
  input_schema:
    type: object
    properties:
      message_id:
        type: string
        maxLength: 64
    required:
    - message_id
    additionalProperties: false
  output_schema:
    type: object
  host_op:
    platform: twitch
    op: chat.delete
    message_id: message_id
    required:
    - message_id
    origin: channel
- name: twitch.chat.clear
  access: write
  risk: dangerous
  required_scope: community:moderate
  input_schema:
    type: object
    properties: {}
    additionalProperties: false
  output_schema:
    type: object
  host_op:
    platform: twitch
    op: chat.clear
    origin: channel
author: github:penguintechinc
license: AGPL-3.0-or-later
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/rust/twitch
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: 1.0.0
  min_version: 1.0.0
  max_version: null

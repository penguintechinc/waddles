schema_version: 2
app_id: waddles.core.service.twitch
name: Twitch Platform Overlay (Rust)
version: 1.0.0
feature: waddles.core.service
module: core
provider: builtin
language: rust
artifact: prebuilt
execution_model: native
is_default: false
kind: service
stages:
  action:
    entry: waddle:bundle/tool-provider#call
egress:
- host: api.twitch.tv
  methods:
  - GET
  - POST
  - DELETE
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
- id: net.http.fqdn:api.twitch.tv
  justification: Helix read tools and host-templated chat/whisper/delete requests;
    credentials are host-injected secret refs
  params:
    methods:
    - GET
    - POST
    - DELETE
- id: chat.send:twitch
  justification: Template Twitch chat messages; the host pins the channel and substitutes
    the credential
- id: dm.send:twitch
  justification: Template Twitch whispers; the host substitutes the sender id and
    credential
- id: chat.delete:twitch
  justification: Template Twitch chat message deletion in the host-pinned channel
- id: moderation.twitch
  justification: Chat deletion is a moderation action; admin-approved dangerous grant,
    host-pinned channel and moderator
# BLOCKED ON CATALOG: `connector.pii.read` (dangerous, core-only; gates identity.lookup, used to
# resolve the actor to its canonical UUID and the read-tool users) is not yet a member of
# hub_api/services/bundle_permission_catalog.py, so the V2 validator rejects it
# (`unknown_permission`). Integrator: add it to the catalog, then add the permission entry
# (id: connector.pii.read, justification: ...) to `permissions:` above. Until then identity.lookup is
# denied and on-frame fails LOUD (event dropped, no raw handle).
routes_to: []
exported_tools:
- name: get_chatters
  access: read
  risk: normal
  input_schema:
    type: object
    properties:
      first: &id001
        type: integer
        minimum: 1
        maximum: 1000
      after: &id002
        type: string
        maxLength: 512
    required: []
    additionalProperties: false
  output_schema:
    type: object
- name: get_followers
  access: read
  risk: normal
  input_schema:
    type: object
    properties:
      first: *id001
      after: *id002
    required: []
    additionalProperties: false
  output_schema:
    type: object
- name: get_subscriptions
  access: read
  risk: normal
  input_schema:
    type: object
    properties:
      first: *id001
      after: *id002
    required: []
    additionalProperties: false
  output_schema:
    type: object
author: PenguinTech/waddles
license: AGPL-3.0-or-later
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/rust/twitch
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: 1.0.0
  min_version: 1.0.0
  max_version: null

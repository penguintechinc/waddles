[package]
name = "waddle-bundle-wix-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "AGPL-3.0-or-later"
publish = false
description = "Wix webhook connector service bundle: an inbound-only `kind: service` connector on the `connector-tools` world (no tools exported). The host verifies the RS256 webhook JWT against the connection's app public key (svc-ingest `Scheme::WixJwt`); this component only maps the VERIFIED event envelope into normalized member/subscription/event records, tokenizing the Wix member id through identity.lookup. No egress, no sender."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen-rt = { version = "=0.44.0", features = ["bitflags"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[package.metadata.component]
package = "waddle:bundle-wix-service"

[package.metadata.component.target]
path = "../../../wit/waddle-connector"
world = "connector-tools"

[package.metadata.component.dependencies]

[package.metadata.component.target.dependencies]
"waddle:bundle" = { path = "../../../wit/waddle-connector/deps/waddle-bundle" }

[profile.release]
opt-level = "s"
lto = true
strip = true

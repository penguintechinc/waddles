# hub-api install-pipeline manifest (schema_version 2) for the Discord platform CONNECTOR.
# NOT the app bundle bundles/python/discord (waddles.core.example.discord) -- this is the
# connector-tools `kind: service` connector (P6b T2). Cutover flag: waddles.connector-discord
# (PostHog, default OFF); while OFF the hardcoded svc_ingest Discord path runs unchanged.
# No secrets here: the bot token is a host-side connection resolved by opaque handle
# `discord-bot` (see README "Secrets"). Transports (Gateway WS, interactions webhook route +
# Ed25519 verify) are HOST configuration, not manifest fields.
schema_version: 2
app_id: waddles.core.service.discord
name: Discord Platform Connector (Rust)
version: 1.0.6
feature: waddles.core.service
module: core
provider: builtin
language: rust
artifact: component
execution_model: wasi-component
is_default: false
kind: service
stages:
  action:
    entry: waddle:bundle/tool-provider#call
egress:
  - host: discord.com
    methods: ["GET"]
  - host: gateway.discord.gg
    methods: ["GET"]
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
  - id: net.http.fqdn:discord.com
    justification: "read-only guild + member lookups (GET /guilds/{id}, /guilds/{id}/members/{id}) to derive is_mod/is_broadcaster; the bot token is a secret-ref, never in the component. Sends/deletes/role ops are host-executed templates, not guest http."
    params:
      methods: ["GET"]
  - id: net.http.fqdn:gateway.discord.gg
    justification: "declares the Gateway WebSocket upgrade host the HOST transport connects to for this connector; the guest never calls it"
    params:
      methods: ["GET"]
  - id: connector.pii.read
    justification: "gates identity.lookup, used to tokenize the actor to its canonical UUID; first-party core only, dangerous, global-admin-approved (no raw-handle fallback: a failed lookup fails the frame)"
  - id: platform.log
    justification: "bounded, PII-free lifecycle and fail-closed warnings (community/op/class only)"
routes_to: []
exported_tools:
  - name: classify_frame
    access: read
    risk: normal
    input_schema:
      type: object
      properties:
        frame:
          type: object
      required:
        - frame
      additionalProperties: false
    output_schema:
      type: object
  - name: classify_close_code
    access: read
    risk: normal
    input_schema:
      type: object
      properties:
        code:
          type: integer
          minimum: 0
          maximum: 65535
      required:
        - code
      additionalProperties: false
    output_schema:
      type: object
  - name: discord.scheduled_event.create
    access: write
    risk: dangerous
    input_schema:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        scheduled_start_time:
          type: string
          description: RFC 3339 timestamp
        scheduled_end_time:
          type: string
          description: RFC 3339 timestamp
        location:
          type: string
          minLength: 1
          maxLength: 100
      required:
        - name
        - scheduled_start_time
        - scheduled_end_time
        - location
      additionalProperties: false
    output_schema:
      type: object
  - name: discord.scheduled_event.update
    access: write
    risk: dangerous
    input_schema:
      type: object
      properties:
        event_id:
          type: string
          pattern: "^[0-9]{1,20}$"
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        scheduled_start_time:
          type: string
          description: RFC 3339 timestamp
        scheduled_end_time:
          type: string
          description: RFC 3339 timestamp
        location:
          type: string
          minLength: 1
          maxLength: 100
      required:
        - event_id
        - name
        - scheduled_start_time
        - scheduled_end_time
        - location
      additionalProperties: false
    output_schema:
      type: object
  - name: discord.scheduled_event.cancel
    access: write
    risk: dangerous
    input_schema:
      type: object
      properties:
        event_id:
          type: string
          pattern: "^[0-9]{1,20}$"
      required:
        - event_id
      additionalProperties: false
    output_schema:
      type: object
  - name: discord.scheduled_event.delete
    access: write
    risk: dangerous
    input_schema:
      type: object
      properties:
        event_id:
          type: string
          pattern: "^[0-9]{1,20}$"
      required:
        - event_id
      additionalProperties: false
    output_schema:
      type: object
  - name: discord.member.roles.add
    access: write
    risk: dangerous
    input_schema:
      type: object
      properties:
        user:
          type: string
          format: uuid
        role_key:
          type: string
          pattern: "^[a-z][a-z0-9_-]{0,31}$"
      required:
        - user
        - role_key
      additionalProperties: false
    output_schema:
      type: object
  - name: discord.member.roles.remove
    access: write
    risk: dangerous
    input_schema:
      type: object
      properties:
        user:
          type: string
          format: uuid
        role_key:
          type: string
          pattern: "^[a-z][a-z0-9_-]{0,31}$"
      required:
        - user
        - role_key
      additionalProperties: false
    output_schema:
      type: object
  - name: discord.member.roles.set
    access: write
    risk: dangerous
    input_schema:
      type: object
      properties:
        user:
          type: string
          format: uuid
        role_keys:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: string
            pattern: "^[a-z][a-z0-9_-]{0,31}$"
      required:
        - user
        - role_keys
      additionalProperties: false
    output_schema:
      type: object
  - name: discord.roles.list
    access: read
    risk: normal
    input_schema:
      type: object
      properties: {}
      additionalProperties: false
    output_schema:
      type: object
      properties:
        roles:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              assignable:
                type: boolean
author: PenguinTech/waddles
license: AGPL-3.0-or-later
source_url: https://github.com/penguintechinc/waddles/tree/main/bundles/rust/discord
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: 1.0.0
  min_version: 1.0.0
  max_version: null

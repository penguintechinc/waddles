  # Batch 1 of 11 example Python app bundles (2026-10-06, feature/bundle-batch1-registration):
  # kv-only minigames/utilities built post-#638 (SDK kv-key charset validation), no DB
  # migrations. Each gates its own reply behind a `waddles.command-<name>` PostHog flag
  # (default OFF) inside `transform()`, same pattern as eightball/roll/lurk/count above --
  # this catalog entry only installs the bundle, it does not make it respond.
  #
  # rps/coinflip/music originally built kv keys with a `:` separator (e.g.
  # `"rps:wins:<hash>"`, `"music:queue"`) -- the same gh-631 class of bug fixed for count/lurk
  # (see those entries' own comments): `community_kv._scoped_key()` prefixes every key with
  # `c.<community_id>.`, so a `:` anywhere in the bundle's own key suffix produces a final key
  # the real `kv` host capability rejects (`:` is its reserved namespace separator). All three
  # bundles' own test suites proved this out (26/106 rps tests and equivalent coinflip tests
  # failed with `InvalidKvKeyError` before the fix); re-keyed to `.`-separated
  # (`"rps.wins.<hash>"`, `"music.queue"`) before registration here, matching
  # `count`'s own `"count.registry"` convention. Fixed in this PR, not on the source branches.
  - app_id: waddles.core.example.rps

  # older world missing the `flags` WIT import, so feature_enabled() crashes/degrades at
  # runtime and the bundle never replies; current source compiles correctly WITH the import.
  # app_versions enforces an immutable digest per (app_id, version), so re-seeding 1.0.0 with
  # the recompiled bytes 409s as digest_conflict -- and the seeder's #582 resilience change
  # treats that as a non-fatal SKIP, leaving the stale pre-flags wasm active instead of
  # failing loudly. 1.0.1 is the first version built from the flags-enabled source, forcing a
  # fresh publish+activate. Mirrors bundles/csharp/csping/hub-manifest.yaml's own 1.0.0/1.0.1

# Catalog of first-party waddles.core.* App Bundles the core-bundle-seeder
# (hub_api/cli/seed_core_bundles.py) activates at deploy time, under the platform's SYSTEM
# identity -- no human global-admin approval (that stays reserved for third-party vendor
# bundles, services/vendor_bundle_authz.py::CORE_NAMESPACE_PREFIX).
#
# `manifest_path`/`artifact_path` are resolved relative to this file's own directory --
# bundles/Dockerfile.core-bundles flattens every built artifact + its hub-api manifest into
# `/core-bundles/` alongside a copy of this file, so the same relative paths work unchanged
# in the built image and in a local checkout (CORE_BUNDLES_DIR env var points the seeder at
# either).
#
# `activation_targets` is the default target list; CORE_BUNDLES_TENANT_SLUGS (env, comma
# separated) overrides it for every bundle in this file with a tenant-wide activation per
# listed slug, for a deployment that needs a different tenant list than the one below.
#
# `platform_connections` registers `ingest_sources` rows BEFORE any bundle above activates, so
# auto-bind (app_source_binding_service.sync_bindings()) has a matching row to grant a
# `consumes` rule against on the bundle's very first activation. This list is static/baked
# into the seeder image -- empty here since every connection this repo knows about today (e.g.
# svc-ingest's alpha Discord guild) is deploy-specific, never a fixed value safe to bake into a
# shared image; it is added at deploy time via the CORE_BUNDLES_PLATFORM_CONNECTIONS env var
# (a JSON array of this exact object shape), which the Helm chart populates from the SAME
# values already wired to svc-ingest (see k8s/helm/waddlebot/templates/core-bundle-seeder-
# job.yaml) -- never hardcoded here or in Python. NO credentials/tokens are ever stored by this
# step; the platform's own client (e.g. svc-ingest's Discord bot token) authenticates
# independently (services/ingest_source_service.py::ensure_ingest_source()'s own docstring).
#
# Object shape (one entry): {tenant_slug, platform, source_id, label, community_id (optional,
# null = tenant-wide)}.
platform_connections: []

bundles:
  # 1.0.0 AND 1.0.1 are permanently retired -- fix/reproducible-core-bundles. app_versions is
  # immutable per (app_id, version); see bundles/rust/ping/hub-manifest.yaml's own comment for
  # the full story (1.0.1's build was never actually proven byte-reproducible -- no CI gate
  # existed, and it depended on an unpinned on-demand rustup target install). 1.0.2 was the
  # first version built with the wasm32-wasip1 preinstall fix and a CI-enforced two-build
  # byte-identity gate (.github/workflows/core-bundles-reproducible.yml).
  #
  # 1.0.3 (fix/seeder-activate-tenant-wide, alpha 2026-10-02): adds a `discord` consumes rule
  # (hub-manifest.yaml's own comment) -- 1.0.2's manifest never declared it, so this bundle
  # would never auto-bind to alpha's real Discord ingest source even with tenant-wide
  # activation fixed. app_versions.artifact_digest is immutable AND globally UNIQUE (migration
  # 0022) -- a manifest-only change can never reuse 1.0.2's digest under a new version string,
  # so Cargo.toml's own crate `[package] version` was also bumped (0.1.0 -> 0.1.1, see its own
  # comment) purely to force cargo-component to embed a different package-version string in
  # the rebuilt component, producing new bytes. NOT verified byte-level in this change (no
  # wasm32-wasip1/cargo-component toolchain available to the agent that made this edit) --
  # .github/workflows/core-bundles-reproducible.yml's two-build identity check proves 1.0.3 is
  # reproducible against ITSELF, not that it differs from 1.0.2; if it does not,
  # app_versions.artifact_digest's own UNIQUE constraint rejects the INSERT outright (a raw
  # IntegrityError, caught by seed_core_bundles.py::_run()'s generic exception handler --
  # logged with type+message, nonzero exit, never a silent success with stale manifest_json).
  - app_id: waddles.core.example.ping
    version: "1.0.3"
    language: rust
    manifest_path: ping.manifest.yaml
    artifact_path: ping.wasm
    activation_targets:
      - tenant_slug: global
        community_id: null
  - app_id: waddles.core.example.pyping
    version: "1.0.0"
    language: python
    manifest_path: pyping.manifest.yaml
    artifact_path: pyping.wasm
    activation_targets:
      - tenant_slug: global
        community_id: null
  # C#-toolchain feasibility spike (spec
  # docs/superpowers/specs/2026-09-14-rust-data-plane-design.md S18 R13 / D35). Built by
  # bundles/Dockerfile.core-bundles's csharp-bundle-builder stage; NOT covered by the
  # byte-reproducible gate (scripts/verify-core-bundles-reproducible.sh) -- same status as
  # pyping, see that script's own comment.
  # 1.0.0 is permanently retired -- fix/csping-version-bump. alpha's app_versions already has
  # a 1.0.0 row published from the pre-#573 Dockerfile.core-bundles (missing the
  # `COPY sdk/waddle-sdk-cs` layer this bundle depends on); #573's fix changed the compiled
  # csping.wasm for the same nominal version, and app_versions enforces an immutable digest
  # per (app_id, version), so re-seeding 1.0.0 now 409s as digest_conflict. 1.0.1 is the first
  # version built from the corrected Dockerfile. Mirrors
  # bundles/rust/ping/hub-manifest.yaml's own 1.0.0/1.0.1 retirement comment.
  - app_id: waddles.core.example.csping
    version: "1.0.1"
    language: csharp
    manifest_path: csping.manifest.yaml
    artifact_path: csping.wasm
    activation_targets:
      - tenant_slug: global
        community_id: null
  # Batch 1 of first-party Python command bundles (2026-10-03, token-safe set -- relay/kv
  # only, no handle echoed back, so these ship ahead of the PII-tokenization pipeline
  # #427/#429). Each declares its own PostHog flag (waddles.command-<name>, defaulted OFF
  # per critical-rules.md Feature Flags) inside `transform()` via
  # waddle_sdk.flask_core.feature_flags.feature_enabled -- a tenant-wide activation here
  # only installs the bundle, it does not itself make the bundle respond; the flag must
  # also be turned on in PostHog before any of these four produce a reply.
  - app_id: waddles.core.example.eightball
    version: "1.0.0"
    language: python
    manifest_path: eightball.manifest.yaml
    artifact_path: eightball.wasm
    activation_targets:
      - tenant_slug: global
        community_id: null
  - app_id: waddles.core.example.roll
    version: "1.0.0"
    language: python
    manifest_path: roll.manifest.yaml
    artifact_path: roll.wasm
    activation_targets:
      - tenant_slug: global
        community_id: null
  # First Python core bundles to declare the `storage.kv` permission (lurk, count) --
  # see hub_api/services/bundle_approval_service.py::KV_PERMISSION_ID.
  - app_id: waddles.core.example.lurk
    version: "1.0.0"
    language: python
    manifest_path: lurk.manifest.yaml
    artifact_path: lurk.wasm
    activation_targets:
      - tenant_slug: global
        community_id: null
  - app_id: waddles.core.example.count
    version: "1.0.0"
    language: python
    manifest_path: count.manifest.yaml
    artifact_path: count.wasm
    activation_targets:
      - tenant_slug: global
        community_id: null

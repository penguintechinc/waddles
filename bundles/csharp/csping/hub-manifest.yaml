# hub-api install-pipeline manifest (bundle_manifest_v2 schema, schema_version 2) for
# waddles.core.example.csping -- see bundles/rust/ping/hub-manifest.yaml's own header for why
# this is a separate file from this bundle's `bundle.yaml` (a different consumer's schema: M2a
# install-hooks, which understands only `artifact: source|prebuilt`, vs. `bundle.yaml`'s
# M1/M1.5 bundle-compiler/SDK schema).
#
# csping is the C#-toolchain feasibility spike (spec
# docs/superpowers/specs/2026-09-14-rust-data-plane-design.md S18 R13 / D35) -- see
# bundles/csharp/csping/README.md. First version, no prior burned-slot history like ping's
# 1.0.0/1.0.1 (bundles/rust/ping/hub-manifest.yaml's own comment) -- and unlike that gate,
# csping's build is NOT currently proven byte-reproducible (componentize-dotnet/NativeAOT-LLVM
# is a from-scratch spike, not yet run through two independent --no-cache builds), so it is
# intentionally excluded from scripts/verify-core-bundles-reproducible.sh's byte-identity gate,
# the same way waddles.core.example.pyping is -- see that script's own comment and
# bundles/Dockerfile.core-bundles's csharp-bundle-builder stage comment.
schema_version: 2
app_id: waddles.core.example.csping
name: Ping Example Bundle (C#)
version: 1.0.0
feature: waddles.core.example
module: core
provider: builtin
language: csharp
artifact: prebuilt
execution_model: native
is_default: false
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!csping"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!csping"]
  action:
    entry: "waddle:bundle/action-stage#dispatch"
egress: []
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions: []
routes_to: []

stages:
  process:
    entry: waddle:bundle/process-stage#transform
    consumes:
    - platform: twitch
      event_types:
      - chat.message
      filters:
        command_prefix:
        - '!race'
        - '!racing'
        - '!kart'
        - '!grandprix'
    - platform: discord
      event_types:
      - chat.message
      filters:
        command_prefix:
        - '!race'
        - '!racing'
        - '!kart'
        - '!grandprix'
  action:
    entry: waddle:bundle/action-stage#dispatch
egress: []
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
- id: storage.kv
  justification: the race window (record, roster slots, atomic grid counter, frozen result, per-racer payout
    progress), the per-user 5 s cooldown, the per-event join replay record, the TickScheduler board
    for the join-window deadline and the once-a-day widget-registered marker
- id: identity.resolve
  justification: resolve the invoking actor to a community user uuid (uuid-only, no
    names)
- id: chat.send:discord
  justification: replies to the invoking user/channel via the relay host import (relay.push
    -> chat.send:discord)
- id: chat.send:twitch
  justification: replies to the invoking user/channel via the relay host import (relay.push
    -> chat.send:twitch)
- id: tool.call:waddles.core.service.economy:points_view
  justification: Use the economy service points_view contract; the app owns only game
    rules
  params:
    write: false
- id: tool.call:waddles.core.service.economy:get_balance
  justification: Use the economy service get_balance contract; the app owns only game
    rules
  params:
    write: false
- id: tool.call:waddles.core.service.economy:adjust_balance
  justification: Credit the pot to the finishers (or refund a voided window) through the economy
    service adjust_balance contract with deterministic per-race idempotency keys; the app owns only game rules
  params:
    write: true
- id: economy.wager
  justification: App-owned game wagering and maximum-bet policy; each join debits the
    stake with one atomic wager(stake, 0) (the pot is paid later by the settlement)
  params:
    max_bet: 500
- id: overlay.media
  justification: registers the Racing widget once and pushes structured envelopes (join lobby frame,
    finished-race keyframes per lane, void notice) to the overlay after the money moved; a failed
    push is logged and never reverses a payout
  params:
    mode: data
routes_to: []
requested_tools:
- tool: points_view
  access: read
  target_app_id: waddles.core.service.economy
- tool: get_balance
  access: read
  target_app_id: waddles.core.service.economy
- tool: adjust_balance
  access: write
  target_app_id: waddles.core.service.economy

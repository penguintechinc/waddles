stages:
  process:
    entry: waddle:bundle/process-stage#transform
    consumes:
    - platform: twitch
      event_types:
      - chat.message
      filters:
        command_prefix:
        - '!balloon'
    - platform: discord
      event_types:
      - chat.message
      filters:
        command_prefix:
        - '!balloon'
  action:
    entry: waddle:bundle/action-stage#dispatch
egress: []
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
- id: storage.kv
  justification: per-user cooldown (10 s), the per-event replay record (seed + stake) that
    makes a redelivered event replay the same flight, and the once-a-day widget-registered marker
- id: identity.resolve
  justification: resolve the invoking actor to a community user uuid (uuid-only, no
    names)
- id: chat.send:discord
  justification: replies to the invoking user/channel via the relay host import (relay.push
    -> chat.send:discord)
- id: chat.send:twitch
  justification: replies to the invoking user/channel via the relay host import (relay.push
    -> chat.send:twitch)
- id: tool.call:waddles.core.service.economy:points_view
  justification: Use the economy service points_view contract; the app owns only game
    rules
  params:
    write: false
- id: tool.call:waddles.core.service.economy:get_balance
  justification: Use the economy service get_balance contract; the app owns only game
    rules
  params:
    write: false
- id: economy.wager
  justification: App-owned game wagering and maximum-bet policy, settled with the
    atomic host ledger primitive
  params:
    max_bet: 500
- id: overlay.media
  justification: registers the Balloon Ascent widget once and pushes one structured flight
    envelope (seed, hazard wave, balloon keyframes, result) to the overlay after the payout settles; a failed
    push is logged and never reverses the payout
  params:
    mode: data
routes_to: []
requested_tools:
- tool: points_view
  access: read
  target_app_id: waddles.core.service.economy
- tool: get_balance
  access: read
  target_app_id: waddles.core.service.economy

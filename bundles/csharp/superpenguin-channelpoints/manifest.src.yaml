slug: channelpoints
title: Channel Point Redemptions (SuperPenguinTV ChannelPoints)
version: 1.0.0
upstream:
  - Actions/SubActions/ChannelPoint* and the ChannelPointsCustomRewardRedemptionAdd trigger
  - Events/ChannelPointRedeemEventArgs.cs
consumes:
  - platform: twitch
    event_types: [channel.channel_points_custom_reward_redemption.add]
  - platform: twitch
    event_types: [chat.message]
    filters:
      command_prefix: ['!redeem']
  - platform: discord
    event_types: [chat.message]
    filters:
      command_prefix: ['!redeem']
permissions:
  - id: storage.kv
    justification: reward-to-action mapping table, per-redemption outcome record (replay safety) and ignored-redemption counters
  - id: identity.resolve
    justification: resolve the redeeming actor to a community user uuid (uuid-only, no names)
  - id: chat.send:discord
    justification: management replies via the relay host import (relay.push -> chat.send:discord)
  - id: chat.send:twitch
    justification: management replies and redemption chat messages via the relay host import (relay.push -> chat.send:twitch)
  - id: tool.call:waddles.core.service.economy:points_view
    justification: Use the economy service points_view contract for the currency alias; the app owns only redemption policy
    params:
      write: false
  - id: tool.call:waddles.core.service.economy:adjust_balance
    justification: Use the economy service adjust_balance contract to credit award steps; the service owns caps and idempotency
    params:
      write: true
  - id: overlay.media
    justification: push the redemption alert to the community's alert-box overlay (no media is fetched or generated)
    params:
      allowed_hosts:
        - overlay.penguincloud.io
      max_duration_seconds: 15
requested_tools:
  - tool: points_view
    access: read
    target_app_id: waddles.core.service.economy
  - tool: adjust_balance
    access: write
    target_app_id: waddles.core.service.economy
overlay_origins:
  index.html: "PenguinTwitchBot/wwwroot/alerts.html (layout idea only; page rewritten for this bundle)"
  redeem.css: "PenguinTwitchBot/wwwroot/alerts.html (transparent-body/status-pill idea only; rules rewritten)"
  redeem.js: original

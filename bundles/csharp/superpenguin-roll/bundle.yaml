# No Waddles-native dice/roll feature exists at time of writing -- omitted
# rather than pointing `alternative_to` at a non-existent app_id.
# -----------------------------------------------------------------------------
stages:
  process:
    entry: "waddle:bundle/process-stage#transform"
    consumes:
      - platform: twitch
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!roll", "!dice"]
      - platform: discord
        event_types: ["chat.message"]
        filters:
          command_prefix: ["!roll", "!dice"]
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: "waddle:bundle/action-stage#dispatch"
    config: {}
    spec:
      required_config: []
egress: []
# No `data.tables` -- the ported cooldown uses `kv` only (host `kv`/`db` are
# currently hardcoded to deny every call in svc-process/svc-action while the
# real backend lands; the SDK's `CooldownGuard` degrades gracefully when
# denied, see sdk/waddle-sdk-cs/README.md "kv/db availability").
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions: []
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: "1.0.0"
  min_version: "1.0.0"
  max_version: null

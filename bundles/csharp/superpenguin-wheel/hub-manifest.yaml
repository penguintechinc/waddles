stages:
  process:
    entry: waddle:bundle/process-stage#transform
    consumes:
    - platform: twitch
      event_types:
      - chat.message
      filters:
        command_prefix:
        - '!wheel'
    - platform: discord
      event_types:
      - chat.message
      filters:
        command_prefix:
        - '!wheel'
  action:
    entry: waddle:bundle/action-stage#dispatch
egress: []
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
- id: storage.kv
  justification: wheel definitions, the wheel on screen, the recorded spin outcome (replay-safe) and the
    viewer-wheel signup list
- id: identity.resolve
  justification: resolve the invoking actor to a community user uuid (uuid-only, no names) for spin replay
    keys and viewer-wheel entries
- id: chat.send:discord
  justification: replies to the invoking user/channel via the relay host import (relay.push -> chat.send:discord)
- id: chat.send:twitch
  justification: replies to the invoking user/channel via the relay host import (relay.push -> chat.send:twitch)
- id: overlay.media
  justification: pushes wheel show/spin/hide messages (alert-box surface, superpenguin.wheel.* types)
    to the community browser-source overlay
  params:
    allowed_hosts:
    - overlay.penguincloud.io
    max_duration_seconds: 15
routes_to: []
requested_tools: []
collection: superpenguintv

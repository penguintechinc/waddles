slug: giveaway
title: Ticket Giveaway and Raffle (SuperPenguinTV GiveawayFeature)
version: 1.0.0
upstream:
  - Features/GiveawayFeature.cs
  - Features/GiveawayFairnessReport.cs
  - TicketGames/RaffleRuntimeService.cs
consumes:
  - platform: twitch
    event_types: [chat.message]
    filters:
      command_prefix: ['!tgw', '!ticketgiveaway']
  - platform: discord
    event_types: [chat.message]
    filters:
      command_prefix: ['!tgw', '!ticketgiveaway']
permissions:
  - id: storage.kv
    justification: sharded entry pool, round state with the private draw seed, exclusions, winner log, audit record, raffles and per-event outcome records
  - id: identity.resolve
    justification: resolve the invoking actor and mentioned users to community user uuids (uuid-only, no names)
  - id: chat.send:discord
    justification: replies to the invoking user/channel via the relay host import (relay.push -> chat.send:discord)
  - id: chat.send:twitch
    justification: replies to the invoking user/channel via the relay host import (relay.push -> chat.send:twitch)
  - id: tool.call:waddles.core.service.economy:points_view
    justification: Use the economy service points_view contract for the currency alias and the max-entry balance; the app owns only giveaway policy
    params:
      write: false
  - id: tool.call:waddles.core.service.economy:adjust_balance
    justification: Use the economy service adjust_balance contract to charge entries and pay raffle winners; the service owns caps and idempotency
    params:
      write: true
  - id: overlay.media
    justification: Optional (moderator opt-in) giveaway/raffle alert-box messages for the browser-source overlay; a refused push fails the command loudly
    params:
      allowed_hosts: [overlay.penguincloud.io]
      max_duration_seconds: 15
requested_tools:
  - tool: points_view
    access: read
    target_app_id: waddles.core.service.economy
  - tool: adjust_balance
    access: write
    target_app_id: waddles.core.service.economy
overlay_origins:
  index.html: original
  giveaway.js: original

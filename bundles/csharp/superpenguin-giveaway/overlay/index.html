<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giveaway overlay</title>
  <style>
    :root { --bg: rgba(18, 18, 28, 0.88); --fg: #f5f5fa; --accent: #ffc93c; --muted: #b8b8c8; }
    html, body { margin: 0; height: 100%; background: transparent; font-family: system-ui, "Segoe UI", sans-serif; overflow: hidden; }
    #card {
      position: fixed; left: 50%; top: 12%; transform: translate(-50%, -20px); opacity: 0; min-width: 420px; max-width: 80vw;
      padding: 24px 36px; border-radius: 16px; background: var(--bg); color: var(--fg); text-align: center;
      border: 2px solid var(--accent); transition: opacity 0.4s ease, transform 0.4s ease;
    }
    #card.visible { opacity: 1; transform: translate(-50%, 0); }
    #title { font-size: 2.2rem; font-weight: 800; color: var(--accent); margin: 0 0 8px; }
    #line1 { font-size: 1.6rem; margin: 4px 0; }
    #line2 { font-size: 1.05rem; color: var(--muted); margin: 4px 0; word-break: break-all; }
    @media (prefers-reduced-motion: reduce) { #card { transition: none; } }
    #status { position: fixed; right: 8px; bottom: 6px; font-size: 0.7rem; color: var(--muted); opacity: 0.7; }
  </style>
</head>
<body>
  <div id="card" role="status" aria-live="polite">
    <p id="title"></p>
    <p id="line1"></p>
    <p id="line2"></p>
  </div>
  <div id="status"></div>
  <script src="giveaway.js"></script>
</body>
</html>

stages:
  process:
    entry: waddle:bundle/process-stage#transform
    consumes:
    - platform: twitch
      event_types:
      - chat.message
      filters:
        command_prefix:
        - '!ffa'
    - platform: discord
      event_types:
      - chat.message
      filters:
        command_prefix:
        - '!ffa'
  action:
    entry: waddle:bundle/action-stage#dispatch
egress: []
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
- id: storage.kv
  justification: the open game record, per-entrant slot claims and entries, the settle claim, the post-game cooldown, the expiry schedule and the per-event money plan that makes a redelivered event move money once
- id: identity.resolve
  justification: resolve the invoking actor to community user uuids (uuid-only, no names)
- id: chat.send:discord
  justification: replies to the invoking user/channel via the relay host import (relay.push -> chat.send:discord)
- id: chat.send:twitch
  justification: replies to the invoking user/channel via the relay host import (relay.push -> chat.send:twitch)
- id: tool.call:waddles.core.service.economy:points_view
  justification: Use the economy service points_view contract; the app owns only game rules
  params:
    write: false
- id: tool.call:waddles.core.service.economy:get_balance
  justification: Use the economy service get_balance contract; the app owns only game rules
  params:
    write: false
- id: tool.call:waddles.core.service.economy:adjust_balance
  justification: Use the economy service adjust_balance contract; the app owns only game rules
  params:
    write: true
routes_to: []
requested_tools:
- tool: points_view
  access: read
  target_app_id: waddles.core.service.economy
- tool: get_balance
  access: read
  target_app_id: waddles.core.service.economy
- tool: adjust_balance
  access: write
  target_app_id: waddles.core.service.economy

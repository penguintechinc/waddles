stages:
  process:
    entry: waddle:bundle/process-stage#transform
    consumes:
    - platform: twitch
      event_types:
      - chat.message
      filters:
        command_prefix:
        - '!fish'
        - '!cast'
    - platform: discord
      event_types:
      - chat.message
      filters:
        command_prefix:
        - '!fish'
        - '!cast'
    produces: []
    config: {}
    spec:
      required_config: []
  action:
    entry: waddle:bundle/action-stage#dispatch
    config: {}
    spec:
      required_config: []
egress: []
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
- id: storage.kv
  justification: per-player state (gold, inventory, catches), per-event replay records,
    cast cooldowns and locks, tournament aggregates/boards, the settlement schedule and
    lifetime leaderboards
- id: identity.resolve
  justification: resolve the invoking actor to a community user uuid (uuid-only, no
    names)
- id: chat.send:discord
  justification: replies to the invoking user/channel via the relay host import (relay.push
    -> chat.send:discord)
- id: chat.send:twitch
  justification: replies to the invoking user/channel via the relay host import (relay.push
    -> chat.send:twitch)
- id: overlay.media
  justification: register and push the fishing catch alert widget (declarative alert_box
    payload with a tokenized user uuid, never a name or HTML)
  params:
    mode: data
- id: tool.call:waddles.core.service.economy:adjust_balance
  justification: tournament point rewards only, minted through the economy service with
    a stable per-window idempotency key; the app owns all game rules
  params:
    write: true
config_schema: {}
compatible_with: []
incompatible_with: []
platform_compatibility:
  tested_with: 1.0.0
  min_version: 1.0.0
  max_version: null
requested_tools:
- tool: adjust_balance
  access: write
  target_app_id: waddles.core.service.economy

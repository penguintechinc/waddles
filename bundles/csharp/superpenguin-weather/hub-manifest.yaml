schema_version: 2
app_id: waddles.integrations.superpenguin.weather
name: Weather (SuperPenguinTV)
version: 1.0.0
feature: waddles.integrations.superpenguin
module: integrations
provider: thirdparty
language: csharp
artifact: prebuilt
execution_model: native
is_default: false
author: github/psychoboy
collection: superpenguintv
license: MIT
category: alternatives

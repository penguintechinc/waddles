stages:
  process:
    entry: waddle:bundle/process-stage#transform
    consumes:
    - platform: twitch
      event_types:
      - chat.message
      filters:
        command_prefix: &id001
        - '!weather'
    - platform: discord
      event_types:
      - chat.message
      filters:
        command_prefix: *id001
  action:
    entry: waddle:bundle/action-stage#dispatch
egress:
- host: api.weatherapi.com
  methods:
  - GET
data:
  tables: []
limits:
  timeout_ms: 5000
  memory_mb: 64
  egress_rps: 10
permissions:
- id: net.http.fqdn:api.weatherapi.com
  justification: fetches the forecast from the WeatherAPI.com HTTPS API; GET only; the API key is a host-resolved
    secret reference (WEATHER_API_KEY), never in the guest
  params:
    methods:
    - GET
- id: chat.send:discord
  justification: replies to the invoking user/channel via the relay host import (relay.push -> chat.send:discord)
- id: chat.send:twitch
  justification: replies to the invoking user/channel via the relay host import (relay.push -> chat.send:twitch)
routes_to: []
requested_tools: []

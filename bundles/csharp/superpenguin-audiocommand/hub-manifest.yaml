stages:
  process:
    entry: waddle:bundle/process-stage#transform
    consumes:
    - platform: twitch
      event_types:
      - chat.message
      filters:
        command_prefix:
        - '!sfx'
    - platform: discord
      event_types:
      - chat.message
      filters:
        command_prefix:
        - '!sfx'
  action:
    entry: waddle:bundle/action-stage#dispatch
egress: []
data:
  tables: []
limits:
  timeout_ms: 2000
  memory_mb: 64
  egress_rps: 10
permissions:
- id: storage.kv
  justification: sound registry, per-user and global cooldown claims and the per-event play record that
    makes a redelivered event re-push the same play
- id: identity.resolve
  justification: resolve the invoking actor to a community user uuid (uuid-only, no names) for the per-user
    cooldown and replay key
- id: chat.send:discord
  justification: replies to the invoking user/channel via the relay host import (relay.push -> chat.send:discord)
- id: chat.send:twitch
  justification: replies to the invoking user/channel via the relay host import (relay.push -> chat.send:twitch)
- id: overlay.media
  justification: pushes sound-play messages (alert-box surface, superpenguin.audiocommand.play) to the
    community browser-source overlay that plays the audio
  params:
    allowed_hosts:
    - overlay.penguincloud.io
    max_duration_seconds: 15
routes_to: []
requested_tools: []
collection: superpenguintv
overlay_assets:
- path: audio-overlay.js
  sha256: 6ba6aaf1799dcca5dcca39b048756adac6f62d61cf23f4d579ab1e8a7ec90536
  content_type: text/javascript
  origin: original
  license: MIT
- path: index.html
  sha256: f90cd18b0c143d0a4a8bc82ab8e674e5ec0a4774f2b0b070d5e428e6635b61cc
  content_type: text/html
  origin: original
  license: MIT
